<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO - Cyber Edition</title>
    <style>
        :root { 
            /* ألوان عصرية شبابية */
            --main-bg: #0f172a; /* كحلي داكن جداً */
            --card-bg: #1e293b; /* كحلي أخف للكروت */
            --accent-purple: linear-gradient(135deg, #818cf8, #c084fc); /* تدرج بنفسجي */
            --accent-blue: linear-gradient(135deg, #38bdf8, #818cf8); /* تدرج أزرق نيون */
            --accent-orange: linear-gradient(135deg, #fb923c, #f87171); /* تدرج برتقالي محمر */
            --accent-green: linear-gradient(135deg, #4ade80, #2dd4bf); /* تدرج أخضر فسفوري */
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --maroon-gradient: linear-gradient(135deg, #ef4444, #991b1b); /* للملاحظات */
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 10px; 
            background: var(--main-bg); color: var(--text-main); 
            display: flex; flex-direction: column; transition: 0.3s; 
        }
        
        header { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            color: #fff; padding: 12px; border-radius: 15px; margin-bottom: 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        .header-title { font-weight: 800; font-size: 1.1rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .header-tools { display: flex; align-items: center; gap: 10px; }

        .time-date-box { 
            display: flex; flex-direction: column; align-items: center; 
            background: rgba(0,0,0,0.2); padding: 5px 15px; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        #digital-clock { font-family: 'Courier New', monospace; font-weight: bold; font-size: 1rem; color: #38bdf8; }
        #info-rotator { font-size: 0.75rem; color: var(--text-dim); margin-top: 2px; }

        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #475569; }
        .status-online { background: #22c55e; box-shadow: 0 0 10px #22c55e; }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { 
            border: none; color: #fff; padding: 14px; border-radius: 12px; 
            font-size: 13px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); 
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-cloud { background: var(--accent-blue); } 
        .btn-whatsapp { background: var(--accent-purple); }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: var(--card-bg); border-radius: 18px; height: 420px; 
            border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; 
            overflow: hidden; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .overlay {
            position: absolute; top: 45px; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.3); z-index: 5; cursor: pointer;
            backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center;
        }
        .overlay::after {
            content: "CLICK x2 TO OPEN 🔓";
            background: rgba(255,255,255,0.1); color: #fff; padding: 8px 16px;
            border-radius: 12px; font-size: 10px; border: 1px solid rgba(255,255,255,0.2);
        }
        
        .h { 
            padding: 12px 18px; font-size: 14px; font-weight: bold; color: #fff;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }
        /* تدرجات مختلفة لكل قسم */
        .h-main { background: var(--accent-blue); }
        .h-money { background: var(--accent-green); }
        .h-workers { background: var(--accent-purple); }
        .h-delivery { background: var(--accent-orange); }
        .h-notes { background: var(--maroon-gradient); }
        .h-reports { background: #475569; }

        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; pointer-events: none; }
        
        .zoom-btn { 
            background: rgba(255,255,255,0.25); color: #fff; border: none; 
            padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; 
        }
        
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; }
        .card.fullscreen .overlay { display: none; }
        .card.fullscreen iframe { pointer-events: auto; }
    </style>
</head>
<body>

<header>
    <div class="header-title">
        <span id="internet-dot" class="status-dot status-online"></span>
        <span>⚡ AZEMAA PRO</span>
    </div>
    <div class="header-tools">
        <div class="time-date-box">
            <div id="digital-clock">00:00:00</div>
            <div id="info-rotator">SYSTEM ACTIVE</div>
        </div>
    </div>
</header>

<div class="sync-box">
    <button onclick="saveToCloud()" class="btn btn-cloud">☁️ Cloud Save</button>
    <button onclick="loadFromCloud()" class="btn btn-cloud">🔄 Restore</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">📤 WhatsApp Copy</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 Import Code</button>
</div>

<div class="main-container">
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-main"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ Full</button></div>
        <iframe src="zbon.html"></iframe>
    </div>
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-money"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ Full</button></div>
        <iframe src="yom.html"></iframe>
    </div>
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-workers"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ Full</button></div>
        <iframe src="gyab.html"></iframe>
    </div>
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-delivery"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ Full</button></div>
        <iframe src="tslem.html"></iframe>
    </div>
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-notes"><span>📝 الملاحظات والورشة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ Full</button></div>
        <iframe src="notmop.html"></iframe>
    </div>
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-reports"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ Full</button></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    function toggleZoom(card) {
        if (card.classList.contains('fullscreen')) {
            card.classList.remove('fullscreen');
            card.querySelector('.zoom-btn').innerText = "⛶ Full";
        } else {
            document.querySelectorAll('.card.fullscreen').forEach(c => c.classList.remove('fullscreen'));
            card.classList.add('fullscreen');
            card.querySelector('.zoom-btn').innerText = "✕ Close";
            history.pushState({view: 'full'}, "");
        }
    }

    // إدارة الوقت
    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('en-GB', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById('digital-clock').textContent = timeStr;
    }
    setInterval(updateClock, 1000); updateClock();

    window.onpopstate = () => document.querySelectorAll('.card.fullscreen').forEach(c => c.classList.remove('fullscreen'));

    // بقية دوال الحفظ والواتساب كما هي في ملفك الأصلي لضمان عمل البرمجة...
</script>

<script type="module">
    // كود الفايربيز الخاص بك هنا (نفس اللي في ملفك)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFlHpOc1M", authDomain: "farah-kitchen.firebaseapp.com", databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com", projectId: "farah-kitchen", appId: "1:702572851072:web:320a92c9430abba6b71b65" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    window.saveToCloud = async function() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { let k = localStorage.key(i); data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); }
        await set(ref(db, 'backups/azemaa_main'), data); alert("✅ Saved to Cloud");
    };
    window.loadFromCloud = async function() {
        const s = await get(child(ref(db), 'backups/azemaa_main'));
        if (s.exists()) { localStorage.clear(); const d = s.val(); for (let k in d) localStorage.setItem(k, d[k]); location.reload(); }
    };
</script>
</body>
</html>
