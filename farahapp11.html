<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO - Modern Edition</title>
    <style>
        :root { 
            /* لوحة ألوان شبابية وعصرية */
            --bg-main: #f0f2f5;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3); /* تدرج بنفسجي أزرق */
            --whatsapp-green: #25D366;
            --cloud-blue: #00a8ff;
            --card-radius: 20px;
            --text-dark: #2d3436;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 10px; background: var(--bg-main); 
            display: flex; flex-direction: column; transition: 0.3s; 
        }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 15px; 
            border-radius: var(--card-radius); text-align: center; margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.3);
        }
        header h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .btn { 
            border: none; color: #fff; padding: 14px; border-radius: 15px; 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-whatsapp { background: var(--whatsapp-green); box-shadow: 0 5px 15px rgba(37, 211, 102, 0.3); }
        .btn-cloud { background: var(--cloud-blue); box-shadow: 0 5px 15px rgba(0, 168, 255, 0.3); }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        
        .card { 
            background: #fff; border-radius: var(--card-radius); height: 400px; 
            border: none; display: flex; flex-direction: column; 
            overflow: hidden; position: relative; box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }
        
        /* الطبقة الشفافة التي تسمح برؤية المحتوى وتمنع اللمس إلا عند التكبير */
        .overlay {
            position: absolute; top: 50px; left: 0; right: 0; bottom: 0;
            background: transparent; z-index: 5; cursor: pointer;
        }
        
        .h { 
            padding: 12px 20px; font-size: 14px; font-weight: bold; color: #fff;
            display: flex; justify-content: space-between; align-items: center; z-index: 10;
        }

        /* ألوان شبابية للأشرطة العلوية */
        .h-zbon { background: #ff7675; }
        .h-yom { background: #55efc4; color: #2d3436; }
        .h-gyab { background: #a29bfe; }
        .h-tslem { background: #fab1a0; }
        .h-notmop { background: #fdcb6e; color: #2d3436; }
        .h-takarer { background: #0984e3; }

        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; pointer-events: none; }
        
        .zoom-btn { 
            background: rgba(255,255,255,0.3); color: inherit; border: none; 
            padding: 5px 12px; border-radius: 10px; font-size: 11px; cursor: pointer; font-weight: bold;
        }
        
        /* وضع التكبير الكامل */
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; }
        .card.fullscreen .overlay { display: none; }
        .card.fullscreen iframe { pointer-events: auto; }
    </style>
</head>
<body>

<header>
    <h1>🚀 AZEMAA PRO</h1>
</header>

<div class="sync-box">
    <button onclick="saveToCloud()" class="btn btn-cloud">☁️ حفظ سحابي</button>
    <button onclick="loadFromCloud()" class="btn btn-cloud">🔄 استرجاع سحابي</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتساب (نسخ)</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 استرجاع يدوي</button>
</div>

<div class="main-container">
    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-zbon"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">تكبير ⛶</button></div>
        <iframe src="zbon.html"></iframe>
    </div>

    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-yom"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">تكبير ⛶</button></div>
        <iframe src="yom.html"></iframe>
    </div>

    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-gyab"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">تكبير ⛶</button></div>
        <iframe src="gyab.html"></iframe>
    </div>

    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-tslem"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">تكبير ⛶</button></div>
        <iframe src="tslem.html"></iframe>
    </div>

    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-notmop"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">تكبير ⛶</button></div>
        <iframe src="notmop.html"></iframe>
    </div>

    <div class="card" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-takarer"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">تكبير ⛶</button></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    function toggleZoom(card) {
        if (card.classList.contains('fullscreen')) {
            card.classList.remove('fullscreen');
            card.querySelector('.zoom-btn').innerText = "تكبير ⛶";
        } else {
            document.querySelectorAll('.card.fullscreen').forEach(c => c.classList.remove('fullscreen'));
            card.classList.add('fullscreen');
            card.querySelector('.zoom-btn').innerText = "إغلاق X";
            history.pushState({view: 'full'}, "");
        }
    }

    window.onpopstate = () => document.querySelectorAll('.card.fullscreen').forEach(c => c.classList.remove('fullscreen'));

    // دوال الواتساب والحفظ اليدوي
    function generateBackupCode() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { let k = localStorage.key(i); data[k] = localStorage.getItem(k); }
        return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }

    function saveToWhatsApp() {
        window.location.href = `whatsapp://send?text=*AZ-BACKUP*\n${generateBackupCode()}`;
    }

    function loadFromWhatsApp() {
        let input = prompt("الصق الكود هنا:"); if (!input) return;
        try {
            let clean = input.includes('*AZ-BACKUP*') ? input.split('*AZ-BACKUP*\n')[1] : input;
            let obj = JSON.parse(decodeURIComponent(escape(atob(clean.trim()))));
            localStorage.clear(); for (let k in obj) localStorage.setItem(k, obj[k]);
            location.reload();
        } catch (e) { alert("❌ كود خاطئ"); }
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFlHpOc1M", authDomain: "farah-kitchen.firebaseapp.com", databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com", projectId: "farah-kitchen", appId: "1:702572851072:web:320a92c9430abba6b71b65" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);

    window.saveToCloud = async function() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { let k = localStorage.key(i); data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); }
        await set(ref(db, 'backups/azemaa_main'), data); alert("✅ تم الحفظ سحابياً");
    };
    window.loadFromCloud = async function() {
        const s = await get(child(ref(db), 'backups/azemaa_main'));
        if (s.exists()) { localStorage.clear(); const d = s.val(); for (let k in d) localStorage.setItem(k, d[k]); location.reload(); }
    };
</script>
</body>
</html>
