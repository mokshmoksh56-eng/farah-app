<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>يومية الورشة 2026 - الإصدار المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --success: #059669;
            --danger: #dc2626;
            --whatsapp: #25d366;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            line-height: 1.4;
            font-weight: 700;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary), #3b82f6);
            color: white;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        header h1 { margin: 0; font-size: 1.3rem; font-weight: 900; }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .card h3 { font-size: 0.8rem; margin: 0; color: #64748b; font-weight: 800; }
        .card .value { font-size: 1.1rem; font-weight: 900; margin-top: 3px; }

        .form-section {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: 'Cairo';
            font-size: 14px;
            font-weight: 700;
        }

        .btn-save {
            grid-column: span 3;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        .whatsapp-section {
            background: #f0fdf4;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid var(--whatsapp);
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .whatsapp-section input { flex: 1; min-width: 200px; border: 1px solid var(--whatsapp); font-size: 16px; }

        .btn-whatsapp {
            background: var(--whatsapp);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
            flex: 1;
        }

        .search-area {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-input-wrapper { flex: 3; min-width: 250px; }
        .search-area input { 
            width: 100%; 
            box-sizing: border-box; 
            background: #eff6ff;
            border: 1px solid var(--primary);
        }

        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; font-weight: 900; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: center; font-weight: 700; }

        .td-in { color: var(--success); font-weight: 900; background: #f0fdf4; }
        .td-out { color: var(--danger); font-weight: 900; background: #fef2f2; }
        .badge { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-weight: 800; }

        @media (max-width: 600px) {
            .form-section { grid-template-columns: 1fr; }
            .btn-save { grid-column: span 1; }
            .dashboard { grid-template-columns: 1fr 1fr; }
            .whatsapp-section { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>حسابات الورشة 2026</h1>
    </header>

    <div class="dashboard">
        <div class="card"><h3>اليوم</h3><div class="value" id="day-total" style="color:var(--success)">0</div></div>
        <div class="card"><h3>الشهر</h3><div class="value" id="month-total" style="color:var(--primary)">0</div></div>
        <div class="card"><h3>إجمالي الخارج</h3><div class="value" id="year-out" style="color:var(--danger)">0</div></div>
        <div class="card"><h3>الرصيد الصافي</h3><div class="value" id="year-net">0</div></div>
    </div>

    <div class="form-section">
        <select id="entry-shop">
            <option value="زبون">👤 زبون</option>
            <option value="عمال">👷 عمال</option>
            <option value="الومنيوم">💎 الومنيوم</option>
            <option value="فيبر">🎨 فيبر</option>
            <option value="خشب">🪵 خشب</option>
            <option value="اكسسوارات">⚙️ اكسسوارات</option>
            <option value="رخام">🪨 رخام</option>
            <option value="سيارة">🚚 سيارة</option>
            <option value="حديد">🔩 حديد</option>
            <option value="غير ذلك">✨ غير ذلك</option>
        </select>
        <input type="text" id="entry-customer" placeholder="الاسم">
        <input type="datetime-local" id="entry-date">
        <input type="text" id="entry-desc" placeholder="البيان">
        <input type="number" id="entry-out" style="border-right: 4px solid var(--danger)" placeholder="مبلغ خارج (-)">
        <input type="number" id="entry-in" style="border-right: 4px solid var(--success)" placeholder="مبلغ داخل (+)">
        <input type="hidden" id="edit-id">
        <button class="btn-save" id="btn-main" onclick="processEntry()">حفظ العملية</button>
    </div>

    <div class="whatsapp-section">
        <input type="number" id="wa-number" placeholder="رقم الواتساب (مثال: 010...)">
        <button class="btn-whatsapp" onclick="sendWhatsAppReport()">
            💬 إرسال سجل الورشة للواتساب
        </button>
    </div>

    <div class="search-area">
        <div class="search-input-wrapper">
            <input type="text" id="searchBox" placeholder="🔍 بحث شامل (بالاسم، البيان، أو المبلغ)..." onkeyup="loadData()">
        </div>
        <select id="filterShop" onchange="loadData()" style="font-weight: 800; background: white;">
            <option value="الكل">كل التصنيفات</option>
            <option value="زبون">زبون</option>
            <option value="عمال">عمال</option>
            <option value="الومنيوم">الومنيوم</option>
            <option value="خشب">خشب</option>
        </select>
        <button onclick="exportToCSV()" style="background:#059669; color:white; border:none; padding:0 15px; border-radius:6px; cursor:pointer; font-weight: 800;">Excel</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 140px;">التاريخ</th>
                    <th>القسم</th>
                    <th>الاسم</th>
                    <th>البيان</th>
                    <th>خارج</th>
                    <th>داخل</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    function convertToEn(str) {
        if (!str) return "";
        return str.toString().replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632);
    }

    window.onload = function() { setActualTime(); loadData(); };

    function setActualTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('entry-date').value = now.toISOString().slice(0, 16);
    }

    function processEntry() {
        const shop = document.getElementById('entry-shop').value;
        const customer = document.getElementById('entry-customer').value.trim() || "-";
        const date = document.getElementById('entry-date').value;
        const desc = document.getElementById('entry-desc').value.trim() || "-";
        const inVal = parseFloat(document.getElementById('entry-in').value) || 0;
        const outVal = parseFloat(document.getElementById('entry-out').value) || 0;
        const editId = document.getElementById('edit-id').value;

        if (inVal === 0 && outVal === 0) { alert("يرجى إدخال مبلغ"); return; }
        
        let data = JSON.parse(localStorage.getItem('workshop_2026_v2')) || [];
        if (editId) {
            const index = data.findIndex(item => item.id == editId);
            if (index !== -1) data[index] = { ...data[index], shop, customer, date, desc, inVal, outVal };
        } else {
            data.push({ shop, customer, date, desc, inVal, outVal, id: Date.now() });
        }
        localStorage.setItem('workshop_2026_v2', JSON.stringify(data));
        resetForm(); loadData();
    }

    function resetForm() {
        document.getElementById('entry-customer').value = "";
        document.getElementById('entry-desc').value = "";
        document.getElementById('entry-in').value = "";
        document.getElementById('entry-out').value = "";
        document.getElementById('edit-id').value = "";
        document.getElementById('btn-main').innerText = "حفظ العملية";
        setActualTime();
    }

    function loadData() {
        const tableBody = document.getElementById('table-body');
        let searchInput = document.getElementById('searchBox').value.toLowerCase().trim();
        let searchVal = convertToEn(searchInput);
        const filterShop = document.getElementById('filterShop').value;
        const data = JSON.parse(localStorage.getItem('workshop_2026_v2')) || [];
        
        tableBody.innerHTML = "";
        let totals = { day: 0, month: 0, yearOut: 0, yearNet: 0 };
        const now = new Date();
        const sortedData = data.slice().sort((a,b) => new Date(b.date) - new Date(a.date));

        sortedData.forEach((item) => {
            const rowDate = new Date(item.date);
            const itemNet = item.inVal - item.outVal;
            if (rowDate.toDateString() === now.toDateString()) totals.day += itemNet;
            if (rowDate.getMonth() === now.getMonth()) totals.month += itemNet;
            totals.yearOut += item.outVal; totals.yearNet += itemNet;

            const matchesSearch = item.customer.toLowerCase().includes(searchVal) || 
                                 item.desc.toLowerCase().includes(searchVal) ||
                                 item.inVal.toString().includes(searchVal) ||
                                 item.outVal.toString().includes(searchVal);
            
            const matchesFilter = (filterShop === "الكل" || item.shop.includes(filterShop));

            if (matchesSearch && matchesFilter) {
                tableBody.innerHTML += `
                    <tr>
                        <td style="font-size:11px;">${item.date.replace('T', ' ')}</td>
                        <td><span class="badge">${item.shop}</span></td>
                        <td style="font-weight:800;">${item.customer}</td>
                        <td>${item.desc}</td>
                        <td class="td-out">${item.outVal > 0 ? item.outVal.toLocaleString() : '-'}</td>
                        <td class="td-in">${item.inVal > 0 ? item.inVal.toLocaleString() : '-'}</td>
                        <td>
                            <button onclick="startEdit(${item.id})" style="border:none; background:none; cursor:pointer; font-size:16px;">📝</button>
                            <button onclick="deleteItem(${item.id})" style="border:none; background:none; cursor:pointer; font-size:16px;">🗑️</button>
                        </td>
                    </tr>`;
            }
        });
        document.getElementById('day-total').innerText = totals.day.toLocaleString();
        document.getElementById('month-total').innerText = totals.month.toLocaleString();
        document.getElementById('year-out').innerText = totals.yearOut.toLocaleString();
        document.getElementById('year-net').innerText = totals.yearNet.toLocaleString();
    }

    // وظيفة الواتساب المحسنة مع معالجة رمز الدولة تلقائياً
    function sendWhatsAppReport() {
        const data = JSON.parse(localStorage.getItem('workshop_2026_v2')) || [];
        let phone = document.getElementById('wa-number').value.trim();
        
        if (data.length === 0) return alert("لا توجد بيانات!");
        if (!phone) return alert("يرجى إدخال رقم الهاتف أولاً!");

        // إذا بدأ الرقم بـ 01 (رقم مصري)، يتم إضافة مفتاح الدولة 2 تلقائياً
        if (phone.startsWith('01')) {
            phone = '2' + phone;
        }
        
        let totalIn = 0, totalOut = 0;
        let message = `📋 *سجل الورشة الشامل لعام 2026*\n`;
        message += `━━━━━━━━━━━━━━━\n\n`;
        
        const reportData = [...data].sort((a,b) => new Date(a.date) - new Date(b.date));
        
        reportData.forEach((item, index) => {
            totalIn += item.inVal; totalOut += item.outVal;
            message += `*${index+1}* 📅 *ت:* ${item.date.replace('T', ' ')}\n`;
            message += `🏷️ *ق:* ${item.shop} | 👤 ${item.customer}\n`;
            message += `📝 *ب:* ${item.desc}\n`;
            if(item.outVal > 0) message += `💸 *خارج:* ${item.outVal.toLocaleString()}\n`;
            if(item.inVal > 0) message += `💰 *داخل:* ${item.inVal.toLocaleString()}\n`;
            message += `───────────────\n`;
        });
        
        message += `\n📊 *الملخص:* \n`;
        message += `✅ داخل: ${totalIn.toLocaleString()}\n`;
        message += `❌ خارج: ${totalOut.toLocaleString()}\n`;
        message += `💵 *الصافي: ${(totalIn - totalOut).toLocaleString()}*`;
        
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
    }

    function startEdit(id) {
        const data = JSON.parse(localStorage.getItem('workshop_2026_v2'));
        const item = data.find(i => i.id == id);
        if (item) {
            document.getElementById('entry-shop').value = item.shop;
            document.getElementById('entry-customer').value = item.customer;
            document.getElementById('entry-date').value = item.date;
            document.getElementById('entry-desc').value = item.desc;
            document.getElementById('entry-in').value = item.inVal || "";
            document.getElementById('entry-out').value = item.outVal || "";
            document.getElementById('edit-id').value = item.id;
            document.getElementById('btn-main').innerText = "تحديث البيانات";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function deleteItem(id) {
        if(confirm("هل تريد الحذف؟")) {
            let data = JSON.parse(localStorage.getItem('workshop_2026_v2'));
            localStorage.setItem('workshop_2026_v2', JSON.stringify(data.filter(i => i.id !== id)));
            loadData();
        }
    }

    function exportToCSV() {
        const data = JSON.parse(localStorage.getItem('workshop_2026_v2')) || [];
        let csv = "data:text/csv;charset=utf-8,\uFEFFالتاريخ,القسم,الاسم,البيان,خارج,داخل\n";
        data.forEach(i => csv += `${i.date},${i.shop},${i.customer},${i.desc},${i.outVal},${i.inVal}\n`);
        const link = document.createElement("a"); link.setAttribute("href", encodeURI(csv));
        link.setAttribute("download", "workshop_2026.csv"); link.click();
    }
</script>
</body>
</html>
