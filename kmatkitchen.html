<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO v10 - قائمة خامات المطبخ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #e9ecef; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-weight: 900 !important;
        }

        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e9ecef;
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: #2c3e50; font-weight: bold;
        }

        .menu-container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; font-size: 1.5rem; font-weight: 900 !important; }
        .menu-btn { display: block; width: 100%; padding: 13px; margin: 10px 0; border: none; border-radius: 10px; color: white; font-size: 1.2rem; font-weight: 900 !important; cursor: pointer; text-decoration: none; transition: 0.3s; box-sizing: border-box; }
        
        .btn-wood { background: #5c3a21; }
        .btn-alum { background: #00509e; }
        .btn-ex { background: #800020; }
        .btn-cut { background: #2f3640; } 
        .btn-alum-cut { background: #d35400; } /* لون جديد مخصص لتقطيع الألومنيوم */
        .btn-back { background: #6c757d; margin-top: 20px; font-size: 1rem; }
        .menu-btn:active { transform: scale(0.98); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-loader').style.display = 'none';
            } else {
                document.getElementById('auth-loader').innerText = "⚠️ حظر أمني سحابي: يرجى تسجيل الدخول من لوحة التحكم الرئيسية أولاً!";
            }
        });
    </script>
</head>
<body>

    <div id="auth-loader">⏳ جاري فحص حساب المشتري والمزامنة أمنياً...</div>

    <div class="menu-container">
        <h2>📋 قائمة الخدمات والمقايسات</h2>
        <a href="wood.html" class="menu-btn btn-wood">🪵 مقايسات الخشب</a>
        <a href="alumn.html" class="menu-btn btn-alum">🏢 مقايسات الألومنيوم و PVC</a>
        <a href="exwart.html" class="menu-btn btn-ex">🍽️ مقايسات الإكسسوارات</a>
        <a href="cut.html" class="menu-btn btn-cut">📐 مخططات التقطيع (ألواح)</a>
        
        <a href="aluminum_cut.html" class="menu-btn btn-alum-cut">🪚 مخططات تقطيع أعواد الألومنيوم</a>
        
        <a href="index.html" class="menu-btn btn-back">⬅️ العودة للرئيسية</a>
    </div>

</body>
</html>
