<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نقل - صفحة الزبون</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f5f7;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .card-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .header-title {
            color: #ff7b42;
            font-size: 24px;
            margin-bottom: 5px;
            margin-top: 0;
        }

        #sync-status {
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
            color: #b45309;
            font-weight: bold;
        }

        .subtitle {
            color: #28a745;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .driver-box {
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
        }

        .driver-info-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .driver-details {
            flex-grow: 1;
            margin-right: 15px;
        }

        .driver-name-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .rating {
            font-size: 14px;
            color: #555;
        }

        .car-type {
            color: #888;
            font-size: 14px;
            margin: 5px 0;
        }

        .driver-phone {
            color: #000;
            font-size: 15px;
            font-weight: bold;
            margin: 5px 0 0 0;
            background-color: #f0f0f0;
            padding: 5px;
            border-radius: 5px;
            display: inline-block;
        }

        .driver-image {
            width: 60px;
            height: 40px;
            border-radius: 5px;
            object-fit: cover;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #28a745;
            border-radius: 50%;
            margin-top: 5px;
        }

        .buttons-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }

        .btn-call { background-color: #007bff; }
        .btn-whatsapp { background-color: #25d366; }

        .btn-rate {
            width: 100%;
            background-color: #ffc107;
            color: #333;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .btn-back {
            width: 100%;
            background-color: transparent;
            color: #666;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h2 class="header-title">السواقين المتاحين</h2>
        
        <!-- حالة الاتصال السحابي -->
        <div id="sync-status">⏳ جاري فحص الاتصال بالخادم السحابي...</div>
        
        <!-- المكان اللي هيتغير فيه عدد السواقين -->
        <p class="subtitle" id="available-count-text">جاري البحث عن سواقين...</p>

        <!-- المكان اللي هنرص فيه كروت السواقين -->
        <div id="drivers-list-container">
            <!-- سيتم إضافة السواقين هنا برمجياً -->
        </div>

        <button class="btn-back">⬅️ تعديل الطلب (رجوع)</button>
    </div>

    <!-- كود الجافاسكريبت المربوط بقاعدة بياناتك -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // مسار السواقين في قاعدة البيانات
        const driversRef = ref(db, 'Drivers');

        onValue(driversRef, (snapshot) => {
            // تحديث رسالة الاتصال عند النجاح
            const syncStatus = document.getElementById('sync-status');
            syncStatus.innerText = "🟢 متصل بالسحابة بشكل آمن";
            syncStatus.style.color = "#059669"; 

            let container = document.getElementById('drivers-list-container');
            container.innerHTML = ''; 
            let availableDriversCount = 0;

            snapshot.forEach((childSnapshot) => {
                let driver = childSnapshot.val();
                
                // الفلترة: هل السواق متاح؟
                if (driver.status === "متاح") {
                    availableDriversCount++;
                    
                    let driverCard = `
                        <div class="driver-box">
                            <div class="driver-info-header">
                                <div class="status-dot"></div>
                                
                                <div class="driver-details">
                                    <div class="driver-name-rating">
                                        ${driver.name} <span class="rating">${driver.rating || '4.8'} ⭐</span>
                                    </div>
                                    <p class="car-type">${driver.carType || 'ربع نقل'}</p>
                                    <p class="driver-phone">📞 ${driver.phone}</p>
                                </div>

                                <img src="${driver.imageURL || 'https://via.placeholder.com/60x40'}" alt="صورة السيارة" class="driver-image">
                            </div>

                            <div class="buttons-row">
                                <a href="https://wa.me/+2${driver.phone}" class="btn btn-whatsapp">💬 واتس</a>
                                <a href="tel:${driver.phone}" class="btn btn-call">📞 اتصال</a>
                            </div>

                            <button class="btn-rate">⭐ هل تمت الرحلة؟ (قيّم الكابتن)</button>
                        </div>
                    `;
                    container.innerHTML += driverCard;
                }
            });

            let countText = document.getElementById('available-count-text');
            if (availableDriversCount > 0) {
                countText.innerText = `وجدنا ${availableDriversCount} سواقين متاحين لطلبك`;
                countText.style.color = "#28a745"; 
            } else {
                countText.innerText = `عفواً، لا يوجد سواقين متاحين حالياً`;
                countText.style.color = "#dc3545"; 
            }
        }, (error) => {
            console.error(error);
            const syncStatus = document.getElementById('sync-status');
            syncStatus.innerText = "🔴 خطأ اتصال بالسيرفر";
            syncStatus.style.color = "#dc2626"; 
        });
    </script>
</body>
</html>
