<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وصلني | Wslny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #f3f4f6; 
            overflow-x: hidden; 
        }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(90deg, #f97316, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800 bg-gray-200">

    <!-- 1. واجهة الاختيار الرئيسية -->
    <div id="homeView" class="glass-panel shadow-2xl rounded-3xl w-full max-w-md p-8 text-center border-t-4 border-orange-500 transform transition-all duration-300">
        <div class="mb-8">
            <h1 class="text-5xl font-extrabold mb-2 text-gray-800"><span class="text-gray-800">وصلني</span></h1>
            <p class="text-orange-500 font-bold tracking-widest uppercase text-sm mb-2">W S L N Y</p>
            <p class="text-gray-500 font-semibold text-sm">أسرع تطبيق لنقل البضائع والعفش</p>
        </div>

        <div class="space-y-4">
            <button onclick="showView('customerView')" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-300 text-lg flex items-center justify-center gap-3">
                <span class="text-orange-500 text-2xl">📦</span> أنا زبون (أطلب عربية)
            </button>

            <button onclick="showView('driverView')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-300 text-lg flex items-center justify-center gap-3">
                <span class="text-gray-900 text-2xl">🚚</span> أنا سواق (سجل سيارتك)
            </button>
        </div>
    </div>

    <!-- 2. واجهة السواق (تسجيل) -->
    <div id="driverView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-gray-800 transform transition-all duration-300">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">تسجيل سائق جديد</h2>
            <button onclick="showView('homeView')" class="text-orange-500 font-bold hover:text-orange-600">الرجوع</button>
        </div>

        <form onsubmit="alert('تم التسجيل بنجاح في وصلني! سيتم مراجعة بياناتك.'); showView('homeView'); return false;" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">الاسم ورقم الهاتف</label>
                <div class="flex gap-2">
                    <input type="text" required placeholder="الاسم ثلاثي" class="w-1/2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    <input type="tel" required placeholder="01xxxxxxxx" class="w-1/2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-left" dir="ltr">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">نوع السيارة</label>
                <select required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none mb-3">
                    <option value="" disabled selected>اختر سيارتك...</option>
                    <option value="tricycle">تروسيكل</option>
                    <option value="pickup_small">سيارة ربع نقل</option>
                    <option value="pickup_large">نصف نقل كبيرة</option>
                    <option value="furniture_crane">عربية عفش ونش</option>
                </select>
                
                <label class="block text-sm font-bold text-gray-700 mb-2">حالة السيارة</label>
                <select required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    <option value="" disabled selected>حدد حالة سيارتك...</option>
                    <option value="حديثة">حديثة</option>
                    <option value="تفي بالغرض">تفي بالغرض</option>
                    <option value="قديمة نوعا ما">قديمة نوعاً ما</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">صورة السيارة</label>
                <input type="file" accept="image/*" required class="w-full px-4 py-2 border border-gray-200 rounded-xl bg-gray-50 text-sm focus:outline-none">
            </div>

            <button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-orange-500 font-bold py-3 rounded-xl shadow-md transition duration-200 text-lg">
                تأكيد التسجيل
            </button>
        </form>
    </div>

    <!-- 3. واجهة الزبون (الطلب) -->
    <div id="customerView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-orange-500 transform transition-all duration-300">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-800">تفاصيل النقل</h2>
            <button onclick="showView('homeView')" class="text-gray-500 font-bold hover:text-gray-800">الرجوع</button>
        </div>

        <form onsubmit="findDrivers(event)" class="space-y-4">
            <div class="flex gap-2">
                <input type="text" id="pickupLocation" required placeholder="مكان الاستلام" class="w-1/2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                <input type="text" id="dropoffLocation" required placeholder="مكان الوصول" class="w-1/2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
            </div>

            <div>
                <select id="vehicleType" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none mb-4">
                    <option value="" disabled selected>نوع النقل المطلوب...</option>
                    <option value="تروسيكل">تروسيكل (أغراض خفيفة)</option>
                    <option value="سيارة ربع نقل">سيارة ربع نقل</option>
                    <option value="نصف نقل كبيرة">نصف نقل كبيرة</option>
                    <option value="عربية عفش ونش">عربية عفش ونش</option>
                </select>

                <select id="vehicleCondition" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    <option value="" disabled selected>اختيار نوعية / حالة السيارة...</option>
                    <option value="حديثة">حديثة (موديل حديث ومجهزة)</option>
                    <option value="تفي بالغرض">تفي بالغرض (حالة متوسطة وجيدة)</option>
                    <option value="قديمة نوعا ما">قديمة نوعاً ما (اقتصادية)</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 text-lg mt-4">
                بحث عن السائقين المتاحين
            </button>
        </form>
    </div>

    <!-- 4. شاشة السائقين المتاحين (للاتفاق عبر الاتصال أو الواتساب) -->
    <div id="driversListView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-gray-800 transform transition-all duration-300">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">السائقين بالقرب منك</h2>
            <button onclick="showView('customerView')" class="text-orange-500 font-bold text-sm hover:text-orange-600">تعديل الطلب</button>
        </div>
        
        <div class="space-y-4" id="driverListContainer">
            <!-- الكارت الأول لسائق -->
            <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm flex flex-col gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center text-2xl">👨‍✈️</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800 text-lg">محمود السيد</h4>
                        <div class="text-sm mt-1">
                            <span class="text-gray-800 font-bold" id="driver1Vehicle">سيارة ربع نقل</span> • 
                            <span class="text-gray-500 font-semibold" id="driver1Condition">حديثة</span>
                        </div>
                        <div class="text-xs text-orange-500 font-bold mt-1">يبعد 3 دقائق</div>
                    </div>
                </div>
                <!-- أزرار الاتصال -->
                <div class="flex gap-2">
                    <a href="tel:+201000000000" class="w-1/2 bg-gray-800 text-white py-2 rounded-xl font-bold hover:bg-gray-900 text-sm flex justify-center items-center gap-2">
                        📞 اتصال
                    </a>
                    <a href="https://wa.me/201000000000?text=مرحباً،%20محتاج%20أنقل%20أغراض%20من%20تطبيق%20وصلني" target="_blank" class="w-1/2 bg-[#25D366] text-white py-2 rounded-xl font-bold hover:bg-green-600 text-sm flex justify-center items-center gap-2">
                        💬 واتساب
                    </a>
                </div>
            </div>

            <!-- الكارت الثاني لسائق -->
            <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm flex flex-col gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center text-2xl">👨‍✈️</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-gray-800 text-lg">أحمد رضا</h4>
                        <div class="text-sm mt-1">
                            <span class="text-gray-800 font-bold" id="driver2Vehicle">سيارة ربع نقل</span> • 
                            <span class="text-gray-500 font-semibold" id="driver2Condition">حديثة</span>
                        </div>
                        <div class="text-xs text-orange-500 font-bold mt-1">يبعد 5 دقائق</div>
                    </div>
                </div>
                <!-- أزرار الاتصال -->
                <div class="flex gap-2">
                    <a href="tel:+201100000000" class="w-1/2 bg-gray-800 text-white py-2 rounded-xl font-bold hover:bg-gray-900 text-sm flex justify-center items-center gap-2">
                        📞 اتصال
                    </a>
                    <a href="https://wa.me/201100000000?text=مرحباً،%20محتاج%20أنقل%20أغراض%20من%20تطبيق%20وصلني" target="_blank" class="w-1/2 bg-[#25D366] text-white py-2 rounded-xl font-bold hover:bg-green-600 text-sm flex justify-center items-center gap-2">
                        💬 واتساب
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- سكريبت التحكم وميزة السحب -->
    <script>
        function showView(viewId) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('driverView').classList.add('hidden');
            document.getElementById('customerView').classList.add('hidden');
            document.getElementById('driversListView').classList.add('hidden');
            
            document.getElementById(viewId).classList.remove('hidden');
        }

        function findDrivers(e) {
            e.preventDefault();
            
            // جلب البيانات من اختيارات الزبون
            const selectedVehicle = document.getElementById('vehicleType').value;
            const selectedCondition = document.getElementById('vehicleCondition').value;
            
            // تمرير البيانات لكروت السائقين
            document.getElementById('driver1Vehicle').innerText = selectedVehicle;
            document.getElementById('driver2Vehicle').innerText = selectedVehicle;
            
            document.getElementById('driver1Condition').innerText = selectedCondition;
            document.getElementById('driver2Condition').innerText = selectedCondition;

            showView('driversListView');
        }

        // ==========================================
        // ميزة السحب للرجوع (Swipe to Go Back)
        // ==========================================
        let touchstartX = 0;
        let touchendX = 0;

        document.addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const screenWidth = window.innerWidth;
            const swipedFromLeft = (touchstartX < 50 && touchendX > touchstartX + 60);
            const swipedFromRight = (screenWidth - touchstartX < 50 && touchendX < touchstartX - 60);

            if (swipedFromLeft || swipedFromRight) {
                if (!document.getElementById('driverView').classList.contains('hidden')) {
                    showView('homeView');
                } 
                else if (!document.getElementById('customerView').classList.contains('hidden')) {
                    showView('homeView');
                } 
                else if (!document.getElementById('driversListView').classList.contains('hidden')) {
                    showView('customerView');
                }
            }
        }
    </script>

</body>
</html>
