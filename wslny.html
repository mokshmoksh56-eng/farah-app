<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق وصلني | Wslny - أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; overflow-x: hidden; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(90deg, #f97316, #ea580c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f3f4f6;
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: #f97316; font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800 bg-gray-200">

    <div id="auth-loader">⏳ جاري الاتصال بالسحابة...</div>

    <!-- 1. واجهة الاختيار الرئيسية -->
    <div id="homeView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-md p-8 text-center border-t-4 border-orange-500 transform transition-all duration-300">
        <div class="mb-8">
            <h1 class="text-5xl font-extrabold mb-2 text-gray-800">وصلني</h1>
            <p class="text-orange-500 font-bold tracking-widest uppercase text-sm mb-2">W S L N Y</p>
            <p class="text-gray-500 font-semibold text-sm">أسرع تطبيق لنقل البضائع والعفش</p>
            <div id="sync-status" class="mt-2 text-xs font-bold text-green-600">🟢 متصل بالسيرفر</div>
        </div>

        <div class="space-y-4">
            <button onclick="showView('customerView')" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-300 text-lg flex items-center justify-center gap-3">
                <span class="text-orange-500 text-2xl">📦</span> أنا زبون (أطلب عربية)
            </button>

            <button onclick="showView('driverView')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl shadow-lg transition duration-300 text-lg flex items-center justify-center gap-3">
                <span class="text-gray-900 text-2xl">🚚</span> أنا سواق (سجل سيارتك)
            </button>
        </div>
    </div>

    <!-- 2. واجهة السواق (تسجيل) -->
    <div id="driverView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-gray-800 transform transition-all duration-300">
        <div class="mb-6 text-center">
            <h2 class="text-2xl font-bold text-gray-800">تسجيل كسائق أونلاين</h2>
        </div>

        <form onsubmit="activateDriver(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">الاسم ورقم الهاتف</label>
                <div class="flex gap-2">
                    <input type="text" id="driverName" required placeholder="الاسم ثلاثي" class="w-1/2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    <input type="tel" id="driverPhone" required placeholder="01xxxxxxxx" class="w-1/2 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-left" dir="ltr">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">نوع وحالة السيارة</label>
                <select id="driverVType" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none mb-3">
                    <option value="" disabled selected>اختر سيارتك...</option>
                    <option value="تروسيكل">تروسيكل</option>
                    <option value="سيارة ربع نقل">سيارة ربع نقل</option>
                    <option value="نصف نقل كبيرة">نصف نقل كبيرة</option>
                    <option value="عربية عفش ونش">عربية عفش ونش</option>
                </select>
                
                <select id="driverVCond" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    <option value="" disabled selected>حدد حالة سيارتك...</option>
                    <option value="حديثة">حديثة</option>
                    <option value="تفي بالغرض">تفي بالغرض</option>
                    <option value="قديمة نوعا ما">قديمة نوعاً ما</option>
                </select>
            </div>

            <div class="pt-2 space-y-3">
                <button type="submit" class="w-full bg-gray-800 hover:bg-gray-900 text-orange-500 font-bold py-3 rounded-xl shadow-md transition duration-200 text-lg">
                    بدء العمل (مزامنة للسحابة)
                </button>
                
                <button type="button" onclick="showView('homeView')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition duration-200 text-lg">
                    الرجوع للرئيسية
                </button>
            </div>
        </form>
    </div>

    <!-- 3. شاشة السائق بعد التسجيل الفوري (مبتكرة) -->
    <div id="driverActiveView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-gray-800 transform transition-all duration-300 text-center">
        
        <!-- أيقونة الحالة الديناميكية -->
        <div id="statusIcon" class="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 transition-all duration-300">✓</div>
        
        <h2 id="statusTitle" class="text-2xl font-bold text-gray-800 mb-2">أنت الآن متصل!</h2>
        <p id="statusDesc" class="text-gray-500 font-semibold mb-6">يستطيع الزبائن رؤيتك والاتصال بك الآن.</p>
        
        <!-- شريط النبض الديناميكي -->
        <div id="pulseContainer" class="p-4 bg-green-50 rounded-2xl border border-green-200 mb-6 transition-all duration-300">
            <div id="pulseIndicator" class="flex space-x-3 space-x-reverse items-center justify-center">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-green-700 font-bold">جاري البحث عن زبائن...</span>
            </div>
        </div>

        <div class="space-y-3">
            <!-- زر الإيقاف المؤقت (مبتكر) -->
            <button id="btnPause" onclick="togglePause()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl shadow-sm transition duration-200 text-lg flex justify-center items-center gap-2">
                ☕ إيقاف للراحة (مؤقت)
            </button>

            <!-- زر الخروج النهائي -->
            <button onclick="confirmGoOffline()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3 rounded-xl shadow-md transition duration-200 text-lg flex justify-center items-center gap-2">
                🚪 خروج نهائي من التطبيق
            </button>
        </div>
    </div>

    <!-- 4. واجهة الزبون (الطلب) -->
    <div id="customerView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-orange-500 transform transition-all duration-300">
        <div class="mb-6 text-center">
            <h2 class="text-2xl font-bold text-gray-800">تفاصيل النقل</h2>
        </div>

        <form onsubmit="fetchDriversFromCloud(event)" class="space-y-4">
            <select id="custVType" required class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none mb-4">
                <option value="" disabled selected>ما هو نوع النقل المطلوب؟</option>
                <option value="تروسيكل">تروسيكل (أغراض خفيفة)</option>
                <option value="سيارة ربع نقل">سيارة ربع نقل</option>
                <option value="نصف نقل كبيرة">نصف نقل كبيرة</option>
                <option value="عربية عفش ونش">عربية عفش ونش</option>
            </select>

            <div class="pt-2 space-y-3">
                <button type="submit" id="btnSearch" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-lg transition duration-200 text-lg mt-4">
                    بحث في السحابة عن سائقين
                </button>

                <button type="button" onclick="showView('homeView')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition duration-200 text-lg">
                    الرجوع للرئيسية
                </button>
            </div>
        </form>
    </div>

    <!-- 5. شاشة السائقين المتاحين (جلب ديناميكي) -->
    <div id="driversListView" class="hidden glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 md:p-8 border-t-4 border-gray-800 transform transition-all duration-300">
        <div class="mb-6 text-center">
            <h2 class="text-xl font-bold text-gray-800">السائقين الأونلاين حالياً</h2>
        </div>
        
        <div class="space-y-4 mb-6" id="driverListContainer">
            <!-- سيتم إضافة السائقين من قاعدة البيانات هنا برمجياً -->
        </div>

        <button onclick="showView('customerView')" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition duration-200 text-lg">
            تعديل الطلب (الرجوع)
        </button>
    </div>

    <!-- سكريبت إدارة الواجهات وميزة السحب -->
    <script>
        function showView(viewId) {
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('driverView').classList.add('hidden');
            document.getElementById('driverActiveView').classList.add('hidden');
            document.getElementById('customerView').classList.add('hidden');
            document.getElementById('driversListView').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');
        }

        let touchstartX = 0; let touchendX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, false);
        document.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleSwipe(); }, false);
        function handleSwipe() {
            const screenW = window.innerWidth;
            if ((touchstartX < 50 && touchendX > touchstartX + 60) || (screenW - touchstartX < 50 && touchendX < touchstartX - 60)) {
                if (!document.getElementById('driverView').classList.contains('hidden')) showView('homeView');
                else if (!document.getElementById('driverActiveView').classList.contains('hidden')) confirmGoOffline();
                else if (!document.getElementById('customerView').classList.contains('hidden')) showView('homeView');
                else if (!document.getElementById('driversListView').classList.contains('hidden')) showView('customerView');
            }
        }
    </script>

    <!-- سكريبت الاتصال بقاعدة بيانات Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // تم إضافة update لتعديل حالة السائق دون حذف البيانات
        import { getDatabase, ref, onValue, set, get, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210",
            measurementId: "G-R28J7010TH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        let currentDriverRef = null;

        const savedInfoStr = localStorage.getItem('wslny_driver_info');
        if (savedInfoStr) {
            try {
                const savedInfo = JSON.parse(savedInfoStr);
                document.getElementById('driverName').value = savedInfo.name || '';
                document.getElementById('driverPhone').value = savedInfo.phone || '';
                document.getElementById('driverVType').value = savedInfo.vType || '';
                document.getElementById('driverVCond').value = savedInfo.vCond || '';
            } catch(e) {}
        }

        signInAnonymously(auth).catch((error) => {
            console.error("Auth Error:", error);
            const loader = document.getElementById('auth-loader');
            if (loader) {
                loader.innerHTML = `⚠️ خطأ في الاتصال: <br> ${error.message} <br><br> يرجى تفعيل (Anonymous) من إعدادات Authentication في فايربيز.`;
                loader.style.color = "red";
                loader.style.textAlign = "center";
                loader.style.padding = "20px";
            }
        });
        
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-loader').style.display = 'none';
                
                const isActive = localStorage.getItem('wslny_is_active');
                if (isActive === 'true' && savedInfoStr) {
                    const savedInfo = JSON.parse(savedInfoStr);
                    const driverKey = "driver_" + savedInfo.phone;
                    currentDriverRef = ref(db, 'wslny_app/active_drivers/' + driverKey);
                    
                    // استرجاع الحالة السابقة (إذا كان متصل أو في استراحة)
                    const lastStatus = localStorage.getItem('wslny_driver_status') || 'active';
                    
                    set(currentDriverRef, {
                        name: savedInfo.name,
                        phone: savedInfo.phone,
                        vType: savedInfo.vType,
                        vCond: savedInfo.vCond,
                        status: lastStatus, // تسجيل الحالة
                        timestamp: Date.now()
                    });
                    
                    updateDriverUI(lastStatus);
                    showView('driverActiveView');
                } else {
                    showView('homeView');
                }
            }
        });

        // دالة تحديث الواجهة التفاعلية للسائق (الابتكار)
        window.updateDriverUI = function(status) {
            const icon = document.getElementById('statusIcon');
            const title = document.getElementById('statusTitle');
            const desc = document.getElementById('statusDesc');
            const pulseContainer = document.getElementById('pulseContainer');
            const pulseIndicator = document.getElementById('pulseIndicator');
            const btnPause = document.getElementById('btnPause');

            if (status === 'active') {
                icon.className = "w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 transition-all duration-300";
                icon.innerHTML = "✓";
                title.innerText = "أنت الآن متصل!";
                desc.innerText = "يستطيع الزبائن رؤيتك والاتصال بك الآن.";
                pulseContainer.className = "p-4 bg-green-50 rounded-2xl border border-green-200 mb-6 transition-all duration-300";
                pulseIndicator.innerHTML = `<div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div><span class="text-green-700 font-bold">جاري البحث عن زبائن...</span>`;
                btnPause.innerHTML = "☕ إيقاف للراحة (مؤقت)";
                btnPause.className = "w-full bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 rounded-xl shadow-sm transition duration-200 text-lg flex justify-center items-center gap-2";
            } else {
                icon.className = "w-20 h-20 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4 transition-all duration-300";
                icon.innerHTML = "☕";
                title.innerText = "أنت في استراحة";
                desc.innerText = "أنت الآن مخفي تماماً ولن تظهر لأي زبون.";
                pulseContainer.className = "p-4 bg-yellow-50 rounded-2xl border border-yellow-200 mb-6 transition-all duration-300";
                pulseIndicator.innerHTML = `<div class="w-3 h-3 bg-yellow-500 rounded-full"></div><span class="text-yellow-700 font-bold">حسابك متوقف مؤقتاً...</span>`;
                btnPause.innerHTML = "▶️ استئناف العمل فوراً";
                btnPause.className = "w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl shadow-sm transition duration-200 text-lg flex justify-center items-center gap-2";
            }
        };

        // زر التسجيل والدخول
        window.activateDriver = function(e) {
            e.preventDefault();
            const name = document.getElementById('driverName').value;
            const phone = document.getElementById('driverPhone').value;
            const vType = document.getElementById('driverVType').value;
            const vCond = document.getElementById('driverVCond').value;

            localStorage.setItem('wslny_driver_info', JSON.stringify({ name, phone, vType, vCond }));
            localStorage.setItem('wslny_is_active', 'true');
            localStorage.setItem('wslny_driver_status', 'active');

            const driverKey = "driver_" + phone;
            currentDriverRef = ref(db, 'wslny_app/active_drivers/' + driverKey);

            set(currentDriverRef, {
                name: name,
                phone: phone,
                vType: vType,
                vCond: vCond,
                status: 'active',
                timestamp: Date.now()
            }).then(() => {
                updateDriverUI('active');
                showView('driverActiveView');
            }).catch(err => alert("خطأ في الاتصال: " + err.message));
        };

        // زر التبديل بين (متصل / استراحة)
        window.togglePause = function() {
            const currentStatus = localStorage.getItem('wslny_driver_status');
            const newStatus = currentStatus === 'active' ? 'paused' : 'active';
            
            if(currentDriverRef) {
                // استخدام update لتعديل سطر الحالة فقط دون مسح باقي البيانات
                update(currentDriverRef, { status: newStatus });
            }
            
            localStorage.setItem('wslny_driver_status', newStatus);
            updateDriverUI(newStatus);
        };

        window.confirmGoOffline = function() {
            if (confirm("هل أنت متأكد من الخروج نهائياً من التطبيق؟ ستحتاج لتسجيل الدخول مرة أخرى للعمل.")) {
                goOffline();
            }
        };

        window.goOffline = function() {
            if(currentDriverRef) {
                remove(currentDriverRef); // حذف السائق من السحابة تماماً
            }
            localStorage.setItem('wslny_is_active', 'false');
            showView('homeView');
        };

        // بحث الزبون - تم التعديل لجلب السائقين (النشطين فقط)
        window.fetchDriversFromCloud = function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSearch');
            btn.innerText = "⏳ جاري البحث في السحابة...";
            
            const requiredType = document.getElementById('custVType').value;
            const driversNode = ref(db, 'wslny_app/active_drivers');

            onValue(driversNode, (snapshot) => {
                const data = snapshot.val();
                const container = document.getElementById('driverListContainer');
                container.innerHTML = ""; 
                
                let foundAny = false;

                if(data) {
                    Object.keys(data).forEach(key => {
                        const driver = data[key];
                        // 💡 الابتكار: لا نعرض السائق إذا كان في فترة استراحة (status !== active)
                        if(driver.vType === requiredType && driver.status === 'active') {
                            foundAny = true;
                            
                            let cleanPhone = driver.phone.replace(/^0+/, ''); 
                            let waLink = `https://wa.me/20${cleanPhone}?text=${encodeURIComponent("مرحباً، محتاج أنقل أغراض من تطبيق وصلني")}`;
                            
                            container.innerHTML += `
                            <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm flex flex-col gap-4">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center text-2xl">👨‍✈️</div>
                                    <div class="flex-1">
                                        <h4 class="font-bold text-gray-800 text-lg">${driver.name}</h4>
                                        <div class="text-sm mt-1">
                                            <span class="text-gray-800 font-bold">${driver.vType}</span> • 
                                            <span class="text-gray-500 font-semibold">${driver.vCond}</span>
                                        </div>
                                        <div class="text-xs text-green-600 font-bold mt-1">🟢 متصل الآن ومستعد</div>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <a href="tel:${driver.phone}" class="w-1/2 bg-gray-800 text-white py-2 rounded-xl font-bold hover:bg-gray-900 text-sm flex justify-center items-center gap-2">📞 اتصال</a>
                                    <a href="${waLink}" target="_blank" class="w-1/2 bg-[#25D366] text-white py-2 rounded-xl font-bold hover:bg-green-600 text-sm flex justify-center items-center gap-2">💬 واتساب</a>
                                </div>
                            </div>`;
                        }
                    });
                }

                if(!foundAny) {
                    container.innerHTML = `
                    <div class="text-center p-6 bg-red-50 rounded-2xl border border-red-200 text-red-600 font-bold">
                        عفواً، لا يوجد سائقين (${requiredType}) متاحين في الوقت الحالي. قد يكونون في فترة راحة، حاول مجدداً.
                    </div>`;
                }

                btn.innerText = "بحث في السحابة عن سائقين";
                showView('driversListView');
            }, { onlyOnce: true });
        };
        
        window.addEventListener('beforeunload', () => {
            if(currentDriverRef) remove(currentDriverRef);
        });
    </script>

</body>
</html>
