<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجل العمليات | إقبض</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .btn-burgundy { background: linear-gradient(135deg, #7e122f 0%, #4a0718 100%); color: white; transition: all 0.25s ease; }
        .btn-burgundy:hover { background: linear-gradient(135deg, #9c1c3f 0%, #7e122f 100%); box-shadow: 0 8px 18px -4px rgba(126, 18, 47, 0.35); }
        .fade-enter { opacity: 0; transform: translateY(10px); transition: all 0.3s ease-out; }
        .fade-enter-active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-5">

    <div class="w-full max-w-md bg-white rounded-3xl p-6 sm:p-8 shadow-xl border-2 border-slate-200">
        
        <div class="text-center mb-6">
            <div class="text-5xl mb-2">📜</div>
            <h1 class="text-2xl font-black text-[#4a0718]">سجل العمليات السابقة</h1>
            <p class="text-xs font-bold text-slate-500 mt-1">تطبيق إقبض (Eqbad)</p>
        </div>

        <form id="historyForm" onsubmit="window.fetchHistory(event)" class="space-y-4">
            
            <!-- اختيار الدور -->
            <div>
                <label class="block text-sm font-black text-slate-900 mb-2">نوع الحساب</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-center gap-2 p-3 bg-white border-2 border-slate-200 rounded-xl cursor-pointer text-sm font-black text-slate-700 hover:border-[#7e122f] hover:bg-rose-50 transition-all">
                        <input type="radio" name="userRole" value="customer" checked class="accent-[#7e122f] w-4 h-4">
                        <span>أنا عميل</span>
                    </label>
                    <label class="flex items-center justify-center gap-2 p-3 bg-white border-2 border-slate-200 rounded-xl cursor-pointer text-sm font-black text-slate-700 hover:border-[#7e122f] hover:bg-rose-50 transition-all">
                        <input type="radio" name="userRole" value="merchant" class="accent-[#7e122f] w-4 h-4">
                        <span>أنا تاجر</span>
                    </label>
                </div>
            </div>

            <!-- رقم الهاتف -->
            <div>
                <label class="block text-sm font-black text-slate-900 mb-1.5">رقم الهاتف المسجل به</label>
                <input type="tel" id="searchPhone" required placeholder="01xxxxxxxx" class="w-full px-4 py-3 bg-slate-50 border-2 border-slate-200 focus:border-[#7e122f] rounded-xl outline-none font-black tracking-widest text-left text-lg transition-colors" dir="ltr">
            </div>

            <button type="submit" id="btnSearch" class="w-full btn-burgundy font-black py-3.5 rounded-xl shadow-md active:scale-95 text-base">
                عرض التقرير 🔍
            </button>
        </form>

        <!-- النتائج -->
        <div id="resultsArea" class="mt-6 pt-6 border-t border-slate-200 hidden fade-enter">
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-2xl text-center">
                    <p class="text-[10px] sm:text-xs font-bold text-emerald-800 mb-1">إجمالي المبالغ</p>
                    <p id="totalAmount" class="text-base sm:text-lg font-black text-emerald-600">0 ج.م</p>
                </div>
                <div class="bg-blue-50 border border-blue-200 p-3 rounded-2xl text-center">
                    <p class="text-[10px] sm:text-xs font-bold text-blue-800 mb-1">عدد العمليات</p>
                    <p id="totalCount" class="text-base sm:text-lg font-black text-blue-600">0 عملية</p>
                </div>
            </div>

            <div class="flex justify-between items-center mb-3">
                <h3 class="text-sm font-black text-slate-900">قائمة العمليات المكتملة:</h3>
            </div>
            
            <div id="historyList" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <!-- Data will be injected here -->
            </div>
        </div>

    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU", 
            authDomain: "azemaa-proo.firebaseapp.com", 
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com", 
            projectId: "azemaa-proo", 
            storageBucket: "azemaa-proo.firebasestorage.app", 
            messagingSenderId: "787350492977", 
            appId: "1:787350492977:web:84061dcf31622fcb07c210" 
        };
        
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app); 
        const auth = getAuth(app);

        signInAnonymously(auth).catch(console.error);

        window.fetchHistory = function(e) {
            e.preventDefault();
            const phone = document.getElementById('searchPhone').value.trim();
            const role = document.querySelector('input[name="userRole"]:checked').value;
            const btn = document.getElementById('btnSearch');
            const resultsArea = document.getElementById('resultsArea');
            const historyList = document.getElementById('historyList');

            if(!phone) return;

            btn.innerHTML = "⏳ جاري البحث...";
            btn.disabled = true;

            get(ref(db, 'eqbad_orders')).then(snap => {
                btn.innerHTML = "عرض التقرير 🔍";
                btn.disabled = false;
                
                let records = [];
                let totalAmt = 0;

                if(snap.exists()) {
                    snap.forEach(child => {
                        let ord = child.val();
                        // فلترة العمليات المكتملة فقط
                        if(ord.status === 'completed') {
                            if(role === 'merchant' && ord.target_merchant === phone) {
                                records.push(ord);
                                totalAmt += parseFloat(ord.amount) || 0;
                            } else if(role === 'customer' && ord.customer_phone === phone) {
                                records.push(ord);
                                totalAmt += parseFloat(ord.amount) || 0;
                            }
                        }
                    });
                }

                // ترتيب من الأحدث للأقدم
                records.sort((a, b) => (b.completedAt || b.timestamp) - (a.completedAt || a.timestamp));

                document.getElementById('totalAmount').innerText = totalAmt.toLocaleString() + ' ج.م';
                document.getElementById('totalCount').innerText = records.length + ' عملية';
                
                resultsArea.classList.remove('hidden');
                setTimeout(() => resultsArea.classList.add('fade-enter-active'), 50);

                if(records.length === 0) {
                    historyList.innerHTML = `<div class="text-center py-6 text-slate-400 text-sm font-black bg-slate-50 rounded-xl border border-slate-200">لا توجد عمليات سابقة لهذا الرقم.</div>`;
                    return;
                }

                let html = "";
                records.forEach(ord => {
                    const dateObj = new Date(ord.completedAt || ord.timestamp);
                    const dateStr = dateObj.toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' });
                    const timeStr = dateObj.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                    
                    const isVf = ord.method === 'vodafone';
                    const methodLabel = isVf ? 'فودافون' : 'إنستاباي';
                    const colorClass = isVf ? 'text-red-700 bg-red-50 border-red-200' : 'text-purple-800 bg-purple-50 border-purple-200';
                    const sideColor = isVf ? 'bg-red-500' : 'bg-purple-600';
                    
                    // تحديد الطرف الآخر في العملية
                    let otherPartyName = "";
                    let otherPartyPhone = "";
                    if(role === 'merchant') {
                        otherPartyName = ord.customer_name ? `العميل: ${ord.customer_name}` : "عميل";
                        otherPartyPhone = ord.customer_phone;
                    } else {
                        otherPartyName = "تاجر معتمد"; 
                        otherPartyPhone = ord.target_merchant;
                    }

                    html += `
                    <div class="bg-white border-2 border-slate-100 p-3 rounded-2xl relative shadow-sm">
                        <div class="absolute right-0 top-0 bottom-0 w-1.5 ${sideColor} rounded-r-2xl"></div>
                        <div class="flex justify-between items-start mb-2 pr-3 pl-1">
                            <div>
                                <p class="text-[13px] font-black text-slate-900 mb-0.5">👤 ${otherPartyName}</p>
                                <p class="text-[11px] text-slate-500 font-bold" dir="ltr">📞 ${otherPartyPhone}</p>
                            </div>
                            <div class="text-left">
                                <p class="text-base font-black text-slate-900">${ord.amount} ج</p>
                            </div>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t border-slate-100 pr-3 pl-1">
                            <div class="flex items-center gap-1 text-[10px] font-black text-slate-500">
                                <span>🕒</span>
                                <span>${dateStr} - ${timeStr}</span>
                            </div>
                            <span class="${colorClass} px-2 py-0.5 rounded-md border font-black text-[10px]">
                                ${methodLabel} ✔️
                            </span>
                        </div>
                    </div>`;
                });
                historyList.innerHTML = html;
            }).catch(err => {
                btn.innerHTML = "عرض التقرير 🔍";
                btn.disabled = false;
                alert("حدث خطأ في الاتصال: " + err.message);
            });
        };
    </script>
</body>
</html>
