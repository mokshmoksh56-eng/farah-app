<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة فرح 2026 - وضوح السلف</title>
    <style>
        :root { 
            --primary: #1a5f7a; 
            --primary-light: #e0f2fe; 
            --secondary: #64748b; 
            --success-blue: #0ea5e9; 
            --success-bg: #f0f9ff; 
            --danger: #ef4444; 
            --warning: #f97316; 
            --bg: #f1f5f9; 
            --card: #ffffff; 
            --border: #cbd5e1;
            --row-divider: #e2e8f0;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); margin: 0; padding: 10px; color: #1e293b;
            direction: rtl;
        }

        .container { max-width: 1000px; margin: auto; }

        /* الداشبورد */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .dash-card {
            background: var(--card); padding: 12px 5px; border-radius: 12px;
            text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-bottom: 3px solid var(--primary);
        }
        .dash-card div { font-size: 0.75rem; color: var(--secondary); font-weight: bold; }
        .dash-card strong { font-size: 1.1rem; color: var(--primary); display: block; }

        /* الجدول */
        .table-container {
            background: var(--card); border-radius: 12px; overflow-x: auto;
            border: 1px solid var(--border); position: relative;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; min-width: 950px; }
        
        tr { border-bottom: 1.5px solid var(--row-divider); }
        tr:nth-child(even) { background-color: #fafafa; }

        th, td { border-left: 1px solid #f1f5f9; text-align: center; padding: 12px 3px; font-size: 12px; }
        th { background: #f8fafc; color: var(--primary); font-weight: bold; border-bottom: 2px solid var(--border); }

        /* عمود الاسم المثبت */
        .col-name { 
            position: sticky; right: 0; z-index: 20; background: var(--primary-light) !important;
            width: 170px !important; min-width: 170px; 
            text-align: center !important; 
            font-size: 15px !important;    
            font-weight: 800 !important;   
            color: var(--primary);
            border-left: 2.5px solid var(--border) !important;
        }

        /* عمود الصافي المثبت */
        .col-net {
            position: sticky; left: 0; z-index: 20; background: var(--success-bg) !important;
            width: 90px !important; min-width: 90px; font-weight: 900;
            color: var(--success-blue); border-right: 2.5px solid var(--border) !important;
            font-size: 14px;
        }

        .num-input { width: 65px; text-align: center; font-weight: 800; border: 1px solid var(--border); padding: 8px 2px; border-radius: 6px; font-size: 14px; background: #fdfdfd; }
        
        /* تكبير خانة السلف اليومية */
        .loan-input { 
            width: 52px; /* زيادة العرض */
            font-size: 14px !important; /* تكبير الرقم */
            text-align: center; 
            border: 1.5px solid #e2e8f0; 
            margin-top: 6px; 
            border-radius: 5px; 
            background: #fffdf2; 
            color: var(--danger) !important; 
            font-weight: 900 !important; /* جعل الرقم عريض جداً */
            padding: 5px 0;
        }

        .att-select { width: 50px; border: 2px solid var(--border); border-radius: 6px; font-weight: 900; font-size: 15px; padding: 6px 0; background: white; text-align: center; }
        .att-select.half { background: var(--warning) !important; color: white !important; }
        .att-select.zero { background: var(--danger) !important; color: white !important; }

        .btn { border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-main { background-color: var(--primary); color: white; width: 100%; height: 55px; font-size: 18px; margin: 20px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-tool { background-color: var(--card); color: var(--primary); padding: 12px; font-size: 13px; border: 1px solid var(--border); flex: 1; }

        .archive-box { background: var(--card); border-radius: 12px; padding: 15px; margin-top: 20px; border: 1px solid var(--border); }
        .stat-box { background: var(--success-bg); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; color: var(--success-blue); border: 1px solid #bae6fd; margin-bottom: 10px; }

        #success-msg { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 30px; border-radius: 30px; z-index: 1000; font-weight: bold; }
        
        select.main-select { width:100%; padding:15px; border-radius:12px; border:2px solid var(--primary); font-weight:bold; color: var(--primary); background:white; text-align: center; font-size: 14px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div id="success-msg">✨ تم الحفظ بنجاح</div>

<div class="container">
    <div class="dashboard no-print">
        <div class="dash-card"><div>إجمالي الرواتب</div><strong id="d-sal">0</strong></div>
        <div class="dash-card"><div>إجمالي السلف</div><strong id="d-loan" style="color:var(--danger)">0</strong></div>
        <div class="dash-card"><div>صافي المطلوب</div><strong id="d-net" style="color:var(--success-blue)">0</strong></div>
    </div>

    <div style="display: flex; gap: 8px; margin-bottom: 15px;" class="no-print">
        <button class="btn btn-tool" onclick="exportData()">💾 نسخة واتساب</button>
        <button class="btn btn-tool" onclick="document.getElementById('importFile').click()">📂 استعادة</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
    </div>

    <div style="margin-bottom: 15px;" class="no-print">
        <select id="weekSelect" class="main-select" onchange="loadWeeklyData()"></select>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width:30px">م</th>
                    <th class="col-name">اسم العـامل</th>
                    <th>الراتب</th>
                    <th>سبت</th><th>أحد</th><th>اثنين</th><th>ثلاثاء</th><th>أربعاء</th><th>خميس</th>
                    <th>م.سلف</th>
                    <th class="col-net">الصافي</th>
                </tr>
            </thead>
            <tbody id="payrollBody"></tbody>
        </table>
    </div>

    <button class="btn btn-main no-print" onclick="saveWeeklyData()">حفظ البيانات وتحديث الأرشيف ✅</button>

    <details class="no-print" style="background:var(--card); padding:15px; border-radius:12px; border:1px solid #border; margin-bottom:20px;">
        <summary style="font-weight:bold; cursor:pointer; color:var(--primary)">⚙️ إدارة قائمة العمال</summary>
        <div style="display:flex; gap:8px; margin-top:10px;">
            <input type="text" id="newWorkerName" placeholder="الاسم الجديد..." style="flex:1; padding:12px; border-radius:8px; border:1px solid var(--border);">
            <button class="btn" style="background-color:var(--primary); color:white; padding:0 20px;" onclick="addNewWorker()">إضافة</button>
        </div>
        <div id="workersList" style="margin-top:12px; display:flex; flex-wrap:wrap; gap:6px;"></div>
    </details>

    <div class="archive-box no-print">
        <h3 style="margin:0 0 12px; font-size:1rem; color: var(--primary);">📂 سجلات مراجعة حساب عامل</h3>
        <select id="archiveWorkerSelect" style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border);" onchange="showWorkerArchive()">
            <option value="">-- اختر اسماً لمراجعته --</option>
        </select>
        <div id="archiveDisplay" style="display:none; margin-top: 15px;">
            <div id="archStats" class="stat-box"></div>
            <div class="table-container">
                <table>
                    <thead style="background:#475569; color:white;">
                        <tr><th>الفترة</th><th>الراتب</th><th>حضور</th><th>سلف</th><th>الصافي</th></tr>
                    </thead>
                    <tbody id="archiveTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let workers = JSON.parse(localStorage.getItem('f_workers_2026')) || [];

    function init() {
        const ws = document.getElementById('weekSelect');
        let d = new Date(2026, 0, 3); 
        for(let i=1; i<=52; i++) {
            let start = `${d.getDate()}/${d.getMonth()+1}`;
            let endD = new Date(d); endD.setDate(d.getDate() + 5);
            let end = `${endD.getDate()}/${endD.getMonth()+1}`;
            ws.add(new Option(`من ${start} إلى ${end} / 2026`, i));
            d.setDate(d.getDate() + 7);
        }
        updateWorkersManager();
        loadWeeklyData();
        updateArchiveDropdown();
    }

    function calculateData(salary, loansArray, attArray) {
        let totalAtt = attArray.reduce((acc, val) => acc + parseFloat(val), 0);
        let totalLoans = loansArray.reduce((acc, val) => acc + (parseFloat(val) || 0), 0);
        if (!salary || salary <= 0) return { net: "", totalLoans: "", att: totalAtt };
        let net = ((salary / 6) * totalAtt) - totalLoans;
        return { net: net > 0 ? net.toFixed(2) : "0.00", totalLoans: totalLoans > 0 ? totalLoans.toFixed(2) : "", att: totalAtt };
    }

    function addNewWorker() {
        const name = document.getElementById('newWorkerName').value.trim();
        if(name) { workers.push({ name: name, active: true }); document.getElementById('newWorkerName').value = ""; saveWorkersList(); }
    }
    function saveWorkersList() { localStorage.setItem('f_workers_2026', JSON.stringify(workers)); updateWorkersManager(); loadWeeklyData(); updateArchiveDropdown(); }
    function updateWorkersManager() {
        const list = document.getElementById('workersList');
        list.innerHTML = workers.map((w, i) => `
            <div style="background:var(--primary-light); padding:6px 12px; border-radius:20px; font-size:12px; display:flex; gap:8px; border:1px solid #bae6fd;">
                <span style="${!w.active?'text-decoration:line-through':';font-weight:bold'}">${w.name}</span>
                <button onclick="toggleWorker(${i})" style="border:none; background:none; cursor:pointer; color:var(--primary); font-weight:bold;">${w.active?'❌':'✅'}</button>
            </div>`).join('');
    }
    function toggleWorker(i) { workers[i].active = !workers[i].active; saveWorkersList(); }

    function loadWeeklyData() {
        const tbody = document.getElementById('payrollBody');
        const w = document.getElementById('weekSelect').value;
        const saved = JSON.parse(localStorage.getItem(`f_week_data_${w}`)) || [];
        const activeWorkers = workers.filter(w => w.active);
        
        tbody.innerHTML = activeWorkers.map((worker, i) => {
            const sD = saved.find(s => s.name === worker.name) || {salary:'', loans:['','','','','',''], days:[1,1,1,1,1,1]};
            return `
                <tr id="row-${i}">
                    <td>${i+1}</td>
                    <td class="col-name">${worker.name}</td>
                    <td><input type="number" class="num-input salary" value="${sD.salary}" oninput="calc(${i})"></td>
                    ${[0,1,2,3,4,5].map(j => `
                        <td>
                            <select class="att-select d${j}" onchange="updateStyle(this); calc(${i})">
                                <option value="1" ${sD.days[j]==1?'selected':''}>1</option>
                                <option value="0.5" ${sD.days[j]==0.5?'selected':''}>½</option>
                                <option value="0" ${sD.days[j]==0?'selected':''}>0</option>
                            </select>
                            <input type="number" class="loan-input l${j}" value="${sD.loans[j] || ''}" oninput="calc(${i})">
                        </td>`).join('')}
                    <td id="t-loan-${i}" style="color:var(--danger); font-weight:bold; font-size:13px;"></td>
                    <td id="net-${i}" class="col-net"></td>
                </tr>`;
        }).join('');
        document.querySelectorAll('.att-select').forEach(sel => updateStyle(sel));
        activeWorkers.forEach((_, i) => calc(i));
    }

    function updateStyle(sel) { 
        sel.classList.remove('half', 'zero'); 
        if(sel.value == "0.5") sel.classList.add('half'); 
        else if(sel.value == "0") sel.classList.add('zero'); 
    }
    
    function calc(id) {
        const row = document.getElementById(`row-${id}`); if(!row) return;
        const s = parseFloat(row.querySelector('.salary').value) || 0;
        const loans = [0,1,2,3,4,5].map(j => row.querySelector(`.l${j}`).value);
        const days = [0,1,2,3,4,5].map(j => row.querySelector(`.d${j}`).value);
        const res = calculateData(s, loans, days);
        document.getElementById(`t-loan-${id}`).innerText = res.totalLoans;
        document.getElementById(`net-${id}`).innerText = res.net;
        updateDashboard();
    }

    function updateDashboard() {
        let tSal = 0, tLoan = 0, tNet = 0;
        document.querySelectorAll('#payrollBody tr').forEach(row => {
            tSal += parseFloat(row.querySelector('.salary').value) || 0;
            tLoan += parseFloat(row.querySelector('[id^="t-loan-"]').innerText) || 0;
            tNet += parseFloat(row.querySelector('[id^="net-"]').innerText) || 0;
        });
        document.getElementById('d-sal').innerText = tSal.toFixed(2);
        document.getElementById('d-loan').innerText = tLoan.toFixed(2);
        document.getElementById('d-net').innerText = tNet.toFixed(2);
    }

    function saveWeeklyData() {
        const w = document.getElementById('weekSelect').value;
        const data = Array.from(document.querySelectorAll('#payrollBody tr')).map(row => ({
            name: row.querySelector('.col-name').innerText, 
            salary: row.querySelector('.salary').value,
            loans: [0,1,2,3,4,5].map(j => row.querySelector(`.l${j}`).value),
            days: [0,1,2,3,4,5].map(j => row.querySelector(`.d${j}`).value)
        }));
        localStorage.setItem(`f_week_data_${w}`, JSON.stringify(data));
        document.getElementById('success-msg').style.display = 'block';
        setTimeout(() => document.getElementById('success-msg').style.display = 'none', 1500);
        showWorkerArchive(); 
    }

    function updateArchiveDropdown() {
        const select = document.getElementById('archiveWorkerSelect');
        const current = select.value;
        select.innerHTML = '<option value="">-- اختر اسماً --</option>' + 
            Array.from(new Set(workers.map(w => w.name))).map(n => `<option value="${n}">${n}</option>`).join('');
        select.value = current;
    }

    function showWorkerArchive() {
        const name = document.getElementById('archiveWorkerSelect').value;
        const display = document.getElementById('archiveDisplay');
        const body = document.getElementById('archiveTableBody');
        const weekSelect = document.getElementById('weekSelect');
        if(!name) { display.style.display='none'; return; }
        display.style.display='block';
        let total = 0, historyHTML = "";
        for(let i=1; i<=52; i++) {
            const data = JSON.parse(localStorage.getItem(`f_week_data_${i}`)) || [];
            const rec = data.find(r => r.name === name);
            if(rec && rec.salary > 0) {
                const res = calculateData(parseFloat(rec.salary), rec.loans, rec.days);
                total += parseFloat(res.net);
                historyHTML += `<tr><td>${weekSelect.options[i-1].text.split(' / ')[0]}</td><td>${rec.salary}</td><td>${res.att}</td><td>${res.totalLoans}</td><td style="font-weight:bold; color:var(--success-blue)">${res.net}</td></tr>`;
            }
        }
        document.getElementById('archStats').innerText = `إجمالي القبض للفترة المحددة : ${total.toFixed(2)} ج.م`;
        body.innerHTML = historyHTML;
    }

    function exportData() {
        let all = { workers: workers };
        for(let i=1; i<=52; i++) { let k = `f_week_data_${i}`; let v = localStorage.getItem(k); if(v) all[k] = JSON.parse(v); }
        let blob = new Blob([JSON.stringify(all)], {type: 'application/json'});
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `حسابات_فرح_2026.json`; a.click();
    }

    function importData(event) {
        let file = event.target.files[0]; if(!file) return;
        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let data = JSON.parse(e.target.result);
                if(confirm("استبدال البيانات الحالية؟")) {
                    localStorage.clear();
                    if(data.workers) localStorage.setItem('f_workers_2026', JSON.stringify(data.workers));
                    Object.keys(data).forEach(k => { if(k.startsWith('f_week_data_')) localStorage.setItem(k, JSON.stringify(data[k])); });
                    location.reload();
                }
            } catch(err) { alert("خطأ!"); }
        }; reader.readAsText(file);
    }
    window.onload = init;
</script>
</body>
</html>
