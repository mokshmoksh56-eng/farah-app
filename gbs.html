<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر عناوين الزبائن</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div id="auth-loader" class="fixed inset-0 bg-gray-50 z-[9999] flex flex-col justify-center items-center text-blue-600 font-bold text-center p-5">
        <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
        ⏳ جاري التحقق...
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full shadow-lg hidden z-50 text-sm font-bold">✅ تم الحفظ</div>

    <div id="app-screen" style="display:none;" class="max-w-md mx-auto px-4 pt-6 pb-20">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-xl mb-6 text-center">
            <h1 class="text-2xl font-bold">دفتر الزبائن</h1>
            <span id="sync-status" class="text-[10px] bg-black/20 px-2 py-1 rounded-full font-bold">🔄 جاهز</span>
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="showTab('add')" id="tabAddBtn" class="flex-1 py-2 rounded-xl font-bold bg-blue-600 text-white shadow">➕ إضافة</button>
            <button onclick="showTab('list')" id="tabListBtn" class="flex-1 py-2 rounded-xl font-bold bg-gray-200 text-gray-700">📋 الزبائن</button>
            <button onclick="showTab('search')" id="tabSearchBtn" class="flex-1 py-2 rounded-xl font-bold bg-gray-200 text-gray-700">🔍 بحث</button>
        </div>

        <div id="addTab" class="bg-white p-6 rounded-2xl shadow-md mb-6">
            <form id="customerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">اسم الزبون *</label>
                    <input type="text" id="name" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">🏠 العنوان *</label>
                    <textarea id="address" required class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                </div>
                <button type="button" onclick="getLocation()" class="w-full bg-emerald-500 text-white py-2 rounded-xl font-bold"><i class="fas fa-location-dot"></i> تحديد الموقع</button>
                <input type="hidden" id="lat"><input type="hidden" id="lng">
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold">حفظ الزبون</button>
            </form>
        </div>

        <div id="listTab" class="bg-white p-6 rounded-2xl shadow-md hidden">
            <div id="customersList" class="space-y-3"></div>
        </div>

        <div id="searchTab" class="bg-white p-6 rounded-2xl shadow-md hidden">
            <input type="text" id="searchInput" placeholder="ابحث باسم الزبون..." class="w-full p-3 border rounded-xl mb-4">
            <div id="searchResults" class="space-y-3"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // (يتم وضع إعدادات Firebase الخاصة بك هنا كما كانت)
        const firebaseConfig = { /* ... */ };
        const app = initializeApp(firebaseConfig);
        const fdb = getDatabase(app);
        const auth = getAuth(app);
        let customersData = {}, windowUserUid, customersRef;

        window.showTab = function(tab) {
            document.getElementById('addTab').classList.toggle('hidden', tab !== 'add');
            document.getElementById('listTab').classList.toggle('hidden', tab !== 'list');
            document.getElementById('searchTab').classList.toggle('hidden', tab !== 'search');
        };

        window.renderCustomers = function(data = customersData, containerId = "customersList") {
            const container = document.getElementById(containerId);
            const arr = Object.keys(data).map(k => ({id: k, ...data[k]})).reverse();
            container.innerHTML = arr.length ? arr.map(cus => `
                <div class="p-4 bg-gray-50 rounded-xl border">
                    <h3 class="font-bold text-gray-800">${cus.name}</h3>
                    <p class="text-sm text-gray-600 mt-1">${cus.address}</p>
                    <a href="https://www.google.com/maps/search/?api=1&query=${cus.lat},${cus.lng}" target="_blank" class="text-blue-600 text-xs font-bold mt-2 block">📍 عرض الخريطة</a>
                </div>
            `).join('') : '<p class="text-center text-gray-400">لا يوجد بيانات</p>';
        };

        document.getElementById("customerForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const newCustomer = { 
                name: document.getElementById("name").value, 
                address: document.getElementById("address").value,
                lat: document.getElementById("lat").value,
                lng: document.getElementById("lng").value
            };
            push(customersRef, newCustomer).then(() => {
                document.getElementById("customerForm").reset();
                window.showTab('list');
            });
        });

        document.getElementById("searchInput").addEventListener("input", (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = Object.fromEntries(Object.entries(customersData).filter(([_, v]) => v.name.toLowerCase().includes(val)));
            renderCustomers(filtered, "searchResults");
        });

        // تشغيل Auth
        onAuthStateChanged(auth, user => {
            if (user) {
                windowUserUid = user.uid;
                customersRef = ref(fdb, 'backups/gbs/' + windowUserUid);
                onValue(customersRef, (snap) => {
                    customersData = snap.val() || {};
                    renderCustomers();
                });
                document.getElementById('auth-loader').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
            }
        });
    </script>
</body>
</html>
