<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر عناوين الزبائن - متصل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #sync-status { font-size: 12px; background: rgba(0,0,0,0.1); padding: 5px 10px; border-radius: 20px; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div id="auth-loader" class="fixed inset-0 bg-gray-50 z-[9999] flex flex-col justify-center items-center text-blue-600 font-bold text-center p-5">
        <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
        ⏳ جاري فحص الحساب والمزامنة السحابية...
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full shadow-lg hidden z-50 text-sm font-bold whitespace-nowrap">✅ تم الحفظ والمزامنة بنجاح</div>

    <div id="app-screen" style="display:none;" class="max-w-md mx-auto px-4 pt-6 pb-20">
        
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-xl mb-6 text-center">
            <h1 class="text-xl font-bold">دفتر الزبائن (Azemaa Pro)</h1>
            <div id="sync-status" class="mt-2 inline-block">🔄 جاري المزامنة...</div>
        </div>

        <div class="flex gap-2 mb-4">
            <button onclick="showTab('add')" id="tabAddBtn" class="flex-1 py-2 rounded-xl font-bold bg-blue-600 text-white shadow">➕ إضافة</button>
            <button onclick="showTab('list')" id="tabListBtn" class="flex-1 py-2 rounded-xl font-bold bg-gray-200 text-gray-700">📋 الزبائن</button>
            <button onclick="showTab('search')" id="tabSearchBtn" class="flex-1 py-2 rounded-xl font-bold bg-gray-200 text-gray-700">🔍 بحث</button>
        </div>

        <div id="addTab" class="bg-white p-6 rounded-2xl shadow-md mb-6">
            <form id="customerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">اسم الزبون</label>
                    <input type="text" id="name" required placeholder="اكتب الاسم هنا" class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700">العنوان / المكان</label>
                    <textarea id="address" required placeholder="تفاصيل العنوان..." class="w-full mt-1 p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500" rows="3"></textarea>
                </div>
                <button type="button" id="locBtn" onclick="getLocation()" class="w-full bg-emerald-500 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-600 transition">
                    <i class="fas fa-location-dot"></i> تحديد الموقع الحالي
                </button>
                <input type="hidden" id="lat"><input type="hidden" id="lng">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg">حفظ ومزامنة ✅</button>
            </form>
        </div>

        <div id="listTab" class="bg-white p-6 rounded-2xl shadow-md hidden">
            <div id="customersList" class="space-y-3"></div>
        </div>

        <div id="searchTab" class="bg-white p-6 rounded-2xl shadow-md hidden">
            <input type="text" id="searchInput" placeholder="ابحث باسم الزبون..." class="w-full p-3 border rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 outline-none">
            <div id="searchResults" class="space-y-3"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const fdb = getDatabase(app);
        const auth = getAuth(app);
        
        let customersData = {}, windowUserUid, customersRef;

        window.updateSyncStatus = (msg, isSuccess = true) => {
            const status = document.getElementById('sync-status');
            status.innerText = msg;
            status.style.background = isSuccess ? "rgba(39, 174, 96, 0.2)" : "rgba(231, 76, 60, 0.2)";
        };

        // دالة الموقع المحدثة بالعد التنازلي
        window.getLocation = () => {
            const btn = document.getElementById('locBtn');
            const originalText = btn.innerHTML;
            let seconds = 10;
            btn.disabled = true;
            
            const timer = setInterval(() => {
                seconds--;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> جاري التحديد... (${seconds}ث)`;
                if (seconds <= 0) clearInterval(timer);
            }, 1000);
            
            navigator.geolocation.getCurrentPosition(pos => {
                clearInterval(timer);
                document.getElementById("lat").value = pos.coords.latitude;
                document.getElementById("lng").value = pos.coords.longitude;
                btn.innerHTML = '<i class="fas fa-check"></i> تم تحديد الموقع';
                btn.className = "w-full bg-green-600 text-white py-2.5 rounded-xl font-bold transition";
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    btn.className = "w-full bg-emerald-500 text-white py-2.5 rounded-xl font-bold hover:bg-emerald-600 transition";
                }, 2000);
            }, () => {
                clearInterval(timer);
                alert("فشل تحديد الموقع!");
                btn.disabled = false;
                btn.innerHTML = originalText;
            }, { enableHighAccuracy: true, timeout: 10000 });
        };

        window.showTab = function(tab) {
            document.getElementById('addTab').classList.toggle('hidden', tab !== 'add');
            document.getElementById('listTab').classList.toggle('hidden', tab !== 'list');
            document.getElementById('searchTab').classList.toggle('hidden', tab !== 'search');
            document.getElementById('tabAddBtn').className = `flex-1 py-2 rounded-xl font-bold ${tab === 'add' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`;
            document.getElementById('tabListBtn').className = `flex-1 py-2 rounded-xl font-bold ${tab === 'list' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`;
            document.getElementById('tabSearchBtn').className = `flex-1 py-2 rounded-xl font-bold ${tab === 'search' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700'}`;
        };

        window.renderCustomers = (data = customersData, containerId = "customersList") => {
            const container = document.getElementById(containerId);
            const arr = Object.keys(data).map(k => ({id: k, ...data[k]})).reverse();
            container.innerHTML = arr.length ? arr.map(cus => `
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <h3 class="font-bold text-gray-800">${cus.name}</h3>
                    <p class="text-sm text-gray-600 mt-1">${cus.address}</p>
                    <a href="https://www.google.com/maps/search/?api=1&query=${cus.lat},${cus.lng}" target="_blank" class="text-blue-600 text-xs font-bold mt-2 block">📍 عرض على الخريطة</a>
                </div>
            `).join('') : '<p class="text-center text-gray-400">لا توجد بيانات</p>';
        };

        document.getElementById("customerForm").addEventListener("submit", (e) => {
            e.preventDefault();
            window.updateSyncStatus("⚡ جاري الحفظ والمزامنة...");
            push(customersRef, {
                name: document.getElementById("name").value,
                address: document.getElementById("address").value,
                lat: document.getElementById("lat").value || 0,
                lng: document.getElementById("lng").value || 0
            }).then(() => {
                document.getElementById("customerForm").reset();
                window.showTab('list');
                window.updateSyncStatus("✅ مزامن لحظياً");
                const t = document.getElementById('toast');
                t.classList.remove('hidden');
                setTimeout(() => t.classList.add('hidden'), 2000);
            });
        });

        onAuthStateChanged(auth, user => {
            if (user) {
                windowUserUid = user.uid;
                customersRef = ref(fdb, 'gbs/' + windowUserUid);
                onValue(customersRef, (snap) => {
                    customersData = snap.val() || {};
                    renderCustomers();
                    document.getElementById('auth-loader').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'block';
                    window.updateSyncStatus("✅ مزامن لحظياً");
                });
            }
        });
    </script>
</body>
</html>
