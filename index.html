<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>azemaa pro - النسخة المستقلة</title>
    <style>
        :root { --bg-main: #eef2f7; --card-bg: #ffffff; --text-color: #2d3436; --header-grad: linear-gradient(135deg, #8ba4f9 0%, #6e8efb 50%, #a777e3 100%); --whatsapp-green: #25D366; --card-radius: 15px; }
        body.dark-mode { --bg-main: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: var(--bg-main); color: var(--text-color); transition: 0.3s; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg-main); z-index: 100000; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .login-box { background: var(--card-bg); padding: 30px; border-radius: var(--card-radius); box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center; }
        .login-box button { width: 100%; padding: 12px; background: #6e8efb; border: none; color: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-top: 5px; display: none; }

        header { position: relative; background: var(--header-grad); color: #fff; padding: 15px; border-radius: var(--card-radius); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .header-center { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #2ecc71; }
        
        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { border: none; color: #fff; padding: 12px 4px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-align: center; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        .btn-whatsapp { background: #25D366; }
        .btn-device { background: #a29bfe; }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 350px; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2px solid #ddd; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; cursor: pointer; }
        .h { padding: 12px 15px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 10; cursor: pointer; }
        .zoom-btn { background: rgba(255,255,255,0.25); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .card.fullscreen .overlay { display: none; }
        iframe { flex: 1; border: none; width: 100%; pointer-events: none; }
        .card.fullscreen iframe { pointer-events: auto; }
        .holidays-dropdown { display: none; background: var(--card-bg); border: 2px solid #25D366; position: absolute; top: 80px; right: 10px; z-index: 100; padding: 10px; border-radius: 15px; width: 280px; max-width: 90vw; max-height: 300px; overflow-y: auto; }
        .holidays-dropdown.show { display: block; }
        .holiday-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; display: flex; justify-content: space-between; }
        @media (max-width: 550px) { .header-center { position: static; transform: none; order: 3; width: 100%; justify-content: center; margin-top: 10px; } .sync-box { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h3>🔐 azemaa pro - التفعيل</h3>
        <p style="font-size: 13px; color: #7f8c8d;">أدخل كود التفعيل لبدء العمل</p>
        <input type="text" id="license-key" placeholder="كود التفعيل">
        <div id="login-error" class="error-msg">❌ كود التفعيل غير صحيح</div>
        <button id="login-btn">▶️ تشغيل النظام</button>
        <p style="font-size: 11px; margin-top: 15px;">للحصول على كود التفعيل: <strong>واتساب 01234567890</strong></p>
    </div>
</div>

<header>
    <div>
        <div id="digital-clock" style="font-weight:bold; font-size: 1.2rem;">00:00</div>
        <div id="digital-date" style="font-size: 0.9rem;">0000/00/00</div>
        <div id="countdown" onclick="toggleHolidaysDropdown(event)" style="font-size: 0.75rem; cursor: pointer;">جاري التحميل...</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <button onclick="toggleTheme()" style="background:none; border:none; color:white; cursor:pointer; font-size: 1.4rem;">🌙</button>
        <button id="logout-btn" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">خروج 🚪</button>
    </div>
    <div class="header-center network-status" id="network-status"><span class="status-dot"></span><span id="status-text">متصل</span></div>
</header>

<div id="holidaysDropdown" class="holidays-dropdown"></div>

<div class="sync-box">
    <button id="wa-save-btn" class="btn btn-whatsapp">🟢 واتس حفظ (نسخة احتياطية)</button>
    <button id="wa-load-btn" class="btn btn-whatsapp">📥 واتس استرجاع</button>
    <button onclick="window.location.href='agheza.html'" class="btn btn-device">📱 أجهزة</button>
    <button onclick="window.location.href='kmatkitchen.html'" class="btn btn-device">🍳 خامات المطبخ</button>
</div>

<div class="main-container">
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#ff7675;"><span>👤 الزبائن</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="zbon.html"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#00cec9;"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="yom.html"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#6c5ce7;"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="gyab.html"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#e17055;"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="tslem.html"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#fbc531;"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="notmop.html"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#0984e3;"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="takarer.html"></iframe></div>
</div>

<script>
    // ==================== نظام التفعيل (كل عميل له كود مختلف) ====================
    
    // 🔐 هنا تقوم بتعيين كود التفعيل لكل عميل على حدة
    // مثال: العميل أحمد كوده "AHMED2024"، العميل محمد كوده "MOHAMED567"
    const VALID_LICENSE_CODES = ["AZEMAA2024", "ADMIN123", "DEMO123"];
    
    // يمكنك إضافة كود لكل عميل بالطريقة دي:
    // VALID_LICENSE_CODES.push("كود_العميل_الجديد");
    
    function checkAuth() {
        const savedLicense = localStorage.getItem('azemaa_license');
        if (savedLicense && VALID_LICENSE_CODES.includes(savedLicense)) {
            document.getElementById('login-overlay').style.display = 'none';
            return true;
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
            return false;
        }
    }
    
    document.getElementById('login-btn').addEventListener('click', () => {
        const license = document.getElementById('license-key').value.trim();
        const errorDiv = document.getElementById('login-error');
        
        if (VALID_LICENSE_CODES.includes(license)) {
            localStorage.setItem('azemaa_license', license);
            errorDiv.style.display = 'none';
            document.getElementById('login-overlay').style.display = 'none';
            document.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
        } else {
            errorDiv.style.display = 'block';
        }
    });
    
    document.getElementById('logout-btn').addEventListener('click', () => {
        if(confirm("هل تريد تسجيل الخروج؟")) {
            localStorage.removeItem('azemaa_license');
            localStorage.clear();
            window.location.reload();
        }
    });
    
    checkAuth();
    
    // ==================== باقي دوال النظام ====================
    
    function toggleZoom(card, event) {
        if(event) event.stopPropagation();
        if (card.classList.contains('fullscreen')) {
            card.classList.remove('fullscreen');
            card.querySelector('.zoom-btn').innerText = "تكبير";
        } else {
            document.querySelectorAll('.card.fullscreen').forEach(c => {
                c.classList.remove('fullscreen');
                c.querySelector('.zoom-btn').innerText = "تكبير";
            });
            card.classList.add('fullscreen');
            card.querySelector('.zoom-btn').innerText = "إغلاق";
        }
    }
    
    const holidays = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026").getTime() },
        { name: "رأس السنة الهجرية 🌙", date: new Date("June 16, 2026").getTime() },
        { name: "المولد النبوي الشريف 🕌", date: new Date("September 5, 2026").getTime() }
    ];
    
    function updateHeader() {
        const now = new Date();
        document.getElementById('digital-clock').innerText = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        document.getElementById('digital-date').innerText = now.toLocaleDateString('ar-EG');
        let next = holidays.find(h => h.date > now.getTime()) || holidays[0];
        let diff = Math.ceil((next.date - now.getTime()) / (1000 * 60 * 60 * 24));
        document.getElementById('countdown').innerText = "باقي " + diff + " يوم على " + next.name;
    }
    
    function toggleHolidaysDropdown(event) {
        if(event) event.stopPropagation();
        const drop = document.getElementById('holidaysDropdown');
        drop.classList.toggle('show');
        if(drop.classList.contains('show')) {
            drop.innerHTML = holidays.map(h => `<div class="holiday-item"><span>${h.name}</span><span>${new Date(h.date).toLocaleDateString('ar-EG')}</span></div>`).join('');
        }
    }
    
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    
    setInterval(updateHeader, 60000);
    updateHeader();
    
    // دوال الواتساب للنسخ الاحتياطي
    function saveToWhatsApp() {
        let allData = {};
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            if (key !== 'theme' && key !== 'azemaa_license') {
                allData[key] = localStorage.getItem(key);
            }
        }
        if (Object.keys(allData).length === 0) {
            alert("⚠️ لا توجد بيانات للحفظ.");
            return;
        }
        const dataString = JSON.stringify(allData);
        const msg = `*📋 نسخة احتياطية - azemaa pro*\n\n${dataString}\n\n🔄 للاسترجاع: انسخ النص بالكامل واستخدم زر الاسترجاع`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }
    
    function loadFromWhatsApp() {
        const code = prompt("📋 الصق النص الكامل للنسخة الاحتياطية:");
        if (!code) return;
        try {
            let cleanCode = code.replace(/\*📋 نسخة احتياطية - azemaa pro\*\*\n\n/g, '').replace(/\n\n🔄 للاسترجاع.*/g, '').trim();
            const data = JSON.parse(cleanCode);
            if (confirm(`تم العثور على ${Object.keys(data).length} عنصر. هل تريد الاستعادة؟`)) {
                const license = localStorage.getItem('azemaa_license');
                localStorage.clear();
                if (license) localStorage.setItem('azemaa_license', license);
                for (let key in data) {
                    localStorage.setItem(key, data[key]);
                }
                alert("✅ تم الاسترجاع بنجاح!");
                document.querySelectorAll('iframe').forEach(f => { f.src = f.src; });
            }
        } catch (error) {
            alert("❌ فشل الاسترجاع: " + error.message);
        }
    }
    
    document.getElementById('wa-save-btn').addEventListener('click', saveToWhatsApp);
    document.getElementById('wa-load-btn').addEventListener('click', loadFromWhatsApp);
</script>
</body>
</html>
