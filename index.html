<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Full Integrated Cyber Edition</title>
    <!-- استيراد أيقونات FontAwesome للآلة الحاسبة وأيقونات الوضع الليلي -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ستايل نظام الدخول (Login Overlay) --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #1e293b; padding: 40px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center;
            width: 90%; max-width: 400px; border: 2px solid #00cec9;
            color: white;
        }
        .pin-input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155;
            background: #0f172a; color: white; text-align: center; font-size: 1.5rem;
            margin: 20px 0; outline: none; box-sizing: border-box;
        }
        .btn-login {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: #00a8ff; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1.1rem;
        }
        .btn-login:hover { background: #00cec9; color: #0f172a; }

        /* --- إخفاء المحتوى الأصلي حتى تسجيل الدخول --- */
        #appContent { display: none; }

        /* --- متغيرات الألوان للوضع الليلي والنهاري (CSS Variables) --- */
        :root { 
            --bg-main: #0f172a; /* الخلفية الأولى الأصلية */
            --card-bg: #1e293b; /* خلفية الكروت الأصلية */
            --text-color: #f1f5f9;
            --turquoise: #00cec9;
            --deep-red: #ff7675;
            --cloud-blue: #00a8ff;
            --border-color: transparent;
        }

        /* ألوان الوضع المضيء المعدلة للحفاظ على هويتك البصرية */
        body.light-mode {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --border-color: #cbd5e1;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 12px; background: var(--bg-main); color: var(--text-color); transition: 0.3s; }
        
        /* --- الهيدر العلوي المطور --- */
        header { 
            background: linear-gradient(135deg, #6e8efb, #a777e3); 
            color: #fff; padding: 12px 15px; border-radius: 20px; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }
        .header-left { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .system-title { font-size: 1.1rem; font-weight: 800; color: #fff; }
        #digital-clock { font-size: 1.1rem; font-weight: bold; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #countdown-container { font-size: 0.85rem; font-weight: bold; color: #fff; background: rgba(0, 0, 0, 0.2); padding: 4px 10px; border-radius: 10px; transition: 0.5s; }
        
        .header-right { display: flex; align-items: center; gap: 12px; }
        .theme-toggle-btn { background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        .theme-toggle-btn:hover { transform: scale(1.1); }

        /* أزرار المزامنة السحابية */
        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .btn { border: none; color: #fff; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .btn-cloud { background: var(--cloud-blue); }
        .btn-cloud:hover { opacity: 0.9; }
        
        /* الحاويات والكروت */
        .main-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
        .card { background: var(--card-bg); border-radius: 20px; height: 420px; overflow: hidden; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; transition: 0.3s; display: flex; flex-direction: column; }
        
        /* ألوان حدود الأقسام والتنسيق الأصلي المعزز */
        .card-zbon { border-color: #ff7675; } .h-zbon { background: #ff7675; color: white; }
        .card-yom { border-color: #00cec9; } .h-yom { background: #00cec9; color: white; }
        .card-gyab { border-color: #6c5ce7; } .h-gyab { background: #6c5ce7; color: white; }
        .card-tslem { border-color: #e17055; } .h-tslem { background: #e17055; color: white; }
        .card-takarer { border-color: #0984e3; } .h-takarer { background: #0984e3; color: white; }
        
        .h { padding: 15px 20px; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; cursor: pointer; }
        
        .fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .fullscreen .overlay { display: none; }

        /* --- ستايل الآلة الحاسبة العائمة --- */
        #calcWidget {
            position: fixed; bottom: 20px; left: 20px; z-index: 10000;
            font-family: sans-serif; direction: ltr;
        }
        .calc-toggle {
            width: 60px; height: 60px; border-radius: 50%; background: var(--turquoise);
            color: #0f172a; border: none; font-size: 1.6rem; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,206,201,0.4); display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .calc-toggle:hover { transform: scale(1.05); }
        .calc-body {
            position: absolute; bottom: 70px; left: 0; background: #1e293b;
            border: 2px solid var(--turquoise); width: 280px; padding: 15px;
            border-radius: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: none; flex-direction: column; gap: 10px;
        }
        .calc-screen {
            width: 100%; height: 50px; background: #0f172a; border: 1px solid #334155;
            color: var(--turquoise); text-align: right; padding: 10px; font-size: 1.4rem;
            border-radius: 8px; box-sizing: border-box; outline: none;
        }
        .calc-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .calc-btn {
            padding: 12px; background: #334155; border: none; color: white;
            font-size: 1.1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s;
        }
        .calc-btn:hover { background: #475569; }
        .calc-btn.op { background: #ff7675; }
        .calc-btn.eq { background: var(--turquoise); color: #0f172a; grid-row: span 2; height: auto; }
        .calc-btn.clear { background: #64748b; }
    </style>
</head>
<body>

<!-- واجهة تسجيل الدخول -->
<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color: #00cec9;">🚀 azemaa pro</h2>
        <p>أدخل كود الوصول الخاص بك</p>
        <input type="password" id="userPin" class="pin-input" placeholder="****" inputmode="numeric" maxlength="6">
        <button type="button" id="loginBtn" class="btn-login">دخول النظام</button>
        <p id="errorMsg" style="color: #ff7675; margin-top: 15px; display: none;">الكود غير صحيح!</p>
    </div>
</div>

<!-- المحتوى الرئيسي للتطبيق -->
<div id="appContent">
    <header>
        <div class="header-left">
            <span class="system-title">🚀 azemaa pro</span>
            <!-- الساعة الرقمية المحدثة لتعمل بـ ص وم -->
            <div id="digital-clock">12:00:00 ص</div>
            <!-- شريط العداد التنازلي المدمج جنب الساعة -->
            <div id="countdown-container">جرٍ حساب المناسبات القادمة...</div>
        </div>
        <div class="header-right">
            <!-- أيقونة التبديل السريع للوضع الليلي والنهاري -->
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="تبديل المظهر">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
            </button>
            <button id="logoutBtn" class="btn" style="background:#ff7675; padding:5px 10px; font-size:0.7rem;">خروج</button>
        </div>
    </header>

    <div class="sync-box">
        <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ سحابي</button>
        <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    </div>

    <div class="main-container">
        <div class="card card-zbon" ondblclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-zbon"><span>👤 القسم الرئيسي</span><button style="background:rgba(255,255,255,0.2); border:none; color:inherit; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="zbon.html"></iframe>
        </div>
        <div class="card card-yom" ondblclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-yom"><span>💸 الخزينة</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="yom.html"></iframe>
        </div>
        <div class="card card-gyab" ondblclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-gyab"><span>👷 العمال</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="gyab.html"></iframe>
        </div>
        <div class="card card-tslem" ondblclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-tslem"><span>📅 التسليم</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="tslem.html"></iframe>
        </div>
        <div class="card card-takarer" ondblclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-takarer"><span>📊 التقارير</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="takarer.html"></iframe>
        </div>
    </div>
</div>

<!-- نظام الآلة الحاسبة العائمة -->
<div id="calcWidget">
    <button class="calc-toggle" onclick="toggleCalc()"><i class="fa-solid fa-calculator"></i></button>
    <div class="calc-body" id="calcBody">
        <input type="text" class="calc-screen" id="calcScreen" readonly placeholder="0">
        <div class="calc-buttons">
            <button class="calc-btn clear" onclick="clearCalc()">C</button>
            <button class="calc-btn op" onclick="pressOp('/')">/</button>
            <button class="calc-btn op" onclick="pressOp('*')">*</button>
            <button class="calc-btn op" onclick="pressOp('-')">-</button>
            
            <button class="calc-btn" onclick="pressNum('7')">7</button>
            <button class="calc-btn" onclick="pressNum('8')">8</button>
            <button class="calc-btn" onclick="pressNum('9')">9</button>
            <button class="calc-btn op" onclick="pressOp('+')">+</button>
            
            <button class="calc-btn" onclick="pressNum('4')">4</button>
            <button class="calc-btn" onclick="pressNum('5')">5</button>
            <button class="calc-btn" onclick="pressNum('6')">6</button>
            <button class="calc-btn eq" onclick="calculateResult()">=</button>
            
            <button class="calc-btn" onclick="pressNum('1')">1</button>
            <button class="calc-btn" onclick="pressNum('2')">2</button>
            <button class="calc-btn" onclick="pressNum('3')">3</button>
            
            <button class="calc-btn" style="grid-column: span 2;" onclick="pressNum('0')">0</button>
            <button class="calc-btn" onclick="pressNum('.')">.</button>
        </div>
    </div>
</div>

<!-- أكواد السكريبت والتحكم الكاملة -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // سكريبت تحديث الساعة بنظام 12 ساعة (ص / م)
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'م' : 'ص';
        
        hours = hours % 12;
        hours = hours ? hours : 12; // تحويل الساعة 0 إلى 12
        const formattedHours = String(hours).padStart(2, '0');

        document.getElementById('digital-clock').innerText = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
    }

    function checkAuth() {
        if(localStorage.getItem('azemaa_user_pin')) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            
            // تشغيل الساعة فوراً وتحديثها دورياً
            updateClock();
            setInterval(updateClock, 1000);
            
            startHolidaysCarousel();
        }
    }

    function startHolidaysCarousel() {
        const getHolidays = () => {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            const list = [
                { name: "رمضان المبارك 🌙", date: new Date(currentYear, 1, 17) }, 
                { name: "عيد الفطر المبارك 🎉", date: new Date(currentYear, 2, 20) },
                { name: "عيد الأضحى المبارك 🕋", date: new Date(currentYear, 4, 27) },
                { name: "عيد تحرير سيناء 🎖️", date: new Date(currentYear, 3, 25) },
                { name: "عيد العمال 👷", date: new Date(currentYear, 4, 1) },
                { name: "ثورة 23 يوليو 💥", date: new Date(currentYear, 6, 23) },
                { name: "نصر 6 أكتوبر 🎖️", date: new Date(currentYear, 9, 6) }
            ];

            list.forEach(h => {
                if (now > h.date) h.date.setFullYear(currentYear + 1);
            });

            return list.sort((a, b) => a.date - b.date);
        };

        const holidays = getHolidays();
        let index = 0;

        const updateDisplay = () => {
            const now = new Date();
            const currentEvent = holidays[index];
            const diffTime = currentEvent.date - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('countdown-container').innerText = `باقي على ${currentEvent.name}: ${diffDays} يوم`;
            
            index = (index + 1) % holidays.length;
        };

        updateDisplay();
        setInterval(updateDisplay, 5000);
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const pin = document.getElementById('userPin').value;
        try {
            const snapshot = await get(child(ref(db), 'authorized_users/' + pin));
            if (snapshot.exists()) {
                localStorage.setItem('azemaa_user_pin', pin);
                localStorage.setItem('azemaa_user_name', snapshot.val().name);
                checkAuth();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        } catch (e) { alert("خطأ اتصال بالنظام"); }
    });

    document.getElementById('cloud-save-btn').addEventListener('click', async () => {
        const pin = localStorage.getItem('azemaa_user_pin');
        let data = {};
        for (let i = 0; i < localStorage.length; i++) {
            let k = localStorage.key(i);
            if (!k.includes('.') && !k.includes('#')) data[k] = localStorage.getItem(k);
        }
        await set(ref(db, 'backups/user_' + pin), data);
        alert("✅ تم الحفظ سحابياً بنجاح.");
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('azemaa_user_pin');
        location.reload();
    });

    window.toggleZoom = (card) => {
        const isFullscreen = card.classList.contains('fullscreen');
        if (!isFullscreen) {
            card.classList.add('fullscreen');
            history.pushState({ isMaximized: true }, "");
        } else {
            card.classList.remove('fullscreen');
        }
    };

    window.addEventListener('popstate', (event) => {
        const activeFullscreenCard = document.querySelector('.card.fullscreen');
        if (activeFullscreenCard) {
            activeFullscreenCard.classList.remove('fullscreen');
        }
    });

    checkAuth();
</script>

<script>
    // --- سكريبت تبديل الوضع (ليلي / نهاري) ---
    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const icon = document.getElementById('themeIcon');
        if(document.body.classList.contains('light-mode')) {
            icon.className = 'fa-solid fa-sun';
        } else {
            icon.className = 'fa-solid fa-moon';
        }
    }

    // --- سكريبت تشغيل الآلة الحاسبة المدمجة ---
    const screen = document.getElementById('calcScreen');
    
    function toggleCalc() {
        const body = document.getElementById('calcBody');
        body.style.display = (body.style.display === 'flex') ? 'none' : 'flex';
    }
    function pressNum(num) {
        if(screen.value === '0') screen.value = '';
        screen.value += num;
    }
    function pressOp(op) {
        screen.value += " " + op + " ";
    }
    function clearCalc() {
        screen.value = '';
    }
    function calculateResult() {
        try {
            screen.value = eval(screen.value);
        } catch (e) {
            screen.value = 'Error';
        }
    }
</script>
</body>
</html>
