<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - لوحة التحكم</title>
    <script>
        if (sessionStorage.getItem("isAllowed") !== "true") {
            window.location.replace("login.html");
        }
    </script>
    <style>
        :root { 
            --bg-main: #eef2f7; --card-bg: #ffffff; --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366; --cloud-blue: #00a8ff; --card-radius: 20px;
        }
        body.dark-mode { --bg-main: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; background: var(--bg-main); color: var(--text-color); display: flex; flex-direction: column; gap: 15px; transition: 0.3s; }
        header { background: var(--header-grad); color: #fff; padding: 10px 15px; border-radius: var(--card-radius); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #digital-clock { font-size: 1rem; font-weight: bold; }
        #countdown { font-size: 0.75rem; font-weight: bold; margin-top: 2px; }
        .main-container { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 420px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: transparent; z-index: 5; cursor: pointer; }
        .card.fullscreen .overlay { display: none; }
        .h { padding: 15px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; }
        .logout-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--card-bg); border: 2px solid #ff7675; padding: 25px; border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.4); z-index: 20000; width: 310px; text-align: center; }
        .logout-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-confirm { background: #ff7675; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; flex: 1; }
        .btn-cancel { background: #2d3436; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; flex: 1; }
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 19999; }
    </style>
</head>
<body>

<header>
    <div>
        <div id="digital-clock">00:00:00 ص</div>
        <div id="countdown">تحميل المواعيد...</div>
    </div>
    <button onclick="document.body.classList.toggle('dark-mode')" style="background:rgba(255,255,255,0.2); border:none; color:#fff; padding:8px; border-radius:10px;">🌙</button>
</header>

<div class="modal-overlay" id="logoutOverlay"></div>
<div class="logout-modal" id="logoutModal">
    <h3>هل تريد الخروج من azemaa pro؟</h3>
    <p style="font-size: 0.8rem; color: #666;">سيتم حفظ البيانات سحابياً لتأمين الحسابات</p>
    <div class="logout-btns">
        <button class="btn-confirm" id="confirmLogoutBtn">نعم، خروج</button>
        <button class="btn-cancel" onclick="closeLogout()">إلغاء</button>
    </div>
</div>

<div class="main-container">
    <div class="card" style="border-color: #ff7675;"><div class="overlay"></div><div class="h" style="background: #ff7675;">👤 الزبائن</div><iframe src="./zbon.html"></iframe></div>
    <div class="card" style="border-color: #00cec9;"><div class="overlay"></div><div class="h" style="background: #00cec9;">💸 الخزينة</div><iframe src="./yom.html"></iframe></div>
    <div class="card" style="border-color: #6c5ce7;"><div class="overlay"></div><div class="h" style="background: #6c5ce7;">👷 العمال</div><iframe src="./gyab.html"></iframe></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU", authDomain: "azemaa-proo.firebaseapp.com", databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com", projectId: "azemaa-proo" };
    const db = getDatabase(initializeApp(firebaseConfig));

    // العد التنازلي
    const events = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026").getTime() },
        { name: "رمضان المبارك 🌙", date: new Date("February 18, 2027").getTime() }
    ];

    setInterval(() => {
        const now = new Date();
        document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('ar-EG');
        const next = events.find(e => e.date > now.getTime()) || events[0];
        const days = Math.ceil((next.date - now.getTime()) / (1000*60*60*24));
        document.getElementById('countdown').innerHTML = `باقي ${days} يوم على ${next.name}`;
    }, 1000);

    // إدارة الخروج
    window.closeLogout = () => { document.getElementById('logoutModal').style.display = 'none'; document.getElementById('logoutOverlay').style.display = 'none'; };
    window.addEventListener('popstate', () => { 
        if(document.querySelector('.card.fullscreen')) { document.querySelector('.card.fullscreen').classList.remove('fullscreen'); }
        else { history.pushState(null, null, ""); document.getElementById('logoutModal').style.display = 'block'; document.getElementById('logoutOverlay').style.display = 'block'; }
    });
    history.pushState(null, null, "");

    document.getElementById('confirmLogoutBtn').onclick = async () => {
        document.getElementById('confirmLogoutBtn').innerText = "⏳ جاري الحفظ...";
        let data = {}; for (let i=0; i<localStorage.length; i++) data[localStorage.key(i)] = localStorage.getItem(localStorage.key(i));
        await set(ref(db, 'backups/azemaa_main'), data);
        sessionStorage.clear();
        window.location.replace("login.html");
    };

    document.querySelectorAll('.h, .overlay').forEach(el => el.addEventListener('dblclick', () => {
        const c = el.closest('.card'); c.classList.toggle('fullscreen');
        if(c.classList.contains('fullscreen')) history.pushState(null, null, "");
    }));
</script>
</body>
</html>
