<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرح للمطابخ | منظومة الإدارة الشاملة 2026</title>
    <style>
        :root {
            --primary: #0a3d62; --accent: #3c6382; --success: #218c74;
            --bg-odd: #ffffff; --bg-even: #f2f5f7; --active-bg: #fffceb;
            --glow: 0 0 25px rgba(60, 99, 130, 0.6);
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; }

        /* شريط البحث والأدوات */
        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: flex; gap: 10px; flex-wrap: wrap; }
        #searchInput { flex: 2; padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; min-width: 250px; }
        .btn-backup { flex: 1; background: var(--success); color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 900; min-width: 150px; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        .stat-card div { font-size: 16px; font-weight: 900; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

        .card { border-radius: 20px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #ced4da; transition: 0.3s; position: relative; }
        .card:nth-child(odd) { background-color: var(--bg-odd); }
        .card:nth-child(even) { background-color: var(--bg-even); }
        .card:focus-within { background-color: var(--active-bg) !important; border: 3px solid var(--accent); box-shadow: var(--glow); transform: scale(1.01); z-index: 5; }
        .card.paid { border: 3px solid var(--success) !important; background: #f0fff4 !important; }
        .card.fixed-point { border: 4px solid var(--accent); box-shadow: var(--glow); background-color: var(--active-bg) !important; }

        .client-head { font-weight: 900; font-size: 13px; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; color: var(--accent); display: block; }
        label { display: block; font-size: 11px; font-weight: bold; margin-bottom: 2px; color: #444; }
        input, textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 14px; font-weight: 900; margin-bottom: 5px; font-family: inherit; }
        
        .tafqit-box { background: rgba(238, 247, 255, 0.9); color: #0a3d62; padding: 6px; border-radius: 8px; font-size: 11px; font-weight: 800; border-right: 4px solid var(--accent); margin-bottom: 10px; min-height: 15px; }
        .payment-section { background: rgba(255,255,255,0.4); padding: 12px; border-radius: 15px; border: 1px dashed #aaa; margin-bottom: 10px; }
        .pay-row { display: grid; grid-template-columns: 115px 1fr; gap: 8px; margin-bottom: 5px; }

        .result-box { background: var(--primary); color: white; padding: 15px; border-radius: 15px; text-align: center; }
        .result-box .num { font-size: 18px; font-weight: 900; }
        
        .card-footer { display: flex; gap: 8px; margin-top: 15px; }
        .btn-card { flex: 1; padding: 12px; border: none; border-radius: 12px; cursor: pointer; font-weight: 900; color: white; font-size: 14px; }
        .btn-save { background: var(--accent); }
        .btn-wa { background: var(--success); }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 12px 30px; border-radius: 30px; display: none; z-index: 1000; font-weight: 900; }
    </style>
</head>
<body>

<div id="toast">✅ تم التحديث بنجاح</div>
<div class="header"><h1>فرح للمطابخ | 2026</h1></div>

<div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 ابحث باسم العميل أو رقم الهاتف..." onkeyup="filterCards()">
    <button class="btn-backup" onclick="exportData()">📥 نسخة احتياطية</button>
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">0</div></div>
    <div class="stat-card"><h4>عدد الزبائن</h4><div id="stat-cust">0</div></div>
    <div class="stat-card"><h4>خالص السداد</h4><div id="stat-paid">0</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<script>
    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function toArabic(n) {
        n = Math.floor(n); if (n <= 0) return '';
        let res = '';
        if (n >= 1000) {
            let k = Math.floor(n / 1000);
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            n %= 1000;
        }
        res += tafqitBasic(n);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }

    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    const COUNT = 100;
    const grid = document.getElementById('mainGrid');

    // إنشاء الكروت
    for (let i = 1; i <= COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${i}`;
        card.innerHTML = `
            <span class="client-head">كارت رقم ${i}</span>
            <label>👤 الاسم:</label><input type="text" class="c-name" oninput="updateLogic(${i})">
            <label>📱 الموبايل:</label><input type="tel" class="c-phone" placeholder="01..." oninput="updateLogic(${i})">
            <label>💰 الإجمالي:</label><input type="number" class="c-total" oninput="updateLogic(${i})">
            <div class="tafqit-box" id="tafqit-total-${i}"></div>
            
            <div class="payment-section">
                ${[1,2,3,4].map(n => `
                    <div class="pay-row">
                        <input type="date" class="p-date" oninput="updateLogic(${i})">
                        <input type="number" class="p-val" placeholder="المبلغ" oninput="updateLogic(${i})">
                    </div>
                    <div class="tafqit-box" id="tafqit-pay-${i}-${n}" style="font-size:10px;"></div>
                `).join('')}
            </div>

            <label>📝 ملاحظات إضافية:</label>
            <textarea class="c-notes" style="min-height:60px; border:2px solid var(--accent); resize:vertical;" placeholder="تفاصيل الطلب..." oninput="updateLogic(${i})"></textarea>

            <div class="result-box">
                <div class="num" id="rem-n-${i}">0 ج.م</div>
                <div class="word" id="rem-w-${i}" style="font-size:12px; color:#00d2ff;">--</div>
            </div>
            
            <div class="card-footer">
                <button class="btn-card btn-save" onclick="saveFixedBtn(${i})">💾 حفظ ومكان ثابت</button>
                <button class="btn-card btn-wa" onclick="sendWA(${i})">واتساب</button>
            </div>
        `;
        grid.appendChild(card);
    }

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        const total = parseFloat(card.querySelector('.c-total').value) || 0;
        const pays = card.querySelectorAll('.p-val');
        let paid = 0;

        document.getElementById(`tafqit-total-${id}`).innerText = toArabic(total);
        pays.forEach((p, idx) => {
            const v = parseFloat(p.value) || 0; paid += v;
            document.getElementById(`tafqit-pay-${id}-${idx+1}`).innerText = toArabic(v);
        });

        const rem = total - paid;
        document.getElementById(`rem-n-${id}`).innerText = `المتبقي: ${rem.toLocaleString()} ج.م`;
        document.getElementById(`rem-w-${id}`).innerText = total > 0 ? (rem > 0 ? toArabic(rem) : (rem === 0 ? "خالص السداد ✓" : "زيادة")) : "--";

        if (rem <= 0 && total > 0) card.classList.add('paid'); else card.classList.remove('paid');
        
        // حفظ البيانات
        const data = {
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.pay-row')).map(r => ({
                dt: r.querySelector('.p-date').value,
                vl: r.querySelector('.p-val').value
            }))
        };
        localStorage.setItem(`farah_final_v11_${id}`, JSON.stringify(data));
        refreshStats();
    }

    function filterCards() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const name = card.querySelector('.c-name').value.toLowerCase();
            const phone = card.querySelector('.c-phone').value;
            card.style.display = (name.includes(query) || phone.includes(query)) ? "" : "none";
        });
    }

    function exportData() {
        let allData = {};
        for (let i = 1; i <= COUNT; i++) {
            const s = localStorage.getItem(`farah_final_v11_${i}`);
            if (s) allData[i] = JSON.parse(s);
        }
        const blob = new Blob([JSON.stringify(allData, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `بيانات_فرح_للمطابخ_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function saveFixedBtn(id) {
        updateLogic(id);
        localStorage.setItem('farah_fixed_id', id);
        const t = document.getElementById('toast');
        t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500);
    }

    function refreshStats() {
        let debt = 0, cust = 0, paidCount = 0;
        for (let i = 1; i <= COUNT; i++) {
            const s = localStorage.getItem(`farah_final_v11_${i}`);
            if (s) {
                const d = JSON.parse(s);
                if (d.n) {
                    cust++;
                    let pT = 0; if (d.pays) d.pays.forEach(p => pT += parseFloat(p.vl) || 0);
                    let rem = (parseFloat(d.t) || 0) - pT;
                    if (rem > 0) debt += rem;
                    if (rem <= 0 && d.t > 0) paidCount++;
                }
            }
        }
        document.getElementById('stat-debt').innerText = debt.toLocaleString() + ' ج.م';
        document.getElementById('stat-cust').innerText = cust;
        document.getElementById('stat-paid').innerText = paidCount;
    }

    window.onload = () => {
        for (let i = 1; i <= COUNT; i++) {
            const s = localStorage.getItem(`farah_final_v11_${i}`);
            if (s) {
                const d = JSON.parse(s);
                const card = document.getElementById(`card-${i}`);
                card.querySelector('.c-name').value = d.n || '';
                card.querySelector('.c-phone').value = d.p || '';
                card.querySelector('.c-total').value = d.t || '';
                card.querySelector('.c-notes').value = d.notes || '';
                const rows = card.querySelectorAll('.pay-row');
                if (d.pays) {
                    d.pays.forEach((p, idx) => { if(rows[idx]) { rows[idx].querySelector('.p-date').value = p.dt || ''; rows[idx].querySelector('.p-val').value = p.vl || ''; }});
                }
                updateLogic(i);
            }
        }
        refreshStats();
        
        const fixedId = localStorage.getItem('farah_fixed_id');
        if (fixedId) {
            setTimeout(() => {
                const target = document.getElementById(`card-${fixedId}`);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.classList.add('fixed-point');
                    setTimeout(() => target.classList.remove('fixed-point'), 3000);
                }
            }, 500);
        }
    };

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const name = card.querySelector('.c-name').value || "عميلنا العزيز";
        const phone = card.querySelector('.c-phone').value;
        const total = card.querySelector('.c-total').value || 0;
        const notes = card.querySelector('.c-notes').value;
        if (!phone) { alert("يرجى إدخال رقم الهاتف!"); return; }

        let payMsg = "";
        card.querySelectorAll('.pay-row').forEach((row, idx) => {
            const v = row.querySelector('.p-val').value;
            const d = row.querySelector('.p-date').value;
            if (v > 0) payMsg += `🔹 دفعة ${idx+1}: ${v} ج.م | بتاريخ: ${d || '--'}\n`;
        });

        const remNum = document.getElementById(`rem-n-${id}`).innerText;
        const remWord = document.getElementById(`rem-w-${id}`).innerText;

        let msg = `*فرح للمطابخ | 2026*%0A---------------------------%0A👤 *العميل:* ${name}%0A💰 *الإجمالي:* ${total} ج.م%0A---------------------------%0A📝 *بيان الدفعات:*%0A${window.encodeURIComponent(payMsg)}---------------------------%0A💵 *${remNum}*%0A📑 *فقط:* ${remWord}%0A`;
        if(notes) msg += `---------------------------%0A📌 *ملاحظات:* ${notes}%0A`;
        msg += `---------------------------%0Aشكراً لتعاملكم معنا ✨`;
        window.open(`https://wa.me/2${phone.trim()}?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
