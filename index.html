<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>azemaa pro - Mobile Edition</title>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff; 
            --text-color: #2d3436; 
            --header-grad: linear-gradient(135deg, #8ba4f9 0%, #6e8efb 50%, #a777e3 100%); 
            --whatsapp-green: #25D366; 
            --cloud-blue: #00a8ff; 
            --card-radius: 15px; 
        }
        body.dark-mode { 
            --bg-main: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f1f5f9; 
        }
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: var(--bg-main); 
            color: var(--text-color); 
            transition: 0.3s; 
            -webkit-tap-highlight-color: transparent; /* إزالة المربع الأزرق عند الضغط في الموبايل */
        }
        
        /* تنسيق الهيدر ليكون مرناً */
        header { 
            position: relative; 
            background: var(--header-grad); 
            color: #fff; 
            padding: 15px; 
            border-radius: var(--card-radius); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
            flex-wrap: wrap; /* للسماح بنزول العناصر في الموبايل */
            user-select: none; /* منع تحديد النص عند النقر المزدوج */
        }
        
        .header-center { 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            transform: translate(-50%, -50%); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: bold; 
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; transition: 0.3s; }
        .network-status.offline .status-dot { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        
        .sync-box { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
        .btn { border: none; color: #fff; padding: 10px 2px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .btn:active { transform: scale(0.95); } /* تأثير الضغط للموبايل */
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-cloud { background: var(--cloud-blue); }
        .btn-device { background: #a29bfe; }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 350px; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2px solid #ddd; transition: 0.3s; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; cursor: pointer; }
        .h { padding: 12px 15px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 10; cursor: pointer; user-select: none; }
        .zoom-btn { background: rgba(255,255,255,0.25); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .card.fullscreen .overlay { display: none; }
        iframe { flex: 1; border: none; width: 100%; pointer-events: none; }
        .card.fullscreen iframe { pointer-events: auto; }

        .holidays-dropdown { display: none; background: var(--card-bg); border: 2px solid var(--cloud-blue); position: absolute; top: 80px; right: 10px; z-index: 100; padding: 10px; border-radius: 15px; width: 280px; max-width: 90vw; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .holidays-dropdown.show { display: block; }
        .holiday-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; display: flex; justify-content: space-between; }

        /* ======== قواعد توافق الموبايل ======== */
        @media (max-width: 550px) {
            header {
                padding: 12px;
            }
            .header-center {
                /* نقل المؤشر للأسفل لعدم التداخل مع الساعة في الشاشات الصغيرة */
                position: static;
                transform: none;
                order: 3;
                width: 100%;
                justify-content: center;
                margin-top: 10px;
                background: rgba(255, 255, 255, 0.15);
                padding: 8px;
            }
            .sync-box {
                gap: 4px;
            }
            .btn {
                font-size: 9.5px;
                padding: 8px 1px;
                border-radius: 6px;
            }
            .holidays-dropdown {
                width: 90vw;
                right: 5vw; /* توسيط القائمة في الموبايل */
            }
        }
    </style>
</head>
<body>

<header>
    <div>
        <div id="digital-clock" style="font-weight:bold; font-size: 1.2rem;">00:00</div>
        <div id="countdown" onclick="toggleHolidaysDropdown(event)" style="font-size: 0.75rem; cursor: pointer; padding-top: 2px;">جاري التحميل...</div>
    </div>

    <!-- زر الوضع الليلي -->
    <button onclick="toggleTheme()" style="background:none; border:none; color:white; cursor:pointer; font-size: 1.4rem; padding: 5px;">🌙</button>

    <!-- مؤشر حالة الإنترنت (سينزل سطراً مستقلاً في الموبايل) -->
    <div class="header-center network-status" id="network-status">
        <span class="status-dot"></span>
        <span id="status-text">متصل</span>
    </div>
</header>

<div id="holidaysDropdown" class="holidays-dropdown"></div>

<div class="sync-box">
    <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ</button>
    <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    <button onclick="window.location.href='devices.html'" class="btn btn-device">📱 أجهزة</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتس</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 يدوي</button>
</div>

<div class="main-container">
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#ff7675;"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div>
        <iframe src="zbon.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#00cec9;"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div>
        <iframe src="yom.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#6c5ce7;"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div>
        <iframe src="gyab.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#e17055;"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div>
        <iframe src="tslem.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#fbc531;"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div>
        <iframe src="notmop.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#0984e3;"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    // --- 1. نظام التكبير والتصغير ---
    function toggleZoom(card, event) {
        if(event) event.stopPropagation();
        
        if (card.classList.contains('fullscreen')) {
            card.classList.remove('fullscreen');
            card.querySelector('.zoom-btn').innerText = "تكبير";
        } else {
            document.querySelectorAll('.card.fullscreen').forEach(c => {
                c.classList.remove('fullscreen');
                c.querySelector('.zoom-btn').innerText = "تكبير";
            });
            card.classList.add('fullscreen');
            card.querySelector('.zoom-btn').innerText = "إغلاق";
        }
    }

    // --- 2. إدارة النقرات داخل الـ Iframes ---
    document.querySelectorAll('iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            try {
                this.contentWindow.document.addEventListener('dblclick', function() {
                    const card = iframe.closest('.card');
                    if(card.classList.contains('fullscreen')) {
                        toggleZoom(card);
                    }
                });
                
                this.contentWindow.document.addEventListener('click', function() {
                    const dropdown = document.getElementById('holidaysDropdown');
                    if(dropdown.classList.contains('show')) {
                        dropdown.classList.remove('show');
                    }
                });
            } catch(e) {
                console.log("تعذر إضافة الأحداث بسبب سياسات المتصفح");
            }
        });
    });

    // إغلاق القائمة المنسدلة عند النقر في الخلفية
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('holidaysDropdown');
        const countdown = document.getElementById('countdown');
        if (dropdown.classList.contains('show') && event.target !== countdown && !dropdown.contains(event.target)) {
            dropdown.classList.remove('show');
        }
    });

    // زر الرجوع في الموبايل
    window.addEventListener('popstate', (e) => {
        const fullCard = document.querySelector('.card.fullscreen');
        if (fullCard) {
            toggleZoom(fullCard);
            history.pushState(null, null, window.location.href);
        }
    });
    history.pushState(null, null, window.location.href);

    // --- 3. مؤشر حالة الإنترنت ---
    function updateOnlineStatus() {
        const statusDiv = document.getElementById('network-status');
        const statusText = document.getElementById('status-text');
        if (navigator.onLine) {
            statusDiv.classList.remove('offline');
            statusText.innerText = 'متصل';
        } else {
            statusDiv.classList.add('offline');
            statusText.innerText = 'غير متصل';
        }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();

    // --- 4. بيانات المناسبات والساعة ---
    const holidays = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026").getTime() },
        { name: "رأس السنة الهجرية 🌙", date: new Date("June 16, 2026").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026").getTime() },
        { name: "عيد ثورة 23 يوليو 🇪🇬", date: new Date("July 23, 2026").getTime() },
        { name: "المولد النبوي الشريف 🕌", date: new Date("September 5, 2026").getTime() },
        { name: "عيد القوات المسلحة 🪖", date: new Date("October 6, 2026").getTime() },
        { name: "رأس السنة الميلادية 🎄", date: new Date("January 1, 2027").getTime() },
        { name: "عيد الميلاد المجيد ⛪", date: new Date("January 7, 2027").getTime() },
        { name: "ثورة 25 يناير 🇪🇬", date: new Date("January 25, 2027").getTime() },
        { name: "شهر رمضان المبارك 🌙", date: new Date("February 8, 2027").getTime() },
        { name: "عيد الفطر المبارك ✨", date: new Date("March 10, 2027").getTime() },
        { name: "عيد تحرير سيناء 🦅", date: new Date("April 25, 2027").getTime() },
        { name: "عيد العمال 🛠️", date: new Date("May 1, 2027").getTime() },
        { name: "شم النسيم 🐟", date: new Date("May 3, 2027").getTime() }
    ];

    function updateHeader() {
        const now = new Date();
        document.getElementById('digital-clock').innerText = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        
        let next = holidays.find(h => h.date > now.getTime()) || holidays[0];
        let diff = Math.ceil((next.date - now.getTime()) / (1000 * 60 * 60 * 24));
        document.getElementById('countdown').innerText = "باقي " + diff + " يوم على " + next.name;
    }

    function toggleHolidaysDropdown(event) {
        if(event) event.stopPropagation();
        const drop = document.getElementById('holidaysDropdown');
        drop.classList.toggle('show');
        if(drop.classList.contains('show')) {
            drop.innerHTML = holidays.map(h => `<div class="holiday-item"><span>${h.name}</span><span>${new Date(h.date).toLocaleDateString('ar-EG')}</span></div>`).join('');
        }
    }

    function toggleTheme() { document.body.classList.toggle('dark-mode'); }

    setInterval(updateHeader, 60000);
    updateHeader();

    function saveToWhatsApp() { alert('سيتم حفظ البيانات'); }
    function loadFromWhatsApp() { alert('سيتم استرجاع البيانات'); }
</script>
</body>
</html>
