<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Cyber Night Edition</title>
    <script>
        if (sessionStorage.getItem("isAllowed") !== "true") {
            window.location.replace("login.html");
        }
    </script>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366;
            --cloud-blue: #00a8ff;
            --card-radius: 20px;
        }

        body.dark-mode {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 12px; background: var(--bg-main); 
            color: var(--text-color); display: flex; flex-direction: column; 
            gap: 15px; transition: 0.3s; 
        }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 10px 15px; 
            border-radius: var(--card-radius); display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.2);
        }

        .header-info { display: flex; flex-direction: column; align-items: flex-start; }
        .clock-container { display: flex; align-items: center; gap: 8px; }
        .system-title { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.3px; opacity: 0.95; text-transform: lowercase; }
        #digital-clock { font-size: 1rem; font-weight: bold; font-family: 'Segoe UI', monospace; }
        #countdown { font-size: 0.75rem; opacity: 0.95; margin-top: 2px; color: #fff; font-weight: bold; }

        .header-btns { display: flex; gap: 6px; }

        .theme-btn, .calc-trigger-btn {
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 6px 10px; border-radius: 10px; cursor: pointer; font-size: 0.75rem;
            display: flex; align-items: center; gap: 4px; transition: 0.2s;
        }

        .logout-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card-bg); border: 2px solid #ff7675; padding: 25px;
            border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.4); z-index: 20000; width: 310px;
            text-align: center; box-sizing: border-box;
        }
        .logout-modal h3 { margin-top: 0; color: var(--text-color); font-size: 1.1rem; }
        .logout-btns { display: flex; gap: 10px; margin-top: 20px; }
        .logout-btn-confirm { background: #ff7675; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; flex: 1; }
        .logout-btn-cancel { background: #2d3436; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; flex: 1; }
        
        .calc-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 19999; }

        .main-container { display: flex; flex-direction: column; gap: 20px; margin-top: 10px; }
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 420px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; transition: 0.3s; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: transparent; z-index: 5; pointer-events: auto; cursor: pointer; }
        .card.fullscreen .overlay { pointer-events: none; display: none; }
        .h { padding: 15px 20px; font-size: 14px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; z-index: 10; cursor: pointer; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; border: none; }
    </style>
</head>
<body>

<header>
    <div class="header-info">
        <div class="clock-container">
            <span class="system-title">🚀 azemaa pro</span>
            <div id="digital-clock">00:00:00 ص</div>
        </div>
        <div id="countdown">باقي .. أيام على المناسبة</div>
    </div>
    <div class="header-btns">
        <button class="calc-trigger-btn" onclick="toggleCalc(true)">🧮 حاسبة</button>
        <button class="theme-btn" onclick="toggleTheme()">🌙 ليل</button>
    </div>
</header>

<div class="calc-overlay" id="logoutOverlay" onclick="toggleLogoutModal(false)"></div>
<div class="logout-modal" id="logoutModal">
    <h3>هل تريد الخروج من azemaa pro؟</h3>
    <p style="font-size: 0.8rem; opacity: 0.8; color: var(--text-color);">سيتم حفظ كافة الحسابات سحابياً قبل المغادرة</p>
    <div class="logout-btns">
        <button class="logout-btn-confirm" id="logout-confirm-btn">نعم، خروج</button>
        <button class="logout-btn-cancel" onclick="toggleLogoutModal(false)">إلغاء</button>
    </div>
</div>

<div class="main-container">
    <div class="card" style="border-color: #ff7675;">
        <div class="overlay"></div>
        <div class="h" style="background: #ff7675;"><span>👤 القسم الرئيسي</span></div>
        <iframe src="./zbon.html"></iframe>
    </div>

    <div class="card" style="border-color: #00cec9;">
        <div class="overlay"></div>
        <div class="h" style="background: #00cec9;"><span>💸 الخزينة</span></div>
        <iframe src="./yom.html"></iframe>
    </div>

    <div class="card" style="border-color: #6c5ce7;">
        <div class="overlay"></div>
        <div class="h" style="background: #6c5ce7;"><span>👷 العمال</span></div>
        <iframe src="./gyab.html"></iframe>
    </div>

    <div class="card" style="border-color: #e17055;">
        <div class="overlay"></div>
        <div class="h" style="background: #e17055;"><span>📅 التسليم</span></div>
        <iframe src="./tslem.html"></iframe>
    </div>

    <div class="card" style="border-color: #fbc531;">
        <div class="overlay"></div>
        <div class="h" style="background: #fbc531; color: #2d3436;"><span>📝 الملاحظات</span></div>
        <iframe src="./notmop.html"></iframe>
    </div>

    <div class="card" style="border-color: #0984e3;">
        <div class="overlay"></div>
        <div class="h" style="background: #0984e3;"><span>📊 التقارير</span></div>
        <iframe src="./takarer.html"></iframe>
    </div>
</div>

<script>
    // المناسبات الرسمية - الترتيب تلقائي للأقرب
    const events = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026 00:00:00").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026 00:00:00").getTime() },
        { name: "ثورة 23 يوليو 🇪🇬", date: new Date("July 23, 2026 00:00:00").getTime() },
        { name: "المولد النبوي الشريف 🌙", date: new Date("August 25, 2026 00:00:00").getTime() },
        { name: "عيد القوات المسلحة 🎖️", date: new Date("October 6, 2026 00:00:00").getTime() },
        { name: "شهر رمضان المبارك 🌙", date: new Date("February 18, 2027 00:00:00").getTime() }
    ];

    function updateHeader() {
        const now = new Date();
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const nextEvent = events.find(e => e.date >= todayMidnight) || events[events.length - 1];
        const days = Math.round((nextEvent.date - todayMidnight) / (1000 * 60 * 60 * 24));
        
        document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        document.getElementById('countdown').innerHTML = days === 0 ? `اليوم هو ${nextEvent.name} 🎉` : `باقي ${days} يوم على ${nextEvent.name}`;
    }
    setInterval(updateHeader, 1000); updateHeader();

    // 🔒 منع الخروج المزدوج والتحكم في زر الرجوع
    window.addEventListener('load', () => { window.history.pushState({ home: true }, "", ""); });
    window.addEventListener('popstate', (e) => {
        const fs = document.querySelector('.card.fullscreen');
        if (fs) {
            fs.classList.remove('fullscreen');
            window.history.pushState({ home: true }, "", "");
        } else {
            window.history.pushState({ home: true }, "", "");
            toggleLogoutModal(true);
        }
    });

    function toggleLogoutModal(s) {
        document.getElementById('logoutModal').style.display = s ? 'block' : 'none';
        document.getElementById('logoutOverlay').style.display = s ? 'block' : 'none';
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

    document.querySelectorAll('.h, .overlay').forEach(el => {
        el.addEventListener('dblclick', function() {
            const card = this.closest('.card');
            card.classList.toggle('fullscreen');
            if (card.classList.contains('fullscreen')) window.history.pushState({ zoom: true }, "");
        });
    });
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const firebaseConfig = { apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU", authDomain: "azemaa-proo.firebaseapp.com", databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com", projectId: "azemaa-proo" };
    const db = getDatabase(initializeApp(firebaseConfig));

    document.getElementById('logout-confirm-btn').onclick = async function() {
        this.innerText = "⏳ جاري حفظ الحسابات...";
        let data = {}; 
        for (let i = 0; i < localStorage.length; i++) { 
            let k = localStorage.key(i); 
            if (k !== 'theme') data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); 
        }
        try {
            await set(ref(db, 'backups/azemaa_main'), data);
            sessionStorage.removeItem("isAllowed");
            window.location.replace("login.html");
        } catch (e) {
            alert("فشل الحفظ التلقائي، جاري الخروج...");
            sessionStorage.removeItem("isAllowed");
            window.location.replace("login.html");
        }
    };
</script>
</body>
</html>
