<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Full Integrated Cyber Edition</title>
    <style>
        /* --- ستايل نظام الدخول (Login Overlay) --- */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: #1e293b; padding: 40px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center;
            width: 90%; max-width: 400px; border: 2px solid #00cec9;
            color: white;
        }
        .pin-input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155;
            background: #0f172a; color: white; text-align: center; font-size: 1.5rem;
            margin: 20px 0; outline: none;
        }
        .btn-login {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: #00a8ff; color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }

        /* --- إخفاء المحتوى الأصلي حتى تسجيل الدخول --- */
        #appContent { display: none; }

        /* --- ستايل برنامجك الأصلي (Cyber Night Edition) --- */
        :root { 
            --bg-main: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366; --cloud-blue: #00a8ff; --turquoise: #00cec9;
            --card-radius: 20px;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 12px; background: var(--bg-main); color: var(--text-color); transition: 0.3s; }
        header { background: var(--header-grad); color: #fff; padding: 10px 15px; border-radius: var(--card-radius); display: flex; justify-content: space-between; align-items: center; }
        .clock-container { display: flex; align-items: center; gap: 8px; }
        .system-title { font-size: 0.95rem; font-weight: 800; }
        #digital-clock { font-size: 1rem; font-weight: bold; }
        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .btn { border: none; color: #fff; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-cloud { background: var(--cloud-blue); }
        .btn-whatsapp { background: var(--whatsapp-green); }
        
        .main-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 420px; overflow: hidden; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; transition: 0.3s; }
        .card-zbon { border-color: #ff7675; } .h-zbon { background: #ff7675; }
        .card-yom { border-color: #00cec9; } .h-yom { background: #00cec9; }
        .card-gyab { border-color: #6c5ce7; } .h-gyab { background: #6c5ce7; }
        .card-tslem { border-color: #e17055; } .h-tslem { background: #e17055; }
        .card-notmop { border-color: #fbc531; } .h-notmop { background: #fbc531; color: #2d3436; }
        .card-takarer { border-color: #0984e3; } .h-takarer { background: #0984e3; }
        
        .h { padding: 15px 20px; font-size: 14px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; cursor: pointer; }
        
        .fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .fullscreen .overlay { display: none; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2 style="color: #00cec9;">🚀 azemaa pro</h2>
        <p>أدخل كود الوصول الخاص بك</p>
        <input type="password" id="userPin" class="pin-input" placeholder="****" inputmode="numeric" maxlength="6">
        <button type="button" id="loginBtn" class="btn-login">دخول النظام</button>
        <p id="errorMsg" style="color: #ff7675; margin-top: 15px; display: none;">الكود غير صحيح!</p>
    </div>
</div>

<div id="appContent">
    <header>
        <div class="header-info">
            <div class="clock-container">
                <span class="system-title">🚀 azemaa pro</span>
                <div id="digital-clock">00:00:00 ص</div>
            </div>
            <div id="countdown" style="font-size: 0.7rem;">جرٍ حساب المناسبات...</div>
        </div>
        <div style="display: flex; gap: 8px;">
            <button id="logoutBtn" class="btn" style="background:#ff7675; padding:5px 10px; font-size:0.7rem;">خروج</button>
        </div>
    </header>

    <div class="sync-box">
        <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ سحابي</button>
        <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    </div>

    <div class="main-container">
        <div class="card card-zbon" onclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-zbon"><span>👤 القسم الرئيسي</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="zbon.html"></iframe>
        </div>
        <div class="card card-yom" onclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-yom"><span>💸 الخزينة</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="yom.html"></iframe>
        </div>
        <div class="card card-gyab" onclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-gyab"><span>👷 العمال</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="gyab.html"></iframe>
        </div>
        <div class="card card-tslem" onclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-tslem"><span>📅 التسليم</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="tslem.html"></iframe>
        </div>
        <div class="card card-takarer" onclick="toggleZoom(this)">
            <div class="overlay"></div>
            <div class="h h-takarer"><span>📊 التقارير</span><button style="background:rgba(255,255,255,0.2); border:none; color:white; border-radius:5px; padding:2px 8px;">⛶</button></div>
            <iframe src="takarer.html"></iframe>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function checkAuth() {
        if(localStorage.getItem('azemaa_user_pin')) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            setInterval(() => {
                document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('ar-EG');
            }, 1000);
        }
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const pin = document.getElementById('userPin').value;
        try {
            const snapshot = await get(child(ref(db), 'authorized_users/' + pin));
            if (snapshot.exists()) {
                localStorage.setItem('azemaa_user_pin', pin);
                localStorage.setItem('azemaa_user_name', snapshot.val().name);
                checkAuth();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        } catch (e) { alert("خطأ اتصال"); }
    });

    document.getElementById('cloud-save-btn').addEventListener('click', async () => {
        const pin = localStorage.getItem('azemaa_user_pin');
        let data = {};
        for (let i = 0; i < localStorage.length; i++) {
            let k = localStorage.key(i);
            if (!k.includes('.') && !k.includes('#')) data[k] = localStorage.getItem(k);
        }
        await set(ref(db, 'backups/user_' + pin), data);
        alert("✅ تم الحفظ سحابياً.");
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('azemaa_user_pin');
        location.reload();
    });

    window.toggleZoom = (card) => {
        card.classList.toggle('fullscreen');
    };

    checkAuth();
</script>
</body>
</html>
