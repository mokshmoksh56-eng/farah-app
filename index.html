<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>azemaa pro - Mobile Edition السحابي</title>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff; 
            --text-color: #2d3436; 
            --header-grad: linear-gradient(135deg, #8ba4f9 0%, #6e8efb 50%, #a777e3 100%); 
            --whatsapp-green: #25D366; 
            --cloud-blue: #00a8ff; 
            --card-radius: 15px; 
        }
        body.dark-mode { 
            --bg-main: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f1f5f9; 
        }
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: var(--bg-main); 
            color: var(--text-color); 
            transition: 0.3s; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-main); z-index: 100000; display: none;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .login-box {
            background: var(--card-bg); padding: 30px; border-radius: var(--card-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;
        }
        
        #lock-msg { 
            display: none; background: #fff3cd; color: #856404; padding: 15px; 
            border-radius: 10px; margin-bottom: 20px; border: 2px dashed #e74c3c; 
        }
        #lock-msg h4 { margin: 0 0 10px 0; font-size: 16px; color: #e74c3c; }
        #lock-msg p { margin: 5px 0; font-size: 13px; font-weight: bold; }
        #lock-msg .phone { display: block; font-size: 24px; color: #0984e3; margin-top: 10px; font-weight: 900; letter-spacing: 2px; }

        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd;
            border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #6e8efb; border: none;
            color: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        header { 
            position: relative; 
            background: var(--header-grad); 
            color: #fff; 
            padding: 15px; 
            border-radius: var(--card-radius); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
            flex-wrap: wrap; 
            user-select: none; 
        }
        
        .header-center { 
            position: absolute; 
            left: 50%; 
            top: 50%; 
            transform: translate(-50%, -50%); 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: bold; 
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #2ecc71; box-shadow: 0 0 8px #2ecc71; transition: 0.3s; }
        .network-status.offline .status-dot { background-color: #e74c3c; box-shadow: 0 0 8px #e74c3c; }
        
        #header-timer {
            background: #2d3436; color: #f1c40f; padding: 6px 14px; border-radius: 20px; 
            font-size: 15px; font-weight: bold; border: 2px solid #f1c40f;
            display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.15); white-space: nowrap;
        }
        @keyframes pulse-danger { 
            0% { transform: scale(1); background: #d63031; } 
            50% { transform: scale(1.08); background: #e74c3c; box-shadow: 0 0 15px #e74c3c; } 
            100% { transform: scale(1); background: #d63031; } 
        }
        .timer-danger { color: #fff !important; border-color: #fff !important; animation: pulse-danger 0.8s infinite !important; }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; align-items: stretch; }
        .sync-group-right, .sync-group-center, .sync-group-left { display: grid; grid-template-columns: 1fr; gap: 6px; }
        .btn { border: none; color: #fff; padding: 12px 4px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; text-align: center; white-space: nowrap; }
        .btn:active { transform: scale(0.95); } 
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-cloud { background: var(--cloud-blue); }
        .btn-device { background: #a29bfe; }
        
        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 350px; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2px solid #ddd; transition: 0.3s; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; cursor: pointer; }
        .h { padding: 12px 15px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 10; cursor: pointer; user-select: none; }
        .zoom-btn { background: rgba(255,255,255,0.25); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .card.fullscreen .overlay { display: none; }
        iframe { flex: 1; border: none; width: 100%; pointer-events: none; }
        .card.fullscreen iframe { pointer-events: auto; }
        .holidays-dropdown { display: none; background: var(--card-bg); border: 2px solid var(--cloud-blue); position: absolute; top: 80px; right: 10px; z-index: 100; padding: 10px; border-radius: 15px; width: 280px; max-width: 90vw; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .holidays-dropdown.show { display: block; }
        .holiday-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.85rem; display: flex; justify-content: space-between; }
        .time-date-container { display: flex; align-items: baseline; gap: 10px; }

        @media (max-width: 550px) {
            header { padding: 12px; }
            .header-center { position: static; transform: none; order: 3; width: 100%; justify-content: center; margin-top: 10px; background: rgba(255, 255, 255, 0.15); padding: 8px; }
            .sync-box { gap: 6px; }
            .btn { font-size: 11.5px; padding: 10px 2px; border-radius: 6px; } 
            .holidays-dropdown { width: 90vw; right: 5vw; }
            .time-date-container { gap: 6px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h3>🔐 لوحة تفعيل azemaa pro</h3>
        <div id="lock-msg">
            <h4>⏳ انتهت الفترة التجريبية</h4>
            <p>للاستفسار وشراء النسخة الكاملة يرجى التواصل معنا:</p>
            <span class="phone">01036556751</span>
        </div>
        <p id="login-desc" style="font-size: 13px; color: #7f8c8d;">أدخل الإيميل والباسورد الخاص بك لفتح النظام</p>
        <input type="email" id="sys-email" placeholder="البريد الإلكتروني للعميل">
        <input type="password" id="sys-password" placeholder="كلمة المرور السحابية">
        <button id="login-btn">تسجيل الدخول والتفعيل</button>
    </div>
</div>

<script>
    if (localStorage.getItem('_az_sys_lock_v1') === 'true' && localStorage.getItem('_az_sys_logged_in') !== 'true') {
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('lock-msg').style.display = 'block';
        document.getElementById('login-desc').style.display = 'none';
    }
</script>

<header>
    <div>
        <div class="time-date-container">
            <div id="digital-clock" style="font-weight:bold; font-size: 1.2rem;">00:00</div>
            <div id="digital-date" style="font-size: 0.9rem; font-weight: bold; opacity: 0.9;">0000/00/00</div>
        </div>
        <div id="countdown" onclick="toggleHolidaysDropdown(event)" style="font-size: 0.75rem; cursor: pointer; padding-top: 4px;">جاري التحميل...</div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px;">
        <div id="header-timer">⏳ المتبقي: <span id="trial-time-display">15:00</span></div>
        <button onclick="toggleTheme()" style="background:none; border:none; color:white; cursor:pointer; font-size: 1.4rem; padding: 2px;">🌙</button>
        <button id="logout-btn" style="background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">خروج 🚪</button>
    </div>

    <div class="header-center network-status" id="network-status">
        <span class="status-dot"></span>
        <span id="status-text">متصل</span>
    </div>
</header>

<div id="holidaysDropdown" class="holidays-dropdown"></div>

<div class="sync-box">
    <div class="sync-group-right">
        <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ</button>
        <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    </div>
    <div class="sync-group-center">
        <button onclick="window.location.href='agheza.html'" class="btn btn-device">📱 أجهزة</button>
        <button onclick="window.location.href='kmatkitchen.html'" class="btn btn-device">🍳 خامات المطبخ</button>
    </div>
    <div class="sync-group-left">
        <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتس</button>
        <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 يدوي</button>
    </div>
</div>

<div class="main-container">
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#ff7675;"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="zbon.html" id="frame-zbon"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#00cec9;"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="yom.html" id="frame-yom"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#6c5ce7;"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="gyab.html" id="frame-gyab"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#e17055;"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="tslem.html" id="frame-tslem"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#fbc531;"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="notmop.html" id="frame-notmop"></iframe></div>
    <div class="card" ondblclick="toggleZoom(this, event)"><div class="overlay"></div><div class="h" style="background:#0984e3;"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button></div><iframe src="takarer.html" id="frame-takarer"></iframe></div>
</div>

<script>
    function toggleZoom(card, event) {
        if(event) event.stopPropagation();
        if (card.classList.contains('fullscreen')) { card.classList.remove('fullscreen'); card.querySelector('.zoom-btn').innerText = "تكبير"; } 
        else { document.querySelectorAll('.card.fullscreen').forEach(c => { c.classList.remove('fullscreen'); c.querySelector('.zoom-btn').innerText = "تكبير"; }); card.classList.add('fullscreen'); card.querySelector('.zoom-btn').innerText = "إغلاق"; }
    }
    document.querySelectorAll('iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            try {
                this.contentWindow.document.addEventListener('dblclick', function() { const card = iframe.closest('.card'); if(card.classList.contains('fullscreen')) { toggleZoom(card); } });
                this.contentWindow.document.addEventListener('click', function() { const dropdown = document.getElementById('holidaysDropdown'); if(dropdown.classList.contains('show')) { dropdown.classList.remove('show'); } });
            } catch(e) {}
        });
    });
    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('holidaysDropdown'); const countdown = document.getElementById('countdown');
        if (dropdown.classList.contains('show') && event.target !== countdown && !dropdown.contains(event.target)) { dropdown.classList.remove('show'); }
    });
    window.addEventListener('popstate', (e) => { const fullCard = document.querySelector('.card.fullscreen'); if (fullCard) { toggleZoom(fullCard); history.pushState(null, null, window.location.href); } });
    history.pushState(null, null, window.location.href);

    function updateOnlineStatus() {
        const statusDiv = document.getElementById('network-status'); const statusText = document.getElementById('status-text');
        if (navigator.onLine) { statusDiv.classList.remove('offline'); statusText.innerText = 'متصل'; } 
        else { statusDiv.classList.add('offline'); statusText.innerText = 'غير متصل'; }
    }
    window.addEventListener('online', updateOnlineStatus); window.addEventListener('offline', updateOnlineStatus); updateOnlineStatus();

    const holidays = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026").getTime() },
        { name: "رأس السنة الهجرية 🌙", date: new Date("June 16, 2026").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026").getTime() },
        { name: "عيد ثورة 23 يوليو 🇪🇬", date: new Date("July 23, 2026").getTime() }
    ];

    function updateHeader() {
        const now = new Date();
        document.getElementById('digital-clock').innerText = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        const yyyy = now.toLocaleDateString('ar-EG', { year: 'numeric' });
        const mm = now.toLocaleDateString('ar-EG', { month: '2-digit' });
        const dd = now.toLocaleDateString('ar-EG', { day: '2-digit' });
        document.getElementById('digital-date').innerText = yyyy + '/' + mm + '/' + dd;
        let next = holidays.find(h => h.date > now.getTime()) || holidays[0];
        let diff = Math.ceil((next.date - now.getTime()) / (1000 * 60 * 60 * 24));
        document.getElementById('countdown').innerText = "باقي " + diff + " يوم على " + next.name;
    }
    function toggleHolidaysDropdown(event) {
        if(event) event.stopPropagation(); const drop = document.getElementById('holidaysDropdown'); drop.classList.toggle('show');
        if(drop.classList.contains('show')) { drop.innerHTML = holidays.map(h => `<div class="holiday-item"><span>${h.name}</span><span>${new Date(h.date).toLocaleDateString('ar-EG')}</span></div>`).join(''); }
    }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    setInterval(updateHeader, 60000); updateHeader();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    
    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);
    const auth = getAuth(app);

    let trialInterval;
    const TOTAL_TRIAL_MS = 15 * 60 * 1000; 

    // ==========================================
    // الابتكار: كسر حماية الـ iFrames أثناء الفترة المجانية
    // ==========================================
    function applyBypassSandbox(isTrialActive) {
        const frames = ['zbon', 'yom', 'gyab', 'tslem', 'notmop', 'takarer'];
        frames.forEach(id => {
            const el = document.getElementById('frame-' + id);
            if (el) {
                if (isTrialActive) {
                    // تشغيل الـ Sandbox لإجبار الكود الداخلي المانع على العبور فوراً بدون أخطاء أمنية
                    el.setAttribute('sandbox', 'allow-forms allow-modals allow-popups allow-scripts allow-same-origin');
                } else {
                    el.removeAttribute('sandbox');
                }
            }
        });
    }

    function initTrialTimer() {
        const isLocked = localStorage.getItem('_az_sys_lock_v1');
        let startTime = localStorage.getItem('_az_sys_start_v1');
        const now = Date.now();
        const headerTimerBox = document.getElementById('header-timer');

        if (isLocked === 'true') {
            enforceLockScreen();
            return;
        }

        if (!startTime) {
            startTime = now.toString();
            localStorage.setItem('_az_sys_start_v1', startTime);
        }

        const elapsed = now - parseInt(startTime);
        
        if (elapsed >= TOTAL_TRIAL_MS) {
            localStorage.setItem('_az_sys_lock_v1', 'true');
            enforceLockScreen();
        } else {
            headerTimerBox.style.display = 'block';
            
            // تفعيل الساندبوكس لتخطي حظر الصفحات الداخلية
            applyBypassSandbox(true);
            document.querySelectorAll('iframe').forEach(f => f.src = f.src);
            
            runCountdown(parseInt(startTime));
        }
    }

    function runCountdown(startTime) {
        const timeDisplay = document.getElementById('trial-time-display');
        const headerTimerBox = document.getElementById('header-timer');
        
        trialInterval = setInterval(() => {
            const now = Date.now();
            const elapsed = now - startTime;
            const remaining = TOTAL_TRIAL_MS - elapsed;

            if (remaining <= 0) {
                localStorage.setItem('_az_sys_lock_v1', 'true');
                enforceLockScreen();
                return;
            }

            const mins = Math.floor(remaining / 60000);
            const secs = Math.floor((remaining % 60000) / 1000);
            timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (remaining < 3 * 60000) { 
                headerTimerBox.classList.add('timer-danger');
            }
        }, 1000);
    }

    function enforceLockScreen() {
        if (trialInterval) clearInterval(trialInterval);
        applyBypassSandbox(false); // سحب الصلاحيات
        document.getElementById('header-timer').style.display = 'none';
        document.getElementById('login-overlay').style.display = 'flex';
        document.getElementById('lock-msg').style.display = 'block';
        document.getElementById('login-desc').style.display = 'none';
        document.querySelectorAll('iframe').forEach(f => f.src = f.src);
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            localStorage.setItem('_az_sys_logged_in', 'true');
            applyBypassSandbox(false); // المستخدم تفعيل حقيقي -> لا نحتاج ساندبوكس
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('header-timer').style.display = 'none';
            if(trialInterval) clearInterval(trialInterval);
            document.querySelectorAll('iframe').forEach(f => f.src = f.src);
        } else {
            localStorage.removeItem('_az_sys_logged_in');
            initTrialTimer(); 
        }
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('sys-email').value;
        const password = document.getElementById('sys-password').value;
        const loginBtn = document.getElementById('login-btn');

        if(!email || !password) { alert("⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور!"); return; }

        try {
            loginBtn.innerText = "⏳ جاري التفعيل...";
            loginBtn.disabled = true;
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert("❌ خطأ: البيانات غير صحيحة أو غير مسجلة.");
        } finally {
            loginBtn.innerText = "تسجيل الدخول والتفعيل";
            loginBtn.disabled = false;
        }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        if(confirm("هل تريد تسجيل الخروج وقفل المنظومة؟")) {
            signOut(auth).then(() => {
                localStorage.removeItem('_az_sys_logged_in');
                window.location.reload();
            });
        }
    });

    // الحفظ والاسترجاع السحابي
    document.getElementById('cloud-save-btn').addEventListener('click', async () => {
        if(!auth.currentUser) return;
        let data = {}; let hasData = false;
        for (let i = 0; i < localStorage.length; i++) { 
            let k = localStorage.key(i); 
            if (k !== 'theme' && !k.startsWith('_az_sys_')) { data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); hasData = true; } 
        }
        if (!hasData) return;
        try { await set(ref(db, `backups/users/${auth.currentUser.uid}`), data); alert("تم حفظ النسخة بنجاح ✅"); } catch (e) {}
    });

    document.getElementById('cloud-load-btn').addEventListener('click', async () => {
        if(!auth.currentUser) return;
        try {
            const snapshot = await get(child(ref(db), `backups/users/${auth.currentUser.uid}`));
            if (snapshot.exists()) { 
                const d = snapshot.val(); for (let k in d) { localStorage.setItem(k, d[k]); }
                window.location.reload();
            }
        } catch (e) {}
    });
</script>
</body>
</html>
