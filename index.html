<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>azemaa pro - Mobile Edition السحابي</title>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff; 
            --text-color: #2d3436; 
            --header-grad: linear-gradient(135deg, #8ba4f9 0%, #6e8efb 50%, #a777e3 100%); 
            --cloud-blue: #00a8ff; 
            --card-radius: 15px; 
        }
        body.dark-mode { 
            --bg-main: #0f172a; 
            --card-bg: #1e293b; 
            --text-color: #f1f5f9; 
        }
        body { 
            font-family: sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: var(--bg-main); 
            color: var(--text-color); 
            transition: 0.3s; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--bg-main); z-index: 100000; display: flex;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .login-box {
            background: var(--card-bg); padding: 30px; border-radius: var(--card-radius);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center;
        }
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd;
            border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center;
        }
        .login-box button {
            width: 100%; padding: 12px; background: #6e8efb; border: none;
            color: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
        }

        header { 
            background: var(--header-grad); 
            color: #fff; 
            padding: 15px; 
            border-radius: var(--card-radius); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
            flex-wrap: wrap; 
        }
        
        .sync-box { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        
        .sync-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr); 
            gap: 6px;
        }

        .btn { 
            border: none; 
            color: #fff; 
            padding: 12px 4px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-decoration: none; 
            text-align: center;
        }
        .btn:active { transform: scale(0.95); } 
        .btn-device { background: #a29bfe; }

        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--card-radius);
            font-weight: bold;
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-color);
            transition: 0.3s;
        }
        .tab-btn.active {
            background: var(--header-grad);
            color: white;
        }
        
        .page-container {
            background: var(--card-bg);
            border-radius: var(--card-radius);
            padding: 0;
            overflow: hidden;
            min-height: 500px;
        }
        
        .page-iframe {
            width: 100%;
            min-height: 500px;
            border: none;
            background: var(--bg-main);
        }

        .time-date-container { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        
        .news-ticker-container {
            background: var(--card-bg);
            border: 2px solid #2ecc71;
            border-radius: var(--card-radius);
            margin-bottom: 10px;
            padding: 8px 10px;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            display: flex;
            align-items: center;
        }

        .ticker-text {
            display: inline-block;
            white-space: nowrap;
            font-size: 13px;
            font-weight: bold;
            color: var(--text-color);
            animation: ticker-scroll 45s linear infinite; 
        }

        .ticker-item { margin: 0 30px; display: inline-block; background: rgba(46, 204, 113, 0.1); padding: 2px 8px; border-radius: 6px; }

        @keyframes ticker-scroll {
            0% { transform: translateX(-100vw); }
            100% { transform: translateX(100vw); }
        }

        @media (max-width: 550px) {
            .sync-group { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h3>🔐 لوحة تفعيل azemaa pro</h3>
        <p style="font-size: 13px; color: #7f8c8d;">سجل دخول بحساب العميل لتنشيط السحابة</p>
        <input type="email" id="sys-email" placeholder="البريد الإلكتروني للعميل">
        <input type="password" id="sys-password" placeholder="كلمة المرور السحابية">
        <button id="login-btn">تفعيل النظام الآمن</button>
    </div>
</div>

<div class="news-ticker-container">
    <div class="ticker-text">
        <span class="ticker-item">🇪🇬 <strong>منتخب مصر × روسيا</strong> - مباراة ودية دولية - الخميس 28 مايو - 9:00 م</span>
        <span class="ticker-item">🏆 <strong>أرسنال × باريس سان جيرمان</strong> - نهائي دوري أبطال أوروبا 2026 - السبت 30 مايو</span>
        <span class="ticker-item" id="prayer-time-item">🕌 جاري تحميل مواقيت الصلاة...</span>
    </div>
</div>

<header>
    <div>
        <div class="time-date-container">
            <div id="digital-clock" style="font-weight:bold; font-size: 1.2rem;">00:00</div>
            <div id="digital-date" style="font-size: 0.9rem;">0000/00/00</div>
            <span id="network-status" style="padding: 2px 8px; border-radius: 20px; font-size: 11px; background: #2ecc71; color: white;">متصل 🟢</span>
        </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; background: rgba(0,0,0,0.15); padding: 3px 8px; border-radius: 6px;">azemaa proo</span>
        <button onclick="refreshCurrentPage()" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 10px; border-radius: 8px; cursor: pointer;">🔄</button>
        <button onclick="toggleTheme()" style="background:none; border:none; color:white; cursor:pointer; font-size: 1.4rem;">🌙</button>
        <button id="logout-btn" style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 8px; cursor: pointer;">خروج 🚪</button>
    </div>
</header>

<div class="sync-box">
    <div class="sync-group">
        <button onclick="loadPage('agheza.html')" class="btn btn-device">📱 أجهزة</button>
        <button onclick="loadPage('kmatkitchen.html')" class="btn btn-device">📏 مقايسات</button>
        <button onclick="loadPage('souer.html')" class="btn btn-device" style="background: #e84393;">📍 موقع الزبائن</button>
        <button onclick="loadPage('fatora.html')" class="btn btn-device" style="background: #0984e3;">📄 العقود والتوريدات</button>
    </div>
</div>

<div class="tabs-container">
    <button class="tab-btn active" onclick="switchTab('main')">🏠 الرئيسية</button>
    <button class="tab-btn" onclick="switchTab('customers')">👤 الزبائن</button>
    <button class="tab-btn" onclick="switchTab('treasury')">💰 الخزينة</button>
    <button class="tab-btn" onclick="switchTab('workers')">👷 العمال</button>
    <button class="tab-btn" onclick="switchTab('delivery')">📅 التسليم</button>
    <button class="tab-btn" onclick="switchTab('notes')">📝 الملاحظات</button>
    <button class="tab-btn" onclick="switchTab('reports')">📊 التقارير</button>
</div>

<div class="page-container">
    <iframe id="mainFrame" class="page-iframe" src="zbon.html" title="المحتوى"></iframe>
</div>

<script>
    // ====================== إدارة الصفحات بدون iframes متعددة ======================
    const pages = {
        main: 'zbon.html',
        customers: 'souer.html',
        treasury: 'yom.html',
        workers: 'gyab.html',
        delivery: 'tslem.html',
        notes: 'notmop.html',
        reports: 'takarer.html'
    };
    
    let currentTab = 'main';
    const frame = document.getElementById('mainFrame');
    
    function switchTab(tab) {
        currentTab = tab;
        // تحديث شكل الأزرار
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        
        // تحميل الصفحة المطلوبة
        if (pages[tab]) {
            frame.src = pages[tab];
        }
    }
    
    function loadPage(page) {
        frame.src = page;
        // إعادة تعيين التبويب النشط
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    }
    
    function refreshCurrentPage() {
        frame.src = frame.src;
    }
    
    // ====================== الساعة والتاريخ ======================
    function updateDateTime() {
        const now = new Date();
        document.getElementById('digital-clock').innerText = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        const weekday = now.toLocaleDateString('ar-EG', { weekday: 'long' });
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        document.getElementById('digital-date').innerHTML = `${weekday} ${yyyy}/${mm}/${dd}`;
    }
    
    // ====================== مواقيت الصلاة ======================
    async function fetchPrayerTimes() {
        try {
            let city = 'Mansoura', country = 'Egypt', displayCity = 'المنصورة';
            try {
                const locationResponse = await fetch('https://ipapi.co/json/');
                const locationData = await locationResponse.json();
                if (locationData && locationData.city) {
                    city = locationData.city;
                    country = locationData.country_name;
                    displayCity = locationData.city;
                }
            } catch (locError) { console.log("تحديد الموقع تلقائياً غير متاح"); }

            const response = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=${encodeURIComponent(country)}`);
            const data = await response.json();
            
            if (data && data.data && data.data.timings) {
                const timings = data.data.timings;
                const formatTime = (time) => {
                    let [h, m] = time.split(':');
                    let ampm = h >= 12 ? 'م' : 'ص';
                    h = h % 12 || 12;
                    return `${h}:${m} ${ampm}`;
                };
                const prayerString = `🕌 مواقيت الصلاة (${displayCity}): الفجر ${formatTime(timings.Fajr)} | الظهر ${formatTime(timings.Dhuhr)} | العصر ${formatTime(timings.Asr)} | المغرب ${formatTime(timings.Maghrib)} | العشاء ${formatTime(timings.Isha)}`;
                document.getElementById('prayer-time-item').innerHTML = prayerString;
            }
        } catch (error) { console.error("تعذر جلب مواقيت الصلاة:", error); }
    }
    
    // ====================== الوضع الليلي ======================
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('azemaa_dark_mode', document.body.classList.contains('dark-mode'));
    }
    
    if (localStorage.getItem('azemaa_dark_mode') === 'true') {
        document.body.classList.add('dark-mode');
    }
    
    // ====================== حالة الشبكة ======================
    window.addEventListener('online', () => {
        const status = document.getElementById('network-status');
        status.innerText = "متصل 🟢";
        status.style.background = "#2ecc71";
    });
    window.addEventListener('offline', () => {
        const status = document.getElementById('network-status');
        status.innerText = "غير متصل 🔴";
        status.style.background = "#e74c3c";
    });
    
    // ====================== Firebase Auth ======================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('login-overlay').style.display = 'none';
            // تمرير الـ uid إلى الـ iframe
            frame.onload = () => {
                try {
                    frame.contentWindow.postMessage({ type: 'AUTH_UID', uid: user.uid }, '*');
                } catch(e) { console.log('Cannot post message'); }
            };
        } else {
            document.getElementById('login-overlay').style.display = 'flex';
        }
    });
    
    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('sys-email').value;
        const password = document.getElementById('sys-password').value;
        const loginBtn = document.getElementById('login-btn');
        if(!email || !password) { alert("⚠️ يرجى إدخال البريد الإلكتروني وكلمة المرور!"); return; }
        try {
            loginBtn.innerText = "⏳ جاري تفعيل النظام...";
            loginBtn.disabled = true;
            await signInWithEmailAndPassword(auth, email, password);
        } catch (error) {
            alert("❌ خطأ في التفعيل: بيانات حساب العميل غير مطابقة.");
        } finally {
            loginBtn.innerText = "تفعيل النظام الآمن";
            loginBtn.disabled = false;
        }
    });
    
    document.getElementById('logout-btn').addEventListener('click', () => {
        if(confirm("هل تريد تسجيل الخروج وقفل المنظومة؟")) {
            signOut(auth).then(() => { window.location.reload(); });
        }
    });
    
    // بدء التشغيل
    setInterval(updateDateTime, 1000);
    updateDateTime();
    fetchPrayerTimes();
    
    // استقبال الـ uid من iframe إذا احتاجته الصفحات الفرعية
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'GET_AUTH_UID' && auth.currentUser) {
            event.source.postMessage({ type: 'AUTH_UID_RESPONSE', uid: auth.currentUser.uid }, event.origin);
        }
    });
</script>
</body>
</html>
