<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>azemaa pro - السحابة المتكاملة | شريط الصلاة المتقدم</title>
    <style>
        :root { 
            --bg-main: #000000; 
            --card-bg: #1e293b; 
            --text-color: #f1f5f9; 
            --header-grad: linear-gradient(135deg, #8ba4f9 0%, #6e8efb 50%, #a777e3 100%); 
            --cloud-blue: #00a8ff; 
            --card-radius: 15px; 
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background: var(--bg-main); 
            color: var(--text-color); 
            transition: 0.3s; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        /* شاشة الدخول اللون الأبيض */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff;
            z-index: 100000; display: flex;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
            color: #0f172a;
        }
        .login-box {
            background: #ffffff; padding: 30px; border-radius: var(--card-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 100%; max-width: 400px; text-align: center;
            border: 1px solid #e2e8f0;
        }
        .login-box h3 { margin-top: 0; color: #1e293b; }
        .login-box p { font-size: 13px; color: #64748b; }
        
        .login-box input {
            width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #cbd5e1;
            border-radius: 8px; box-sizing: border-box; font-size: 16px; text-align: center;
            background: #f8fafc; color: #0f172a;
        }
        .login-box input::placeholder { color: #94a3b8; }
        
        .login-box button {
            width: 100%; padding: 12px; background: #6e8efb; border: none;
            color: #fff; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 10px;
        }

        /* تنسيقات رئيسية */
        header { 
            position: relative; 
            background: var(--header-grad); 
            color: #fff; 
            padding: 15px; 
            border-radius: var(--card-radius); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px;
            flex-wrap: wrap; 
            user-select: none; 
        }
        
        .sync-box { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        
        .sync-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr; 
            gap: 6px;
        }

        .btn { 
            border: none; 
            color: #fff; 
            padding: 12px 4px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: bold; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            text-decoration: none; 
            text-align: center;
            white-space: nowrap; 
        }
        .btn:active { transform: scale(0.95); } 
        .btn-device { background: #a29bfe; }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 350px; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 2px solid #334155; transition: 0.3s; }
        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; z-index: 5; cursor: pointer; }
        .h { padding: 12px 15px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; z-index: 10; cursor: pointer; user-select: none; }
        
        .zoom-btn { background: rgba(255,255,255,0.25); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .card.fullscreen .overlay { display: none; }
        iframe { flex: 1; border: none; width: 100%; pointer-events: none; }
        .card.fullscreen iframe { pointer-events: auto; }

        .holidays-dropdown { display: none; background: var(--card-bg); border: 2px solid var(--cloud-blue); position: absolute; top: 80px; right: 10px; z-index: 100; padding: 10px; border-radius: 15px; width: 280px; max-width: 90vw; max-height: 300px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .holidays-dropdown.show { display: block; }
        .holiday-item { padding: 10px; border-bottom: 1px solid #334155; font-size: 0.85rem; display: flex; justify-content: space-between; }

        .time-date-container { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        @media (max-width: 550px) {
            header { padding: 12px; }
            .sync-group { grid-template-columns: 1fr; }
            .btn { font-size: 12px; padding: 10px 2px; } 
            .holidays-dropdown { width: 90vw; right: 5vw; }
        }

        /* ========== شريط الأخبار المتقدم ========== */
        .news-ticker-container {
            background: var(--card-bg);
            border: 2px solid #334155;
            border-radius: var(--card-radius);
            margin-bottom: 10px;
            padding: 8px 0;
            overflow: hidden;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: default;
            direction: ltr;
        }
        
        .ticker-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: scrollTickerRight linear infinite;
            will-change: transform;
        }
        
        .ticker-item {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            padding: 6px 18px;
            border-radius: 40px;
            margin-left: 24px;
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            box-shadow: 0 1px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        
        .ticker-item.prayer-highlight {
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            font-weight: 600;
            border-right: none;
        }
        
        @keyframes scrollTickerRight {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0%); }
        }
        
        .news-ticker-container:hover .ticker-marquee {
            animation-play-state: paused;
        }
        
        @media (max-width: 768px) {
            .ticker-item { font-size: 12px; padding: 5px 12px; margin-left: 16px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h3>🔐 لوحة تفعيل azemaa pro</h3>
        <p>سجل دخول بحساب العميل لتنشيط السحابة</p>
        <input type="email" id="sys-email" placeholder="البريد الإلكتروني للعميل">
        <input type="password" id="sys-password" placeholder="كلمة المرور السحابية">
        <button id="login-btn">تفعيل النظام الآمن</button>
    </div>
</div>

<div class="news-ticker-container" id="tickerContainer">
    <div class="ticker-marquee" id="tickerMarquee">
        <span class="ticker-item">🕋 جاري تحديد المدينة عبر الـ GPS وجلب مواقيت الصلاة...</span>
    </div>
</div>

<header>
    <div>
        <div class="time-date-container">
            <div id="digital-clock" style="font-weight:bold; font-size: 1.2rem;">00:00</div>
            <div id="digital-date" style="font-size: 0.9rem; font-weight: bold; opacity: 0.9;">0000/00/00</div>
            
            <div id="hijri-date-moon" style="font-size: 0.85rem; font-weight: bold; color: #ffdd59; margin: 0 5px;">🌙 0000/00/00</div>
            
            <span id="network-status" style="padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: bold; background: #2ecc71; color: white; user-select: none;">متصل 🟢</span>
        </div>
        <div id="countdown" onclick="toggleHolidaysDropdown(event)" style="font-size: 0.75rem; cursor: pointer; padding-top: 4px;">جاري التحميل...</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; font-weight: bold; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.15); padding: 3px 8px; border-radius: 6px;">azemaa pro</span>
        <button onclick="refreshAllIframes()" title="تحديث الأقسام" style="background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">🔄</button>
        <button id="logout-btn" style="background: rgba(255, 255, 255, 0.2); border: none; color: white; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer;">خروج 🚪</button>
    </div>
</header>

<div id="holidaysDropdown" class="holidays-dropdown"></div>

<div class="sync-box">
    <div class="sync-group">
        <button onclick="window.location.href='agheza.html'" class="btn btn-device">📱 أجهزة</button>
        <button onclick="window.location.href='kmatkitchen.html'" class="btn btn-device">📏 مقايسات</button>
        <button onclick="window.location.href='gbs.html'" class="btn btn-device" style="background: #e84393;">📍 موقع الزبائن gbs</button>
        <button onclick="window.location.href='fatora.html'" class="btn btn-device" style="background: #0984e3;">📄 العقود والتوريدات</button>
    </div>
</div>

<div class="main-container">
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#ff7675;">
            <span>👤 القسم الرئيسي</span>
            <button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button>
        </div>
        <iframe src="zbon.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#00cec9;">
            <span>💸 الخزينة</span>
            <button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button>
        </div>
        <iframe src="yom.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#6c5ce7;">
            <span>👷 العمال</span>
            <button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button>
        </div>
        <iframe src="gyab.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#e17055;">
            <span>📅 التسليم</span>
            <button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button>
        </div>
        <iframe src="tslem.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#fbc531;">
            <span>📝 الملاحظات</span>
            <button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button>
        </div>
        <iframe src="notmop.html"></iframe>
    </div>
    
    <div class="card" ondblclick="toggleZoom(this, event)">
        <div class="overlay"></div>
        <div class="h" style="background:#0984e3;">
            <span>📊 التقارير</span>
            <button class="zoom-btn" onclick="toggleZoom(this.closest('.card'), event)">تكبير</button>
        </div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    // --------------------- إدارة التكبير والتصغير ونظام الحفظ الذكي (الرابط) ---------------------
    
    function openCardBySrc(src) {
        // إغلاق أي كارت مفتوح
        document.querySelectorAll('.card.fullscreen').forEach(c => {
            c.classList.remove('fullscreen');
            c.querySelector('.zoom-btn').innerText = "تكبير";
        });
        
        // فتح الكارت المطلوب إذا تم تمرير الرابط
        if (src) {
            document.querySelectorAll('iframe').forEach(iframe => {
                if (iframe.getAttribute('src') === src) {
                    const card = iframe.closest('.card');
                    card.classList.add('fullscreen');
                    card.querySelector('.zoom-btn').innerText = "إغلاق";
                }
            });
        }
    }

    function toggleZoom(card, event) {
        if(event) event.stopPropagation();
        const iframe = card.querySelector('iframe');
        const src = iframe ? iframe.getAttribute('src') : '';

        if (card.classList.contains('fullscreen')) {
            // إغلاق الكارت ومسح الرابط من المتصفح بدون إعادة تحميل
            history.pushState('', document.title, window.location.pathname + window.location.search);
            openCardBySrc(''); 
        } else {
            // فتح الكارت وإضافة اسم القسم للرابط بالمتصفح ليتم حفظه
            window.location.hash = src;
        }
    }

    // قراءة الرابط عند تحميل الصفحة أو تحديثها أو ضغط زر (رجوع/للخلف) في الهاتف
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.replace('#', '');
        openCardBySrc(hash);
    });

    // العمل عند فتح التطبيق أول مرة
    window.addEventListener('DOMContentLoaded', () => {
        const hash = window.location.hash.replace('#', '');
        if (hash) {
            openCardBySrc(hash);
        }
    });

    document.querySelectorAll('iframe').forEach(iframe => {
        iframe.addEventListener('load', function() {
            try {
                this.contentWindow.document.addEventListener('dblclick', function() {
                    const card = iframe.closest('.card');
                    if(card.classList.contains('fullscreen')) { toggleZoom(card); }
                });
                this.contentWindow.document.addEventListener('click', function() {
                    const dropdown = document.getElementById('holidaysDropdown');
                    if(dropdown.classList.contains('show')) { dropdown.classList.remove('show'); }
                });
            } catch(e) { console.log("عذراً، بعض الإطارات لا تسمح بالأحداث"); }
        });
    });

    document.addEventListener('click', function(event) {
        const dropdown = document.getElementById('holidaysDropdown');
        const countdown = document.getElementById('countdown');
        if (dropdown.classList.contains('show') && event.target !== countdown && !dropdown.contains(event.target)) {
            dropdown.classList.remove('show');
        }
    });

    // --------------------- قائمة المناسبات ---------------------
    const holidays = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026").getTime() },
        { name: "رأس السنة الهجرية 🌙", date: new Date("June 16, 2026").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026").getTime() },
        { name: "عيد ثورة 23 يوليو 🇪🇬", date: new Date("July 23, 2026").getTime() },
        { name: "المولد النبوي الشريف 🕌", date: new Date("September 5, 2026").getTime() },
        { name: "عيد القوات المسلحة 🪖", date: new Date("October 6, 2026").getTime() },
        { name: "رأس السنة الميلادية 🎄", date: new Date("January 1, 2027").getTime() },
        { name: "عيد الميلاد المجيد ⛪", date: new Date("January 7, 2027").getTime() },
        { name: "ثورة 25 يناير 🇪🇬", date: new Date("January 25, 2027").getTime() },
        { name: "شهر رمضان المبارك 🌙", date: new Date("February 8, 2027").getTime() },
        { name: "عيد الفطر المبارك ✨", date: new Date("March 10, 2027").getTime() },
        { name: "عيد تحرير سيناء 🦅", date: new Date("April 25, 2027").getTime() },
        { name: "عيد العمال 🛠️", date: new Date("May 1, 2027").getTime() },
        { name: "شم النسيم 🐟", date: new Date("May 3, 2027").getTime() }
    ];

    function updateHeader() {
        const now = new Date();
        document.getElementById('digital-clock').innerText = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        const weekday = now.toLocaleDateString('ar-EG', { weekday: 'long' });
        const yyyy = now.toLocaleDateString('ar-EG', { year: 'numeric' });
        const mm = now.toLocaleDateString('ar-EG', { month: '2-digit' });
        const dd = now.toLocaleDateString('ar-EG', { day: '2-digit' });
        document.getElementById('digital-date').innerText = weekday + ' ' + yyyy + '/' + mm + '/' + dd;
        
        try {
            const hijriOptions = { day: 'numeric', month: 'long', year: 'numeric' };
            const hijriDate = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', hijriOptions).format(now);
            
            const synodicMonth = 29.53058867; 
            const knownNewMoon = new Date("2000-01-06T18:14:00Z").getTime(); 
            const diffDays = (now.getTime() - knownNewMoon) / (1000 * 60 * 60 * 24);
            const currentLunarAge = diffDays % synodicMonth;
            const phase = currentLunarAge / synodicMonth;
            
            let moonEmoji = "🌑";
            if (phase < 0.03 || phase > 0.97) moonEmoji = "🌑"; 
            else if (phase < 0.22) moonEmoji = "🌒"; 
            else if (phase < 0.28) moonEmoji = "🌓"; 
            else if (phase < 0.47) moonEmoji = "🌔"; 
            else if (phase < 0.53) moonEmoji = "🌕"; 
            else if (phase < 0.72) moonEmoji = "🌖"; 
            else if (phase < 0.78) moonEmoji = "🌗"; 
            else moonEmoji = "🌘"; 

            document.getElementById('hijri-date-moon').innerText = `${moonEmoji} ${hijriDate}`;
        } catch (e) {
            console.error("خطأ في حساب التاريخ الهجري", e);
        }

        let next = holidays.find(h => h.date > now.getTime()) || holidays[0];
        let diff = Math.ceil((next.date - now.getTime()) / (1000 * 60 * 60 * 24));
        document.getElementById('countdown').innerText = "⏳ باقي " + diff + " يوم على " + next.name;
    }

    function refreshAllIframes() {
        document.querySelectorAll('iframe').forEach(f => {
            f.src = f.src;
        });
    }

    window.addEventListener('online', () => {
        const status = document.getElementById('network-status');
        status.innerText = "متصل 🟢";
        status.style.background = "#2ecc71";
    });

    window.addEventListener('offline', () => {
        const status = document.getElementById('network-status');
        status.innerText = "غير متصل 🔴";
        status.style.background = "#e74c3c";
    });

    function toggleHolidaysDropdown(event) {
        if(event) event.stopPropagation();
        const drop = document.getElementById('holidaysDropdown');
        drop.classList.toggle('show');
        if(drop.classList.contains('show')) {
            drop.innerHTML = holidays.map(h => `<div class="holiday-item"><span>${h.name}</span><span>${new Date(h.date).toLocaleDateString('ar-EG')}</span></div>`).join('');
        }
    }

    setInterval(updateHeader, 60000);
    updateHeader();

    // =================== شريط الحركة + جلب اسم المدينة الفعلي ===================
    let currentCity = "الموقع الحالي";
    const tickerMarquee = document.getElementById('tickerMarquee');
    
    function renderTickerWithItems(itemsArray) {
        if (!tickerMarquee) return;
        let fullHTML = '';
        for (let copy = 0; copy < 2; copy++) {
            itemsArray.forEach(item => {
                let classAttr = 'ticker-item';
                if (item.isPrayer) classAttr += ' prayer-highlight';
                fullHTML += `<span class="${classAttr}">${item.text}</span>`;
            });
        }
        tickerMarquee.innerHTML = fullHTML;
        
        const container = document.querySelector('.news-ticker-container');
        const containerWidth = container?.offsetWidth || window.innerWidth;
        const contentWidth = tickerMarquee.scrollWidth;
        let duration = 20;
        if (contentWidth > 0 && containerWidth > 0) {
            const speed = 40;
            duration = (contentWidth / 2) / speed;
            duration = Math.min(50, Math.max(18, duration));
        }
        tickerMarquee.style.animationDuration = `${duration}s`;
        tickerMarquee.style.animation = 'none';
        tickerMarquee.offsetHeight;
        tickerMarquee.style.animation = `scrollTickerRight linear ${duration}s infinite`;
    }
    
    function formatPrayerTime(timeStr) {
        if (!timeStr) return "--:--";
        let [hour, minute] = timeStr.split(':');
        let h = parseInt(hour, 10);
        let period = h >= 12 ? 'م' : 'ص';
        let hour12 = h % 12 || 12;
        return `${hour12}:${minute} ${period}`;
    }
    
    function fetchAndUpdatePrayerTicker() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    let cityName = "موقعك الحالي";
                    try {
                        const geoResponse = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=ar`);
                        if (geoResponse.ok) {
                            const geoData = await geoResponse.json();
                            if (geoData && geoData.address) {
                                cityName = geoData.address.city || geoData.address.town || geoData.address.state || geoData.address.governorate || "موقعك";
                            }
                        }
                    } catch (geoErr) {
                        console.warn("تعذر ترجمة الاسم الجغرافي، سيتم استخدام التحديد التقديري", geoErr);
                    }
                    
                    await getPrayerTimesByCoords(lat, lng, cityName);
                },
                async (error) => {
                    console.warn("تم رفض الـ GPS، جاري الانتقال للحل الاحتياطي الجغرافي للشبكة", error);
                    await fetchFallbackLocationAndTimes();
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        } else {
            fetchFallbackLocationAndTimes();
        }
    }

    async function getPrayerTimesByCoords(lat, lng, cityName) {
        try {
            const apiURL = `https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lng}&method=5`;
            const response = await fetch(apiURL);
            const data = await response.json();
            
            if (data && data.code === 200 && data.data && data.data.timings) {
                const timings = data.data.timings;
                const fajr = formatPrayerTime(timings.Fajr);
                const dhuhr = formatPrayerTime(timings.Dhuhr);
                const asr = formatPrayerTime(timings.Asr);
                const maghrib = formatPrayerTime(timings.Maghrib);
                const isha = formatPrayerTime(timings.Isha);
                
                const fullPrayerText = `🕌 مواقيت الصلاة • مدينة ${cityName} : الفجر ${fajr} | الظهر ${dhuhr} | العصر ${asr} | المغرب ${maghrib} | العشاء ${isha}`;
                
                const now = new Date();
                const currentHour = now.getHours();
                let reminderText = "🌟 سبحان الله وبحمده";
                if (currentHour >= 4 && currentHour < 10) reminderText = "☀️ وقت الأذكار والاستغفار";
                else if (currentHour >= 11 && currentHour < 15) reminderText = "🌤️ حافظ على صلاة الظهر";
                else if (currentHour >= 15 && currentHour < 17) reminderText = "⛅ العصر فضل كبير";
                else if (currentHour >= 17 && currentHour < 19) reminderText = "🌙 بادر بصلاة المغرب";
                else if (currentHour >= 19 && currentHour < 23) reminderText = "✨ العشاء نور القلوب";
                
                const tickerElements = [
                    { text: fullPrayerText, isPrayer: true },
                    { text: `📿 تذكير: ${reminderText}`, isPrayer: false },
                    { text: `🤲 الدعاء: ربنا آتنا في الدنيا حسنة`, isPrayer: false },
                    { text: `📍 موقعك الحالي دقيق عبر الـ GPS`, isPrayer: false }
                ];
                renderTickerWithItems(tickerElements);
            } else {
                throw new Error("استجابة غير مكتملة");
            }
        } catch (error) {
            console.error("خطأ:", error);
            showFallbackTicker();
        }
    }
    
    async function fetchFallbackLocationAndTimes() {
        try {
            const locationResponse = await fetch('https://ipapi.co/json/');
            if (locationResponse.ok) {
                const locationData = await locationResponse.json();
                if (locationData && locationData.latitude && locationData.longitude) {
                    const displayCity = locationData.city || "موقعك الحالي";
                    await getPrayerTimesByCoords(locationData.latitude, locationData.longitude, displayCity);
                    return;
                }
            }
            throw new Error("فشل حل الـ IP الاحتياطي");
        } catch (locErr) {
            console.warn("جاري استخدام الإحداثيات الافتراضية", locErr);
            await getPrayerTimesByCoords(30.0444, 31.2357, "القاهرة");
        }
    }

    function showFallbackTicker() {
        const fallbackItems = [
            { text: `⚠️ تعذر جلب المواقيت تلقائياً • تحقق من الشبكة`, isPrayer: false },
            { text: "🕋 صلِّ في وقتها تنعم بالطمأنينة", isPrayer: false },
            { text: `📅 ${new Date().toLocaleDateString('ar-EG')} • azemaa pro`, isPrayer: false }
        ];
        renderTickerWithItems(fallbackItems);
    }
    
    setTimeout(() => { fetchAndUpdatePrayerTicker(); }, 500);
    setInterval(() => { if (navigator.onLine) fetchAndUpdatePrayerTicker(); }, 3600000);
    window.addEventListener('online', () => { fetchAndUpdatePrayerTicker(); });
    
    let resizeTimer;
    window.addEventListener('resize', () => {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            const currentSpans = tickerMarquee?.querySelectorAll('.ticker-item');
            if (currentSpans && currentSpans.length > 0) {
                const items = Array.from(currentSpans).slice(0, currentSpans.length / 2);
                const textItems = items.map(span => ({ text: span.innerText, isPrayer: span.classList.contains('prayer-highlight') }));
                if (textItems.length) renderTickerWithItems(textItems);
            } else { fetchAndUpdatePrayerTicker(); }
        }, 200);
    });
    
    const tickerContainerDiv = document.getElementById('tickerContainer');
    tickerContainerDiv.addEventListener('touchstart', () => { tickerMarquee.style.animationPlayState = 'paused'; });
    tickerContainerDiv.addEventListener('touchend', () => { tickerMarquee.style.animationPlayState = 'running'; });
</script>

<script>
    (function() {
        let lastClickTime = 0;
        let audioContext = null;
        
        function playSingleClick() {
            const now = Date.now();
            if (now - lastClickTime < 150) return;
            lastClickTime = now;
            
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') audioContext.resume();
                
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 880;
                gainNode.gain.value = 0.12;
                oscillator.type = 'sine';
                oscillator.start();
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.12);
                oscillator.stop(audioContext.currentTime + 0.12);
            } catch(e) { console.log("صوت غير مدعوم"); }
        }
        
        document.addEventListener('click', function(event) {
            let target = event.target;
            let isClickable = false;
            const clickableSelectors = [
                'button', '.btn', '.zoom-btn', '.card', '.overlay', 
                '.h', '.sidebar-item', '#countdown', '#logout-btn',
                'header button', '.sync-group button', '.ticker-item',
                '.news-ticker-container', '.holiday-item', '.login-box button'
            ];
            for (let selector of clickableSelectors) {
                if (target.matches(selector) || (target.closest && target.closest(selector))) {
                    isClickable = true;
                    break;
                }
            }
            if (target.hasAttribute && target.hasAttribute('onclick')) isClickable = true;
            if (target.tagName === 'BUTTON' || target.tagName === 'A' || target.tagName === 'INPUT') isClickable = true;
            if (isClickable) playSingleClick();
        });
    })();
</script>
