<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - Multi User Edition</title>
    <style>
        :root { 
            --bg-main: #0f172a; 
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --cloud-blue: #00a8ff;
            --accent-red: #ff7675;
            --turquoise: #00cec9;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; background: var(--bg-main); color: var(--text-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh;
        }

        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
        }

        .login-card {
            background: var(--card-bg); padding: 40px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); text-align: center;
            width: 90%; max-width: 400px; border: 1px solid var(--turquoise);
        }

        .login-card h2 { color: var(--turquoise); margin-bottom: 25px; }

        input.pin-input {
            width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155;
            background: #0f172a; color: white; text-align: center; font-size: 1.5rem;
            margin-bottom: 20px; outline: none;
        }

        input.pin-input:focus { border-color: var(--cloud-blue); }

        .btn-login {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: var(--cloud-blue); color: white; font-weight: bold;
            font-size: 1.1rem; cursor: pointer; transition: 0.3s;
        }

        .btn-login:hover { background: #0097e6; transform: scale(1.02); }

        .main-content { display: none; padding: 20px; width: 100%; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <div class="login-card">
        <h2>Azemaa Pro</h2>
        <p>أدخل كود الوصول الخاص بك</p>
        <input type="password" id="userPin" class="pin-input" placeholder="****" inputmode="numeric" maxlength="6">
        <button type="button" id="loginBtn" class="btn-login">دخول النظام</button>
        <p id="errorMsg" style="color: var(--accent-red); margin-top: 15px; display: none;">يرجى إدخال الكود الصحيح</p>
    </div>
</div>

<div id="appContent" class="main-content">
    <header style="text-align: center; margin-bottom: 30px;">
        <h1 id="welcomeUser" style="color: var(--turquoise);">مرحباً بك</h1>
        <button id="logoutBtn" style="background: var(--accent-red); color: white; border: none; padding: 5px 15px; border-radius: 8px; cursor: pointer;">تسجيل خروج</button>
    </header>

    <div style="display: flex; gap: 10px; justify-content: center; max-width: 500px; margin: 0 auto;">
        <button id="saveCloudBtn" class="btn-login" style="background: var(--cloud-blue); flex: 1;">حفظ سحابي</button>
        <button id="loadCloudBtn" class="btn-login" style="background: var(--turquoise); flex: 1;">استرجاع بياناتك</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-database.js";

    // --- تنبيه هام جداً يا أحمد ---
    // لازم تستبدل AIzaSy-YOUR-REAL-API-KEY بالمفتاح الحقيقي من إعدادات الفايربيز
    const firebaseConfig = {
        apiKey: "AIzaSy-YOUR-REAL-API-KEY", 
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function checkAuth() {
        const savedPin = localStorage.getItem('azemaa_user_pin');
        const userName = localStorage.getItem('azemaa_user_name');
        if(savedPin) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('appContent').style.display = 'block';
            document.getElementById('welcomeUser').innerText = "أهلاً بك: " + (userName || savedPin);
        }
    }

    const handleLogin = async function() {
        // تحويل الأرقام العربية لأرقام إنجليزية لضمان البحث الصحيح
        let pin = document.getElementById('userPin').value;
        pin = pin.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));

        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');
        
        if (!pin) {
            errorMsg.innerText = "يرجى إدخال الكود أولاً";
            errorMsg.style.display = 'block';
            return;
        }

        loginBtn.innerText = "جاري التحقق...";
        loginBtn.disabled = true;

        try {
            const snapshot = await get(child(ref(db), 'authorized_users/' + pin));
            
            if (snapshot.exists()) {
                const userData = snapshot.val();
                localStorage.setItem('azemaa_user_pin', pin);
                localStorage.setItem('azemaa_user_name', userData.name || "مستخدم");
                checkAuth();
            } else {
                errorMsg.innerText = "هذا الكود غير صالح أو انتهت صلاحيته!";
                errorMsg.style.display = 'block';
            }
        } catch (error) {
            console.error(error);
            errorMsg.innerText = "خطأ في الاتصال بالسيرفر: " + error.message;
            errorMsg.style.display = 'block';
        } finally {
            loginBtn.innerText = "دخول النظام";
            loginBtn.disabled = false;
        }
    };

    // ربط الأزرار برمجياً لتجنب مشاكل الـ Modules
    document.getElementById('loginBtn').addEventListener('click', handleLogin);
    
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('azemaa_user_pin');
        localStorage.removeItem('azemaa_user_name');
        location.reload();
    });

    // حفظ البيانات
    document.getElementById('saveCloudBtn').addEventListener('click', async () => {
        const pin = localStorage.getItem('azemaa_user_pin');
        const data = { ...localStorage }; 
        try {
            await set(ref(db, 'backups/user_' + pin), data);
            alert("✅ تم الحفظ سحابياً بنجاح.");
        } catch (error) {
            alert("❌ خطأ في الحفظ: " + error.message);
        }
    });

    // استرجاع البيانات
    document.getElementById('loadCloudBtn').addEventListener('click', async () => {
        const pin = localStorage.getItem('azemaa_user_pin');
        try {
            const snapshot = await get(child(ref(db), 'backups/user_' + pin));
            if (snapshot.exists()) {
                const cloudData = snapshot.val();
                for (let key in cloudData) {
                    localStorage.setItem(key, cloudData[key]);
                }
                alert("🔄 تم استرجاع بياناتك بنجاح!");
                location.reload();
            } else {
                alert("❓ لا توجد بيانات محفوظة مسبقاً.");
            }
        } catch (error) {
            alert("❌ فشل الاسترجاع: " + error.message);
        }
    });

    checkAuth();
</script>

</body>
</html>
