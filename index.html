<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Cyber Night Edition</title>
    <script>
        // التحقق من حالة تسجيل الدخول
        if (sessionStorage.getItem("isAllowed") !== "true") {
            window.location.replace("login.html");
        }
    </script>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366;
            --cloud-blue: #00a8ff;
            --card-radius: 20px;
        }

        body.dark-mode {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 12px; background: var(--bg-main); 
            color: var(--text-color); display: flex; flex-direction: column; 
            gap: 15px; transition: 0.3s; 
        }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 10px 15px; 
            border-radius: var(--card-radius); display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.2);
        }

        .header-info { display: flex; flex-direction: column; align-items: flex-start; }
        .clock-container { display: flex; align-items: center; gap: 8px; }
        .system-title { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.3px; opacity: 0.95; text-transform: lowercase; }
        #digital-clock { font-size: 1rem; font-weight: bold; font-family: 'Segoe UI', monospace; }
        #countdown { font-size: 0.7rem; opacity: 0.9; margin-top: 2px; color: #fff; font-weight: bold; }

        .header-btns { display: flex; gap: 6px; }

        .theme-btn, .calc-trigger-btn {
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 6px 10px; border-radius: 10px; cursor: pointer; font-size: 0.75rem;
            display: flex; align-items: center; gap: 4px; transition: 0.2s;
        }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { 
            border: none; color: #fff; padding: 15px; border-radius: 15px; 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-cloud { background: var(--cloud-blue); }

        .main-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
        
        .card { 
            background: var(--card-bg); border-radius: var(--card-radius); height: 420px; 
            display: flex; flex-direction: column; overflow: hidden; position: relative; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; transition: 0.3s;
        }
        
        .card-zbon { border-color: #ff7675; } .h-zbon { background: #ff7675; }
        .card-yom { border-color: #00cec9; } .h-yom { background: #00cec9; }
        .card-gyab { border-color: #6c5ce7; } .h-gyab { background: #6c5ce7; }
        .card-tslem { border-color: #e17055; } .h-tslem { background: #e17055; }
        .card-notmop { border-color: #fbc531; } .h-notmop { background: #fbc531; color: #2d3436; }
        .card-takarer { border-color: #0984e3; } .h-takarer { background: #0984e3; }

        .overlay { 
            position: absolute; top: 50px; left: 0; right: 0; bottom: 0; 
            background: transparent; z-index: 5; 
            pointer-events: auto; 
            cursor: pointer;
        }

        .card.fullscreen .overlay {
            pointer-events: none;
            display: none;
        }

        .h { 
            padding: 15px 20px; font-size: 14px; font-weight: bold; color: #fff; 
            display: flex; justify-content: space-between; align-items: center; z-index: 10; 
            cursor: pointer; user-select: none; 
        }

        iframe { 
            flex: 1; border: none; width: 100%; height: 100%; 
            background: #fff; 
        }

        .zoom-btn { background: rgba(255,255,255,0.25); color: inherit; border: none; padding: 6px 14px; border-radius: 12px; font-size: 11px; cursor: pointer; }
        
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; border: none; }

        .calc-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card-bg); border: 2px solid var(--cloud-blue); padding: 15px;
            border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); z-index: 10000; width: 340px;
        }
        #calc-screen { width: 100%; height: 60px; background: #2d3436; color: #00cec9; border-radius: 10px; font-size: 1.4rem; padding: 10px; box-sizing: border-box; }
        .calc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
        .calc-btn { padding: 10px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; }
        .calc-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 9999; }

        /* نافذة تأكيد الخروج المخصصة */
        .logout-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card-bg); border: 2px solid #ff7675; padding: 25px;
            border-radius: 20px; box-shadow: 0 15px 50px rgba(0,0,0,0.4); z-index: 20000; width: 310px;
            text-align: center; box-sizing: border-box;
        }
        .logout-modal h3 { margin-top: 0; color: var(--text-color); font-size: 1.2rem; }
        .logout-modal p { font-size: 0.9rem; opacity: 0.8; margin-bottom: 20px; }
        .logout-btns { display: flex; gap: 10px; }
        .logout-btn-confirm { background: #ff7675; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; flex: 1; }
        .logout-btn-cancel { background: #2d3436; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: bold; flex: 1; }
        body.dark-mode .logout-btn-cancel { background: #475569; }
    </style>
</head>
<body>

<header>
    <div class="header-info">
        <div class="clock-container">
            <span class="system-title">🚀 azemaa pro</span>
            <div id="digital-clock">00:00:00 ص</div>
        </div>
        <div id="countdown">جرٍ حساب المناسبات القادمة...</div>
    </div>
    <div class="header-btns">
        <button class="calc-trigger-btn" onclick="toggleCalc(true)">🧮 حاسبة</button>
        <button class="theme-btn" onclick="toggleTheme()">🌙 ليل</button>
    </div>
</header>

<div class="calc-overlay" id="calcOverlay" onclick="toggleCalc(false)"></div>
<div class="calc-modal" id="calcModal">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <span>📐 حاسبة PRO</span>
        <button onclick="toggleCalc(false)" style="background:red; color:white; border-radius:50%; border:none; cursor:pointer;">✕</button>
    </div>
    <input type="text" id="calc-screen" readonly value="0">
    <div class="calc-grid">
        <button class="calc-btn" onclick="clearCalc()" style="background:#ff7675;">C</button>
        <button class="calc-btn" onclick="pressCalc('/')">÷</button>
        <button class="calc-btn" onclick="pressCalc('*')">×</button>
        <button class="calc-btn" onclick="backspaceCalc()">⌫</button>
        <button class="calc-btn" onclick="pressCalc('7')">7</button>
        <button class="calc-btn" onclick="pressCalc('8')">8</button>
        <button class="calc-btn" onclick="pressCalc('9')">9</button>
        <button class="calc-btn" onclick="pressCalc('-')">-</button>
        <button class="calc-btn" onclick="pressCalc('4')">4</button>
        <button class="calc-btn" onclick="pressCalc('5')">5</button>
        <button class="calc-btn" onclick="pressCalc('6')">6</button>
        <button class="calc-btn" onclick="pressCalc('+')">+</button>
        <button class="calc-btn" onclick="pressCalc('1')">1</button>
        <button class="calc-btn" onclick="pressCalc('2')">2</button>
        <button class="calc-btn" onclick="pressCalc('3')">3</button>
        <button class="calc-btn" onclick="calculateResult()" style="background:#00a8ff; color:white; grid-column: span 1;">=</button>
        <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
</div>

<div class="calc-overlay" id="logoutOverlay" onclick="toggleLogoutModal(false)"></div>
<div class="logout-modal" id="logoutModal">
    <h3>🚪 خروج من azemaa pro</h3>
    <p>سيتم حفظ كافة البيانات سحابياً تلقائياً لتأمين حساباتك قبل الخروج. هل تود المتابعة؟</p>
    <div class="logout-btns">
        <button class="logout-btn-confirm" id="logout-confirm-btn">نعم، حفظ وخروج</button>
        <button class="logout-btn-cancel" onclick="toggleLogoutModal(false)">إلغاء</button>
    </div>
</div>

<div class="sync-box">
    <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ سحابي</button>
    <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتساب</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 يدوي</button>
</div>

<div class="main-container">
    <div class="card card-zbon">
        <div class="overlay"></div>
        <div class="h h-zbon"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶</button></div>
        <iframe src="./zbon.html"></iframe>
    </div>
    <div class="card card-yom">
        <div class="overlay"></div>
        <div class="h h-yom"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶</button></div>
        <iframe src="./yom.html"></iframe>
    </div>
    <div class="card card-gyab">
        <div class="overlay"></div>
        <div class="h h-gyab"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶</button></div>
        <iframe src="./gyab.html"></iframe>
    </div>
    <div class="card card-tslem">
        <div class="overlay"></div>
        <div class="h h-tslem"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶</button></div>
        <iframe src="./tslem.html"></iframe>
    </div>
    <div class="card card-notmop">
        <div class="overlay"></div>
        <div class="h h-notmop"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶</button></div>
        <iframe src="./notmop.html"></iframe>
    </div>
    <div class="card card-takarer">
        <div class="overlay"></div>
        <div class="h h-takarer"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶</button></div>
        <iframe src="./takarer.html"></iframe>
    </div>
</div>

<script>
    // مصفوفة الأعياد الرسمية
    const holidays = [
        { name: "عيد القوات المسلحة 🎖️", date: new Date("October 6, 2026 00:00:00").getTime() },
        { name: "المولد النبوي الشريف 🌙", date: new Date("August 25, 2026 00:00:00").getTime() },
        { name: "ثورة 23 يوليو 🇪🇬", date: new Date("July 23, 2026 00:00:00").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026 00:00:00").getTime() },
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026 00:00:00").getTime() }
    ];

    function updateHeader() {
        const now = new Date();
        const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const upcomingHolidays = [...holidays].reverse();
        const nextHoliday = upcomingHolidays.find(h => h.date >= todayMidnight) || holidays[holidays.length - 1];
        const timeDiff = nextHoliday.date - todayMidnight;
        const days = Math.round(timeDiff / (1000 * 60 * 60 * 24));
        
        document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        
        if (days === 0) {
            document.getElementById('countdown').innerHTML = `اليوم هو ${nextHoliday.name} 🎉 كل عام وأنتم بخير`;
        } else if (days < 0) {
            document.getElementById('countdown').innerHTML = `انتهت أعياد هذا العام الرسمية ✨`;
        } else {
            document.getElementById('countdown').innerHTML = `باقي ${days} أيام على ${nextHoliday.name}`;
        }
    }
    setInterval(updateHeader, 1000); updateHeader();

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

    // وظائف الحاسبة
    const calcScreen = document.getElementById('calc-screen');
    function toggleCalc(show) { document.getElementById('calcModal').style.display = show ? 'block' : 'none'; document.getElementById('calcOverlay').style.display = show ? 'block' : 'none'; }
    function pressCalc(v) { if(calcScreen.value === '0') calcScreen.value = v; else calcScreen.value += v; }
    function clearCalc() { calcScreen.value = '0'; }
    function backspaceCalc() { calcScreen.value = calcScreen.value.slice(0, -1) || '0'; }
    function calculateResult() { try { calcScreen.value = eval(calcScreen.value.replace(/×/g, '*').replace(/÷/g, '/')); } catch(e) { calcScreen.value = 'Error'; setTimeout(clearCalc, 1000); } }

    // التحكم في زر الرجوع وتثبيت الحالة
    window.addEventListener('load', () => {
        window.history.replaceState({ appHome: true }, "");
    });

    function toggleZoom(card, isBackButton = false) {
        const isCurrentlyFullscreen = card.classList.contains('fullscreen');
        
        if (!isCurrentlyFullscreen) {
            card.classList.add('fullscreen');
            window.history.pushState({ fullscreenOpen: true }, "");
        } else {
            card.classList.remove('fullscreen');
            if (!isBackButton) {
                window.history.back();
            }
        }
        
        const btn = card.querySelector('.zoom-btn');
        btn.innerText = card.classList.contains('fullscreen') ? "✕ إغلاق" : "⛶ تكبير";
    }

    // إدارة زر الرجوع بالهاتف لمنع الخروج المزدوج
    window.addEventListener('popstate', function(event) {
        const activeFullscreenCard = document.querySelector('.card.fullscreen');
        if (activeFullscreenCard) {
            toggleZoom(activeFullscreenCard, true);
        } else {
            window.history.pushState({ appHome: true }, "");
            toggleLogoutModal(true);
        }
    });

    function toggleLogoutModal(show) {
        document.getElementById('logoutModal').style.display = show ? 'block' : 'none';
        document.getElementById('logoutOverlay').style.display = show ? 'block' : 'none';
    }

    // التفاعل بالضغط مرتين
    document.querySelectorAll('.h').forEach(header => {
        header.addEventListener('dblclick', function(e) {
            if (e.target.classList.contains('zoom-btn')) return;
            const card = this.closest('.card');
            toggleZoom(card);
        });
    });

    document.querySelectorAll('.overlay').forEach(layer => {
        layer.addEventListener('dblclick', function() {
            const card = this.closest('.card');
            toggleZoom(card);
        });
    });

    // النسخ الاحتياطي
    function generateBackupCode() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { let k = localStorage.key(i); if(k!=='theme') data[k] = localStorage.getItem(k); }
        return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }
    function saveToWhatsApp() { window.location.href = `whatsapp://send?text=*AZ-BACKUP*\n${generateBackupCode()}`; }
    function loadFromWhatsApp() {
        let input = prompt("الصق الكود:"); if (!input) return;
        try {
            let clean = input.includes('*AZ-BACKUP*') ? input.split('*AZ-BACKUP*\n')[1] : input;
            let obj = JSON.parse(decodeURIComponent(escape(atob(clean.trim()))));
            localStorage.clear(); for (let k in obj) localStorage.setItem(k, obj[k]); location.reload();
        } catch (e) { alert("خطأ في الكود"); }
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo"
    };
    
    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);

    // دالة الحفظ السحابي
    async function uploadDataToCloud() {
        let data = {}; 
        for (let i = 0; i < localStorage.length; i++) { 
            let k = localStorage.key(i); 
            if (k !== 'theme') data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); 
        }
        await set(ref(db, 'backups/azemaa_main'), data);
    }

    document.getElementById('cloud-save-btn').onclick = async () => {
        try {
            await uploadDataToCloud();
            alert("✅ تم الحفظ سحابياً بنجاح");
        } catch (e) {
            alert("❌ فشل الحفظ! تحقق من اتصال الإنترنت");
        }
    };

    // الحفظ الإجباري عند تأكيد الخروج
    document.getElementById('logout-confirm-btn').onclick = async function() {
        const origText = this.innerText;
        this.innerText = "⏳ جاري الحفظ الآمن...";
        this.disabled = true;
        
        try {
            await uploadDataToCloud();
            sessionStorage.removeItem("isAllowed");
            window.location.replace("login.html");
        } catch (error) {
            this.innerText = origText;
            this.disabled = false;
            if (confirm("⚠️ فشل الحفظ السحابي (ربما الإنترنت ضعيف). هل تريد الخروج على أي حال بدون حفظ؟")) {
                sessionStorage.removeItem("isAllowed");
                window.location.replace("login.html");
            }
        }
    };

    document.getElementById('cloud-load-btn').onclick = async () => {
        const snap = await get(child(ref(db), 'backups/azemaa_main'));
        if (snap.exists()) {
            localStorage.clear(); const d = snap.val(); for (let k in d) localStorage.setItem(k, d[k]);
            alert("🔄 تم الاسترجاع بنجاح"); location.reload();
        }
    };
</script>
</body>
</html>
