<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - لوحة التحكم الشاملة</title>
    <style>
        :root { 
            --bg-main: #eef2f7; --card-bg: #ffffff; --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366; --cloud-blue: #00a8ff; --card-radius: 20px;
        }
        body.dark-mode { --bg-main: #0f172a; --card-bg: #1e293b; --text-color: #f1f5f9; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; background: var(--bg-main); color: var(--text-color); display: flex; flex-direction: column; gap: 15px; transition: 0.3s; overflow-x: hidden; }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 12px 18px; 
            border-radius: var(--card-radius); display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
        }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 5px 0; }
        .btn { 
            border: none; color: #fff; padding: 12px; border-radius: 15px; 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-cloud { background: var(--cloud-blue); }

        .main-container { display: flex; flex-direction: column; gap: 20px; }
        .card { background: var(--card-bg); border-radius: var(--card-radius); height: 420px; display: flex; flex-direction: column; overflow: hidden; position: relative; box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; }
        
        .overlay { position: absolute; top: 55px; left: 0; right: 0; bottom: 0; background: transparent; z-index: 5; pointer-events: none; }
        
        .h { padding: 15px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 1.1rem; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
        
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; }
        .card.fullscreen .overlay { display: none; }
    </style>
</head>
<body class="dark-mode">

<header>
    <div>
        <div id="digital-clock" style="font-size: 1.2rem; font-weight: bold;">00:00:00 ص</div>
        <div id="countdown" style="font-size: 0.8rem; opacity: 0.8;">Azemaa Pro Software</div>
    </div>
    <div style="display: flex; gap: 10px;">
        <button onclick="document.body.classList.toggle('dark-mode')" style="background:rgba(255,255,255,0.2); border:none; color:#fff; padding:10px; border-radius:12px; cursor:pointer;">🌙</button>
    </div>
</header>

<div class="sync-box">
    <button id="manual-cloud-save" class="btn btn-cloud" style="background-color: #e17055;">☁️ حفظ سحابي للبيانات</button>
    <button id="manual-cloud-load" class="btn btn-cloud">🔄 استرجاع النسخة</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 نسخ للواتساب</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 استعادة يدوي</button>
</div>

<div class="main-container">
    <div class="card" style="border-color: #ff7675;"><div class="overlay"></div><div class="h" style="background: #ff7675;">👤 حسابات الزبائن</div><iframe src="./zbon.html"></iframe></div>
    <div class="card" style="border-color: #00cec9;"><div class="overlay"></div><div class="h" style="background: #00cec9;">💸 حركة الخزينة</div><iframe src="./yom.html"></iframe></div>
    <div class="card" style="border-color: #6c5ce7;"><div class="overlay"></div><div class="h" style="background: #6c5ce7;">👷 سجل العمال</div><iframe src="./gyab.html"></iframe></div>
    <div class="card" style="border-color: #e17055;"><div class="overlay"></div><div class="h" style="background: #e17055;">📅 مواعيد التسليم</div><iframe src="./tslem.html"></iframe></div>
    <div class="card" style="border-color: #fbc531;"><div class="overlay"></div><div class="h" style="background: #fbc531; color:#000;">📝 الملاحظات السريعة</div><iframe src="./notmop.html"></iframe></div>
    <div class="card" style="border-color: #0984e3;"><div class="overlay"></div><div class="h" style="background: #0984e3;">📊 التقارير الختامية</div><iframe src="./takarer.html"></iframe></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU", 
        authDomain: "azemaa-proo.firebaseapp.com", 
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com", 
        projectId: "azemaa-proo" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. الساعة
    setInterval(() => {
        const now = new Date();
        document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('ar-EG');
    }, 1000);

    // 2. التكبير بالنقر المزدوج
    document.querySelectorAll('.h').forEach(el => {
        el.addEventListener('dblclick', () => {
            el.closest('.card').classList.toggle('fullscreen');
        });
    });

    // 3. الحفظ السحابي
    async function cloudSave() {
        let data = {}; 
        for (let i=0; i<localStorage.length; i++) {
            let key = localStorage.key(i);
            data[key.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(key);
        }
        await set(ref(db, 'backups/azemaa_main'), data);
    }

    document.getElementById('manual-cloud-save').onclick = async () => {
        const btn = document.getElementById('manual-cloud-save');
        btn.innerText = "⏳ جاري الرفع...";
        btn.disabled = true;

        try { 
            await cloudSave(); 
            alert("✅ تم الحفظ السحابي بنجاح!");
            btn.innerText = "☁️ حفظ سحابي للبيانات";
            btn.disabled = false;
        } 
        catch (e) { 
            alert("❌ فشل في الاتصال! تأكد من الإنترنت."); 
            btn.innerText = "☁️ حفظ سحابي للبيانات";
            btn.disabled = false;
        }
    };

    document.getElementById('manual-cloud-load').onclick = async () => {
        if(!confirm("⚠️ استرجاع البيانات سيحذف أي تعديلات حالية، متابعة؟")) return;
        try {
            const snapshot = await get(child(ref(db), 'backups/azemaa_main'));
            if (snapshot.exists()) {
                localStorage.clear();
                const data = snapshot.val();
                for (let key in data) localStorage.setItem(key, data[key]);
                alert("🔄 تم الاسترجاع بنجاح!");
                location.reload();
            } else { alert("❌ لا توجد نسخة سحابية!"); }
        } catch (e) { alert("❌ خطأ في السيرفر!"); }
    };

    // 4. وظائف الواتساب
    window.saveToWhatsApp = () => {
        let data = {}; 
        for (let i=0; i<localStorage.length; i++) data[localStorage.key(i)] = localStorage.getItem(localStorage.key(i));
        let code = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        window.location.href = `whatsapp://send?text=*AZ-BACKUP-PRO*%0A${code}`;
    };

    window.loadFromWhatsApp = () => {
        let input = prompt("الصق كود النسخة الاحتياطية هنا:");
        if (!input) return;
        try {
            let clean = input.includes('PRO*\n') ? input.split('PRO*\n')[1] : input;
            let obj = JSON.parse(decodeURIComponent(escape(atob(clean.trim()))));
            localStorage.clear(); 
            for (let k in obj) localStorage.setItem(k, obj[k]);
            location.reload();
        } catch (e) { alert("❌ الكود غير صالح!"); }
    };
</script>
</body>
</html>
