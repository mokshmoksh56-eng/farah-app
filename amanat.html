<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشات البيتكوين | توصيل القمم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تم تغيير سيرفر المكتبة إلى النسخة الأحدث والأكثر استقراراً (unpkg) -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 md:p-4 font-sans">
    
    <div class="max-w-[1800px] mx-auto space-y-6">
        <!-- رأس الصفحة -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
                    <span>📊 لوحة شموع البيتكوين - توصيل الأذيال العلوية</span>
                </h1>
                <p class="text-slate-400 text-sm mt-1">يتم رسم خط أصفر تلقائياً يربط بين الذيل العلوي لكل شمعة والشمعة التي تليها مباشرة.</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-sm font-semibold text-slate-300">متصل بالسوق (Binance)</span>
            </div>
        </div>

        <!-- شبكة الرسوم البيانية -->
        <div id="charts-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-5 gap-4">
            <!-- يتم حقن الشاشات هنا -->
        </div>
    </div>

    <script>
        // التأكد من تحميل المكتبة بنجاح
        if (typeof LightweightCharts === 'undefined') {
            alert("⚠️ تعذر تحميل مكتبة الرسوم البيانية. يرجى التأكد من اتصالك بالإنترنت أو عدم حظر المتصفح للمكتبات الخارجية.");
        }

        // إعداد الفريمات الزمنية الخاصة بمنصة Binance (الأكثر استقراراً للبيانات المفتوحة)
        const timeframes = [
            { interval: "5m", title: "5 دقائق" },
            { interval: "15m", title: "15 دقيقة" },
            { interval: "30m", title: "30 دقيقة" },
            { interval: "1h", title: "1 ساعة" },
            { interval: "2h", title: "ساعتين" },
            { interval: "4h", title: "4 ساعات" },
            { interval: "6h", title: "6 ساعات" },
            { interval: "1d", title: "يوم واحد" },
            { interval: "1w", title: "أسبوع" },
            { interval: "1M", title: "شهر" }
        ];

        const gridContainer = document.getElementById('charts-grid');

        async function createChart(tf, index) {
            // 1. بناء هيكل البطاقة
            const chartCard = document.createElement('div');
            chartCard.className = "bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex flex-col shadow-lg";
            
            const header = document.createElement('div');
            header.className = "bg-slate-800 border-b border-slate-700 p-2 text-center text-sm font-bold text-amber-400";
            header.innerText = `فريم: ${tf.title} (جاري التحميل...)`;
            
            const chartDiv = document.createElement('div');
            chartDiv.className = "w-full h-[350px] relative"; 
            
            chartCard.appendChild(header);
            chartCard.appendChild(chartDiv);
            gridContainer.appendChild(chartCard);

            // 2. إعداد الرسم البياني
            const chart = LightweightCharts.createChart(chartDiv, {
                autoSize: true, // يتأقلم تلقائياً مع حجم الشاشة
                layout: {
                    background: { type: 'solid', color: '#0f172a' },
                    textColor: '#94a3b8',
                },
                grid: {
                    vertLines: { color: '#1e293b' },
                    horzLines: { color: '#1e293b' },
                },
                timeScale: {
                    timeVisible: true,
                    borderColor: '#334155',
                    rightOffset: 5, // إزاحة بسيطة لليسار لرؤية الشمعة الحالية بوضوح
                },
                rightPriceScale: {
                    borderColor: '#334155',
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                }
            });

            // 3. إضافة سلسلة الشموع اليابانية
            const candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981', 
                downColor: '#ef4444', 
                borderVisible: false, 
                wickUpColor: '#10b981', 
                wickDownColor: '#ef4444'
            });

            // 4. سلسلة الخط الأصفر التي ستربط القمم (الأذيال العلوية)
            const highLineSeries = chart.addLineSeries({
                color: '#fbbf24', // لون الخط أصفر
                lineWidth: 2,
                crosshairMarkerVisible: true,
                lastValueVisible: false,
                priceLineVisible: false
            });

            // 5. جلب بيانات السوق
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf.interval}&limit=200`);
                if (!res.ok) throw new Error("تعذر جلب البيانات");
                const data = await res.json();

                const candlesData = [];
                const highsData = [];
                const uniqueTimes = new Set(); // لمنع تكرار الشموع الذي يسبب انهيار الرسم

                data.forEach(d => {
                    // تحويل التوقيت إلى ثواني (الشرط الأساسي لعمل المكتبة بدون أخطاء)
                    const time = Math.floor(d[0] / 1000); 
                    
                    // تجاهل الشموع المكررة إن وجدت
                    if (uniqueTimes.has(time)) return;
                    uniqueTimes.add(time);

                    const open = parseFloat(d[1]);
                    const high = parseFloat(d[2]);
                    const low = parseFloat(d[3]);
                    const close = parseFloat(d[4]);

                    // دمج البيانات
                    candlesData.push({ time, open, high, low, close });
                    // رسم الخط يعتمد فقط على قيمة (high)
                    highsData.push({ time, value: high });
                });

                // تغذية الرسم البياني
                candleSeries.setData(candlesData);
                highLineSeries.setData(highsData);
                header.innerText = `فريم: ${tf.title}`;
                
            } catch (error) {
                console.error(`خطأ في جلب بيانات فريم ${tf.interval}:`, error);
                header.innerText = `فريم: ${tf.title} (حدث خطأ ⚠️)`;
                header.classList.add('text-rose-400');
            }
        }

        // تشغيل العملية لجميع الفريمات بمجرد فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            timeframes.forEach((tf, index) => {
                createChart(tf, index);
            });
        });
    </script>
</body>
</html>
