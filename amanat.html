<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عزيمة برو - الملاحظات الصوتية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: #1c1e21; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #e4e6eb;
            padding-bottom: 15px;
        }
        h1 { color: #1877f2; margin: 0 0 10px 0; font-size: 24px; }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        
        /* تصميم الزر */
        #start-btn { 
            background-color: #1877f2; 
            color: white; 
            padding: 20px; 
            font-size: 20px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
            transition: all 0.3s ease;
            width: 100%;
        }
        /* شكل الزر أثناء التسجيل */
        #start-btn.recording { 
            background-color: #e41e3f !important; 
            animation: pulse 1.5s infinite;
            box-shadow: 0 4px 20px rgba(228, 30, 63, 0.5);
        }
        
        textarea { 
            padding: 15px; 
            font-size: 18px; 
            border-radius: 8px; 
            border: 2px solid #ccd0d5; 
            resize: vertical; 
            min-height: 80px;
            width: 100%;
            box-sizing: border-box;
        }
        textarea:focus { border-color: #1877f2; outline: none; }
        
        #save-btn { 
            background-color: #25D366; 
            color: white; 
            padding: 15px 30px; 
            font-size: 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
        }
        
        .search-box { 
            width: 100%; 
            padding: 15px; 
            font-size: 16px; 
            margin-bottom: 25px; 
            border: 1px solid #ccd0d5; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }
        
        h2 { color: #1c1e21; border-right: 4px solid #1877f2; padding-right: 10px; margin-top: 20px; font-size: 20px;}
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: white; font-size: 14px;}
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: right; }
        th { background-color: #f5f6f7; color: #606770; }
        
        .badge { background-color: #ff9f43; color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .delete-btn { background-color: #e41e3f; padding: 8px 15px; font-size: 13px; border-radius: 6px; color: white; border: none; cursor: pointer; }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(0.97); } 
            100% { transform: scale(1); } 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عزيمة برو - مطابخ فرح 🛠️</h1>
    </div>
    
    <div class="controls">
        <button id="start-btn">اضغط مرة واحدة وتحدث 🎙️</button>
        <textarea id="note-box" placeholder="الكلام هيظهر هنا بمجرد ما تخلص الجملة..."></textarea>
        <button id="save-btn">حفظ وتوزيع في الجداول 💾</button>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث في الملاحظات...">

    <h2>📋 مهام الفريق</h2>
    <table id="tasks-table">
        <thead>
            <tr><th style="width: 25%;">المسؤول</th><th style="width: 50%;">المهمة</th><th style="width: 25%;">إجراء</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>📝 عام</h2>
    <table id="general-table">
        <thead>
            <tr><th style="width: 75%;">الملاحظة</th><th style="width: 25%;">إجراء</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    let notesData = JSON.parse(localStorage.getItem('azemaaNotes')) || [];

    const noteBox = document.getElementById('note-box');
    const startBtn = document.getElementById('start-btn');
    const saveBtn = document.getElementById('save-btn');
    const searchInput = document.getElementById('search-input');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        
        // إيقاف التخمين اللحظي لمنع مشكلة التكرار نهائياً
        recognition.continuous = true;
        recognition.interimResults = false; 

        recognition.onstart = () => {
            isRecording = true;
            startBtn.textContent = "جاري الاستماع... (اضغط للإيقاف أو اسكت قليلاً) 🛑";
            startBtn.classList.add("recording");
        };

        recognition.onresult = (event) => {
            let finalText = '';
            // سحب الكلام النهائي الصافي
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                finalText += event.results[i][0].transcript + " ";
            }
            // إضافة النص الصافي للمربع بدون مسح ما تم كتابته مسبقاً
            if(finalText.trim() !== "") {
                noteBox.value += finalText;
            }
        };

        // عندما يتوقف المايك (سواء ضغطت إيقاف أو سكتّ لفترة)
        recognition.onend = () => {
            isRecording = false;
            startBtn.textContent = "اضغط مرة واحدة وتحدث 🎙️";
            startBtn.classList.remove("recording");
        };

        recognition.onerror = (e) => console.log("Error: " + e.error);

        // تشغيل وإيقاف المايك بضغطة واحدة (Click)
        startBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            if (!isRecording) {
                try {
                    recognition.start();
                } catch(err) {}
            } else {
                recognition.stop();
            }
        });
        
    } else {
        startBtn.disabled = true;
        alert("يرجى استخدام متصفح Google Chrome لتعمل خاصية الصوت بشكل صحيح.");
    }

    saveBtn.addEventListener('click', () => {
        const text = noteBox.value.trim();
        if (!text) return alert("برجاء التحدث أو كتابة الملاحظة أولاً!");

        let assignedPerson = "عام";
        for (let name of teamMembers) {
            if (text.includes(name)) {
                assignedPerson = name;
                break;
            }
        }

        const newNote = { id: Date.now(), text: text, person: assignedPerson };
        notesData.push(newNote);
        localStorage.setItem('azemaaNotes', JSON.stringify(notesData));
        noteBox.value = "";
        renderTables();
    });

    function deleteNote(id) {
        if(confirm("حذف هذه المهمة؟")) {
            notesData = notesData.filter(note => note.id !== id);
            localStorage.setItem('azemaaNotes', JSON.stringify(notesData));
            renderTables();
        }
    }

    function renderTables(searchQuery = "") {
        const tasksBody = document.querySelector('#tasks-table tbody');
        const generalBody = document.querySelector('#general-table tbody');
        tasksBody.innerHTML = ""; generalBody.innerHTML = "";

        const filteredNotes = notesData.filter(note => 
            note.text.includes(searchQuery) || note.person.includes(searchQuery)
        );

        filteredNotes.forEach(note => {
            const row = `
                <tr>
                    ${note.person !== "عام" ? `<td><span class="badge">${note.person}</span></td>` : ""}
                    <td>${note.text}</td>
                    <td><button class="delete-btn" onclick="deleteNote(${note.id})">حذف</button></td>
                </tr>
            `;
            if (note.person !== "عام") tasksBody.innerHTML += row;
            else generalBody.innerHTML += row;
        });
    }

    searchInput.addEventListener('input', (e) => renderTables(e.target.value.trim()));
    renderTables();
</script>

</body>
</html>
