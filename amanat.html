<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الدفع السريع - فودافون كاش</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .app-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }
        h3 {
            color: #e60000;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        button:hover {
            background-color: #555;
        }
        .call-btn {
            display: none;
            width: 100%;
            padding: 15px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .call-btn:hover {
            background-color: #218838;
        }
        .instructions {
            font-size: 13px;
            color: #666;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="app-box">
    <h3>دفع فودافون كاش السريع</h3>
    
    <form id="cashForm" onsubmit="generateCode(event)">
        <input type="tel" id="mobileNumber" placeholder="رقم المحفظة المحول إليه" required pattern="^010[0-9]{8}$" title="أدخل رقم فودافون صحيح مكون من 11 رقم">
        <input type="number" id="transferAmount" placeholder="المبلغ" required min="5">
        
        <button type="submit">تجهيز كود الدفع</button>
    </form>

    <!-- هذا الزر سيظهر بعد الضغط على الزر السابق -->
    <a href="#" id="callButton" class="call-btn">إجراء الاتصال للتحويل</a>

    <p class="instructions">
        <strong>ملاحظة:</strong> عند الضغط على زر الاتصال، سيتم نقلك للوحة الاتصال بهاتفك. اضغط اتصال وأدخل رقمك السري لتأكيد العملية.
    </p>
</div>

<script>
    function generateCode(event) {
        event.preventDefault(); // منع إعادة تحميل الصفحة
        
        // جلب البيانات من الحقول
        const number = document.getElementById('mobileNumber').value;
        const amount = document.getElementById('transferAmount').value;
        
        // تكوين الكود: *9*7*الرقم*المبلغ#
        // نستخدم %23 بدلاً من # لأن المتصفحات لا تقرأ علامة الشباك في الروابط بشكل صحيح
        const ussdCode = `*9*7*{number}*${amount}%23`;
        
        // تجهيز الرابط الخاص بالاتصال
        const telLink = `tel:${ussdCode}`;
        
        // إظهار زر الاتصال وتحديث رابطه
        const callBtn = document.getElementById('callButton');
        callBtn.href = telLink;
        callBtn.style.display = 'block';
        callBtn.innerHTML = `اتصل الآن لتحويل ${amount} ج.م`;
    }
</script>

</body>
</html>
