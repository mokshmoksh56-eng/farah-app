<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام البحث الذكي - azemaa proo</title>
    <style>
        body { 
            font-family: Tahoma, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 650px; 
            margin: auto; 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        h2 { 
            color: #4CAF50; 
            text-align: center; 
            margin-bottom: 20px;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: #fff; 
            border-radius: 4px; 
            font-size: 16px; 
            margin-bottom: 15px; 
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
            outline: none;
        }
        .result-card { 
            background: #2d2d2d; 
            padding: 12px; 
            margin-bottom: 10px; 
            border-radius: 4px; 
            border-right: 4px solid #4CAF50; 
        }
        .result-card span { 
            display: block; 
            font-size: 12px; 
            color: #aaa; 
            margin-top: 6px; 
        }
        .no-result {
            border-right-color: #f44336;
            color: #ff8a80;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>البحث الذكي - azemaa proo</h2>
        <input type="text" id="smartSearch" placeholder="ابحث باسم الزبون، الملاحظات، أو الأقسام (ألومنيوم، خشب، خزينة...)" oninput="executeSearch()">
        <div id="outputResults"></div>
    </div>

    <script>
        // قاعدة بيانات تجريبية تحاكي ربط النظام (Firebase / ملاحظات الورشة / مديونيات العملاء)
        const databaseFiles = [
            { client: "أحمد علي", content: "مقاسات مطبخ ألومنيوم وكسوة فيبر مع تسجيل صوتي للملاحظات", category: "ملاحظات الورشة", date: "2026-06-01" },
            { client: "محمود سعيد", content: "توريد خشب وإكسسوارات رخام وحسابات الخزينة اليومية", category: "يومية الخزينة", date: "2026-06-02" },
            { client: "إبراهيم حسن", content: "تركيب حديد ودفع دفعة مقدمة مع مديونية معلقة", category: "مديونيات العملاء", date: "2026-06-03" }
        ];

        function executeSearch() {
            let query = document.getElementById('smartSearch').value.toLowerCase().trim();
            let container = document.getElementById('outputResults');
            container.innerHTML = '';
            
            if (!query) return;

            let results = databaseFiles.filter(item => 
                item.client.toLowerCase().includes(query) || 
                item.content.toLowerCase().includes(query) ||
                item.category.toLowerCase().includes(query)
            );

            if (results.length === 0) {
                container.innerHTML = '<div class="result-card no-result">لا توجد نتائج مطابقة لبحثك</div>';
                return;
            }

            results.forEach(res => {
                let card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `<strong>العميل:</strong> ${res.client} <br><strong>التفاصيل:</strong> ${res.content} <span>القسم: ${res.category} | التاريخ: ${res.date}</span>`;
                container.appendChild(card);
            });
        }
    </script>

</body>
</html>
