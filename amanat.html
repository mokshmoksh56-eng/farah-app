<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نقل العفش - التسجيل</title>
    <style>
        /* إعدادات أساسية */
        body { 
            font-family: Tahoma, Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        /* حاوية التطبيق */
        .app-container { 
            background: white; 
            padding: 30px 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            width: 90%; 
            max-width: 380px; 
            text-align: center;
            box-sizing: border-box;
        }

        /* الشعار والنصوص */
        .logo { font-size: 26px; font-weight: bold; color: #ff6600; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 25px; font-size: 15px; }

        /* الحقول والقوائم */
        input[type="text"], select {
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
            box-sizing: border-box;
            outline: none;
        }
        select { border: 2px solid #ff6600; cursor: pointer; }
        input[type="text"]:focus { border-color: #ff6600; }

        /* زر رفع الصورة */
        .custom-file-upload {
            display: inline-block;
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 2px dashed #ff6600;
            background-color: #fff9f5;
            color: #ff6600;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        .custom-file-upload:hover { background-color: #ffebe0; }
        input[type="file"] { display: none; /* إخفاء الزر الافتراضي القبيح */ }
        
        /* معاينة الصورة */
        #imagePreview {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 10px;
            display: none; /* مخفية حتى يتم رفع صورة */
            border: 1px solid #ddd;
        }

        /* الأزرار */
        button { 
            width: 100%; 
            padding: 15px; 
            margin: 10px 0 0 0; 
            border-radius: 8px; 
            border: none; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .btn-customer { background: #ff6600; color: white; }
        .btn-customer:hover { background: #e65c00; }
        .btn-driver { background: #333; color: white; }
        .btn-driver:hover { background: #1a1a1a; }
        .btn-back { background: transparent; color: #888; border: 1px solid #ddd; margin-top: 10px; font-size: 16px; }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: اختيار نوع المستخدم -->
    <div class="app-container" id="roleSelectionScreen">
        <div class="logo">نقلتك السريعة</div>
        <div class="subtitle">هل تريد طلب سيارة أم العمل معنا؟</div>
        
        <button class="btn-customer" onclick="goToCustomer()">أنا زبـون (أطلب خدمة)</button>
        <button class="btn-driver" onclick="showDriverRegistration()">أنا سـواق (أقدم خدمة)</button>
    </div>

    <!-- الشاشة الثانية: تسجيل السائق -->
    <div class="app-container hidden" id="driverRegistrationScreen">
        <div class="logo">تسجيل سائق جديد</div>
        <div class="subtitle">يرجى إدخال بياناتك وصورة لمركبتك</div>
        
        <!-- اسم السائق -->
        <input type="text" id="driverName" placeholder="الاسم الثلاثي للسائق">
        
        <!-- نوع المركبة -->
        <select id="vehicleType">
            <option value="" disabled selected>-- اختر نوع المركبة --</option>
            <option value="pickup">ربع نقل</option>
            <option value="pickup_box">ربع نقل بصندوق</option>
            <option value="tricycle">تروسيكل</option>
            <option value="half_truck">نصف نقل</option>
            <option value="winch">ونش رفع عفش</option>
        </select>

        <!-- رفع صورة المركبة -->
        <label for="vehiclePhoto" class="custom-file-upload">
            📸 اضغط هنا لإرفاق صورة المركبة
        </label>
        <!-- accept="image/*" تفتح الكاميرا أو الاستوديو في الموبايل -->
        <input type="file" id="vehiclePhoto" accept="image/*" onchange="previewImage(event)">
        
        <!-- مكان ظهور الصورة بعد رفعها -->
        <img id="imagePreview" alt="معاينة صورة المركبة">

        <!-- أزرار التحكم -->
        <button class="btn-customer" onclick="submitDriverData()">تأكيد التسجيل</button>
        <button class="btn-back" onclick="goBack()">رجوع</button>
    </div>

    <script>
        const roleScreen = document.getElementById('roleSelectionScreen');
        const registrationScreen = document.getElementById('driverRegistrationScreen');

        // دالة الزبون
        function goToCustomer() {
            alert("سيتم توجيهك الآن لصفحة طلب سيارة النقل...");
        }

        // إظهار شاشة التسجيل للسائق
        function showDriverRegistration() {
            roleScreen.classList.add('hidden');
            registrationScreen.classList.remove('hidden');
        }

        // الرجوع للشاشة الرئيسية
        function goBack() {
            registrationScreen.classList.add('hidden'); 
            roleScreen.classList.remove('hidden'); 
        }

        // عرض الصورة بمجرد اختيارها من الهاتف
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = reader.result;
                imgElement.style.display = 'block'; // إظهار الصورة المخفية
            }
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // التأكد من إدخال كافة البيانات قبل التسجيل
        function submitDriverData() {
            const name = document.getElementById('driverName').value;
            const vehicle = document.getElementById('vehicleType').value;
            const photoInput = document.getElementById('vehiclePhoto');
            
            // التحقق من الحقول
            if (name.trim() === "") {
                alert("برجاء إدخال اسم السائق!");
                return;
            }
            if (vehicle === "") {
                alert("برجاء اختيار نوع المركبة!");
                return;
            }
            if (photoInput.files.length === 0) {
                alert("برجاء إرفاق صورة للمركبة!");
                return;
            }

            // إذا كانت كل البيانات صحيحة
            alert("مرحباً بك يا " + name + "!\nتم تسجيل بياناتك وصورة مركبتك بنجاح. سيتم تحويلك لوحة التحكم.");
            // هنا يوضع كود إرسال البيانات لقاعدة البيانات (Backend)
        }
    </script>

</body>
</html>
