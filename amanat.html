<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عزيمة برو - الملاحظات الصوتية</title>
    <!-- استدعاء خط Cairo العصري من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4776E6;
            --secondary: #8E54E9;
            --success: #00b09b;
            --success-light: #96c93d;
            --danger: #ff0844;
            --danger-light: #ffb199;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        body { 
            font-family: 'Cairo', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 900px; 
            margin: auto; 
            background: var(--card-bg); 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); 
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 { 
            margin: 0 0 5px 0; 
            font-size: 32px; 
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: var(--text-muted); font-size: 16px; margin: 0; font-weight: 600; }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        
        /* تصميم زر المايك الجديد */
        #start-btn { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white; 
            padding: 20px; 
            font-size: 20px; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 700; 
            box-shadow: 0 8px 20px rgba(71, 118, 230, 0.3);
            transition: all 0.3s ease;
            width: 100%;
            font-family: 'Cairo', sans-serif;
        }
        #start-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(71, 118, 230, 0.4); }
        
        #start-btn.recording { 
            background: linear-gradient(135deg, var(--danger) 0%, var(--danger-light) 100%);
            animation: pulse 1.5s infinite;
            box-shadow: 0 8px 20px rgba(255, 8, 68, 0.4);
        }
        
        textarea { 
            padding: 20px; 
            font-size: 18px; 
            border-radius: 16px; 
            border: 2px solid #e2e8f0; 
            background-color: #f8fafc;
            resize: vertical; 
            min-height: 100px;
            width: 100%;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        textarea:focus { border-color: var(--primary); background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(71, 118, 230, 0.1); }
        
        #save-btn { 
            background: linear-gradient(135deg, var(--success) 0%, var(--success-light) 100%);
            color: white; 
            padding: 16px 30px; 
            font-size: 18px; 
            border: none; 
            border-radius: 16px; 
            cursor: pointer; 
            font-weight: 700; 
            width: 100%;
            font-family: 'Cairo', sans-serif;
            box-shadow: 0 8px 20px rgba(0, 176, 155, 0.3);
            transition: all 0.3s ease;
        }
        #save-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 176, 155, 0.4); }
        
        .search-box { 
            width: 100%; 
            padding: 16px 20px; 
            font-size: 16px; 
            margin-bottom: 30px; 
            border: 2px solid #e2e8f0; 
            border-radius: 16px; 
            box-sizing: border-box; 
            font-family: 'Cairo', sans-serif;
            transition: all 0.3s ease;
        }
        .search-box:focus { border-color: var(--secondary); outline: none; }
        
        .section-title { 
            color: var(--text-main); 
            font-size: 22px; 
            font-weight: 800;
            margin-bottom: 20px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* تصميم الكروت الذكية (بديل الجداول) */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid #edf2f7;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .task-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.06);
            border-color: #e2e8f0;
        }
        
        /* خط زينة جانبي للكارت */
        .task-card::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            border-radius: 0 16px 16px 0;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge { 
            background: #ebf4ff; 
            color: var(--primary); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-weight: 800; 
            font-size: 14px; 
        }
        .badge.general { background: #f1f5f9; color: var(--text-muted); }

        .task-date {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .card-body {
            font-size: 17px;
            line-height: 1.6;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .delete-btn { 
            background: #fee2e2; 
            color: #ef4444; 
            padding: 8px 16px; 
            font-size: 14px; 
            border-radius: 10px; 
            border: none; 
            cursor: pointer; 
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            transition: all 0.2s ease;
        }
        .delete-btn:hover { background: #ef4444; color: white; }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(0.98); } 
            100% { transform: scale(1); } 
        }

        /* تنسيقات الموبايل */
        @media (max-width: 600px) {
            .container { padding: 25px 15px; border-radius: 0; }
            .card-header { flex-direction: column; align-items: flex-start; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عزيمة برو ⚡</h1>
        <p class="subtitle">نظام الملاحظات الذكي لمطابخ فرح</p>
    </div>
    
    <div class="controls">
        <button id="start-btn">🎙️ اضغط للتسجيل الصوتي</button>
        <textarea id="note-box" placeholder="الكلام هيظهر هنا بمجرد ما تخلص الجملة..."></textarea>
        <button id="save-btn">💾 حفظ المهمة</button>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث في الملاحظات أو عن اسم الفني...">

    <h2 class="section-title">📋 مهام الفريق الموزعة</h2>
    <!-- تغييرنا للجدول وخلينها قائمة كروت -->
    <div id="tasks-list" class="list-container"></div>

    <h2 class="section-title">📝 السجل العام</h2>
    <div id="general-list" class="list-container"></div>
</div>

<script>
    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    let notesData = JSON.parse(localStorage.getItem('azemaaNotesUI')) || [];

    const noteBox = document.getElementById('note-box');
    const startBtn = document.getElementById('start-btn');
    const saveBtn = document.getElementById('save-btn');
    const searchInput = document.getElementById('search-input');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = true;
        recognition.interimResults = false; 

        recognition.onstart = () => {
            isRecording = true;
            startBtn.textContent = "🛑 جاري الاستماع... (اضغط للإيقاف)";
            startBtn.classList.add("recording");
        };

        recognition.onresult = (event) => {
            let finalText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                finalText += event.results[i][0].transcript + " ";
            }
            if(finalText.trim() !== "") {
                noteBox.value += finalText;
            }
        };

        recognition.onend = () => {
            isRecording = false;
            startBtn.textContent = "🎙️ اضغط للتسجيل الصوتي";
            startBtn.classList.remove("recording");
        };

        recognition.onerror = (e) => console.log("Error: " + e.error);

        startBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            if (!isRecording) {
                try { recognition.start(); } catch(err) {}
            } else {
                recognition.stop();
            }
        });
        
    } else {
        startBtn.disabled = true;
        alert("يرجى استخدام متصفح Google Chrome لتعمل خاصية الصوت بشكل صحيح.");
    }

    saveBtn.addEventListener('click', () => {
        const text = noteBox.value.trim();
        if (!text) return alert("برجاء التحدث أو كتابة الملاحظة أولاً!");

        let assignedPerson = "عام";
        for (let name of teamMembers) {
            if (text.includes(name)) {
                assignedPerson = name;
                break;
            }
        }

        // توليد التاريخ والوقت لحظة الحفظ
        const now = new Date();
        const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
        const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
        const dateString = now.toLocaleDateString('ar-EG', dateOptions);
        const timeString = now.toLocaleTimeString('ar-EG', timeOptions);
        const fullDateTime = `${dateString} - ${timeString}`;

        const newNote = { 
            id: Date.now(), 
            text: text, 
            person: assignedPerson,
            datetime: fullDateTime // إضافة الوقت والتاريخ للكائن
        };
        
        notesData.unshift(newNote); // الإضافة في أعلى القائمة
        
        localStorage.setItem('azemaaNotesUI', JSON.stringify(notesData));
        noteBox.value = "";
        renderLists();
    });

    function deleteNote(id) {
        if(confirm("هل أنت متأكد من حذف هذه المهمة؟")) {
            notesData = notesData.filter(note => note.id !== id);
            localStorage.setItem('azemaaNotesUI', JSON.stringify(notesData));
            renderLists();
        }
    }

    // وظيفة رسم الكروت الذكية
    function renderLists(searchQuery = "") {
        const tasksList = document.getElementById('tasks-list');
        const generalList = document.getElementById('general-list');
        
        tasksList.innerHTML = ""; 
        generalList.innerHTML = "";

        const filteredNotes = notesData.filter(note => 
            note.text.includes(searchQuery) || note.person.includes(searchQuery)
        );

        filteredNotes.forEach(note => {
            const isGeneral = note.person === "عام";
            
            // تصميم الكارت
            const cardHTML = `
                <div class="task-card">
                    <div class="card-header">
                        <span class="badge ${isGeneral ? 'general' : ''}">${note.person}</span>
                        <span class="task-date">🕒 ${note.datetime || 'غير محدد'}</span>
                    </div>
                    <div class="card-body">
                        ${note.text}
                    </div>
                    <div>
                        <button class="delete-btn" onclick="deleteNote(${note.id})">حذف المهمة</button>
                    </div>
                </div>
            `;
            
            if (!isGeneral) {
                tasksList.innerHTML += cardHTML;
            } else {
                generalList.innerHTML += cardHTML;
            }
        });

        // رسالة لو القائمة فاضية
        if(tasksList.innerHTML === "") tasksList.innerHTML = "<p style='color:#a0aec0; text-align:center;'>لا توجد مهام مخصصة حالياً.</p>";
        if(generalList.innerHTML === "") generalList.innerHTML = "<p style='color:#a0aec0; text-align:center;'>لا توجد ملاحظات عامة حالياً.</p>";
    }

    searchInput.addEventListener('input', (e) => renderLists(e.target.value.trim()));
    renderLists();
</script>

</body>
</html>
