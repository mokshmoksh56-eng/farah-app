<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نقل العفش - دخول سريع</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; box-sizing: border-box; }
        .logo { font-size: 26px; font-weight: bold; color: #ff6600; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 20px; font-size: 15px; }

        input[type="text"], select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; outline: none; }
        select { border: 2px solid #ff6600; cursor: pointer; }
        
        .custom-file-upload { display: inline-block; width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 2px dashed #ff6600; background-color: #fff9f5; color: #ff6600; font-size: 16px; font-weight: bold; cursor: pointer; box-sizing: border-box; }
        input[type="file"] { display: none; }
        #imagePreview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ddd; }

        button { width: 100%; padding: 14px; margin: 10px 0 0 0; border-radius: 8px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-orange { background: #ff6600; color: white; }
        .btn-orange:hover { background: #e65c00; }
        .btn-dark { background: #333; color: white; }
        .btn-dark:hover { background: #1a1a1a; }
        .btn-back { background: transparent; color: #888; border: 1px solid #ddd; margin-top: 10px; font-size: 16px; }

        .status-box { background: #f9f9f9; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #eee; }
        .status-box p { margin: 0 0 10px 0; font-weight: bold; color: #333; }
        .status-buttons { display: flex; gap: 10px; }
        .btn-status { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; opacity: 0.5; border: 2px solid transparent; transition: 0.2s; }
        .btn-status.active { opacity: 1; border-color: #333; transform: scale(1.05); }
        .bg-green { background: #28a745; color: white; }
        .bg-red { background: #dc3545; color: white; }

        .drivers-list { text-align: right; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .driver-card { background: #fff; border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .driver-info h4 { margin: 0 0 5px 0; color: #333; font-size: 15px; }
        .driver-info span { font-size: 13px; color: #777; }
        .status-dot { width: 15px; height: 15px; border-radius: 50%; transition: 0.3s; }
        .dot-green { background-color: #28a745; box-shadow: 0 0 8px #28a745; }
        .dot-red { background-color: #dc3545; box-shadow: 0 0 8px #dc3545; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. شاشة البداية -->
    <div class="app-container" id="roleScreen">
        <div class="logo">نقلتك السريعة</div>
        <div class="subtitle">هل تريد طلب سيارة أم العمل معنا؟</div>
        <button class="btn-orange" onclick="alert('سيتم توجيهك لصفحة طلب سيارة النقل قريباً...')">أنا زبـون (أطلب خدمة)</button>
        <button class="btn-dark" onclick="switchScreen('roleScreen', 'registerScreen')">أنا سـواق (أقدم خدمة)</button>
    </div>

    <!-- 2. شاشة تسجيل السائق -->
    <div class="app-container hidden" id="registerScreen">
        <div class="logo">تسجيل سائق جديد</div>
        <div class="subtitle">يرجى إدخال بياناتك وصورة لمركبتك</div>
        
        <input type="text" id="driverName" placeholder="الاسم الثلاثي للسائق (اختياري للتجربة)">
        
        <select id="vehicleType">
            <option value="" disabled selected>-- اختر نوع المركبة --</option>
            <option value="ربع نقل">ربع نقل</option>
            <option value="ربع نقل بصندوق">ربع نقل بصندوق</option>
            <option value="تروسيكل">تروسيكل</option>
            <option value="نصف نقل">نصف نقل</option>
            <option value="ونش رفع عفش">ونش رفع عفش</option>
        </select>
        
        <label for="vehiclePhoto" class="custom-file-upload">📸 إرفاق صورة المركبة</label>
        <input type="file" id="vehiclePhoto" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="معاينة الصورة">

        <button class="btn-orange" onclick="submitDriverData()">تأكيد الدخول</button>
        <button class="btn-back" onclick="switchScreen('registerScreen', 'roleScreen')">رجوع</button>
    </div>

    <!-- 3. لوحة تحكم السائق -->
    <div class="app-container hidden" id="dashboardScreen">
        <div class="logo">لوحة القيادة</div>
        <div class="subtitle" id="welcomeMessage">مرحباً يا كابتن</div>
        
        <div class="status-box">
            <p>حالتك الحالية:</p>
            <div class="status-buttons">
                <button id="btnAvailable" class="btn-status bg-green active" onclick="setMyStatus('available')">متاح للعمل</button>
                <button id="btnBusy" class="btn-status bg-red" onclick="setMyStatus('busy')">مشغول/غير متاح</button>
            </div>
        </div>

        <h4 style="text-align:right; margin-bottom:10px; color:#555;">السائقين في منطقتك:</h4>
        <div class="drivers-list" id="driversList">
            <!-- سيتم الإضافة هنا تلقائياً -->
        </div>

        <button class="btn-back" onclick="logout()" style="margin-top:20px;">🚪 تسجيل الخروج</button>
    </div>

    <script>
        let myDriverData = null;
        let mockDrivers = [
            { name: "محمود سيد", vehicle: "ربع نقل بصندوق", status: "green" },
            { name: "أحمد عبد الله", vehicle: "ونش رفع عفش", status: "red" },
            { name: "خالد حسن", vehicle: "تروسيكل", status: "green" },
            { name: "مصطفى كمال", vehicle: "نصف نقل", status: "red" }
        ];

        function switchScreen(hideId, showId) {
            document.getElementById(hideId).classList.add('hidden');
            document.getElementById(showId).classList.remove('hidden');
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = reader.result;
                imgElement.style.display = 'block';
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function submitDriverData() {
            // جلب البيانات أو وضع قيم افتراضية فورية دون تعطيل الدخول
            const name = document.getElementById('driverName').value.trim() || "كابتن (بدون اسم)";
            const vehicle = document.getElementById('vehicleType').value || "غير محدد";

            // تم إزالة شروط (if) الخاصة بالتحقق للدخول المباشر

            myDriverData = { name: name + " (أنت)", vehicle: vehicle, status: "green" };
            
            mockDrivers.unshift(myDriverData);

            document.getElementById('welcomeMessage').innerText = "مرحباً يا " + name;

            renderDrivers();
            switchScreen('registerScreen', 'dashboardScreen');
        }

        function setMyStatus(status) {
            const btnAvailable = document.getElementById('btnAvailable');
            const btnBusy = document.getElementById('btnBusy');

            if(status === 'available') {
                btnAvailable.classList.add('active');
                btnBusy.classList.remove('active');
                myDriverData.status = 'green'; 
            } else {
                btnBusy.classList.add('active');
                btnAvailable.classList.remove('active');
                myDriverData.status = 'red';
            }
            renderDrivers(); 
        }

        function renderDrivers() {
            const listContainer = document.getElementById('driversList');
            listContainer.innerHTML = ""; 

            mockDrivers.forEach(driver => {
                const dotClass = driver.status === "green" ? "dot-green" : "dot-red";
                const nameStyle = driver === myDriverData ? "color: #ff6600; font-weight: bold;" : "";
                
                listContainer.innerHTML += `
                    <div class="driver-card">
                        <div class="driver-info">
                            <h4 style="${nameStyle}">${driver.name}</h4>
                            <span>${driver.vehicle}</span>
                        </div>
                        <div class="status-dot ${dotClass}"></div>
                    </div>
                `;
            });
        }

        function logout() {
            mockDrivers.shift(); 
            document.getElementById('driverName').value = "";
            document.getElementById('vehicleType').value = "";
            document.getElementById('imagePreview').style.display = "none";
            document.getElementById('vehiclePhoto').value = "";
            
            document.getElementById('btnAvailable').classList.add('active');
            document.getElementById('btnBusy').classList.remove('active');

            switchScreen('dashboardScreen', 'roleScreen');
        }
    </script>
</body>
</html>
