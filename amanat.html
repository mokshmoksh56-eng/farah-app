<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الملاحظات الصوتية الذكي</title>
    <style>
        body { font-family: 'Cairo', Tahoma, sans-serif; background-color: #f7f9fc; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        h1, h2 { text-align: center; color: #1e293b; }
        
        .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        textarea { flex-grow: 1; padding: 15px; font-size: 16px; border-radius: 8px; border: 1px solid #cbd5e1; resize: vertical; min-height: 60px; outline: none; }
        textarea:focus { border-color: #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.3); }
        
        button { background-color: #3b82f6; color: white; padding: 15px 25px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        button:hover { background-color: #2563eb; }
        
        #start-btn { background-color: #0ea5e9; }
        .recording { background-color: #ef4444 !important; animation: wavePulse 1.2s infinite; }
        #save-btn { background-color: #10b981; } 
        #save-btn:hover { background-color: #059669; }
        
        .search-box { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; outline: none; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: white; }
        th, td { padding: 12px; border: 1px solid #e2e8f0; text-align: right; }
        th { background-color: #f1f5f9; color: #475569; }
        
        .badge { background-color: #f59e0b; color: white; padding: 5px 10px; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .delete-btn { background-color: #ef4444; padding: 6px 12px; font-size: 13px; margin: 0; }
        .delete-btn:hover { background-color: #dc2626; }

        @keyframes wavePulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>نظام الملاحظات الصوتية الذكي 🎙️</h1>
    
    <div class="controls">
        <button id="start-btn">اضغط وتحدث 🔴</button>
        <textarea id="note-box" placeholder="الكلام سيظهر هنا بشكل فوري أثناء حديثك..."></textarea>
        <button id="save-btn">حفظ الملاحظة 💾</button>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث في الملاحظات أو أسماء الأشخاص...">

    <h2>📋 المهام المخصصة (موزعة حسب الأسماء)</h2>
    <table id="tasks-table">
        <thead>
            <tr>
                <th style="width: 15%;">الشخص / الجهة</th>
                <th style="width: 60%;">المهمة أو الملاحظة</th>
                <th style="width: 15%;">التاريخ</th>
                <th style="width: 10%;">إجراء</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>📝 السجل العام للملاحظات</h2>
    <table id="general-table">
        <thead>
            <tr>
                <th style="width: 75%;">الملاحظة</th>
                <th style="width: 15%;">التاريخ</th>
                <th style="width: 10%;">إجراء</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    // قائمة أسماء الأشخاص المراد تتبعهم (يمكنك تعديلها بحرية)
    const teamMembers = ['أحمد', 'محمد', 'محمود', 'علي', 'ميدو', 'محفوظ', 'أميرة', 'سارة'];
    
    let notesData = JSON.parse(localStorage.getItem('smartNotes')) || [];

    const noteBox = document.getElementById('note-box');
    const startBtn = document.getElementById('start-btn');
    const saveBtn = document.getElementById('save-btn');
    const searchInput = document.getElementById('search-input');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;
    let finalTranscript = "";

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; // اللغة العربية
        recognition.continuous = true;
        recognition.interimResults = true; // **هذا يجعله حساساً ويظهر الكلام فوراً أثناء النطق**

        recognition.onstart = () => {
            startBtn.textContent = "جاري الاستماع... 🛑";
            startBtn.classList.add("recording");
            finalTranscript = noteBox.value ? noteBox.value + " " : "";
        };

        recognition.onresult = (event) => {
            let interimTranscript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + " ";
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            // تحديث مربع النص بالنتائج المؤقتة والنهائية ليكون التفاعل فورياً
            noteBox.value = finalTranscript + interimTranscript;
        };

        recognition.onerror = (event) => {
            console.error("خطأ في التعرف على الصوت: ", event.error);
        };

        recognition.onend = () => {
            startBtn.textContent = "اضغط وتحدث 🔴";
            startBtn.classList.remove("recording");
            isRecording = false;
        };

        startBtn.addEventListener('click', () => {
            if (!isRecording) {
                try {
                    recognition.start();
                    isRecording = true;
                } catch (e) {
                    console.log("التسجيل قيد التشغيل بالفعل");
                }
            } else {
                recognition.stop();
                isRecording = false;
            }
        });
    } else {
        startBtn.disabled = true;
        startBtn.textContent = "المتصفح لا يدعم الصوت";
    }

    // حفظ الملاحظة وتوزيعها تلقائياً على الجداول
    saveBtn.addEventListener('click', () => {
        const text = noteBox.value.trim();
        if (!text) {
            alert("عذراً، الملاحظة فارغة!");
            return;
        }

        let assignedPerson = "عام";
        
        // فحص النص للبحث عن أي اسم من القائمة
        for (let name of teamMembers) {
            // نتحقق من وجود الكلمة بدقة داخل النص
            if (text.includes(name)) {
                assignedPerson = name;
                break;
            }
        }

        const newNote = {
            id: Date.now(),
            text: text,
            person: assignedPerson,
            date: new Date().toLocaleDateString('ar-EG')
        };

        notesData.push(newNote);
        localStorage.setItem('smartNotes', JSON.stringify(notesData));
        
        noteBox.value = "";
        finalTranscript = "";
        renderTables();
    });

    // حذف ملاحظة
    function deleteNote(id) {
        notesData = notesData.filter(note => note.id !== id);
        localStorage.setItem('smartNotes', JSON.stringify(notesData));
        renderTables();
    }

    // عرض وتحديث الجداول مع دعم البحث المباشر
    function renderTables(searchQuery = "") {
        const tasksBody = document.querySelector('#tasks-table tbody');
        const generalBody = document.querySelector('#general-table tbody');
        
        tasksBody.innerHTML = "";
        generalBody.innerHTML = "";

        const filteredNotes = notesData.filter(note => 
            note.text.includes(searchQuery) || note.person.includes(searchQuery)
        );

        filteredNotes.forEach(note => {
            const row = `
                <tr>
                    ${note.person !== "عام" ? `<td><span class="badge">${note.person}</span></td>` : ""}
                    <td>${note.text}</td>
                    <td>${note.date}</td>
                    <td><button class="delete-btn" onclick="deleteNote(${note.id})">حذف</button></td>
                </tr>
            `;

            if (note.person !== "عام") {
                tasksBody.innerHTML += row;
            } else {
                generalBody.innerHTML += row;
            }
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderTables(e.target.value.trim());
    });

    // تحميل الجداول عند فتح الصفحة
    renderTables();
</script>

</body>
</html>
