<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سجل التأخيرات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --danger: #d93025;
            --success: #188038;
            --text: #202124;
            --text-light: #5f6368;
            --border: #e0e0e0;
            --shadow: 0 2px 10px rgba(0, 0, 0, 0.08);
            --radius: 14px;
        }

        body {
            font-family: -apple-system, 'Segoe UI', 'Tahoma', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 16px;
            margin: 0 auto;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
            padding: 12px 0;
            border-bottom: 2px solid #f0f0f0;
        }

        .header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header .date-display {
            margin-top: 8px;
            font-size: 0.95rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .input-card {
            background: #fafbfc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
        }

        .input-field {
            margin-bottom: 14px;
        }

        .input-field label {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text);
        }

        .input-field input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1.1rem;
            background: white;
            color: var(--text);
            font-family: inherit;
            text-align: right;
            direction: rtl;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-field input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .input-field input[type="date"] {
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:active {
            background: var(--primary-hover);
        }

        /* رسالة تم الحفظ */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .quick-summary {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .stat-box {
            background: #f0f7ff;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }

        .stat-box .label {
            font-size: 0.75rem;
            color: var(--text-light);
            font-weight: 600;
        }

        .stat-box .value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 4px;
        }

        .stat-box.danger .value {
            color: var(--danger);
        }

        .stat-box.success .value {
            color: var(--success);
        }

        .records-list {
            margin-top: 10px;
        }

        .record-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-bottom: 1px solid #f0f0f0;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            gap: 10px;
        }

        .record-item .date-info {
            flex: 1;
        }

        .record-item .date-info .day {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .record-item .date-info .full-date {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .record-item .delay-info {
            text-align: left;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .record-item .delay-info.late {
            color: var(--danger);
        }

        .record-item .delay-info.on-time {
            color: var(--success);
        }

        .delete-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .delete-btn:active {
            background: #fce8e6;
        }

        .empty-msg {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .clear-all-btn {
            width: 100%;
            padding: 12px;
            background: #fce8e6;
            color: var(--danger);
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
            transition: background 0.2s;
        }

        .clear-all-btn:active {
            background: #f8d7d5;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">✔️ تم الحفظ بنجاح</div>

    <div class="container">
        <div class="header">
            <h1>⏰ سجل التأخيرات</h1>
            <div class="date-display" id="todayDateText">--</div>
        </div>

        <div class="input-card">
            <div class="input-field">
                <label>📅 التاريخ</label>
                <input type="date" id="dateInput">
            </div>
            <div class="input-field">
                <label>⏱️ مدة التأخير (دقائق)</label>
                <input type="number" id="delayMinutes" min="0" step="1" 
                       placeholder="اكتب الدقائق..."
                       enterkeyhint="done"
                       autocomplete="off">
            </div>
            <button class="btn btn-primary" onclick="addAttendance()">
                ➕ إضافة التأخير
            </button>
        </div>

        <div class="quick-summary">
            <div class="stat-box">
                <div class="label">أيام التأخير</div>
                <div class="value" id="totalLateCount">0</div>
            </div>
            <div class="stat-box danger">
                <div class="label">إجمالي الدقائق</div>
                <div class="value" id="totalDelayMinutes">0</div>
            </div>
            <div class="stat-box success">
                <div class="label">أطول تأخير</div>
                <div class="value" id="maxDelayMinutes">0</div>
            </div>
        </div>

        <div class="records-list" id="recordsList">
            <div class="empty-msg" id="emptyState">
                📭 لا توجد سجلات بعد
            </div>
        </div>

        <button class="clear-all-btn" onclick="clearAllRecords()">
            🗑️ مسح جميع السجلات
        </button>
    </div>

    <script>
        const STORAGE_KEY = 'attendance_delay_records';

        let attendanceRecords = [];
        let lastAddedId = null;
        let toastTimeout;
        let audioContext = null;

        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    attendanceRecords = JSON.parse(stored);
                } else {
                    attendanceRecords = [];
                }
            } catch (e) {
                attendanceRecords = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(attendanceRecords));
            } catch (e) {}
        }

        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDayNameArabic(dateStr) {
            if (!dateStr) return '';
            const daysArabic = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const date = new Date(dateStr + 'T00:00:00');
            return daysArabic[date.getDay()];
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '--';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                const dayName = getDayNameArabic(dateStr);
                return `${dayName} ${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        // دالة تشغيل صوت قصير
        function playSuccessSound() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioContext.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.25);
                osc.start(audioContext.currentTime);
                osc.stop(audioContext.currentTime + 0.25);
            } catch (e) {
                // تجاهل أخطاء الصوت
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        function updateDateDisplay() {
            const dateStr = getTodayDateString();
            document.getElementById('todayDateText').textContent = formatDateShort(dateStr);
        }

        function updateQuickSummary() {
            let totalLate = 0;
            let totalDelayMin = 0;
            let maxDelay = 0;

            attendanceRecords.forEach(record => {
                const delay = record.delayMinutes || 0;
                if (delay > 0) {
                    totalLate++;
                    totalDelayMin += delay;
                    if (delay > maxDelay) maxDelay = delay;
                }
            });

            document.getElementById('totalLateCount').textContent = totalLate;
            document.getElementById('totalDelayMinutes').textContent = totalDelayMin;
            document.getElementById('maxDelayMinutes').textContent = maxDelay;
        }

        function renderRecords() {
            const list = document.getElementById('recordsList');

            if (attendanceRecords.length === 0) {
                list.innerHTML = '<div class="empty-msg">📭 لا توجد سجلات بعد</div>';
                updateQuickSummary();
                return;
            }

            const sorted = [...attendanceRecords].sort((a, b) => {
                return new Date(b.date) - new Date(a.date);
            });

            let html = '';
            sorted.forEach((record, index) => {
                const delay = record.delayMinutes || 0;
                const dayName = getDayNameArabic(record.date);
                const parts = record.date.split('-');
                const fullDate = parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : record.date;
                const delayDisplay = delay > 0 ? `${delay} دقيقة` : 'لا يوجد';
                const isLate = delay > 0;
                const delayClass = isLate ? 'late' : 'on-time';

                html += `
                    <div class="record-item" data-record-id="${record.id}">
                        <div class="date-info">
                            <div class="day">${dayName}</div>
                            <div class="full-date">${fullDate}</div>
                        </div>
                        <div class="delay-info ${delayClass}">${delayDisplay}</div>
                        <button class="delete-btn" onclick="deleteRecord(${index})" title="حذف">🗑️</button>
                    </div>
                `;
            });

            list.innerHTML = html;
            updateQuickSummary();
        }

        function addAttendance() {
            const dateInput = document.getElementById('dateInput');
            const delayInput = document.getElementById('delayMinutes');

            const date = dateInput.value;
            const delayMinutes = parseInt(delayInput.value) || 0;

            if (!date) {
                showToast('⚠️ الرجاء اختيار التاريخ');
                dateInput.focus();
                return;
            }

            if (delayMinutes < 0) {
                showToast('⚠️ مدة التأخير يجب أن تكون صفراً أو أكبر');
                delayInput.focus();
                return;
            }

            const newRecord = {
                id: Date.now(),
                date: date,
                delayMinutes: delayMinutes,
                recordedAt: new Date().toISOString()
            };

            attendanceRecords.push(newRecord);
            lastAddedId = newRecord.id;
            saveData();
            renderRecords();

            delayInput.value = '';
            dateInput.value = getTodayDateString();
            delayInput.focus();

            showToast('✔️ تم الحفظ بنجاح');
            playSuccessSound();
        }

        function deleteRecord(index) {
            if (confirm('حذف هذا السجل؟')) {
                const sorted = [...attendanceRecords].sort((a, b) => {
                    return new Date(b.date) - new Date(a.date);
                });
                const recordToDelete = sorted[index];
                if (recordToDelete) {
                    attendanceRecords = attendanceRecords.filter(r => r.id !== recordToDelete.id);
                    saveData();
                    renderRecords();
                    showToast('🗑️ تم حذف السجل');
                }
            }
        }

        function clearAllRecords() {
            if (attendanceRecords.length === 0) {
                showToast('لا توجد سجلات للمسح');
                return;
            }
            if (confirm('مسح جميع السجلات؟')) {
                attendanceRecords = [];
                saveData();
                renderRecords();
                showToast('🗑️ تم مسح جميع السجلات');
            }
        }

        function init() {
            loadData();
            document.getElementById('dateInput').value = getTodayDateString();
            updateDateDisplay();
            renderRecords();

            const delayInput = document.getElementById('delayMinutes');
            delayInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addAttendance();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', init);
        window.addEventListener('beforeunload', saveData);
    </script>

</body>
</html>
