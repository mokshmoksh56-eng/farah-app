<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة تأخيرات العمل الصباحية - مع إدخال صوتي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f0f4f8;
            --card: #ffffff;
            --primary: #1a73e8;
            --primary-hover: #1557b0;
            --danger: #d93025;
            --success: #188038;
            --warning: #f9ab00;
            --text: #202124;
            --text-light: #5f6368;
            --border: #dadce0;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Segoe UI', 'Tahoma', 'Arial', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(26, 115, 232, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(26, 115, 232, 0.05) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #1a73e8, #4fc3f7, #1a73e8);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 .icon {
            font-size: 2rem;
        }

        .date-display {
            background: #e8f0fe;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #c6dafc;
        }

        .date-display .date-icon {
            font-size: 1.2rem;
        }

        .input-section {
            background: #f8fafd;
            border-radius: var(--radius-sm);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-light);
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            color: var(--text);
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }

        .form-group input[type="date"] {
            cursor: pointer;
        }

        .form-group input[readonly] {
            background: #f1f3f4;
            cursor: default;
            color: var(--text-light);
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.35);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e8eaed;
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #d5d8dc;
        }

        .btn-danger {
            background: #fce8e6;
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 6px;
        }

        /* زر الميكروفون */
        .voice-btn {
            background: #e8f0fe;
            color: var(--primary);
            border: 2px solid #c6dafc;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px 12px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 44px;
        }

        .voice-btn:hover {
            background: #d2e3fc;
            border-color: #1a73e8;
        }

        .voice-btn.listening {
            background: #fce8e6;
            border-color: var(--danger);
            color: var(--danger);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(217, 48, 37, 0); }
            100% { box-shadow: 0 0 0 0 rgba(217, 48, 37, 0); }
        }

        .name-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .name-input-wrapper input {
            flex: 1;
        }

        .schedule-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: #fff8e1;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ffe082;
            font-size: 0.9rem;
        }

        .schedule-info .badge {
            background: var(--warning);
            color: #333;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .results-table {
            overflow-x: auto;
            margin-top: 15px;
        }

        .results-table table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .results-table th {
            background: #f1f3f4;
            padding: 12px 14px;
            text-align: right;
            font-weight: 700;
            color: var(--text-light);
            border-bottom: 2px solid var(--border);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .results-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            text-align: right;
            white-space: nowrap;
        }

        .results-table tr:hover td {
            background: #f8fafd;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            display: inline-block;
        }

        .status-on-time {
            background: #e6f4ea;
            color: var(--success);
        }

        .status-late {
            background: #fce8e6;
            color: var(--danger);
        }

        .status-none {
            background: #f1f3f4;
            color: var(--text-light);
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .empty-state .emoji {
            font-size: 3rem;
            display: block;
            margin-bottom: 10px;
        }

        .summary-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            padding: 15px 20px;
            background: #f8fafd;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .summary-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .summary-item .count {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 18px;
            }

            .header h1 {
                font-size: 1.3rem;
            }

            .form-row {
                flex-direction: column;
                gap: 10px;
            }

            .form-group {
                min-width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .results-table th,
            .results-table td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }

            .name-input-wrapper {
                flex-direction: row;
                flex-wrap: nowrap;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الهيدر -->
        <div class="header">
            <h1>
                <span class="icon">⏰</span>
                حاسبة تأخيرات العمل
            </h1>
            <div class="date-display" id="todayDateDisplay">
                <span class="date-icon">📅</span>
                <span id="dateText">--</span>
            </div>
        </div>

        <!-- معلومات موعد العمل -->
        <div class="schedule-info">
            <span>🕘</span>
            <span>موعد بدء العمل الرسمي:</span>
            <span class="badge" id="officialStartBadge">09:00 صباحاً</span>
            <span style="margin-right:auto;"></span>
            <label for="officialTime" style="font-size:0.8rem; color:var(--text-light);">تعديل:</label>
            <input type="time" id="officialTime" value="09:00" style="padding:6px 10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:0.9rem;">
        </div>

        <!-- نموذج الإدخال -->
        <div class="input-section">
            <div class="form-row">
                <div class="form-group">
                    <label for="employeeName">👤 اسم الموظف</label>
                    <div class="name-input-wrapper">
                        <input type="text" id="employeeName" placeholder="مثال: أحمد محمد" autocomplete="off">
                        <button class="voice-btn" id="voiceBtn" onclick="startVoiceInput()" title="استمع واكتب الاسم">
                            🎤
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="dateInput">📅 التاريخ</label>
                    <input type="date" id="dateInput">
                </div>
                <div class="form-group">
                    <label for="arrivalTime">🕐 وقت الحضور الفعلي</label>
                    <input type="time" id="arrivalTime">
                </div>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="addAttendance()">
                    ➕ إضافة وتسجيل
                </button>
                <button class="btn btn-secondary" onclick="resetForm()">
                    🔄 إعادة تعيين
                </button>
            </div>
        </div>

        <!-- ملخص -->
        <div class="summary-bar" id="summaryBar">
            <div class="summary-item">
                📋 إجمالي السجلات: <span class="count" id="totalCount">0</span>
            </div>
            <div class="summary-item" style="color:var(--success);">
                ✅ في الموعد: <span class="count" id="onTimeCount">0</span>
            </div>
            <div class="summary-item" style="color:var(--danger);">
                ⚠️ متأخر: <span class="count" id="lateCount">0</span>
            </div>
        </div>

        <!-- جدول النتائج -->
        <div class="results-table" id="resultsTable">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>📅 التاريخ</th>
                        <th>👤 الاسم</th>
                        <th>🕘 وقت الحضور</th>
                        <th>⏱️ مدة التأخير</th>
                        <th>📌 الحالة</th>
                        <th>🗑️</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- سيتم ملؤها بالجافاسكريبت -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state">
                <span class="emoji">📭</span>
                لا توجد سجلات بعد. قم بإضافة أول حضور!
            </div>
        </div>

        <!-- أزرار أسفل -->
        <div class="footer-actions">
            <button class="btn btn-danger btn-sm" onclick="clearAllRecords()">
                🗑️ مسح جميع السجلات
            </button>
            <div style="display:flex; gap:8px;">
                <button class="btn btn-secondary btn-sm" onclick="exportData()">
                    📥 تصدير CSV
                </button>
                <button class="btn btn-secondary btn-sm" onclick="printTable()">
                    🖨️ طباعة
                </button>
            </div>
        </div>
    </div>

    <script>
        // ====================== إدارة البيانات ======================
        const STORAGE_KEY = 'attendance_late_records';
        const OFFICIAL_TIME_KEY = 'official_start_time';

        let attendanceRecords = [];
        let officialStartTime = '09:00';
        let recognition = null;
        let isListening = false;

        // تحميل البيانات من التخزين المحلي
        function loadData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    attendanceRecords = JSON.parse(stored);
                } else {
                    attendanceRecords = [];
                }

                const storedTime = localStorage.getItem(OFFICIAL_TIME_KEY);
                if (storedTime) {
                    officialStartTime = storedTime;
                }
            } catch (e) {
                console.error('خطأ في تحميل البيانات:', e);
                attendanceRecords = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(attendanceRecords));
                localStorage.setItem(OFFICIAL_TIME_KEY, officialStartTime);
            } catch (e) {
                console.error('خطأ في حفظ البيانات:', e);
            }
        }

        // ====================== دوال الوقت والتاريخ ======================
        function getTodayDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getCurrentTimeString() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function formatDateForDisplay(dateStr) {
            if (!dateStr) return '--';
            try {
                const parts = dateStr.split('-');
                if (parts.length === 3) {
                    const [year, month, day] = parts;
                    const date = new Date(year, month - 1, day);
                    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                    return date.toLocaleDateString('ar-EG', options);
                }
                return dateStr;
            } catch (e) {
                return dateStr;
            }
        }

        function formatTimeForDisplay(timeStr) {
            if (!timeStr) return '--';
            try {
                const [hours, minutes] = timeStr.split(':').map(Number);
                const period = hours >= 12 ? 'مساءً' : 'صباحاً';
                const displayHours = hours % 12 || 12;
                return `${displayHours}:${String(minutes).padStart(2, '0')} ${period}`;
            } catch (e) {
                return timeStr;
            }
        }

        function formatTime12Hour(timeStr) {
            if (!timeStr) return '--';
            const [hours, minutes] = timeStr.split(':').map(Number);
            const period = hours >= 12 ? 'مساءً' : 'صباحاً';
            const displayHours = hours % 12 || 12;
            return `${displayHours}:${String(minutes).padStart(2, '0')} ${period}`;
        }

        // ====================== حساب التأخير ======================
        function calculateDelay(arrivalTime, officialTime) {
            if (!arrivalTime || !officialTime) return { delayMinutes: 0, isLate: false, delayText: '--' };

            const [arrHours, arrMinutes] = arrivalTime.split(':').map(Number);
            const [offHours, offMinutes] = officialTime.split(':').map(Number);

            const arrivalTotalMinutes = arrHours * 60 + arrMinutes;
            const officialTotalMinutes = offHours * 60 + offMinutes;

            const diff = arrivalTotalMinutes - officialTotalMinutes;

            if (diff <= 0) {
                return { delayMinutes: 0, isLate: false, delayText: 'لا يوجد تأخير' };
            } else {
                const hours = Math.floor(diff / 60);
                const mins = diff % 60;
                let text = '';
                if (hours > 0) {
                    text += `${hours} ساعة `;
                }
                if (mins > 0) {
                    text += `${mins} دقيقة`;
                }
                text = text.trim() || '0 دقيقة';
                return { delayMinutes: diff, isLate: true, delayText: text };
            }
        }

        // ====================== دوال الواجهة ======================
        function updateDateDisplay() {
            const dateStr = getTodayDateString();
            const display = formatDateForDisplay(dateStr);
            document.getElementById('dateText').textContent = display;
            document.getElementById('todayDateDisplay').title = dateStr;
        }

        function updateOfficialTimeBadge() {
            const display = formatTime12Hour(officialStartTime);
            document.getElementById('officialStartBadge').textContent = display;
            document.getElementById('officialTime').value = officialStartTime;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');

            if (attendanceRecords.length === 0) {
                tbody.innerHTML = '';
                emptyState.style.display = 'block';
                document.querySelector('.results-table table').style.display = 'none';
            } else {
                emptyState.style.display = 'none';
                document.querySelector('.results-table table').style.display = 'table';

                const sorted = [...attendanceRecords].sort((a, b) => {
                    const dateA = new Date(a.date + 'T' + (a.arrivalTime || '00:00'));
                    const dateB = new Date(b.date + 'T' + (b.arrivalTime || '00:00'));
                    return dateB - dateA;
                });

                let html = '';
                sorted.forEach((record, index) => {
                    const delayInfo = calculateDelay(record.arrivalTime, record.officialTime || officialStartTime);
                    const name = record.name || 'غير محدد';
                    const dateDisplay = formatDateForDisplay(record.date);
                    const timeDisplay = formatTimeForDisplay(record.arrivalTime);

                    let statusClass = 'status-on-time';
                    let statusText = '✅ في الموعد';
                    if (delayInfo.isLate) {
                        statusClass = 'status-late';
                        statusText = '⚠️ متأخر';
                    }

                    html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${dateDisplay}</td>
                            <td>${escapeHtml(name)}</td>
                            <td>${timeDisplay}</td>
                            <td style="font-weight:600; ${delayInfo.isLate ? 'color:var(--danger);' : 'color:var(--success);'}">
                                ${delayInfo.delayText}
                            </td>
                            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                            <td>
                                <button class="btn btn-danger btn-sm" onclick="deleteRecord(${index})" title="حذف">
                                    🗑️
                                </button>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            updateSummary();
        }

        function updateSummary() {
            document.getElementById('totalCount').textContent = attendanceRecords.length;

            let onTime = 0;
            let late = 0;
            attendanceRecords.forEach(record => {
                const delayInfo = calculateDelay(record.arrivalTime, record.officialTime || officialStartTime);
                if (delayInfo.isLate) {
                    late++;
                } else {
                    onTime++;
                }
            });

            document.getElementById('onTimeCount').textContent = onTime;
            document.getElementById('lateCount').textContent = late;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ====================== إضافة وحذف السجلات ======================
        function addAttendance() {
            const nameInput = document.getElementById('employeeName');
            const dateInput = document.getElementById('dateInput');
            const timeInput = document.getElementById('arrivalTime');

            const name = nameInput.value.trim();
            const date = dateInput.value;
            const arrivalTime = timeInput.value;

            if (!date) {
                alert('⚠️ الرجاء اختيار التاريخ');
                dateInput.focus();
                return;
            }

            if (!arrivalTime) {
                alert('⚠️ الرجاء إدخال وقت الحضور');
                timeInput.focus();
                return;
            }

            const newRecord = {
                id: Date.now(),
                name: name || 'غير محدد',
                date: date,
                arrivalTime: arrivalTime,
                officialTime: officialStartTime,
                recordedAt: new Date().toISOString()
            };

            attendanceRecords.push(newRecord);
            saveData();
            renderTable();

            nameInput.value = '';
            timeInput.value = '';
            dateInput.value = getTodayDateString();
            nameInput.focus();
        }

        function deleteRecord(index) {
            if (confirm('هل أنت متأكد من حذف هذا السجل؟')) {
                const sorted = [...attendanceRecords].sort((a, b) => {
                    const dateA = new Date(a.date + 'T' + (a.arrivalTime || '00:00'));
                    const dateB = new Date(b.date + 'T' + (b.arrivalTime || '00:00'));
                    return dateB - dateA;
                });

                const recordToDelete = sorted[index];
                if (recordToDelete) {
                    attendanceRecords = attendanceRecords.filter(r => r.id !== recordToDelete.id);
                    saveData();
                    renderTable();
                }
            }
        }

        function clearAllRecords() {
            if (attendanceRecords.length === 0) {
                alert('لا توجد سجلات لمسحها.');
                return;
            }

            if (confirm('⚠️ هل أنت متأكد من مسح جميع السجلات؟ لا يمكن التراجع عن هذا الإجراء.')) {
                attendanceRecords = [];
                saveData();
                renderTable();
            }
        }

        function resetForm() {
            document.getElementById('employeeName').value = '';
            document.getElementById('dateInput').value = getTodayDateString();
            document.getElementById('arrivalTime').value = '';
            document.getElementById('employeeName').focus();
        }

        // ====================== التعرّف على الصوت ======================
        function startVoiceInput() {
            const voiceBtn = document.getElementById('voiceBtn');
            const nameInput = document.getElementById('employeeName');

            // إذا كان المتصفح لا يدعم SpeechRecognition
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('⚠️ متصفحك لا يدعم التعرف على الصوت. الرجاء استخدام متصفح Chrome أو Edge.');
                return;
            }

            // إذا كان قيد الاستماع بالفعل، أوقفه
            if (isListening && recognition) {
                recognition.stop();
                return;
            }

            // إنشاء كائن التعرف على الصوت إذا لم يكن موجوداً
            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-EG'; // اللهجة المصرية
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                recognition.continuous = false;

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    nameInput.value = transcript.trim();
                    nameInput.focus();
                };

                recognition.onerror = function(event) {
                    console.error('خطأ في التعرف على الصوت:', event.error);
                    let message = 'حدث خطأ أثناء التعرف على الصوت.';
                    if (event.error === 'not-allowed') {
                        message = 'تم رفض إذن استخدام الميكروفون. الرجاء السماح بالوصول.';
                    } else if (event.error === 'no-speech') {
                        message = 'لم يتم سماع أي كلام. حاول مرة أخرى.';
                    } else if (event.error === 'network') {
                        message = 'خطأ في الشبكة. تأكد من اتصالك بالإنترنت.';
                    }
                    alert('⚠️ ' + message);
                };

                recognition.onend = function() {
                    isListening = false;
                    voiceBtn.classList.remove('listening');
                    voiceBtn.textContent = '🎤';
                };
            }

            // بدء الاستماع
            isListening = true;
            voiceBtn.classList.add('listening');
            voiceBtn.textContent = '🔴';
            recognition.start();
        }

        // ====================== تصدير وطباعة ======================
        function exportData() {
            if (attendanceRecords.length === 0) {
                alert('لا توجد بيانات للتصدير.');
                return;
            }

            const sorted = [...attendanceRecords].sort((a, b) => {
                const dateA = new Date(a.date + 'T' + (a.arrivalTime || '00:00'));
                const dateB = new Date(b.date + 'T' + (b.arrivalTime || '00:00'));
                return dateB - dateA;
            });

            let csv = 'التاريخ,الاسم,وقت الحضور,مدة التأخير,الحالة\n';
            sorted.forEach(record => {
                const delayInfo = calculateDelay(record.arrivalTime, record.officialTime || officialStartTime);
                const status = delayInfo.isLate ? 'متأخر' : 'في الموعد';
                const delayText = delayInfo.isLate ? delayInfo.delayText : 'لا يوجد';
                csv +=
                    `${record.date},${record.name || 'غير محدد'},${record.arrivalTime},${delayText},${status}\n`;
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `تقرير_التأخيرات_${getTodayDateString()}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function printTable() {
            window.print();
        }

        // ====================== التهيئة ======================
        function init() {
            loadData();

            const dateInput = document.getElementById('dateInput');
            dateInput.value = getTodayDateString();

            const timeInput = document.getElementById('arrivalTime');
            timeInput.value = getCurrentTimeString();

            updateDateDisplay();
            updateOfficialTimeBadge();

            document.getElementById('officialTime').addEventListener('change', function(e) {
                officialStartTime = e.target.value;
                updateOfficialTimeBadge();
                saveData();
                renderTable();
            });

            setInterval(() => {
                updateDateDisplay();
            }, 60000);

            renderTable();
        }

        document.addEventListener('DOMContentLoaded', init);

        window.addEventListener('beforeunload', function() {
            saveData();
            if (recognition && isListening) {
                recognition.abort();
            }
        });
    </script>

</body>
</html>
