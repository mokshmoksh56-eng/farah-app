<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشة القفل</title>
    <style>
        /* إعدادات الشاشة الأساسية */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            /* ممكن تغير لون الخلفية أو تحط صورة براحتك */
            background-color: #121212; 
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* حاوية شاشة القفل */
        .lock-screen {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* تصميم الساعة والتاريخ اللي تحت */
        #datetime {
            position: absolute;
            bottom: 15px; /* المسافة من أسفل الشاشة */
            font-size: 10px; /* حجم الخط صغير جداً */
            opacity: 0.15; /* تقليل الشفافية عشان مايكونش باين أوي */
            letter-spacing: 1px;
            user-select: none; /* عشان المستخدم ميعرفش يحدد النص */
        }

        /* عنصر تجريبي في نص الشاشة (ممكن تمسحه) */
        .main-content {
            font-size: 24px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="lock-screen">
        <!-- محتوى شاشة القفل الرئيسي (تقدر تحط باسورد أو صورة هنا) -->
        <div class="main-content">
            🔒 اسحب للأعلى لفتح الشاشة
        </div>

        <!-- الجزء الخاص بالتاريخ والساعة -->
        <div id="datetime"></div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // خيارات تنسيق الوقت والتاريخ (بالعربي)
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            };
            
            const formattedDateTime = now.toLocaleDateString('ar-EG', options);
            
            // عرض النص في الشاشة
            document.getElementById('datetime').textContent = formattedDateTime;
        }

        // تشغيل الدالة أول مرة عشان تظهر فوراً
        updateDateTime();
        
        // تحديث الوقت كل دقيقة (60000 مللي ثانية)
        setInterval(updateDateTime, 60000);
    </script>
</body>
</html>
