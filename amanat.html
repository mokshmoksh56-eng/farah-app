<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 روبوت azemaa proo المتصل بالسحابة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .chat-container {
            width: 100%;
            max-width: 750px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 95vh;
            max-height: 850px;
        }
        .chat-header {
            background: linear-gradient(135deg, #075E54, #128C7E);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h2 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #conn-status {
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        #conn-status.online { background: #4CAF50; color: white; }
        #conn-status.offline { background: #f44336; color: white; }
        #conn-status.loading { background: #ff9800; color: white; }
        .chat-messages {
            flex: 1;
            padding: 15px 20px;
            overflow-y: auto;
            background: #ece5dd;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s;
        }
        .message.bot {
            background: #fff;
            align-self: flex-start;
            border-bottom-left-radius: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .message.user {
            background: #dcf8c6;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .message .time {
            font-size: 10px;
            color: #999;
            margin-top: 5px;
            display: block;
            text-align: left;
        }
        .message.bot .time { text-align: right; }
        .message .bot-name {
            font-weight: bold;
            color: #075E54;
            margin-bottom: 4px;
            display: block;
        }
        .chat-input {
            display: flex;
            padding: 12px 15px;
            background: #f0f2f5;
            gap: 10px;
            border-top: 1px solid #ddd;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            font-size: 14px;
            font-weight: 600;
            background: #fff;
            transition: 0.2s;
        }
        .chat-input input:focus { border-color: #128C7E; }
        .chat-input button {
            background: #128C7E;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }
        .chat-input button:hover { background: #075E54; }
        .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 8px 14px;
            background: #fff;
            border-radius: 20px;
            align-self: flex-start;
            margin-top: 5px;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.5s infinite both;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.3; }
        }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 15px 5px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }
        .quick-replies button {
            background: #e8f0fe;
            border: 1px solid #ccc;
            border-radius: 20px;
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-replies button:hover {
            background: #d4e2fc;
            border-color: #128C7E;
        }
        @media (max-width: 500px) {
            .chat-container { height: 98vh; max-height: none; border-radius: 10px; }
            .chat-header h2 { font-size: 0.9rem; }
            .message { font-size: 13px; }
            .quick-replies button { font-size: 11px; padding: 4px 10px; }
        }
        .data-badge {
            background: #075E54;
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
            margin: 2px 0;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <h2>🤖 روبوت azemaa proo</h2>
        <span id="conn-status" class="loading">⏳ جاري الاتصال...</span>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <span class="bot-name">🤖 azemaa proo</span>
            مرحباً! أنا الآن <strong>متصل بالسحابة</strong> وأستطيع قراءة بياناتك الحية. 🌐<br><br>
            جرب أن تسألني:<br>
            • "كم عدد العمال؟"<br>
            • "إجمالي المديونيات؟"<br>
            • "صافي اليومية لليوم؟"<br>
            • "أرني آخر الملاحظات"<br>
            • "كم عميل مسجل؟"<br><br>
            أو اسأل عن طريقة الاستخدام (كيف أضيف، كيف أعدل، إلخ).
            <span class="time">الآن</span>
        </div>
    </div>

    <!-- Quick Replies -->
    <div class="quick-replies" id="quickReplies">
        <button onclick="sendQuick('كم عدد العمال؟')">👷 عدد العمال</button>
        <button onclick="sendQuick('إجمالي المديونيات؟')">💰 المديونيات</button>
        <button onclick="sendQuick('صافي اليومية اليوم؟')">📊 صافي اليوم</button>
        <button onclick="sendQuick('أرني آخر الملاحظات')">📝 الملاحظات</button>
        <button onclick="sendQuick('كيف أضيف زبون؟')">🧑‍💼 إضافة زبون</button>
    </div>

    <!-- Input -->
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter') sendMessage()" disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>إرسال</button>
    </div>
</div>

<script type="module">
    // ============================================================
    // استيراد Firebase (نفس إعداداتك)
    // ============================================================
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    // متغيرات عامة
    let currentUid = null;
    let isReady = false;
    let cachedData = {};

    // عناصر DOM
    const statusEl = document.getElementById('conn-status');
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // ============================================================
    // دوال مساعدة
    // ============================================================
    function getTime() {
        const now = new Date();
        return now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        if (sender === 'bot') {
            div.innerHTML = `<span class="bot-name">🤖 azemaa proo</span>${text}<span class="time">${getTime()}</span>`;
        } else {
            div.innerHTML = `${text}<span class="time">${getTime()}</span>`;
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const typing = document.createElement('div');
        typing.className = 'typing-indicator';
        typing.id = 'typingIndicator';
        typing.innerHTML = '<span></span><span></span><span></span>';
        chatMessages.appendChild(typing);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function setStatus(text, type = 'loading') {
        statusEl.innerText = text;
        statusEl.className = type;
    }

    // ============================================================
    // دوال جلب البيانات الحية من Firebase
    // ============================================================
    async function fetchAllData() {
        if (!currentUid) return null;
        try {
            setStatus('⏳ جلب البيانات...', 'loading');
            const snapshot = await get(ref(db, `backups`));
            const all = snapshot.val() || {};
            const uid = currentUid;
            
            cachedData = {
                workers: all.workers_master?.[uid] || [],
                weeks: all.workers_weeks?.[uid] || {},
                yom: all.yomya_users?.[uid] || {},
                clients: all.users?.[uid] || {},
                notes: all.notes_users?.[uid] || {},
                settings: all.users?.[uid]?.settings || {}
            };
            
            setStatus('🟢 متصل', 'online');
            return cachedData;
        } catch (e) {
            console.error("فشل جلب البيانات:", e);
            setStatus('🔴 خطأ في الاتصال', 'offline');
            return null;
        }
    }

    // دالة لحساب إجمالي المديونيات
    function calcTotalDebt(clients) {
        let total = 0;
        let count = 0;
        let paidCount = 0;
        for (let id in clients) {
            if (id === 'settings') continue;
            const c = clients[id];
            if (c.isArchived) continue;
            const totalVal = parseFloat(c.t) || 0;
            let paidVal = 0;
            if (c.pays) {
                c.pays.forEach(p => paidVal += parseFloat(p.v || 0));
            }
            const rem = totalVal - paidVal;
            if (totalVal > 0) {
                total += rem > 0 ? rem : 0;
                count++;
                if (rem <= 0) paidCount++;
            }
        }
        return { totalDebt: Math.round(total), totalClients: count, paidClients: paidCount };
    }

    // دالة لحساب صافي اليومية
    function calcYomStats(yom) {
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        const monthStr = todayStr.slice(0, 7);
        
        let dayIn = 0, dayOut = 0;
        let monthIn = 0, monthOut = 0;
        
        for (let id in yom) {
            const item = yom[id];
            if (!item || !item.date) continue;
            const dateStr = item.date.slice(0, 10);
            const inVal = parseFloat(item.inVal) || 0;
            const outVal = parseFloat(item.outVal) || 0;
            
            if (dateStr === todayStr) {
                dayIn += inVal; dayOut += outVal;
            }
            if (dateStr.startsWith(monthStr)) {
                monthIn += inVal; monthOut += outVal;
            }
        }
        return {
            dayNet: Math.round(dayIn - dayOut),
            monthNet: Math.round(monthIn - monthOut),
            dayIn, dayOut, monthIn, monthOut
        };
    }

    // ============================================================
    // منطق الإجابة الذكي (مع بيانات حية)
    // ============================================================
    async function getAnswer(query) {
        if (!currentUid || !cachedData) {
            await fetchAllData();
        }
        const data = cachedData;
        if (!data) return "⚠️ لا يمكنني الاتصال بالسحابة حالياً. تأكد من اتصالك بالإنترنت.";

        const q = query.toLowerCase().trim();

        // --- 1. الأسئلة الإحصائية (بيانات حية) ---

        // العمال
        if (q.includes('عدد العمال') || q.includes('كم عامل') || q.includes('العمال المسجلين')) {
            const count = data.workers.length;
            const weeks = Object.keys(data.weeks);
            const lastWeek = weeks.length > 0 ? weeks.sort().pop() : 'لا يوجد';
            return `👷 **عدد العمال المسجلين**: ${count} عامل.\n📅 آخر أسبوع محفوظ: ${lastWeek}`;
        }

        // المديونيات
        if (q.includes('المديونيات') || q.includes('إجمالي المديونيات') || q.includes('كم مديونية')) {
            const stats = calcTotalDebt(data.clients);
            return `💰 **إجمالي المديونيات**: ${stats.totalDebt.toLocaleString()} ج.م\n🧑‍💼 عدد العملاء: ${stats.totalClients}\n✅ المخلصون: ${stats.paidClients}`;
        }

        // عدد العملاء
        if (q.includes('كم عميل') || q.includes('عدد الزبائن') || q.includes('عدد العملاء')) {
            let count = 0;
            for (let id in data.clients) {
                if (id !== 'settings' && !data.clients[id].isArchived) count++;
            }
            return `🧑‍💼 **عدد العملاء النشطين**: ${count}`;
        }

        // صافي اليومية
        if (q.includes('اليومية') || q.includes('صافي اليوم') || q.includes('صافي الشهر') || q.includes('اليوم')) {
            const stats = calcYomStats(data.yom);
            return `📊 **اليومية**:
• صافي اليوم: ${stats.dayNet.toLocaleString()} ج.م (دخل: ${stats.dayIn} - خرج: ${stats.dayOut})
• صافي الشهر: ${stats.monthNet.toLocaleString()} ج.م (دخل: ${stats.monthIn} - خرج: ${stats.monthOut})`;
        }

        // الملاحظات
        if (q.includes('آخر الملاحظات') || q.includes('أرني الملاحظات') || q.includes('الملاحظات')) {
            const notesArr = Object.values(data.notes).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            if (notesArr.length === 0) return "📝 لا توجد ملاحظات مسجلة.";
            const latest = notesArr.slice(0, 3);
            let msg = "📝 **آخر 3 ملاحظات**:\n";
            latest.forEach((n, i) => {
                const text = n.text ? n.text.slice(0, 60) : '(بدون نص)';
                msg += `${i+1}. ${text}${n.text && n.text.length > 60 ? '...' : ''} [${n.person || 'عام'}]\n`;
            });
            return msg;
        }

        // --- 2. الأسئلة الإجرائية (معرفة ثابتة) ---
        const staticKnowledge = [
            {
                keywords: ['أضيف عامل', 'إضافة عامل', 'عامل جديد', 'حضور'],
                answer: `👷 **إضافة عامل جديد (في gyab.html)**:
• اكتب اسم العامل في حقل "اسم عامل جديد".
• اختر (اختيارياً) "☀️ صيفي" لو كان موسمياً.
• اضغط "إضافة 🧑‍🏭".
• سيظهر كرت العامل الجديد، ويمكنك تعيين راتبه وتسجيل حضوره.`
            },
            {
                keywords: ['أضيف زبون', 'إضافة زبون', 'زبون جديد', 'عميل جديد'],
                answer: `🧑‍💼 **إضافة زبون جديد (في zbon.html)**:
• اضغط على زر **+** (الموجود أسفل يمين الشاشة).
• سيظهر كرت جديد فارغ. اضغط "🔒 اضغط للتعديل" لفتحه.
• اكتب الاسم، رقم الموبايل، تاريخ الاستلام، الإجمالي، وأضف الدفعات.
• اضغط "💾 حفظ وقفل" لحفظ البيانات في السحابة.`
            },
            {
                keywords: ['أضيف قيد', 'إضافة قيد', 'عملية يومية', 'تسجيل دخل', 'تسجيل خرج'],
                answer: `💰 **إضافة قيد في اليومية (في yom.html)**:
• اختر القسم (زبون، عمال، ألومنيوم، ...).
• اكتب الاسم والبيان.
• حدد التاريخ.
• اكتب المبلغ في حقل "خارج" (مصروف) أو "داخل" (إيراد).
• اضغط "حفظ العملية بالسحابة".`
            },
            {
                keywords: ['كيف أضيف ملاحظة', 'إضافة ملاحظة', 'ملاحظة جديدة'],
                answer: `📝 **إضافة ملاحظة (في notmop.html)**:
• اكتب النص في المربع الكبير، أو استخدم زر "🎙️ استماع" للإملاء الصوتي، أو "🖼️ إرفاق صورة".
• اضغط "حفظ المهمة بالسحابة ✅".
• ستظهر الملاحظة في القائمة، ويمكنك ترحيلها لليومية لاحقاً.`
            },
            {
                keywords: ['أرسل واتساب', 'واتساب', 'مشاركة', 'فاتورة'],
                answer: `📤 **مشاركة واتساب**:
• **للزبون**: في zbon.html، زر "واتساب مباشر" للتواصل، و "واتساب فاتورة" لإرسال تفاصيل الحساب كامل.
• **للعامل**: في gyab.html، زر "واتساب" بجانب العامل لإرسال تقرير الأسبوع.
• **لليومية**: في yom.html، زر واتساب بجانب كل قيد لمشاركة العملية.`
            },
            {
                keywords: ['أرشيف', 'أرشفة', 'حفظ أرشيف'],
                answer: `📁 **الأرشفة**:
• **الزبون**: في zbon.html، زر 📁 بجانب كل زبون ينقله للأرشيف، ويمكن استعادته لاحقاً.
• **الحضور**: يوجد زر "📦 حفظ جميع العمال في الأرشيف الآن" لحفظ الأسبوع الحالي يدوياً، ويتم الحفظ التلقائي يومياً.
• **اليومية**: جميع البيانات محفوظة في السحابة ولا تحتاج لأرشفة.`
            },
            {
                keywords: ['كيف أبحث', 'بحث', 'فلتر'],
                answer: `🔍 **البحث**:
• **الزبون**: استخدم حقل البحث العلوي (يبحث بالاسم، الكود، الموبايل).
• **الملاحظات**: حقل بحث يبحث في النص والاسم والمقاسات.
• **اليومية**: حقل بحث شامل في كل الأعمدة.
• جميع عمليات البحث فورية أثناء الكتابة.`
            },
            {
                keywords: ['قفل', 'فتح', 'تعديل'],
                answer: `🔒 **القفل والفتح**:
• في تطبيق **الزبون** و **الحضور**، كل بطاقة لها زر "قفل/فتح".
• عند القفل، تصبح الحقول للقراءة فقط لحماية البيانات من التعديل غير المقصود.
• لفتحها، اضغط الزر مرة أخرى لتعديل البيانات، ثم احفظها مجدداً.`
            }
        ];

        for (let item of staticKnowledge) {
            for (let kw of item.keywords) {
                if (q.includes(kw)) {
                    return item.answer;
                }
            }
        }

        // --- 3. الرد الافتراضي ---
        return `🤔 لم أفهم سؤالك تماماً. إليك بعض الأمثلة لما يمكنك سؤالي عنه:

📊 **إحصائيات حية**:
• "كم عدد العمال؟"
• "إجمالي المديونيات؟"
• "صافي اليومية اليوم؟"
• "أرني آخر الملاحظات"

🔧 **استفسارات إجرائية**:
• "كيف أضيف عامل؟"
• "كيف أضيف زبون؟"
• "كيف أضيف قيد في اليومية؟"
• "كيف أرسل فاتورة واتساب؟"
• "كيف تعمل الأرشفة؟"

🌐 **حالة الاتصال**: أنا متصل بقاعدة بياناتك الفعلية، لذا أجيبك بأرقامك الحقيقية!`;
    }

    // ============================================================
    // دوال إرسال الرسائل
    // ============================================================
    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || !isReady) return;

        addMessage(text, 'user');
        userInput.value = '';
        showTyping();
        sendBtn.disabled = true;
        userInput.disabled = true;

        try {
            const reply = await getAnswer(text);
            hideTyping();
            addMessage(reply, 'bot');
        } catch (e) {
            hideTyping();
            addMessage("⚠️ حدث خطأ أثناء معالجة طلبك. تأكد من اتصال الإنترنت.", 'bot');
            console.error(e);
        } finally {
            sendBtn.disabled = false;
            userInput.disabled = false;
            userInput.focus();
        }
    }

    function sendQuick(text) {
        userInput.value = text;
        sendMessage();
    }

    // ============================================================
    // تهيئة البوت وتفعيل الاستماع للـAuth
    // ============================================================
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            currentUid = user.uid;
            setStatus('🟢 متصل (مصادق)', 'online');
            await fetchAllData();
            isReady = true;
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
            addMessage("✅ تم الاتصال بقاعدة البيانات بنجاح. أنا جاهز للإجابة عن أسئلتك الحية!", 'bot');
        } else {
            setStatus('🔴 غير مصادق', 'offline');
            userInput.disabled = true;
            sendBtn.disabled = true;
            addMessage("⚠️ يرجى تسجيل الدخول من التطبيقات الرئيسية (azemaa proo) أولاً حتى أتمكن من قراءة بياناتك.", 'bot');
        }
    });

    // جعل الدوال عامة للاستخدام في HTML
    window.sendMessage = sendMessage;
    window.sendQuick = sendQuick;

    console.log("🤖 روبوت azemaa proo متصل بالسحابة وجاهز!");
</script>
</body>
</html>
