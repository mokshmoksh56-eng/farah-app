<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
    <title>عزيمة برو - مطابخ فرح</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 15px; 
            color: #1c1e21; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            max-width: 800px;
            margin: auto;
        }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e4e6eb; padding-bottom: 15px; }
        h1 { color: #1877f2; margin: 0 0 5px 0; font-size: 24px; }
        
        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        
        #start-btn { 
            background-color: #1877f2; color: white; padding: 18px; font-size: 18px; 
            border: none; border-radius: 50px; cursor: pointer; font-weight: bold; 
            transition: all 0.3s ease; width: 100%; box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
        }
        #start-btn.recording { 
            background-color: #e41e3f !important; 
            animation: pulse 1.5s infinite;
            box-shadow: 0 4px 20px rgba(228, 30, 63, 0.5);
        }
        
        textarea { 
            padding: 15px; font-size: 18px; border-radius: 8px; border: 2px solid #ccd0d5; 
            resize: vertical; min-height: 80px; width: 100%; box-sizing: border-box;
        }
        textarea:focus { border-color: #1877f2; outline: none; }
        
        #save-btn { 
            background-color: #25D366; color: white; padding: 15px; font-size: 18px; 
            border: none; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer;
        }
        
        .search-box { 
            width: 100%; padding: 12px; font-size: 16px; margin-bottom: 20px; 
            border: 1px solid #ccd0d5; border-radius: 8px; box-sizing: border-box; 
        }
        
        h2 { color: #1c1e21; border-right: 4px solid #1877f2; padding-right: 10px; font-size: 18px; margin-top: 25px;}
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; font-size: 15px;}
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: right; }
        th { background-color: #f5f6f7; color: #606770; }
        
        .badge { background-color: #ff9f43; color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .delete-btn { background-color: #e41e3f; padding: 8px 15px; font-size: 13px; border-radius: 6px; color: white; border: none; cursor: pointer;}

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.97); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عزيمة برو - مطابخ فرح 🛠️</h1>
    </div>
    
    <div class="controls">
        <button id="start-btn">اضغط للتحدث 🎙️</button>
        <textarea id="note-box" placeholder="الملاحظة هتظهر هنا بعد التحدث..."></textarea>
        <button id="save-btn">حفظ وتوزيع في الجداول 💾</button>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث في المهام...">

    <h2>📋 المهام الموزعة</h2>
    <table id="tasks-table">
        <thead><tr><th style="width: 25%;">الاسم</th><th style="width: 55%;">المهمة</th><th style="width: 20%;">إجراء</th></tr></thead>
        <tbody></tbody>
    </table>

    <h2>📝 السجل العام</h2>
    <table id="general-table">
        <thead><tr><th style="width: 80%;">الملاحظة</th><th style="width: 20%;">إجراء</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<!-- ملف كوردوفا (سيعمل تلقائياً عند بناء الـ APK، ولن يؤثر على المتصفح) -->
<script src="cordova.js"></script>
<script>
    // فريق العمل والعائلة
    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    let notesData = JSON.parse(localStorage.getItem('azemaaProNotes')) || [];
    let isRecording = false;
    let browserRecognition = null;

    const startBtn = document.getElementById('start-btn');
    const noteBox = document.getElementById('note-box');

    // إعداد ذكاء المتصفح (في حالة عدم استخدام التطبيق)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        browserRecognition = new SpeechRecognition();
        browserRecognition.lang = 'ar-EG';
        browserRecognition.continuous = true;
        browserRecognition.interimResults = false; // يمنع التكرار

        browserRecognition.onresult = (event) => {
            let finalText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                finalText += event.results[i][0].transcript + " ";
            }
            if(finalText.trim() !== "") noteBox.value += finalText;
        };
        browserRecognition.onend = () => stopUI();
        browserRecognition.onerror = () => stopUI();
    }

    // وظيفة تشغيل الصوت (تدعم التطبيق الأوفلاين والمتصفح معاً)
    startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        
        if (isRecording) {
            // إيقاف التسجيل
            if (window.plugins && window.plugins.speechRecognition) {
                window.plugins.speechRecognition.stopListening();
            } else if (browserRecognition) {
                browserRecognition.stop();
            }
            stopUI();
        } else {
            // بدء التسجيل
            startUI();
            
            // 1. تشغيل عبر تطبيق الهاتف (Cordova Offline)
            if (window.plugins && window.plugins.speechRecognition) {
                window.plugins.speechRecognition.hasPermission((hasPermission) => {
                    if (!hasPermission) {
                        window.plugins.speechRecognition.requestPermission();
                        stopUI();
                    } else {
                        window.plugins.speechRecognition.startListening(
                            (result) => {
                                if(result && result.length > 0) noteBox.value += result[0] + " ";
                                stopUI();
                            },
                            (err) => stopUI(),
                            { language: "ar-EG", showPopup: false, matches: 1 }
                        );
                    }
                });
            } 
            // 2. تشغيل عبر المتصفح (Chrome)
            else if (browserRecognition) {
                try { browserRecognition.start(); } catch(err) {}
            } 
            else {
                alert("خاصية الصوت غير مدعومة على هذا الجهاز.");
                stopUI();
            }
        }
    });

    function startUI() {
        isRecording = true;
        startBtn.textContent = "جاري الاستماع... 🛑";
        startBtn.classList.add("recording");
    }

    function stopUI() {
        isRecording = false;
        startBtn.textContent = "اضغط للتحدث 🎙️";
        startBtn.classList.remove("recording");
    }

    // حفظ الملاحظة
    document.getElementById('save-btn').addEventListener('click', () => {
        const text = noteBox.value.trim();
        if (!text) return alert("الملاحظة فارغة!");
        
        let assignedPerson = "عام";
        for (let name of teamMembers) {
            if (text.includes(name)) { assignedPerson = name; break; }
        }
        
        notesData.unshift({ id: Date.now(), text: text, person: assignedPerson });
        localStorage.setItem('azemaaProNotes', JSON.stringify(notesData));
        noteBox.value = "";
        renderTables();
    });

    // حذف مهمة
    window.deleteNote = function(id) {
        if(confirm("حذف هذه المهمة؟")) {
            notesData = notesData.filter(note => note.id !== id);
            localStorage.setItem('azemaaProNotes', JSON.stringify(notesData));
            renderTables();
        }
    }

    // عرض الجداول
    function renderTables(searchQuery = "") {
        const tasksBody = document.querySelector('#tasks-table tbody');
        const generalBody = document.querySelector('#general-table tbody');
        tasksBody.innerHTML = ""; generalBody.innerHTML = "";

        const filtered = notesData.filter(note => note.text.includes(searchQuery) || note.person.includes(searchQuery));

        filtered.forEach(note => {
            const row = `<tr>
                ${note.person !== "عام" ? `<td><span class="badge">${note.person}</span></td>` : ""}
                <td>${note.text}</td>
                <td><button class="delete-btn" onclick="deleteNote(${note.id})">حذف</button></td>
            </tr>`;
            if (note.person !== "عام") tasksBody.innerHTML += row;
            else generalBody.innerHTML += row;
        });
    }

    document.getElementById('search-input').addEventListener('input', (e) => renderTables(e.target.value.trim()));
    renderTables();
</script>
</body>
</html>
