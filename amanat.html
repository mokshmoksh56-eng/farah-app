<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل رصيد عبر فوري</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 25px; }
        .fawry-badge { background-color: #fadb14; color: #333; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; display: inline-block; margin-bottom: 10px; }
        h2 { color: #333; margin: 0; font-size: 22px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #0056b3; outline: none; }
        button { width: 100%; padding: 14px; background-color: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background-color: #004494; }
        button:disabled { background-color: #aaa; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="fawry-badge">دفع آمن عبر فوري</div>
        <h2>تحويل إلى كارت ميزة</h2>
    </div>
    
    <form id="paymentForm">
        <div class="form-group">
            <label for="userPhone">رقم فودافون كاش (المرسل):</label>
            <input type="text" id="userPhone" placeholder="010XXXXXXXX" required pattern="01[0125][0-9]{8}">
        </div>
        
        <div class="form-group">
            <label for="meezaCard">رقم كارت ميزة (المستقبل):</label>
            <input type="text" id="meezaCard" placeholder="16 رقم" required pattern="[0-9]{16}">
        </div>
        
        <div class="form-group">
            <label for="amount">المبلغ (جنيه مصري):</label>
            <input type="number" id="amount" placeholder="مثال: 500" required min="10">
        </div>
        
        <button type="submit" id="submitBtn">متابعة الدفع</button>
    </form>
</div>

<script>
    // ========================================================
    // ⚠️ مهم جداً: ضعي عنوان الـ IP الخاص بالكمبيوتر هنا ⚠️
    // ابحثي عن IPv4 في موجه الأوامر (cmd) واكتبيه بدلاً من هذا الرقم
    // ========================================================
    const COMPUTER_IP = "192.168.1.5"; 
    
    document.getElementById('paymentForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'جاري الاتصال بالسيرفر...';

        const payload = {
            userPhone: document.getElementById('userPhone').value,
            meezaCard: document.getElementById('meezaCard').value,
            amount: document.getElementById('amount').value
        };

        try {
            // استخدام الـ IP بدلاً من localhost
            const response = await fetch(`http://${COMPUTER_IP}:3000/api/create-payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.success) {
                alert('تم الاتصال بنجاح بالسيرفر الخاص بك!');
                if(data.paymentUrl) {
                    window.location.href = data.paymentUrl;
                }
            } else {
                alert('خطأ من السيرفر: ' + data.message);
                submitBtn.disabled = false;
                submitBtn.innerText = 'متابعة الدفع';
            }
        } catch (error) {
            console.error('Error:', error);
            alert(`فشل الاتصال! تأكدي أن الكمبيوتر والتابلت على نفس شبكة الواي فاي، وأن رقم الـ IP (${COMPUTER_IP}) صحيح، وأن السيرفر يعمل.`);
            submitBtn.disabled = false;
            submitBtn.innerText = 'متابعة الدفع';
        }
    });
</script>

</body>
</html>
