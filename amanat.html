<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق نقل العفش - تواصل واتساب</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-container { background: white; padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; box-sizing: border-box; }
        .logo { font-size: 26px; font-weight: bold; color: #ff6600; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 20px; font-size: 15px; }

        input[type="text"], select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; outline: none; }
        select { border: 2px solid #ff6600; cursor: pointer; }
        
        .custom-file-upload { display: inline-block; width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; border: 2px dashed #ff6600; background-color: #fff9f5; color: #ff6600; font-size: 16px; font-weight: bold; cursor: pointer; box-sizing: border-box; }
        input[type="file"] { display: none; }
        #imagePreview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 8px; margin-top: 10px; display: none; border: 1px solid #ddd; }

        button { width: 100%; padding: 14px; margin: 10px 0 0 0; border-radius: 8px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-orange { background: #ff6600; color: white; }
        .btn-orange:hover { background: #e65c00; }
        .btn-dark { background: #333; color: white; }
        .btn-dark:hover { background: #1a1a1a; }
        .btn-back { background: transparent; color: #888; border: 1px solid #ddd; margin-top: 10px; font-size: 16px; }

        /* زر الواتساب */
        .btn-whatsapp { background: #25D366; color: white; width: auto; padding: 8px 15px; font-size: 15px; margin: 0; display: inline-flex; align-items: center; gap: 5px; border-radius: 8px; }
        .btn-whatsapp:hover { background: #20ba59; }

        .status-box { background: #f9f9f9; border-radius: 8px; padding: 15px; margin-bottom: 20px; border: 1px solid #eee; }
        .status-box p { margin: 0 0 10px 0; font-weight: bold; color: #333; }
        .status-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-status { flex: 1; padding: 10px; font-size: 16px; border-radius: 8px; opacity: 0.5; border: 2px solid transparent; transition: 0.2s; }
        .btn-status.active { opacity: 1; border-color: #333; transform: scale(1.05); }
        .bg-green { background: #28a745; color: white; }
        .bg-red { background: #dc3545; color: white; }

        #statusMessage { padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; transition: 0.3s; }
        .msg-available { background-color: #e6f6ea; color: #28a745; border: 1px solid #28a745; }
        .msg-busy { background-color: #fcebeb; color: #dc3545; border: 1px solid #dc3545; }

        .drivers-list { text-align: right; max-height: 280px; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
        .driver-card { background: #fff; border: 1px solid #eee; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .driver-info h4 { margin: 0 0 5px 0; color: #333; font-size: 15px; }
        .driver-info span { font-size: 13px; color: #777; }
        .status-dot { width: 15px; height: 15px; border-radius: 50%; transition: 0.3s; }
        .dot-green { background-color: #28a745; box-shadow: 0 0 8px #28a745; }
        .dot-red { background-color: #dc3545; box-shadow: 0 0 8px #dc3545; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- شاشة البداية -->
    <div class="app-container" id="roleScreen">
        <div class="logo">نقلتك السريعة</div>
        <div class="subtitle">هل تريد طلب سيارة أم العمل معنا؟</div>
        <button class="btn-orange" onclick="navigateTo('customerBookingScreen')">أنا زبـون (أطلب خدمة)</button>
        <button class="btn-dark" onclick="navigateTo('registerScreen')">أنا سـواق (أقدم خدمة)</button>
    </div>

    <!-- شاشة الزبون: طلب خدمة -->
    <div class="app-container hidden" id="customerBookingScreen">
        <div class="logo">طلب سيارة نقل</div>
        <div class="subtitle">حدد مسارك ونوع السيارة المطلوبة</div>
        
        <input type="text" id="pickupLocation" placeholder="مكان التحميل (منين؟)">
        <input type="text" id="dropoffLocation" placeholder="مكان التنزيل (لفين؟)">
        
        <select id="requestedVehicle">
            <option value="" disabled selected>-- اختر نوع المركبة المطلوبة --</option>
            <option value="ربع نقل">ربع نقل</option>
            <option value="ربع نقل بصندوق">ربع نقل بصندوق</option>
            <option value="تروسيكل">تروسيكل</option>
            <option value="نصف نقل">نصف نقل</option>
            <option value="ونش رفع عفش">ونش رفع عفش</option>
        </select>

        <button class="btn-orange" onclick="searchAvailableDrivers()">البحث عن سواقين متاحين</button>
        <button class="btn-back" onclick="history.back()">رجوع</button>
    </div>

    <!-- شاشة الزبون: السائقين المتاحين -->
    <div class="app-container hidden" id="availableDriversScreen">
        <div class="logo">السواقين المتاحين</div>
        <div class="subtitle" id="searchResultText" style="color: #28a745; font-weight: bold;"></div>
        
        <div class="drivers-list" id="customerDriversList"></div>

        <button class="btn-back" onclick="history.back()">⬅️ تعديل الطلب (رجوع)</button>
    </div>

    <!-- شاشة تسجيل السائق -->
    <div class="app-container hidden" id="registerScreen">
        <div class="logo">تسجيل سائق جديد</div>
        <div class="subtitle">يرجى إدخال بياناتك وصورة لمركبتك</div>
        
        <input type="text" id="driverName" placeholder="الاسم الثلاثي للسائق">
        <input type="text" id="driverPhone" placeholder="رقم الموبايل (واتساب) مثال: 201012345678">
        
        <select id="vehicleType">
            <option value="" disabled selected>-- اختر نوع المركبة --</option>
            <option value="ربع نقل">ربع نقل</option>
            <option value="ربع نقل بصندوق">ربع نقل بصندوق</option>
            <option value="تروسيكل">تروسيكل</option>
            <option value="نصف نقل">نصف نقل</option>
            <option value="ونش رفع عفش">ونش رفع عفش</option>
        </select>
        
        <label for="vehiclePhoto" class="custom-file-upload">📸 إرفاق صورة المركبة</label>
        <input type="file" id="vehiclePhoto" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" alt="معاينة الصورة">

        <button class="btn-orange" onclick="submitDriverData()">تأكيد الدخول</button>
        <button class="btn-back" onclick="history.back()">رجوع</button>
    </div>

    <!-- لوحة تحكم السائق -->
    <div class="app-container hidden" id="dashboardScreen">
        <div class="logo">لوحة القيادة</div>
        <div class="subtitle" id="welcomeMessage">مرحباً يا كابتن</div>
        
        <div class="status-box">
            <p>حالتك الحالية:</p>
            <div class="status-buttons">
                <button id="btnAvailable" class="btn-status bg-green active" onclick="setMyStatus('available')">متاح للعمل</button>
                <button id="btnBusy" class="btn-status bg-red" onclick="setMyStatus('busy')">مشغول</button>
            </div>
            <div id="statusMessage" class="msg-available">✓ أنت الآن متاح للعمل وبانتظار الطلبات</div>
        </div>

        <h4 style="text-align:right; margin-bottom:10px; color:#555;">السائقين في منطقتك:</h4>
        <div class="drivers-list" id="driversList"></div>

        <button class="btn-back" onclick="history.back()" style="margin-top:10px;">⬅️ خروج / رجوع</button>
    </div>

    <script>
        window.onload = function() {
            history.replaceState({ screen: 'roleScreen' }, '', '#home');
        };

        function navigateTo(showId) {
            document.querySelectorAll('.app-container').forEach(el => el.classList.add('hidden'));
            document.getElementById(showId).classList.remove('hidden');
            history.pushState({ screen: showId }, '', '#' + showId);
        }

        window.addEventListener('popstate', function(event) {
            document.querySelectorAll('.app-container').forEach(el => el.classList.add('hidden'));
            let targetScreen = event.state && event.state.screen ? event.state.screen : 'roleScreen';

            if (targetScreen !== 'dashboardScreen' && myDriverData !== null) {
                let index = mockDrivers.indexOf(myDriverData);
                if (index > -1) mockDrivers.splice(index, 1);
                myDriverData = null;
                
                document.getElementById('driverName').value = "";
                document.getElementById('driverPhone').value = "";
                document.getElementById('vehicleType').value = "";
                document.getElementById('imagePreview').style.display = "none";
                document.getElementById('btnAvailable').classList.add('active');
                document.getElementById('btnBusy').classList.remove('active');
                document.getElementById('statusMessage').innerText = "✓ أنت الآن متاح للعمل وبانتظار الطلبات";
                document.getElementById('statusMessage').className = "msg-available";
            }
            
            document.getElementById(targetScreen).classList.remove('hidden');
        });

        // قاعدة بيانات السائقين مضاف إليها أرقام هواتف للتجربة (يُفضل كتابة الرقم بمفتاح الدولة مثل 20 لمصر)
        let myDriverData = null;
        let mockDrivers = [
            { name: "محمود سيد", vehicle: "ربع نقل", status: "green", rate: "4.8", phone: "201000000001" },
            { name: "أحمد عبد الله", vehicle: "ونش رفع عفش", status: "red", rate: "4.5", phone: "201000000002" },
            { name: "خالد حسن", vehicle: "تروسيكل", status: "green", rate: "4.9", phone: "201000000003" },
            { name: "مصطفى كمال", vehicle: "نصف نقل", status: "green", rate: "4.7", phone: "201000000004" }
        ];

        // --- دوال الزبون ---
        function searchAvailableDrivers() {
            const requestedVehicle = document.getElementById('requestedVehicle').value;
            let pickup = document.getElementById('pickupLocation').value.trim() || "غير محدد";
            let dropoff = document.getElementById('dropoffLocation').value.trim() || "غير محدد";

            if (!requestedVehicle) {
                alert("برجاء اختيار نوع المركبة المطلوبة أولاً.");
                return;
            }

            const listContainer = document.getElementById('customerDriversList');
            listContainer.innerHTML = "";
            let available = mockDrivers.filter(d => d.status === 'green' && d.vehicle === requestedVehicle);

            if (available.length > 0) {
                document.getElementById('searchResultText').innerText = `وجدنا ${available.length} سواقين متاحين لطلبك`;
                
                available.forEach(driver => {
                    // رسالة الواتساب الجاهزة للإرسال
                    let message = `مرحباً كابتن ${driver.name}، أريد نقل عفش من (${pickup}) إلى (${dropoff}). هل أنت متاح لمعرفة التكلفة؟`;
                    let encodedMessage = encodeURIComponent(message);
                    let whatsappLink = `https://wa.me/${driver.phone}?text=${encodedMessage}`;

                    // زر الواتساب بدلاً من اطلب الآن
                    listContainer.innerHTML += `
                        <div class="driver-card">
                            <div class="driver-info">
                                <h4>${driver.name} ⭐ ${driver.rate}</h4>
                                <span>${driver.vehicle}</span>
                            </div>
                            <button class="btn-whatsapp" onclick="window.open('${whatsappLink}', '_blank')">
                                💬 تواصل واتساب
                            </button>
                        </div>
                    `;
                });
            } else {
                document.getElementById('searchResultText').innerText = "";
                listContainer.innerHTML = `<p style="color:red; font-weight:bold; padding:20px;">عذراً، لا يوجد سائقين متاحين حالياً لهذه المركبة. يرجى المحاولة لاحقاً.</p>`;
            }

            navigateTo('availableDriversScreen');
        }

        // --- دوال السواق ---
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const imgElement = document.getElementById('imagePreview');
                imgElement.src = reader.result;
                imgElement.style.display = 'block';
            }
            if(event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function submitDriverData() {
            const name = document.getElementById('driverName').value.trim() || "كابتن";
            const phone = document.getElementById('driverPhone').value.trim() || "201000000000";
            const vehicle = document.getElementById('vehicleType').value || "غير محدد";

            myDriverData = { name: name + " (أنت)", vehicle: vehicle, status: "green", rate: "جديد", phone: phone };
            mockDrivers.unshift(myDriverData);

            document.getElementById('welcomeMessage').innerText = "مرحباً يا " + name;

            renderDashboardDrivers();
            navigateTo('dashboardScreen'); 
        }

        function setMyStatus(status) {
            const btnAvailable = document.getElementById('btnAvailable');
            const btnBusy = document.getElementById('btnBusy');
            const msgBox = document.getElementById('statusMessage');

            if(status === 'available') {
                btnAvailable.classList.add('active');
                btnBusy.classList.remove('active');
                myDriverData.status = 'green'; 
                msgBox.innerText = "✓ أنت الآن متاح للعمل وبانتظار الطلبات";
                msgBox.className = "msg-available";
            } else {
                btnBusy.classList.add('active');
                btnAvailable.classList.remove('active');
                myDriverData.status = 'red';
                msgBox.innerText = "✗ أنت غير متاح حالياً ولا تستقبل طلبات";
                msgBox.className = "msg-busy";
            }
            renderDashboardDrivers(); 
        }

        function renderDashboardDrivers() {
            const listContainer = document.getElementById('driversList');
            listContainer.innerHTML = ""; 

            mockDrivers.forEach(driver => {
                const dotClass = driver.status === "green" ? "dot-green" : "dot-red";
                const nameStyle = driver === myDriverData ? "color: #ff6600; font-weight: bold;" : "";
                
                listContainer.innerHTML += `
                    <div class="driver-card">
                        <div class="driver-info">
                            <h4 style="${nameStyle}">${driver.name}</h4>
                            <span>${driver.vehicle}</span>
                        </div>
                        <div class="status-dot ${dotClass}"></div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
