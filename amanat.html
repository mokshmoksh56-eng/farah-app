<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خزنتي - الإصدار الماسي</title>
    <style>
        :root {
            --primary: #6c5ce7; --success: #00b894; --danger: #d63031;
            --loan: #e17055; --bg: #f8f9fd; --card: #ffffff;
            --text: #2d3436;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); 
            margin: 0; padding: 12px; color: var(--text); direction: rtl;
        }

        /* رأس الصفحة */
        .header { text-align: center; margin-bottom: 15px; }
        .header h1 { margin: 0; font-size: 22px; color: var(--primary); }

        /* الإحصائيات الذكية */
        .stats-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-box {
            flex: 1; background: var(--card); padding: 15px 5px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-bottom: 4px solid transparent; transition: 0.3s;
        }
        .stat-box span { font-size: 11px; color: #636e72; font-weight: bold; }
        .stat-box b { font-size: 18px; display: block; margin-top: 5px; }

        /* منطقة الإدخال وإدارة الأسماء */
        .main-card {
            background: var(--card); padding: 15px; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); margin-bottom: 20px;
        }
        .name-adder { display: flex; gap: 8px; margin-bottom: 12px; }
        .names-cloud { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .tag { 
            background: #f0f2f5; padding: 4px 10px; border-radius: 12px; 
            font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--primary);
        }
        .tag b { color: var(--danger); cursor: pointer; font-size: 16px; }

        input, select {
            width: 100%; padding: 12px; margin-bottom: 10px; border: 1.5px solid #eee;
            border-radius: 15px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .btn {
            border: none; padding: 15px 5px; border-radius: 15px; color: white;
            font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-in { background: var(--success); }
        .btn-out { background: var(--danger); }
        .btn-loan { background: var(--loan); }

        /* كروت المعاملات الاحترافية */
        .log-card {
            background: var(--card); border-radius: 20px; padding: 15px;
            margin-bottom: 12px; position: relative; overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            display: flex; justify-content: space-between; align-items: center;
        }
        .log-card::before {
            content: ''; position: absolute; top: 0; right: 0; width: 6px; height: 100%;
        }
        .type-in::before { background: var(--success); }
        .type-out::before { background: var(--danger); }
        .type-loan::before { background: var(--loan); }

        .log-info { flex: 1; }
        .log-date { font-size: 18px; font-weight: 900; color: var(--primary); }
        .log-name { font-weight: bold; font-size: 16px; margin: 2px 0; }
        .log-note { font-size: 12px; color: #b2bec3; }

        .log-amount { text-align: left; }
        .amt-val { font-size: 20px; font-weight: 900; display: block; }
        .wa-action { 
            display: inline-block; background: #25D366; color: white; 
            padding: 4px 12px; border-radius: 50px; text-decoration: none;
            font-size: 12px; margin-top: 5px; font-weight: bold;
        }
        .del-icon { color: #dfe6e9; margin-right: 10px; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>خزنتي الماسية 💎</h1>
    </div>

    <div class="stats-grid">
        <div class="stat-box" style="border-color: var(--success)"><span>الوارد</span><b id="tin" style="color:var(--success)">0</b></div>
        <div class="stat-box" style="border-color: var(--danger)"><span>المنصرف</span><b id="tout" style="color:var(--danger)">0</b></div>
        <div class="stat-box" style="border-color: var(--primary)"><span>الصافي</span><b id="tnet" style="color:var(--primary)">0</b></div>
    </div>

    <div class="main-card">
        <div class="name-adder">
            <input type="text" id="newName" placeholder="أضف اسم عميل جديد..." style="margin-bottom:0">
            <button onclick="addName()" style="background:var(--primary); color:white; border:none; border-radius:15px; padding:0 15px; font-weight:bold;">+</button>
        </div>
        <div class="names-cloud" id="tagsArea"></div>

        <select id="userSelect" onchange="autoFillPhone(); render();"></select>
        <input type="text" id="phone" placeholder="الرقم (مصري أو دولي +)">
        <input type="number" id="amount" placeholder="المبلغ">
        <input type="text" id="note" placeholder="البيان (اختياري)">
        
        <div class="btn-group">
            <button class="btn btn-in" onclick="save('in')">إيداع (+)</button>
            <button class="btn btn-out" onclick="save('out')">سحب (-)</button>
            <button class="btn btn-loan" onclick="save('loan')">سلفية (⚠️)</button>
        </div>
    </div>

    <div id="logsArea"></div>

<script>
    let names = JSON.parse(localStorage.getItem('DIAMOND_NAMES')) || ["أحمد رمضان"];
    let db = JSON.parse(localStorage.getItem('DIAMOND_DB')) || [];

    function addName() {
        const val = document.getElementById('newName').value.trim();
        if(val && !names.includes(val)) {
            names.push(val);
            localStorage.setItem('DIAMOND_NAMES', JSON.stringify(names));
            document.getElementById('newName').value = '';
            sync();
        }
    }

    function deleteName(name) {
        if(confirm(`إلغاء "${name}" من القائمة؟`)) {
            names = names.filter(n => n !== name);
            localStorage.setItem('DIAMOND_NAMES', JSON.stringify(names));
            sync();
        }
    }

    function autoFillPhone() {
        const selName = document.getElementById('userSelect').value;
        const phoneField = document.getElementById('phone');
        if (selName) {
            const lastRecord = db.find(r => r.name === selName && r.phone !== "");
            if (lastRecord) {
                let num = lastRecord.phone;
                if (num.startsWith('20') && num.length === 12) num = '0' + num.substring(2);
                phoneField.value = num;
            } else phoneField.value = "";
        } else phoneField.value = "";
    }

    function sync() {
        const sel = document.getElementById('userSelect');
        const tags = document.getElementById('tagsArea');
        const curr = sel.value;
        sel.innerHTML = '<option value="">-- كشف حساب عام --</option>';
        names.sort().forEach(n => sel.innerHTML += `<option value="${n}">${n}</option>`);
        sel.value = curr;
        tags.innerHTML = '';
        names.forEach(n => tags.innerHTML += `<div class="tag">${n} <b onclick="deleteName('${n}')">×</b></div>`);
    }

    function save(type) {
        const name = document.getElementById('userSelect').value;
        let rawPhone = document.getElementById('phone').value.trim();
        const amt = parseFloat(document.getElementById('amount').value);
        const note = document.getElementById('note').value || (type==='in'?'إيداع':(type==='loan'?'سلفية':'سحب'));

        if(!name || isNaN(amt)) return alert("يرجى اختيار الاسم وإدخال المبلغ");

        let finalPhone = rawPhone.replace(/\s+/g, '').replace('+', ''); 
        if (finalPhone !== "" && !finalPhone.startsWith('2') && finalPhone.length <= 11) {
            if (finalPhone.startsWith('0')) finalPhone = '2' + finalPhone;
            else finalPhone = '20' + finalPhone;
        }

        db.unshift({
            id: Date.now(), name, phone: finalPhone,
            amt: (type === 'in' ? amt : -amt),
            type, note, date: new Date().toLocaleDateString('ar-EG')
        });

        localStorage.setItem('DIAMOND_DB', JSON.stringify(db));
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        render();
    }

    function sendWA(id) {
        const item = db.find(i => i.id === id);
        if(!item.phone) return alert("لا يوجد رقم مسجل");
        const userBal = db.filter(r => r.name === item.name).reduce((s, r) => s + r.amt, 0);
        let icon = item.amt > 0 ? "✅" : (item.type==='loan' ? "⚠️" : "💸");
        
        const msg = `*فاتورة رقمية: ${item.name}* 👋\n\n📝 *العملية:* ${item.amt > 0 ? 'إيداع' : 'سحب'} ${icon}\n💰 *المبلغ:* ${Math.abs(item.amt)}\n📄 *البيان:* ${item.note}\n📅 *التاريخ:* ${item.date}\n\n-------------------------\n📊 *إجمالي الرصيد الحالي:*\n👈 { *${userBal}* }\n-------------------------\n*شكراً لتعاملك معنا!* ✨`;

        window.open(`https://wa.me/${item.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function render() {
        const selName = document.getElementById('userSelect').value;
        const area = document.getElementById('logsArea');
        area.innerHTML = '';
        let tin = 0, tout = 0;
        
        db.forEach(item => {
            if (!selName || item.name === selName) {
                if(item.amt > 0) tin += item.amt; else tout += Math.abs(item.amt);
                
                let rowClass = item.type==='in'?'type-in':(item.type==='loan'?'type-loan':'type-out');
                let color = item.amt > 0 ? 'var(--success)' : (item.type === 'loan' ? 'var(--loan)' : 'var(--danger)');

                area.innerHTML += `
                    <div class="log-card ${rowClass}">
                        <div class="log-info">
                            <div class="log-date">${item.date}</div>
                            <div class="log-name">${item.name}</div>
                            <div class="log-note">${item.note}</div>
                        </div>
                        <div class="log-amount">
                            <span class="amt-val" style="color:${color}">${item.amt}</span>
                            <a href="#" class="wa-action" onclick="sendWA(${item.id})">واتساب 🟢</a>
                        </div>
                        <span class="del-icon" onclick="del(${item.id})">🗑️</span>
                    </div>
                `;
            }
        });
        document.getElementById('tin').innerText = tin;
        document.getElementById('tout').innerText = tout;
        document.getElementById('tnet').innerText = tin - tout;
    }

    function del(id) { if(confirm("حذف العملية؟")) { db = db.filter(i => i.id !== id); localStorage.setItem('DIAMOND_DB', JSON.stringify(db)); render(); } }

    sync(); render();
</script>
</body>
</html>
