<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أقبض | الدخول والتسجيل</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; }
        
        .glow-blob {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; filter: blur(40px); z-index: 0;
            animation: float 6s infinite ease-in-out alternate;
        }
        .glow-blob-2 {
            position: absolute; width: 250px; height: 250px; bottom: -50px; left: -50px;
            background: radial-gradient(circle, rgba(147,197,253,0.3) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; filter: blur(40px); z-index: 0;
            animation: float 8s infinite ease-in-out alternate-reverse;
        }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-30px) scale(1.1); } }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            z-index: 10; position: relative;
        }
        
        .fade-enter { opacity: 0; transform: translateY(15px); transition: all 0.4s ease-out; pointer-events: none; position: absolute; width: 100%; visibility: hidden; }
        .fade-enter-active { opacity: 1; transform: translateY(0); pointer-events: auto; position: relative; visibility: visible; }
        
        ::placeholder { color: rgba(255, 255, 255, 0.6) !important; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 via-blue-700 to-blue-800 flex items-center justify-center p-4 relative text-white">

    <div class="glow-blob top-[-50px] right-[-50px]"></div>
    <div class="glow-blob-2"></div>

    <div class="w-full max-w-md glass-card rounded-3xl p-8 overflow-hidden">
        
        <!-- اللوجو -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white/20 border border-white/30 rounded-2xl shadow-lg transform rotate-3 mb-4">
                <span class="text-4xl transform -rotate-3 text-white">💸</span>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tight">أقبض</h1>
            <p class="text-white/90 font-bold text-sm mt-1 tracking-wider">كاشك في أي وقت، من أقرب مكان</p>
        </div>

        <!-- الخطوة 1: اختيار الدور -->
        <div id="roleSelection" class="fade-enter-active space-y-4">
            <h2 class="text-lg font-extrabold text-white mb-4 text-center">حدد طريقة دخولك للتطبيق:</h2>
            
            <button onclick="showForm('customer')" class="w-full group bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/50 rounded-2xl p-4 flex items-center gap-4 transition-all duration-300 active:scale-95">
                <div class="w-14 h-14 bg-white/20 text-white rounded-xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">🏃‍♂️</div>
                <div class="text-right flex-1">
                    <h3 class="text-xl font-black text-white">أنا عميل (طالب كاش)</h3>
                    <p class="text-xs text-blue-100 font-bold mt-1">محتاج سيولة نقدية فورية</p>
                </div>
            </button>

            <button onclick="showForm('merchant')" class="w-full group bg-white/10 hover:bg-white/20 border border-white/20 hover:border-white/50 rounded-2xl p-4 flex items-center gap-4 transition-all duration-300 active:scale-95">
                <div class="w-14 h-14 bg-white/20 text-white rounded-xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">🏪</div>
                <div class="text-right flex-1">
                    <h3 class="text-xl font-black text-white">أنا تاجر (مزود سيولة)</h3>
                    <p class="text-xs text-blue-100 font-bold mt-1">لدي كاش أرغب في إيداعه رقمياً</p>
                </div>
            </button>
        </div>

        <!-- نموذج دخول العميل -->
        <div id="customerForm" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button type="button" onclick="goBack()" class="w-8 h-8 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-colors">&rarr;</button>
                <h2 class="text-xl font-black text-white">طلب الكاش</h2>
            </div>
            
            <form onsubmit="submitCustomer(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-white mb-2">رقم الهاتف</label>
                    <input type="tel" id="customerPhone" required placeholder="01xxxxxxxx" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white focus:border-white outline-none text-white text-lg font-black tracking-widest text-left" dir="ltr">
                </div>
                
                <div>
                    <label class="block text-sm font-bold text-white mb-2">المبلغ المطلوب (كاش)</label>
                    <input type="number" id="customerAmount" required placeholder="مثال: 1000" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white focus:border-white outline-none text-white text-xl font-black tracking-widest text-center">
                </div>

                <button id="btnCustomer" type="submit" class="w-full bg-white text-blue-900 hover:bg-blue-50 font-extrabold py-4 rounded-xl shadow-lg active:scale-95 transition-all text-lg mt-2">
                    تأكيد وفتح الخريطة 🗺️
                </button>
            </form>
        </div>

        <!-- نموذج دخول التاجر (الحالي) -->
        <div id="merchantForm" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button type="button" onclick="goBack()" class="w-8 h-8 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-colors">&rarr;</button>
                <h2 class="text-xl font-black text-white">تسجيل دخول التاجر</h2>
            </div>
            
            <form onsubmit="submitMerchant(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-white mb-2">رقم هاتف المتجر</label>
                    <input type="tel" required placeholder="01xxxxxxxx" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white focus:border-white outline-none text-white text-lg font-black tracking-widest text-left" dir="ltr">
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-2">الرقم السري (PIN)</label>
                    <input type="password" required placeholder="****" maxlength="4" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white focus:border-white outline-none text-white text-center text-2xl font-black tracking-widest" dir="ltr">
                </div>
                <button id="btnMerchant" type="submit" class="w-full bg-white text-blue-900 hover:bg-blue-50 font-extrabold py-4 rounded-xl shadow-lg active:scale-95 transition-all text-lg">
                    دخول للوحة التحكم 🏪
                </button>
            </form>
            
            <div class="mt-4 text-center border-t border-white/20 pt-4">
                <p class="text-sm text-blue-100 font-bold mb-2">ليس لديك حساب تاجر؟</p>
                <button type="button" onclick="showMerchantRegister()" class="text-white font-black underline hover:text-blue-200 transition-colors">
                    إنشاء حساب تاجر جديد
                </button>
            </div>
        </div>

        <!-- نموذج تسجيل تاجر جديد (مع GPS) -->
        <div id="merchantRegisterForm" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button type="button" onclick="showForm('merchant')" class="w-8 h-8 bg-white/20 border border-white/30 rounded-full flex items-center justify-center text-white hover:bg-white/30 transition-colors">&rarr;</button>
                <h2 class="text-xl font-black text-white">تسجيل تاجر جديد</h2>
            </div>
            
            <form onsubmit="registerMerchant(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-white mb-1">رقم التليفون</label>
                    <input type="tel" id="regPhone" required placeholder="01xxxxxxxx" class="w-full px-3 py-2.5 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white focus:border-white outline-none text-white text-base font-black tracking-widest text-left" dir="ltr">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-bold text-white mb-1">الرقم السري</label>
                        <input type="password" id="regPin" required placeholder="****" maxlength="4" class="w-full px-3 py-2.5 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white outline-none text-white text-center text-lg font-black tracking-widest" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-white mb-1">تأكيد السري</label>
                        <input type="password" id="regPinConfirm" required placeholder="****" maxlength="4" class="w-full px-3 py-2.5 bg-white/10 border border-white/30 rounded-xl focus:ring-2 focus:ring-white outline-none text-white text-center text-lg font-black tracking-widest" dir="ltr">
                    </div>
                </div>

                <div class="bg-white/10 border border-white/20 p-3 rounded-xl mt-2">
                    <label class="block text-sm font-bold text-white mb-2">مكان المتجر (لإرسال العملاء إليك)</label>
                    <button type="button" id="btnGps" onclick="getMerchantLocation()" class="w-full bg-blue-600 hover:bg-blue-500 text-white border border-blue-400 font-extrabold py-2.5 rounded-lg active:scale-95 transition-all text-sm flex justify-center items-center gap-2">
                        <span>📍</span> التقاط موقعي الحالي (GPS)
                    </button>
                    
                    <!-- حقول مخفية لحفظ الإحداثيات -->
                    <input type="hidden" id="merchantLat" required>
                    <input type="hidden" id="merchantLng" required>
                    
                    <p id="gpsSuccess" class="text-xs font-black text-green-300 mt-2 text-center hidden">
                        ✅ تم حفظ موقع المتجر بنجاح!
                    </p>
                </div>

                <button id="btnRegisterMerchant" type="submit" class="w-full bg-white text-blue-900 hover:bg-blue-50 font-extrabold py-4 rounded-xl shadow-lg active:scale-95 transition-all text-lg mt-2">
                    تأكيد وإنشاء الحساب ✔️
                </button>
            </form>
        </div>

    </div>

    <script>
        function showForm(role) {
            document.getElementById('roleSelection').classList.remove('fade-enter-active');
            document.getElementById('roleSelection').classList.add('fade-enter');
            document.getElementById('merchantRegisterForm').classList.remove('fade-enter-active');
            document.getElementById('merchantRegisterForm').classList.add('fade-enter');
            
            setTimeout(() => {
                if(role === 'customer') {
                    document.getElementById('customerForm').classList.remove('fade-enter');
                    document.getElementById('customerForm').classList.add('fade-enter-active');
                } else if(role === 'merchant') {
                    document.getElementById('merchantForm').classList.remove('fade-enter');
                    document.getElementById('merchantForm').classList.add('fade-enter-active');
                }
            }, 300);
        }

        function showMerchantRegister() {
            document.getElementById('merchantForm').classList.remove('fade-enter-active');
            document.getElementById('merchantForm').classList.add('fade-enter');
            
            setTimeout(() => {
                document.getElementById('merchantRegisterForm').classList.remove('fade-enter');
                document.getElementById('merchantRegisterForm').classList.add('fade-enter-active');
            }, 300);
        }

        function goBack() {
            document.getElementById('customerForm').classList.remove('fade-enter-active');
            document.getElementById('customerForm').classList.add('fade-enter');
            document.getElementById('merchantForm').classList.remove('fade-enter-active');
            document.getElementById('merchantForm').classList.add('fade-enter');
            document.getElementById('merchantRegisterForm').classList.remove('fade-enter-active');
            document.getElementById('merchantRegisterForm').classList.add('fade-enter');
            
            setTimeout(() => {
                document.getElementById('roleSelection').classList.remove('fade-enter');
                document.getElementById('roleSelection').classList.add('fade-enter-active');
            }, 300);
        }

        function submitCustomer(e) {
            e.preventDefault();
            const phone = document.getElementById('customerPhone').value;
            const amount = document.getElementById('customerAmount').value;
            localStorage.setItem('customer_cash_amount', amount);
            
            const btn = document.getElementById('btnCustomer');
            btn.innerHTML = "⏳ جاري فتح الخريطة...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            setTimeout(() => { window.location.href = "split_app.html"; }, 1200);
        }

        function submitMerchant(e) {
            e.preventDefault();
            const btn = document.getElementById('btnMerchant');
            btn.innerHTML = "⏳ جاري التحقق...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            setTimeout(() => { window.location.href = "split_app.html"; }, 1200);
        }

        // دالة التقاط الـ GPS للتاجر
        function getMerchantLocation() {
            const btn = document.getElementById('btnGps');
            btn.innerHTML = "⏳ جاري الاتصال بالـ GPS...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('merchantLat').value = position.coords.latitude;
                        document.getElementById('merchantLng').value = position.coords.longitude;
                        
                        btn.innerHTML = "📍 إعادة التقاط الموقع (مُحدث)";
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                        document.getElementById('gpsSuccess').classList.remove('hidden');
                    },
                    (error) => {
                        btn.innerHTML = "📍 التقاط موقعي الحالي (GPS)";
                        btn.classList.remove('opacity-75', 'cursor-not-allowed');
                        alert("عفواً، يرجى تفعيل الـ GPS في هاتفك وإعطاء الصلاحية للمتصفح لتحديد موقع المتجر بدقة.");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                alert("متصفحك لا يدعم خاصية تحديد الموقع.");
            }
        }

        // دالة إرسال تسجيل التاجر
        function registerMerchant(e) {
            e.preventDefault();
            const pin1 = document.getElementById('regPin').value;
            const pin2 = document.getElementById('regPinConfirm').value;
            const lat = document.getElementById('merchantLat').value;
            
            if (pin1 !== pin2) {
                return alert("الرقم السري وتأكيده غير متطابقين!");
            }
            if (!lat) {
                return alert("الرجاء الضغط على زر (التقاط موقعي الحالي) لتسجيل إحداثيات متجرك.");
            }

            const btn = document.getElementById('btnRegisterMerchant');
            btn.innerHTML = "⏳ جاري التسجيل...";
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            
            // محاكاة حفظ البيانات والانتقال
            setTimeout(() => {
                window.location.href = "split_app.html";
            }, 1500);
        }
    </script>
</body>
</html>
