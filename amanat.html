<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa proo - الإدارة والتقارير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: var(--text-main); }
        .container { max-width: 1000px; margin: auto; background: var(--card-bg); padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        
        .header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0 0 5px 0; font-size: 34px; font-weight: 900; background: linear-gradient(45deg, var(--primary), #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: var(--text-muted); font-size: 16px; margin: 0; font-weight: 700; }
        
        /* لوحة الإحصائيات العامة */
        .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: #fff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 16px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02); transition: 0.3s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
        .stat-value { font-size: 28px; font-weight: 900; margin-bottom: 5px; }
        .stat-title { font-size: 14px; font-weight: 700; color: var(--text-muted); }
        
        .val-total { color: var(--primary); }
        .val-done { color: var(--success); }
        .val-urgent { color: var(--danger); }
        .val-pending { color: var(--warning); }

        /* قسم التقارير السنوية */
        .report-section { background: #f1f5f9; padding: 25px; border-radius: 16px; margin-bottom: 30px; border: 2px dashed #cbd5e1; }
        .report-header { font-size: 20px; font-weight: 900; margin-bottom: 15px; color: var(--dark); display: flex; align-items: center; gap: 8px;}
        .report-controls { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        @media (max-width: 600px) { .report-controls { grid-template-columns: 1fr; } }
        
        select, input[type="text"] { padding: 15px; font-size: 16px; border-radius: 12px; border: 2px solid #e2e8f0; font-family: 'Cairo', sans-serif; font-weight: 600; width: 100%; box-sizing: border-box; transition: 0.3s; }
        select:focus, input[type="text"]:focus { border-color: var(--primary); outline: none; }
        
        .btn-report { background: var(--dark); color: white; padding: 15px; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: 800; font-family: 'Cairo', sans-serif; transition: 0.3s;}
        .btn-report:hover { background: #0f172a; }

        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        #start-btn { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; padding: 18px; font-size: 20px; border: none; border-radius: 50px; cursor: pointer; font-weight: 800; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); transition: 0.3s; font-family: 'Cairo', sans-serif; }
        #start-btn.recording { background: linear-gradient(135deg, var(--danger) 0%, #f87171 100%); animation: pulse 1.5s infinite; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4); }
        
        textarea { padding: 20px; font-size: 18px; border-radius: 16px; border: 2px solid #e2e8f0; background-color: #fff; resize: vertical; min-height: 90px; width: 100%; box-sizing: border-box; font-family: 'Cairo', sans-serif; font-weight: 600; }
        
        .action-row { display: flex; gap: 10px; }
        #save-btn { background: var(--success); color: white; padding: 15px; font-size: 18px; border: none; border-radius: 16px; cursor: pointer; font-weight: 800; flex-grow: 1; font-family: 'Cairo', sans-serif; }

        .section-title { font-size: 22px; font-weight: 900; margin-bottom: 20px; color: var(--text-main); border-right: 5px solid var(--primary); padding-right: 12px; display: flex; justify-content: space-between; align-items: center;}
        
        /* الكروت */
        .list-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 40px; }
        .task-card { background: var(--card-bg); border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; transition: 0.3s; position: relative; overflow: hidden; }
        .task-card::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: var(--secondary); border-radius: 0 16px 16px 0; }
        .task-card.completed { background: #f8fafc; opacity: 0.7; }
        .task-card.completed::before { background: var(--success); }
        .task-card.completed .card-body { text-decoration: line-through; color: var(--text-muted); }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .badge { background: #dbeafe; color: var(--primary); padding: 5px 12px; border-radius: 12px; font-weight: 800; font-size: 14px; }
        
        .tags-container { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;}
        .ai-tag { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; }
        .tag-urgent { background: #fee2e2; color: var(--danger); }
        .tag-measure { background: #e0e7ff; color: #4f46e5; }
        .tag-money { background: #d1fae5; color: #059669; }

        .task-date { font-size: 13px; color: var(--text-muted); font-weight: 700; }
        .card-body { font-size: 18px; line-height: 1.6; font-weight: 700; margin-bottom: 15px; }

        .card-actions { display: flex; gap: 10px; }
        .btn-done { background: #d1fae5; color: #059669; padding: 8px 16px; font-size: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; font-family: 'Cairo', sans-serif; flex-grow: 1;}
        .btn-delete { background: #fee2e2; color: var(--danger); padding: 8px 16px; font-size: 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; font-family: 'Cairo', sans-serif; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Azemaa proo 📊</h1>
        <p class="subtitle">نظام الإدارة والتقارير - مطابخ فرح</p>
    </div>
    
    <!-- قسم التقارير السنوية للأشخاص والشركات -->
    <div class="report-section">
        <div class="report-header">📑 استخراج تقرير سنوي (أشخاص / شركات)</div>
        <div class="report-controls">
            <input type="text" id="report-query" placeholder="اكتب اسم الفني، العميل، أو الشركة (مثال: ميدو، شركة الأمل)...">
            <select id="report-year">
                <option value="all">كل السنوات</option>
                <option value="2026" selected>2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>
            <button class="btn-report" onclick="generateReport()">عرض التقرير 🔍</button>
        </div>
        
        <!-- إحصائيات التقرير المخصص (تظهر عند البحث) -->
        <div id="custom-report-stats" class="dashboard" style="display: none; margin-bottom: 0; margin-top: 20px;">
            <div class="stat-card"><div class="stat-value val-total" id="rep-total">0</div><div class="stat-title">إجمالي العمليات</div></div>
            <div class="stat-card"><div class="stat-value val-done" id="rep-done">0</div><div class="stat-title">تم الإنجاز</div></div>
            <div class="stat-card"><div class="stat-value val-pending" id="rep-pending">0</div><div class="stat-title">متبقي / قيد التنفيذ</div></div>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn">🎙️ اضغط للتسجيل الصوتي</button>
        <textarea id="note-box" placeholder="سجل ملاحظتك أو المهمة هنا..."></textarea>
        <div class="action-row">
            <button id="save-btn">💾 حفظ المهمة</button>
        </div>
    </div>

    <!-- زر لإلغاء الفلترة والعودة للعرض الكامل -->
    <div class="section-title">
        <span id="list-title">📋 جميع المهام والملاحظات</span>
        <button id="clear-filter-btn" style="display:none; background:var(--danger); color:white; border:none; padding:5px 15px; border-radius:8px; font-family:'Cairo'; cursor:pointer; font-weight:bold;" onclick="clearReport()">❌ إلغاء التقرير</button>
    </div>
    
    <div id="tasks-list" class="list-container"></div>
</div>

<script>
    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    let notesData = JSON.parse(localStorage.getItem('azemaaProAI')) || [];
    
    let currentViewData = notesData; 

    const noteBox = document.getElementById('note-box');
    const startBtn = document.getElementById('start-btn');
    const saveBtn = document.getElementById('save-btn');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = true;
        recognition.interimResults = false; 

        recognition.onstart = () => {
            isRecording = true;
            startBtn.textContent = "🛑 جاري الاستماع للتحليل...";
            startBtn.classList.add("recording");
        };

        recognition.onresult = (event) => {
            let finalText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                finalText += event.results[i][0].transcript + " ";
            }
            if(finalText.trim() !== "") noteBox.value += finalText;
        };

        recognition.onend = () => {
            isRecording = false;
            startBtn.textContent = "🎙️ اضغط للتسجيل الصوتي";
            startBtn.classList.remove("recording");
        };

        startBtn.addEventListener('click', (e) => {
            e.preventDefault(); 
            if (!isRecording) try { recognition.start(); } catch(err) {} 
            else recognition.stop();
        });
    }

    function analyzeText(text) {
        let tags = [];
        if (/(عاجل|بسرعة|ضروري|فورا|حالا)/.test(text)) tags.push({ type: 'urgent', html: '<span class="ai-tag tag-urgent">🔥 عاجل جداً</span>' });
        if (/(متر|سم|ملي|مقاس|طول|عرض|درفة|قطاع|مفصلة|زجاج|فايبر)/.test(text)) tags.push({ type: 'measure', html: '<span class="ai-tag tag-measure">📏 مقاسات وخامات</span>' });
        if (/(جنيه|الف|حساب|عربون|دفع|باقي|تكلفة|فلوس)/.test(text)) tags.push({ type: 'money', html: '<span class="ai-tag tag-money">💰 ماليات</span>' });
        return tags;
    }

    saveBtn.addEventListener('click', () => {
        const text = noteBox.value.trim();
        if (!text) return alert("برجاء التحدث أولاً!");

        let assignedPerson = "عام";
        for (let name of teamMembers) {
            if (text.includes(name)) { assignedPerson = name; break; }
        }

        const tags = analyzeText(text);
        const now = new Date();
        const year = now.getFullYear().toString();
        const fullDateTime = `${now.toLocaleDateString('ar-EG')} - ${now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true })}`;

        const newNote = { 
            id: Date.now(), 
            text: text, 
            person: assignedPerson,
            datetime: fullDateTime,
            year: year,
            status: 'pending',
            tags: tags
        };
        
        notesData.unshift(newNote);
        localStorage.setItem('azemaaProAI', JSON.stringify(notesData));
        noteBox.value = "";
        clearReport(); 
    });

    function toggleStatus(id) {
        let note = notesData.find(n => n.id === id);
        if (note) {
            note.status = note.status === 'completed' ? 'pending' : 'completed';
            localStorage.setItem('azemaaProAI', JSON.stringify(notesData));
            renderApp(currentViewData);
        }
    }

    function deleteNote(id) {
        if(confirm("تأكيد الحذف النهائي؟")) {
            notesData = notesData.filter(n => n.id !== id);
            localStorage.setItem('azemaaProAI', JSON.stringify(notesData));
            
            currentViewData = currentViewData.filter(n => n.id !== id);
            renderApp(currentViewData);
        }
    }

    function generateReport() {
        const query = document.getElementById('report-query').value.trim();
        const yearQuery = document.getElementById('report-year').value;

        if(!query && yearQuery === 'all') {
            return clearReport();
        }

        currentViewData = notesData.filter(n => {
            const matchYear = yearQuery === 'all' || n.year === yearQuery || (n.datetime && n.datetime.includes(yearQuery));
            const matchName = query === "" || n.person.includes(query) || n.text.includes(query);
            return matchYear && matchName;
        });

        const total = currentViewData.length;
        const done = currentViewData.filter(n => n.status === 'completed').length;
        const pending = total - done;

        document.getElementById('rep-total').innerText = total;
        document.getElementById('rep-done').innerText = done;
        document.getElementById('rep-pending').innerText = pending;
        document.getElementById('custom-report-stats').style.display = 'grid';
        
        document.getElementById('list-title').innerText = `📋 تقرير: ${query || 'الكل'} (${yearQuery === 'all' ? 'كل السنوات' : yearQuery})`;
        document.getElementById('clear-filter-btn').style.display = 'inline-block';

        renderApp(currentViewData);
    }

    function clearReport() {
        document.getElementById('report-query').value = "";
        document.getElementById('report-year').value = "all";
        document.getElementById('custom-report-stats').style.display = 'none';
        document.getElementById('list-title').innerText = "📋 جميع المهام والملاحظات";
        document.getElementById('clear-filter-btn').style.display = 'none';
        
        currentViewData = notesData;
        renderApp(currentViewData);
    }

    function renderApp(dataToRender) {
        const tasksList = document.getElementById('tasks-list');
        tasksList.innerHTML = ""; 

        if (dataToRender.length === 0) {
            tasksList.innerHTML = "<p style='text-align:center; color:#94a3b8; padding:20px;'>لا توجد بيانات مطابقة...</p>";
            return;
        }

        dataToRender.forEach(note => {
            const isDone = note.status === 'completed';
            const tagsHTML = (note.tags || []).map(t => t.html).join('');
            
            const cardHTML = `
                <div class="task-card ${isDone ? 'completed' : ''}">
                    <div class="card-header">
                        <span class="badge ${note.person === 'عام' ? 'general' : ''}">${note.person}</span>
                        <span class="task-date">🕒 ${note.datetime}</span>
                    </div>
                    ${tagsHTML ? `<div class="tags-container">${tagsHTML}</div>` : ''}
                    <div class="card-body">${note.text}</div>
                    <div class="card-actions">
                        <button class="btn-done" onclick="toggleStatus(${note.id})">
                            ${isDone ? '↩️ تراجع عن الإنجاز' : '✅ تم الإنجاز'}
                        </button>
                        <button class="btn-delete" onclick="deleteNote(${note.id})">🗑️ حذف</button>
                    </div>
                </div>
            `;
            tasksList.innerHTML += cardHTML;
        });
    }

    clearReport();
</script>

</body>
</html>
