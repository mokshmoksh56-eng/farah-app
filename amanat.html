<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - حاسبة مطابخ فرح 🤖🎤</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 10px; margin-bottom: 20px; }
        .ai-section { background: #f8f9fa; border: 2px dashed #3498db; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 25px; }
        .upload-btn { background-color: #27ae60; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-block; margin: 5px; }
        .mic-btn { background-color: #8e44ad; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-block; margin: 5px; border: none; font-size: 16px; }
        .mic-btn:hover { background-color: #9b59b6; }
        input[type="file"] { display: none; }
        #imagePreview { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 8px; display: none; }
        .loader { display: none; margin: 15px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #voiceTextDisplay { margin-top: 15px; font-style: italic; color: #555; background: #e8f8f5; padding: 10px; border-radius: 5px; display: none; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button.calc-btn { width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px;}
        button.calc-btn:hover { background-color: #2980b9; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #2c3e50; color: white; }
        .section-title { background-color: #34495e; color: white; font-weight: bold; }
        .recording { animation: pulse 1.5s infinite; background-color: #c0392b !important; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <h2>روبوت Azemaa Pro للمطابخ 🤖</h2>
    
    <div class="ai-section">
        <p>استخدم الكاميرا لرفع كروكي أو المايك لإملاء المقاسات</p>
        
        <label for="imageUpload" class="upload-btn">📸 صورة كروكي</label>
        <input type="file" id="imageUpload" accept="image/*" onchange="processImage(event)">
        
        <button id="micButton" class="mic-btn" onclick="startDictation()">🎤 تحدث بالمقاسات</button>
        
        <img id="imagePreview" alt="كروكي المقاسات">
        <div id="voiceTextDisplay"></div>
        <div class="loader" id="aiLoader"></div>
        <p id="aiStatus" style="color: #e74c3c; margin-top: 10px; font-weight: bold; display: none;"></p>
    </div>

    <!-- الخانات الأساسية -->
    <div class="form-group">
        <label>موقع الوحدة:</label>
        <select id="cabinetPosition">
            <option value="bottom">سفلي</option>
            <option value="top">علوي</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>الارتفاع الخارجي (سم):</label>
        <input type="number" id="externalHeight">
    </div>
    <div class="form-group">
        <label>العرض الخارجي (سم):</label>
        <input type="number" id="externalWidth">
    </div>
    <div class="form-group">
        <label>العمق الخارجي (سم):</label>
        <input type="number" id="externalDepth">
    </div>
    <div class="form-group">
        <label>نوع التقفيل:</label>
        <select id="unitType">
            <option value="single">ضلفة واحدة</option>
            <option value="double">ضلفتين (2)</option>
        </select>
    </div>

    <button class="calc-btn" onclick="calculateFinalSizes()">✂️ احسب مقاسات التقطيع</button>

    <table id="resultTable" style="display:none;">
        <thead><tr><th>البيان (قطعة التقطيع)</th><th>المقاس (سم)</th><th>العدد</th></tr></thead>
        <tbody id="resultBody"></tbody>
    </table>
</div>

<script>
    const API_KEY = "حط_مفتاحك_هنا";

    // --- دالة تسجيل الصوت ---
    function startDictation() {
        if (window.hasOwnProperty('webkitSpeechRecognition') || window.hasOwnProperty('SpeechRecognition')) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            let micBtn = document.getElementById('micButton');
            let textDisplay = document.getElementById('voiceTextDisplay');
            let status = document.getElementById('aiStatus');
            
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = "ar-EG"; 

            recognition.start();
            micBtn.classList.add("recording");
            micBtn.innerText = "🔴 جاري الاستماع...";
            status.style.display = "none";
            textDisplay.style.display = "none";

            recognition.onresult = function(e) {
                micBtn.classList.remove("recording");
                micBtn.innerText = "🎤 تحدث بالمقاسات";
                
                let spokenText = e.results[0][0].transcript;
                textDisplay.innerText = `أنت قلت: "${spokenText}"`;
                textDisplay.style.display = "block";
                
                processTextFast(spokenText);
            };

            recognition.onerror = function(e) {
                micBtn.classList.remove("recording");
                micBtn.innerText = "🎤 تحدث بالمقاسات";
                status.innerText = "لم يتم التعرف على الصوت، حاول مرة أخرى.";
                status.style.color = "#e74c3c";
                status.style.display = "block";
            };
        } else {
            alert("متصفحك لا يدعم خاصية التحدث الصوتي. يرجى استخدام متصفح Google Chrome.");
        }
    }

    // --- دالة تحليل النص الصوتي (سريعة بدون إنترنت) ---
    function processTextFast(text) {
        let status = document.getElementById('aiStatus');
        status.style.display = 'block';
        
        try {
            // استخراج المقاسات
            let heightMatch = text.match(/ارتفاع\s*(\d+)/) || text.match(/طول\s*(\d+)/);
            let widthMatch = text.match(/عرض\s*(\d+)/);
            let depthMatch = text.match(/عمق\s*(\d+)/);

            if(heightMatch) document.getElementById('externalHeight').value = heightMatch[1];
            if(widthMatch) document.getElementById('externalWidth').value = widthMatch[1];
            if(depthMatch) document.getElementById('externalDepth').value = depthMatch[1];

            // استخراج نوع الضلف
            if(text.includes("ضلفتين") || text.includes("اثنين") || text.includes("2")) {
                document.getElementById('unitType').value = 'double';
            } else if (text.includes("ضلفة") || text.includes("واحد") || text.includes("1")) {
                document.getElementById('unitType').value = 'single';
            }

            // استخراج موقع الوحدة (سفلي أو علوي)
            if(text.includes("علو") || text.includes("فوق")) {
                document.getElementById('cabinetPosition').value = 'top';
            } else if (text.includes("سفل") || text.includes("تحت")) {
                document.getElementById('cabinetPosition').value = 'bottom';
            }

            status.style.color = "#27ae60";
            status.innerText = "تم إدخال المقاسات بنجاح!";
            
            calculateFinalSizes();
            
        } catch (error) {
            status.style.color = "#e74c3c";
            status.innerText = "حدث خطأ في فهم المقاسات، يرجى إعادة المحاولة.";
        }
    }

    // --- دالة تحليل الصورة ---
    async function processImage(event) {
        let input = event.target;
        if (!input.files || !input.files[0]) return;
        let preview = document.getElementById('imagePreview');
        let loader = document.getElementById('aiLoader');
        let status = document.getElementById('aiStatus');
        let reader = new FileReader();
        
        reader.onload = async function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
            loader.style.display = 'block';
            status.style.display = 'block';
            status.style.color = "#e74c3c";
            status.innerText = "جاري تحليل الصورة...";
            let base64Image = e.target.result.split(',')[1];
            
            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `استخرج المقاسات: الارتفاع، العرض، العمق، عدد الضلف (1 أو 2)، وموقع الوحدة (علوي أم سفلي). 
                                رُد بـ JSON فقط: {"height": رقم, "width": رقم, "depth": رقم, "doors": رقم, "position": "top" أو "bottom"}` },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });
                
                let data = await response.json();
                if(data.error) throw new Error(data.error.message);

                let aiText = data.candidates[0].content.parts[0].text;
                let cleanJson = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                let extractedData = JSON.parse(cleanJson);
                
                document.getElementById('externalHeight').value = extractedData.height || '';
                document.getElementById('externalWidth').value = extractedData.width || '';
                document.getElementById('externalDepth').value = extractedData.depth || '';
                if(extractedData.doors) {
                    document.getElementById('unitType').value = (extractedData.doors == 2) ? 'double' : 'single';
                }
                if(extractedData.position) {
                    document.getElementById('cabinetPosition').value = (extractedData.position === 'top') ? 'top' : 'bottom';
                }
                
                loader.style.display = 'none';
                status.style.color = "#27ae60";
                status.innerText = "تم استخراج المقاسات من الصورة بنجاح!";
                
                calculateFinalSizes(); 
                
            } catch (error) {
                loader.style.display = 'none';
                status.style.color = "#e74c3c";
                status.innerText = "حدث خطأ. تأكد من وضع مفتاح API صحيح للصورة.";
                console.error(error);
            }
        }
        reader.readAsDataURL(input.files[0]);
    }

    // --- دالة حساب التقطيع النهائية ---
    function calculateFinalSizes() {
        let extH = parseFloat(document.getElementById('externalHeight').value);
        let extW = parseFloat(document.getElementById('externalWidth').value);
        let extD = parseFloat(document.getElementById('externalDepth').value);
        let type = document.getElementById('unitType').value;
        let position = document.getElementById('cabinetPosition').value;
        let resultBody = document.getElementById('resultBody');
        let resultTable = document.getElementById('resultTable');
        
        if (isNaN(extH) || isNaN(extW) || isNaN(extD)) {
            return;
        }

        resultBody.innerHTML = ""; 
        resultTable.style.display = "table";

        // تحديد اسم الوحدة للجدول بناءً على الاختيار
        let posText = (position === 'top') ? "علوية" : "سفلية";

        resultBody.innerHTML += `<tr><td colspan="3" class="section-title">تقطيع شاسيه وحدة ${posText} (علبة 2.5 سم)</td></tr>`;
        
        addRow('قوايم الارتفاع', (extH - 5).toFixed(1), '4');
        addRow('عوارض العرض', (extW - 5).toFixed(1), '4');
        addRow('عوارض العمق', (extD - 5).toFixed(1), '4');

        resultBody.innerHTML += `<tr><td colspan="3" class="section-title">الضلف والفيبر</td></tr>`;
        let innerH = extH - 5;
        let innerW = extW - 5;

        if (type === 'single') {
            let doorH = innerH + 2.5;
            let doorW = innerW + 2.5;
            addRow('الضلفة (ارتفاع × عرض)', `${doorH.toFixed(1)} × ${doorW.toFixed(1)}`, '1');
            addRow('فيبر الضلفة (ارتفاع × عرض)', `${(doorH - 0.2).toFixed(1)} × ${(doorW - 0.2).toFixed(1)}`, '1');
        } else if (type === 'double') {
            let doorH = innerH + 2.5;
            let doorW = (innerW + 2.6) / 2;
            addRow('الضلفة (ارتفاع × عرض)', `${doorH.toFixed(1)} × ${doorW.toFixed(1)}`, '2');
            addRow('فيبر الضلفة (ارتفاع × عرض)', `${(doorH - 0.2).toFixed(1)} × ${(doorW - 0.2).toFixed(1)}`, '2');
        }
    }

    function addRow(name, size, count) {
        document.getElementById('resultBody').innerHTML += `<tr><td>${name}</td><td>${size}</td><td>${count}</td></tr>`;
    }
</script>

</body>
</html>
