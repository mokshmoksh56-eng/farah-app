<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أقبض | تسجيل الدخول</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; overflow: hidden; }
        
        /* تأثيرات الإضاءة الخلفية (الابتكار) */
        .glow-blob {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(16,185,129,0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; filter: blur(40px); z-index: 0;
            animation: float 6s infinite ease-in-out alternate;
        }
        .glow-blob-2 {
            position: absolute; width: 250px; height: 250px; bottom: -50px; left: -50px;
            background: radial-gradient(circle, rgba(59,130,246,0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%; filter: blur(40px); z-index: 0;
            animation: float 8s infinite ease-in-out alternate-reverse;
        }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(-30px) scale(1.1); } }
        
        /* التصميم الزجاجي */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10; position: relative;
        }
        
        /* إخفاء العناصر بانسيابية */
        .fade-enter { opacity: 0; transform: translateY(15px); transition: all 0.4s ease-out; pointer-events: none; position: absolute; width: 100%; visibility: hidden; }
        .fade-enter-active { opacity: 1; transform: translateY(0); pointer-events: auto; position: relative; visibility: visible; }
    </style>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative text-white">

    <!-- إضاءات الخلفية المتحركة -->
    <div class="glow-blob top-[-50px] right-[-50px]"></div>
    <div class="glow-blob-2"></div>

    <div class="w-full max-w-md glass-card rounded-3xl p-8 overflow-hidden">
        
        <!-- اللوجو (ثابت) -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-emerald-400 to-green-600 rounded-2xl shadow-lg shadow-emerald-500/30 transform rotate-3 mb-4">
                <span class="text-4xl transform -rotate-3 text-white">💸</span>
            </div>
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-white tracking-tight">أقبض</h1>
            <p class="text-slate-400 font-bold text-sm mt-1 tracking-wider">كاشك في أي وقت، من أقرب مكان</p>
        </div>

        <!-- الخطوة 1: اختيار الدور (تظهر في البداية) -->
        <div id="roleSelection" class="fade-enter-active space-y-4">
            <h2 class="text-lg font-extrabold text-white mb-4 text-center">حدد طريقة دخولك للتطبيق:</h2>
            
            <button onclick="showForm('customer')" class="w-full group bg-white/5 hover:bg-white/10 border border-white/10 hover:border-emerald-500/50 rounded-2xl p-4 flex items-center gap-4 transition-all duration-300 active:scale-95">
                <div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">🏃‍♂️</div>
                <div class="text-right flex-1">
                    <h3 class="text-xl font-black text-white group-hover:text-emerald-400 transition-colors">أنا عميل (طالب كاش)</h3>
                    <p class="text-xs text-slate-400 font-bold mt-1">محتاج سيولة نقدية فورية</p>
                </div>
            </button>

            <button onclick="showForm('merchant')" class="w-full group bg-white/5 hover:bg-white/10 border border-white/10 hover:border-blue-500/50 rounded-2xl p-4 flex items-center gap-4 transition-all duration-300 active:scale-95">
                <div class="w-14 h-14 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center text-3xl group-hover:scale-110 transition-transform">🏪</div>
                <div class="text-right flex-1">
                    <h3 class="text-xl font-black text-white group-hover:text-blue-400 transition-colors">أنا تاجر (مزود سيولة)</h3>
                    <p class="text-xs text-slate-400 font-bold mt-1">لدي كاش أرغب في إيداعه رقمياً</p>
                </div>
            </button>
        </div>

        <!-- الخطوة 2: نموذج دخول العميل (مخفي افتراضياً) -->
        <div id="customerForm" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button onclick="goBack()" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/20 transition-colors">&rarr;</button>
                <h2 class="text-xl font-black text-emerald-400">دخول العميل</h2>
            </div>
            
            <form onsubmit="submitCustomer(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">رقم الهاتف المرتبط بالمحفظة/إنستاباي</label>
                    <input type="tel" required placeholder="01xxxxxxxx" class="w-full px-4 py-4 bg-slate-800/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-white text-xl font-black tracking-widest text-left" dir="ltr">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-green-600 text-white font-extrabold py-4 rounded-xl shadow-[0_0_15px_rgba(16,185,129,0.4)] active:scale-95 transition-all">
                    تأكيد وفتح الخريطة 🗺️
                </button>
            </form>
        </div>

        <!-- الخطوة 2: نموذج دخول التاجر (مخفي افتراضياً) -->
        <div id="merchantForm" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button onclick="goBack()" class="w-8 h-8 bg-white/10 rounded-full flex items-center justify-center text-slate-300 hover:text-white hover:bg-white/20 transition-colors">&rarr;</button>
                <h2 class="text-xl font-black text-blue-400">دخول التاجر</h2>
            </div>
            
            <form onsubmit="submitMerchant(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">رقم هاتف المتجر</label>
                    <input type="tel" required placeholder="01xxxxxxxx" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-white text-lg font-black tracking-widest text-left" dir="ltr">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-300 mb-2">الرقم السري (PIN)</label>
                    <input type="password" required placeholder="****" maxlength="4" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-white text-center text-2xl font-black tracking-widest" dir="ltr">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-extrabold py-4 rounded-xl shadow-[0_0_15px_rgba(59,130,246,0.4)] active:scale-95 transition-all">
                    فتح لوحة التحكم 🏪
                </button>
            </form>
        </div>

    </div>

    <script>
        function showForm(role) {
            // إخفاء قائمة الاختيار
            document.getElementById('roleSelection').classList.remove('fade-enter-active');
            document.getElementById('roleSelection').classList.add('fade-enter');
            
            // إظهار النموذج المطلوب بعد تأخير بسيط لإعطاء تأثير الانسيابية
            setTimeout(() => {
                if(role === 'customer') {
                    document.getElementById('customerForm').classList.remove('fade-enter');
                    document.getElementById('customerForm').classList.add('fade-enter-active');
                } else {
                    document.getElementById('merchantForm').classList.remove('fade-enter');
                    document.getElementById('merchantForm').classList.add('fade-enter-active');
                }
            }, 300);
        }

        function goBack() {
            // إخفاء النماذج
            document.getElementById('customerForm').classList.remove('fade-enter-active');
            document.getElementById('customerForm').classList.add('fade-enter');
            document.getElementById('merchantForm').classList.remove('fade-enter-active');
            document.getElementById('merchantForm').classList.add('fade-enter');
            
            // العودة لقائمة الاختيار
            setTimeout(() => {
                document.getElementById('roleSelection').classList.remove('fade-enter');
                document.getElementById('roleSelection').classList.add('fade-enter-active');
            }, 300);
        }

        function submitCustomer(e) {
            e.preventDefault();
            // هنا سيتم التوجيه لصفحة العميل أو إخفاء واجهة الدخول وفتح الخريطة
            alert("سيتم توجيهك الآن لخريطة طلب الكاش...");
        }

        function submitMerchant(e) {
            e.preventDefault();
            // هنا سيتم التحقق من قاعدة البيانات وتوجيه التاجر للوحة التحكم
            alert("سيتم فتح لوحة تحكم التاجر...");
        }
    </script>
</body>
</html>
