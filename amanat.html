<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث الشاشة - Azemaa Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .id-box { background: #e9ecef; padding: 15px; border-radius: 8px; font-size: 18px; margin-bottom: 20px; color: #333; }
        input { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 16px; text-align: center; }
        button { width: 95%; padding: 12px; margin: 5px 0; border-radius: 6px; border: none; font-size: 16px; color: white; cursor: pointer; font-weight: bold; }
        .btn-view { background: #007bff; }
        .btn-share { background: #28a745; }
        video { width: 100%; max-height: 400px; background: #000; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>نظام المراقبة والبث المباشر</h3>
        
        <div class="id-box">
            كود هذا الهاتف:<br>
            <strong id="my-id" style="color: #d9534f; font-size: 22px;">جاري التحميل...</strong>
        </div>
        
        <input type="text" id="remote-id" placeholder="أدخل كود الهاتف الآخر هنا">
        
        <button class="btn-share" onclick="shareScreen()">مشاركة شاشة هذا الهاتف (إرسال)</button>
        <button class="btn-view" onclick="startViewing()">استقبال البث من الهاتف الآخر</button>
        
        <video id="remote-video" autoplay playsinline controls></video>
    </div>

    <script>
        const peer = new Peer(); // إنشاء الاتصال
        
        // بمجرد فتح الصفحة، يتم توليد كود فريد للهاتف
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
        });

        // كود الاستقبال (الهاتف الأول الذي يشاهد)
        peer.on('call', (call) => {
            call.answer(); // الرد التلقائي
            call.on('stream', (remoteStream) => {
                const video = document.getElementById('remote-video');
                video.srcObject = remoteStream;
                video.play();
            });
        });

        // تنبيه لتهيئة الاستقبال
        function startViewing() {
            alert('تم تجهيز هذا الهاتف للاستقبال. اذهب للهاتف الثاني، أدخل كود هذا الهاتف، واضغط "مشاركة".');
        }

        // كود الإرسال (الهاتف الثاني الذي يعرض شاشته)
        async function shareScreen() {
            const remoteId = document.getElementById('remote-id').value;
            if (!remoteId) return alert('يجب إدخال كود الهاتف الأول أولاً!');

            try {
                // طلب صلاحية التقاط الشاشة
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                
                // الاتصال بالهاتف الأول وإرسال فيديو الشاشة
                const call = peer.call(remoteId, stream);
                alert('جاري بث الشاشة الآن...');
            } catch (err) {
                console.error(err);
                alert('المتصفح رفض تصوير الشاشة، أو لا يدعم هذه الميزة.');
            }
        }
    </script>
</body>
</html>
