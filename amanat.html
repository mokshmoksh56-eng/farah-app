<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة صوتية ذكية مع روبوت</title>
    <style>
        /* إعدادات التصميم الأساسية وتوسيط المحتوى */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.5s ease;
        }

        /* --- الوضع الليلي --- */
        body.dark-mode {
            background-color: #121212;
        }
        body.dark-mode .calculator {
            background-color: #1e272e;
            box-shadow: 0px 10px 30px rgba(255, 255, 255, 0.05);
        }
        body.dark-mode #display {
            background-color: #2f3640;
            color: #f5f6fa;
        }
        body.dark-mode .history-panel {
            background-color: #1e272e;
            color: #f5f6fa;
            border-top: 2px solid #34495e;
        }
        body.dark-mode .history-panel li {
            border-bottom: 1px solid #2f3640;
        }

        /* تصميم هيكل الآلة الحاسبة */
        .calculator {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            width: 320px;
            transition: all 0.5s ease;
        }

        /* --- تصميم الروبوت التفاعلي --- */
        .robot-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .robot {
            width: 70px;
            height: 55px;
            background-color: #34495e;
            border-radius: 15px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 3px solid #1abc9c;
            transition: all 0.3s ease;
        }

        .robot-eyes {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
        }

        .eye {
            width: 12px;
            height: 12px;
            background-color: #1abc9c;
            border-radius: 50%;
            animation: blink 4s infinite;
            transition: all 0.3s;
        }

        .robot-mouth {
            width: 25px;
            height: 4px;
            background-color: #1abc9c;
            border-radius: 2px;
            transition: all 0.2s;
        }

        /* حركة الرمش */
        @keyframes blink {
            0%, 96%, 98% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        /* حالة الروبوت أثناء الاستماع */
        .robot.listening { 
            border-color: #e74c3c; 
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); 
            transform: scale(1.05);
        }
        .robot.listening .eye { background-color: #e74c3c; animation: none; }
        .robot.listening .robot-mouth { 
            background-color: #e74c3c; 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
        }

        /* حالة الروبوت أثناء التحدث */
        .robot.speaking { 
            border-color: #f1c40f; 
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.6); 
        }
        .robot.speaking .eye { background-color: #f1c40f; }
        .robot.speaking .robot-mouth {
            background-color: #f1c40f;
            animation: talk 0.2s infinite alternate;
        }

        /* حركة الفم أثناء الكلام */
        @keyframes talk {
            0% { width: 15px; height: 4px; }
            100% { width: 22px; height: 12px; border-radius: 8px;}
        }

        #display {
            width: 100%;
            height: 60px;
            background-color: #ecf0f1;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: left; 
            padding: 10px;
            box-sizing: border-box;
            direction: ltr;
            color: #2c3e50;
            font-weight: bold;
            transition: all 0.3s;
        }

        #speechBox {
            width: 100%;
            min-height: 35px;
            background-color: #1a252f;
            color: #1abc9c;
            border-radius: 5px;
            margin-bottom: 20px;
            padding: 8px 10px;
            font-size: 15px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background-color: #34495e;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.operator { background-color: #e67e22; }
        button.clear { background-color: #e74c3c; grid-column: span 2; }
        button.equal { background-color: #27ae60; grid-column: span 2; }
        
        button.active, button:active {
            background-color: #f1c40f !important;
            color: #333;
            box-shadow: 0 0 15px #f1c40f;
            transform: scale(1.05);
        }

        .mic-btn {
            grid-column: span 4;
            background-color: #3498db;
            font-weight: bold;
        }

        .listening-btn {
            background-color: #e74c3c !important;
            animation: pulse-btn 1s infinite;
        }

        .history-panel {
            width: 320px;
            margin-top: 15px;
            background-color: #ecf0f1;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            max-height: 150px;
            overflow-y: auto;
            color: #2c3e50;
            transition: all 0.5s ease;
        }
        
        .history-panel h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        
        #historyList {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 14px;
            direction: ltr;
            text-align: left;
        }
        
        #historyList li {
            padding: 5px 0;
            border-bottom: 1px solid #dcdde1;
        }

        @keyframes pulse-btn {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
    </style>
</head>
<body>

<div class="calculator">
    
    <!-- واجهة الروبوت -->
    <div class="robot-container">
        <div class="robot" id="robotFace">
            <div class="robot-eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="robot-mouth"></div>
        </div>
    </div>

    <input type="text" id="display" disabled placeholder="0">
    <div id="speechBox">الكلام اللي هتقوله هيظهر هنا...</div>
    
    <div class="buttons">
        <button class="mic-btn" id="micBtn" onclick="startListening()">🎤 اضغط وتحدث</button>
        
        <button class="clear" data-val="C" onclick="clearDisplay()">C</button>
        <button class="operator" data-val="/" onclick="appendValue('/')">/</button>
        <button class="operator" data-val="*" onclick="appendValue('*')">*</button>
        
        <button data-val="7" onclick="appendValue('7')">7</button>
        <button data-val="8" onclick="appendValue('8')">8</button>
        <button data-val="9" onclick="appendValue('9')">9</button>
        <button class="operator" data-val="-" onclick="appendValue('-')">-</button>
        
        <button data-val="4" onclick="appendValue('4')">4</button>
        <button data-val="5" onclick="appendValue('5')">5</button>
        <button data-val="6" onclick="appendValue('6')">6</button>
        <button class="operator" data-val="+" onclick="appendValue('+')">+</button>
        
        <button data-val="1" onclick="appendValue('1')">1</button>
        <button data-val="2" onclick="appendValue('2')">2</button>
        <button data-val="3" onclick="appendValue('3')">3</button>
        
        <button data-val="0" onclick="appendValue('0')">0</button>
        <button class="equal" data-val="=" onclick="calculate()">=</button>
    </div>
</div>

<div class="history-panel">
    <h4>📜 سجل العمليات</h4>
    <ul id="historyList"></ul>
</div>

<script>
    const display = document.getElementById('display');
    const micBtn = document.getElementById('micBtn');
    const speechBox = document.getElementById('speechBox');
    const historyList = document.getElementById('historyList');
    const robotFace = document.getElementById('robotFace');
    let isCalculated = false; 

    const voiceMap = {
        'صفر': '0', '0': '0',
        'واحد': '1', '1': '1',
        'اثنين': '2', 'اتنين': '2', '2': '2',
        'ثلاثة': '3', 'تلاته': '3', 'تلاتة': '3', '3': '3',
        'أربعة': '4', 'اربعه': '4', '4': '4',
        'خمسة': '5', 'خمسه': '5', '5': '5',
        'ستة': '6', 'سته': '6', '6': '6',
        'سبعة': '7', 'سبعه': '7', '7': '7',
        'ثمانية': '8', 'تمانيه': '8', '8': '8',
        'تسعة': '9', 'تسعه': '9', '9': '9',
        'زائد': '+', 'جمع': '+', '+': '+', 'و': '+',
        'ناقص': '-', 'طرح': '-', '-': '-',
        'في': '*', 'ضرب': '*', '*': '*', 'x': '*', 'X': '*',
        'على': '/', 'قسمه': '/', 'قسمة': '/', '/': '/',
        'يساوي': '=', 'النتيجه': '=', 'النتيجة': '=', '=': '=',
        'مسح': 'C', 'امسح': 'C', 'حذف': 'C', 'c': 'C', 'C': 'C'
    };

    function appendValue(val) {
        let stringVal = String(val);
        
        if (isCalculated) {
            if (['+', '-', '*', '/'].includes(stringVal) || stringVal === '**2') {
                let previousResult = display.value.split('=')[1].trim();
                display.value = previousResult + ' ' + stringVal + ' ';
            } else {
                display.value = stringVal;
            }
            isCalculated = false;
        } else {
            if (display.value === '0' || display.value === '') {
                display.value = stringVal;
            } else {
                if (['+', '-', '*', '/'].includes(stringVal) || stringVal === '**2') {
                    display.value += ' ' + stringVal + ' ';
                } else {
                    display.value += stringVal;
                }
            }
        }
        
        if(stringVal.length === 1) {
            setTimeout(() => flashButton(stringVal), 100);
        }
    }

    function clearDisplay() {
        display.value = '0';
        isCalculated = false;
        flashButton('C');
    }

    function calculate() {
        if (isCalculated) return; 
        try {
            let expression = display.value;
            let openP = (expression.match(/\(/g) || []).length;
            let closeP = (expression.match(/\)/g) || []).length;
            for(let i=0; i < openP - closeP; i++) expression += ')';

            let result = eval(expression); 
            
            if(result !== undefined && !isNaN(result)) {
                let finalEquation = expression + ' = ' + result;
                display.value = finalEquation;
                isCalculated = true;
                flashButton('=');
                speakResult(result); 
                addToHistory(finalEquation);
            }
        } catch (e) {
            display.value = 'خطأ في المعادلة';
            speakText("عفواً، المعادلة غير واضحة، يرجى إعادتها.");
            setTimeout(clearDisplay, 2500);
        }
    }

    function addToHistory(equation) {
        const li = document.createElement('li');
        li.textContent = equation;
        historyList.prepend(li);
    }

    function flashButton(val) {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            if (btn.getAttribute('data-val') === val) {
                btn.classList.add('active');
                setTimeout(() => btn.classList.remove('active'), 500);
            }
        });
    }

    // --- تفاعل الروبوت أثناء التحدث ---
    function speakText(text) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ar-SA'; 
        
        utterance.onstart = function() {
            robotFace.classList.add('speaking');
        };
        
        utterance.onend = function() {
            robotFace.classList.remove('speaking');
        };

        window.speechSynthesis.speak(utterance);
    }

    function speakResult(result) {
        const phrases = [
            "النتيجة هي ", 
            "حسبتها لك، تطلع ", 
            "النتيجة النهائية "
        ];
        const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
        speakText(randomPhrase + result);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = false;
        recognition.interimResults = false;

        // --- تفاعل الروبوت أثناء الاستماع ---
        recognition.onstart = function() {
            micBtn.classList.add('listening-btn');
            robotFace.classList.add('listening'); // تشغيل حالة الاستماع للروبوت
            micBtn.innerText = "🎤 جاري الاستماع...";
            speechBox.innerText = "أنا أسمعك الآن...";
            speechBox.style.color = "#f1c40f";
        };

        recognition.onresult = function(event) {
            let fullTranscript = event.results[0][0].transcript.trim();
            speechBox.innerHTML = `قلت: <span dir="ltr" style="display:inline-block; font-weight:bold; color:#f1c40f; margin: 0 5px;">${fullTranscript}</span>`;
            speechBox.style.color = "#1abc9c";

            if (fullTranscript.includes('وضع ليلي') || fullTranscript.includes('الوضع الليلي') || fullTranscript.includes('ضلمه')) {
                document.body.classList.add('dark-mode');
                speakText("تم تفعيل الوضع الليلي");
                return;
            }
            if (fullTranscript.includes('وضع عادي') || fullTranscript.includes('الوضع العادي') || fullTranscript.includes('نور')) {
                document.body.classList.remove('dark-mode');
                speakText("تم تفعيل الوضع العادي");
                return;
            }
            if (fullTranscript.includes('امسح السجل') || fullTranscript.includes('نظف السجل')) {
                historyList.innerHTML = '';
                speakText("تم مسح السجل بنجاح");
                return;
            }

            fullTranscript = fullTranscript.replace(/في المية/g, '/100')
                                           .replace(/بالمية/g, '/100')
                                           .replace(/في المائه/g, '/100')
                                           .replace(/جذر/g, 'Math.sqrt(')
                                           .replace(/تربيع/g, '**2');

            fullTranscript = fullTranscript.replace(/\+/g, ' + ')
                                           .replace(/-/g, ' - ')
                                           .replace(/\*/g, ' * ')
                                           .replace(/\//g, ' / ')
                                           .replace(/=/g, ' = ')
                                           .replace(/x/gi, ' * ')
                                           .replace(/\s+/g, ' ').trim();
            
            const transcriptWords = fullTranscript.split(' ');
            let totalDelay = 0;
            
            transcriptWords.forEach((word, index) => {
                totalDelay = index * 600; 
                setTimeout(() => {
                    let mappedValue = voiceMap[word];
                    
                    if (!mappedValue && word === 'Math.sqrt(') mappedValue = word;
                    if (!mappedValue && word === '**2') mappedValue = word;
                    if (!mappedValue && word === '/100') mappedValue = word;
                    if (!mappedValue && !isNaN(word) && word.trim() !== '') mappedValue = word;

                    if (mappedValue) {
                        if (mappedValue === '=') calculate();
                        else if (mappedValue === 'C') clearDisplay();
                        else appendValue(mappedValue);
                    }
                }, totalDelay); 
            });

            setTimeout(() => {
                if (!isCalculated && display.value !== '0' && display.value.trim() !== '') {
                    let trimmedDisplay = display.value.trim();
                    let lastChar = trimmedDisplay.charAt(trimmedDisplay.length - 1);
                    
                    if (!['+', '-', '*', '/'].includes(lastChar) && trimmedDisplay !== 'Math.sqrt(') {
                        calculate();
                    }
                }
            }, totalDelay + 1500); 
        };

        recognition.onerror = function(event) {
            speechBox.innerText = `خطأ: ${event.error}`;
            speechBox.style.color = "#e74c3c";
            robotFace.classList.remove('listening');
        };

        // --- إنهاء تفاعل الروبوت بعد إغلاق المايك ---
        recognition.onend = function() {
            micBtn.classList.remove('listening-btn');
            robotFace.classList.remove('listening'); // إيقاف حالة الاستماع للروبوت
            micBtn.innerText = "🎤 اضغط وتحدث";
        };

        window.startListening = function() {
            recognition.start();
        };
    } else {
        micBtn.innerText = "المتصفح لا يدعم الصوت";
        speechBox.innerText = "يرجى استخدام متصفح Google Chrome";
        micBtn.disabled = true;
    }
</script>

</body>
</html>
