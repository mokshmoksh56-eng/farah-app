<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa proo - الإدارة والتقارير</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --border-rad: 12px;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --input-border: #475569;
            --dark: #334155;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 10px; 
            color: var(--text-main); 
        }

        .container { 
            max-width: 100%; 
            margin: auto; 
            padding-bottom: 20px;
        }
        
        .header { 
            text-align: center; 
            margin-bottom: 15px; 
            background: var(--card-bg);
            padding: 12px;
            border-radius: var(--border-rad);
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            position: relative;
        }
        
        #theme-toggle {
            position: absolute;
            left: 15px;
            top: 15px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
        }

        h1 { margin: 0 0 2px 0; font-size: 22px; font-weight: 800; color: var(--primary); }
        p.subtitle { color: var(--text-muted); font-size: 12px; margin: 0; font-weight: 600; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 5px; border-radius: var(--border-rad); text-align: center; }
        .stat-value { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
        .stat-title { font-size: 10px; font-weight: 700; color: var(--text-muted); }
        .val-total { color: var(--primary); }
        .val-done { color: var(--success); }
        .val-pending { color: var(--warning); }

        .report-section { background: var(--card-bg); padding: 12px; border-radius: var(--border-rad); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .report-header { font-size: 14px; font-weight: 800; margin-bottom: 10px; color: var(--text-main); display: flex; align-items: center; gap: 5px;}
        .report-controls { display: flex; flex-direction: column; gap: 8px; }
        .report-row { display: flex; gap: 8px; }
        
        select, input[type="text"] { padding: 10px; font-size: 13px; border-radius: 8px; border: 1px solid var(--input-border); font-family: 'Cairo', sans-serif; font-weight: 600; width: 100%; background: var(--input-bg); color: var(--text-main); }
        select:focus, input[type="text"]:focus { border-color: var(--primary); outline: none; background: var(--card-bg);}
        .btn-report { background: var(--dark); color: white; padding: 10px; font-size: 13px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; font-family: 'Cairo', sans-serif; width: 100%; white-space: nowrap; }

        .controls { background: var(--card-bg); padding: 12px; border-radius: var(--border-rad); margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px; }
        
        /* أزرار الإدخال العلوية (تسجيل وصورة) */
        .top-actions { display: flex; gap: 8px; }
        
        #start-btn, .upload-btn { 
            flex: 1; padding: 12px; font-size: 13px; border-radius: 8px; cursor: pointer; 
            font-weight: 800; font-family: 'Cairo', sans-serif; text-align: center; border: 1px solid;
            display: flex; justify-content: center; align-items: center; gap: 5px;
        }
        
        #start-btn { background: #eff6ff; color: var(--primary); border-color: #bfdbfe; }
        body.dark-mode #start-btn { background: #1e3a8a; border-color: #1e40af; color: #93c5fd; }
        #start-btn.recording { background: #fef2f2; border-color: #fecaca; color: var(--danger); animation: pulse 1.5s infinite; }
        body.dark-mode #start-btn.recording { background: #7f1d1d; border-color: #991b1b; color: #fca5a5; }

        .upload-btn { background: #f5f3ff; color: #6d28d9; border-color: #ede9fe; }
        body.dark-mode .upload-btn { background: #4c1d95; color: #ddd6fe; border-color: #5b21b6; }
        
        /* معاينة الصورة قبل الحفظ */
        #image-preview-container { display: none; position: relative; width: 80px; margin: 0 auto; }
        #preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid var(--success); }
        #remove-img-btn { position: absolute; top: -8px; right: -8px; background: var(--danger); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 10px; cursor: pointer; font-weight: bold; }

        textarea { padding: 10px; font-size: 14px; border-radius: 8px; border: 1px solid var(--input-border); background-color: var(--input-bg); color: var(--text-main); resize: none; min-height: 50px; width: 100%; font-family: 'Cairo', sans-serif; font-weight: 600; overflow: hidden; }
        textarea:focus { background: var(--card-bg); border-color: var(--primary); outline: none; }
        
        #save-btn { background: var(--success); color: white; padding: 12px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: 800; font-family: 'Cairo', sans-serif; width: 100%; }

        .section-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        #clear-filter-btn { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; padding: 4px 10px; border-radius: 6px; font-family: 'Cairo'; cursor: pointer; font-weight: 700; font-size: 12px; }
        body.dark-mode #clear-filter-btn { background: #7f1d1d; border-color: #991b1b; color: #fca5a5; }
        
        .list-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

        .task-card { border-radius: 12px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(0,0,0,0.05); }
        body.dark-mode .task-card { background-color: var(--card-bg) !important; border-color: var(--border-color); }
        .task-card.completed { opacity: 0.6; filter: grayscale(80%); }

        .card-content { padding: 10px; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        .date-pill { background: rgba(255, 255, 255, 0.9); color: #333; padding: 4px; border-radius: 4px; font-size: 10px; font-weight: 700; width: 100%; text-align: center; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        body.dark-mode .date-pill { background: rgba(0, 0, 0, 0.3); color: #f8fafc; }

        /* صورة المهمة داخل الكارت */
        .task-image { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(0,0,0,0.1); }

        .tags-container { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; width: 100%; }
        .badge { background: rgba(255, 255, 255, 0.7); color: #0f172a; padding: 2px 8px; border-radius: 6px; font-weight: 800; font-size: 10px; border: 1px solid rgba(0,0,0,0.1); }
        body.dark-mode .badge { background: #334155; color: #f8fafc; border-color: #475569; }

        .ai-tag { padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; }
        .tag-urgent { background: #fee2e2; color: var(--danger); }
        .tag-measure { background: #e0e7ff; color: #4f46e5; }
        .tag-money { background: #d1fae5; color: #059669; }
        body.dark-mode .tag-urgent { background: #7f1d1d; color: #fca5a5; }
        body.dark-mode .tag-measure { background: #312e81; color: #a5b4fc; }
        body.dark-mode .tag-money { background: #064e3b; color: #6ee7b7; }

        .task-text { font-size: 14px; line-height: 1.6; font-weight: 800; color: #000; text-align: center; margin: auto 0; white-space: pre-wrap; word-wrap: break-word; width: 100%; }
        body.dark-mode .task-text { color: #f8fafc; }
        .task-card.completed .task-text { text-decoration: line-through; }

        .card-footer { background: rgba(255, 255, 255, 0.85); padding: 8px; display: flex; justify-content: space-around; align-items: center; }
        body.dark-mode .card-footer { background: rgba(0, 0, 0, 0.2); border-top: 1px solid rgba(255,255,255,0.05); }

        .icon-btn { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; width: 32px; height: 32px; display: flex; justify-content: center; align-items: center; font-size: 14px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        body.dark-mode .icon-btn { background: #1e293b; border-color: #334155; color: #fff; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.98); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button id="theme-toggle" title="تغيير المظهر">🌙</button>
        <h1>Azemaa proo 📊</h1>
        <p class="subtitle">نظام الإدارة</p>
    </div>
    
    <div class="report-section">
        <div class="report-header">📑 تقرير سريع</div>
        <div class="report-controls">
            <input type="text" id="report-query" placeholder="ابحث باسم أو كلمة...">
            <div class="report-row">
                <select id="report-year"></select>
                <button class="btn-report" onclick="generateReport()">بحث 🔍</button>
            </div>
        </div>
        
        <div id="custom-report-stats" class="dashboard" style="display: none;">
            <div class="stat-card"><div class="stat-value val-total" id="rep-total">0</div><div class="stat-title">الكل</div></div>
            <div class="stat-card"><div class="stat-value val-done" id="rep-done">0</div><div class="stat-title">أنجز</div></div>
            <div class="stat-card"><div class="stat-value val-pending" id="rep-pending">0</div><div class="stat-title">متبقي</div></div>
        </div>
    </div>

    <div class="controls">
        <div class="top-actions">
            <button id="start-btn">🎙️ تسجيل</button>
            <label for="image-upload" class="upload-btn">📷 إضافة صورة</label>
            <input type="file" id="image-upload" accept="image/*" style="display:none;">
        </div>
        
        <!-- مساحة عرض الصورة المصغرة قبل الحفظ -->
        <div id="image-preview-container">
            <img id="preview-img" src="">
            <button id="remove-img-btn" onclick="clearSelectedImage()">✖</button>
        </div>

        <textarea id="note-box" placeholder="اكتب الملاحظة هنا..." rows="2"></textarea>
        <button id="save-btn">💾 حفظ المهمة</button>
    </div>

    <div class="section-title">
        <span id="list-title">📋 المهام الحالية</span>
        <button id="clear-filter-btn" style="display:none;" onclick="clearReport()">❌ إلغاء</button>
    </div>
    
    <div id="tasks-list" class="list-container"></div>
</div>

<script>
    const themeToggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('azemaaTheme');

    if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
    }

    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        let theme = 'light';
        if (document.body.classList.contains('dark-mode')) {
            theme = 'dark';
            themeToggle.textContent = '☀️';
        } else {
            themeToggle.textContent = '🌙';
        }
        localStorage.setItem('azemaaTheme', theme);
    });

    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    let notesData = JSON.parse(localStorage.getItem('azemaaProAI')) || [];
    let currentViewData = notesData; 
    let currentSelectedImageData = null; // متغير لحفظ بيانات الصورة الحالية

    const cardColors = ['#fdf196', '#fce1cb', '#b8f4f9', '#c1f3c9', '#e6dff9', '#f9d2d7'];
    const yearSelect = document.getElementById('report-year');
    const currentYear = new Date().getFullYear().toString();

    for (let y = 2026; y <= 2056; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        if (y.toString() === currentYear || (y === 2026 && currentYear < 2026)) option.selected = true;
        yearSelect.appendChild(option);
    }

    const noteBox = document.getElementById('note-box');
    const startBtn = document.getElementById('start-btn');
    const saveBtn = document.getElementById('save-btn');
    
    // --- كود معالجة الصور ---
    const imageUpload = document.getElementById('image-upload');
    const previewContainer = document.getElementById('image-preview-container');
    const previewImg = document.getElementById('preview-img');

    imageUpload.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                // ضغط الصورة باستخدام Canvas لتوفير مساحة LocalStorage
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; // أقصى عرض للصورة
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // تحويل الصورة لبيانات Base64 بحجم صغير وجودة مقبولة
                    currentSelectedImageData = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    // إظهار المعاينة
                    previewImg.src = currentSelectedImageData;
                    previewContainer.style.display = 'block';
                }
            };
        }
    });

    function clearSelectedImage() {
        currentSelectedImageData = null;
        imageUpload.value = '';
        previewContainer.style.display = 'none';
        previewImg.src = '';
    }
    // ----------------------

    noteBox.addEventListener('input', function() {
        this.style.height = 'auto'; 
        this.style.height = (this.scrollHeight) + 'px'; 
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition; let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = true;
        recognition.interimResults = false; 

        recognition.onstart = () => { isRecording = true; startBtn.innerHTML = "🛑 استماع..."; startBtn.classList.add("recording"); };
        recognition.onresult = (event) => {
            let finalText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) { finalText += event.results[i][0].transcript + " "; }
            if(finalText.trim() !== "") { noteBox.value += finalText; noteBox.style.height = 'auto'; noteBox.style.height = (noteBox.scrollHeight) + 'px'; }
        };
        recognition.onend = () => { isRecording = false; startBtn.innerHTML = "🎙️ تسجيل"; startBtn.classList.remove("recording"); };
        startBtn.addEventListener('click', (e) => { e.preventDefault(); if (!isRecording) try { recognition.start(); } catch(err) {} else recognition.stop(); });
    }

    function analyzeText(text) {
        let tags = [];
        if (/(عاجل|بسرعة|ضروري|فورا|حالا)/.test(text)) tags.push({ type: 'urgent', html: '<span class="ai-tag tag-urgent">🔥 عاجل</span>' });
        if (/(متر|سم|ملي|مقاس|طول|عرض|درفة|قطاع|مفصلة|زجاج|فايبر)/.test(text)) tags.push({ type: 'measure', html: '<span class="ai-tag tag-measure">📏 مقاسات</span>' });
        if (/(جنيه|الف|حساب|عربون|دفع|باقي|تكلفة|فلوس)/.test(text)) tags.push({ type: 'money', html: '<span class="ai-tag tag-money">💰 ماليات</span>' });
        return tags;
    }

    saveBtn.addEventListener('click', () => {
        const text = noteBox.value.trim();
        // التحقق من وجود نص أو صورة على الأقل
        if (!text && !currentSelectedImageData) return alert("برجاء التحدث، الكتابة، أو إرفاق صورة أولاً!");

        let assignedPerson = "عام";
        for (let name of teamMembers) { if (text.includes(name)) { assignedPerson = name; break; } }

        const tags = analyzeText(text);
        const now = new Date();
        const year = now.getFullYear().toString();
        const datePart = now.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');
        const timePart = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        const fullDateTime = `${timePart} | ${datePart}`;

        const newNote = { 
            id: Date.now(), 
            text: text || "مرفق صورة", // في حال أرفق صورة فقط
            person: assignedPerson,
            datetime: fullDateTime,
            year: year,
            status: 'pending',
            tags: tags,
            imageData: currentSelectedImageData // حفظ الصورة
        };
        
        try {
            notesData.unshift(newNote);
            localStorage.setItem('azemaaProAI', JSON.stringify(notesData));
        } catch(e) {
            alert("مساحة التخزين ممتلئة! يرجى حذف بعض المهام القديمة.");
            notesData.shift(); // التراجع عن الإضافة
            return;
        }
        
        noteBox.value = "";
        noteBox.style.height = 'auto'; 
        clearSelectedImage(); // إخفاء ومسح الصورة بعد الحفظ
        clearReport(); 
    });

    function toggleStatus(id) {
        let note = notesData.find(n => n.id === id);
        if (note) { note.status = note.status === 'completed' ? 'pending' : 'completed'; localStorage.setItem('azemaaProAI', JSON.stringify(notesData)); renderApp(currentViewData); }
    }

    function editNote(id) {
        let note = notesData.find(n => n.id === id);
        if (note) {
            let newText = prompt("قم بتعديل تفاصيل المهمة:", note.text);
            if (newText !== null && newText.trim() !== "") {
                note.text = newText.trim();
                let assignedPerson = "عام";
                for (let name of teamMembers) { if (note.text.includes(name)) { assignedPerson = name; break; } }
                note.person = assignedPerson;
                note.tags = analyzeText(note.text);
                localStorage.setItem('azemaaProAI', JSON.stringify(notesData));
                renderApp(currentViewData);
            }
        }
    }

    function deleteNote(id) {
        if(confirm("هل أنت متأكد من حذف هذه المهمة؟")) {
            notesData = notesData.filter(n => n.id !== id);
            localStorage.setItem('azemaaProAI', JSON.stringify(notesData));
            currentViewData = currentViewData.filter(n => n.id !== id);
            renderApp(currentViewData);
        }
    }

    function generateReport() {
        const query = document.getElementById('report-query').value.trim();
        const yearQuery = document.getElementById('report-year').value;
        currentViewData = notesData.filter(n => {
            const matchYear = n.year === yearQuery || (n.datetime && n.datetime.includes(yearQuery));
            const matchName = query === "" || n.person.includes(query) || n.text.includes(query);
            return matchYear && matchName;
        });
        const total = currentViewData.length; const done = currentViewData.filter(n => n.status === 'completed').length;
        document.getElementById('rep-total').innerText = total; document.getElementById('rep-done').innerText = done; document.getElementById('rep-pending').innerText = total - done;
        document.getElementById('custom-report-stats').style.display = 'grid';
        document.getElementById('list-title').innerText = `📋 تقرير: ${query || 'الكل'} (${yearQuery})`;
        document.getElementById('clear-filter-btn').style.display = 'inline-block';
        renderApp(currentViewData);
    }

    function clearReport() {
        document.getElementById('report-query').value = "";
        document.getElementById('report-year').value = (new Date().getFullYear() >= 2026) ? new Date().getFullYear() : "2026";
        document.getElementById('custom-report-stats').style.display = 'none';
        document.getElementById('list-title').innerText = "📋 المهام الحالية";
        document.getElementById('clear-filter-btn').style.display = 'none';
        currentViewData = notesData;
        renderApp(currentViewData);
    }

    function renderApp(dataToRender) {
        const tasksList = document.getElementById('tasks-list');
        tasksList.innerHTML = ""; 
        if (dataToRender.length === 0) { tasksList.innerHTML = "<p style='text-align:center; grid-column: 1 / -1; color:var(--text-muted); font-size:14px; padding:20px;'>لا توجد مهام...</p>"; return; }

        dataToRender.forEach((note, index) => {
            const isDone = note.status === 'completed';
            const tagsHTML = (note.tags || []).map(t => t.html).join('');
            const bgColor = cardColors[index % cardColors.length];
            
            // تحقق مما إذا كانت هناك صورة محفوظة
            const imageHTML = note.imageData ? `<img src="${note.imageData}" class="task-image" alt="مرفق">` : '';

            const cardHTML = `
                <div class="task-card ${isDone ? 'completed' : ''}" style="background-color: ${bgColor};">
                    <div class="card-content">
                        <div class="date-pill">${note.datetime} 📅</div>
                        ${imageHTML}
                        <div class="tags-container">
                            <span class="badge">${note.person}</span>
                            ${tagsHTML}
                        </div>
                        <div class="task-text">${note.text}</div>
                    </div>
                    <div class="card-footer">
                        <button class="icon-btn" onclick="deleteNote(${note.id})" title="حذف المهمة">🗑️</button>
                        <button class="icon-btn" onclick="toggleStatus(${note.id})" title="تم الإنجاز">${isDone ? '↩️' : '✅'}</button>
                        <button class="icon-btn" onclick="editNote(${note.id})" title="تعديل المهمة">✏️</button>
                    </div>
                </div>
            `;
            tasksList.innerHTML += cardHTML;
        });
    }

    clearReport();
</script>

</body>
</html>
