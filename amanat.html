<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أقبض | أونلاين</title>
    
    <!-- مكتبة التصميم والخطوط -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات الخريطة (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* دمج الخلفية البرمجية ثلاثية الأبعاد (بدون صور لسرعة التطبيق) */
        body { 
            font-family: 'Cairo', sans-serif; 
            overflow-x: hidden; 
            color: white; 
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.8) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.5) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(17, 24, 39, 1) 0px, transparent 50%);
            background-attachment: fixed;
            background-size: cover;
        }
        
        /* البطاقة الزجاجية */
        .glass-card { 
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        
        /* حركات التنقل بين الشاشات */
        .fade-enter { opacity: 0; transform: translateY(15px); transition: all 0.4s ease-out; pointer-events: none; position: absolute; width: 100%; visibility: hidden; }
        .fade-enter-active { opacity: 1; transform: translateY(0); pointer-events: auto; position: relative; visibility: visible; }
        
        ::placeholder { color: rgba(255, 255, 255, 0.5) !important; }
        .leaflet-container { font-family: 'Cairo', sans-serif !important; z-index: 1; color: black; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">

    <div class="w-full max-w-md glass-card rounded-3xl p-6 sm:p-8 overflow-hidden relative min-h-[500px]">
        
        <!-- اللوجو -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 border border-white/30 rounded-2xl shadow-lg transform rotate-3 mb-3">
                <span class="text-3xl transform -rotate-3 text-white shadow-sm">💸</span>
            </div>
            <h1 class="text-3xl font-black text-white tracking-tight drop-shadow-md">أقبض</h1>
        </div>

        <!-- ============================================== -->
        <!-- 1. شاشة اختيار الدور -->
        <!-- ============================================== -->
        <div id="roleView" class="fade-enter-active space-y-4">
            <h2 class="text-lg font-extrabold text-white mb-4 text-center drop-shadow-sm">حدد طريقة دخولك للتطبيق:</h2>
            <button onclick="showView('customerView')" class="w-full group bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl p-4 flex items-center gap-4 transition-all active:scale-95 shadow-lg">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform shadow-inner">🏃‍♂️</div>
                <div class="text-right flex-1">
                    <h3 class="text-lg font-black text-white">أنا عميل (طالب كاش)</h3>
                    <p class="text-[11px] text-blue-200 font-bold mt-1">محتاج سيولة نقدية فورية</p>
                </div>
            </button>
            <button onclick="showView('merchantLoginView')" class="w-full group bg-white/10 hover:bg-white/20 border border-white/20 rounded-2xl p-4 flex items-center gap-4 transition-all active:scale-95 shadow-lg">
                <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl group-hover:scale-110 transition-transform shadow-inner">🏪</div>
                <div class="text-right flex-1">
                    <h3 class="text-lg font-black text-white">أنا تاجر (مزود سيولة)</h3>
                    <p class="text-[11px] text-blue-200 font-bold mt-1">لدي كاش، واستقبال طلبات</p>
                </div>
            </button>
        </div>

        <!-- ============================================== -->
        <!-- 2. شاشة العميل (طلب الكاش) -->
        <!-- ============================================== -->
        <div id="customerView" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button type="button" onclick="goBack()" class="w-8 h-8 bg-white/20 border border-white/30 rounded-full flex items-center justify-center hover:bg-white/30 shadow-md">&rarr;</button>
                <h2 class="text-xl font-black text-white drop-shadow-sm">طلب الكاش</h2>
            </div>
            <form onsubmit="window.sendCashRequest(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-white mb-1 drop-shadow-sm">رقم الهاتف</label>
                    <input type="tel" id="customerPhone" required placeholder="01xxxxxxxx" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl outline-none text-white font-black tracking-widest text-left shadow-inner" dir="ltr">
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-1 drop-shadow-sm">المبلغ المطلوب (كاش)</label>
                    <input type="number" id="customerAmount" required placeholder="مثال: 1000" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl outline-none text-white text-xl font-black text-center shadow-inner">
                </div>
                <div class="bg-white/10 border border-white/20 p-3 rounded-xl mt-2 shadow-inner">
                    <label class="block text-sm font-bold text-white mb-2">مكان استلام الكاش</label>
                    <button type="button" onclick="openMap('customer')" class="w-full bg-blue-600/80 hover:bg-blue-500 text-white font-extrabold py-2 rounded-lg text-sm flex justify-center items-center gap-2 active:scale-95 mb-2 shadow-lg border border-blue-400">
                        <span>📍</span> تحديد من الخريطة
                    </button>
                    <input type="text" id="custAddressDisplay" readonly placeholder="لم يتم تحديد الموقع..." class="w-full px-2 py-2 bg-black/30 border border-white/10 rounded-lg text-[11px] font-bold text-white text-center">
                </div>
                <button type="submit" id="btnCustomerSubmit" class="w-full bg-white text-blue-900 font-extrabold py-3.5 rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.3)] active:scale-95 text-lg mt-2 transition-all">
                    إرسال الطلب أونلاين 🚀
                </button>
                <div id="customerStatusMsg" class="hidden text-center p-3 rounded-xl bg-blue-900/60 border border-blue-400 mt-2 text-sm font-bold text-blue-100 animate-pulse shadow-inner">
                    ⏳ جاري البحث عن تاجر قريب...
                </div>
            </form>
        </div>

        <!-- ============================================== -->
        <!-- 3. شاشة دخول التاجر -->
        <!-- ============================================== -->
        <div id="merchantLoginView" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button type="button" onclick="goBack()" class="w-8 h-8 bg-white/20 border border-white/30 rounded-full flex items-center justify-center hover:bg-white/30 shadow-md">&rarr;</button>
                <h2 class="text-xl font-black text-white drop-shadow-sm">دخول التاجر</h2>
            </div>
            <form onsubmit="window.loginMerchant(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-white mb-2 drop-shadow-sm">رقم هاتف المتجر</label>
                    <input type="tel" required placeholder="01xxxxxxxx" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl outline-none text-white font-black tracking-widest text-left shadow-inner" dir="ltr">
                </div>
                <div>
                    <label class="block text-sm font-bold text-white mb-2 drop-shadow-sm">الرقم السري (PIN)</label>
                    <input type="password" required placeholder="****" maxlength="4" class="w-full px-4 py-3 bg-white/10 border border-white/30 rounded-xl outline-none text-white text-center text-2xl font-black tracking-widest shadow-inner" dir="ltr">
                </div>
                <button type="submit" id="btnLoginMerchant" class="w-full bg-white text-blue-900 font-extrabold py-3.5 rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.3)] active:scale-95 text-lg transition-all">
                    دخول للوحة التحكم 🏪
                </button>
            </form>
            <div class="mt-4 text-center border-t border-white/20 pt-4">
                <p class="text-sm text-blue-200 font-bold mb-2">ليس لديك حساب تاجر؟</p>
                <button type="button" onclick="showView('merchantRegisterView')" class="text-white font-black underline hover:text-blue-300 drop-shadow-sm">إنشاء حساب تاجر جديد</button>
            </div>
        </div>

        <!-- ============================================== -->
        <!-- 4. شاشة تسجيل تاجر جديد -->
        <!-- ============================================== -->
        <div id="merchantRegisterView" class="fade-enter">
            <div class="flex items-center gap-3 mb-6">
                <button type="button" onclick="showView('merchantLoginView')" class="w-8 h-8 bg-white/20 border border-white/30 rounded-full flex items-center justify-center hover:bg-white/30 shadow-md">&rarr;</button>
                <h2 class="text-xl font-black text-white drop-shadow-sm">تسجيل تاجر جديد</h2>
            </div>
            <form onsubmit="window.registerMerchant(event)" class="space-y-3">
                <div>
                    <label class="block text-[13px] font-bold text-white mb-1 drop-shadow-sm">رقم التليفون</label>
                    <input type="tel" id="regPhone" required placeholder="01xxxxxxxx" class="w-full px-3 py-2 bg-white/10 border border-white/30 rounded-xl outline-none font-black tracking-widest text-left shadow-inner" dir="ltr">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[13px] font-bold text-white mb-1 drop-shadow-sm">الرقم السري</label>
                        <input type="password" id="regPin" required placeholder="****" maxlength="4" class="w-full px-3 py-2 bg-white/10 border border-white/30 rounded-xl outline-none text-center font-black tracking-widest shadow-inner" dir="ltr">
                    </div>
                    <div>
                        <label class="block text-[13px] font-bold text-white mb-1 drop-shadow-sm">تأكيد السري</label>
                        <input type="password" id="regPinConfirm" required placeholder="****" maxlength="4" class="w-full px-3 py-2 bg-white/10 border border-white/30 rounded-xl outline-none text-center font-black tracking-widest shadow-inner" dir="ltr">
                    </div>
                </div>
                <div class="bg-white/10 border border-white/20 p-3 rounded-xl shadow-inner">
                    <label class="block text-[13px] font-bold text-white mb-2 drop-shadow-sm">مكان المتجر (GPS)</label>
                    <button type="button" onclick="openMap('merchant')" class="w-full bg-blue-600/80 hover:bg-blue-500 text-white font-extrabold py-2 rounded-lg active:scale-95 text-xs flex justify-center items-center gap-2 mb-2 shadow-lg border border-blue-400">
                        <span>📍</span> تحديد موقع المتجر من الخريطة
                    </button>
                    <input type="text" id="merchantAddressDisplay" readonly placeholder="لم يتم تحديد الموقع..." class="w-full px-2 py-1.5 bg-black/30 border border-white/10 rounded-lg text-[10px] font-bold text-center text-white">
                </div>
                <button type="submit" id="btnRegMerchant" class="w-full bg-white text-blue-900 font-extrabold py-3.5 rounded-xl shadow-[0_0_15px_rgba(255,255,255,0.3)] active:scale-95 text-base mt-2 transition-all">
                    تأكيد وإنشاء الحساب ✔️
                </button>
            </form>
        </div>

        <!-- ============================================== -->
        <!-- 5. لوحة تحكم التاجر (أونلاين) -->
        <!-- ============================================== -->
        <div id="merchantDashboardView" class="fade-enter">
            <div class="flex items-center justify-between mb-4 border-b border-white/20 pb-4">
                <div class="flex items-center gap-2">
                    <button type="button" onclick="goBack()" class="w-8 h-8 bg-red-500/20 text-red-200 rounded-full flex items-center justify-center hover:bg-red-500/40 text-xs shadow-md border border-red-500/30">🚪</button>
                    <h2 class="text-xl font-black text-white drop-shadow-sm">لوحة التاجر</h2>
                </div>
                <div class="text-center bg-black/30 px-3 py-1 rounded-lg border border-white/10 shadow-inner">
                    <p class="text-[10px] text-blue-200">السيولة المتاحة</p>
                    <p id="merchantBalanceDisplay" class="text-lg font-black text-green-400 drop-shadow-md">25,000 ج</p>
                </div>
            </div>
            
            <div class="bg-white/10 border border-white/20 rounded-xl p-3 mb-4 flex items-center gap-3 shadow-sm">
                <div class="w-3 h-3 bg-green-400 rounded-full animate-ping shadow-[0_0_10px_#4ade80]"></div>
                <p class="text-sm font-bold text-white drop-shadow-sm">أنت متصل وتستقبل الطلبات...</p>
            </div>

            <!-- حاوية الطلبات اللحظية -->
            <div id="liveRequestsContainer" class="space-y-3 h-[250px] overflow-y-auto pr-1">
                <div class="text-center py-10 text-white/50 text-sm font-bold bg-white/5 rounded-xl border border-white/10 shadow-inner">
                    لا توجد طلبات عملاء جديدة حالياً.
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================== -->
    <!-- نافذة الخريطة التفاعلية (Mapbox/Leaflet) -->
    <!-- ============================================== -->
    <div id="mapModal" class="hidden fixed inset-0 bg-black/80 flex justify-center items-center p-4 backdrop-blur-sm z-[99999]">
        <div class="bg-white rounded-3xl w-full max-w-lg p-4 flex flex-col h-[80vh] shadow-2xl">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-black text-gray-900">حدد الموقع 📍</h3>
                <button type="button" onclick="closeMapModal()" class="text-gray-500 text-3xl font-bold hover:text-red-500 transition-colors">&times;</button>
            </div>
            
            <div class="flex gap-2 mb-2">
                <input type="text" id="mapSearchInput" placeholder="ابحث عن مدينة أو شارع..." class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl font-bold outline-none text-sm text-black focus:ring-2 focus:ring-blue-500">
                <button type="button" onclick="searchOnMap()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold active:scale-95 text-sm shadow-md transition-colors">بحث</button>
            </div>

            <div class="flex-1 w-full relative flex flex-col z-0 rounded-xl overflow-hidden border border-gray-300 shadow-inner">
                <div id="leafletMap" class="flex-1 w-full z-0"></div>
                <button type="button" onclick="goToMyLocationOnMap()" class="absolute bottom-4 right-4 z-[400] w-12 h-12 bg-white text-blue-600 rounded-full shadow-xl flex justify-center items-center active:scale-95 text-2xl border border-gray-200 hover:bg-blue-50 transition-colors">🎯</button>
            </div>
            
            <div id="mapAddressPreview" class="mt-2 p-2 bg-blue-50 border border-blue-200 rounded-xl text-xs font-bold text-blue-800 text-center min-h-[40px] flex items-center justify-center">
                حرك الدبوس لتحديد المكان بدقة...
            </div>
            
            <button type="button" onclick="confirmMapSelection()" class="mt-2 w-full bg-blue-900 hover:bg-blue-800 text-white font-extrabold py-3 rounded-xl active:scale-95 text-sm shadow-lg transition-colors">
                تأكيد واختيار هذا الموقع ✔️
            </button>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- أكواد جافا سكريبت (UI و Mapbox) -->
    <!-- ============================================== -->
    <script>
        const MAPBOX_TOKEN = "pk.eyJ1IjoibW9rc2htb2tzaCIsImEiOiJjbXRyZXF5cXkwMWRhMnlzaDI0OXJiNXQ1In0.X30BmuAkJ69jOlicXZK53A";
        
        let mapInstance = null, mapMarker = null;
        let activeMapMode = ""; 
        let tempAddress = "", tempLat = null, tempLng = null;
        let finalCustLat = null, finalCustLng = null, finalCustAddress = "";
        let finalMerchLat = null, finalMerchLng = null, finalMerchAddress = "";

        function showView(viewId) {
            const views = ['roleView', 'customerView', 'merchantLoginView', 'merchantRegisterView', 'merchantDashboardView'];
            views.forEach(v => {
                document.getElementById(v).classList.remove('fade-enter-active');
                document.getElementById(v).classList.add('fade-enter');
            });
            setTimeout(() => {
                document.getElementById(viewId).classList.remove('fade-enter');
                document.getElementById(viewId).classList.add('fade-enter-active');
            }, 300);
        }

        function goBack() { showView('roleView'); }

        function openMap(mode) {
            activeMapMode = mode;
            document.getElementById('mapModal').classList.remove('hidden');
            
            if (!mapInstance) {
                mapInstance = L.map('leafletMap').setView([30.0444, 31.2357], 13);
                L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/256/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`, { maxZoom: 18 }).addTo(mapInstance);
                mapMarker = L.marker([30.0444, 31.2357], { draggable: true }).addTo(mapInstance);
                
                mapInstance.on('click', e => { mapMarker.setLatLng(e.latlng); updateMapAddress(e.latlng.lat, e.latlng.lng); });
                mapMarker.on('dragend', () => { let pos = mapMarker.getLatLng(); updateMapAddress(pos.lat, pos.lng); });
                goToMyLocationOnMap();
            }
            setTimeout(() => { mapInstance.invalidateSize(); }, 300);
        }

        function closeMapModal() { document.getElementById('mapModal').classList.add('hidden'); }

        function updateMapAddress(lat, lng) {
            document.getElementById('mapAddressPreview').innerHTML = "⏳ جاري تحليل العنوان...";
            fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${MAPBOX_TOKEN}&language=ar`)
            .then(res => res.json()).then(data => {
                if(data && data.features && data.features.length > 0) {
                    tempAddress = data.features[0].place_name_ar || data.features[0].place_name;
                    tempLat = lat; tempLng = lng;
                    document.getElementById('mapAddressPreview').innerHTML = tempAddress;
                }
            });
        }

        function searchOnMap() {
            const query = document.getElementById('mapSearchInput').value.trim();
            if(!query) return;
            document.getElementById('mapAddressPreview').innerHTML = "⏳ جاري البحث...";
            fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query + ' مصر')}.json?access_token=${MAPBOX_TOKEN}&language=ar&limit=1`)
            .then(res => res.json()).then(data => {
                if(data && data.features && data.features.length > 0) {
                    const lon = parseFloat(data.features[0].center[0]), lat = parseFloat(data.features[0].center[1]);
                    mapInstance.setView([lat, lon], 14); mapMarker.setLatLng([lat, lon]); updateMapAddress(lat, lon);
                } else { document.getElementById('mapAddressPreview').innerHTML = "❌ المكان غير موجود."; }
            });
        }

        function goToMyLocationOnMap() {
            if (navigator.geolocation) {
                document.getElementById('mapAddressPreview').innerHTML = "⏳ جاري تحديد موقعك (GPS)...";
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude, lng = pos.coords.longitude;
                    mapInstance.setView([lat, lng], 16); mapMarker.setLatLng([lat, lng]); updateMapAddress(lat, lng);
                }, () => alert("يرجى تفعيل الـ GPS في الهاتف وإعطاء صلاحية للمتصفح."), { enableHighAccuracy: true });
            }
        }

        function confirmMapSelection() {
            if(!tempLat) return alert("الرجاء تحديد موقع أولاً.");
            if(activeMapMode === 'customer') {
                finalCustLat = tempLat; finalCustLng = tempLng; finalCustAddress = tempAddress;
                document.getElementById('custAddressDisplay').value = tempAddress;
            } else if(activeMapMode === 'merchant') {
                finalMerchLat = tempLat; finalMerchLng = tempLng; finalMerchAddress = tempAddress;
                document.getElementById('merchantAddressDisplay').value = tempAddress;
            }
            closeMapModal();
        }
    </script>

    <!-- ============================================== -->
    <!-- أكواد Firebase (الأونلاين) -->
    <!-- ============================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU", 
            authDomain: "azemaa-proo.firebaseapp.com", 
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com", 
            projectId: "azemaa-proo", 
            storageBucket: "azemaa-proo.firebasestorage.app", 
            messagingSenderId: "787350492977", 
            appId: "1:787350492977:web:84061dcf31622fcb07c210" 
        };
        
        const app = initializeApp(firebaseConfig); 
        const db = getDatabase(app); 
        const auth = getAuth(app);
        
        signInAnonymously(auth);

        let merchantBalance = 25000; 

        // العميل
        window.sendCashRequest = function(e) {
            e.preventDefault();
            const phone = document.getElementById('customerPhone').value;
            const amount = document.getElementById('customerAmount').value;
            
            if(!finalCustLat || !finalCustAddress) return alert("الرجاء تحديد مكان استلام الكاش من الخريطة بالضغط على (تحديد من الخريطة).");

            const btn = document.getElementById('btnCustomerSubmit');
            const statusBox = document.getElementById('customerStatusMsg');
            
            btn.disabled = true; 
            btn.innerHTML = "⏳ جاري الإرسال للتجار...";
            btn.classList.add('opacity-70');
            
            const newReqRef = push(ref(db, 'eqbad_orders'));
            const reqId = newReqRef.key;
            
            set(newReqRef, {
                phone: phone,
                amount: amount,
                address: finalCustAddress,
                lat: finalCustLat,
                lng: finalCustLng,
                status: 'pending',
                timestamp: Date.now()
            }).then(() => {
                btn.classList.add('hidden');
                statusBox.classList.remove('hidden');
                
                onValue(ref(db, 'eqbad_orders/' + reqId), (snap) => {
                    if(snap.exists()) {
                        const reqData = snap.val();
                        if(reqData.status === 'accepted') {
                            statusBox.className = "text-center p-4 rounded-xl bg-green-500/30 border border-green-400 mt-4 text-sm font-bold text-white shadow-lg";
                            statusBox.innerHTML = "✅ تاجر قريب وافق على طلبك!<br>توجه للمتجر لاستلام الكاش.";
                        }
                    }
                });
            });
        };

        // التاجر
        window.loginMerchant = function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLoginMerchant');
            btn.innerHTML = "⏳ جاري الدخول...";
            setTimeout(() => {
                showView('merchantDashboardView');
                window.listenToOrders(); 
                btn.innerHTML = "دخول للوحة التحكم 🏪";
            }, 800);
        };

        window.registerMerchant = function(e) {
            e.preventDefault();
            const p1 = document.getElementById('regPin').value;
            const p2 = document.getElementById('regPinConfirm').value;
            if(p1 !== p2) return alert("الرقم السري وتأكيده غير متطابقين.");
            if(!finalMerchLat) return alert("يرجى تحديد موقع المتجر من الخريطة.");

            const btn = document.getElementById('btnRegMerchant');
            btn.innerHTML = "⏳ جاري إنشاء الحساب...";
            setTimeout(() => {
                showView('merchantDashboardView');
                window.listenToOrders();
                btn.innerHTML = "تأكيد وإنشاء الحساب ✔️";
            }, 1000);
        };

        // التاجر - استماع الطلبات
        window.listenToOrders = function() {
            document.getElementById('merchantBalanceDisplay').innerText = merchantBalance.toLocaleString() + " ج";
            
            onValue(ref(db, 'eqbad_orders'), (snapshot) => {
                const container = document.getElementById('liveRequestsContainer');
                let hasPending = false;
                let html = "";

                if(snapshot.exists()) {
                    const requests = [];
                    snapshot.forEach((child) => { requests.push({key: child.key, val: child.val()}); });
                    requests.reverse();

                    requests.forEach((reqObj) => {
                        const req = reqObj.val;
                        const reqKey = reqObj.key;
                        
                        if(req.status === 'pending') {
                            hasPending = true;
                            const timeAgo = Math.floor((Date.now() - req.timestamp) / 60000);
                            const timeTxt = timeAgo < 1 ? "الآن" : `منذ ${timeAgo} دقيقة`;

                            html += `
                            <div class="bg-white/10 border border-yellow-500/40 p-4 rounded-xl relative overflow-hidden shadow-md">
                                <div class="absolute top-0 right-0 bg-yellow-500 text-blue-900 text-[10px] font-black px-2 py-1 rounded-bl-lg shadow-sm">طلب جديد (${timeTxt})</div>
                                <p class="text-sm font-bold text-white mt-2 drop-shadow-sm">المبلغ: <span class="text-yellow-400 text-lg mx-1 drop-shadow-md">${req.amount}</span> ج.م</p>
                                <p class="text-[11px] text-gray-300 mt-1 mb-3 bg-black/30 p-2 rounded-lg border border-white/5">📍 ${req.address}</p>
                                <button onclick="acceptCustomerRequest('${reqKey}', ${req.amount})" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 hover:from-yellow-400 hover:to-yellow-300 text-blue-900 font-extrabold py-2.5 rounded-lg active:scale-95 text-sm transition-all shadow-md">
                                    تأكيد وتسليم الكاش 💵
                                </button>
                            </div>`;
                        }
                    });
                }

                if(hasPending) {
                    container.innerHTML = html;
                    if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
                } else {
                    container.innerHTML = `<div class="text-center py-10 text-white/50 text-sm font-bold bg-white/5 rounded-xl border border-white/10 shadow-inner">لا توجد طلبات عملاء جديدة حالياً.</div>`;
                }
            });
        };

        // التاجر - قبول الطلب
        window.acceptCustomerRequest = function(reqKey, amount) {
            if(amount > merchantBalance) return alert("رصيدك الحالي لا يكفي لتسليم هذا المبلغ!");
            
            if(confirm(`تأكيد تسليم ${amount} جنيه للعميل وخصمها من عهدتك؟`)) {
                update(ref(db, 'eqbad_orders/' + reqKey), {
                    status: 'accepted'
                }).then(() => {
                    merchantBalance -= amount;
                    document.getElementById('merchantBalanceDisplay').innerText = merchantBalance.toLocaleString() + " ج";
                    alert("تم تأكيد العملية بنجاح! تم إبلاغ العميل.");
                });
            }
        };
    </script>
</body>
</html>
