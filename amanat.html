<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشات البيتكوين | الرادار الذكي الآلي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 md:p-4 font-sans">
    
    <div class="max-w-[1800px] mx-auto space-y-6">
        
        <!-- ========================================== -->
        <!-- 🤖 رادار الانفجار السعري الآلي (AI Radar) -->
        <!-- ========================================== -->
        <div class="bg-slate-900 p-6 rounded-xl border-2 border-slate-700 shadow-2xl relative overflow-hidden">
            <div id="radarGlow" class="absolute inset-0 bg-slate-800/50 transition-colors duration-500"></div>
            
            <div class="relative z-10 flex flex-col lg:flex-row justify-between items-center gap-6">
                <!-- قسم الاستشعار الآلي -->
                <div class="w-full lg:w-1/3 space-y-3 text-center lg:text-right">
                    <h2 class="text-xl font-bold text-emerald-400 flex items-center justify-center lg:justify-start gap-2">
                        <span>🤖 الرادار الذكي (صائد السيولة)</span>
                    </h2>
                    <p class="text-slate-400 text-xs leading-relaxed">يقوم النظام برصد مناطق تراكم السيولة (قمم وقيعان حرجة) آلياً، ويقفل الرادار على الهدف الأقرب للانفجار.</p>
                    <div class="flex gap-2 justify-center lg:justify-start mt-2">
                        <button onclick="autoDetectLiquidity()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-6 py-2 rounded-lg text-sm transition shadow-lg hover:scale-105 active:scale-95 cursor-pointer flex items-center gap-2">
                            <span>🔍 استشعار أهداف الانفجار الآن</span>
                        </button>
                    </div>
                    <div class="flex justify-center lg:justify-start gap-4 text-xs font-mono mt-2 bg-slate-950 p-2 rounded border border-slate-800 inline-flex">
                        <span class="text-emerald-400">مقاومة: <span id="autoResTarget">--</span></span>
                        <span class="text-slate-600">|</span>
                        <span class="text-rose-400">دعم: <span id="autoSupTarget">--</span></span>
                    </div>
                </div>

                <!-- قسم السعر المباشر والهدف النشط -->
                <div class="w-full lg:w-1/3 flex flex-col items-center justify-center border-y lg:border-y-0 lg:border-x border-slate-700 py-4 lg:py-0">
                    <span class="text-slate-400 text-xs mb-1">السعر المباشر اللحظي</span>
                    <span id="liveTickerPrice" class="text-4xl font-mono font-bold text-white tracking-wider">الاتصال...</span>
                    <div class="mt-2 flex items-center gap-2 text-sm font-mono bg-slate-800 px-3 py-1 rounded-full border border-slate-700">
                        <span class="text-slate-400">الهدف المرجح كسره:</span>
                        <span id="displayTargetPrice" class="text-amber-400 font-bold animate-pulse">في انتظار المسح</span>
                    </div>
                </div>

                <!-- قسم حالة الضغط (شريط الطاقة) -->
                <div class="w-full lg:w-1/3 text-center">
                    <span class="text-slate-400 text-xs mb-2 block">حالة الضغط السعري (Pressure)</span>
                    <div id="radarStatusBox" class="bg-slate-950 border border-slate-700 rounded-xl p-4 transition-all duration-300">
                        <span id="radarIcon" class="text-3xl block mb-1">📡</span>
                        <span id="radarText" class="text-sm font-bold text-slate-300">قم بتشغيل الاستشعار لمعرفة الضغط</span>
                        <div class="w-full bg-slate-800 rounded-full h-1.5 mt-3 overflow-hidden">
                            <div id="radarProgressBar" class="bg-slate-600 h-1.5 rounded-full w-0 transition-all duration-300"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 📈 شبكة الرسوم البيانية (القنوات الآلية)  -->
        <!-- ========================================== -->
        <div id="charts-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-5 gap-4">
            <!-- يتم حقن الشاشات هنا -->
        </div>
    </div>

    <script>
        // ==========================================
        // 1. منطق الاستشعار الآلي للانفجار (AI Core)
        // ==========================================
        let upperResistance = null;
        let lowerSupport = null;
        let activeTarget = null;
        let breakoutType = null;
        let isExploded = false;
        let lastLivePrice = 0;

        // دالة الذكاء الاصطناعي لاكتشاف أقوى مناطق السيولة
        async function autoDetectLiquidity() {
            try {
                const btnIcon = document.querySelector('button span');
                btnIcon.innerText = "⏳ جاري المسح...";
                
                // جلب بيانات 10 ساعات (40 شمعة لفريم 15 دقيقة)
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=15m&limit=40`);
                const data = await res.json();
                
                let max = -Infinity, min = Infinity;
                
                // استبعاد الشمعة الأخيرة (لأنها لم تغلق بعد)
                for (let i = 0; i < data.length - 1; i++) {
                    let high = parseFloat(data[i][2]);
                    let low = parseFloat(data[i][3]);
                    if (high > max) max = high;
                    if (low < min) min = low;
                }
                
                upperResistance = max;
                lowerSupport = min;
                isExploded = false;

                // تحديث واجهة المستخدم بأرقام الدعم والمقاومة
                document.getElementById('autoResTarget').innerText = `$${upperResistance.toLocaleString()}`;
                document.getElementById('autoSupTarget').innerText = `$${lowerSupport.toLocaleString()}`;
                
                btnIcon.innerText = "✅ تم القفل على الأهداف";
                setTimeout(() => btnIcon.innerText = "🔍 إعادة استشعار السيولة", 3000);

                // تقييم أيهما أقرب للسعر الحالي للبدء في تتبعه
                evaluateActiveTarget();

            } catch (error) {
                console.error("خطأ في الاستشعار:", error);
                alert("تعذر جلب بيانات السوق، حاول مرة أخرى.");
            }
        }

        // دالة تحديد الهدف الأقرب (أين سينفجر السعر؟)
        function evaluateActiveTarget() {
            if (!upperResistance || !lowerSupport || !lastLivePrice) return;
            
            const distToRes = Math.abs(upperResistance - lastLivePrice);
            const distToSup = Math.abs(lastLivePrice - lowerSupport);

            // تتبع الهدف الأقرب للسعر الحالي
            if (distToRes <= distToSup) {
                activeTarget = upperResistance;
                breakoutType = 'bullish';
            } else {
                activeTarget = lowerSupport;
                breakoutType = 'bearish';
            }

            document.getElementById('displayTargetPrice').innerText = `$${activeTarget.toLocaleString()}`;
            document.getElementById('displayTargetPrice').className = breakoutType === 'bullish' ? "text-emerald-400 font-bold" : "text-rose-400 font-bold";
            
            analyzePressure();
        }

        // دالة قياس الضغط وتغيير حالة الرادار
        function analyzePressure() {
            if (!activeTarget || isExploded || !lastLivePrice) return;

            const diff = Math.abs(lastLivePrice - activeTarget);
            const percentDiff = (diff / activeTarget) * 100; // نسبة البعد عن الهدف

            const glow = document.getElementById('radarGlow');
            const statusBox = document.getElementById('radarStatusBox');
            const icon = document.getElementById('radarIcon');
            const text = document.getElementById('radarText');
            const progress = document.getElementById('radarProgressBar');

            // حساب طاقة الانفجار (الشريط يمتلئ كلما اقتربنا)
            let progressPercent = 100 - (percentDiff * 25); // كل 4% بعد تعني 0 تقدم
            progressPercent = Math.max(0, Math.min(100, progressPercent));
            progress.style.width = `${progressPercent}%`;

            // حالة الانفجار الفعلي! (تم الكسر)
            if (
                (breakoutType === 'bullish' && lastLivePrice >= activeTarget) ||
                (breakoutType === 'bearish' && lastLivePrice <= activeTarget)
            ) {
                isExploded = true;
                icon.innerText = "🚀🔥";
                text.innerText = breakoutType === 'bullish' ? "انفجار صاعد! (تم أكل سيولة المقاومة)" : "انهيار هابط! (تم كسر الدعم بشراسة)";
                text.className = "text-base font-bold text-white";
                statusBox.className = breakoutType === 'bullish' ? "bg-emerald-600 border-emerald-400 rounded-xl p-4 animate-pulse shadow-[0_0_20px_rgba(16,185,129,0.5)]" : "bg-rose-600 border-rose-400 rounded-xl p-4 animate-pulse shadow-[0_0_20px_rgba(225,29,72,0.5)]";
                glow.className = breakoutType === 'bullish' ? "absolute inset-0 bg-emerald-500/20" : "absolute inset-0 bg-rose-500/20";
                progress.className = "bg-white h-1.5 rounded-full transition-all duration-300";
                progress.style.width = "100%";
                return;
            }

            // حالات الضغط أثناء الزحف نحو الهدف
            if (percentDiff <= 0.1) {
                icon.innerText = "⚠️";
                text.innerText = "الضغط وصل ذروته! الانفجار يطبخ الآن";
                text.className = "text-sm font-bold text-rose-400 animate-pulse";
                statusBox.className = "bg-slate-900 border border-rose-500 rounded-xl p-4";
                glow.className = "absolute inset-0 bg-rose-500/10";
                progress.className = "bg-rose-500 h-1.5 rounded-full transition-all duration-300";
            } else if (percentDiff <= 0.4) {
                icon.innerText = "⚡";
                text.innerText = "السعر يعتصر.. يقترب من منطقة السيولة";
                text.className = "text-sm font-bold text-amber-400";
                statusBox.className = "bg-slate-900 border border-amber-500 rounded-xl p-4";
                glow.className = "absolute inset-0 bg-amber-500/10";
                progress.className = "bg-amber-400 h-1.5 rounded-full transition-all duration-300";
            } else {
                icon.innerText = "📡";
                text.innerText = breakoutType === 'bullish' ? "جاري الزحف نحو المقاومة العلوية..." : "جاري السقوط نحو الدعم السفلي...";
                text.className = "text-sm font-bold text-cyan-400";
                statusBox.className = "bg-slate-950 border border-slate-700 rounded-xl p-4";
                glow.className = "absolute inset-0 bg-slate-800/50";
                progress.className = "bg-cyan-500 h-1.5 rounded-full transition-all duration-300";
            }
        }

        // اتصال WebSocket لتحديث السعر اللحظي (Binance Trade Stream)
        const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
        const livePriceEl = document.getElementById('liveTickerPrice');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const currentPrice = parseFloat(data.p);
            
            if (currentPrice > lastLivePrice) {
                livePriceEl.className = "text-4xl font-mono font-bold text-emerald-400 tracking-wider";
            } else if (currentPrice < lastLivePrice) {
                livePriceEl.className = "text-4xl font-mono font-bold text-rose-400 tracking-wider";
            }
            livePriceEl.innerText = `$${currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            lastLivePrice = currentPrice;

            // إذا كان الرادار نشطاً، قم بتشغيل التقييم اللحظي
            if (activeTarget && !isExploded) {
                evaluateActiveTarget();
            }
        };


        // ==========================================
        // 2. شبكة الرسوم البيانية (مراقبة القنوات)
        // ==========================================
        const timeframes = [
            { interval: "5m", title: "5 دقائق" },
            { interval: "15m", title: "15 دقيقة" },
            { interval: "30m", title: "30 دقيقة" },
            { interval: "1h", title: "1 ساعة" },
            { interval: "4h", title: "4 ساعات" }, 
            { interval: "1d", title: "يوم واحد" }
        ];

        const gridContainer = document.getElementById('charts-grid');

        async function createChart(tf, index) {
            const chartCard = document.createElement('div');
            chartCard.className = "bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex flex-col shadow-lg";
            
            const header = document.createElement('div');
            header.className = "bg-slate-800 border-b border-slate-700 p-2 text-center text-sm font-bold text-white flex justify-between px-4";
            header.innerHTML = `<span>فريم: ${tf.title}</span> <span class="text-amber-400 text-xs">جاري التحميل...</span>`;
            
            const chartDiv = document.createElement('div');
            chartDiv.className = "w-full h-[320px] relative"; 
            
            chartCard.appendChild(header);
            chartCard.appendChild(chartDiv);
            gridContainer.appendChild(chartCard);

            const chart = LightweightCharts.createChart(chartDiv, {
                autoSize: true,
                layout: { background: { type: 'solid', color: '#0f172a' }, textColor: '#94a3b8' },
                grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                timeScale: { timeVisible: true, borderColor: '#334155', rightOffset: 5 },
                rightPriceScale: { borderColor: '#334155' },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
            });

            const candleSeries = chart.addCandlestickSeries({ upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444' });
            const topTrendLine = chart.addLineSeries({ color: '#fbbf24', lineWidth: 2, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });
            const bottomTrendLine = chart.addLineSeries({ color: '#22d3ee', lineWidth: 2, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });

            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf.interval}&limit=150`);
                if (!res.ok) throw new Error("Network Error");
                const data = await res.json();

                const candlesData = [];
                const uniqueTimes = new Set();

                data.forEach(d => {
                    const time = Math.floor(d[0] / 1000); 
                    if (uniqueTimes.has(time)) return;
                    uniqueTimes.add(time);
                    candlesData.push({ time, open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]) });
                });

                const swingHighs = [];
                const swingLows = [];
                const lookback = 3; 

                for (let i = lookback; i < candlesData.length - lookback; i++) {
                    let isSwingHigh = true, isSwingLow = true;
                    const cHigh = candlesData[i].high, cLow = candlesData[i].low;

                    for (let j = 1; j <= lookback; j++) {
                        if (cHigh <= candlesData[i - j].high || cHigh <= candlesData[i + j].high) isSwingHigh = false;
                        if (cLow >= candlesData[i - j].low || cLow >= candlesData[i + j].low) isSwingLow = false;
                    }
                    if (isSwingHigh) swingHighs.push({ time: candlesData[i].time, value: cHigh });
                    if (isSwingLow) swingLows.push({ time: candlesData[i].time, value: cLow });
                }

                let markers = [];
                let events = [...swingHighs.map(h => ({...h, type:'high'})), ...swingLows.map(l => ({...l, type:'low'}))];
                events.sort((a, b) => a.time - b.time);

                let cH = null, cL = null, lastSig = null;
                for(let ev of events) {
                    let oldDist = (cH && cL) ? (cH - cL) : null;
                    if (ev.type === 'high') cH = ev.value; else cL = ev.value;
                    let newDist = (cH && cL) ? (cH - cL) : null;
                    
                    if (oldDist && newDist) {
                        if (newDist <= oldDist * 0.85 && lastSig !== 'squeeze') {
                            markers.push({ time: ev.time, position: 'aboveBar', color: '#f59e0b', shape: 'arrowDown', text: 'خنق ⚠️' });
                            lastSig = 'squeeze';
                        } else if (newDist >= oldDist * 1.15 && lastSig !== 'expand') {
                            markers.push({ time: ev.time, position: 'belowBar', color: '#06b6d4', shape: 'arrowUp', text: 'اتساع 🚀' });
                            lastSig = 'expand';
                        }
                    }
                }

                candleSeries.setData(candlesData);
                candleSeries.setMarkers(markers);
                
                if (candlesData.length > 0 && swingHighs.length > 0 && swingLows.length > 0) {
                    const lastCandle = candlesData[candlesData.length - 1];
                    if (lastCandle.time > swingHighs[swingHighs.length-1].time) swingHighs.push({ time: lastCandle.time, value: lastCandle.high });
                    if (lastCandle.time > swingLows[swingLows.length-1].time) swingLows.push({ time: lastCandle.time, value: lastCandle.low });
                }

                topTrendLine.setData(swingHighs);
                bottomTrendLine.setData(swingLows);
                
                header.innerHTML = `<span>فريم: ${tf.title}</span> <span class="text-emerald-400 text-xs">متصل ✔️</span>`;
                
            } catch (error) {
                header.innerHTML = `<span>فريم: ${tf.title}</span> <span class="text-rose-400 text-xs">خطأ اتصال ⚠️</span>`;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            timeframes.forEach((tf, index) => createChart(tf, index));
        });
    </script>
</body>
</html>
