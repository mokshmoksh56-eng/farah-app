<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة صوتية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #ecf0f1;
            border: none;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 28px;
            text-align: left;
            padding: 10px;
            box-sizing: border-box;
            direction: ltr;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background-color: #34495e;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.operator { background-color: #e67e22; }
        button.clear { background-color: #e74c3c; grid-column: span 2; }
        button.equal { background-color: #27ae60; grid-column: span 2; }
        
        /* التأثير الضوئي عند النطق أو الضغط */
        button.active, button:active {
            background-color: #f1c40f !important;
            color: #333;
            box-shadow: 0 0 15px #f1c40f;
            transform: scale(1.05);
        }

        .mic-btn {
            grid-column: span 4;
            background-color: #3498db;
            font-weight: bold;
        }
        .listening {
            background-color: #e74c3c !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled placeholder="0">
    <div class="buttons">
        <button class="mic-btn" id="micBtn" onclick="startListening()">🎤 اضغط وتحدث</button>
        
        <button class="clear" data-val="C" onclick="clearDisplay()">C (مسح)</button>
        <button class="operator" data-val="/" onclick="appendValue('/')">/ (على)</button>
        <button class="operator" data-val="*" onclick="appendValue('*')">* (في)</button>
        
        <button data-val="7" onclick="appendValue('7')">7</button>
        <button data-val="8" onclick="appendValue('8')">8</button>
        <button data-val="9" onclick="appendValue('9')">9</button>
        <button class="operator" data-val="-" onclick="appendValue('-')">- (ناقص)</button>
        
        <button data-val="4" onclick="appendValue('4')">4</button>
        <button data-val="5" onclick="appendValue('5')">5</button>
        <button data-val="6" onclick="appendValue('6')">6</button>
        <button class="operator" data-val="+" onclick="appendValue('+')">+ (زائد)</button>
        
        <button data-val="1" onclick="appendValue('1')">1</button>
        <button data-val="2" onclick="appendValue('2')">2</button>
        <button data-val="3" onclick="appendValue('3')">3</button>
        
        <button data-val="0" onclick="appendValue('0')">0</button>
        <button class="equal" data-val="=" onclick="calculate()">= (يساوي)</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const micBtn = document.getElementById('micBtn');

    // قاموس لتحويل الكلمات المنطوقة إلى أرقام وعمليات
    const voiceMap = {
        'صفر': '0', '0': '0',
        'واحد': '1', '1': '1',
        'اثنين': '2', 'اتنين': '2', '2': '2',
        'ثلاثة': '3', 'تلاته': '3', 'تلاتة': '3', '3': '3',
        'أربعة': '4', 'اربعه': '4', '4': '4',
        'خمسة': '5', 'خمسه': '5', '5': '5',
        'ستة': '6', 'سته': '6', '6': '6',
        'سبعة': '7', 'سبعه': '7', '7': '7',
        'ثمانية': '8', 'تمانيه': '8', '8': '8',
        'تسعة': '9', 'تسعه': '9', '9': '9',
        'زائد': '+', 'جمع': '+',
        'ناقص': '-', 'طرح': '-',
        'في': '*', 'ضرب': '*',
        'على': '/', 'قسمه': '/', 'قسمة': '/',
        'يساوي': '=', 'النتيجه': '=', 'النتيجة': '=',
        'مسح': 'C', 'امسح': 'C'
    };

    function appendValue(val) {
        if(display.value === '0') display.value = val;
        else display.value += val;
        flashButton(val);
    }

    function clearDisplay() {
        display.value = '';
        flashButton('C');
    }

    function calculate() {
        try {
            let result = eval(display.value);
            if(result !== undefined) {
                display.value = result;
                flashButton('=');
                speakResult(result);
            }
        } catch (e) {
            speakResult("عفواً، هناك خطأ في العملية");
        }
    }

    // دالة لإضاءة الزر المطابق
    function flashButton(val) {
        const btn = document.querySelector(`button[data-val="${val}"]`);
        if(btn) {
            btn.classList.add('active');
            setTimeout(() => {
                btn.classList.remove('active');
            }, 500); // مدة الإضاءة نصف ثانية
        }
    }

    // دالة نطق النتيجة
    function speakResult(text) {
        const utterance = new SpeechSynthesisUtterance("النتيجة هي " + text);
        utterance.lang = 'ar-SA'; 
        window.speechSynthesis.speak(utterance);
    }

    // إعداد التعرف على الصوت
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; // اللغة العربية
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            micBtn.classList.add('listening');
            micBtn.innerText = "🎤 جاري الاستماع...";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript.trim().split(' ');
            
            // معالجة الكلمات المنطوقة كلمة بكلمة لعمل التأثير الضوئي
            transcript.forEach((word, index) => {
                setTimeout(() => {
                    let mappedValue = voiceMap[word];
                    if (mappedValue) {
                        if (mappedValue === '=') {
                            calculate();
                        } else if (mappedValue === 'C') {
                            clearDisplay();
                        } else {
                            appendValue(mappedValue);
                        }
                    }
                }, index * 600); // تأخير بسيط بين كل كلمة والأخرى لظهور الإضاءة
            });
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 اضغط وتحدث";
        };

        window.startListening = function() {
            recognition.start();
        };
    } else {
        micBtn.innerText = "التعرف على الصوت غير مدعوم في متصفحك";
        micBtn.disabled = true;
    }
</script>

</body>
</html>
