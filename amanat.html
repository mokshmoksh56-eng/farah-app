<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة صوتية ذكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
            width: 320px;
        }
        #display {
            width: 100%;
            height: 60px;
            background-color: #ecf0f1;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
            font-size: 24px;
            text-align: left;
            padding: 10px;
            box-sizing: border-box;
            direction: ltr; /* اتجاه الأرقام دايماً من اليسار لليمين */
            color: #2c3e50;
            font-weight: bold;
        }
        #speechBox {
            width: 100%;
            min-height: 35px;
            background-color: #1a252f;
            color: #1abc9c;
            border-radius: 5px;
            margin-bottom: 20px;
            padding: 8px 10px;
            font-size: 15px;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
            background-color: #34495e;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        button.operator { background-color: #e67e22; }
        button.clear { background-color: #e74c3c; grid-column: span 2; }
        button.equal { background-color: #27ae60; grid-column: span 2; }
        
        button.active, button:active {
            background-color: #f1c40f !important;
            color: #333;
            box-shadow: 0 0 15px #f1c40f;
            transform: scale(1.05);
        }

        .mic-btn {
            grid-column: span 4;
            background-color: #3498db;
            font-weight: bold;
        }
        .listening {
            background-color: #e74c3c !important;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled placeholder="0">
    <div id="speechBox">الكلام اللي هتقوله هيظهر هنا...</div>
    
    <div class="buttons">
        <button class="mic-btn" id="micBtn" onclick="startListening()">🎤 اضغط وتحدث</button>
        
        <button class="clear" data-val="C" onclick="clearDisplay()">C</button>
        <button class="operator" data-val="/" onclick="appendValue('/')">/</button>
        <button class="operator" data-val="*" onclick="appendValue('*')">*</button>
        
        <button data-val="7" onclick="appendValue('7')">7</button>
        <button data-val="8" onclick="appendValue('8')">8</button>
        <button data-val="9" onclick="appendValue('9')">9</button>
        <button class="operator" data-val="-" onclick="appendValue('-')">-</button>
        
        <button data-val="4" onclick="appendValue('4')">4</button>
        <button data-val="5" onclick="appendValue('5')">5</button>
        <button data-val="6" onclick="appendValue('6')">6</button>
        <button class="operator" data-val="+" onclick="appendValue('+')">+</button>
        
        <button data-val="1" onclick="appendValue('1')">1</button>
        <button data-val="2" onclick="appendValue('2')">2</button>
        <button data-val="3" onclick="appendValue('3')">3</button>
        
        <button data-val="0" onclick="appendValue('0')">0</button>
        <button class="equal" data-val="=" onclick="calculate()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');
    const micBtn = document.getElementById('micBtn');
    const speechBox = document.getElementById('speechBox');
    let isCalculated = false; // متغير عشان نعرف إذا كنا طلعنا النتيجة ولا لأ

    const voiceMap = {
        'صفر': '0', '0': '0',
        'واحد': '1', '1': '1',
        'اثنين': '2', 'اتنين': '2', '2': '2',
        'ثلاثة': '3', 'تلاته': '3', 'تلاتة': '3', '3': '3',
        'أربعة': '4', 'اربعه': '4', '4': '4',
        'خمسة': '5', 'خمسه': '5', '5': '5',
        'ستة': '6', 'سته': '6', '6': '6',
        'سبعة': '7', 'سبعه': '7', '7': '7',
        'ثمانية': '8', 'تمانيه': '8', '8': '8',
        'تسعة': '9', 'تسعه': '9', '9': '9',
        'زائد': '+', 'جمع': '+', '+': '+', 'و': '+',
        'ناقص': '-', 'طرح': '-', '-': '-',
        'في': '*', 'ضرب': '*', '*': '*', 'x': '*', 'X': '*',
        'على': '/', 'قسمه': '/', 'قسمة': '/', '/': '/',
        'يساوي': '=', 'النتيجه': '=', 'النتيجة': '=', '=': '=',
        'مسح': 'C', 'امسح': 'C', 'حذف': 'C', 'c': 'C', 'C': 'C'
    };

    function appendValue(val) {
        let stringVal = String(val);
        
        if (isCalculated) {
            // لو اليوزر ضغط علامة (+ - * /) بعد النتيجة، نكمل على النتيجة
            if (['+', '-', '*', '/'].includes(stringVal)) {
                let previousResult = display.value.split('=')[1].trim();
                display.value = previousResult + ' ' + stringVal + ' ';
            } else {
                // لو قال رقم جديد، نبدأ مسألة جديدة
                display.value = stringVal;
            }
            isCalculated = false;
        } else {
            if (display.value === '0' || display.value === '') {
                display.value = stringVal;
            } else {
                // لو المدخل علامة، نحط قبلها وبعدها مسافة عشان تظهر في المنتصف بوضوح
                if (['+', '-', '*', '/'].includes(stringVal)) {
                    display.value += ' ' + stringVal + ' ';
                } else {
                    display.value += stringVal;
                }
            }
        }
        
        for (let i = 0; i < stringVal.length; i++) {
            setTimeout(() => {
                flashButton(stringVal[i]);
            }, i * 300);
        }
    }

    function clearDisplay() {
        display.value = '0';
        isCalculated = false;
        flashButton('C');
    }

    function calculate() {
        if (isCalculated) return; // منع التكرار لو تم الحساب
        try {
            let expression = display.value;
            let result = eval(expression);
            if(result !== undefined) {
                // وضع النتيجة مع المسألة بالكامل وعلامة =
                display.value = expression + ' = ' + result;
                isCalculated = true;
                flashButton('=');
                speakResult(result);
            }
        } catch (e) {
            speakResult("عفواً، هناك خطأ في العملية");
        }
    }

    function flashButton(val) {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            if (btn.getAttribute('data-val') === val) {
                btn.classList.add('active');
                setTimeout(() => {
                    btn.classList.remove('active');
                }, 500);
            }
        });
    }

    function speakResult(text) {
        const utterance = new SpeechSynthesisUtterance("النتيجة هي " + text);
        utterance.lang = 'ar-SA'; 
        window.speechSynthesis.speak(utterance);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            micBtn.classList.add('listening');
            micBtn.innerText = "🎤 جاري الاستماع...";
            speechBox.innerText = "أنا أسمعك الآن...";
            speechBox.style.color = "#f1c40f";
        };

        recognition.onresult = function(event) {
            let fullTranscript = event.results[0][0].transcript.trim();
            
            // إضافة خاصية (dir="ltr") عشان الأرقام والعلامات تظهر بالترتيب الإنجليزي من اليسار لليمين
            speechBox.innerHTML = `قلت: <span dir="ltr" style="display:inline-block; font-weight:bold; color:#f1c40f; margin: 0 5px;">${fullTranscript}</span>`;
            speechBox.style.color = "#1abc9c";

            fullTranscript = fullTranscript.replace(/\+/g, ' + ')
                                           .replace(/-/g, ' - ')
                                           .replace(/\*/g, ' * ')
                                           .replace(/\//g, ' / ')
                                           .replace(/=/g, ' = ')
                                           .replace(/x/gi, ' * '); 
            
            fullTranscript = fullTranscript.replace(/\s+/g, ' ').trim();
            
            const transcriptWords = fullTranscript.split(' ');
            
            transcriptWords.forEach((word, index) => {
                setTimeout(() => {
                    let mappedValue = voiceMap[word];
                    
                    if (!mappedValue && !isNaN(word) && word.trim() !== '') {
                        mappedValue = word;
                    }

                    if (mappedValue) {
                        if (mappedValue === '=') {
                            calculate();
                        } else if (mappedValue === 'C') {
                            clearDisplay();
                        } else {
                            appendValue(mappedValue);
                        }
                    }
                }, index * 800); 
            });
        };

        recognition.onerror = function(event) {
            speechBox.innerText = `خطأ: ${event.error}`;
            speechBox.style.color = "#e74c3c";
        };

        recognition.onend = function() {
            micBtn.classList.remove('listening');
            micBtn.innerText = "🎤 اضغط وتحدث";
        };

        window.startListening = function() {
            recognition.start();
        };
    } else {
        micBtn.innerText = "المتصفح لا يدعم الصوت";
        speechBox.innerText = "يرجى استخدام متصفح Google Chrome";
        micBtn.disabled = true;
    }
</script>

</body>
</html>
