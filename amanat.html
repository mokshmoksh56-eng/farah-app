<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أقبض | خريطة التجار</title>
    
    <!-- مكتبة Tailwind للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات الخريطة Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); }
        .leaflet-container { font-family: 'Cairo', sans-serif !important; z-index: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 text-gray-900 bg-gray-200 relative">

    <!-- كود Mapbox الخاص بالتطبيق المرفق -->
    <script>
        const MAPBOX_TOKEN = "pk.eyJ1IjoibW9rc2htb2tzaCIsImEiOiJjbXRyZXF5cXkwMWRhMnlzaDI0OXJiNXQ1In0.X30BmuAkJ69jOlicXZK53A"; 
        const governoratesList = ["القاهرة", "الجيزة", "الإسكندرية", "الدقهلية", "الشرقية", "الغربية", "المنوفية", "القليوبية", "البحيرة", "كفر الشيخ", "دمياط", "الإسماعيلية", "بورسعيد", "السويس", "مطروح", "شمال سيناء", "جنوب سيناء", "البحر الأحمر", "الفيوم", "بني سويف", "المنيا", "أسيوط", "سوهاج", "قنا", "الأقصر", "أسوان", "الوادي الجديد"];
    </script>

    <!-- شاشة الموظف الرئيسية -->
    <div id="mainView" class="glass-panel shadow-2xl rounded-3xl w-full max-w-lg p-6 sm:p-8 border-t-4 border-green-500 transform transition-all duration-300">
        <div class="mb-6 text-center">
            <h2 class="text-3xl font-black text-gray-900">طلب سيولة نقدية (كاش) 💵</h2>
            <p class="text-gray-500 text-sm mt-2 font-bold">حدد موقعك للبحث عن أقرب متجر متوفر لديه سيولة</p>
        </div>

        <div class="space-y-5">
            <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 shadow-sm">
                <label class="block text-base font-black text-gray-900 mb-3">كم تحتاج من الكاش؟</label>
                <input type="number" id="cashAmount" placeholder="أدخل المبلغ (مثال: 1000)" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 outline-none font-bold text-center text-xl">
            </div>

            <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-200 shadow-sm relative">
                <label class="block text-sm font-black text-blue-900 mb-2">📍 موقعك الحالي (لاستلام الكاش)</label>
                
                <button type="button" onclick="openMapModal()" class="w-full mb-3 bg-white border border-blue-300 text-blue-700 hover:bg-blue-100 py-3 rounded-xl shadow-sm font-bold flex items-center justify-center gap-2 active:scale-95 transition">
                    <span class="text-xl">🗺️</span> فتح الخريطة لتحديد الموقع بدقة
                </button>
                
                <input type="text" id="selectedGov" placeholder="المحافظة (سيتم تحديدها من الخريطة)" readonly class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-xl text-sm font-black text-gray-700 mb-2">
                <input type="text" id="selectedAddress" placeholder="تفاصيل العنوان..." readonly class="w-full px-3 py-2 bg-gray-100 border border-gray-300 rounded-xl text-sm font-black text-gray-700">
            </div>

            <button type="button" onclick="searchNearbyMerchants()" class="w-full bg-green-500 hover:bg-green-600 text-white font-extrabold py-4 rounded-xl shadow-lg active:scale-95 flex justify-center items-center gap-2 text-lg">
                🔍 ابحث عن أقرب تاجر
            </button>
        </div>
    </div>

    <!-- نافذة الخريطة التفاعلية -->
    <div id="mapModal" class="hidden fixed inset-0 bg-black bg-opacity-75 z-[999999] flex justify-center items-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl w-full max-w-lg p-5 shadow-2xl flex flex-col h-[85vh]">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xl font-black text-gray-900">حدد موقعك على الخريطة 📍</h3>
                <button type="button" onclick="closeMapModal()" class="text-gray-500 hover:text-red-500 text-3xl font-bold">&times;</button>
            </div>
            
            <div class="flex gap-2 mb-3">
                <input type="text" id="mapSearchInput" placeholder="ابحث عن مكان (مثال: المنصورة)..." class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl font-bold outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                <button type="button" onclick="searchOnMap()" class="bg-blue-500 text-white px-4 py-2 rounded-xl font-bold shadow-md active:scale-95">بحث</button>
            </div>
            
            <div class="flex-1 w-full relative flex flex-col z-0 rounded-xl overflow-hidden shadow-inner border border-gray-300">
                <div id="leafletMap" class="flex-1 w-full z-0"></div>
                <button type="button" onclick="goToMyLocationOnMap()" class="absolute bottom-4 right-4 z-[400] w-12 h-12 bg-white text-blue-600 rounded-full shadow-xl border border-gray-200 flex justify-center items-center hover:bg-gray-50 active:scale-95 transition-all">
                    <span class="text-2xl">🎯</span>
                </button>
            </div>
            
            <div class="mt-3 p-3 bg-blue-50 border border-blue-200 rounded-xl text-xs font-bold text-blue-800 text-center min-h-[50px] flex items-center justify-center" id="mapAddressPreview">
                حرك الدبوس أو ابحث لتحديد المكان...
            </div>
            <button type="button" onclick="confirmMapSelection()" class="mt-4 w-full bg-gray-800 text-white font-extrabold py-3 rounded-xl shadow-md active:scale-95 text-lg">تأكيد واختيار هذا الموقع</button>
        </div>
    </div>

    <!-- سكريبت تشغيل الخريطة -->
    <script>
        let mapInstance = null; 
        let mapMarker = null;
        let selectedMapGov = ""; 
        let selectedMapAddress = "";
        let finalLat = null;
        let finalLng = null;

        window.openMapModal = function() {
            document.getElementById('mapModal').classList.remove('hidden');
            if (!mapInstance) {
                // نقطة البداية الافتراضية
                mapInstance = L.map('leafletMap').setView([30.0444, 31.2357], 7);
                
                L.tileLayer(`https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/256/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`, {
                    maxZoom: 18,
                    attribution: '© Mapbox'
                }).addTo(mapInstance);
                
                mapMarker = L.marker([30.0444, 31.2357], { draggable: true }).addTo(mapInstance);
                
                // تحديث الموقع عند النقر أو سحب الدبوس
                mapInstance.on('click', function(e) {
                    mapMarker.setLatLng(e.latlng);
                    updateMapAddress(e.latlng.lat, e.latlng.lng);
                });
                
                mapMarker.on('dragend', function(e) {
                    let position = mapMarker.getLatLng();
                    updateMapAddress(position.lat, position.lng);
                });

                // جلب موقع المستخدم التلقائي عند فتح الخريطة
                goToMyLocationOnMap();
            }
            // إصلاح حجم الخريطة عند ظهور النافذة المنبثقة
            setTimeout(() => { mapInstance.invalidateSize(); }, 300);
        };

        window.closeMapModal = function() { document.getElementById('mapModal').classList.add('hidden'); };

        window.searchOnMap = function() {
            const query = document.getElementById('mapSearchInput').value.trim();
            if(!query) return;
            document.getElementById('mapAddressPreview').innerHTML = "⏳ جاري البحث...";
            
            fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query + ' مصر')}.json?access_token=${MAPBOX_TOKEN}&language=ar&limit=1`)
            .then(res => res.json())
            .then(data => {
                if(data && data.features && data.features.length > 0) {
                    const lon = parseFloat(data.features[0].center[0]); 
                    const lat = parseFloat(data.features[0].center[1]);
                    mapInstance.setView([lat, lon], 14);
                    mapMarker.setLatLng([lat, lon]);
                    updateMapAddress(lat, lon);
                } else {
                    document.getElementById('mapAddressPreview').innerHTML = "❌ لم يتم العثور على المكان.";
                }
            }).catch(() => document.getElementById('mapAddressPreview').innerHTML = "خطأ في البحث.");
        };

        window.updateMapAddress = function(lat, lng) {
            document.getElementById('mapAddressPreview').innerHTML = "⏳ جاري تحليل العنوان...";
            fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?access_token=${MAPBOX_TOKEN}&language=ar`)
            .then(res => res.json())
            .then(data => {
                if(data && data.features && data.features.length > 0) {
                    let state = "";
                    let specificAddress = data.features[0].place_name_ar || data.features[0].place_name;
                    
                    let context = data.features[0].context || [];
                    for(let i=0; i<context.length; i++) {
                        if(context[i].id.startsWith('region')) {
                            state = context[i].text_ar || context[i].text;
                            break;
                        }
                    }
                    if(!state && data.features[0].place_type.includes('region')) {
                        state = data.features[0].text_ar || data.features[0].text;
                    }

                    let searchState = state || specificAddress;
                    let mappedGov = governoratesList.find(g => searchState.includes(g) || g.includes(searchState.replace('محافظة ','')));
                    
                    selectedMapGov = mappedGov || "غير محدد";
                    selectedMapAddress = specificAddress.split(',')[0] || state;
                    finalLat = lat;
                    finalLng = lng;

                    document.getElementById('mapAddressPreview').innerHTML = `<b>المحافظة:</b> ${selectedMapGov}<br><b>التفاصيل:</b> ${selectedMapAddress}`;
                }
            });
        };

        window.goToMyLocationOnMap = function() {
            if (navigator.geolocation) {
                document.getElementById('mapAddressPreview').innerHTML = "⏳ جاري تحديد موقعك عبر GPS...";
                navigator.geolocation.getCurrentPosition(pos => {
                    let lat = pos.coords.latitude; 
                    let lng = pos.coords.longitude;
                    mapInstance.setView([lat, lng], 15);
                    mapMarker.setLatLng([lat, lng]);
                    updateMapAddress(lat, lng);
                }, err => {
                    alert("يرجى تفعيل الـ GPS 📍 والسماح للمتصفح بالوصول للموقع.");
                }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
            }
        };

        window.confirmMapSelection = function() {
            if(!finalLat || !finalLng) return alert("الرجاء تحديد موقع على الخريطة أولاً.");
            
            // نقل البيانات من الخريطة إلى الشاشة الرئيسية
            document.getElementById('selectedGov').value = selectedMapGov;
            document.getElementById('selectedAddress').value = selectedMapAddress;
            
            closeMapModal();
        };

        window.searchNearbyMerchants = function() {
            const amount = document.getElementById('cashAmount').value;
            const gov = document.getElementById('selectedGov').value;
            
            if(!amount || amount <= 0) return alert("يرجى إدخال المبلغ المطلوب.");
            if(!gov) return alert("يرجى تحديد موقعك من الخريطة أولاً.");
            
            alert(`سيتم الآن البحث في قاعدة البيانات عن التجار في نطاق الإحداثيات: \nخط العرض: ${finalLat}\nخط الطول: ${finalLng}\nولديهم سيولة أكبر من ${amount} جنيه.`);
            // هنا سيتم استدعاء كود الـ Backend (Java API) الذي كتبناه مسبقاً
        };
    </script>
</body>
</html>
