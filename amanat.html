<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشات البيتكوين | قناة القمم والقيعان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 md:p-4 font-sans">
    
    <div class="max-w-[1800px] mx-auto space-y-6">
        <!-- رأس الصفحة -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-emerald-400 flex items-center gap-2">
                    <span>⚡ لوحة البيتكوين - استراتيجية القناة الخانقة</span>
                </h1>
                <p class="text-slate-400 text-sm mt-1">
                    <span class="text-amber-400 font-bold">الخط الأصفر:</span> يربط القمم الحقيقية (مقاومة) | 
                    <span class="text-cyan-400 font-bold">الخط الأزرق:</span> يربط القيعان الحقيقية (دعم).
                </p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center gap-2 bg-slate-800 px-4 py-2 rounded-lg border border-slate-700">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-sm font-semibold text-slate-300">متصل بالسوق اللحظي</span>
            </div>
        </div>

        <!-- شبكة الرسوم البيانية -->
        <div id="charts-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-5 gap-4">
            <!-- يتم حقن الشاشات هنا -->
        </div>
    </div>

    <script>
        const timeframes = [
            { interval: "5m", title: "5 دقائق" },
            { interval: "15m", title: "15 دقيقة" },
            { interval: "30m", title: "30 دقيقة" },
            { interval: "1h", title: "1 ساعة" },
            { interval: "2h", title: "ساعتين" },
            { interval: "4h", title: "4 ساعات" },
            { interval: "6h", title: "6 ساعات" },
            { interval: "1d", title: "يوم واحد" },
            { interval: "1w", title: "أسبوع" },
            { interval: "1M", title: "شهر" }
        ];

        const gridContainer = document.getElementById('charts-grid');

        async function createChart(tf, index) {
            // 1. بناء الهيكل الخارجي للبطاقة
            const chartCard = document.createElement('div');
            chartCard.className = "bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex flex-col shadow-lg";
            
            const header = document.createElement('div');
            header.className = "bg-slate-800 border-b border-slate-700 p-2 text-center text-sm font-bold text-white";
            header.innerText = `فريم: ${tf.title} (جاري التحميل...)`;
            
            const chartDiv = document.createElement('div');
            chartDiv.className = "w-full h-[350px] relative"; 
            
            chartCard.appendChild(header);
            chartCard.appendChild(chartDiv);
            gridContainer.appendChild(chartCard);

            // 2. إعداد محرك الرسم البياني
            const chart = LightweightCharts.createChart(chartDiv, {
                autoSize: true,
                layout: {
                    background: { type: 'solid', color: '#0f172a' },
                    textColor: '#94a3b8',
                },
                grid: {
                    vertLines: { color: '#1e293b' },
                    horzLines: { color: '#1e293b' },
                },
                timeScale: {
                    timeVisible: true,
                    borderColor: '#334155',
                    rightOffset: 5, 
                },
                rightPriceScale: {
                    borderColor: '#334155',
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                }
            });

            // 3. سلسلة الشموع اليابانية
            const candleSeries = chart.addCandlestickSeries({
                upColor: '#10b981', 
                downColor: '#ef4444', 
                borderVisible: false, 
                wickUpColor: '#10b981', 
                wickDownColor: '#ef4444'
            });

            // 4. خط المقاومة العلوي (أصفر) للقمم
            const topTrendLine = chart.addLineSeries({
                color: '#fbbf24', // أصفر
                lineWidth: 2,
                crosshairMarkerVisible: true,
                lastValueVisible: false,
                priceLineVisible: false,
                lineStyle: 0 // خط متصل
            });

            // 5. خط الدعم السفلي (أزرق سماوي) للقيعان
            const bottomTrendLine = chart.addLineSeries({
                color: '#22d3ee', // سماوي
                lineWidth: 2,
                crosshairMarkerVisible: true,
                lastValueVisible: false,
                priceLineVisible: false,
                lineStyle: 0 
            });

            // 6. جلب ومعالجة البيانات
            try {
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${tf.interval}&limit=200`);
                if (!res.ok) throw new Error("تعذر جلب البيانات");
                const data = await res.json();

                const candlesData = [];
                const uniqueTimes = new Set();

                // المرحلة الأولى: تجهيز الشموع
                data.forEach(d => {
                    const time = Math.floor(d[0] / 1000); 
                    if (uniqueTimes.has(time)) return;
                    uniqueTimes.add(time);

                    candlesData.push({
                        time: time,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    });
                });

                // المرحلة الثانية: خوارزمية استخراج القمم والقيعان الحقيقية (Swing Highs & Lows)
                const swingHighs = [];
                const swingLows = [];
                const lookback = 2; // التأكد من شمعتين يميناً ويساراً

                for (let i = lookback; i < candlesData.length - lookback; i++) {
                    let isSwingHigh = true;
                    let isSwingLow = true;
                    const currentHigh = candlesData[i].high;
                    const currentLow = candlesData[i].low;

                    // مقارنة الشمعة بما قبلها وما بعدها
                    for (let j = 1; j <= lookback; j++) {
                        if (currentHigh <= candlesData[i - j].high || currentHigh <= candlesData[i + j].high) {
                            isSwingHigh = false;
                        }
                        if (currentLow >= candlesData[i - j].low || currentLow >= candlesData[i + j].low) {
                            isSwingLow = false;
                        }
                    }

                    if (isSwingHigh) {
                        swingHighs.push({ time: candlesData[i].time, value: currentHigh });
                    }
                    if (isSwingLow) {
                        swingLows.push({ time: candlesData[i].time, value: currentLow });
                    }
                }

                // ربط الخطوط بالشمعة الحالية لإظهار اتجاه السعر اللحظي (اختياري، يضيف تفاعل للسوق)
                if (candlesData.length > 0 && swingHighs.length > 0 && swingLows.length > 0) {
                    const lastCandle = candlesData[candlesData.length - 1];
                    swingHighs.push({ time: lastCandle.time, value: lastCandle.high });
                    swingLows.push({ time: lastCandle.time, value: lastCandle.low });
                }

                // تغذية الرسم البياني
                candleSeries.setData(candlesData);
                topTrendLine.setData(swingHighs);
                bottomTrendLine.setData(swingLows);
                
                header.innerText = `فريم: ${tf.title}`;
                
            } catch (error) {
                console.error(`خطأ في فريم ${tf.interval}:`, error);
                header.innerText = `فريم: ${tf.title} (خطأ في الاتصال ⚠️)`;
                header.classList.add('text-rose-400');
            }
        }

        // تشغيل العملية
        window.addEventListener('DOMContentLoaded', () => {
            timeframes.forEach((tf, index) => {
                createChart(tf, index);
            });
        });
    </script>
</body>
</html>
