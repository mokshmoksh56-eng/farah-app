<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عزيمة برو - الملاحظات الصوتية</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: #1c1e21; 
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #e4e6eb;
            padding-bottom: 15px;
        }
        h1 { color: #1877f2; margin: 0 0 10px 0; }
        p.subtitle { color: #606770; margin: 0; font-size: 16px; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        textarea { 
            flex-grow: 1; 
            padding: 15px; 
            font-size: 18px; 
            border-radius: 8px; 
            border: 2px solid #ccd0d5; 
            resize: vertical; 
            min-height: 70px;
            transition: 0.3s;
        }
        textarea:focus { border-color: #1877f2; outline: none; }
        
        button { 
            color: white; 
            padding: 15px 30px; 
            font-size: 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-weight: bold; 
        }
        #start-btn { background-color: #1877f2; width: 100%; max-width: 250px; }
        #start-btn:hover { background-color: #166fe5; }
        #save-btn { background-color: #42b72a; width: 100%; max-width: 200px; }
        #save-btn:hover { background-color: #36a420; }
        
        .recording { 
            background-color: #e41e3f !important; 
            animation: pulse 1s infinite; 
        }
        
        .search-box { 
            width: 100%; 
            padding: 15px; 
            font-size: 16px; 
            margin-bottom: 25px; 
            border: 1px solid #ccd0d5; 
            border-radius: 8px; 
            box-sizing: border-box; 
        }
        
        h2 { color: #1c1e21; border-right: 4px solid #1877f2; padding-right: 10px; margin-top: 30px; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: white; }
        th, td { padding: 15px; border-bottom: 1px solid #ddd; text-align: right; }
        th { background-color: #f5f6f7; color: #606770; }
        tr:hover { background-color: #f0f2f5; }
        
        .badge { 
            background-color: #ff9f43; 
            color: white; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 14px; 
        }
        .delete-btn { 
            background-color: #e41e3f; 
            padding: 8px 15px; 
            font-size: 14px; 
            border-radius: 6px;
            color: white;
            border: none;
            cursor: pointer;
        }

        @keyframes pulse { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.02); } 
            100% { transform: scale(1); } 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عزيمة برو - مطابخ فرح 🛠️</h1>
        <p class="subtitle">نظام الملاحظات الصوتية الذكي لتوزيع المهام على الفريق</p>
    </div>
    
    <div class="controls">
        <button id="start-btn">اضغط وتحدث 🎙️</button>
        <textarea id="note-box" placeholder="الكلام هيظهر هنا... (مثال: تجهيز قطاعات المطبخ لـ ميدو)"></textarea>
        <button id="save-btn">حفظ وتوزيع 💾</button>
    </div>

    <input type="text" id="search-input" class="search-box" placeholder="🔍 ابحث في الملاحظات أو أسماء الفريق...">

    <h2>📋 مهام الفريق المخصصة</h2>
    <table id="tasks-table">
        <thead>
            <tr>
                <th style="width: 20%;">المسؤول</th>
                <th style="width: 50%;">تفاصيل المهمة / القطاعات</th>
                <th style="width: 20%;">التاريخ</th>
                <th style="width: 10%;">إجراء</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>📝 سجل الملاحظات العامة</h2>
    <table id="general-table">
        <thead>
            <tr>
                <th style="width: 70%;">الملاحظة</th>
                <th style="width: 20%;">التاريخ</th>
                <th style="width: 10%;">إجراء</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    // قائمة الأسماء
    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    
    let notesData = JSON.parse(localStorage.getItem('azemaaNotes')) || [];

    const noteBox = document.getElementById('note-box');
    const startBtn = document.getElementById('start-btn');
    const saveBtn = document.getElementById('save-btn');
    const searchInput = document.getElementById('search-input');
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    let isRecording = false;
    let originalText = ""; 

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = true;
        recognition.interimResults = true; 

        recognition.onstart = () => {
            startBtn.textContent = "جاري الاستماع... 🛑";
            startBtn.classList.add("recording");
            
            // بنحفظ الكلام اللي كان مكتوب قبل ما نضغط المايك
            originalText = noteBox.value;
            if (originalText && !originalText.endsWith(" ")) {
                originalText += " ";
            }
        };

        recognition.onresult = (event) => {
            let currentTranscript = '';
            
            // الطريقة الجديدة: بنقرأ كل الكلام اللي اتسجل في الجلسة دي من الصفر كل مرة
            // عشان نمنع متصفح الموبايل إنه يكرر الكلمات
            for (let i = 0; i < event.results.length; ++i) {
                currentTranscript += event.results[i][0].transcript;
            }
            
            // بنعرض الكلام القديم + الكلام الجديد الصافي
            noteBox.value = originalText + currentTranscript;
        };

        recognition.onend = () => {
            startBtn.textContent = "اضغط وتحدث 🎙️";
            startBtn.classList.remove("recording");
            isRecording = false;
        };

        startBtn.addEventListener('click', () => {
            if (!isRecording) {
                recognition.start();
                isRecording = true;
            } else {
                recognition.stop();
                isRecording = false;
            }
        });
    } else {
        startBtn.disabled = true;
        startBtn.textContent = "المتصفح لا يدعم الصوت";
        alert("يرجى استخدام متصفح Google Chrome لتعمل خاصية الصوت بشكل صحيح.");
    }

    saveBtn.addEventListener('click', () => {
        const text = noteBox.value.trim();
        if (!text) return alert("برجاء التحدث أو كتابة الملاحظة أولاً!");

        let assignedPerson = "عام";
        
        for (let name of teamMembers) {
            if (text.includes(name)) {
                assignedPerson = name;
                break;
            }
        }

        const newNote = {
            id: Date.now(),
            text: text,
            person: assignedPerson,
            date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' })
        };

        notesData.push(newNote);
        localStorage.setItem('azemaaNotes', JSON.stringify(notesData));
        
        noteBox.value = "";
        originalText = ""; 
        renderTables();
    });

    function deleteNote(id) {
        if(confirm("هل أنت متأكد من حذف هذه المهمة؟")) {
            notesData = notesData.filter(note => note.id !== id);
            localStorage.setItem('azemaaNotes', JSON.stringify(notesData));
            renderTables();
        }
    }

    function renderTables(searchQuery = "") {
        const tasksBody = document.querySelector('#tasks-table tbody');
        const generalBody = document.querySelector('#general-table tbody');
        
        tasksBody.innerHTML = "";
        generalBody.innerHTML = "";

        const filteredNotes = notesData.filter(note => 
            note.text.includes(searchQuery) || note.person.includes(searchQuery)
        );

        filteredNotes.forEach(note => {
            const row = `
                <tr>
                    ${note.person !== "عام" ? `<td><span class="badge">${note.person}</span></td>` : ""}
                    <td>${note.text}</td>
                    <td dir="ltr" style="text-align: right;">${note.date}</td>
                    <td><button class="delete-btn" onclick="deleteNote(${note.id})">حذف</button></td>
                </tr>
            `;

            if (note.person !== "عام") {
                tasksBody.innerHTML += row;
            } else {
                generalBody.innerHTML += row;
            }
        });
    }

    searchInput.addEventListener('input', (e) => {
        renderTables(e.target.value.trim());
    });

    renderTables();
</script>

</body>
</html>
