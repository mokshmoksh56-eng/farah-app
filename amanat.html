<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- إعدادات الشاشة لتطبيقات الموبايل لمنع التكبير العشوائي -->
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">
    <title>عزيمة برو - مطابخ فرح</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            color: #1c1e21; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e4e6eb; padding-bottom: 10px; }
        h1 { color: #1877f2; margin: 0 0 5px 0; font-size: 22px; }
        
        .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        #start-btn { 
            background-color: #1877f2; color: white; padding: 15px; font-size: 18px; 
            border: none; border-radius: 50px; cursor: pointer; font-weight: bold; 
            transition: all 0.3s ease; width: 100%;
        }
        #start-btn.recording { 
            background-color: #e41e3f !important; animation: pulse 1.5s infinite;
        }
        
        textarea { 
            padding: 12px; font-size: 16px; border-radius: 8px; border: 2px solid #ccd0d5; 
            resize: vertical; min-height: 80px; width: 100%; box-sizing: border-box;
        }
        
        #save-btn { 
            background-color: #25D366; color: white; padding: 12px; font-size: 18px; 
            border: none; border-radius: 8px; font-weight: bold; width: 100%;
        }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; background: white; font-size: 14px;}
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: right; }
        th { background-color: #f5f6f7; color: #606770; }
        .badge { background-color: #ff9f43; color: white; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
        .delete-btn { background-color: #e41e3f; padding: 5px 10px; font-size: 12px; border-radius: 6px; color: white; border: none; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(0.97); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>عزيمة برو - مطابخ فرح 🛠️</h1>
    </div>
    
    <div class="controls">
        <button id="start-btn">اضغط للتحدث 🎙️</button>
        <textarea id="note-box" placeholder="الكلام هيظهر هنا..."></textarea>
        <button id="save-btn">حفظ وتوزيع 💾</button>
    </div>

    <h2>📋 المهام الموزعة</h2>
    <table id="tasks-table">
        <thead><tr><th style="width: 25%;">الاسم</th><th style="width: 55%;">المهمة</th><th style="width: 20%;">إجراء</th></tr></thead>
        <tbody></tbody>
    </table>
</div>

<!-- ملف كوردوفا الأساسي (لا تحذفه، سيتم إنشاؤه تلقائياً عند بناء التطبيق) -->
<script src="cordova.js"></script>
<script>
    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء']; 
    let notesData = JSON.parse(localStorage.getItem('azemaaNotesOffline')) || [];
    let isRecording = false;

    // انتظار تحميل بيئة الموبايل بالكامل
    document.addEventListener('deviceready', onDeviceReady, false);

    function onDeviceReady() {
        const startBtn = document.getElementById('start-btn');
        const noteBox = document.getElementById('note-box');
        
        // التحقق من صلاحيات الميكروفون
        window.plugins.speechRecognition.hasPermission(function (hasPermission) {
            if (!hasPermission) {
                window.plugins.speechRecognition.requestPermission();
            }
        });

        startBtn.addEventListener('click', function() {
            if (!isRecording) {
                let options = {
                    language: "ar-EG",
                    showPopup: false,  // إخفاء نافذة جوجل المنبثقة
                    matches: 1       // إرجاع النتيجة النهائية فقط لمنع التكرار
                };

                window.plugins.speechRecognition.startListening(
                    function(result) {
                        // عند التقاط الصوت بنجاح
                        if(result && result.length > 0) {
                            noteBox.value += result[0] + " ";
                        }
                        stopRecordingUI();
                    }, 
                    function(error) {
                        console.error(error);
                        stopRecordingUI();
                    }, 
                    options
                );
                
                startRecordingUI();
            } else {
                window.plugins.speechRecognition.stopListening();
                stopRecordingUI();
            }
        });

        function startRecordingUI() {
            isRecording = true;
            startBtn.textContent = "جاري الاستماع... 🛑";
            startBtn.classList.add("recording");
        }

        function stopRecordingUI() {
            isRecording = false;
            startBtn.textContent = "اضغط للتحدث 🎙️";
            startBtn.classList.remove("recording");
        }
    }

    // --- وظائف الحفظ والجداول (كما هي) ---
    document.getElementById('save-btn').addEventListener('click', () => {
        const text = document.getElementById('note-box').value.trim();
        if (!text) return;
        let assignedPerson = "عام";
        for (let name of teamMembers) {
            if (text.includes(name)) { assignedPerson = name; break; }
        }
        notesData.push({ id: Date.now(), text: text, person: assignedPerson });
        localStorage.setItem('azemaaNotesOffline', JSON.stringify(notesData));
        document.getElementById('note-box').value = "";
        renderTables();
    });

    function deleteNote(id) {
        notesData = notesData.filter(note => note.id !== id);
        localStorage.setItem('azemaaNotesOffline', JSON.stringify(notesData));
        renderTables();
    }

    function renderTables() {
        const tasksBody = document.querySelector('#tasks-table tbody');
        tasksBody.innerHTML = "";
        notesData.forEach(note => {
            tasksBody.innerHTML += `<tr>
                <td><span class="badge">${note.person}</span></td>
                <td>${note.text}</td>
                <td><button class="delete-btn" onclick="deleteNote(${note.id})">حذف</button></td>
            </tr>`;
        });
    }
    renderTables();
</script>
</body>
</html>
