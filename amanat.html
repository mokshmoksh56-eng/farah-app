<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحليل الكمي القصوى (50 مؤشر - تشمل الشهري)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0e14; color: #d1d4dc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .widget-box { background: #151924; padding: 25px; margin-bottom: 25px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.6); border: 1px solid #2a2e39; }
        h1 { text-align: center; color: #f7931a; font-size: 28px; margin-bottom: 5px; }
        h2 { text-align: center; color: #8a93a6; font-size: 18px; margin-top: 0; margin-bottom: 25px; }
        
        .controls-group { display: flex; gap: 15px; margin-bottom: 20px; }
        .tf-select { background-color: #0b0e14; color: #d1d4dc; border: 1px solid #2962ff; padding: 15px; font-size: 16px; border-radius: 8px; flex: 1; outline: none; cursor: pointer; }
        .btn-analyze { background-color: #2962ff; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; flex: 3; transition: background-color 0.3s; }
        .btn-analyze:hover { background-color: #1e4bd8; }
        
        .dashboard-summary { display: flex; justify-content: space-between; background: #0b0e14; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #2a2e39; }
        .summary-item { text-align: center; flex: 1; border-left: 1px solid #2a2e39; }
        .summary-item:first-child { border-left: none; }
        .summary-item span { display: block; font-size: 14px; color: #8a93a6; margin-bottom: 8px; }
        .summary-item strong { font-size: 32px; }
        
        .final-decision { text-align: center; font-size: 28px; font-weight: bold; margin-top: 20px; padding: 20px; border-radius: 10px; background: #151924; border: 2px solid #2962ff; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .table-container { max-height: 800px; overflow-y: auto; margin-top: 25px; border-radius: 8px; border: 1px solid #2a2e39; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #2a2e39; padding: 12px 15px; text-align: center; }
        th { background-color: #0b0e14; color: #f7931a; font-size: 15px; position: sticky; top: 0; z-index: 1; }
        tr:hover { background-color: #1c212e; }
        
        .buy { color: #00e676; font-weight: bold; }
        .sell { color: #ff5252; font-weight: bold; }
        .neutral { color: #ffeb3b; font-weight: bold; }
        .no-data { color: #555; font-style: italic; }
        
        #loader { display: none; text-align: center; color: #2962ff; font-weight: bold; font-size: 18px; margin: 20px 0; }
        #resultsArea { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="widget-box">
            <h1>محرك التحليل الخوارزمي الشامل</h1>
            <h2>يعمل بقوة 50 مؤشراً رياضياً لتحديد أدق نقاط الدخول والخروج</h2>
            
            <div class="controls-group">
                <select id="timeframeSelect" class="tf-select">
                    <option value="15m">15 دقيقة (مضاربة)</option>
                    <option value="1h" selected>1 ساعة (متوسط)</option>
                    <option value="4h">4 ساعات (تأكيد)</option>
                    <option value="1d">1 يوم (استثمار)</option>
                    <option value="1M">شهري (اتجاه الماكرو)</option>
                </select>
                <button class="btn-analyze" onclick="run50IndicatorsAI()">🚀 تشغيل الخوارزمية واستخراج 50 مؤشر</button>
            </div>
            
            <div id="loader">جاري سحب البيانات ومعالجة المصفوفات الرياضية...</div>
            
            <div id="resultsArea"></div>
        </div>
    </div>

    <script>
        // --- الدوال الرياضية مع حماية البيانات المفقودة ---
        function calcSMA(data, period) {
            if(data.length < period) return null;
            return data.slice(-period).reduce((a, b) => a + b, 0) / period;
        }

        function calcEMA(data, period) {
            if(data.length < period) return null;
            let k = 2 / (period + 1);
            let ema = data[data.length - period]; 
            for (let i = data.length - period + 1; i < data.length; i++) {
                ema = (data[i] * k) + (ema * (1 - k));
            }
            return ema;
        }

        function calcWMA(data, period) {
            if(data.length < period) return null;
            let sum = 0;
            let weightSum = 0;
            let subset = data.slice(-period);
            for(let i = 0; i < period; i++) {
                let weight = i + 1;
                sum += subset[i] * weight;
                weightSum += weight;
            }
            return sum / weightSum;
        }

        // --- الدالة الرئيسية ---
        async function run50IndicatorsAI() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultsArea').style.display = 'none';
            const timeframe = document.getElementById('timeframeSelect').value;

            try {
                // سحب 300 شمعة
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${timeframe}&limit=300`);
                const data = await response.json();
                
                const closes = data.map(c => parseFloat(c[4]));
                const highs = data.map(c => parseFloat(c[2]));
                const lows = data.map(c => parseFloat(c[3]));
                const currentPrice = closes[closes.length - 1];

                let results = [];
                const periods = [5, 10, 15, 20, 30, 50, 75, 100, 150, 200]; 

                // 1 إلى 10: SMA
                periods.forEach(p => {
                    let val = calcSMA(closes, p);
                    if (val !== null) results.push({ name: `SMA (${p})`, val: val.toFixed(2), dec: currentPrice > val ? 'شراء' : 'بيع', type: 'متوسط بسيط' });
                    else results.push({ name: `SMA (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                });

                // 11 إلى 20: EMA
                periods.forEach(p => {
                    let val = calcEMA(closes, p);
                    if (val !== null) results.push({ name: `EMA (${p})`, val: val.toFixed(2), dec: currentPrice > val ? 'شراء' : 'بيع', type: 'متوسط أسي' });
                    else results.push({ name: `EMA (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                });

                // 21 إلى 30: WMA
                periods.forEach(p => {
                    let val = calcWMA(closes, p);
                    if (val !== null) results.push({ name: `WMA (${p})`, val: val.toFixed(2), dec: currentPrice > val ? 'شراء' : 'بيع', type: 'متوسط مرجح' });
                    else results.push({ name: `WMA (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                });

                // 31 إلى 35: RSI
                [7, 14, 21, 30, 50].forEach(p => {
                    if (closes.length < p + 1) {
                        results.push({ name: `RSI (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                        return;
                    }
                    let gains = 0, losses = 0;
                    for(let i = closes.length - p; i < closes.length; i++) {
                        let diff = closes[i] - closes[i - 1];
                        if(diff > 0) gains += diff; else losses -= diff;
                    }
                    let rs = (gains/p) / (losses/p || 1);
                    let rsi = 100 - (100 / (1 + rs));
                    let dec = rsi > 70 ? 'بيع' : rsi < 30 ? 'شراء' : 'محايد';
                    results.push({ name: `RSI (${p})`, val: rsi.toFixed(2), dec: dec, type: 'زخم وتشبع' });
                });

                // 36 إلى 39: CCI
                [14, 20, 40, 50].forEach(p => {
                    if (closes.length < p) {
                        results.push({ name: `CCI (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                        return;
                    }
                    let typicalPrices = highs.slice(-p).map((h, i) => (h + lows.slice(-p)[i] + closes.slice(-p)[i]) / 3);
                    let smaTp = typicalPrices.reduce((a, b) => a + b, 0) / p;
                    let meanDev = typicalPrices.reduce((a, b) => a + Math.abs(b - smaTp), 0) / p;
                    let currentTp = (highs[highs.length-1] + lows[lows.length-1] + currentPrice) / 3;
                    let cci = (currentTp - smaTp) / (0.015 * (meanDev || 1));
                    let dec = cci > 100 ? 'بيع' : cci < -100 ? 'شراء' : 'محايد';
                    results.push({ name: `CCI (${p})`, val: cci.toFixed(2), dec: dec, type: 'تذبذب السعر' });
                });

                // 40 إلى 43: ROC
                [9, 14, 21, 50].forEach(p => {
                    if (closes.length < p + 1) {
                        results.push({ name: `ROC (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                        return;
                    }
                    let pastPrice = closes[closes.length - 1 - p];
                    let roc = ((currentPrice - pastPrice) / pastPrice) * 100;
                    results.push({ name: `ROC (${p})`, val: roc.toFixed(2) + '%', dec: roc > 0 ? 'شراء' : 'بيع', type: 'سرعة التغير' });
                });

                // 44 إلى 46: Williams %R
                [14, 28, 50].forEach(p => {
                    if (closes.length < p) {
                        results.push({ name: `Williams %R (${p})`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                        return;
                    }
                    let recHighs = Math.max(...highs.slice(-p));
                    let recLows = Math.min(...lows.slice(-p));
                    let willR = ((recHighs - currentPrice) / (recHighs - recLows)) * -100;
                    let dec = willR > -20 ? 'بيع' : willR < -80 ? 'شراء' : 'محايد';
                    results.push({ name: `Williams %R (${p})`, val: willR.toFixed(2), dec: dec, type: 'زخم انعكاسي' });
                });

                // 47: MACD (12, 26)
                if (closes.length > 26) {
                    let ema12 = calcEMA(closes, 12);
                    let ema26 = calcEMA(closes, 26);
                    let macd = ema12 - ema26;
                    results.push({ name: `MACD (12, 26)`, val: macd.toFixed(2), dec: macd > 0 ? 'شراء' : 'بيع', type: 'تقاطع الزخم' });
                } else {
                    results.push({ name: `MACD (12, 26)`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                }

                // 48: Awesome Oscillator (AO)
                if (closes.length > 34) {
                    let medians = highs.map((h, i) => (h + lows[i]) / 2);
                    let ao = calcSMA(medians, 5) - calcSMA(medians, 34);
                    results.push({ name: `Awesome Oscillator`, val: ao.toFixed(2), dec: ao > 0 ? 'شراء' : 'بيع', type: 'زخم السوق' });
                } else {
                    results.push({ name: `Awesome Oscillator`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                }

                // 49 و 50: Bull & Bear Power (13)
                if (closes.length > 13) {
                    let ema13 = calcEMA(closes, 13);
                    let bullPower = highs[highs.length-1] - ema13;
                    let bearPower = lows[lows.length-1] - ema13;
                    results.push({ name: `Bull Power (13)`, val: bullPower.toFixed(2), dec: bullPower > 0 ? 'شراء' : 'بيع', type: 'قوة المشترين' });
                    results.push({ name: `Bear Power (13)`, val: bearPower.toFixed(2), dec: bearPower < 0 ? 'بيع' : 'شراء', type: 'قوة البائعين' });
                } else {
                    results.push({ name: `Bull Power (13)`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                    results.push({ name: `Bear Power (13)`, val: '-', dec: 'غير متاح', type: 'تاريخ غير كافٍ' });
                }

                // التجميع
                let buyCount = 0, sellCount = 0, neutralCount = 0, noDataCount = 0;
                
                let tableHTML = `
                    <div class="table-container">
                    <table>
                        <tr>
                            <th>م</th>
                            <th>اسم المؤشر</th>
                            <th>القراءة الرياضية</th>
                            <th>القرار</th>
                            <th>تصنيف المؤشر</th>
                        </tr>`;

                results.forEach((r, index) => {
                    let cssClass = r.dec === 'شراء' ? 'buy' : r.dec === 'بيع' ? 'sell' : r.dec === 'محايد' ? 'neutral' : 'no-data';
                    
                    if (r.dec === 'شراء') buyCount++;
                    else if (r.dec === 'بيع') sellCount++;
                    else if (r.dec === 'محايد') neutralCount++;
                    else noDataCount++;

                    tableHTML += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${r.name}</strong></td>
                            <td dir="ltr">${r.val}</td>
                            <td class="${cssClass}">${r.dec}</td>
                            <td style="color: #8a93a6; font-size:13px;">${r.type}</td>
                        </tr>`;
                });

                tableHTML += `</table></div>`;

                // استخراج النسبة المئوية بناءً على المؤشرات الصالحة فقط للشهري
                let validIndicators = 50 - noDataCount;
                let winRate = validIndicators > 0 ? ((buyCount / validIndicators) * 100).toFixed(0) : 0;
                
                let finalDecision = '';
                let finalClass = '';

                // تقييم ديناميكي لتفادي خطأ المؤشرات المفقودة
                let thresholdStrong = validIndicators * 0.70; // 70% من المؤشرات المتاحة
                let thresholdNormal = validIndicators * 0.52; // 52% 

                if (buyCount >= thresholdStrong) { finalDecision = '🔥 شراء عنيف (Strong Buy)'; finalClass = 'buy'; }
                else if (buyCount > thresholdNormal) { finalDecision = '📈 شراء (Buy)'; finalClass = 'buy'; }
                else if (sellCount >= thresholdStrong) { finalDecision = '🩸 بيع عنيف (Strong Sell)'; finalClass = 'sell'; }
                else if (sellCount > thresholdNormal) { finalDecision = '📉 بيع (Sell)'; finalClass = 'sell'; }
                else { finalDecision = '⚖️ تذبذب ومحايد (Neutral)'; finalClass = 'neutral'; }

                let summaryHTML = `
                    <div class="dashboard-summary">
                        <div class="summary-item">
                            <span>السعر المباشر اللحظي</span>
                            <strong style="color: #f7931a;">${currentPrice.toFixed(2)} USDT</strong>
                        </div>
                        <div class="summary-item">
                            <span>إشارات الشراء</span>
                            <strong class="buy">${buyCount}</strong>
                        </div>
                        <div class="summary-item">
                            <span>إشارات البيع</span>
                            <strong class="sell">${sellCount}</strong>
                        </div>
                        <div class="summary-item">
                            <span>محايد / غير متاح</span>
                            <strong class="neutral">${neutralCount} / <span class="no-data">${noDataCount}</span></strong>
                        </div>
                    </div>
                    
                    <div class="final-decision" style="border-color: ${finalClass === 'buy' ? '#00e676' : finalClass === 'sell' ? '#ff5252' : '#ffeb3b'}; color: ${finalClass === 'buy' ? '#00e676' : finalClass === 'sell' ? '#ff5252' : '#ffeb3b'}">
                        نسبة ثقة الخوارزمية في الشراء: ${winRate}%<br>
                        القرار النهائي للإدارة: ${finalDecision}
                    </div>
                `;

                document.getElementById('loader').style.display = 'none';
                const resultsArea = document.getElementById('resultsArea');
                resultsArea.innerHTML = summaryHTML + tableHTML;
                resultsArea.style.display = 'block';

            } catch (error) {
                console.error(error);
                document.getElementById('loader').innerHTML = '<span style="color:#ff5252;">❌ فشل الاتصال بسيرفرات التداول. يرجى التحقق من اتصال الإنترنت.</span>';
            }
        }
    </script>
</body>
</html>
