<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - حاسبة مطابخ فرح 🤖</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; border-bottom: 3px solid #e74c3c; padding-bottom: 10px; margin-bottom: 20px; }
        .ai-section { background: #f8f9fa; border: 2px dashed #3498db; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 25px; }
        .upload-btn { background-color: #27ae60; color: white; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; display: inline-block; }
        input[type="file"] { display: none; }
        #imagePreview { max-width: 100%; max-height: 200px; margin-top: 15px; border-radius: 8px; display: none; }
        .loader { display: none; margin: 15px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button.calc-btn { width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #2c3e50; color: white; }
        .section-title { background-color: #34495e; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>روبوت Azemaa Pro للمطابخ 🤖</h2>
    
    <div class="ai-section">
        <label for="imageUpload" class="upload-btn">📸 اختر صورة الكروكي</label>
        <input type="file" id="imageUpload" accept="image/*" onchange="processImage(event)">
        <img id="imagePreview" alt="كروكي المقاسات">
        <div class="loader" id="aiLoader"></div>
        <p id="aiStatus" style="color: #e74c3c; margin-top: 10px; font-weight: bold; display: none;"></p>
    </div>

    <div class="form-group">
        <label>الارتفاع الخارجي (سم):</label>
        <input type="number" id="externalHeight">
    </div>
    <div class="form-group">
        <label>العرض الخارجي (سم):</label>
        <input type="number" id="externalWidth">
    </div>
    <div class="form-group">
        <label>العمق الخارجي (سم):</label>
        <input type="number" id="externalDepth">
    </div>
    <div class="form-group">
        <label>نوع التقفيل:</label>
        <select id="unitType">
            <option value="single">ضلفة واحدة</option>
            <option value="double">ضلفتين (2)</option>
        </select>
    </div>

    <button class="calc-btn" onclick="calculateFinalSizes()">✂️ احسب مقاسات التقطيع</button>

    <table id="resultTable" style="display:none;">
        <thead><tr><th>البيان (قطعة التقطيع)</th><th>المقاس (سم)</th><th>العدد</th></tr></thead>
        <tbody id="resultBody"></tbody>
    </table>
</div>

<script>
    const API_KEY = "حط_مفتاحك_هنا";

    async function processImage(event) {
        let input = event.target;
        if (!input.files || !input.files[0]) return;

        let preview = document.getElementById('imagePreview');
        let loader = document.getElementById('aiLoader');
        let status = document.getElementById('aiStatus');

        let reader = new FileReader();
        reader.onload = async function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
            loader.style.display = 'block';
            status.style.display = 'block';
            status.style.color = "#e74c3c";
            status.innerText = "جاري تحليل الصورة واستخراج المقاسات...";

            let base64Image = e.target.result.split(',')[1];

            try {
                let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `استخرج المقاسات من هذا الكروكي. ابحث عن الارتفاع، والعرض، والعمق، ورقم يدل على عدد الضلف (1 أو 2). 
                                رُد بصيغة JSON فقط بهذا الشكل:
                                {"height": رقم, "width": رقم, "depth": رقم, "doors": رقم}` },
                                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                            ]
                        }]
                    })
                });

                let data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                let cleanJson = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                let extractedData = JSON.parse(cleanJson);

                document.getElementById('externalHeight').value = extractedData.height || '';
                document.getElementById('externalWidth').value = extractedData.width || '';
                document.getElementById('externalDepth').value = extractedData.depth || '';
                document.getElementById('unitType').value = (extractedData.doors == 2) ? 'double' : 'single';

                loader.style.display = 'none';
                status.style.color = "#27ae60";
                status.innerText = "تم استخراج المقاسات بنجاح!";
                
            } catch (error) {
                loader.style.display = 'none';
                status.innerText = "حدث خطأ. يرجى إدخال المقاسات يدوياً.";
            }
        }
        reader.readAsDataURL(input.files[0]);
    }

    function calculateFinalSizes() {
        let extH = parseFloat(document.getElementById('externalHeight').value);
        let extW = parseFloat(document.getElementById('externalWidth').value);
        let extD = parseFloat(document.getElementById('externalDepth').value);
        let type = document.getElementById('unitType').value;
        let resultBody = document.getElementById('resultBody');
        let resultTable = document.getElementById('resultTable');
        
        if (isNaN(extH) || isNaN(extW) || isNaN(extD)) {
            alert("يرجى إدخال (الارتفاع، العرض، والعمق) بشكل صحيح!");
            return;
        }

        resultBody.innerHTML = ""; 
        resultTable.style.display = "table";

        // 1. حسابات الشاسيه (بافتراض عود 2.5 سم)
        resultBody.innerHTML += `<tr><td colspan="3" class="section-title">تقطيع الشاسيه (علبة 2.5 سم)</td></tr>`;
        addRow('قوايم الارتفاع', extH.toFixed(1), '4');
        addRow('عوارض العرض', (extW - 5).toFixed(1), '4');
        addRow('عوارض العمق', (extD - 5).toFixed(1), '4');

        // 2. حسابات الضلف والفيبر
        resultBody.innerHTML += `<tr><td colspan="3" class="section-title">الضلف والفيبر</td></tr>`;
        let innerH = extH - 5;
        let innerW = extW - 5;

        if (type === 'single') {
            let doorH = innerH + 2.5;
            let doorW = innerW + 2.5;
            addRow('الضلفة (ارتفاع × عرض)', `${doorH.toFixed(1)} × ${doorW.toFixed(1)}`, '1');
            addRow('فيبر الضلفة (ارتفاع × عرض)', `${(doorH - 0.2).toFixed(1)} × ${(doorW - 0.2).toFixed(1)}`, '1');
        } else if (type === 'double') {
            let doorH = innerH + 2.5;
            let doorW = (innerW + 2.6) / 2;
            addRow('الضلفة (ارتفاع × عرض)', `${doorH.toFixed(1)} × ${doorW.toFixed(1)}`, '2');
            addRow('فيبر الضلفة (ارتفاع × عرض)', `${(doorH - 0.2).toFixed(1)} × ${(doorW - 0.2).toFixed(1)}`, '2');
        }
    }

    function addRow(name, size, count) {
        document.getElementById('resultBody').innerHTML += `<tr><td>${name}</td><td>${size}</td><td>${count}</td></tr>`;
    }
</script>

</body>
</html>
