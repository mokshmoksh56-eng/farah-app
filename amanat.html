<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - AI Kitchen Calculator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            border-bottom: 3px solid #e74c3c;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .ai-section {
            background: #f8f9fa;
            border: 2px dashed #3498db;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .ai-section p {
            margin: 0 0 15px;
            font-weight: bold;
            color: #2980b9;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            display: inline-block;
        }
        #imagePreview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 8px;
            display: none;
        }
        .loader {
            display: none;
            margin: 15px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"], select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box;
        }
        button.calc-btn {
            width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s;
        }
        button.calc-btn:hover { background-color: #2980b9; }
        
        table { width: 100%; margin-top: 20px; border-collapse: collapse; text-align: center; }
        th, td { border: 1px solid #ddd; padding: 12px; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) {background-color: #f2f2f2;}
        .note { font-size: 12px; color: #7f8c8d; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>روبوت Azemaa Pro للمطابخ 🤖</h2>
    
    <!-- قسم الذكاء الاصطناعي لرفع الصورة -->
    <div class="ai-section">
        <p>ارفع كروكي المقاسات والذكاء الاصطناعي هيستخرجها</p>
        <label for="imageUpload" class="upload-btn">📸 اختر صورة الكروكي</label>
        <input type="file" id="imageUpload" accept="image/*" onchange="previewAndAnalyze(event)">
        <img id="imagePreview" alt="كروكي المقاسات">
        <div class="loader" id="aiLoader"></div>
        <p id="aiStatus" style="color: #e74c3c; margin-top: 10px; font-size: 14px; font-weight: bold; display: none;"></p>
    </div>

    <!-- حقول المقاسات (ممكن تتملي يدوي أو الذكاء الاصطناعي يملاها) -->
    <div class="form-group">
        <label for="externalHeight">الارتفاع الخارجي الإجمالي (سم):</label>
        <input type="number" id="externalHeight" step="0.1">
    </div>

    <div class="form-group">
        <label for="externalWidth">العرض الخارجي الإجمالي (سم):</label>
        <input type="number" id="externalWidth" step="0.1">
    </div>

    <div class="form-group">
        <label for="unitType">نوع التقفيل المستخرج:</label>
        <select id="unitType">
            <option value="single">ضلفة واحدة</option>
            <option value="double">ضلفتين (2)</option>
        </select>
    </div>

    <button class="calc-btn" onclick="calculateFinalSizes()">✂️ احسب مقاسات التقطيع</button>

    <table id="resultTable" style="display:none;">
        <thead>
            <tr>
                <th>البيان</th>
                <th>العرض (سم)</th>
                <th>الارتفاع (سم)</th>
            </tr>
        </thead>
        <tbody id="resultBody"></tbody>
    </table>
    
    <div class="note">ملحوظة: المقاسات مبنية على خصم 5 سم للشاسيه و 2 مللي للفيبر</div>
</div>

<script>
    // 1. دالة رفع الصورة ومحاكاة الذكاء الاصطناعي
    function previewAndAnalyze(event) {
        let input = event.target;
        let preview = document.getElementById('imagePreview');
        let loader = document.getElementById('aiLoader');
        let status = document.getElementById('aiStatus');

        if (input.files && input.files[0]) {
            let reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                
                // تشغيل تأثير التحميل
                loader.style.display = 'block';
                status.style.display = 'block';
                status.innerText = "جاري تحليل الصورة بخوارزميات الذكاء الاصطناعي...";

                // محاكاة الاتصال بالخادم (تأخير 3 ثواني ثم إظهار النتيجة)
                setTimeout(() => {
                    loader.style.display = 'none';
                    status.innerText = "تم استخراج المقاسات بنجاح!";
                    status.style.color = "#27ae60";

                    // هنا بنحط الأرقام اللي طلعناها من رسمتك كمثال توضيحي
                    document.getElementById('externalHeight').value = 70;
                    document.getElementById('externalWidth').value = 50;
                    document.getElementById('unitType').value = 'double'; // بناءً على رقم 2 في الكروكي

                }, 3000);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    // 2. دوال الحساب بناءً على معادلاتك
    function calculateFinalSizes() {
        let extH = parseFloat(document.getElementById('externalHeight').value);
        let extW = parseFloat(document.getElementById('externalWidth').value);
        let type = document.getElementById('unitType').value;
        let resultBody = document.getElementById('resultBody');
        let resultTable = document.getElementById('resultTable');
        
        if (isNaN(extH) || isNaN(extW)) {
            alert("يرجى التأكد من استخراج أو إدخال المقاسات!");
            return;
        }

        // تحويل الخارجي لداخلي (صافي) بخصم 5 سم
        let innerH = extH - 5;
        let innerW = extW - 5;

        resultBody.innerHTML = ""; 
        resultTable.style.display = "table";

        if (type === 'single') {
            let doorH = innerH + 2.5;
            let doorW = innerW + 2.5;
            let fiberH = doorH - 0.2;
            let fiberW = doorW - 0.2;

            addRow('الضلفة (عدد 1)', doorW.toFixed(1), doorH.toFixed(1));
            addRow('فيبر الضلفة', fiberW.toFixed(1), fiberH.toFixed(1));
        
        } else if (type === 'double') {
            let doorH = innerH + 2.5;
            let doorW = (innerW + 2.6) / 2;
            let fiberH = doorH - 0.2;
            let fiberW = doorW - 0.2;

            addRow('الضلفة (عدد 2 ضلفة)', doorW.toFixed(1), doorH.toFixed(1));
            addRow('فيبر الضلفة (عدد 2)', fiberW.toFixed(1), fiberH.toFixed(1));
        }
    }

    function addRow(name, width, height) {
        let tbody = document.getElementById('resultBody');
        let row = `<tr><td>${name}</td><td>${width}</td><td>${height}</td></tr>`;
        tbody.innerHTML += row;
    }
</script>

</body>
</html>
