<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شاشات البيتكوين | التنبيهات وسيولة الحيتان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-2 md:p-4 font-sans">
    
    <!-- أصوات التنبيهات (بصيغة Base64 لتعمل بدون ملفات خارجية) -->
    <audio id="alertSoundNormal" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    <audio id="alertSoundWhale" src="https://assets.mixkit.co/active_storage/sfx/2868/2868-preview.mp3" preload="auto"></audio>

    <div class="max-w-[1800px] mx-auto space-y-6">
        
        <!-- لوحة التحكم العلوية -->
        <div class="bg-slate-900 p-6 rounded-xl border-2 border-indigo-900 shadow-2xl relative overflow-hidden flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400 flex items-center gap-2 mb-2">
                    <span>🧠 خوارزمية SMC + فلتر سيولة الحيتان (⭐)</span>
                </h1>
                <p class="text-sm text-slate-400">أي إشارة بجانبها <span class="text-amber-400 font-bold">⭐</span> تعني أن الكسر أو الفخ مدعوم بضخ سيولة ضخمة (حجم تداول يفوق المتوسط بـ 150%). هذه هي الصفقات الأقوى.</p>
            </div>
            <div class="flex gap-3">
                <button id="soundToggleBtn" onclick="toggleSound()" class="bg-rose-500/20 text-rose-400 border border-rose-500 font-bold px-6 py-3 rounded-lg text-sm transition shadow-lg hover:bg-rose-500/40 flex items-center gap-2 cursor-pointer">
                    <span id="soundIcon">🔕</span> <span id="soundText">تفعيل التنبيهات الصوتية</span>
                </button>
            </div>
        </div>
        
        <!-- شبكة الرسوم البيانية -->
        <div id="charts-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-3 gap-4 mt-4">
            <!-- سيتم حقن الشاشات هنا -->
        </div>
    </div>

    <script>
        const timeframes = [
            { interval: "5m", title: "5 دقائق (مضاربة سريعة)" },
            { interval: "15m", title: "15 دقيقة (نطاق يومي)" },
            { interval: "30m", title: "30 دقيقة" },
            { interval: "1h", title: "1 ساعة (اتجاه قصير)" },
            { interval: "4h", title: "4 ساعات (اتجاه متوسط)" }, 
            { interval: "1d", title: "يوم واحد (اتجاه عام)" }
        ];

        const intervalMsMap = {
            "5m": 5 * 60 * 1000, "15m": 15 * 60 * 1000, "30m": 30 * 60 * 1000,
            "1h": 60 * 60 * 1000, "4h": 4 * 60 * 60 * 1000, "1d": 24 * 60 * 60 * 1000
        };

        const chartsState = {}; 
        let soundEnabled = false;

        // تفعيل وإلغاء التنبيهات الصوتية
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');
            
            if (soundEnabled) {
                btn.className = "bg-emerald-500/20 text-emerald-400 border border-emerald-500 font-bold px-6 py-3 rounded-lg text-sm transition shadow-lg hover:bg-emerald-500/40 flex items-center gap-2 cursor-pointer";
                icon.innerText = "🔔";
                text.innerText = "التنبيهات مفعلة";
                // تشغيل صامت لتفعيل الصلاحية في المتصفح
                document.getElementById('alertSoundNormal').play().catch(()=>{});
            } else {
                btn.className = "bg-rose-500/20 text-rose-400 border border-rose-500 font-bold px-6 py-3 rounded-lg text-sm transition shadow-lg hover:bg-rose-500/40 flex items-center gap-2 cursor-pointer";
                icon.innerText = "🔕";
                text.innerText = "تفعيل التنبيهات الصوتية";
            }
        }

        function playAlert(isWhale) {
            if (!soundEnabled) return;
            const audio = document.getElementById(isWhale ? 'alertSoundWhale' : 'alertSoundNormal');
            audio.currentTime = 0;
            audio.play().catch(e => console.log("الصوت محظور من المتصفح"));
        }

        async function initCharts() {
            const gridContainer = document.getElementById('charts-grid');

            for (let tf of timeframes) {
                const chartCard = document.createElement('div');
                chartCard.className = "bg-slate-900 rounded-xl border border-slate-800 overflow-hidden flex flex-col shadow-lg";
                
                const header = document.createElement('div');
                header.className = "bg-slate-800 border-b border-slate-700 p-3 flex justify-between items-center";
                header.innerHTML = `
                    <span class="text-sm font-bold text-white">${tf.title}</span> 
                    <div class="flex items-center gap-3">
                        <span id="timer-${tf.interval}" class="text-cyan-400 font-mono text-sm font-bold bg-slate-950 px-2 py-1 rounded border border-slate-700 shadow-inner">⏳ --:--</span>
                    </div>
                `;
                
                const chartDiv = document.createElement('div');
                chartDiv.className = "w-full h-[400px] relative"; 
                
                chartCard.appendChild(header);
                chartCard.appendChild(chartDiv);
                gridContainer.appendChild(chartCard);

                const chart = LightweightCharts.createChart(chartDiv, {
                    autoSize: true,
                    layout: { background: { type: 'solid', color: '#0f172a' }, textColor: '#94a3b8' },
                    grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
                    timeScale: { timeVisible: true, borderColor: '#334155', rightOffset: 10 },
                    crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
                });

                const candleSeries = chart.addCandlestickSeries({ upColor: '#10b981', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10b981', wickDownColor: '#ef4444' });
                const topTrendLine = chart.addLineSeries({ color: '#fbbf24', lineWidth: 1, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });
                const bottomTrendLine = chart.addLineSeries({ color: '#22d3ee', lineWidth: 1, crosshairMarkerVisible: false, lastValueVisible: false, priceLineVisible: false });

                chartsState[tf.interval] = {
                    chart, candleSeries, topTrendLine, bottomTrendLine,
                    data: [], resLineObj: null, supLineObj: null,
                    lastAlertedCandleTime: 0 // لمنع تكرار الصوت لنفس الشمعة
                };

                await fetchHistoricalData(tf.interval);
            }
            connectMultiplexWebSocket();
            setInterval(updateCountdowns, 1000);
        }

        function updateCountdowns() {
            const now = Date.now();
            timeframes.forEach(tf => {
                const ms = intervalMsMap[tf.interval];
                const nextClose = Math.ceil(now / ms) * ms;
                let diff = nextClose - now;

                let h = Math.floor(diff / (1000 * 60 * 60));
                let m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                let s = Math.floor((diff % (1000 * 60)) / 1000);

                let timeString = h > 0 ? `${h.toString().padStart(2, '0')}:` : "";
                timeString += `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

                const timerEl = document.getElementById(`timer-${tf.interval}`);
                if (timerEl) {
                    if (h === 0 && m === 0 && s <= 15) {
                        timerEl.className = "text-rose-400 font-mono text-sm font-bold bg-rose-950/30 px-2 py-1 rounded border border-rose-500/50 shadow-inner animate-pulse";
                    } else {
                        timerEl.className = "text-cyan-400 font-mono text-sm font-bold bg-slate-950 px-2 py-1 rounded border border-slate-700 shadow-inner";
                    }
                    timerEl.innerText = `⏳ ${timeString}`;
                }
            });
        }

        async function fetchHistoricalData(interval) {
            try {
                // جلب البيانات مع الفوليوم (مؤشر 5)
                const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=200`);
                const data = await res.json();
                
                const state = chartsState[interval];
                state.data = data.map(d => ({
                    time: Math.floor(d[0] / 1000), 
                    open: parseFloat(d[1]), high: parseFloat(d[2]), low: parseFloat(d[3]), close: parseFloat(d[4]),
                    volume: parseFloat(d[5])
                }));

                recalculateAndDraw(interval);
            } catch (e) { console.error(e); }
        }

        // ==========================================
        // 🧠 الخوارزمية العميقة مع فلتر السيولة (Volume Anomaly)
        // ==========================================
        function recalculateAndDraw(interval) {
            const state = chartsState[interval];
            const candles = state.data;
            if (candles.length < 20) return;

            const swingHighs = [];
            const swingLows = [];
            let markers = [];
            const lookback = 3; 

            // تحديد القمم والقيعان
            for (let i = lookback; i < candles.length - lookback; i++) {
                let isSwingHigh = true, isSwingLow = true;
                const cHigh = candles[i].high, cLow = candles[i].low;

                for (let j = 1; j <= lookback; j++) {
                    if (cHigh <= candles[i - j].high || cHigh <= candles[i + j].high) isSwingHigh = false;
                    if (cLow >= candles[i - j].low || cLow >= candles[i + j].low) isSwingLow = false;
                }
                if (isSwingHigh) swingHighs.push({ index: i, time: candles[i].time, value: cHigh });
                if (isSwingLow) swingLows.push({ index: i, time: candles[i].time, value: cLow });
            }

            let inSqueeze = false;
            let currentSignalSounded = false;

            for (let i = lookback; i < candles.length; i++) {
                let current = candles[i];
                let prev = candles[i-1];
                
                // حساب متوسط الفوليوم لآخر 20 شمعة لاختبار سيولة الحيتان
                let volSum = 0;
                for(let v = Math.max(0, i-20); v < i; v++) volSum += candles[v].volume;
                let avgVol = volSum / 20;
                let isWhaleVolume = current.volume > (avgVol * 1.5); // حجم يفوق المتوسط بـ 150%
                let star = isWhaleVolume ? "⭐ " : "";
                
                let recentHigh = swingHighs.filter(h => h.index < i).pop();
                let recentLow = swingLows.filter(l => l.index < i).pop();
                
                let hasSignal = false;
                let signalType = null;

                // --- استراتيجية الفخاخ ---
                if (recentHigh && recentLow) {
                    if (current.high > recentHigh.value && current.close < recentHigh.value && current.close < current.open) {
                        markers.push({ time: current.time, position: 'aboveBar', color: '#ef4444', shape: 'arrowDown', text: `${star}🩸 فخ بيع` });
                        hasSignal = true; signalType = 'bearish';
                    }
                    else if (current.low < recentLow.value && current.close > recentLow.value && current.close > current.open) {
                        markers.push({ time: current.time, position: 'belowBar', color: '#10b981', shape: 'arrowUp', text: `${star}🟢 فخ شراء` });
                        hasSignal = true; signalType = 'bullish';
                    }
                }

                // --- استراتيجية الانفجار ---
                let oldDist = (recentHigh && recentLow) ? (recentHigh.value - recentLow.value) : null;
                if (oldDist && (current.high - current.low) <= oldDist * 0.4) inSqueeze = true;

                if (inSqueeze) {
                    if (current.close > current.open && current.close > prev.high && current.open < prev.close) {
                        markers.push({ time: current.time, position: 'belowBar', color: '#3b82f6', shape: 'arrowUp', text: `${star}🚀 صعود مؤكد` });
                        inSqueeze = false;
                        hasSignal = true; signalType = 'bullish';
                    }
                    else if (current.close < current.open && current.close < prev.low && current.open > prev.close) {
                        markers.push({ time: current.time, position: 'aboveBar', color: '#f97316', shape: 'arrowDown', text: `${star}💥 هبوط مؤكد` });
                        inSqueeze = false;
                        hasSignal = true; signalType = 'bearish';
                    }
                }

                // إطلاق التنبيه الصوتي فقط إذا كانت الشمعة هي الحالية (الحية) ولم يتم التنبيه عليها مسبقاً
                if (hasSignal && i === candles.length - 1 && state.lastAlertedCandleTime !== current.time) {
                    playAlert(isWhaleVolume);
                    state.lastAlertedCandleTime = current.time;
                }
            }

            state.candleSeries.setData(candles);
            state.candleSeries.setMarkers(markers);

            const lastConfirmedHigh = swingHighs.length > 0 ? swingHighs[swingHighs.length - 1].value : null;
            const lastConfirmedLow = swingLows.length > 0 ? swingLows[swingLows.length - 1].value : null;

            if (state.resLineObj) state.candleSeries.removePriceLine(state.resLineObj);
            if (lastConfirmedHigh) {
                state.resLineObj = state.candleSeries.createPriceLine({ price: lastConfirmedHigh, color: '#ef4444', lineWidth: 2, lineStyle: 2, title: 'مقاومة' });
            }

            if (state.supLineObj) state.candleSeries.removePriceLine(state.supLineObj);
            if (lastConfirmedLow) {
                state.supLineObj = state.candleSeries.createPriceLine({ price: lastConfirmedLow, color: '#10b981', lineWidth: 2, lineStyle: 2, title: 'دعم' });
            }
            
            const lastCandle = candles[candles.length - 1];
            let topData = swingHighs.map(h => ({time: h.time, value: h.value}));
            let botData = swingLows.map(l => ({time: l.time, value: l.value}));
            
            if (topData.length > 0 && lastCandle.time >= topData[topData.length-1].time) topData.push({ time: lastCandle.time, value: lastCandle.high });
            if (botData.length > 0 && lastCandle.time >= botData[botData.length-1].time) botData.push({ time: lastCandle.time, value: lastCandle.low });

            state.topTrendLine.setData(topData);
            state.bottomTrendLine.setData(botData);
        }

        // ==========================================
        // اتصال حي لتحديث الرسوم البيانية بالثانية
        // ==========================================
        function connectMultiplexWebSocket() {
            const streams = timeframes.map(tf => `btcusdt@kline_${tf.interval}`).join('/');
            const wsUrl = `wss://stream.binance.com:9443/stream?streams=${streams}`;
            const ws = new WebSocket(wsUrl);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                
                if (msg.stream && msg.stream.includes('kline')) {
                    const interval = msg.data.k.i;
                    const k = msg.data.k;
                    const state = chartsState[interval];
                    if (!state) return;

                    const time = Math.floor(k.t / 1000);
                    const updatedCandle = {
                        time: time, open: parseFloat(k.o), high: parseFloat(k.h), low: parseFloat(k.l), close: parseFloat(k.c), volume: parseFloat(k.v)
                    };

                    const lastDataIndex = state.data.length - 1;
                    if (state.data[lastDataIndex].time === time) {
                        state.data[lastDataIndex] = updatedCandle; 
                    } else {
                        state.data.push(updatedCandle); 
                        if(state.data.length > 300) state.data.shift();
                    }
                    recalculateAndDraw(interval);
                }
            };
            ws.onclose = () => setTimeout(connectMultiplexWebSocket, 3000);
        }

        window.addEventListener('DOMContentLoaded', initCharts);
    </script>
</body>
</html>
