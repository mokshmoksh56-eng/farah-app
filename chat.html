<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>شات الفنيين - مفتوح للجميع</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 550px;
            background-color: #ffffff;
            height: 95vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .header {
            background-color: #075e54;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #128c7e;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .edit-name {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .online-count {
            font-size: 13px;
            background: #25d366;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .connection-status {
            font-size: 11px;
            color: #ffeb3b;
            width: 100%;
            text-align: center;
            margin-top: 4px;
        }
        .sub-header {
            background-color: #e5ddd5;
            text-align: center;
            padding: 5px;
            font-size: 12px;
            color: #54656f;
            font-weight: bold;
            border-bottom: 1px solid #d1d7db;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            z-index: 2;
        }
        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background-color: #e5ddd5; 
            background-image: radial-gradient(#cad1d7 1.5px, transparent 1.5px), radial-gradient(#cad1d7 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .sender-me {
            background-color: #dcf8c6;
            align-self: flex-start;
            border-top-left-radius: 5px;
        }
        .sender-other {
            background-color: #ffffff; 
            align-self: flex-end;
            border-top-right-radius: 5px;
        }
        .message-name {
            font-size: 12px;
            font-weight: bold;
            color: #075e54;
            display: block;
            margin-bottom: 4px;
        }
        .message-time {
            font-size: 10px;
            color: #777;
            text-align: left;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-msg {
            color: red;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
            opacity: 0.7;
        }
        .reply-badge {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 6px;
            border-right: 3px solid #075e54;
        }
        .chat-input {
            background: #f0f0f0;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-wrap: wrap;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            background: white;
            border-radius: 30px;
            padding: 5px 12px;
            align-items: center;
            border: 1px solid #ccc;
        }
        #messageInput {
            flex: 1;
            border: none;
            padding: 10px;
            outline: none;
            font-size: 15px;
            background: transparent;
        }
        .emoji-picker {
            display: flex;
            gap: 5px;
            background: white;
            border-radius: 30px;
            padding: 0 8px;
        }
        .emoji-btn {
            cursor: pointer;
            font-size: 20px;
            background: none;
            border: none;
        }
        .send-btn {
            background-color: #128c7e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 18px;
        }
        .typing-indicator {
            font-size: 12px;
            padding: 4px 12px;
            color: #555;
            font-style: italic;
        }
        audio { display: none; }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">
        <div class="user-info">
            <span id="userNameDisplay">فني_???</span>
            <button id="editNameBtn" class="edit-name">✏️</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button id="muteBtn" class="edit-name" onclick="window.toggleMute()" title="كتم/تشغيل الصوت">🔊</button>
            <span id="onlineCount" class="online-count">🟢 0</span>
        </div>
        <div id="connStatus" class="connection-status">جاري تهيئة الاتصال...</div>
    </div>
    
    <div class="sub-header">
        تجمع خاص للفنيين 🛠️
    </div>

    <div class="chat-messages" id="chatMessages"></div>
    <div id="typingIndicator" class="typing-indicator"></div>
    <div class="chat-input">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="اكتب رسالة...">
            <div class="emoji-picker">
                <button class="emoji-btn" onclick="window.addEmoji('😊')">😊</button>
                <button class="emoji-btn" onclick="window.addEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="window.addEmoji('❤️')">❤️</button>
                <button class="emoji-btn" onclick="window.addEmoji('👍')">👍</button>
            </div>
        </div>
        <button class="send-btn" onclick="window.sendTextMessage()">➤</button>
    </div>
</div>
<audio id="notificationSound" preload="auto">
    <!-- استخدام مسار صوت مباشر وموثوق -->
    <source src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" type="audio/mpeg">
</audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, onChildAdded, onChildRemoved, set, onDisconnect, remove, serverTimestamp, get, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    
    let app, db;
    try {
        app = initializeApp(firebaseConfig);
        db = getDatabase(app);
    } catch(e) {
        alert("خطأ في تهيئة فايربيز: " + e.message);
    }

    const ROOM_NAME = "public_chat";

    let currentUser = localStorage.getItem("technicianName");
    if (!currentUser) {
        currentUser = "فني_" + Math.floor(Math.random() * 10000);
        localStorage.setItem("technicianName", currentUser);
    }

    let typingTimeout = null;
    let currentReplyTo = null;
    let isMuted = false;
    let isInitialLoad = true; // لمنع رنين الرسائل القديمة عند فتح الشات

    document.getElementById("userNameDisplay").innerText = currentUser;

    document.getElementById("editNameBtn").addEventListener("click", () => {
        let newName = prompt("أدخل اسمك الجديد:", currentUser);
        if(newName && newName.trim() !== "") {
            currentUser = newName.trim();
            localStorage.setItem("technicianName", currentUser); 
            document.getElementById("userNameDisplay").innerText = currentUser;
            updatePresenceAfterNameChange();
        }
    });

    window.toggleMute = () => {
        isMuted = !isMuted;
        const btn = document.getElementById("muteBtn");
        btn.innerText = isMuted ? "🔇" : "🔊";
    };

    // فك حظر الصوت في المتصفحات بمجرد لمس الشاشة لأول مرة
    document.body.addEventListener('click', function unlockAudio() {
        const sound = document.getElementById("notificationSound");
        sound.play().then(() => {
            sound.pause();
            sound.currentTime = 0;
        }).catch(err => {});
        document.body.removeEventListener('click', unlockAudio);
    }, { once: true });

    function updatePresenceAfterNameChange() {
        if(!db) return;
        const pRef = ref(db, `presence/${ROOM_NAME}/${currentUser}`);
        set(pRef, true);
        remove(ref(db, `typing/${ROOM_NAME}/${currentUser}`));
        setupPresence();
    }

    if (app && db) {
        initChat();
    }

    function initChat() {
        loadMessages();
        setupTyping();
        setupPresence();

        const inputField = document.getElementById("messageInput");
        inputField.addEventListener("keydown", (e) => {
            if(e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                window.sendTextMessage();
            }
        });
        inputField.addEventListener("input", () => {
            const tRef = ref(db, `typing/${ROOM_NAME}/${currentUser}`);
            set(tRef, true);
            if(typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                remove(tRef);
            }, 1500);
        });
        
        // إيقاف الرنين للرسائل القديمة بعد ثانيتين من فتح الصفحة
        setTimeout(() => { isInitialLoad = false; }, 2000);
    }

    window.addEmoji = (emoji) => {
        const input = document.getElementById("messageInput");
        input.value += emoji;
        input.focus();
    };

    window.setReplyTo = (msgId, name, text) => {
        currentReplyTo = { id: msgId, name, text };
        let replyDiv = document.getElementById("replyPreview");
        if(!replyDiv) {
            replyDiv = document.createElement("div");
            replyDiv.id = "replyPreview";
            replyDiv.style.cssText = "background:#e1f5fe; border-radius:12px; padding:5px 10px; margin-bottom:5px; font-size:12px; display:flex; justify-content:space-between;";
            document.querySelector(".input-wrapper").parentNode.insertBefore(replyDiv, document.querySelector(".input-wrapper"));
        }
        let previewText = `الرد على ${name}: ` + (text || "").substring(0, 50);
        replyDiv.innerHTML = `<span>${escapeHtml(previewText)}</span> <button onclick="window.cancelReply()" style="background:none;border:none;color:red;cursor:pointer;">✖</button>`;
    };

    window.cancelReply = () => {
        currentReplyTo = null;
        const replyDiv = document.getElementById("replyPreview");
        if(replyDiv) replyDiv.remove();
    };

    window.sendTextMessage = () => {
        if(!db) return;
        try {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            if(text === "" && !currentReplyTo) return;

            const messageData = {
                name: currentUser,
                text: text || " ",
                type: 'text',
                timestamp: serverTimestamp(),
                replyTo: currentReplyTo ? { 
                    id: currentReplyTo.id, 
                    name: currentReplyTo.name, 
                    textPreview: (currentReplyTo.text || "").substring(0,50) 
                } : null
            };
            
            const msgListRef = ref(db, `chats/${ROOM_NAME}/messages`);
            push(msgListRef, messageData).then(() => {
                input.value = "";
                window.cancelReply();
                input.focus();
            }).catch(err => {
                alert("⚠️ تم الرفض من قاعدة البيانات: " + err.message);
            });
        } catch (error) {
            alert("⚠️ خطأ في الكود: " + error.message);
        }
    };

    function loadMessages() {
        const messagesRef = query(ref(db, `chats/${ROOM_NAME}/messages`), limitToLast(100));
        
        onChildAdded(messagesRef, (snapshot) => {
            const msg = snapshot.val();
            msg.id = snapshot.key;
            displayMessage(msg);
        });
        
        onChildRemoved(messagesRef, (snapshot) => {
            const removedId = snapshot.key;
            const msgElement = document.querySelector(`.message[data-id='${removedId}']`);
            if(msgElement) msgElement.remove();
        });
    }

    function displayMessage(msg) {
        const container = document.getElementById("chatMessages");
        const div = document.createElement("div");
        div.className = `message ${msg.name === currentUser ? "sender-me" : "sender-other"}`;
        div.setAttribute("data-id", msg.id);
        
        let replyHtml = "";
        if(msg.replyTo) {
            replyHtml = `<div class="reply-badge">↩️ رد على ${escapeHtml(msg.replyTo.name)}: ${escapeHtml(msg.replyTo.textPreview)}</div>`;
        }
        
        let content = escapeHtml(msg.text); 
        
        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'}) : "";
        const deleteBtn = (msg.name === currentUser) ? `<span class="delete-msg" onclick="window.deleteMessage('${msg.id}')">🗑️</span>` : "";
        
        const safeText = encodeURIComponent(msg.text || "");
        const replyBtn = `<span class="delete-msg" style="color:#128c7e;" onclick="window.setReplyTo('${msg.id}', '${escapeHtml(msg.name)}', decodeURIComponent('${safeText}'))">↩️ رد</span>`;
        
        div.innerHTML = `
            <span class="message-name">${escapeHtml(msg.name)}</span>
            ${replyHtml}
            ${content}
            <div class="message-time">${timeStr} ${replyBtn} ${deleteBtn}</div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        
        // تشغيل الصوت للرسائل الجديدة فقط (تجاهل الرسائل القديمة أثناء التحميل)
        if(!isInitialLoad && msg.name !== currentUser && !isMuted) {
            const sound = document.getElementById("notificationSound");
            sound.currentTime = 0; // إعادة الصوت من البداية لو كانت هناك رسائل سريعة متتالية
            sound.play().catch(e => console.log("المتصفح يمنع الصوت التلقائي"));
        }
    }

    function escapeHtml(str) {
        if(!str) return "";
        return str.replace(/[&<>"]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            if(m === '"') return '&quot;';
            return m;
        });
    }

    window.deleteMessage = async (msgId) => {
        if(!db) return;
        if(confirm("هل تريد حذف هذه الرسالة؟")) {
            const msgRef = ref(db, `chats/${ROOM_NAME}/messages/${msgId}`);
            try {
                await remove(msgRef);
            } catch(err) {
                alert("خطأ في الحذف: " + err.message);
            }
        }
    };

    function setupTyping() {
        onValue(ref(db, `typing/${ROOM_NAME}`), (snapshot) => {
            const typingUsers = snapshot.val() || {};
            const typingList = Object.keys(typingUsers).filter(u => u !== currentUser && typingUsers[u] === true);
            const indicator = document.getElementById("typingIndicator");
            if(typingList.length > 0) {
                indicator.innerText = typingList.slice(0,2).join(", ") + (typingList.length > 2 ? " وآخرون" : "") + " يكتب...";
            } else {
                indicator.innerText = "";
            }
        });
    }

    function setupPresence() {
        const userStatusRef = ref(db, `presence/${ROOM_NAME}/${currentUser}`);
        const connectedRef = ref(db, ".info/connected");
        
        onValue(connectedRef, (snap) => {
            const statusDiv = document.getElementById("connStatus");
            if(snap.val() === true) {
                set(userStatusRef, true);
                onDisconnect(userStatusRef).remove();
                statusDiv.innerText = "متصل بنجاح ✓";
                statusDiv.style.color = "#a5d6a7";
                setTimeout(() => statusDiv.style.display = 'none', 3000);
            } else {
                statusDiv.style.display = 'block';
                statusDiv.innerText = "غير متصل بفايربيز.. جاري المحاولة";
                statusDiv.style.color = "#ffc107";
            }
        });
        
        onValue(ref(db, `presence/${ROOM_NAME}`), (snap) => {
            const count = snap.exists() ? Object.keys(snap.val()).length : 0;
            document.getElementById("onlineCount").innerHTML = `🟢 ${count}`;
        });
    }

    window.addEventListener("beforeunload", () => {
        if(currentUser && db) {
            remove(ref(db, `presence/${ROOM_NAME}/${currentUser}`));
            remove(ref(db, `typing/${ROOM_NAME}/${currentUser}`));
        }
    });
</script>
</body>
</html>
