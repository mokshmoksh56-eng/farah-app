<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO | منظومة الإدارة الذكية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #27ae60; 
            --danger: #c0392b;
            --bg-odd: #ffffff; 
            --bg-even: #f2f5f7; 
            --active-bg: #fffceb;
            --glow: 0 0 25px rgba(10, 61, 98, 0.4);
            --star-color: #f1c40f;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; padding-bottom: 100px; }
        .top-bar { background: #072d48; color: #1abc9c; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; }
        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .toolbar { grid-template-columns: 1fr; } }
        #companyNameInput, #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; outline: none; width: 100%; box-sizing: border-box; }
        #companyNameInput { border-color: #1abc9c; }
        
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        .stat-card h4 { margin: 2px 0; font-size: 13px; }
        .stat-card div { font-size: 15px; font-weight: 900; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        .card { border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #ced4da; position: relative; display: none; transition: 0.3s; }
        .card.visible { display: block; }
        .card:nth-child(odd) { background-color: var(--bg-odd); }
        .card:even) { background-color: var(--bg-even); }
        .card:focus-within { background-color: var(--active-bg) !important; border: 3px solid var(--accent); box-shadow: var(--glow); transform: scale(1.01); z-index: 5; }
        
        .card.status-pending { border-left: 10px solid #f39c12; }
        .card.status-received { border-left: 10px solid #27ae60; }
        .card.status-finished { border-left: 10px solid #c0392b; }

        .client-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--accent); }
        .btn-delete { background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 8px; }
        label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 1px; color: #444; }
        input, textarea, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 13px; font-weight: 900; margin-bottom: 4px; font-family: inherit; }
        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; font-size: 16px !important; }
        .date-input-group { display: flex; align-items: center; background: #fff0f0; border: 1.5px solid #e74c3c; border-radius: 8px; padding: 2px 5px; direction: rtl; }
        .date-input-group input { border: none !important; background: transparent !important; text-align: center; padding: 5px 2px; margin: 0; color: #c0392b; font-size: 14px; font-weight: 900; width: 100%; }
        .rating-area { display: flex; flex-direction: row-reverse; justify-content: center; margin-bottom: 5px; }
        .rating-area input { display: none; }
        .rating-area label { font-size: 20px; color: #ccc; cursor: pointer; }
        .rating-area input:checked ~ label { color: var(--star-color); }
        .tafqit-box { background: rgba(238, 247, 255, 0.9); color: #0a3d62; padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; border-right: 3px solid var(--accent); margin-bottom: 8px; min-height: 12px; }
        .pay-row { display: grid; grid-template-columns: 100px 1fr; gap: 5px; margin-bottom: 2px; }
        .result-box { background: var(--primary); color: white; padding: 10px; border-radius: 12px; text-align: center; min-height: 40px; }
        
        /* تحسينات الأرشيف والجدول */
        .archive-section { max-width: 1100px; margin: 30px auto; padding: 0 10px; }
        .archive-table-container { background: white; border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-height: 500px; }
        table { width: 100%; border-collapse: collapse; min-width: 850px; }
        th, td { padding: 5px 8px; text-align: center; border-bottom: 1px solid #eee; font-size: 12px; line-height: 1.2; }
        thead th { background: #072d48; color: #1abc9c; position: sticky; top: 0; font-size: 11px; z-index: 2; }
        tfoot td { background: #f8f9fa; font-weight: 900; border-top: 2px solid var(--primary); color: var(--primary); }

        .btn-add-client { position: fixed; bottom: 20px; right: 20px; background: #1abc9c; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }
        .btn-card { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; color: white; margin: 5px; }
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 30px; border-radius: 30px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div class="top-bar"><span id="liveClock">00:00:00</span><span id="liveDate">--/--/----</span></div>
<div id="toast">✅ تم الحفظ بنجاح</div>
<div class="header"><h1>AZEMAA PRO | <span id="currentYear"></span></h1></div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اسم شركتك..." oninput="saveSettings()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث في الكروت والأرشيف..." onkeyup="filterAll()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">٠</div></div>
    <div class="stat-card"><h4>العملاء</h4><div id="stat-cust">٠</div></div>
    <div class="stat-card"><h4>الخالص</h4><div id="stat-paid">٠</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<div class="archive-section">
    <div class="archive-header" style="background:#072d48; color:white; padding:10px; border-radius:10px 10px 0 0; font-size:14px;">🗄️ سجل الأرشيف والمجاميع</div>
    <div class="archive-table-container">
        <table>
            <thead>
                <tr>
                    <th style="width:150px">الاسم</th>
                    <th>تاريخ الاستلام</th>
                    <th>الإجمالي</th>
                    <th>المدفوع</th>
                    <th>المتبقي</th>
                    <th>الحالة</th>
                    <th>ملاحظات</th>
                </tr>
            </thead>
            <tbody id="archiveBody"></tbody>
            <tfoot id="archiveFoot">
                <tr>
                    <td colspan="2">إجمالي المجاميع العامة:</td>
                    <td id="total-all-sum">٠</td>
                    <td id="total-paid-sum">٠</td>
                    <td id="total-rem-sum" style="color:red">٠</td>
                    <td colspan="2"></td>
                </tr>
            </tfoot>
        </table>
    </div>
</div>

<button class="btn-add-client" onclick="addNewCard()">+</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
        authDomain: "farah-kitchen.firebaseapp.com",
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com",
        projectId: "farah-kitchen",
        storageBucket: "farah-kitchen.firebasestorage.app",
        messagingSenderId: "702572851072",
        appId: "1:702572851072:web:320a92c9430abba6b71b65"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function cleanNum(n) { let num = parseFloat(n); return isNaN(num) ? 0 : num; }
    function toArabicNums(str) { if(!str && str !== 0) return ""; const id = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩']; return str.toString().replace(/[0-9]/g, function(w) { return id[+w]; }); }
    function toEnglishNums(str) { if(!str) return ""; const ar = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g]; let s = str.toString(); for (let i = 0; i < 10; i++) s = s.replace(ar[i], i); return s; }

    function updateDateTime() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('ar-EG');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
        document.getElementById('currentYear').innerText = now.getFullYear();
    }
    setInterval(updateDateTime, 1000); updateDateTime();

    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function tafqit(n) {
        n = Math.floor(n); if (n <= 0) return '';
        let res = '', k = Math.floor(n / 1000);
        if (k > 0) {
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            n %= 1000;
        }
        res += tafqitBasic(n);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }

    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    let visibleCards = JSON.parse(localStorage.getItem('azemaa_visible_cards')) || [];

    function createCardElement(i) {
        const card = document.createElement('div');
        card.className = `card ${visibleCards.includes(i) ? 'visible' : ''}`;
        card.id = `card-${i}`;
        card.innerHTML = `
            <div class="client-head"><span>👤 عميل رقم ${i}</span><button class="btn-delete" onclick="deleteCard(${i})">حذف الكارت 🗑️</button></div>
            <label>الاسم:</label><input type="text" class="c-name" oninput="updateLogic(${i})">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div><label>الموبايل:</label><input type="tel" class="c-phone" placeholder="01..." oninput="updateLogic(${i})"></div>
                <div><label>📅 الاستلام:</label>
                    <div class="date-input-group">
                        <input type="text" class="d-day" placeholder="يوم" oninput="updateLogic(${i})"> / 
                        <input type="text" class="d-month" placeholder="شهر" oninput="updateLogic(${i})"> / 
                        <input type="text" class="d-year" placeholder="سنة" oninput="updateLogic(${i})">
                    </div>
                </div>
            </div>
            <label>📌 حالة الطلب:</label>
            <select class="status-select" onchange="updateLogic(${i})">
                <option value="pending">⏳ تحت التنفيذ</option>
                <option value="received">✅ تم الاستلام</option>
                <option value="finished">💰 خالص السداد</option>
            </select>
            <div class="rating-area">${[5,4,3,2,1].map(s => `<input type="radio" id="star${s}-${i}" name="rating-${i}" value="${s}" onclick="updateLogic(${i})"><label for="star${s}-${i}">★</label>`).join('')}</div>
            <label>💰 الإجمالي:</label><input type="text" class="c-total" oninput="updateLogic(${i})">
            <div class="tafqit-box" id="tafqit-total-${i}"></div>
            <div class="payment-section">
                ${[1,2,3,4].map(n => `<div class="pay-row"><input type="date" class="p-date" oninput="updateLogic(${i})"><input type="text" class="p-val" placeholder="دفعة ${n}" oninput="updateLogic(${i})"></div>`).join('')}
            </div>
            <textarea class="c-notes" placeholder="ملاحظات..." oninput="updateLogic(${i})"></textarea>
            <div class="result-box"><div class="num" id="rem-n-${i}">--</div><div id="rem-w-${i}" style="font-size:10px; color:#00d2ff;"></div></div>
            <div style="display:flex;"><button class="btn-card" style="background:#0a3d62" onclick="saveFixedBtn(${i})">💾 حفظ</button>
            <button class="btn-card" style="background:#27ae60" onclick="sendWA(${i})">واتساب</button></div>
        `;
        document.getElementById('mainGrid').appendChild(card);
    }

    for (let i = 1; i <= 100; i++) createCardElement(i);

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card) return;
        const status = card.querySelector('.status-select').value;
        card.classList.remove('status-pending', 'status-received', 'status-finished');
        card.classList.add(`status-${status}`);

        const totalStr = toEnglishNums(card.querySelector('.c-total').value);
        const total = cleanNum(totalStr);
        document.getElementById(`tafqit-total-${id}`).innerText = total > 0 ? tafqit(total) : "";
        
        let paid = 0;
        card.querySelectorAll('.p-val').forEach(p => paid += cleanNum(toEnglishNums(p.value)));
        const rem = total - paid;
        document.getElementById(`rem-n-${id}`).innerText = `المتبقي: ${toArabicNums(rem.toLocaleString())} ج.م`;
        document.getElementById(`rem-w-${id}`).innerText = rem > 0 ? tafqit(rem) : "خالص السداد";

        saveToLocal(id);
        refreshStats();
        refreshArchive();
    }

    function saveToLocal(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card || !visibleCards.includes(id)) return;
        const data = {
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            dy: card.querySelector('.d-year').value,
            dm: card.querySelector('.d-month').value,
            dd: card.querySelector('.d-day').value,
            st: card.querySelector('.status-select').value,
            r: card.querySelector(`input[name="rating-${id}"]:checked`)?.value || 0,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.p-val')).map((p, idx) => ({
                dt: card.querySelectorAll('.p-date')[idx].value,
                vl: p.value
            }))
        };
        localStorage.setItem(`azemaa_pro_v5_${id}`, JSON.stringify(data));
        db.ref('azemaa_v5/clients/' + id).set(data);
    }

    function deleteCard(id) {
        if (confirm('⚠️ هل أنت متأكد من حذف هذا الكارت نهائياً من السيرفر والجهاز؟')) {
            db.ref('azemaa_v5/clients/' + id).remove().then(() => {
                visibleCards = visibleCards.filter(c => c !== id);
                localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
                localStorage.removeItem(`azemaa_pro_v5_${id}`);
                const card = document.getElementById(`card-${id}`);
                card.classList.remove('visible');
                card.querySelectorAll('input, textarea').forEach(i => i.value = '');
                refreshStats();
                refreshArchive();
                alert("تم الحذف بنجاح ✅");
            });
        }
    }

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const name = card.querySelector('.c-name').value;
        const phone = card.querySelector('.c-phone').value;
        const total = card.querySelector('.c-total').value;
        const remText = document.getElementById(`rem-n-${id}`).innerText;
        const company = document.getElementById('companyNameInput').value || "منظومة الإدارة";
        if (!phone) { alert("يرجى إدخال رقم الهاتف"); return; }
        let paymentsDetail = "";
        card.querySelectorAll('.pay-row').forEach((row, idx) => {
            const val = row.querySelector('.p-val').value;
            const date = row.querySelector('.p-date').value;
            if (val) paymentsDetail += `✅ دفع مبلغ (${val}) بتاريخ [${date || '---'}]\n`;
        });
        const msg = `السلام عليكم أ/ ${name} 🌹\nمعك ${company} بخصوص طلبكم:\n\n💰 الإجمالي: ${total} ج.م\n--- دفعات السداد ---\n${paymentsDetail}\n⚠️ الحالة: ${remText}\n\nشكراً لتعاملكم معنا ✨`;
        window.open(`https://wa.me/2${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function refreshStats() {
        let debt = 0, cust = 0, paidCount = 0;
        visibleCards.forEach(i => {
            const d = JSON.parse(localStorage.getItem(`azemaa_pro_v5_${i}`));
            if (d && d.n) { 
                cust++;
                let pT = 0; d.pays.forEach(p => pT += cleanNum(toEnglishNums(p.vl)));
                let rem = cleanNum(toEnglishNums(d.t)) - pT;
                if (rem > 0) debt += rem;
                if (d.st === "finished") paidCount++;
            }
        });
        document.getElementById('stat-debt').innerText = toArabicNums(debt.toLocaleString());
        document.getElementById('stat-cust').innerText = toArabicNums(cust);
        document.getElementById('stat-paid').innerText = toArabicNums(paidCount);
    }

    function refreshArchive() {
        const tbody = document.getElementById('archiveBody');
        tbody.innerHTML = "";
        let sumAll = 0, sumPaid = 0, sumRem = 0;

        visibleCards.forEach(i => {
            const d = JSON.parse(localStorage.getItem(`azemaa_pro_v5_${i}`));
            if (d && d.n) {
                const totalVal = cleanNum(toEnglishNums(d.t));
                let paidT = 0; d.pays.forEach(p => paidT += cleanNum(toEnglishNums(p.vl)));
                const remVal = totalVal - paidT;

                sumAll += totalVal;
                sumPaid += paidT;
                sumRem += remVal;

                let color = d.st==="finished"?"#d1fae5":d.st==="received"?"#dbeafe":"#fef3c7";
                // تنسيق التاريخ يوم / شهر / سنة بالأرقام العربية
                let dateStr = (d.dd && d.dm && d.dy) ? `${d.dd} / ${d.dm} / ${d.dy}` : "---";

                tbody.innerHTML += `<tr style="background:${color}">
                    <td style="font-weight:900; text-align:right;">${d.n}</td>
                    <td dir="ltr">${toArabicNums(dateStr)}</td>
                    <td>${toArabicNums(totalVal.toLocaleString())}</td>
                    <td>${toArabicNums(paidT.toLocaleString())}</td>
                    <td style="color:${remVal>0?'red':'green'}">${toArabicNums(remVal.toLocaleString())}</td>
                    <td style="font-size:10px">${d.st === 'finished' ? 'خالص' : 'مستمر'}<br>${"★".repeat(d.r)}</td>
                    <td style="font-size:9px">${d.notes || '-'}</td>
                </tr>`;
            }
        });

        // تحديث الفوتر (المجاميع)
        document.getElementById('total-all-sum').innerText = toArabicNums(sumAll.toLocaleString()) + " ج.م";
        document.getElementById('total-paid-sum').innerText = toArabicNums(sumPaid.toLocaleString()) + " ج.م";
        document.getElementById('total-rem-sum').innerText = toArabicNums(sumRem.toLocaleString()) + " ج.م";
    }

    function addNewCard() {
        for (let i = 1; i <= 100; i++) {
            if (!visibleCards.includes(i)) {
                visibleCards.push(i);
                localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
                document.getElementById(`card-${i}`).classList.add('visible');
                return;
            }
        }
    }

    function saveFixedBtn(id) { updateLogic(id); const t = document.getElementById('toast'); t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

    function filterAll() {
        let q = document.getElementById('searchInput').value.toLowerCase();
        visibleCards.forEach(id => {
            const card = document.getElementById(`card-${id}`);
            const text = (card.querySelector('.c-name').value + card.querySelector('.c-phone').value).toLowerCase();
            card.style.display = text.includes(q) ? "block" : "none";
        });
    }

    function saveSettings() { localStorage.setItem('azemaa_company_name', document.getElementById('companyNameInput').value); }

    window.onload = () => {
        document.getElementById('companyNameInput').value = localStorage.getItem('azemaa_company_name') || "";
        db.ref('azemaa_v5/clients').once('value', (snap) => {
            const data = snap.val() || {};
            visibleCards = Object.keys(data).map(Number);
            localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
            visibleCards.forEach(i => {
                const d = data[i];
                const card = document.getElementById(`card-${i}`);
                if(card && d) {
                    card.classList.add('visible');
                    card.querySelector('.c-name').value = d.n || '';
                    card.querySelector('.c-phone').value = d.p || '';
                    card.querySelector('.d-year').value = d.dy || '';
                    card.querySelector('.d-month').value = d.dm || '';
                    card.querySelector('.d-day').value = d.dd || '';
                    card.querySelector('.status-select').value = d.st || 'pending';
                    card.querySelector('.c-total').value = d.t || '';
                    card.querySelector('.c-notes').value = d.notes || '';
                    if(d.r) { const rb = document.getElementById(`star${d.r}-${i}`); if(rb) rb.checked = true; }
                    if(d.pays) {
                        d.pays.forEach((p, idx) => {
                            if(card.querySelectorAll('.p-val')[idx]) card.querySelectorAll('.p-val')[idx].value = p.vl;
                            if(card.querySelectorAll('.p-date')[idx]) card.querySelectorAll('.p-date')[idx].value = p.dt;
                        });
                    }
                    localStorage.setItem(`azemaa_pro_v5_${i}`, JSON.stringify(d));
                    updateLogic(i);
                }
            });
        });
    };
</script>
</body>
</html>
