<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #27ae60; 
            --danger: #c0392b; 
            --star-color: #f1c40f; 
        }
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; padding-bottom: 100px; }
        
        .top-bar { background: #072d48; color: #f1c40f; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 12px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #companyNameInput, #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; width: 100%; box-sizing: border-box; outline: none; transition: 0.3s; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        
        .card { 
            border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            border: 1px solid #ced4da; background: white; position: relative; 
            transition: all 0.4s ease-in-out; overflow: hidden; 
        }
        
        .card:focus-within { 
            border-color: #f1c40f !important; transform: translateY(-3px); z-index: 10;
            animation: inner-yellow-glow 1.5s infinite ease-in-out;
        }

        @keyframes inner-yellow-glow {
            0% { box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.2); }
            50% { box-shadow: inset 0 0 35px rgba(241, 196, 15, 0.6), inset 0 0 70px rgba(241, 196, 15, 0.2); background-color: #fffdf0; }
            100% { box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.2); }
        }

        input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 14px; font-weight: 900; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #f1c40f !important; background-color: white !important; outline: none; }

        /* تعديل الملحوظات لتكون مرنة */
        .c-notes { 
            min-height: 45px; 
            resize: none; 
            overflow: hidden; /* إخفاء شريط التمرير */
            line-height: 1.5;
            margin-top: 8px;
        }

        .card.paid { border: 3px solid var(--success) !important; background-color: #f0fff4 !important; animation: none; }
        label { display: block; font-size: 10px; font-weight: bold; margin: 5px 0 2px 0; color: #444; }

        .date-input-group { 
            display: flex; align-items: center; background: #f8f9fa; border: 1.5px solid #e74c3c; 
            border-radius: 8px; padding: 2px 5px; direction: rtl; justify-content: center;
        }
        .date-input-group input { 
            border: none !important; background: transparent !important; text-align: center; 
            color: #000; font-size: 14px; font-weight: 900; width: 32px; padding: 5px 0;
        }
        .date-input-group input.d-year { width: 50px; }
        .date-sep { color: #e74c3c; font-weight: 900; font-size: 16px; margin: 0 2px; }

        .rating-stars { display: flex; flex-direction: row-reverse; justify-content: center; margin: 0; padding: 2px 0; gap: 2px; }
        .rating-stars label { font-size: 13px; color: #ddd; cursor: pointer; transition: 0.2s; }
        .rating-stars input { display: none; }
        .rating-stars input:checked ~ label { color: var(--star-color); text-shadow: 0 0 5px rgba(241, 196, 15, 0.5); }

        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; text-align: center; font-size: 16px !important; margin-top: 5px; }
        .tafqit-box { background: rgba(238, 247, 255, 0.9); padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; min-height: 12px; margin-bottom: 8px; }
        .payment-section { background: rgba(0,0,0,0.02); padding: 8px; border-radius: 12px; border: 1px dashed #aaa; margin-top: 10px; }
        .pay-row { display: grid; grid-template-columns: 120px 1fr; gap: 5px; margin-bottom: 8px; }
        .card-footer { display: flex; gap: 8px; margin-top: 10px; }
        .btn-card { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s; }
        .btn-save { background: var(--primary); }
        .btn-wa { background: var(--success); }
        .btn-add-client { position: fixed; bottom: 20px; right: 20px; background: #1abc9c; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; transition: 0.3s; }
    </style>
</head>
<body>

<div class="top-bar">
    <span id="liveClock">00:00:00</span>
    <span id="liveDate">--/--/----</span>
</div>

<div class="header"><h1>AZEMAA PRO | 2026</h1></div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اسم شركتك..." oninput="saveCoName()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث في الكروت..." onkeyup="filterAll()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">٠</div></div>
    <div class="stat-card"><h4>العملاء</h4><div id="stat-cust">٠</div></div>
    <div class="stat-card"><h4>الخالص</h4><div id="stat-paid">٠</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<button class="btn-add-client" onclick="addNewCustomer()">+</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
        authDomain: "farah-kitchen.firebaseapp.com",
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com",
        projectId: "farah-kitchen",
        storageBucket: "farah-kitchen.firebasestorage.app",
        messagingSenderId: "702572851072",
        appId: "1:702572851072:web:320a92c9430abba6b71b65"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function toArabicNums(str) { return str ? str.toString().replace(/[0-9]/g, w => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][+w]) : ""; }
    function toEnglishNums(str) { return str ? str.toString().replace(/[٠-٩]/g, w => "٠١٢٣٤٥٦٧٨٩".indexOf(w)) : ""; }

    function tafqit(n) {
        n = Math.floor(n); if (n <= 0) return '';
        let res = '', k = Math.floor(n / 1000);
        if (k > 0) {
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            n %= 1000;
        }
        res += tafqitBasic(n);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }
    
    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    function moveFocus(current, nextId) {
        if (toEnglishNums(current.value).length >= current.maxLength) {
            const cardId = current.getAttribute('data-id');
            const nextInput = document.querySelector(`#card-${cardId} .${nextId}`);
            if (nextInput) nextInput.focus();
        }
    }

    // وظيفة تكبير الملحوظات تلقائياً
    function autoGrow(element) {
        element.style.height = "40px";
        element.style.height = (element.scrollHeight) + "px";
    }

    function createCardHTML(id, index) {
        const div = document.createElement('div');
        div.className = 'card';
        div.id = `card-${id}`;
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="font-size:11px; color:var(--accent);">👤 زبون: ${toArabicNums(index)}</span>
                <button onclick="deleteCustomer('${id}')" style="background:none; border:none; cursor:pointer; font-size:14px;">🗑️</button>
            </div>
            <label>اسم العميل:</label>
            <input type="text" class="c-name" data-id="${id}">
            
            <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:8px;">
                <div><label>الموبايل:</label><input type="text" class="c-phone" data-id="${id}" oninput="this.value=toArabicNums(this.value)"></div>
                <div>
                    <label>📅 الاستلام:</label>
                    <div class="date-input-group">
                        <input type="text" class="d-day" placeholder="يوم" maxlength="2" data-id="${id}" oninput="this.value=toArabicNums(this.value); moveFocus(this, 'd-month')">
                        <span class="date-sep">/</span>
                        <input type="text" class="d-month" placeholder="شهر" maxlength="2" data-id="${id}" oninput="this.value=toArabicNums(this.value); moveFocus(this, 'd-year')">
                        <span class="date-sep">/</span>
                        <input type="text" class="d-year" placeholder="سنة" maxlength="4" data-id="${id}" oninput="this.value=toArabicNums(this.value)">
                    </div>
                </div>
            </div>

            <div class="rating-stars" data-id="${id}">
                ${[5,4,3,2,1].map(n => `
                    <input type="radio" name="rate-${id}" id="star-${id}-${n}" value="${n}" onchange="saveToCloud('${id}')">
                    <label for="star-${id}-${n}">★</label>
                `).join('')}
            </div>

            <label>💰 الإجمالي:</label>
            <input type="text" class="c-total" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
            <div class="tafqit-box" id="tafqit-total-${id}"></div>
            
            <div class="payment-section">
                ${[0,1,2,3].map(n => `
                    <div class="pay-row-group">
                        <div class="pay-row">
                            <input type="date" class="p-date" data-id="${id}">
                            <input type="text" class="p-val" placeholder="مبلغ الدفعة" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
                        </div>
                        <div class="tafqit-mini" id="tafqit-pay-${id}-${n}" style="font-size:9px; color:#3c6382; margin-top:2px; min-height:10px;"></div>
                    </div>
                `).join('')}
            </div>

            <textarea class="c-notes" placeholder="اكتب الملحوظات هنا..." data-id="${id}" oninput="autoGrow(this)"></textarea>
            
            <div id="rem-n-${id}" style="font-size:16px; font-weight:900; margin-top:8px;">المتبقي: ٠ ج.م</div>
            <div id="rem-w-${id}" style="font-size:10px; color:#f39c12;"></div>
            
            <div class="card-footer">
                <button class="btn-card btn-save" onclick="manualSave('${id}')">💾 حفظ</button>
                <button class="btn-card btn-wa" onclick="sendWA('${id}')">🟢 واتساب</button>
            </div>
        `;
        div.querySelectorAll('input:not([type="radio"]), textarea').forEach(el => {
            el.addEventListener('change', () => saveToCloud(id));
        });
        return div;
    }

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card) return;
        const total = parseFloat(toEnglishNums(card.querySelector('.c-total').value)) || 0;
        document.getElementById(`tafqit-total-${id}`).innerText = tafqit(total);
        let paid = 0;
        card.querySelectorAll('.p-val').forEach((valInput, i) => {
            const val = parseFloat(toEnglishNums(valInput.value)) || 0;
            paid += val;
            document.getElementById(`tafqit-pay-${id}-${i}`).innerText = tafqit(val);
        });
        const rem = total - paid;
        card.querySelector(`#rem-n-${id}`).innerText = `المتبقي: ${toArabicNums(rem.toLocaleString())} ج.م`;
        document.getElementById(`rem-w-${id}`).innerText = rem > 0 ? tafqit(rem) : (total > 0 ? "خالص السداد ✓" : "");
        if (rem <= 0 && total > 0) card.classList.add('paid'); else card.classList.remove('paid');
        refreshStats();
    }

    function saveToCloud(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card) return;
        const data = {
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            dd: card.querySelector('.d-day').value,
            dm: card.querySelector('.d-month').value,
            dy: card.querySelector('.d-year').value,
            r: card.querySelector(`input[name="rate-${id}"]:checked`)?.value || 0,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.pay-row-group')).map(r => ({
                dt: r.querySelector('.p-date').value,
                vl: r.querySelector('.p-val').value
            }))
        };
        db.ref('azemaa_v5/zbon/' + id).set(data);
    }

    db.ref('azemaa_v5/zbon').on('value', (snap) => {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = "";
        const data = snap.val();
        if(!data) return;
        const keys = Object.keys(data).sort();
        keys.reverse().forEach((id, i) => {
            const serialNum = keys.length - i; 
            grid.appendChild(createCardHTML(id, serialNum));
            fillCardData(id, data[id]);
        });
    });

    function fillCardData(id, d) {
        const card = document.getElementById(`card-${id}`);
        if (!card) return;
        card.querySelector('.c-name').value = d.n || "";
        card.querySelector('.c-phone').value = d.p || "";
        card.querySelector('.d-day').value = d.dd || "";
        card.querySelector('.d-month').value = d.dm || "";
        card.querySelector('.d-year').value = d.dy || "";
        card.querySelector('.c-total').value = d.t || "";
        const notesEl = card.querySelector('.c-notes');
        notesEl.value = d.notes || "";
        autoGrow(notesEl); // ضبط الارتفاع عند التحميل
        if (d.r) {
            const star = card.querySelector(`#star-${id}-${d.r}`);
            if(star) star.checked = true;
        }
        if(d.pays) d.pays.forEach((p, i) => {
            const rows = card.querySelectorAll('.pay-row');
            if(rows[i]) {
                rows[i].querySelector('.p-date').value = p.dt || "";
                rows[i].querySelector('.p-val').value = p.vl || "";
            }
        });
        updateLogic(id);
    }

    function addNewCustomer() { db.ref('azemaa_v5/zbon/' + "z" + Date.now()).set({ n: "" }); }
    function manualSave(id) { saveToCloud(id); alert("✅ تم الحفظ"); }
    function deleteCustomer(id) { if(confirm("حذف؟")) db.ref('azemaa_v5/zbon/' + id).remove(); }
    function saveCoName() { localStorage.setItem('azemaa_co_v5', document.getElementById('companyNameInput').value); }

    function refreshStats() {
        let debt = 0, cust = 0, paidC = 0;
        document.querySelectorAll('.card').forEach(c => {
            const t = parseFloat(toEnglishNums(c.querySelector('.c-total').value)) || 0;
            if(t > 0) { cust++; 
                let p = 0; c.querySelectorAll('.p-val').forEach(v => p += parseFloat(toEnglishNums(v.value)) || 0); 
                debt += (t - p > 0 ? t - p : 0); if (t - p <= 0) paidC++;
            }
        });
        document.getElementById('stat-debt').innerText = toArabicNums(debt.toLocaleString());
        document.getElementById('stat-cust').innerText = toArabicNums(cust);
        document.getElementById('stat-paid').innerText = toArabicNums(paidC);
    }

    function filterAll() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.querySelector('.c-name').value.toLowerCase().includes(q) ? "block" : "none";
        });
    }

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const company = document.getElementById('companyNameInput').value;
        const name = card.querySelector('.c-name').value;
        const phone = toEnglishNums(card.querySelector('.c-phone').value);
        const total = card.querySelector('.c-total').value;
        const totalW = tafqit(parseFloat(toEnglishNums(total)));
        
        let paid = 0;
        let paysMsg = "";
        card.querySelectorAll('.pay-row-group').forEach((row, i) => {
            const val = row.querySelector('.p-val').value;
            const date = row.querySelector('.p-date').value;
            if (val && parseFloat(toEnglishNums(val)) > 0) {
                paid += parseFloat(toEnglishNums(val));
                const dText = date ? toArabicNums(date.split('-').reverse().join('/')) : "----/--/--";
                paysMsg += `🔹 الدفعة (${toArabicNums(i+1)}): ${val} ج.م بتاريخ ${dText}\n`;
            }
        });

        const rem = parseFloat(toEnglishNums(total)) - paid;
        const remW = rem > 0 ? tafqit(rem) : "خالص السداد ✓";
        const remN = toArabicNums(rem.toLocaleString());

        const welcome = `السلام عليكم أ/ *${name}* 🌹\nنرسل لكم تقرير الحساب من *${company}*`;
        const body = `💰 *الإجمالي المطلوب:* ${total} ج.م\n(${totalW})\n\n✅ *الدفعات المسجلة:*\n${paysMsg || "لم يتم تسجيل دفعات بعد."}\n━━━━━━━━━━━━\n💵 *المتبقي حالياً:* ${remN} ج.م\n(${remW})`;
        const closing = `🙏 شكراً لثقتكم بنا، دائماً في خدمتكم.\n📅 تحريراً في: ${toArabicNums(new Date().toLocaleDateString('ar-EG'))}`;

        const fullMsg = `${welcome}\n\n${body}\n\n${closing}`;
        window.open(`https://wa.me/2${phone}?text=${encodeURIComponent(fullMsg)}`, '_blank');
    }

    window.onload = () => {
        document.getElementById('companyNameInput').value = localStorage.getItem('azemaa_co_v5') || "فرح للمطابخ";
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('ar-EG');
            document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
        }, 1000);
    };
</script>
</body>
</html>
