<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #27ae60; 
            --danger: #c0392b; 
            --star-color: #f1c40f; 
        }
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; padding-bottom: 50px; }
        
        .top-bar { background: #072d48; color: #f1c40f; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 12px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #companyNameInput, #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; width: 100%; box-sizing: border-box; outline: none; transition: 0.3s; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        
        .card { 
            border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            border: 1px solid #ced4da; background: white; position: relative; 
            transition: all 0.4s ease-in-out; overflow: hidden; 
        }
        
        .card:focus-within { 
            border-color: #f1c40f !important; transform: translateY(-3px); z-index: 10;
            animation: inner-yellow-glow 1.5s infinite ease-in-out;
        }

        @keyframes inner-yellow-glow {
            0% { box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.2); }
            50% { box-shadow: inset 0 0 35px rgba(241, 196, 15, 0.6), inset 0 0 70px rgba(241, 196, 15, 0.2); background-color: #fffdf0; }
            100% { box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.2); }
        }

        input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 14px; font-weight: 900; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #f1c40f !important; background-color: white !important; outline: none; }

        .c-notes { min-height: 45px; resize: none; overflow: hidden; line-height: 1.5; margin-top: 8px; }
        .card.paid { border: 3px solid var(--success) !important; background-color: #f0fff4 !important; animation: none; }
        label { display: block; font-size: 10px; font-weight: bold; margin: 5px 0 2px 0; color: #444; }

        .date-input-group { 
            display: flex; align-items: center; background: #f8f9fa; border: 1.5px solid #e74c3c; 
            border-radius: 8px; padding: 2px 5px; direction: rtl; justify-content: center;
        }
        .date-input-group input { border: none !important; background: transparent !important; text-align: center; color: #000; font-size: 14px; font-weight: 900; width: 32px; padding: 5px 0; }
        .date-input-group input.d-year { width: 50px; }
        .date-sep { color: #e74c3c; font-weight: 900; font-size: 16px; margin: 0 2px; }

        .rating-stars { display: flex; flex-direction: row-reverse; justify-content: center; margin: 0; padding: 2px 0; gap: 2px; }
        .rating-stars label { font-size: 13px; color: #ddd; cursor: pointer; transition: 0.2s; }
        .rating-stars input { display: none; }
        .rating-stars input:checked ~ label { color: var(--star-color); text-shadow: 0 0 5px rgba(241, 196, 15, 0.5); }

        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; text-align: center; font-size: 16px !important; margin-top: 5px; }
        .tafqit-box { background: rgba(238, 247, 255, 0.9); padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; min-height: 12px; margin-bottom: 8px; }
        .payment-section { background: rgba(0,0,0,0.02); padding: 8px; border-radius: 12px; border: 1px dashed #aaa; margin-top: 10px; }
        .pay-row { display: grid; grid-template-columns: 120px 1fr; gap: 5px; margin-bottom: 2px; }
        .tafqit-mini { font-size: 9px; color: #3c6382; margin-bottom: 8px; min-height: 10px; font-weight: 800; }
        
        .card-footer { display: flex; gap: 8px; margin-top: 10px; }
        .btn-card { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s; }
        .btn-save { background: var(--primary); }
        .btn-wa { background: var(--success); }
        .btn-add-client { position: fixed; bottom: 20px; right: 20px; background: #1abc9c; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }

        .summary-section { max-width: 1100px; margin: 30px auto; padding: 0 10px; overflow-x: auto; }
        .sum-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .sum-table th { background: var(--primary); color: white; padding: 12px; font-size: 12px; }
        .sum-table td { padding: 10px; text-align: center; border: 1px solid #eee; font-size: 13px; font-weight: 800; }
        .sum-table .total-row { background: #072d48 !important; color: #f1c40f; font-size: 14px; }
    </style>
</head>
<body>

<div class="top-bar">
    <span id="liveClock">00:00:00</span>
    <span id="liveDate">--/--/----</span>
</div>

<div class="header"><h1>AZEMAA PRO | 2026</h1></div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اسم شركتك..." oninput="saveCoName()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث في الكروت..." onkeyup="filterAll()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">٠</div></div>
    <div class="stat-card"><h4>العملاء</h4><div id="stat-cust">٠</div></div>
    <div class="stat-card"><h4>الخالص</h4><div id="stat-paid">٠</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<div class="summary-section">
    <h3 style="text-align: center; color: var(--primary); margin-bottom: 10px;">📊 ملخص حسابات جميع الزبائن</h3>
    <table class="sum-table">
        <thead>
            <tr>
                <th>الزبون</th>
                <th>الإجمالي</th>
                <th>المدفوع</th>
                <th>المتبقي</th>
                <th>الاستلام</th>
                <th>التقييم</th>
            </tr>
        </thead>
        <tbody id="allClientsSummary"></tbody>
        <tfoot>
            <tr class="total-row" id="totalRow"></tr>
        </tfoot>
    </table>
</div>

<button class="btn-add-client" onclick="addNewCustomer()">+</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
        authDomain: "farah-kitchen.firebaseapp.com",
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com",
        projectId: "farah-kitchen",
        storageBucket: "farah-kitchen.firebasestorage.app",
        messagingSenderId: "702572851072",
        appId: "1:702572851072:web:320a92c9430abba6b71b65"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function toArabicNums(str) { return (str === "" || str === undefined || str === null) ? "" : str.toString().replace(/[0-9]/g, w => ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'][+w]); }
    function toEnglishNums(str) { return (str === "" || str === undefined || str === null) ? "" : str.toString().replace(/[٠-٩]/g, w => "٠١٢٣٤٥٦٧٨٩".indexOf(w)); }

    function tafqit(n) {
        if (!n || n <= 0) return '';
        let nInt = Math.floor(n);
        let res = '', k = Math.floor(nInt / 1000);
        if (k > 0) {
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            nInt %= 1000;
        }
        res += tafqitBasic(nInt);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }
    
    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    function createCardHTML(id, index) {
        const div = document.createElement('div');
        div.className = 'card';
        div.id = `card-${id}`;
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="font-size:11px; color:var(--accent);">👤 زبون: ${toArabicNums(index)}</span>
                <button onclick="deleteCustomer('${id}')" style="background:none; border:none; cursor:pointer; font-size:14px;">🗑️</button>
            </div>
            <label>اسم العميل:</label>
            <input type="text" class="c-name" data-id="${id}" oninput="updateLogic('${id}')">
            
            <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:8px;">
                <div><label>الموبايل:</label><input type="text" class="c-phone" data-id="${id}" oninput="this.value=toArabicNums(this.value)"></div>
                <div>
                    <label>📅 الاستلام:</label>
                    <div class="date-input-group">
                        <input type="text" class="d-day" placeholder="يوم" maxlength="2" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
                        <span class="date-sep">/</span>
                        <input type="text" class="d-month" placeholder="شهر" maxlength="2" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
                        <span class="date-sep">/</span>
                        <input type="text" class="d-year" placeholder="سنة" maxlength="4" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
                    </div>
                </div>
            </div>

            <div class="rating-stars" data-id="${id}">
                ${[5,4,3,2,1].map(n => `
                    <input type="radio" name="rate-${id}" id="star-${id}-${n}" value="${n}" onchange="updateLogic('${id}'); saveToCloud('${id}')">
                    <label for="star-${id}-${n}">★</label>
                `).join('')}
            </div>

            <label>💰 الإجمالي:</label>
            <input type="text" class="c-total" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
            <div class="tafqit-box" id="tafqit-total-${id}"></div>
            
            <div class="payment-section">
                ${[0,1,2,3].map(n => `
                    <div class="pay-row">
                        <input type="date" class="p-date" data-id="${id}" onchange="updateLogic('${id}')">
                        <input type="text" class="p-val" placeholder="مبلغ الدفعة" data-id="${id}" oninput="this.value=toArabicNums(this.value); updateLogic('${id}')">
                    </div>
                    <div class="tafqit-mini" id="tafqit-pay-${id}-${n}"></div>
                `).join('')}
            </div>

            <textarea class="c-notes" placeholder="اكتب الملحوظات..." data-id="${id}" oninput="autoGrow(this)"></textarea>
            
            <div id="rem-n-${id}" style="font-size:16px; font-weight:900; margin-top:8px;">المتبقي: ٠ ج.م</div>
            
            <div class="card-footer">
                <button class="btn-card btn-save" onclick="manualSave('${id}')">💾 حفظ</button>
                <button class="btn-card btn-wa" onclick="sendWA('${id}')">🟢 واتساب</button>
            </div>
        `;
        return div;
    }

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card) return;
        const totalText = toEnglishNums(card.querySelector('.c-total').value);
        const totalVal = totalText === "" ? 0 : parseFloat(totalText);
        document.getElementById(`tafqit-total-${id}`).innerText = totalVal > 0 ? tafqit(totalVal) : "";
        
        let paidTotal = 0;
        card.querySelectorAll('.p-val').forEach((vInput, i) => {
            const vText = toEnglishNums(vInput.value);
            const v = vText === "" ? 0 : parseFloat(vText);
            paidTotal += v;
            document.getElementById(`tafqit-pay-${id}-${i}`).innerText = v > 0 ? tafqit(v) : "";
        });
        
        const rem = totalVal - paidTotal;
        card.querySelector(`#rem-n-${id}`).innerText = `المتبقي: ${toArabicNums(rem.toLocaleString())} ج.م`;
        if (rem <= 0 && totalVal > 0) card.classList.add('paid'); else card.classList.remove('paid');
        
        refreshStats();
        updateGlobalSummary();
    }

    function updateGlobalSummary() {
        const summaryBody = document.getElementById('allClientsSummary');
        const totalRow = document.getElementById('totalRow');
        summaryBody.innerHTML = "";
        let sTotal = 0, sPaid = 0, sRem = 0;

        document.querySelectorAll('.card').forEach(card => {
            const id = card.id.replace('card-', '');
            const name = card.querySelector('.c-name').value || "بدون اسم";
            const tText = toEnglishNums(card.querySelector('.c-total').value);
            const tVal = tText === "" ? 0 : parseFloat(tText);
            let pVal = 0; 
            card.querySelectorAll('.p-val').forEach(v => {
                const vt = toEnglishNums(v.value);
                pVal += vt === "" ? 0 : parseFloat(vt);
            });
            const rVal = tVal - pVal;
            const date = `${card.querySelector('.d-day').value || "--"}/${card.querySelector('.d-month').value || "--"}`;
            const rating = card.querySelector(`input[name="rate-${id}"]:checked`)?.value || 0;

            sTotal += tVal; sPaid += pVal; sRem += rVal;
            summaryBody.insertAdjacentHTML('beforeend', `
                <tr onclick="document.getElementById('card-${id}').scrollIntoView({behavior:'smooth'})">
                    <td style="color:var(--primary)">${name}</td>
                    <td>${tVal > 0 ? toArabicNums(tVal.toLocaleString()) : "٠"}</td>
                    <td style="color:var(--success)">${pVal > 0 ? toArabicNums(pVal.toLocaleString()) : "٠"}</td>
                    <td style="color:var(--danger)">${toArabicNums(rVal.toLocaleString())}</td>
                    <td>${toArabicNums(date)}</td>
                    <td style="color:#f1c40f">${"⭐".repeat(rating)}</td>
                </tr>
            `);
        });

        totalRow.innerHTML = `
            <td>الجمـــــــالي العــــــــام</td>
            <td>${toArabicNums(sTotal.toLocaleString())}</td>
            <td>${toArabicNums(sPaid.toLocaleString())}</td>
            <td>${toArabicNums(sRem.toLocaleString())}</td>
            <td colspan="2">لعدد ${toArabicNums(document.querySelectorAll('.card').length)} زبائن</td>
        `;
    }

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const company = document.getElementById('companyNameInput').value;
        const name = card.querySelector('.c-name').value || "العميل";
        const phone = toEnglishNums(card.querySelector('.c-phone').value);
        const total = toEnglishNums(card.querySelector('.c-total').value);
        const totalVal = total === "" ? 0 : parseFloat(total);
        const totalW = tafqit(totalVal);
        
        let paidTotal = 0;
        let paysMsg = "";
        
        card.querySelectorAll('.pay-row').forEach((row, i) => {
            const valText = toEnglishNums(row.querySelector('.p-val').value);
            const date = row.querySelector('.p-date').value;
            if (valText !== "" && parseFloat(valText) > 0) {
                const valNum = parseFloat(valText);
                paidTotal += valNum;
                const dText = date ? toArabicNums(date.split('-').reverse().join('/')) : "----/--/--";
                paysMsg += `📍 *الدفعة (${toArabicNums(i+1)}):* ${toArabicNums(valNum.toLocaleString())} ج.م بتاريخ ${dText}\n`;
            }
        });

        const rem = totalVal - paidTotal;
        const remW = rem > 0 ? tafqit(rem) : "خالص السداد ✓";
        const remN = toArabicNums(rem.toLocaleString());
        const paidN = toArabicNums(paidTotal.toLocaleString());

        const welcome = `*السلام عليكم ورحمة الله وبركاته* 🌹\nتحية طيبة من *${company}* لسيادتكم.\nعناية الأستاذ/ *${name}* المحترم،`;
        const mainInfo = `نرفق لكم ملخص الحساب المالي الخاص بكم كما هو مسجل لدينا:`;
        const details = `💰 *الإجمالي المطلوب:* ${toArabicNums(totalVal.toLocaleString())} ج.م\n(${totalW})\n\n` +
                       `✅ *الدفعات التي تم استلامها:*\n${paysMsg || "لم يتم تسجيل دفعات بعد."}\n` +
                       `━━━━━━━━━━━━━━\n` +
                       `💵 *إجمالي المدفوع:* ${paidN} ج.م\n` +
                       `⚠️ *المتبقي حالياً:* ${remN} ج.م\n` +
                       `(${remW})`;

        const closing = `🙏 *شكراً لثقتكم بنا، دائماً في خدمتكم.*\n📅 *تحريراً في:* ${toArabicNums(new Date().toLocaleDateString('ar-EG'))}`;
        const fullMsg = `${welcome}\n\n${mainInfo}\n\n${details}\n\n${closing}`;
        
        if (!phone || phone.length < 5) { alert("يرجى كتابة رقم الموبايل أولاً"); return; }
        window.open(`https://wa.me/2${phone}?text=${encodeURIComponent(fullMsg)}`, '_blank');
    }

    function saveToCloud(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card) return;
        db.ref('azemaa_v5/zbon/' + id).set({
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            dd: card.querySelector('.d-day').value,
            dm: card.querySelector('.d-month').value,
            dy: card.querySelector('.d-year').value,
            r: card.querySelector(`input[name="rate-${id}"]:checked`)?.value || 0,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.pay-row')).map(r => ({
                dt: r.querySelector('.p-date').value, vl: r.querySelector('.p-val').value
            }))
        });
    }

    db.ref('azemaa_v5/zbon').on('value', (snap) => {
        const grid = document.getElementById('mainGrid'); grid.innerHTML = "";
        const data = snap.val(); if(!data) return;
        Object.keys(data).sort().reverse().forEach((id, i) => {
            grid.appendChild(createCardHTML(id, Object.keys(data).length - i));
            fillCardData(id, data[id]);
        });
        updateGlobalSummary();
    });

    function fillCardData(id, d) {
        const card = document.getElementById(`card-${id}`); if (!card) return;
        card.querySelector('.c-name').value = d.n || "";
        card.querySelector('.c-phone').value = d.p || "";
        card.querySelector('.d-day').value = d.dd || "";
        card.querySelector('.d-month').value = d.dm || "";
        card.querySelector('.d-year').value = d.dy || "";
        card.querySelector('.c-total').value = d.t || "";
        card.querySelector('.c-notes').value = d.notes || "";
        if (d.r) { const star = card.querySelector(`#star-${id}-${d.r}`); if(star) star.checked = true; }
        if(d.pays) d.pays.forEach((p, i) => {
            const row = card.querySelectorAll('.pay-row')[i];
            if(row) { 
                row.querySelector('.p-date').value = p.dt || ""; 
                // نضع القيمة كما هي في قاعدة البيانات (فارغة تظل فارغة)
                row.querySelector('.p-val').value = p.vl || ""; 
            }
        });
        updateLogic(id);
    }

    function addNewCustomer() { db.ref('azemaa_v5/zbon/' + "z" + Date.now()).set({ n: "" }); }
    function manualSave(id) { saveToCloud(id); alert("✅ تم الحفظ"); }
    function deleteCustomer(id) { if(confirm("حذف؟")) db.ref('azemaa_v5/zbon/' + id).remove(); }
    function saveCoName() { localStorage.setItem('azemaa_co_v5', document.getElementById('companyNameInput').value); }
    function autoGrow(el) { el.style.height = "40px"; el.style.height = (el.scrollHeight) + "px"; }

    function refreshStats() {
        let debt = 0, cust = 0, paidC = 0;
        document.querySelectorAll('.card').forEach(c => {
            const tText = toEnglishNums(c.querySelector('.c-total').value);
            const t = tText === "" ? 0 : parseFloat(tText);
            if(t > 0) { cust++; 
                let p = 0; 
                c.querySelectorAll('.p-val').forEach(v => {
                    const vt = toEnglishNums(v.value);
                    p += vt === "" ? 0 : parseFloat(vt);
                }); 
                debt += (t - p > 0 ? t - p : 0); if (t - p <= 0) paidC++;
            }
        });
        document.getElementById('stat-debt').innerText = toArabicNums(debt.toLocaleString());
        document.getElementById('stat-cust').innerText = toArabicNums(cust);
        document.getElementById('stat-paid').innerText = toArabicNums(paidC);
    }

    function filterAll() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('.card').forEach(c => {
            c.style.display = c.querySelector('.c-name').value.toLowerCase().includes(q) ? "block" : "none";
        });
        updateGlobalSummary();
    }

    window.onload = () => {
        document.getElementById('companyNameInput').value = localStorage.getItem('azemaa_co_v5') || "فرح للمطابخ";
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('ar-EG');
            document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
        }, 1000);
    };
</script>
</body>
</html>
