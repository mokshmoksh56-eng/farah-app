<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO | منظومة الإدارة الذكية</title>
    
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #27ae60; 
            --danger: #c0392b;
            --bg-odd: #ffffff; 
            --bg-even: #f2f5f7; 
            --active-bg: #fffceb;
            --glow: 0 0 25px rgba(10, 61, 98, 0.4);
            --star-color: #f1c40f;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; padding-bottom: 100px; }
        
        .top-bar { background: #072d48; color: #1abc9c; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; }

        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        #companyNameInput, #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; outline: none; width: 100%; box-sizing: border-box; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

        .card { border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #ced4da; display: none; transition: 0.3s; background: white; }
        .card.visible { display: block; }
        .card.paid { border: 3px solid var(--success) !important; background-color: #f0fff4 !important; }

        label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 1px; color: #444; }
        input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 13px; font-weight: 900; margin-bottom: 4px; }
        
        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; }
        
        .date-input-group { display: flex; align-items: center; background: #fff0f0; border: 1.5px solid #e74c3c; border-radius: 8px; padding: 2px 5px; }
        .date-input-group input { border: none !important; background: transparent !important; text-align: center; color: #c0392b; font-size: 14px; width: 100%; }

        .rating-area { display: flex; flex-direction: row-reverse; justify-content: center; margin-bottom: 5px; }
        .rating-area input { display: none; }
        .rating-area label { font-size: 22px; color: #ccc; cursor: pointer; }
        .rating-area input:checked ~ label { color: var(--star-color); }

        .tafqit-box { background: rgba(238, 247, 255, 0.9); color: #0a3d62; padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; border-right: 3px solid var(--accent); margin-bottom: 8px; }
        .tafqit-mini { font-size: 9px; color: #3c6382; margin-bottom: 5px; min-height: 10px; }

        .payment-section { background: rgba(255,255,255,0.4); padding: 8px; border-radius: 12px; border: 1px dashed #aaa; margin-bottom: 8px; }
        .pay-row { display: grid; grid-template-columns: 120px 1fr; gap: 5px; }

        .result-box { background: var(--primary); color: white; padding: 10px; border-radius: 12px; text-align: center; }
        
        .archive-section { max-width: 1100px; margin: 30px auto; padding: 0 10px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: right; font-size: 13px; }
        th { background: #f8f9fa; color: #666; }

        .btn-add-client { position: fixed; bottom: 20px; right: 20px; background: #1abc9c; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }
        
        .btn-card { width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; color: white; margin-top: 5px; }
        .btn-save { background: var(--primary); }
        .btn-wa { background: var(--success); }
        
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 30px; border-radius: 30px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div class="top-bar">
    <span id="liveClock">00:00:00</span>
    <span id="liveDate">--/--/----</span>
</div>

<div id="toast">✅ تم الحفظ والمزامنة</div>

<div class="header">
    <h1>AZEMAA PRO | <span id="currentYear"></span></h1>
</div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اسم شركتك..." oninput="saveSettings()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث في الكروت والأرشيف..." onkeyup="filterAll()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">٠</div></div>
    <div class="stat-card"><h4>العملاء</h4><div id="stat-cust">٠</div></div>
    <div class="stat-card"><h4>الخالص</h4><div id="stat-paid">٠</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<div class="archive-section">
    <div class="archive-header" style="background:#2c3e50; color:white; padding:10px; border-radius:10px 10px 0 0;">🗄️ سجل العملاء (الأرشيف المالي)</div>
    <table>
        <thead>
            <tr>
                <th>الاسم</th>
                <th>تاريخ الاستلام</th>
                <th>الإجمالي</th>
                <th>المتبقي</th>
                <th>التقييم</th>
            </tr>
        </thead>
        <tbody id="archiveBody"></tbody>
    </table>
</div>

<button class="btn-add-client" onclick="addNewCard()">+</button>

<script>
    // --- إعدادات Firebase ---
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        projectId: "azemaa-proo",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- دوال التفقيط ---
    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function tafqit(n) {
        n = Math.floor(n); if (n <= 0) return 'صفر جنيهاً';
        let res = '', k = Math.floor(n / 1000);
        if (k > 0) {
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            n %= 1000;
        }
        res += tafqitBasic(n);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }

    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    function toArabicNums(str) { return str.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]); }

    // --- إدارة الكروت ---
    let visibleCards = JSON.parse(localStorage.getItem('azemaa_visible_cards')) || [];

    function createCardElement(i) {
        const card = document.createElement('div');
        card.className = `card ${visibleCards.includes(i) ? 'visible' : ''}`;
        card.id = `card-${i}`;
        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; color:var(--accent);">
                <span>👤 عميل رقم ${i}</span>
                <button onclick="deleteCard(${i})" style="color:red; border:none; background:none; cursor:pointer;">🗑️</button>
            </div>
            
            <label>الاسم:</label><input type="text" class="c-name" oninput="updateLogic(${i})">
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div><label>الموبايل:</label><input type="tel" class="c-phone" oninput="updateLogic(${i})"></div>
                <div>
                    <label>📅 ميعاد الاستلام:</label>
                    <div class="date-input-group">
                        <input type="text" class="d-day" placeholder="يوم" oninput="updateLogic(${i})"> /
                        <input type="text" class="d-month" placeholder="شهر" oninput="updateLogic(${i})"> /
                        <input type="text" class="d-year" placeholder="سنة" oninput="updateLogic(${i})">
                    </div>
                </div>
            </div>

            <div class="rating-area">
                ${[5,4,3,2,1].map(s => `<input type="radio" id="star${s}-${i}" name="rating-${i}" value="${s}" onclick="updateLogic(${i})"><label for="star${s}-${i}">★</label>`).join('')}
            </div>

            <label>💰 الإجمالي المطلوب:</label><input type="number" class="c-total" oninput="updateLogic(${i})">
            <div class="tafqit-box" id="tafqit-total-${i}"></div>
            
            <div class="payment-section">
                <label>💳 دفعات السداد وتواريخها:</label>
                ${[1,2,3,4].map(n => `
                    <div style="margin-bottom:8px;">
                        <div class="pay-row">
                            <input type="date" class="p-date" oninput="updateLogic(${i})">
                            <input type="number" class="p-val" placeholder="مبلغ الدفعة ${n}" oninput="updateLogic(${i})">
                        </div>
                        <div class="tafqit-mini" id="tafqit-pay-${i}-${n}"></div>
                    </div>
                `).join('')}
            </div>

            <textarea class="c-notes" placeholder="ملاحظات..." style="height:40px;" oninput="updateLogic(${i})"></textarea>

            <div class="result-box">
                <div id="rem-n-${i}">المتبقي: --</div>
                <div id="rem-w-${i}" style="font-size:10px; color:#00d2ff;"></div>
            </div>
            
            <button class="btn-card btn-save" onclick="saveToCloud(${i})">💾 حفظ ومزامنة للسحابة</button>
            <button class="btn-card btn-wa" onclick="sendWA(${i})">إرسال عبر واتساب</button>
        `;
        document.getElementById('mainGrid').appendChild(card);
    }

    for (let i = 1; i <= 50; i++) createCardElement(i);

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        const total = parseFloat(card.querySelector('.c-total').value) || 0;
        document.getElementById(`tafqit-total-${id}`).innerText = total > 0 ? tafqit(total) : "";

        let paid = 0;
        card.querySelectorAll('.p-val').forEach((p, idx) => {
            let v = parseFloat(p.value) || 0;
            paid += v;
            document.getElementById(`tafqit-pay-${id}-${idx+1}`).innerText = v > 0 ? tafqit(v) : "";
        });

        const rem = total - paid;
        document.getElementById(`rem-n-${id}`).innerText = `المتبقي: ${toArabicNums(rem.toLocaleString())} ج.م`;
        document.getElementById(`rem-w-${id}`).innerText = rem > 0 ? tafqit(rem) : (total > 0 ? "خالص ✓" : "");

        if (rem <= 0 && total > 0) card.classList.add('paid'); else card.classList.remove('paid');
        refreshStats();
        updateArchive();
    }

    function saveToCloud(id) {
        const card = document.getElementById(`card-${id}`);
        const data = {
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            dd: card.querySelector('.d-day').value,
            dm: card.querySelector('.d-month').value,
            dy: card.querySelector('.d-year').value,
            r: card.querySelector(`input[name="rating-${id}"]:checked`)?.value || 0,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.p-val')).map((p, idx) => ({
                v: p.value,
                d: card.querySelectorAll('.p-date')[idx].value
            }))
        };

        db.ref('clients/' + id).set(data).then(() => {
            const t = document.getElementById('toast');
            t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000);
        });
        localStorage.setItem(`azemaa_pro_v5_${id}`, JSON.stringify(data));
    }

    window.onload = () => {
        const savedCo = localStorage.getItem('azemaa_company_name');
        if(savedCo) document.getElementById('companyNameInput').value = savedCo;
        
        db.ref('clients').once('value', (snapshot) => {
            const allData = snapshot.val();
            if (allData) {
                for (let id in allData) {
                    const d = allData[id];
                    const card = document.getElementById(`card-${id}`);
                    if (card) {
                        if (!visibleCards.includes(parseInt(id))) {
                            visibleCards.push(parseInt(id));
                            card.classList.add('visible');
                        }
                        card.querySelector('.c-name').value = d.n || '';
                        card.querySelector('.c-phone').value = d.p || '';
                        card.querySelector('.d-day').value = d.dd || '';
                        card.querySelector('.d-month').value = d.dm || '';
                        card.querySelector('.d-year').value = d.dy || '';
                        if (d.r) { document.getElementById(`star${d.r}-${id}`).checked = true; }
                        card.querySelector('.c-total').value = d.t || '';
                        card.querySelector('.c-notes').value = d.notes || '';
                        const pV = card.querySelectorAll('.p-val');
                        const pD = card.querySelectorAll('.p-date');
                        if (d.pays) d.pays.forEach((p, idx) => { 
                            if(pV[idx]) pV[idx].value = p.v; 
                            if(pD[idx]) pD[idx].value = p.d;
                        });
                        updateLogic(id);
                    }
                }
                localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
            }
        });
    };

    function addNewCard() {
        for (let i = 1; i <= 50; i++) {
            if (!visibleCards.includes(i)) {
                visibleCards.push(i);
                document.getElementById(`card-${i}`).classList.add('visible');
                localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
                return;
            }
        }
    }

    function deleteCard(id) {
        if(confirm('سيتم الحذف نهائياً من السحابة؟')) {
            db.ref('clients/' + id).remove();
            visibleCards = visibleCards.filter(c => c !== id);
            localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
            location.reload();
        }
    }

    function updateArchive() {
        const body = document.getElementById('archiveBody');
        body.innerHTML = "";
        visibleCards.forEach(id => {
            const card = document.getElementById(`card-${id}`);
            const name = card.querySelector('.c-name').value;
            if(name) {
                const total = parseFloat(card.querySelector('.c-total').value) || 0;
                let paid = 0; card.querySelectorAll('.p-val').forEach(p => paid += (parseFloat(p.value) || 0));
                const rem = total - paid;
                const r = card.querySelector(`input[name="rating-${id}"]:checked`)?.value || 0;
                body.innerHTML += `<tr>
                    <td>${name}</td>
                    <td>${card.querySelector('.d-day').value}/${card.querySelector('.d-month').value}</td>
                    <td>${total}</td>
                    <td style="color:${rem>0?'red':'green'}">${rem}</td>
                    <td>${"★".repeat(r)}</td>
                </tr>`;
            }
        });
    }

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const name = card.querySelector('.c-name').value || "عميلنا";
        const phone = card.querySelector('.c-phone').value;
        const rem = document.getElementById(`rem-n-${id}`).innerText;
        if(!phone) return alert("أدخل الموبايل");
        const msg = `أهلاً بك يا ${name}%0Aتقرير حسابك من ${document.getElementById('companyNameInput').value}:%0A${rem}%0Aنعتز بخدمتكم دائماً.`;
        window.open(`https://wa.me/2${phone}?text=${msg}`, '_blank');
    }

    function refreshStats() {
        let debt = 0, cust = 0, paidC = 0;
        visibleCards.forEach(id => {
            const card = document.getElementById(`card-${id}`);
            const total = parseFloat(card.querySelector('.c-total').value) || 0;
            let paid = 0; card.querySelectorAll('.p-val').forEach(p => paid += (parseFloat(p.value) || 0));
            if(total > 0) { cust++; debt += (total - paid); if(total <= paid) paidC++; }
        });
        document.getElementById('stat-debt').innerText = toArabicNums(debt.toLocaleString());
        document.getElementById('stat-cust').innerText = toArabicNums(cust);
        document.getElementById('stat-paid').innerText = toArabicNums(paidC);
    }

    function filterAll() {
        let q = document.getElementById('searchInput').value.toLowerCase();
        visibleCards.forEach(id => {
            const card = document.getElementById(`card-${id}`);
            card.style.display = card.innerText.toLowerCase().includes(q) ? "block" : "none";
        });
    }

    function saveSettings() { localStorage.setItem('azemaa_company_name', document.getElementById('companyNameInput').value); }
    
    // الساعة الحية
    setInterval(() => {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('ar-EG');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
        document.getElementById('currentYear').innerText = now.getFullYear();
    }, 1000);
</script>
</body>
</html>
