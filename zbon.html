<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO | منظومة الإدارة الذكية</title>
    <style>
        :root {
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #27ae60; 
            --danger: #c0392b;
            --bg-odd: #ffffff; 
            --bg-even: #f2f5f7; 
            --active-bg: #fffceb;
            --glow: 0 0 25px rgba(10, 61, 98, 0.4);
            --star-color: #f1c40f;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; padding-bottom: 100px; }
        
        .top-bar { background: #072d48; color: #1abc9c; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; }

        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .toolbar { grid-template-columns: 1fr; } }

        #companyNameInput, #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; outline: none; width: 100%; box-sizing: border-box; }
        #companyNameInput { border-color: #1abc9c; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        .stat-card h4 { margin: 2px 0; font-size: 13px; }
        .stat-card div { font-size: 15px; font-weight: 900; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

        .card { border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #ced4da; position: relative; display: none; }
        .card.visible { display: block; }
        .card:nth-child(odd) { background-color: var(--bg-odd); }
        .card:nth-child(even) { background-color: var(--bg-even); }
        .card:focus-within { background-color: var(--active-bg) !important; border: 3px solid var(--accent); box-shadow: var(--glow); transform: scale(1.01); z-index: 5; }
        
        .card.paid { border: 3px solid var(--danger) !important; background-color: #fdf2f2 !important; }

        .client-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 10px; color: var(--accent); }
        .btn-delete { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 18px; }

        label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 1px; color: #444; }
        input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 13px; font-weight: 900; margin-bottom: 4px; font-family: inherit; }
        
        .c-name { background-color: #f0f7ff !important; border: 1.5px solid #3c6382 !important; }
        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; font-size: 16px !important; }
        
        .date-input-group { display: flex; align-items: center; background: #fff0f0; border: 1.5px solid #e74c3c; border-radius: 8px; padding: 2px 5px; direction: rtl; }
        .date-input-group input { border: none !important; background: transparent !important; text-align: center; padding: 5px 2px; margin: 0; color: #c0392b; font-size: 14px; font-weight: 900; width: 100%; }
        .date-separator { color: #e74c3c; font-weight: bold; padding: 0 2px; }

        .rating-area { display: flex; flex-direction: row-reverse; justify-content: center; margin-bottom: 5px; }
        .rating-area input { display: none; }
        .rating-area label { font-size: 20px; color: #ccc; cursor: pointer; }
        .rating-area input:checked ~ label { color: var(--star-color); }

        .tafqit-box { background: rgba(238, 247, 255, 0.9); color: #0a3d62; padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; border-right: 3px solid var(--accent); margin-bottom: 8px; min-height: 12px; }
        
        .payment-section { background: rgba(255,255,255,0.4); padding: 8px; border-radius: 12px; border: 1px dashed #aaa; margin-bottom: 8px; }
        .pay-row { display: grid; grid-template-columns: 100px 1fr; gap: 5px; margin-bottom: 3px; }

        .result-box { background: var(--primary); color: white; padding: 10px; border-radius: 12px; text-align: center; }
        
        /* الأرشيف */
        .archive-section { max-width: 1100px; margin: 30px auto; padding: 0 10px; }
        .archive-header { background: #2c3e50; color: #ecf0f1; padding: 10px 15px; border-radius: 12px 12px 0 0; font-size: 16px; font-weight: 900; }
        .archive-table-container { background: white; border-radius: 0 0 12px 12px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #f8f9fa; padding: 10px; text-align: right; font-size: 11px; border-bottom: 2px solid #dee2e6; color: #666; }
        td { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #eee; white-space: nowrap; }
        .archive-stars { color: var(--star-color); font-size: 14px; }
        .archive-date { color: #c0392b; font-weight: bold; font-size: 12px; }
        .archive-val { font-weight: bold; }
        .archive-val.total { color: #d35400; }
        .archive-val.paid { color: var(--success); }
        .archive-val.rem { font-weight: 900; }
        .archive-val.rem.red { color: var(--danger); }
        .archive-val.rem.green { color: var(--success); }
        .archive-notes { font-size: 11px; color: #7f8c8d; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }

        .btn-add-client { position: fixed; bottom: 20px; right: 20px; background: #1abc9c; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }
        
        .card-footer { display: flex; gap: 5px; margin-top: 10px; }
        .btn-card { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; color: white; }
        .btn-save { background: var(--accent); }
        .btn-wa { background: var(--success); }
        
        #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 10px 25px; border-radius: 30px; display: none; z-index: 1000; }
    </style>
</head>
<body>

<div class="top-bar">
    <span id="liveClock">00:00:00</span>
    <span id="liveDate">--/--/----</span>
</div>

<div id="toast">✅ تم الحفظ بنجاح</div>

<div class="header">
    <h1>AZEMAA PRO | <span id="currentYear"></span></h1>
</div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اسم شركتك..." oninput="saveSettings()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث عن عميل..." onkeyup="filterCards()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">0</div></div>
    <div class="stat-card"><h4>العملاء</h4><div id="stat-cust">0</div></div>
    <div class="stat-card"><h4>الخالص</h4><div id="stat-paid">0</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<!-- سجل الأرشيف المحدث -->
<div class="archive-section">
    <div class="archive-header">🗄️ سجل العملاء (الأرشيف المالي)</div>
    <div class="archive-table-container">
        <table>
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>تاريخ الاستلام</th>
                    <th>الإجمالي</th>
                    <th>المدفوع</th>
                    <th>المتبقي</th>
                    <th>التقييم</th>
                    <th>الملحوظات</th>
                </tr>
            </thead>
            <tbody id="archiveBody"></tbody>
        </table>
    </div>
</div>

<button class="btn-add-client" onclick="addNewCard()" title="إضافة عميل جديد">+</button>

<script>
    function toArabicNums(str) {
        if(!str && str !== 0) return "";
        const id = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
        return str.toString().replace(/[0-9]/g, function(w) { return id[+w]; });
    }

    function toEnglishNums(str) {
        if(!str) return "0";
        const arabicNums = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        let s = str.toString();
        for (let i = 0; i < 10; i++) s = s.replace(arabicNums[i], i);
        return s;
    }

    function forceArabicNumbers(input) { input.value = toArabicNums(input.value); }
    function forceEnglishNumbers(input) { input.value = toEnglishNums(input.value); }

    function updateDateTime() {
        const now = new Date();
        document.getElementById('liveClock').innerText = now.toLocaleTimeString('ar-EG');
        document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
        document.getElementById('currentYear').innerText = now.getFullYear();
    }
    setInterval(updateDateTime, 1000); updateDateTime();

    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function tafqit(n) {
        n = Math.floor(n); if (n <= 0) return '';
        let res = '', k = Math.floor(n / 1000);
        if (k > 0) {
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            n %= 1000;
        }
        res += tafqitBasic(n);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }

    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    let visibleCards = JSON.parse(localStorage.getItem('azemaa_visible_cards')) || [];

    function createCardElement(i) {
        const card = document.createElement('div');
        card.className = `card ${visibleCards.includes(i) ? 'visible' : ''}`;
        card.id = `card-${i}`;
        card.innerHTML = `
            <div class="client-head">
                <span>عميل رقم ${i}</span>
                <button class="btn-delete" onclick="deleteCard(${i})">🗑️</button>
            </div>
            <label>👤 الاسم:</label><input type="text" class="c-name" oninput="updateLogic(${i})">
            
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
                <div><label>📱 الموبايل:</label><input type="tel" class="c-phone" placeholder="01..." oninput="updateLogic(${i})"></div>
                <div>
                    <label>📅 ميعاد الاستلام:</label>
                    <div class="date-input-group">
                        <input type="text" class="d-day" placeholder="يوم" oninput="forceArabicNumbers(this); updateLogic(${i})">
                        <span class="date-separator">/</span>
                        <input type="text" class="d-month" placeholder="شهر" oninput="forceArabicNumbers(this); updateLogic(${i})">
                        <span class="date-separator">/</span>
                        <input type="text" class="d-year" placeholder="سنة" oninput="forceArabicNumbers(this); updateLogic(${i})">
                    </div>
                </div>
            </div>

            <div class="rating-area">
                ${[5,4,3,2,1].map(s => `<input type="radio" id="star${s}-${i}" name="rating-${i}" value="${s}" onclick="updateLogic(${i})"><label for="star${s}-${i}">★</label>`).join('')}
            </div>

            <label>💰 الإجمالي:</label><input type="text" class="c-total" oninput="forceEnglishNumbers(this); updateLogic(${i})">
            <div class="tafqit-box" id="tafqit-total-${i}"></div>
            
            <div class="payment-section">
                ${[1,2,3,4].map(n => `
                    <div class="pay-row">
                        <input type="date" class="p-date" oninput="updateLogic(${i})">
                        <input type="text" class="p-val" placeholder="المبلغ" oninput="forceEnglishNumbers(this); updateLogic(${i})">
                    </div>
                `).join('')}
            </div>

            <textarea class="c-notes" placeholder="ملاحظات العميل..." style="min-height:40px;" oninput="updateLogic(${i})"></textarea>

            <div class="result-box">
                <div class="num" id="rem-n-${i}">0 ج.م</div>
                <div id="rem-w-${i}" style="font-size:10px; color:#00d2ff;">--</div>
            </div>
            
            <div class="card-footer">
                <button class="btn-card btn-save" onclick="saveFixedBtn(${i})">💾 حفظ</button>
                <button class="btn-card btn-wa" onclick="sendWA(${i})">واتساب</button>
            </div>
        `;
        document.getElementById('mainGrid').appendChild(card);
    }

    for (let i = 1; i <= 100; i++) createCardElement(i);

    function addNewCard() {
        for (let i = 1; i <= 100; i++) {
            if (!visibleCards.includes(i)) {
                visibleCards.push(i);
                document.getElementById(`card-${i}`).classList.add('visible');
                localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
                return;
            }
        }
    }

    function deleteCard(id) {
        if (confirm('حذف هذا العميل نهائياً؟')) {
            visibleCards = visibleCards.filter(c => c !== id);
            localStorage.setItem('azemaa_visible_cards', JSON.stringify(visibleCards));
            localStorage.removeItem(`azemaa_pro_v5_${id}`);
            location.reload();
        }
    }

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        const total = parseFloat(toEnglishNums(card.querySelector('.c-total').value)) || 0;
        let paid = 0;
        card.querySelectorAll('.p-val').forEach(p => paid += parseFloat(toEnglishNums(p.value)) || 0);

        document.getElementById(`tafqit-total-${id}`).innerText = tafqit(total);
        const rem = total - paid;
        document.getElementById(`rem-n-${id}`).innerText = `المتبقي: ${rem.toLocaleString()} ج.م`;
        document.getElementById(`rem-w-${id}`).innerText = total > 0 ? (rem > 0 ? tafqit(rem) : (rem === 0 ? "خالس السداد ✓" : "زيادة")) : "--";

        if (rem <= 0 && total > 0) card.classList.add('paid'); else card.classList.remove('paid');
        saveToLocal(id);
        refreshStats();
        refreshArchive();
    }

    function saveToLocal(id) {
        const card = document.getElementById(`card-${id}`);
        const data = {
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            dy: card.querySelector('.d-year').value,
            dm: card.querySelector('.d-month').value,
            dd: card.querySelector('.d-day').value,
            r: card.querySelector(`input[name="rating-${id}"]:checked`)?.value || 0,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.pay-row')).map(r => ({
                dt: r.querySelector('.p-date').value,
                vl: r.querySelector('.p-val').value
            }))
        };
        localStorage.setItem(`azemaa_pro_v5_${id}`, JSON.stringify(data));
    }

    function refreshStats() {
        let debt = 0, cust = 0, paidCount = 0;
        visibleCards.forEach(i => {
            const s = localStorage.getItem(`azemaa_pro_v5_${i}`);
            if (s) {
                const d = JSON.parse(s);
                if (d.n) {
                    cust++;
                    let pT = 0; d.pays.forEach(p => pT += parseFloat(toEnglishNums(p.vl)) || 0);
                    let rem = (parseFloat(toEnglishNums(d.t)) || 0) - pT;
                    if (rem > 0) debt += rem;
                    if (rem <= 0 && parseFloat(toEnglishNums(d.t)) > 0) paidCount++;
                }
            }
        });
        document.getElementById('stat-debt').innerText = debt.toLocaleString() + ' ج.م';
        document.getElementById('stat-cust').innerText = cust;
        document.getElementById('stat-paid').innerText = paidCount;
    }

    function refreshArchive() {
        const tbody = document.getElementById('archiveBody');
        tbody.innerHTML = "";
        visibleCards.forEach(i => {
            const s = localStorage.getItem(`azemaa_pro_v5_${i}`);
            if (s) {
                const d = JSON.parse(s);
                if (d.n) {
                    const stars = "★".repeat(d.r) + "☆".repeat(5-d.r);
                    const fullDate = `${d.dd || ''} / ${d.dm || ''} / ${d.dy || ''}`;
                    
                    let pT = 0; d.pays.forEach(p => pT += parseFloat(toEnglishNums(p.vl)) || 0);
                    let totalVal = parseFloat(toEnglishNums(d.t)) || 0;
                    let remVal = totalVal - pT;
                    
                    let remStr = remVal > 0 ? `${toArabicNums(remVal.toLocaleString())} ج.م` : "خالص ✓";
                    let remClass = remVal > 0 ? "red" : "green";

                    const row = `
                        <tr>
                            <td>${d.n}</td>
                            <td class="archive-date">${fullDate === ' /  / ' ? '---' : toArabicNums(fullDate)}</td>
                            <td class="archive-val total">${toArabicNums(totalVal.toLocaleString())} ج.م</td>
                            <td class="archive-val paid">${toArabicNums(pT.toLocaleString())} ج.م</td>
                            <td class="archive-val rem ${remClass}">${remStr}</td>
                            <td class="archive-stars">${stars}</td>
                            <td class="archive-notes" title="${d.notes}">${d.notes || '---'}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                }
            }
        });
    }

    function filterCards() {
        let q = document.getElementById('searchInput').value.toLowerCase();
        visibleCards.forEach(id => {
            const card = document.getElementById(`card-${id}`);
            const text = card.querySelector('.c-name').value + card.querySelector('.c-phone').value;
            card.style.display = text.toLowerCase().includes(q) ? "block" : "none";
        });
    }

    function saveFixedBtn(id) {
        updateLogic(id);
        const t = document.getElementById('toast');
        t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500);
    }

    window.onload = () => {
        const savedCo = localStorage.getItem('azemaa_company_name');
        if(savedCo) document.getElementById('companyNameInput').value = savedCo;

        visibleCards.forEach(i => {
            const s = localStorage.getItem(`azemaa_pro_v5_${i}`);
            if (s) {
                const d = JSON.parse(s);
                const card = document.getElementById(`card-${i}`);
                card.querySelector('.c-name').value = d.n || '';
                card.querySelector('.c-phone').value = d.p || '';
                if(d.dy) card.querySelector('.d-year').value = d.dy;
                if(d.dm) card.querySelector('.d-month').value = d.dm;
                if(d.dd) card.querySelector('.d-day').value = d.dd;
                if (d.r) { const rb = document.getElementById(`star${d.r}-${i}`); if(rb) rb.checked = true; }
                card.querySelector('.c-total').value = d.t || '';
                card.querySelector('.c-notes').value = d.notes || '';
                const rows = card.querySelectorAll('.pay-row');
                if (d.pays) d.pays.forEach((p, idx) => { if(rows[idx]) { rows[idx].querySelector('.p-date').value = p.dt; rows[idx].querySelector('.p-val').value = p.vl; }});
                updateLogic(i);
            }
        });
        refreshStats();
        refreshArchive();
    };

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const name = card.querySelector('.c-name').value || "عميلنا العزيز";
        const phone = card.querySelector('.c-phone').value;
        const total = parseFloat(toEnglishNums(card.querySelector('.c-total').value)) || 0;
        const coName = document.getElementById('companyNameInput').value || "إدارة الحسابات";
        const fullDate = `${card.querySelector('.d-day').value} / ${card.querySelector('.d-month').value} / ${card.querySelector('.d-year').value}`;

        if (!phone) { alert("أدخل الرقم!"); return; }

        let paid = 0;
        card.querySelectorAll('.p-val').forEach(p => paid += parseFloat(toEnglishNums(p.value)) || 0);
        const rem = total - paid;
        
        let msg = `*${coName}*%0A---------------------------%0A👤 العميل: ${name}%0A📅 موعد الاستلام: ${toArabicNums(fullDate)}%0A💰 الإجمالي: ${toArabicNums(total)} ج.م%0A💵 المتبقي: ${toArabicNums(rem.toLocaleString())} ج.م%0A📑 فقط: ${tafqit(rem)}%0A---------------------------%0Aشكراً لتعاملكم معنا ✨`;
        window.open(`https://wa.me/2${phone.trim()}?text=${msg}`, '_blank');
    }

    function saveSettings() { localStorage.setItem('azemaa_company_name', document.getElementById('companyNameInput').value); }
</script>
</body>
</html>
