<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO | منظومة الإدارة الشاملة</title>
    <style>
        :root {
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #c0392b; 
            --bg-odd: #ffffff; 
            --bg-even: #f2f5f7; 
            --active-bg: #fffceb;
            --glow: 0 0 25px rgba(10, 61, 98, 0.4);
            --star-color: #f1c40f;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; }
        
        .top-bar { background: #072d48; color: #1abc9c; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .header h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 1px; }

        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .toolbar { grid-template-columns: 1fr; } }

        #companyNameInput { padding: 12px; border-radius: 12px; border: 2px solid #1abc9c; font-size: 16px; font-weight: 900; background: #fff; color: #072d48; outline: none; }
        #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; box-shadow: 0 4px 6px rgba(0,0,0,0.05); outline: none; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        .stat-card h4 { margin: 2px 0; font-size: 13px; }
        .stat-card div { font-size: 15px; font-weight: 900; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

        .card { border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: 1px solid #ced4da; transition: 0.3s; position: relative; }
        .card:nth-child(odd) { background-color: var(--bg-odd); }
        .card:nth-child(even) { background-color: var(--bg-even); }
        .card:focus-within { background-color: var(--active-bg) !important; border: 3px solid var(--accent); box-shadow: var(--glow); transform: scale(1.01); z-index: 5; }
        
        .card.paid { border: 3px solid #c0392b !important; background-color: #fdf2f2 !important; }
        .card.paid .result-box { background: #c0392b !important; }

        label { display: block; font-size: 10px; font-weight: bold; margin-bottom: 1px; color: #444; }
        input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 13px; font-weight: 900; margin-bottom: 4px; font-family: inherit; }
        
        .c-name { background-color: #f0f7ff !important; border: 1.5px solid #3c6382 !important; color: #0a3d62 !important; }
        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; font-size: 16px !important; }
        .p-val { background-color: #f6fff8 !important; border: 1px solid #218c74 !important; color: #1e8449 !important; }

        .rating-area { display: flex; flex-direction: row-reverse; justify-content: center; margin-bottom: 5px; background: #fdfdfd; padding: 2px; border-radius: 8px; border: 1px solid #eee; line-height: 1; }
        .rating-area input { display: none; }
        .rating-area label { font-size: 18px; color: #ccc; cursor: pointer; transition: 0.2s; margin: 0 1px; padding: 0 2px; }
        .rating-area input:checked ~ label { color: var(--star-color); }
        .rating-area label:hover, .rating-area label:hover ~ label { color: var(--star-color); }

        .tafqit-box { background: rgba(238, 247, 255, 0.9); color: #0a3d62; padding: 4px 6px; border-radius: 6px; font-size: 10px; font-weight: 800; border-right: 3px solid var(--accent); margin-bottom: 8px; min-height: 12px; }
        .payment-section { background: rgba(255,255,255,0.4); padding: 8px; border-radius: 12px; border: 1px dashed #aaa; margin-bottom: 8px; }
        .pay-row { display: grid; grid-template-columns: 100px 1fr; gap: 5px; margin-bottom: 3px; }

        .result-box { background: var(--primary); color: white; padding: 10px; border-radius: 12px; text-align: center; }
        .result-box .num { font-size: 16px; font-weight: 900; }
        
        .card-footer { display: flex; gap: 5px; margin-top: 10px; }
        .btn-card { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: 900; color: white; font-size: 13px; transition: 0.2s; }
        .btn-save { background: var(--accent); }
        .btn-wa { background: #27ae60; }
        
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 10px 25px; border-radius: 30px; display: none; z-index: 1000; font-weight: 900; font-size: 14px; }
    </style>
</head>
<body>

<div class="top-bar">
    <span id="liveClock">00:00:00</span>
    <span id="liveDate">--/--/----</span>
</div>

<div id="toast">✅ تم الحفظ بنجاح</div>
<div class="header">
    <h1 id="mainTitle">AZEMAA PRO | <span id="currentYear"></span></h1>
</div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اكتب اسم شركتك / نشاطك هنا..." oninput="saveSettings()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الرقم..." onkeyup="filterCards()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">0</div></div>
    <div class="stat-card"><h4>عدد الزبائن</h4><div id="stat-cust">0</div></div>
    <div class="stat-card"><h4>خالص السداد</h4><div id="stat-paid">0</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<script>
    function convertToEnglishNums(str) {
        const arabicNums = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) str = str.replace(arabicNums[i], i);
        return str;
    }

    function forceEnglishNumbers(input) {
        input.value = convertToEnglishNums(input.value);
    }

    function updateDateTime() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ar-EG', { hour12: true });
        const dateStr = now.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('liveClock').innerText = timeStr;
        document.getElementById('liveDate').innerText = dateStr;
        document.getElementById('currentYear').innerText = now.getFullYear();
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function saveSettings() {
        localStorage.setItem('azemaa_company_name', document.getElementById('companyNameInput').value);
    }

    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function toArabic(n) {
        n = Math.floor(n); if (n <= 0) return '';
        let res = '';
        if (n >= 1000) {
            let k = Math.floor(n / 1000);
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            n %= 1000;
        }
        res += tafqitBasic(n);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }

    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    const COUNT = 100;
    const grid = document.getElementById('mainGrid');

    for (let i = 1; i <= COUNT; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${i}`;
        card.innerHTML = `
            <span class="client-head">عميل رقم ${i}</span>
            <label>👤 الاسم:</label><input type="text" class="c-name" oninput="updateLogic(${i})">
            <label>📱 الموبايل:</label><input type="tel" class="c-phone" placeholder="01..." oninput="updateLogic(${i})">
            
            <div class="rating-area">
                <input type="radio" id="star5-${i}" name="rating-${i}" value="5" onclick="updateLogic(${i})"><label for="star5-${i}">★</label>
                <input type="radio" id="star4-${i}" name="rating-${i}" value="4" onclick="updateLogic(${i})"><label for="star4-${i}">★</label>
                <input type="radio" id="star3-${i}" name="rating-${i}" value="3" onclick="updateLogic(${i})"><label for="star3-${i}">★</label>
                <input type="radio" id="star2-${i}" name="rating-${i}" value="2" onclick="updateLogic(${i})"><label for="star2-${i}">★</label>
                <input type="radio" id="star1-${i}" name="rating-${i}" value="1" onclick="updateLogic(${i})"><label for="star1-${i}">★</label>
            </div>

            <label>💰 الإجمالي:</label><input type="text" class="c-total" oninput="forceEnglishNumbers(this); updateLogic(${i})">
            <div class="tafqit-box" id="tafqit-total-${i}"></div>
            
            <div class="payment-section">
                ${[1,2,3,4].map(n => `
                    <div class="pay-row">
                        <input type="date" class="p-date" oninput="updateLogic(${i})">
                        <input type="text" class="p-val" placeholder="المبلغ" oninput="forceEnglishNumbers(this); updateLogic(${i})">
                    </div>
                    <div class="tafqit-box" id="tafqit-pay-${i}-${n}" style="font-size:10px;"></div>
                `).join('')}
            </div>

            <label>📝 ملاحظات:</label>
            <textarea class="c-notes" style="min-height:50px;" oninput="updateLogic(${i})"></textarea>

            <div class="result-box">
                <div class="num" id="rem-n-${i}">0 ج.م</div>
                <div class="word" id="rem-w-${i}" style="font-size:11px; color:#00d2ff;">--</div>
            </div>
            
            <div class="card-footer">
                <button class="btn-card btn-save" onclick="saveFixedBtn(${i})">💾 حفظ البيانات</button>
                <button class="btn-card btn-wa" onclick="sendWA(${i})">واتساب</button>
            </div>
        `;
        grid.appendChild(card);
    }

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        const total = parseFloat(card.querySelector('.c-total').value) || 0;
        const pays = card.querySelectorAll('.p-val');
        let paid = 0;

        document.getElementById(`tafqit-total-${id}`).innerText = toArabic(total);
        pays.forEach((p, idx) => {
            const v = parseFloat(p.value) || 0; paid += v;
            document.getElementById(`tafqit-pay-${id}-${idx+1}`).innerText = toArabic(v);
        });

        const rem = total - paid;
        document.getElementById(`rem-n-${id}`).innerText = `المتبقي: ${rem.toLocaleString()} ج.م`;
        document.getElementById(`rem-w-${id}`).innerText = total > 0 ? (rem > 0 ? toArabic(rem) : (rem === 0 ? "خالس السداد ✓" : "زيادة")) : "--";

        if (rem <= 0 && total > 0) card.classList.add('paid'); else card.classList.remove('paid');
        
        saveToLocal(id);
        refreshStats();
    }

    function saveToLocal(id) {
        const card = document.getElementById(`card-${id}`);
        const rating = card.querySelector(`input[name="rating-${id}"]:checked`)?.value || 0;
        const data = {
            n: card.querySelector('.c-name').value,
            p: card.querySelector('.c-phone').value,
            r: rating,
            t: card.querySelector('.c-total').value,
            notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.pay-row')).map(r => ({
                dt: r.querySelector('.p-date').value,
                vl: r.querySelector('.p-val').value
            }))
        };
        localStorage.setItem(`azemaa_pro_v5_${id}`, JSON.stringify(data));
    }

    function filterCards() {
        let query = convertToEnglishNums(document.getElementById('searchInput').value.toLowerCase());
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const name = card.querySelector('.c-name').value.toLowerCase();
            const phone = card.querySelector('.c-phone').value;
            card.style.display = (name.includes(query) || phone.includes(query)) ? "" : "none";
        });
    }

    function refreshStats() {
        let debt = 0, cust = 0, paidCount = 0;
        for (let i = 1; i <= COUNT; i++) {
            const s = localStorage.getItem(`azemaa_pro_v5_${i}`);
            if (s) {
                const d = JSON.parse(s);
                if (d.n) {
                    cust++;
                    let pT = 0; if (d.pays) d.pays.forEach(p => pT += parseFloat(p.vl) || 0);
                    let rem = (parseFloat(d.t) || 0) - pT;
                    if (rem > 0) debt += rem;
                    if (rem <= 0 && d.t > 0) paidCount++;
                }
            }
        }
        document.getElementById('stat-debt').innerText = debt.toLocaleString() + ' ج.م';
        document.getElementById('stat-cust').innerText = cust;
        document.getElementById('stat-paid').innerText = paidCount;
    }

    function saveFixedBtn(id) {
        updateLogic(id);
        const t = document.getElementById('toast');
        t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1500);
    }

    window.onload = () => {
        const savedCo = localStorage.getItem('azemaa_company_name');
        if(savedCo) document.getElementById('companyNameInput').value = savedCo;

        for (let i = 1; i <= COUNT; i++) {
            const s = localStorage.getItem(`azemaa_pro_v5_${i}`);
            if (s) {
                const d = JSON.parse(s);
                const card = document.getElementById(`card-${i}`);
                card.querySelector('.c-name').value = d.n || '';
                card.querySelector('.c-phone').value = d.p || '';
                if (d.r) {
                    const star = document.getElementById(`star${d.r}-${i}`);
                    if (star) star.checked = true;
                }
                card.querySelector('.c-total').value = d.t || '';
                card.querySelector('.c-notes').value = d.notes || '';
                const rows = card.querySelectorAll('.pay-row');
                if (d.pays) {
                    d.pays.forEach((p, idx) => { if(rows[idx]) { rows[idx].querySelector('.p-date').value = p.dt || ''; rows[idx].querySelector('.p-val').value = p.vl || ''; }});
                }
                updateLogic(i);
            }
        }
        refreshStats();
    };

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const name = card.querySelector('.c-name').value || "عميلنا العزيز";
        const phone = card.querySelector('.c-phone').value;
        const total = parseFloat(card.querySelector('.c-total').value) || 0;
        const coName = document.getElementById('companyNameInput').value || "إدارة الحسابات";
        
        if (!phone) { alert("أدخل رقم الهاتف!"); return; }

        let paid = 0, payDetails = "";
        card.querySelectorAll('.pay-row').forEach((r, idx) => {
            const val = parseFloat(r.querySelector('.p-val').value) || 0;
            const date = r.querySelector('.p-date').value || "--";
            if (val > 0) { paid += val; payDetails += `🔹 دفعة ${idx + 1}: ${val} ج.م بتاريخ ${date}%0A`; }
        });

        const rem = total - paid;
        let msg = `*${coName}*%0A---------------------------%0A👤 العميل: ${name}%0A💰 الإجمالي: ${total} ج.م%0A`;
        
        if (rem <= 0 && total > 0) {
            msg += `✅ *الحساب خالص السداد*%0A---------------------------%0Aشكراً لتعاملكم معنا ✨ نتطلع لخدمتكم دائماً.`;
        } else {
            msg += `%0A📑 *تفاصيل الدفعات:*%0A${payDetails}%0A---------------------------%0A💵 *المتبقي: ${rem.toLocaleString()} ج.م*%0A📑 فقط: ${toArabic(rem)}%0A---------------------------%0Aشكراً لتعاملكم معنا ✨`;
        }

        window.open(`https://wa.me/2${phone.trim()}?text=${msg}`, '_blank');
    }
</script>
</body>
</html>
