<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | 2026</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --primary: #0a3d62; 
            --accent: #3c6382; 
            --success: #27ae60; 
            --danger: #c0392b; 
            --star-color: #f1c40f; 
        }
        
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #dfe4ea; margin: 0; padding: 0; color: var(--primary); font-weight: 700; padding-bottom: 50px; }
        
        .top-bar { background: #072d48; color: #f1c40f; padding: 5px 20px; display: flex; justify-content: space-between; font-size: 13px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; border-radius: 0 0 30px 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        .toolbar { max-width: 1100px; margin: 10px auto; padding: 0 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #companyNameInput, #searchInput { padding: 12px; border-radius: 12px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; width: 100%; box-sizing: border-box; outline: none; transition: 0.3s; text-align: center; }

        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 1100px; margin: 10px auto; padding: 0 10px; }
        .stat-card { background: white; padding: 8px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-bottom: 4px solid var(--accent); }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 1100px; margin: 0 auto; padding: 10px; }
        @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
        
        .card { border-radius: 20px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #ced4da; background: white; position: relative; transition: all 0.4s ease-in-out; overflow: hidden; }
        .card:focus-within { border-color: #f1c40f !important; transform: translateY(-3px); z-index: 10; animation: inner-yellow-glow 1.5s infinite ease-in-out; }

        @keyframes inner-yellow-glow {
            0% { box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.2); }
            50% { box-shadow: inset 0 0 35px rgba(241, 196, 15, 0.6), inset 0 0 70px rgba(241, 196, 15, 0.2); background-color: #fffdf0; }
            100% { box-shadow: inset 0 0 10px rgba(241, 196, 15, 0.2); }
        }

        input, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; font-size: 14px; font-weight: 900; transition: 0.3s; text-align: right; }
        input:focus, textarea:focus { border-color: #f1c40f !important; background-color: white !important; outline: none; }

        .card.paid { border: 3px solid var(--success) !important; background-color: #f0fff4 !important; }
        label { display: block; font-size: 11px; font-weight: bold; margin: 5px 0 2px 0; color: #444; }

        .date-input-group { display: flex; align-items: center; background: #f8f9fa; border: 1.5px solid #e74c3c; border-radius: 8px; padding: 2px 5px; direction: rtl; justify-content: center; }
        .date-input-group input { border: none !important; background: transparent !important; text-align: center; color: #000; font-size: 14px; font-weight: 900; width: 35px; padding: 5px 0; }
        .date-input-group input.d-year { width: 55px; }
        .date-sep { color: #e74c3c; font-weight: 900; font-size: 16px; margin: 0 2px; }

        .rating-stars { display: flex; flex-direction: row-reverse; justify-content: center; margin: 0; padding: 2px 0; gap: 2px; }
        .rating-stars label { font-size: 18px; color: #ddd; cursor: pointer; transition: 0.2s; }
        .rating-stars input { display: none; }
        .rating-stars input:checked ~ label { color: var(--star-color); text-shadow: 0 0 5px rgba(241, 196, 15, 0.5); }

        .c-total { background-color: #fffdf0 !important; border: 1.5px solid #f39c12 !important; color: #d35400 !important; text-align: center !important; font-size: 18px !important; margin-top: 5px; }
        .tafqit-box { background: rgba(238, 247, 255, 0.9); padding: 5px; border-radius: 6px; font-size: 11px; font-weight: 800; min-height: 14px; margin-bottom: 8px; color: #2980b9; text-align: center; }
        
        .payment-section { background: rgba(0,0,0,0.02); padding: 8px; border-radius: 12px; border: 1px dashed #aaa; margin-top: 10px; }
        .pay-row { display: grid; grid-template-columns: 125px 1fr; gap: 5px; margin-bottom: 2px; }
        .tafqit-mini { font-size: 10px; color: #3c6382; margin-bottom: 8px; min-height: 10px; font-weight: 800; text-align: center; }
        
        .card-footer { display: flex; gap: 8px; margin-top: 10px; }
        .btn-card { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s; }
        .btn-save { background: var(--primary); }
        .btn-wa { background: var(--success); }
        .btn-add-client { position: fixed; bottom: 20px; right: 20px; background: #1abc9c; color: white; width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 35px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 100; }

        .summary-section { max-width: 1100px; margin: 30px auto; padding: 0 10px; overflow-x: auto; }
        .sum-table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .sum-table th { background: var(--primary); color: white; padding: 12px; font-size: 12px; }
        .sum-table td { padding: 10px; text-align: center; border: 1px solid #eee; font-size: 13px; font-weight: 800; }
        .sum-table .total-row { background: #072d48 !important; color: #f1c40f; font-size: 14px; }
    </style>
</head>
<body>

<div class="top-bar">
    <span id="liveClock">٠٠:٠٠:٠٠</span>
    <span id="liveDate">--/--/----</span>
</div>

<div class="header"><h1>AZEMAA PRO | 2026</h1></div>

<div class="toolbar">
    <input type="text" id="companyNameInput" placeholder="🏢 اسم شركتك..." oninput="saveCoName()">
    <input type="text" id="searchInput" placeholder="🔍 ابحث بالاسم أو الرقم (بالعربي أو الإنجليزي)..." onkeyup="filterAll()">
</div>

<div class="stats-bar">
    <div class="stat-card"><h4>إجمالي الديون</h4><div id="stat-debt">٠</div></div>
    <div class="stat-card"><h4>العملاء</h4><div id="stat-cust">٠</div></div>
    <div class="stat-card"><h4>الخالص</h4><div id="stat-paid">٠</div></div>
</div>

<div class="grid" id="mainGrid"></div>

<div class="summary-section">
    <h3 style="text-align: center; color: var(--primary); margin-bottom: 10px;">📊 ملخص حسابات جميع الزبائن</h3>
    <table class="sum-table">
        <thead>
            <tr>
                <th>الزبون</th>
                <th>الإجمالي</th>
                <th>المدفوع</th>
                <th>المتبقي</th>
                <th>تاريخ الاستلام</th>
                <th>التقييم</th>
            </tr>
        </thead>
        <tbody id="allClientsSummary"></tbody>
        <tfoot>
            <tr class="total-row" id="totalRow"></tr>
        </tfoot>
    </table>
</div>

<button class="btn-add-client" onclick="addNewCustomer()">+</button>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
        authDomain: "farah-kitchen.firebaseapp.com",
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com",
        projectId: "farah-kitchen",
        storageBucket: "farah-kitchen.firebasestorage.app",
        messagingSenderId: "702572851072",
        appId: "1:702572851072:web:320a92c9430abba6b71b65"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function toAr(n) { return (n === undefined || n === null || n === "") ? "" : n.toString().replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]); }
    function toEn(n) { return (n === undefined || n === null || n === "") ? "" : n.toString().replace(/[٠-٩]/g, d => "0123456789".indexOf(d)); }

    const units = ['', 'واحد', 'اثنان', 'ثلاثة', 'أربعة', 'خمسة', 'ستة', 'سبعة', 'ثمانية', 'تسعة', 'عشرة', 'أحد عشر', 'اثنا عشر', 'ثلاثة عشر', 'أربعة عشر', 'خمسة عشر', 'ستة عشر', 'سبعة عشر', 'ثمانية عشر', 'تسعة عشر'];
    const tens = ['', '', 'عشرون', 'ثلاثون', 'أربعون', 'خمسون', 'ستون', 'سبعون', 'ثمانون', 'تسعون'];
    const hundreds = ['', 'مائة', 'مائتان', 'ثلاثمائة', 'أربعمائة', 'خمسمائة', 'ستمائة', 'سبعمائة', 'ثمانمائة', 'تسعمائة'];

    function tafqit(n) {
        if (!n || n <= 0) return '';
        let nInt = Math.floor(n);
        let res = '', k = Math.floor(nInt / 1000);
        if (k > 0) {
            if (k === 1) res += 'ألف '; else if (k === 2) res += 'ألفان ';
            else if (k <= 10) res += units[k] + ' آلاف '; else res += tafqitBasic(k) + ' ألفاً ';
            nInt %= 1000;
        }
        res += tafqitBasic(nInt);
        return `فقط ${res.trim()} جنيهاً لا غير`;
    }
    
    function tafqitBasic(n) {
        let text = '';
        if (n >= 100) { text += hundreds[Math.floor(n / 100)] + ' '; n %= 100; }
        if (n > 0) {
            if (text !== '') text += 'و ';
            if (n < 20) text += units[n];
            else {
                if (n % 10 > 0) text += units[n % 10] + ' و ' + tens[Math.floor(n / 10)];
                else text += tens[Math.floor(n / 10)];
            }
        }
        return text;
    }

    function createCardHTML(id, index) {
        const div = document.createElement('div');
        div.className = 'card';
        div.id = `card-${id}`;
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="font-size:12px; color:var(--accent);">👤 تسلسل: ${toAr(index)}</span>
                <button onclick="deleteCustomer('${id}')" style="background:none; border:none; cursor:pointer; font-size:16px;">🗑️</button>
            </div>
            <label>اسم العميل:</label>
            <input type="text" class="c-name" data-id="${id}" oninput="updateLogic('${id}')">
            
            <div style="display:grid; grid-template-columns:1fr 1.2fr; gap:8px;">
                <div><label>الموبايل:</label><input type="text" class="c-phone" data-id="${id}" oninput="this.value=toAr(this.value); updateLogic('${id}')"></div>
                <div>
                    <label>📅 تاريخ الاستلام:</label>
                    <div class="date-input-group">
                        <input type="text" class="d-year" placeholder="سنة" maxlength="4" data-id="${id}" oninput="this.value=toAr(this.value); updateLogic('${id}')">
                        <span class="date-sep">/</span>
                        <input type="text" class="d-month" placeholder="شهر" maxlength="2" data-id="${id}" oninput="this.value=toAr(this.value); updateLogic('${id}')">
                        <span class="date-sep">/</span>
                        <input type="text" class="d-day" placeholder="يوم" maxlength="2" data-id="${id}" oninput="this.value=toAr(this.value); updateLogic('${id}')">
                    </div>
                </div>
            </div>

            <div class="rating-stars" data-id="${id}">
                ${[5,4,3,2,1].map(n => `
                    <input type="radio" name="rate-${id}" id="star-${id}-${n}" value="${n}" onchange="updateLogic('${id}'); saveToCloud('${id}')">
                    <label for="star-${id}-${n}">★</label>
                `).join('')}
            </div>

            <label>💰 إجمالي المبلغ المطلوب:</label>
            <input type="text" class="c-total" data-id="${id}" oninput="this.value=toAr(this.value); updateLogic('${id}')">
            <div class="tafqit-box" id="tafqit-total-${id}"></div>
            
            <div class="payment-section">
                ${[0,1,2,3].map(n => `
                    <div class="pay-row">
                        <input type="date" class="p-date" data-id="${id}" onchange="updateLogic('${id}')">
                        <input type="text" class="p-val" placeholder="المبلغ" data-id="${id}" oninput="this.value=toAr(this.value); updateLogic('${id}')">
                    </div>
                    <div class="tafqit-mini" id="tafqit-pay-${id}-${n}"></div>
                `).join('')}
            </div>

            <textarea class="c-notes" placeholder="ملحوظات إضافية..." data-id="${id}" oninput="autoGrow(this)"></textarea>
            <div id="rem-n-${id}" style="font-size:18px; font-weight:900; margin-top:10px; color:var(--danger); border-top:1px solid #eee; padding-top:10px;">المتبقي: ٠ ج.م</div>
            
            <div class="card-footer">
                <button class="btn-card btn-save" onclick="manualSave('${id}')">💾 حفظ</button>
                <button class="btn-card btn-wa" onclick="sendWA('${id}')">🟢 واتساب</button>
            </div>
        `;
        return div;
    }

    function updateLogic(id) {
        const card = document.getElementById(`card-${id}`);
        if(!card) return;
        const totalVal = parseFloat(toEn(card.querySelector('.c-total').value)) || 0;
        document.getElementById(`tafqit-total-${id}`).innerText = totalVal > 0 ? tafqit(totalVal) : "";
        let paidTotal = 0;
        card.querySelectorAll('.p-val').forEach((vInput, i) => {
            const v = parseFloat(toEn(vInput.value)) || 0;
            paidTotal += v;
            document.getElementById(`tafqit-pay-${id}-${i}`).innerText = v > 0 ? tafqit(v) : "";
        });
        const rem = totalVal - paidTotal;
        card.querySelector(`#rem-n-${id}`).innerText = rem <= 0 && totalVal > 0 ? "تم السداد بالكامل ✓" : `المتبقي: ${toAr(rem.toLocaleString())} ج.م`;
        if (rem <= 0 && totalVal > 0) { card.classList.add('paid'); card.querySelector(`#rem-n-${id}`).style.color = "var(--success)"; }
        else { card.classList.remove('paid'); card.querySelector(`#rem-n-${id}`).style.color = "var(--danger)"; }
        refreshStats();
        updateGlobalSummary();
    }

    function updateGlobalSummary() {
        const summaryBody = document.getElementById('allClientsSummary');
        const totalRow = document.getElementById('totalRow');
        summaryBody.innerHTML = "";
        let sTotal = 0, sPaid = 0, sRem = 0;
        document.querySelectorAll('.card').forEach(card => {
            if(card.style.display === "none") return;
            const id = card.id.replace('card-', '');
            const name = card.querySelector('.c-name').value || "بدون اسم";
            const tVal = parseFloat(toEn(card.querySelector('.c-total').value)) || 0;
            let pVal = 0; card.querySelectorAll('.p-val').forEach(v => { pVal += parseFloat(toEn(v.value)) || 0; });
            const rVal = tVal - pVal;
            
            // تم تعديل الترتيب ليصبح (سنة / شهر / يوم) من اليمين للشمال كما طلبت
            const dYear = card.querySelector('.d-year').value || "----";
            const dMonth = card.querySelector('.d-month').value || "--";
            const dDay = card.querySelector('.d-day').value || "--";
            const egyptDate = `${dYear}/${dMonth}/${dDay}`;
            
            const rating = card.querySelector(`input[name="rate-${id}"]:checked`)?.value || 0;
            sTotal += tVal; sPaid += pVal; sRem += rVal;
            summaryBody.insertAdjacentHTML('beforeend', `
                <tr onclick="document.getElementById('card-${id}').scrollIntoView({behavior:'smooth'})">
                    <td style="color:var(--primary)">${name}</td>
                    <td>${toAr(tVal.toLocaleString())}</td>
                    <td style="color:var(--success)">${toAr(pVal.toLocaleString())}</td>
                    <td style="color:var(--danger)">${toAr(rVal.toLocaleString())}</td>
                    <td dir="ltr" style="text-align:center;">${toAr(egyptDate)}</td>
                    <td style="color:#f1c40f">${"★".repeat(rating)}</td>
                </tr>
            `);
        });
        totalRow.innerHTML = `<td>الإجمالي الكلي</td><td>${toAr(sTotal.toLocaleString())}</td><td>${toAr(sPaid.toLocaleString())}</td><td>${toAr(sRem.toLocaleString())}</td><td colspan="2">لعدد ${toAr(document.querySelectorAll('.card').length)} زبائن</td>`;
    }

    function sendWA(id) {
        const card = document.getElementById(`card-${id}`);
        const company = document.getElementById('companyNameInput').value;
        const name = card.querySelector('.c-name').value || "العميل";
        const phone = toEn(card.querySelector('.c-phone').value);
        const totalVal = parseFloat(toEn(card.querySelector('.c-total').value)) || 0;
        let paidTotal = 0, paysMsg = "";
        card.querySelectorAll('.pay-row').forEach((row, i) => {
            const valNum = parseFloat(toEn(row.querySelector('.p-val').value)) || 0;
            if (valNum > 0) { paidTotal += valNum; paysMsg += `📍 *دفعة:* ${toAr(valNum.toLocaleString())} ج.م بتاريخ (${toAr(row.querySelector('.p-date').value) || '---'})\n`; }
        });
        const rem = totalVal - paidTotal;
        const fullMsg = `*السلام عليكم ورحمة الله وبركاته* 🌹\n*${company}*\n\nعناية الأستاذ/ *${name}*\n\n💰 *الإجمالي:* ${toAr(totalVal.toLocaleString())} ج.م\n${tafqit(totalVal)}\n\n✅ *المدفوعات:*\n${paysMsg || "لم تسجل دفعات."}\n━━━━━━━━━━━━━━\n💵 *إجمالي المدفوع:* ${toAr(paidTotal.toLocaleString())} ج.م\n⚠️ *المتبقي:* ${toAr(rem.toLocaleString())} ج.م\n${rem <= 0 ? "خالص السداد ✓" : tafqit(rem)}`;
        if (!phone) { alert("يرجى إدخال رقم الهاتف"); return; }
        window.open(`https://wa.me/2${phone}?text=${encodeURIComponent(fullMsg)}`, '_blank');
    }

    function filterAll() {
        const qRaw = document.getElementById('searchInput').value.toLowerCase();
        const qEn = toEn(qRaw); 
        document.querySelectorAll('.card').forEach(c => {
            const name = c.querySelector('.c-name').value.toLowerCase();
            const phone = c.querySelector('.c-phone').value;
            const phoneEn = toEn(phone);
            if (name.includes(qRaw) || phone.includes(qRaw) || phoneEn.includes(qEn) || phone.includes(qEn)) {
                c.style.display = "block";
            } else {
                c.style.display = "none";
            }
        });
        updateGlobalSummary();
    }

    function saveToCloud(id) {
        const card = document.getElementById(`card-${id}`); if(!card) return;
        db.ref('azemaa_v5/zbon/' + id).set({
            n: card.querySelector('.c-name').value, p: toEn(card.querySelector('.c-phone').value),
            dd: toEn(card.querySelector('.d-day').value), dm: toEn(card.querySelector('.d-month').value), dy: toEn(card.querySelector('.d-year').value),
            r: card.querySelector(`input[name="rate-${id}"]:checked`)?.value || 0,
            t: toEn(card.querySelector('.c-total').value), notes: card.querySelector('.c-notes').value,
            pays: Array.from(card.querySelectorAll('.pay-row')).map(r => ({ dt: r.querySelector('.p-date').value, vl: toEn(r.querySelector('.p-val').value) }))
        });
    }

    db.ref('azemaa_v5/zbon').on('value', (snap) => {
        const grid = document.getElementById('mainGrid'); grid.innerHTML = "";
        const data = snap.val(); if(!data) return;
        Object.keys(data).sort().reverse().forEach((id, i) => {
            grid.appendChild(createCardHTML(id, Object.keys(data).length - i));
            const d = data[id]; const card = document.getElementById(`card-${id}`);
            card.querySelector('.c-name').value = d.n || ""; card.querySelector('.c-phone').value = toAr(d.p) || "";
            card.querySelector('.d-day').value = toAr(d.dd) || ""; card.querySelector('.d-month').value = toAr(d.dm) || ""; card.querySelector('.d-year').value = toAr(d.dy) || "";
            card.querySelector('.c-total').value = toAr(d.t) || ""; card.querySelector('.c-notes').value = d.notes || "";
            if (d.r) { const star = card.querySelector(`#star-${id}-${d.r}`); if(star) star.checked = true; }
            if(d.pays) d.pays.forEach((p, i) => { const row = card.querySelectorAll('.pay-row')[i]; if(row) { row.querySelector('.p-date').value = p.dt || ""; row.querySelector('.p-val').value = toAr(p.vl) || ""; } });
            updateLogic(id);
        });
    });

    function addNewCustomer() { db.ref('azemaa_v5/zbon/' + "z" + Date.now()).set({ n: "" }); }
    function manualSave(id) { saveToCloud(id); alert("✅ تم الحفظ"); }
    function deleteCustomer(id) { if(confirm("حذف؟")) db.ref('azemaa_v5/zbon/' + id).remove(); }
    function saveCoName() { localStorage.setItem('azemaa_co_v5', document.getElementById('companyNameInput').value); }
    function autoGrow(el) { el.style.height = "45px"; el.style.height = (el.scrollHeight) + "px"; }

    function refreshStats() {
        let debt = 0, cust = 0, paidC = 0;
        document.querySelectorAll('.card').forEach(c => {
            const t = parseFloat(toEn(c.querySelector('.c-total').value)) || 0;
            if(t > 0) { cust++; let p = 0; c.querySelectorAll('.p-val').forEach(v => { p += parseFloat(toEn(v.value)) || 0; }); debt += (t - p > 0 ? t - p : 0); if (t - p <= 0) paidC++; }
        });
        document.getElementById('stat-debt').innerText = toAr(debt.toLocaleString());
        document.getElementById('stat-cust').innerText = toAr(cust);
        document.getElementById('stat-paid').innerText = toAr(paidC);
    }

    window.onload = () => {
        document.getElementById('companyNameInput').value = localStorage.getItem('azemaa_co_v5') || "فرح للمطابخ";
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = toAr(now.toLocaleTimeString('ar-EG'));
            document.getElementById('liveDate').innerText = now.toLocaleDateString('ar-EG', {day:'numeric', month:'long', year:'numeric'});
        }, 1000);
    };
</script>
</body>
</html>
