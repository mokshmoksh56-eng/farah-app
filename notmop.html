<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO - Online Notes</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #2563eb; 
            --bg: #f8fafc; 
            --card-bg: #ffffff;
            --success: #059669; 
            --danger: #dc2626;
            --text-main: #1e293b;
        }
        
        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg); margin: 0; padding: 10px; font-weight: 700; 
            overflow-x: hidden; color: var(--text-main); padding-bottom: 60px;
        }

        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg);
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: var(--primary); font-weight: bold; text-align: center; padding: 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }
        
        header { text-align: center; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 1.4rem; font-weight: 900; }
        #sync-status { font-size: 12px; text-align: center; margin-bottom: 15px; color: #b45309; font-weight: bold; }

        .input-section { 
            background: #fff; padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px;
            border: 1px solid #e2e8f0;
        }
        
        textarea { 
            width: 100%; min-height: 80px; padding: 12px; border: 2px solid #e2e8f0; 
            border-radius: 8px; font-family: 'Cairo'; font-size: 15px; font-weight: 700; 
            box-sizing: border-box; background: #f8fafc; outline: none; resize: none; overflow: hidden;
        }
        textarea:focus { border-color: var(--primary); }

        .controls-row { display: flex; gap: 10px; margin-top: 10px; }
        .controls-row label, .controls-row button {
            flex: 1; text-align: center; padding: 10px; border-radius: 8px; font-weight: 800;
            cursor: pointer; border: none; font-family: 'Cairo'; font-size: 14px;
        }
        .btn-upload { background: #e2e8f0; color: #475569; }
        .btn-mic { background: #fee2e2; color: #b91c1c; }
        .btn-mic.recording { background: #b91c1c; color: white; animation: pulse 1.5s infinite; }
        
        .btn-main { 
            width: 100%; padding: 12px; background: #facc15; color: #1e293b; 
            border: none; border-radius: 8px; font-weight: 900; margin-top: 10px; 
            font-size: 16px; cursor: pointer; border-bottom: 4px solid #ca8a04;
        }
        .btn-main:active { border-bottom: 0; margin-top: 14px; }

        #image-preview-container { display: none; margin-top: 10px; text-align: center; position: relative; }
        #preview-img { max-width: 100%; max-height: 200px; border-radius: 8px; border: 2px solid #e2e8f0; }
        .clear-img-btn { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.8); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-weight: bold; }

        .search-area { background: #fff; padding: 10px; border-radius: 8px; border: 2px solid var(--primary); margin-bottom: 15px; display: flex; gap: 10px; }
        .search-area input, .search-area select { 
            border: 1px solid #cbd5e1; padding: 8px; border-radius: 6px; font-family: 'Cairo'; font-weight: 700; outline: none; background: #f0f7ff;
        }
        .search-area input { flex: 1; }

        .notes-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media (min-width: 600px) { .notes-grid { grid-template-columns: repeat(2, 1fr); } }

        .task-card { 
            background: #fff; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e2e8f0;
            transition: opacity 0.3s;
        }
        .task-card.completed { opacity: 0.6; filter: grayscale(50%); }
        
        .card-content { padding: 12px; flex-grow: 1; }
        .date-pill { font-size: 11px; color: #475569; background: rgba(255,255,255,0.7); padding: 4px 8px; border-radius: 20px; display: inline-block; margin-bottom: 8px; }
        
        .task-image { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        
        .tags-container { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .badge { background: #e2e8f0; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #1e293b; }
        .ai-tag { padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; }
        .tag-urgent { background: #fee2e2; color: #dc2626; }
        .tag-measure { background: #dbeafe; color: #2563eb; }
        .tag-money { background: #dcfce7; color: #059669; }

        .task-text { font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

        .card-footer { 
            display: flex; justify-content: space-between; padding: 10px 12px; 
            background: rgba(0,0,0,0.02); border-top: 1px solid #e2e8f0;
            gap: 5px; flex-wrap: wrap;
        }
        .icon-btn { 
            background: white; border: 1px solid #e2e8f0; padding: 6px 10px; 
            border-radius: 6px; cursor: pointer; font-size: 13px; box-shadow: 0 2px 0 #cbd5e1;
            transition: 0.2s; font-family: 'Cairo'; font-weight: 700; flex: 1; text-align: center;
        }
        .icon-btn:active { transform: translateY(2px); box-shadow: none; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="auth-loader">⏳ جاري مزامنة مهام الورشة سحابياً...</div>

<div class="container">
    <header><h1>ملاحظات الورشة أونلاين</h1></header>
    <div id="sync-status">⏳ جاري الاتصال بالسحابة...</div>

    <div class="input-section">
        <textarea id="note-box" placeholder="اكتب تفاصيل المهمة أو المقاسات هنا..."></textarea>
        
        <div id="image-preview-container">
            <button class="clear-img-btn" onclick="clearSelectedImage()">✖</button>
            <img id="preview-img" src="" alt="معاينة">
        </div>

        <div class="controls-row">
            <button id="start-btn" class="btn-mic">🎙️ استماع</button>
            <label class="btn-upload">
                🖼️ إرفاق صورة
                <input type="file" id="image-upload" accept="image/*" style="display:none;">
            </label>
        </div>
        
        <button class="btn-main" id="save-btn">حفظ المهمة بالسحابة ✅</button>
    </div>

    <div class="search-area">
        <input type="text" id="report-query" placeholder="🔍 ابحث بالاسم، المقاس أو الكلمة...">
        <select id="report-year"></select>
    </div>
    
    <div id="tasks-list" class="notes-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, child, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    let currentUid = null;
    let dbRef = null;
    let localNotes = {}; 
    let currentSelectedImageData = null;

    const teamMembers = ['محمد عبد العظيم', 'ميدو', 'محفوظ', 'أميرة', 'أحمد', 'محمود', 'يوسف', 'مريم', 'أسماء'];
    const cardColors = ['#fdf196', '#fce1cb', '#b8f4f9', '#c1f3c9', '#e6dff9', '#f9d2d7'];
    
    const yearSelect = document.getElementById('report-year');
    const currentYear = new Date().getFullYear().toString();
    for (let y = 2026; y <= 2056; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        if (y.toString() === currentYear || (y === 2026 && currentYear < 2026)) option.selected = true;
        yearSelect.appendChild(option);
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUid = user.uid;
            dbRef = ref(db, `backups/notes_users/${currentUid}`);
            document.getElementById('auth-loader').style.display = 'none';
            initApp();
        } else {
            document.getElementById('auth-loader').innerText = "⚠️ حظر أمني: يرجى فتح واجهة تسجيل الدخول الرئيسية أولاً!";
        }
    });

    function initApp() {
        onValue(dbRef, (snapshot) => {
            localNotes = snapshot.val() || {};
            renderApp();
            document.getElementById('sync-status').innerText = "🟢 متصل بالسحابة ومحدث لحظياً";
            document.getElementById('sync-status').style.color = "var(--success)";
        }, (error) => {
            document.getElementById('sync-status').innerText = "🔴 خطأ اتصال بالسيرفر";
            document.getElementById('sync-status').style.color = "var(--danger)";
        });
    }

    document.getElementById('image-upload').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400; 
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    currentSelectedImageData = canvas.toDataURL('image/jpeg', 0.6); 
                    document.getElementById('preview-img').src = currentSelectedImageData;
                    document.getElementById('image-preview-container').style.display = 'block';
                }
            };
        }
    });

    window.clearSelectedImage = function() {
        currentSelectedImageData = null;
        document.getElementById('image-upload').value = '';
        document.getElementById('image-preview-container').style.display = 'none';
        document.getElementById('preview-img').src = '';
    }

    const noteBox = document.getElementById('note-box');
    noteBox.addEventListener('input', function() {
        this.style.height = 'auto'; 
        this.style.height = (this.scrollHeight) + 'px'; 
    });

    const startBtn = document.getElementById('start-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition; let isRecording = false;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-EG'; 
        recognition.continuous = true;
        recognition.interimResults = false; 

        recognition.onstart = () => { isRecording = true; startBtn.innerHTML = "🛑 جاري الاستماع..."; startBtn.classList.add("recording"); };
        recognition.onresult = (event) => {
            let finalText = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) { finalText += event.results[i][0].transcript + " "; }
            if(finalText.trim() !== "") { noteBox.value += finalText; noteBox.style.height = 'auto'; noteBox.style.height = (noteBox.scrollHeight) + 'px'; }
        };
        recognition.onend = () => { isRecording = false; startBtn.innerHTML = "🎙️ استماع"; startBtn.classList.remove("recording"); };
        startBtn.addEventListener('click', (e) => { e.preventDefault(); if (!isRecording) try { recognition.start(); } catch(err) {} else recognition.stop(); });
    }

    function analyzeText(text) {
        let tags = [];
        if (/(عاجل|بسرعة|ضروري|فورا|حالا)/.test(text)) tags.push({ type: 'urgent', html: '<span class="ai-tag tag-urgent">🔥 عاجل</span>' });
        if (/(متر|سم|ملي|مقاس|طول|عرض|درفة|قطاع|مفصلة|زجاج|فايبر)/.test(text)) tags.push({ type: 'measure', html: '<span class="ai-tag tag-measure">📏 مقاسات</span>' });
        if (/(جنيه|الف|حساب|عربون|دفع|باقي|تكلفة|فلوس)/.test(text)) tags.push({ type: 'money', html: '<span class="ai-tag tag-money">💰 ماليات</span>' });
        return tags;
    }

    document.getElementById('save-btn').addEventListener('click', () => {
        if (!currentUid) return;
        const text = noteBox.value.trim();
        
        if (!text && !currentSelectedImageData) return alert("برجاء التحدث، الكتابة، أو إرفاق صورة أولاً!");

        let assignedPerson = "عام";
        for (let name of teamMembers) { if (text.includes(name)) { assignedPerson = name; break; } }

        const tags = analyzeText(text);
        const now = new Date();
        const year = now.getFullYear().toString();
        const datePart = now.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' }).replace(/\//g, '-');
        const timePart = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', hour12: true });
        
        const uniqueId = 'note_' + Date.now();
        const newNote = { 
            id: uniqueId, 
            text: text || "مرفق صورة فقط", 
            person: assignedPerson,
            datetime: `${timePart} | ${datePart}`,
            year: year,
            status: 'pending',
            tags: tags,
            imageData: currentSelectedImageData || "",
            timestamp: Date.now() 
        };
        
        set(child(dbRef, uniqueId), newNote).then(() => {
            noteBox.value = "";
            noteBox.style.height = 'auto'; 
            clearSelectedImage();
        }).catch(err => alert("فشل الحفظ: " + err.message));
    });

    window.toggleStatus = function(id) {
        if (!currentUid || !localNotes[id]) return;
        const newStatus = localNotes[id].status === 'completed' ? 'pending' : 'completed';
        set(child(dbRef, `${id}/status`), newStatus);
    }

    window.deleteNote = function(id) {
        if (!currentUid) return;
        if(confirm("هل أنت متأكد من حذف هذه المهمة نهائياً؟")) {
            remove(child(dbRef, id));
        }
    }

    window.editNote = function(id) {
        if (!currentUid || !localNotes[id]) return;
        let note = localNotes[id];
        let newText = prompt("قم بتعديل تفاصيل المهمة:", note.text);
        
        if (newText !== null && newText.trim() !== "") {
            note.text = newText.trim();
            let assignedPerson = "عام";
            for (let name of teamMembers) { if (note.text.includes(name)) { assignedPerson = name; break; } }
            
            note.person = assignedPerson;
            note.tags = analyzeText(note.text);
            
            set(child(dbRef, id), note);
        }
    }

    // --- دالة الترحيل لصفحة اليومية (yom.html) ---
    window.sendToYom = function(id, type) {
        if (!currentUid || !localNotes[id]) return;
        
        let note = localNotes[id];
        
        let amount = prompt(`أدخل المبلغ الذي تريد تسجيله كـ (${type === 'in' ? 'دخول' : 'خروج'}):`, "0");
        
        if (amount === null || amount.trim() === "" || isNaN(amount) || parseFloat(amount) === 0) {
            return; 
        }

        const uniqueId = 'id_' + Date.now();
        const entryData = { 
            id: uniqueId, 
            shop: "غير ذلك", 
            customer: note.person || "-", 
            date: new Date().toISOString().slice(0, 16), 
            desc: note.text, 
            inVal: type === 'in' ? parseFloat(amount) : 0, 
            outVal: type === 'out' ? parseFloat(amount) : 0 
        };

        const yomRef = ref(db, `backups/yomya_users/${currentUid}/${uniqueId}`);

        set(yomRef, entryData).then(() => {
            window.location.href = "yom.html";
        }).catch(err => {
            alert("حدث خطأ أثناء الترحيل السحابي: " + err.message);
        });
    }

    document.getElementById('report-query').addEventListener('input', renderApp);
    document.getElementById('report-year').addEventListener('change', renderApp);

    function renderApp() {
        const tasksList = document.getElementById('tasks-list');
        tasksList.innerHTML = ""; 
        
        const query = document.getElementById('report-query').value.trim().toLowerCase();
        const yearQuery = document.getElementById('report-year').value;

        let notesArray = Object.values(localNotes).sort((a, b) => b.timestamp - a.timestamp);

        const filteredNotes = notesArray.filter(n => {
            const matchYear = n.year === yearQuery || (n.datetime && n.datetime.includes(yearQuery));
            const matchName = query === "" || (n.person && n.person.includes(query)) || (n.text && n.text.toLowerCase().includes(query));
            return matchYear && matchName;
        });

        if (filteredNotes.length === 0) { 
            tasksList.innerHTML = "<p style='text-align:center; grid-column: 1 / -1; color:#94a3b8; font-size:14px; padding:20px;'>لا توجد مهام مطابقة...</p>"; 
            return; 
        }

        filteredNotes.forEach((note, index) => {
            const isDone = note.status === 'completed';
            const tagsHTML = note.tags ? note.tags.map(t => t.html).join('') : '';
            const bgColor = cardColors[index % cardColors.length];
            const imageHTML = note.imageData ? `<img src="${note.imageData}" class="task-image" alt="مرفق">` : '';

            // تم استبدال الفوتر القديم بالأزرار الأربعة الجديدة هنا
            const cardHTML = `
                <div class="task-card ${isDone ? 'completed' : ''}" style="background-color: ${bgColor};">
                    <div class="card-content">
                        <div class="date-pill">${note.datetime} 📅</div>
                        ${imageHTML}
                        <div class="tags-container">
                            <span class="badge">${note.person}</span>
                            ${tagsHTML}
                        </div>
                        <div class="task-text">${note.text}</div>
                    </div>
                    <div class="card-footer">
                        <button class="icon-btn" onclick="sendToYom('${note.id}', 'out')" title="ترحيل كخروج">📤 خروج</button>
                        <button class="icon-btn" onclick="sendToYom('${note.id}', 'in')" title="ترحيل كدخول">📥 دخول</button>
                        <button class="icon-btn" onclick="editNote('${note.id}')" title="تعديل المهمة">✏️ تعديل</button>
                        <button class="icon-btn" onclick="deleteNote('${note.id}')" title="حذف المهمة">🗑️ حذف</button>
                    </div>
                </div>
            `;
            tasksList.innerHTML += cardHTML;
        });
    }
</script>
</body>
</html>
