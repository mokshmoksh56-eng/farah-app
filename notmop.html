<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO 3D - Online Notes</title>
    
    <style>
        :root { --primary: #2563eb; --bg: #f0f2f5; }
        
        body { 
            font-family: system-ui, sans-serif; 
            background: var(--bg); margin: 0; padding: 0; font-weight: bold; 
            overflow-x: hidden; color: #111827;
        }

        .container { width: 100%; max-width: 100%; margin: 0; padding-bottom: 60px; }
        
        .input-section { 
            background: #fff; padding: 20px; border-bottom: 6px solid #d1d5db;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 10px;
        }
        
        textarea { 
            width: 100%; min-height: 100px; padding: 15px; border: 2px solid #e5e7eb; 
            border-radius: 12px; font-size: 18px; font-weight: bold; box-sizing: border-box;
            background: #f9fafb; outline: none;
        }

        .btn-main { 
            width: 100%; padding: 16px; background: #facc15; color: #1e293b; 
            border: none; border-radius: 12px; font-weight: 900; margin-top: 15px; 
            font-size: 18px; border-bottom: 6px solid #ca8a04; cursor: pointer;
            transition: background 0.2s;
        }
        .btn-main:hover {
            background: #eab308;
        }

        /* تعديل شبكة العرض لتدعم الارتفاع التلقائي الممتد */
        .notes-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 10px; 
            padding: 10px;
            align-items: start; /* يمنع الكروت القصيرة من التمدد إجبارياً لطول جيرانها */
        }

        /* تعديل الكارت ليتمدد تلقائياً مع محتواه بالكامل */
        .card { 
            background: #fff;
            display: flex; 
            flex-direction: column;
            border-bottom: 5px solid rgba(0,0,0,0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            height: auto; /* يجعل الكارت يتمدد تلقائياً */
            min-height: 120px; /* حد أدنى لطيف لارتفاع الكارت */
            border-radius: 10px;
            overflow: hidden;
        }

        .note-img { width: 100%; height: 120px; object-fit: cover; display: block; }

        .card-header-split {
            padding: 8px 10px;
            background: rgba(255,255,255,0.3);
            border-bottom: 1px dashed rgba(0,0,0,0.1);
        }

        /* تعديل منطقة النص لضمان كسر السطور وتمدد المساحة */
        .card-body-split { 
            padding: 12px;
            flex-grow: 1; /* يجعل منطقة النص تأخذ المساحة المتاحة بالكامل */
            word-wrap: break-word;
            overflow-wrap: break-word; 
            word-break: break-word;
        }

        .date-badge {
            display: block; 
            font-size: 11px; 
            color: #4b5563; 
            background: rgba(255, 255, 255, 0.8); 
            padding: 4px 6px;
            border-radius: 6px; 
            direction: rtl; 
            text-align: right;
            box-sizing: border-box;
            line-height: 1.3;
        }
        
        .note-content { 
            font-size: 16px; line-height: 1.4; color: #000; 
            white-space: pre-wrap; text-align: right; display: block;
        }
        
        .actions { 
            display: flex; justify-content: space-around; padding: 8px; 
            background: rgba(255,255,255,0.5); border-top: 1px solid rgba(0,0,0,0.05);
            margin-top: auto; /* يضمن بقاء أزرار التحكم في أسفل الكارت دائماً */
        }
        
        .edit-btn, .del-btn { 
            background: #fff; padding: 5px 8px; border-radius: 6px; 
            box-shadow: 0 2px 0 #ccc; font-size: 11px; border: 1px solid #eee; cursor: pointer;
        }

        .search-box { 
            width: 100%; padding: 18px; border: none; background: #fff; 
            text-align: center; box-sizing: border-box; border-bottom: 4px solid var(--primary);
        }

        @media (max-width: 350px) {
            .notes-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-section">
        <h2 style="text-align: center; color: var(--primary);">🚀 AZEMAA ONLINE-NOTES</h2>
        <textarea id="noteInput" placeholder="اكتب ملاحظتك هنا.."></textarea>
        <label style="display:block; margin-top:10px; text-align:center; background:#eee; padding:10px; border-radius:10px; cursor:pointer;">
            🖼️ اختيار صورة <input type="file" id="fileInput" accept="image/*" style="display:none;">
        </label>
        <input type="hidden" id="editId" value="">
        <button class="btn-main" id="saveBtn">حفظ الملحوظة أونلاين ✅</button>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 ابحث بالكلمات أو الأرقام (123 أو ١٢٣)...">
    
    <div id="notesList" class="notes-grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, update, remove, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentImageData = "";
    const colors = ["#bae6fd", "#fef08a", "#bbf7d0", "#fecaca", "#ddd6fe", "#ffedd5", "#a5f3fc", "#e9d5ff"];

    document.getElementById('fileInput').addEventListener('change', processFile);
    document.getElementById('saveBtn').addEventListener('click', handleSave);
    document.getElementById('searchBox').addEventListener('keyup', loadNotes);

    function processFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 400; 
                canvas.height = img.height * (400 / img.width);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                currentImageData = canvas.toDataURL('image/jpeg', 0.6); 
            };
        };
    }

    function getFormattedDateTime() {
        const now = new Date();
        const day = String(now.getDate()).padStart(2, '0');
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const year = now.getFullYear();
        
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'م' : 'ص';
        
        hours = hours % 12;
        hours = hours ? hours : 12;
        const formattedHours = String(hours).padStart(2, '0');

        return `${day}-${month}-${year} | ${formattedHours}:${minutes}:${seconds} ${ampm}`;
    }

    function convertArabicNumbersToEnglish(str) {
        const arabicNumbers = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
        for (let i = 0; i < 10; i++) {
            str = str.replace(arabicNumbers[i], i);
        }
        return str;
    }

    function handleSave() {
        const text = document.getElementById('noteInput').value;
        const editId = document.getElementById('editId').value;
        if (!text.trim() && !currentImageData) return;

        const dateStr = getFormattedDateTime();

        if (editId) {
            update(ref(db, 'azemaa_notes/' + editId), {
                text: text,
                image: currentImageData,
                date: dateStr + " (تعديل)"
            }).then(() => resetForm());
        } else {
            const noteData = {
                text: text,
                image: currentImageData,
                date: dateStr,
                bgColor: colors[Math.floor(Math.random() * colors.length)]
            };
            const newRef = push(ref(db, 'azemaa_notes'));
            set(newRef, noteData).then(() => resetForm());
        }
    }

    function resetForm() {
        document.getElementById('noteInput').value = "";
        document.getElementById('editId').value = "";
        currentImageData = "";
        alert("تم الحفظ بنجاح ✅");
    }

    function loadNotes() {
        let term = document.getElementById('searchBox').value.toLowerCase();
        term = convertArabicNumbersToEnglish(term);
        
        const list = document.getElementById('notesList');
        const dbRef = ref(db, 'azemaa_notes');

        onValue(dbRef, (snapshot) => {
            list.innerHTML = "";
            const data = snapshot.val();
            if (!data) return;

            const notesArray = Object.keys(data).map(key => ({...data[key], fbId: key})).reverse();

            notesArray.forEach(note => {
                const normalizedNoteText = convertArabicNumbersToEnglish(note.text.toLowerCase());

                if (normalizedNoteText.includes(term)) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.background = note.bgColor;
                    card.innerHTML = `
                        ${note.image ? `<img src="${note.image}" class="note-img">` : ""}
                        <div class="card-header-split">
                            <span class="date-badge">📅 ${note.date}</span>
                        </div>
                        <div class="card-body-split">
                            <div class="note-content">${note.text}</div>
                        </div>
                        <div class="actions">
                            <span class="edit-btn">✏️</span>
                            <span class="del-btn">🗑️</span>
                        </div>
                    `;

                    card.querySelector('.edit-btn').addEventListener('click', () => editNote(note.fbId));
                    card.querySelector('.del-btn').addEventListener('click', () => deleteNote(note.fbId));

                    list.appendChild(card);
                }
            });
        });
    }

    function editNote(id) {
        get(ref(db, 'azemaa_notes/' + id)).then((snap) => {
            if (snap.exists()) {
                const note = snap.val();
                document.getElementById('noteInput').value = note.text;
                document.getElementById('editId').value = id;
                currentImageData = note.image || "";
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        });
    }

    function deleteNote(id) {
        if (confirm("حذف الملحوظة؟")) {
            remove(ref(db, 'azemaa_notes/' + id));
        }
    }

    loadNotes();
</script>
</body>
</html>
