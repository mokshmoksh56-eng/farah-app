<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الورشة - النسخة الأونلاين</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-burgundy: #600000; 
            --text-light: #ffffff;
            --card-bg: #ffffff;
            --success-green: #2ecc71;
            --danger-red: #ff4d4d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-burgundy);
            color: var(--text-light);
            margin: 0; padding: 10px;
            padding-bottom: 80px; 
            font-weight: 900; /* محاكاة لأسلوب azemaa pro */
        }

        .header-main {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 20px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
        }

        .header-main h1 { margin: 0; font-size: 1.4em; color: #fff; text-shadow: 1px 1px 4px rgba(0,0,0,0.5); }

        .main-content { max-width: 600px; margin: 0 auto; }

        .main-record { 
            background: var(--card-bg); 
            border-radius: 15px; 
            margin-bottom: 25px; 
            overflow: hidden; 
            border: none;
            border-top-width: 10px;
            border-top-style: solid;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            color: #333;
        }
        
        .record-header { padding: 15px; background: #fdfdfd; border-bottom: 1px solid #eee; }
        .label-guide { font-weight: bold; font-size: 0.85em; display: block; margin-bottom: 4px; color: #555; }
        
        .input-field { 
            background: #fff; border: 1px solid #ddd; font-size: 1em; 
            width: 100%; padding: 10px; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px;
            font-weight: 900;
        }
        
        .record-body { padding: 15px; }
        
        .note-item { 
            background: #fff; border: 1px solid #eee;
            border-radius: 8px; padding: 12px; margin-bottom: 15px; position: relative;
        }
        
        .delete-note-btn { 
            color: var(--danger-red); font-size: 0.75em; float: left; cursor: pointer; 
            font-weight: bold; background: #fff0f0; padding: 4px 10px; border-radius: 6px;
        }

        .dims-area { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; 
            margin: 10px 0; padding: 10px; background: #f9f9f9; border: 1px solid #eee; border-radius: 8px; 
        }
        .dim-box label { display: block; font-weight: bold; text-align: center; font-size: 0.75em; color: #777; }
        .dim-box input { width: 100%; padding: 8px 0; text-align: center; border: 1px solid #ddd; border-radius: 5px; font-weight: bold; }
        
        .text-editor { 
            min-height: 60px; outline: none; font-size: 1.05em; padding: 10px; 
            background: #fff; border: 1px solid #eee; border-radius: 6px; margin-top: 10px;
            font-weight: 900;
        }
        
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        .btn-save { background: var(--success-green); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; flex: 2; cursor: pointer; }
        .btn-add-note { background: #fff; border: 2px dashed #ccc; padding: 12px; border-radius: 8px; font-weight: bold; flex: 1.2; font-size: 0.85em; cursor: pointer; }
        
        .btn-new-record { 
            background: #ffd700; color: #600000; border: none; padding: 15px; 
            border-radius: 12px; font-size: 1.1em; font-weight: bold; width: 100%; margin-bottom: 25px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .remove-record-link { color: var(--danger-red); text-align: center; display: block; margin-top: 15px; font-weight: bold; cursor: pointer; }

        .calc-bar { 
            position: fixed; left: 20px; bottom: 20px; 
            background: #ffd700; color: #600000; 
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            font-size: 2em;
        }
        .calc-panel { position: fixed; bottom: -100%; left: 0; width: 100%; background: #fff; transition: 0.4s; z-index: 1002; padding: 20px; border-radius: 25px 25px 0 0; color: #333; }
        .calc-panel.active { bottom: 0; }
        #display { width: 100%; height: 60px; background: #eee; border: 1px solid #ccc; font-size: 2em; text-align: left; direction: ltr; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border-radius: 10px; font-weight: 900;}
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { padding: 15px; font-size: 1.2em; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; font-weight: bold; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1001; display: none; }
        
        #saveStatus { position: fixed; bottom: 20px; right: 20px; background: var(--success-green); color: white; padding: 5px 15px; border-radius: 20px; font-size: 12px; display: none; z-index: 2000; }
    </style>
</head>
<body onclick="closeCalc()">

    <div id="saveStatus">✓ تم المزامنة سحابياً</div>
    <div class="overlay" id="overlay"></div>
    <div class="calc-bar" onclick="toggleCalc(event)">🖩</div>
    
    <div class="calc-panel" id="calcBox" onclick="event.stopPropagation();">
        <input type="text" id="display" readonly placeholder="0">
        <div class="calc-grid">
            <button class="calc-btn" style="color:red" onclick="clearDisplay()">C</button>
            <button class="calc-btn" onclick="backspace()">DEL</button>
            <button class="calc-btn" onclick="press('/')">÷</button>
            <button class="calc-btn" onclick="press('*')">×</button>
            <button class="calc-btn" onclick="press('7')">7</button>
            <button class="calc-btn" onclick="press('8')">8</button>
            <button class="calc-btn" onclick="press('9')">9</button>
            <button class="calc-btn" onclick="press('-')">-</button>
            <button class="calc-btn" onclick="press('4')">4</button>
            <button class="calc-btn" onclick="press('5')">5</button>
            <button class="calc-btn" onclick="press('6')">6</button>
            <button class="calc-btn" onclick="press('+')">+</button>
            <button class="calc-btn" onclick="press('1')">1</button>
            <button class="calc-btn" onclick="press('2')">2</button>
            <button class="calc-btn" onclick="press('3')">3</button>
            <button class="calc-btn" onclick="calculate()" style="background:var(--success-green); color:#fff; grid-row: span 2;">=</button>
            <button class="calc-btn" onclick="press('0')" style="grid-column: span 2;">0</button>
            <button class="calc-btn" onclick="press('.')">.</button>
        </div>
    </div>

    <header class="header-main">
        <h1>سجل ملاحظات الورشة أونلاين</h1>
    </header>

    <main class="main-content">
        <button class="btn-new-record" onclick="addNewCustomerCloud()">+ إضافة زبون جديد</button>
        <div id="main-list"></div>
    </main>

    <script>
        // إعدادات Firebase من ملف zbon
        const firebaseConfig = {
            apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
            authDomain: "farah-kitchen.firebaseapp.com",
            databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com",
            projectId: "farah-kitchen",
            storageBucket: "farah-kitchen.firebasestorage.app",
            messagingSenderId: "702572851072",
            appId: "1:702572851072:web:320a92c9430abba6b71b65"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const colors = ['#3498db', '#f1c40f', '#e67e22', '#1abc9c', '#fd79a8', '#a29bfe', '#55efc4'];

        // الاستماع للبيانات من Firebase
        db.ref('azemaa_v5/notmop').on('value', (snap) => {
            const container = document.getElementById('main-list');
            container.innerHTML = "";
            const data = snap.val();
            if(!data) return;

            // ترتيب تنازلي (الأحدث أولاً)
            Object.keys(data).sort().reverse().forEach(id => {
                renderRecordHTML(id, data[id]);
            });
        });

        function renderRecordHTML(id, item) {
            const container = document.getElementById('main-list');
            let notesHTML = "";
            if(item.notes) {
                item.notes.forEach((n, idx) => {
                    notesHTML += createNoteHTML(item.color, n.text, n.w, n.l, n.d, n.hasDims, id, idx);
                });
            }

            const recordHTML = `
                <div class="main-record" id="rec-${id}" data-color="${item.color}" style="border-top-color: ${item.color}">
                    <div class="record-header">
                        <span class="label-guide" style="color:${item.color}">📌 اسم الزبون:</span>
                        <input type="text" class="input-field name-in" value="${item.name || ''}" onchange="saveToCloud('${id}')">
                        <span class="label-guide">📅 التاريخ:</span>
                        <input type="date" class="input-field date-in" value="${item.date || ''}" onchange="saveToCloud('${id}')">
                    </div>
                    <div class="record-body">
                        <div class="notes-container">${notesHTML}</div>
                        <div class="controls">
                            <button class="btn-save" onclick="saveToCloud('${id}', true)">حفظ الكل ✅</button>
                            <button class="btn-add-note" onclick="addNoteItemLocal('${id}')">+ ملحوظة</button>
                        </div>
                        <span class="remove-record-link" onclick="deleteRecordCloud('${id}')">إلغاء هذا الزبون</span>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', recordHTML);
        }

        function createNoteHTML(color, content = "", w = "", l = "", d = "", hasDims = false, recId = "", noteIdx = "") {
            return `
                <div class="note-item" style="border-right: 6px solid ${color}">
                    <span class="delete-note-btn" onclick="this.parentElement.remove(); saveToCloud('${recId}')">حذف ×</span>
                    <label style="cursor:pointer; font-size: 0.85em; font-weight:bold; color:${color}">
                        <input type="checkbox" onchange="toggleDims(this); saveToCloud('${recId}')" ${hasDims ? 'checked' : ''}> إضافة مقاسات (سم)
                    </label>
                    <div class="dims-area" style="display: ${hasDims ? 'grid' : 'none'};">
                        <div class="dim-box"><label>عرض</label><input type="text" class="w" value="${w}" onchange="saveToCloud('${recId}')"></div>
                        <div class="dim-box"><label>طول</label><input type="text" class="l" value="${l}" onchange="saveToCloud('${recId}')"></div>
                        <div class="dim-box"><label>عمق</label><input type="text" class="d" value="${d}" onchange="saveToCloud('${recId}')"></div>
                    </div>
                    <div class="text-editor" contenteditable="true" onblur="saveToCloud('${recId}')">${content}</div>
                </div>`;
        }

        function addNewCustomerCloud() {
            const id = "n" + Date.now();
            const dateStr = new Date().toISOString().split('T')[0];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            db.ref('azemaa_v5/notmop/' + id).set({
                name: "",
                date: dateStr,
                color: color,
                notes: [{ text: "", w: "", l: "", d: "", hasDims: false }]
            });
        }

        function addNoteItemLocal(recId) {
            const record = document.getElementById('rec-' + recId);
            const color = record.getAttribute('data-color');
            record.querySelector('.notes-container').insertAdjacentHTML('beforeend', createNoteHTML(color, "", "", "", "", false, recId));
        }

        function saveToCloud(id, showMsg = false) {
            const rec = document.getElementById('rec-' + id);
            if(!rec) return;

            const notes = [];
            rec.querySelectorAll('.note-item').forEach(n => {
                notes.push({
                    hasDims: n.querySelector('input[type="checkbox"]').checked,
                    w: n.querySelector('.w').value, 
                    l: n.querySelector('.l').value, 
                    d: n.querySelector('.d').value,
                    text: n.querySelector('.text-editor').innerHTML
                });
            });

            const data = {
                name: rec.querySelector('.name-in').value,
                date: rec.querySelector('.date-in').value,
                color: rec.getAttribute('data-color'),
                notes: notes
            };

            db.ref('azemaa_v5/notmop/' + id).set(data).then(() => {
                if(showMsg) {
                    const status = document.getElementById('saveStatus');
                    status.style.display = 'block';
                    setTimeout(() => status.style.display = 'none', 1500);
                }
            });
        }

        function deleteRecordCloud(id) {
            if(confirm("هل أنت متأكد من حذف هذا السجل نهائياً من السحابة؟")) {
                db.ref('azemaa_v5/notmop/' + id).remove();
            }
        }

        // وظائف الآلة الحاسبة (كما هي بدون تغيير)
        function toggleCalc(e) { e.stopPropagation(); const box = document.getElementById('calcBox'); const overlay = document.getElementById('overlay'); box.classList.toggle('active'); overlay.style.display = box.classList.contains('active') ? 'block' : 'none'; }
        function closeCalc() { document.getElementById('calcBox').classList.remove('active'); document.getElementById('overlay').style.display = 'none'; }
        let dInput = document.getElementById('display');
        function press(v) { dInput.value += v; }
        function clearDisplay() { dInput.value = ''; }
        function backspace() { dInput.value = dInput.value.slice(0, -1); }
        function calculate() { try { let res = eval(dInput.value); dInput.value = Number.isInteger(res) ? res : res.toFixed(2); } catch { dInput.value = 'Error'; setTimeout(clearDisplay, 1000); } }
        function toggleDims(checkbox) { checkbox.parentElement.nextElementSibling.style.display = checkbox.checked ? 'grid' : 'none'; }
    </script>
</body>
</html>
