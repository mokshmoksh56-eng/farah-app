<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO 3D - Split Card</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    
    <style>
    
        :root { --primary: #2563eb; --bg: #f0f2f5; }
        
        body { 
            font-family: system-ui, sans-serif; 
            background: var(--bg); margin: 0; padding: 0; font-weight: bold; 
            overflow-x: hidden; color: #111827;
        }

        .container { width: 100%; max-width: 100%; margin: 0; padding-bottom: 60px; }
        
        .input-section { 
            background: #fff; padding: 20px; border-bottom: 6px solid #d1d5db;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 10px;
        }
        
        textarea { 
            width: 100%; min-height: 100px; padding: 15px; border: 2px solid #e5e7eb; 
            border-radius: 12px; font-size: 18px; font-weight: bold; box-sizing: border-box;
            background: #f9fafb; outline: none;
        }

        .btn-main { 
            width: 100%; padding: 16px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: 900; margin-top: 15px; 
            font-size: 18px; border-bottom: 6px solid #1e40af; cursor: pointer;
        }

        .notes-grid { display: flex; flex-direction: column; width: 100%; gap: 15px; }

        /* --- تصميم الكارت المقسم --- */
        .card { 
            width: 100%; background: #fff;
            display: flex; flex-direction: column;
            border-bottom: 8px solid rgba(0,0,0,0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            height: auto; overflow: hidden;
        }

        .note-img { width: 100%; height: auto; display: block; }

        /* الجزء العلوي من التقسيم (العنوان أو التمييز) */
        .card-header-split {
            padding: 15px 20px;
            background: rgba(255,255,255,0.3);
            border-bottom: 2px dashed rgba(0,0,0,0.1);
            font-size: 14px;
        }

        /* الجزء السفلي من التقسيم (المحتوى الأساسي) */
        .card-body-split { 
            padding: 20px;
            word-wrap: break-word;
            overflow-wrap: anywhere; 
            word-break: break-word;
            background: rgba(255,255,255,0.1);
        }

        .date-badge {
            display: inline-block; font-size: 12px; 
            color: #4b5563; background: #fff; padding: 3px 10px;
            border-radius: 5px; direction: ltr; box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        
        .note-content { 
            font-size: 20px; line-height: 1.6; color: #000; 
            white-space: pre-wrap; text-align: right; display: block;
        }
        
        .actions { 
            display: flex; justify-content: space-between; padding: 12px 20px; 
            background: #fff; border-top: 1px solid rgba(0,0,0,0.05);
        }
        
        .edit-btn, .del-btn { 
            background: #f8f9fa; padding: 8px 15px; border-radius: 8px; 
            box-shadow: 0 3px 0 #ccc; font-size: 13px; border: 1px solid #eee;
        }

        .search-box { 
            width: 100%; padding: 18px; border: none; background: #fff; 
            text-align: center; box-sizing: border-box; border-bottom: 4px solid var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-section">
        <h2 style="text-align: center; color: var(--primary);">🚀 AZEMAA SPLIT-CARD</h2>
        <textarea id="noteInput" placeholder="اكتب ملاحظتك هنا.."></textarea>
        <label style="display:block; margin-top:10px; text-align:center; background:#eee; padding:10px; border-radius:10px; cursor:pointer;">
            🖼️ اختيار صورة <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="processFile(event)">
        </label>
        <input type="hidden" id="editId" value="">
        <button class="btn-main" onclick="handleSave()">حفظ الملحوظة المقسمة ✅</button>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 ابحث في الملاحظات..." onkeyup="loadNotes()">
    
    <div id="notesList" class="notes-grid"></div>
</div>

<script>
    let db;
    let currentImageData = "";
    const colors = ["#bae6fd", "#fef08a", "#bbf7d0", "#fecaca", "#ddd6fe", "#ffedd5", "#a5f3fc", "#e9d5ff"];

    const request = indexedDB.open("AzemaaSplitDB", 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("notes", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => { db = e.target.result; loadNotes(); };

    function processFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = 800;
                canvas.height = img.height * (800 / img.width);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                currentImageData = canvas.toDataURL('image/jpeg', 0.8);
            };
        };
    }

    function handleSave() {
        const text = document.getElementById('noteInput').value;
        const editId = document.getElementById('editId').value;
        if (!text.trim() && !currentImageData) return;

        const transaction = db.transaction(["notes"], "readwrite");
        const store = transaction.objectStore("notes");
        const now = new Date();
        const dateStr = `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()} | ${now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'})}`;

        const noteData = {
            text: text,
            image: currentImageData,
            date: dateStr,
            bgColor: colors[Math.floor(Math.random() * colors.length)]
        };

        if (editId) {
            noteData.id = parseInt(editId);
            store.put(noteData);
            document.getElementById('editId').value = "";
        } else {
            store.add(noteData);
        }

        transaction.oncomplete = () => {
            document.getElementById('noteInput').value = "";
            currentImageData = "";
            loadNotes();
        };
    }

    function loadNotes() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        const list = document.getElementById('notesList');
        list.innerHTML = "";

        const store = db.transaction("notes").objectStore("notes");
        store.openCursor(null, "prev").onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                const note = cursor.value;
                if (note.text.toLowerCase().includes(term)) {
                    list.innerHTML += `
                        <div class="card" style="background: ${note.bgColor}">
                            <div class="card-header-split">
                                <span class="date-badge">🕒 ${note.date}</span>
                            </div>
                            ${note.image ? `<img src="${note.image}" class="note-img">` : ""}
                            <div class="card-body-split">
                                <div class="note-content">${note.text}</div>
                            </div>
                            <div class="actions">
                                <span class="edit-btn" onclick="editNote(${note.id})">✏️ تعديل</span>
                                <span class="del-btn" onclick="deleteNote(${note.id})">🗑️ حذف</span>
                            </div>
                        </div>`;
                }
                cursor.continue();
            }
        };
    }

    function editNote(id) {
        const store = db.transaction("notes").objectStore("notes");
        store.get(id).onsuccess = (e) => {
            const note = e.target.result;
            document.getElementById('noteInput').value = note.text;
            document.getElementById('editId').value = note.id;
            currentImageData = note.image;
            window.scrollTo({top: 0, behavior: 'smooth'});
        };
    }

    function deleteNote(id) {
        if (confirm("حذف؟")) {
            db.transaction(["notes"], "readwrite").objectStore("notes").delete(id).onsuccess = () => loadNotes();
        }
    }
</script>
</body>
</html>
