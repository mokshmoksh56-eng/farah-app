<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الورشة الذكي - نسخة الهاتف</title>
    <style>
        :root {
            --bg-page: #f4f7f6;
            --deep-red: #8b0000; 
            --bright-red: #ff4757; 
            --text-main: #2c3e50;
            --success-green: #218c74;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0; padding: 10px;
            padding-bottom: 80px; /* مساحة للزر السفلي */
        }

        .header-main {
            text-align: center;
            padding: 15px;
            background: #fff;
            border-bottom: 4px solid var(--deep-red);
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-main h1 { color: var(--deep-red); margin: 0; font-size: 1.4em; }

        /* تعديل التصميم ليكون عمود واحد للهاتف */
        .main-content { max-width: 600px; margin: 0 auto; }

        /* الآلة الحاسبة - زر عائم */
        .calc-bar { 
            position: fixed; left: 15px; bottom: 15px; 
            background: var(--deep-red); color: #fff; 
            width: 50px; height: 50px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-size: 1.5em;
        }

        .calc-panel { 
            position: fixed; bottom: -100%; left: 0; width: 100%; 
            background: #fff; border-top: 5px solid var(--deep-red); 
            transition: 0.4s ease; z-index: 1002; padding: 20px 10px; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
            border-radius: 20px 20px 0 0;
        }
        .calc-panel.active { bottom: 0; }

        #display { 
            width: 90%; height: 60px; background: #f1f2f6; border: 2px solid #ddd; 
            font-size: 2em; padding: 0 5%; border-radius: 10px; margin-bottom: 15px; 
            text-align: left; direction: ltr; margin-left: auto; margin-right: auto; display: block;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 0 10px; }
        .calc-btn { padding: 15px; font-size: 1.2em; font-weight: bold; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; cursor: pointer; }
        .btn-clear { color: #fff; background: var(--bright-red); }
        .btn-equal { background: var(--success-green); color: #fff; grid-column: span 2; }

        /* كروت الزبائن */
        .customer-card { 
            background: #fff; border-radius: 12px; margin-bottom: 20px; 
            overflow: hidden; border: 1px solid #ddd; border-top-width: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
        }
        .card-header { padding: 15px; background: #fdfdfd; border-bottom: 1px solid #eee; }
        .label-guide { color: var(--deep-red); font-weight: bold; font-size: 0.85em; display: block; margin-bottom: 4px; }
        
        .input-field { 
            background: #fff; border: 1px solid #ccc; font-size: 1em; 
            width: 100%; padding: 8px; border-radius: 6px; box-sizing: border-box; margin-bottom: 10px;
        }
        
        .date-input { 
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; 
            font-weight: bold; color: #333; margin-bottom: 10px; background: #fff;
        }

        .card-body { padding: 15px; }
        .note-block { background: #f9f9f9; border: 1px solid #eee; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        
        .dims-area { 
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; 
            margin: 10px 0; padding: 10px; background: #fff; border: 1px solid var(--deep-red); border-radius: 8px; 
        }
        .dim-box label { display: block; font-weight: bold; text-align: center; font-size: 0.75em; color: var(--deep-red); }
        .dim-box input { width: 100%; padding: 8px 0; text-align: center; border: 1px solid #eee; border-radius: 4px; font-weight: bold; font-size: 1em; box-sizing: border-box;}
        
        .text-writer { 
            min-height: 60px; outline: none; font-size: 1.05em; padding: 10px; 
            background: #fff; border: 1px solid #ddd; border-radius: 6px; 
        }
        
        .card-controls { display: flex; gap: 10px; margin-top: 15px; }
        .btn-save { background: var(--success-green); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; flex: 2; }
        .btn-add-extra { background: #fff; color: var(--deep-red); border: 1px dashed var(--deep-red); padding: 12px; border-radius: 8px; font-weight: bold; flex: 1; font-size: 0.8em; }
        
        .btn-new-cust { 
            background: var(--deep-red); color: #fff; border: none; padding: 15px; 
            border-radius: 10px; font-size: 1.1em; font-weight: bold; width: 100%; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001; display: none; }
        .remove-card { color: #ff4757; text-align: center; display: block; margin-top: 10px; font-weight: bold; text-decoration: underline; font-size: 0.9em; }
    </style>
</head>
<body onclick="closeCalc()">

    <div class="overlay" id="overlay"></div>
    <div class="calc-bar" onclick="toggleCalc(event)">🖩</div>
    
    <div class="calc-panel" id="calcBox" onclick="event.stopPropagation();">
        <div style="text-align: center; color: #888; margin-bottom: 10px;">اسحب للأسفل أو انقر خارجاً للإغلاق</div>
        <input type="text" id="display" readonly placeholder="0">
        <div class="calc-grid">
            <button class="calc-btn btn-clear" onclick="clearDisplay()">C</button>
            <button class="calc-btn" onclick="backspace()">DEL</button>
            <button class="calc-btn" onclick="press('/')">÷</button>
            <button class="calc-btn" onclick="press('*')">×</button>
            <button class="calc-btn" onclick="press('9')">9</button>
            <button class="calc-btn" onclick="press('8')">8</button>
            <button class="calc-btn" onclick="press('7')">7</button>
            <button class="calc-btn" onclick="press('-')">-</button>
            <button class="calc-btn" onclick="press('6')">6</button>
            <button class="calc-btn" onclick="press('5')">5</button>
            <button class="calc-btn" onclick="press('4')">4</button>
            <button class="calc-btn" onclick="press('+')">+</button>
            <button class="calc-btn" onclick="press('3')">3</button>
            <button class="calc-btn" onclick="press('2')">2</button>
            <button class="calc-btn" onclick="press('1')">1</button>
            <button class="calc-btn" onclick="press('.')">.</button>
            <button class="calc-btn" onclick="press('0')">0</button>
            <button class="calc-btn btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <header class="header-main">
        <h1 id="mainTitle">سجل الورشة</h1>
    </header>

    <main class="main-content">
        <button class="btn-new-cust" onclick="addCust()">+ إضافة زبون جديد</button>
        <div id="list"></div>
    </main>

    <script>
        const strongColors = ['#e67e22', '#2980b9', '#27ae60', '#8e44ad', '#f39c12', '#c0392b', '#16a085'];

        function saveToLocal() {
            const cardsData = [];
            document.querySelectorAll('.customer-card').forEach(card => {
                const notes = [];
                card.querySelectorAll('.note-block').forEach(nb => {
                    notes.push({
                        hasDims: nb.querySelector('.dim-check').checked,
                        w: nb.querySelectorAll('input[type="text"]')[0]?.value || '',
                        h: nb.querySelectorAll('input[type="text"]')[1]?.value || '',
                        d: nb.querySelectorAll('input[type="text"]')[2]?.value || '',
                        text: nb.querySelector('.text-writer').innerText
                    });
                });

                cardsData.push({
                    color: card.style.borderTopColor,
                    name: card.querySelector('.name-in').value,
                    phone: card.querySelector('.phone-in').value,
                    date: card.querySelector('.date-in').value,
                    notes: notes
                });
            });
            localStorage.setItem('workshopData_Mobile', JSON.stringify(cardsData));
        }

        function loadFromLocal() {
            const data = JSON.parse(localStorage.getItem('workshopData_Mobile') || '[]');
            data.forEach(item => {
                const card = createCardElement(item.color, item.name, item.phone, item.date);
                const container = card.querySelector('.notes-container');
                container.innerHTML = '';
                item.notes.forEach((n, idx) => {
                    container.insertAdjacentHTML('beforeend', createNoteBlockHtml(idx === 0, n.hasDims, n.w, n.h, n.d, n.text));
                });
                document.getElementById('list').appendChild(card);
            });
        }

        function createCardElement(color, name = '', phone = '', date = '') {
            if (!date) {
                const today = new Date();
                date = today.toISOString().split('T')[0];
            }
            const card = document.createElement('div');
            card.className = 'customer-card';
            card.style.borderTopColor = color;
            card.innerHTML = `
                <div class="card-header">
                    <span class="label-guide">👤 اسم الزبون:</span>
                    <input type="text" class="input-field name-in" value="${name}" placeholder="أدخل الاسم">
                    <span class="label-guide">📞 رقم الهاتف:</span>
                    <input type="tel" class="input-field phone-in" value="${phone}" placeholder="01xxxxxxxxx">
                    <span class="label-guide">📅 التاريخ:</span>
                    <input type="date" class="date-input date-in" value="${date}">
                </div>
                <div class="card-body">
                    <div class="notes-container"></div>
                    <div class="card-controls">
                        <button class="btn-save" onclick="handleSave(this)">حفظ ✅</button>
                        <button class="btn-add-extra" onclick="addExtraNote(this)">+ ملحوظة</button>
                    </div>
                    <span class="remove-card" onclick="deleteCard(this)">حذف هذا الكارت نهائياً</span>
                </div>`;
            return card;
        }

        function createNoteBlockHtml(isFirst, hasDims, w, h, d, text) {
            return `
                <div class="note-block">
                    <label style="font-weight:bold; cursor:pointer; display:block; margin-bottom:10px;">
                        <input type="checkbox" class="dim-check" ${hasDims ? 'checked' : ''} onchange="toggleDims(this)"> إضافة مقاسات (سم)
                    </label>
                    <div class="dims-area" style="display: ${hasDims ? 'grid' : 'none'}">
                        <div class="dim-box"><label>عرض</label><input type="text" value="${w}"></div>
                        <div class="dim-box"><label>طول</label><input type="text" value="${h}"></div>
                        <div class="dim-box"><label>عمق</label><input type="text" value="${d}"></div>
                    </div>
                    <span class="label-guide">${isFirst ? '📝 تفاصيل الطلب:' : '📝 ملاحظة إضافية:'}</span>
                    <div class="text-writer" contenteditable="true">${text}</div>
                </div>`;
        }

        function addCust() {
            const randomColor = strongColors[Math.floor(Math.random() * strongColors.length)];
            const card = createCardElement(randomColor);
            card.querySelector('.notes-container').innerHTML = createNoteBlockHtml(true, false, '', '', '', '');
            document.getElementById('list').prepend(card);
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function addExtraNote(btn) {
            const container = btn.parentElement.previousElementSibling;
            container.insertAdjacentHTML('beforeend', createNoteBlockHtml(false, false, '', '', '', ''));
        }

        function handleSave(btn) {
            saveToLocal();
            btn.innerText = "تم الحفظ ✓";
            setTimeout(() => btn.innerText = "حفظ ✅", 2000);
        }

        function deleteCard(el) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                el.closest('.customer-card').remove();
                saveToLocal();
            }
        }

        function toggleDims(checkbox) {
            const area = checkbox.parentElement.nextElementSibling;
            area.style.display = checkbox.checked ? 'grid' : 'none';
        }

        // الآلة الحاسبة
        function toggleCalc(e) {
            e.stopPropagation();
            const box = document.getElementById('calcBox');
            box.classList.toggle('active');
            document.getElementById('overlay').style.display = box.classList.contains('active') ? 'block' : 'none';
        }

        function closeCalc() {
            document.getElementById('calcBox').classList.remove('active');
            document.getElementById('overlay').style.display = 'none';
        }

        let dInput = document.getElementById('display');
        function press(v) { dInput.value += v; }
        function clearDisplay() { dInput.value = ''; }
        function backspace() { dInput.value = dInput.value.slice(0, -1); }
        function calculate() { 
            try { 
                let res = eval(dInput.value);
                dInput.value = Number.isInteger(res) ? res : res.toFixed(2);
            } catch { dInput.value = 'Error'; setTimeout(clearDisplay, 1000); }
        }

        window.onload = loadFromLocal;
    </script>
</body>
</html>
