<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة حضور طلخا - Azemaa Pro</title>
    <style>
        :root { 
            --turquoise: #008b8b; --danger: #d32f2f; --warning: #ffc107; 
            --info: #007bff; --green: #2e7d32; --navy: #001f3f; --gold: #ffd700;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #eef2f3; margin: 0; padding: 5px; color: #1a1a1a; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 98vh; }
        .station-header { background: var(--navy); color: var(--gold); padding: 5px; text-align: center; font-size: 12px; font-weight: bold; border-bottom: 2px solid var(--gold); }
        .header { background: linear-gradient(135deg, var(--turquoise) 0%, #00ced1 100%); color: white; padding: 10px 5px; text-align: center; }
        .clock-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        #digital-clock { font-size: 28px; font-weight: 800; font-family: 'Courier New', monospace; color: #e0ffff; }
        .countdown-timer { font-size: 12px; color: var(--gold); font-weight: bold; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 10px; margin-top: 5px; border: 1px solid rgba(255,215,0,0.3); }
        #holiday-now { color: #fff; background: var(--danger); padding: 2px 8px; border-radius: 5px; margin-bottom: 5px; display: none; font-size: 13px; }
        .date-display { margin-top:5px; font-weight: bold; font-size: 13px; background: rgba(0,0,0,0.1); padding: 3px 12px; border-radius: 15px; display: inline-block; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 5px 8px; background: #f0f7f7; }
        .dash-card { background: white; padding: 5px 2px; border-radius: 10px; text-align: center; border: 1px solid #d1e0e0; cursor: pointer; }
        .dash-label { font-size: 10px; color: #777; font-weight: bold; display: block; }
        .dash-val { font-size: 13px; font-weight: 800; color: var(--turquoise); min-height: 15px; }
        .user-info-section { padding: 10px 15px; background: #fff; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .info-input { width: 100%; border: 2px solid #eee; border-radius: 10px; padding: 10px; font-size: 14px; font-weight: bold; text-align: center; outline: none; margin-bottom: 5px; }
        .actions { padding: 5px 8px; display: flex; flex-direction: column; gap: 5px; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-manual { background: #fff; color: var(--turquoise); border: 2px dashed var(--turquoise); padding: 8px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .table-wrap { padding: 0 5px; flex-grow: 1; overflow-y: auto; background: #fafafa; border-top: 2px solid var(--turquoise); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        thead { display: none; }
        td { padding: 10px 2px; border-bottom: 1px solid #eee; font-weight: bold; vertical-align: middle; }
        
        .badge { padding: 5px 8px; border-radius: 8px; color: white; font-size: 11px; display: inline-block; min-width: 90px; font-weight: 800; }
        .bg-late { background-color: var(--danger); }    
        .bg-permit { background-color: var(--warning); color: black; } 
        .bg-regular { background-color: var(--green); }  
        .bg-absent { background-color: var(--info); }
        .bg-holiday { background-color: var(--navy); color: var(--gold); }
        
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 90%; max-width: 380px; border-radius: 25px; padding: 25px; text-align: center; border: 2px solid var(--turquoise); }
    </style>
</head>
<body onload="init()">

<div class="container">
    <div class="station-header">محطة طلخا المركبة ⚡ <span id="sync-loader" style="display:none; color:var(--gold);">جاري الحفظ...</span></div>
    
    <div class="header">
        <div class="clock-wrapper">
            <div id="holiday-now"></div> <span id="digital-clock">00:00:00</span>
            <div id="countdown-display" class="countdown-timer">جاري حساب المتبقي...</div>
        </div>
        <div class="date-display" id="date-text">-- / -- / ----</div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" style="display: none; text-align: center; padding: 40px 15px; flex-grow: 1; background: #fff;">
        <h3 style="color: var(--navy); margin-bottom: 25px;">تسجيل الدخول للمنظومة</h3>
        <input type="text" id="u-id" class="info-input" style="border: 2px solid var(--info); max-width: 280px; margin: 0 auto 15px auto;" placeholder="أدخل الكود الوظيفي هنا">
        <button class="btn-main" style="background: var(--info); max-width: 280px; margin: 0 auto 20px auto;" onclick="loadLocalData()">تسجيل الدخول 🚪</button>
        <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; max-width: 280px; margin: 20px auto 0;">
            <span style="font-size: 13px; color: #777;">ليس لديك حساب مسجل؟</span><br>
            <button style="background:none; border:none; color:var(--turquoise); font-size:14px; cursor:pointer; text-decoration:underline; font-weight: bold; margin-top: 8px;" onclick="openRegisterModal()">تسجيل موظف جديد</button>
        </div>
    </div>

    <!-- الشاشة الرئيسية للمنظومة (مخفية حتى يتم تسجيل الدخول) -->
    <div id="app-screen" style="display: none; flex-direction: column; flex-grow: 1; overflow: hidden;">
        <div class="user-info-section">
            <div id="welcome-msg" style="font-size: 15px; font-weight: bold; color: var(--turquoise);"></div>
            <button style="background:none; border:none; color:var(--danger); font-size:13px; cursor:pointer; text-decoration:underline; font-weight: bold;" onclick="logout()">خروج ❌</button>
        </div>

        <div class="dashboard">
            <div class="dash-card" onclick="editBalance('reg')"><span class="dash-label">اعتيادي</span><span id="reg-left" class="dash-val">0</span></div>
            <div class="dash-card" onclick="editBalance('emg')"><span class="dash-label">عارضة</span><span id="emg-left" class="dash-val">0</span></div>
            <div class="dash-card"><span class="dash-label">تصاريح</span><span id="permits-count" class="dash-val">0/3</span></div>
            <div class="dash-card"><span>تأخير (د)</span><br><span id="sum-late" class="dash-val" style="color:var(--danger)"></span></div>
            <div class="dash-card"><span>باقي دقائق</span><br><span id="rem-mins" class="dash-val">60</span></div>
            <div class="dash-card" onclick="location.reload()"><span>تحديث</span><br><span class="dash-val">🔄</span></div>
        </div>

        <div class="actions">
            <button id="main-punch-btn" class="btn-main" style="background:var(--green)" onclick="handlePunch()">تسجيل بصمة الآن 📲</button>
            <button class="btn-manual" onclick="openManualModal()">تسجيل يدوي / غياب / تصريح ✍️</button>
        </div>

        <div class="table-wrap">
            <table>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="registerModal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="color:var(--turquoise); margin-top:0;">تسجيل موظف جديد</h3>
        <input type="text" id="reg-name" class="info-input" placeholder="الاسم الرباعي">
        <input type="text" id="reg-id" class="info-input" placeholder="الكود الوظيفي (رقم)">
        <button class="btn-main" style="background:var(--green); margin-top:10px;" onclick="window.submitNewEmployee()">حفظ ✅</button>
        <button class="btn-main" style="background:#eee; color:#666; margin-top:10px;" onclick="closeRegisterModal()">إلغاء</button>
    </div>
</div>

<div id="manualModal" class="modal-overlay">
    <div class="modal-box">
        <h3 style="color:var(--turquoise); margin-top:0;">تسجيل يدوي</h3>
        <input type="date" id="m-date" class="info-input">
        <select id="m-type" class="info-input" onchange="toggleLateInput()">
            <option value="منتظم">منتظم</option>
            <option value="تأخير">تأخير</option>
            <option value="تصريح">تصريح</option>
            <option value="غياب">غياب</option>
            <option value="إجازة اعتيادي">إجازة اعتيادي</option>
            <option value="إجازة عارضة">إجازة عارضة</option>
        </select>
        <input type="number" id="m-late" class="info-input" placeholder="دقائق التأخير" value="" style="display:none; border: 2px solid var(--danger);">
        <button class="btn-main" style="background:var(--turquoise); margin-top:10px;" onclick="submitManual()">حفظ ✅</button>
        <button class="btn-main" style="background:#eee; color:#666; margin-top:10px;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<script>
    function getAllEmployees() {
        return JSON.parse(localStorage.getItem('all_employees_db')) || {};
    }

    function saveAllEmployees(employees) {
        localStorage.setItem('all_employees_db', JSON.stringify(employees));
    }

    window.submitNewEmployee = function() {
        const name = document.getElementById('reg-name').value;
        const id = document.getElementById('reg-id').value.trim();
        if(!name || !id) return alert("الرجاء إكمال جميع البيانات");
        
        let employees = getAllEmployees();
        
        if (employees[id]) {
            alert("❌ هذا الكود مسجل مسبقاً لموظف آخر! الرجاء اختيار كود مختلف.");
        } else {
            employees[id] = { name: name, baseReg: 30, baseEmg: 7, logs: [] };
            saveAllEmployees(employees);
            alert("تم تسجيل الموظف بنجاح ✅ يمكنك الآن تسجيل الدخول.");
            closeRegisterModal();
        }
    };

    window.loadLocalData = function() {
        const id = document.getElementById('u-id').value.trim();
        if (!id) return alert("الرجاء إدخال الكود الوظيفي!");
        
        let employees = getAllEmployees();
        
        if (employees[id]) {
            const data = employees[id];
            localStorage.setItem('u_i', id);
            localStorage.setItem('u_n', data.name);
            localStorage.setItem('t_db', JSON.stringify(data.logs || []));
            // معالجة مشكلة القيمة صفر في الإجازات
            localStorage.setItem('u_base_reg', data.baseReg !== undefined ? data.baseReg : 30);
            localStorage.setItem('u_base_emg', data.baseEmg !== undefined ? data.baseEmg : 7);
            
            location.reload(); // تحديث الصفحة لفتح شاشة النظام
        } else { 
            alert("❌ الكود غير مسجل! تأكد من الرقم أو قم بتسجيل موظف جديد."); 
            document.getElementById('u-id').value = '';
        }
    };

    window.syncLocalData = function() {
        const id = localStorage.getItem('u_i');
        if (!id) return;
        
        document.getElementById('sync-loader').style.display = 'inline';
        
        let employees = getAllEmployees();
        if(employees[id]) {
            employees[id].logs = JSON.parse(localStorage.getItem('t_db')) || [];
            employees[id].baseReg = parseInt(localStorage.getItem('u_base_reg'));
            employees[id].baseEmg = parseInt(localStorage.getItem('u_base_emg'));
            saveAllEmployees(employees);
        }
        
        setTimeout(() => document.getElementById('sync-loader').style.display = 'none', 500);
    };
</script>

<script>
    const holidays = [
        { name: "عيد الميلاد المجيد", date: "2026-01-07" },
        { name: "ثورة 25 يناير", date: "2026-01-25" },
        { name: "شهر رمضان المبارك 🌙", date: "2026-02-18" },
        { name: "عيد الفطر المبارك", date: "2026-03-20" },
        { name: "عيد تحرير سيناء", date: "2026-04-25" },
        { name: "عيد العمال", date: "2026-05-01" },
        { name: "عيد الأضحى المبارك", date: "2026-05-27" },
        { name: "ثورة 30 يونيو", date: "2026-06-30" },
        { name: "عيد ثورة 23 يوليو", date: "2026-07-23" },
        { name: "نصر أكتوبر", date: "2026-10-06" }
    ];

    let db = JSON.parse(localStorage.getItem('t_db')) || [];
    let baseReg = localStorage.getItem('u_base_reg') !== null ? parseInt(localStorage.getItem('u_base_reg')) : 0;
    let baseEmg = localStorage.getItem('u_base_emg') !== null ? parseInt(localStorage.getItem('u_base_emg')) : 0;

    function hasPunchedToday(fullDate) {
        return db.some(log => log.dDate === fullDate);
    }

    function getPermitsCount() {
        return db.filter(log => log.type === 'تصريح').length;
    }

    function sortLogs() {
        db.sort((a, b) => {
            const parseDate = (dateStr) => {
                const parts = dateStr.split(' / ');
                return parts.length === 3 ? new Date(parts[2], parts[1] - 1, parts[0]).getTime() : 0;
            };
            return parseDate(b.dDate) - parseDate(a.dDate);
        });
    }

    function init() {
        const id = localStorage.getItem('u_i');
        
        // التبديل بين شاشة الدخول وشاشة النظام
        if(id) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            document.getElementById('welcome-msg').innerText = "👤 الموظف: " + localStorage.getItem('u_n');
            render(); // إظهار البيانات إذا كان مسجل الدخول
        } else {
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('app-screen').style.display = 'none';
        }
        
        setInterval(updateTime, 1000);
        updateTime();
        checkFriday();
    }

    function logout() {
        if(confirm("تأكيد تسجيل الخروج؟")) { 
            // مسح بيانات الجلسة الحالية فقط دون مسح جميع الموظفين
            localStorage.removeItem('u_i');
            localStorage.removeItem('u_n');
            localStorage.removeItem('t_db');
            localStorage.removeItem('u_base_reg');
            localStorage.removeItem('u_base_emg');
            location.reload(); 
        }
    }

    function toggleLateInput() {
        const type = document.getElementById('m-type').value;
        const lateInput = document.getElementById('m-late');
        lateInput.style.display = (type === "تأخير") ? "block" : "none";
        if(type !== "تأخير") lateInput.value = "";
    }

    function checkFriday() {
        if (new Date().getDay() === 5) {
            const btn = document.getElementById('main-punch-btn');
            btn.style.background = "#666";
            btn.innerText = "اليوم الجمعة - عطلة أسبوعية 🏠";
        }
    }

    function updateTime() {
        const now = new Date();
        let h = now.getHours();
        const ampm = h >= 12 ? 'م' : 'ص';
        document.getElementById('digital-clock').innerText = `${h % 12 || 12}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')} ${ampm}`;
        document.getElementById('date-text').innerText = `${now.getDate()} / ${now.getMonth()+1} / ${now.getFullYear()}`;
        updateCountdown();
    }

    function updateCountdown() {
        const now = new Date();
        const holidayNowDiv = document.getElementById('holiday-now');
        let nextHoliday = null;
        let minDiff = Infinity;
        holidays.forEach(h => {
            const hDate = new Date(h.date);
            const diff = hDate - now;
            if (now.toDateString() === hDate.toDateString()) {
                holidayNowDiv.innerText = `اليوم: ${h.name} 🎉`;
                holidayNowDiv.style.display = 'block';
            }
            if (diff > 0 && diff < minDiff) { minDiff = diff; nextHoliday = h; }
        });
        if (nextHoliday) {
            const days = Math.floor(minDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((minDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('countdown-display').innerText = `متبقي على ${nextHoliday.name}: ${days} يوم و ${hours} ساعة`;
        }
    }

    function render() {
        const body = document.getElementById('log-body');
        body.innerHTML = '';
        let lateSum = 0;
        let pUsed = getPermitsCount(); 
        
        db.forEach((e, index) => {
            let lateVal = parseInt(e.late || 0);
            if(e.type==='تأخير') lateSum += lateVal;
            
            let cls = e.type === "تأخير" ? "bg-late" : e.type === "تصريح" ? "bg-permit" : e.type.includes("إجازة") ? "bg-holiday" : "bg-regular";
            let txt = (lateVal > 0) ? `${e.type} (${lateVal} د)` : e.type;
            
            body.innerHTML += `
                <tr>
                    <td style="font-size:11px; color:#333;">${e.dDate}</td>
                    <td style="font-size:11px; color:var(--turquoise);">${e.time}</td>
                    <td><span class="badge ${cls}">${txt}</span></td>
                    <td><button onclick="deleteRow(${index})" style="background:none; border:none; color:red; cursor:pointer; font-size:14px;">🗑️</button></td>
                </tr>`;
        });
        document.getElementById('sum-late').innerText = (lateSum > 0) ? lateSum : "";
        document.getElementById('rem-mins').innerText = Math.max(0, 60 - lateSum);
        document.getElementById('reg-left').innerText = baseReg;
        document.getElementById('emg-left').innerText = baseEmg;
        document.getElementById('permits-count').innerText = `${pUsed}/3`;
    }

    async function handlePunch() {
        if (new Date().getDay() === 5) return alert("اليوم الجمعة إجازة رسمية");
        
        const now = new Date();
        const fullDate = `${now.getDate()} / ${now.getMonth()+1} / ${now.getFullYear()}`;
        
        if (hasPunchedToday(fullDate)) return alert("❌ لقد قمت بتسجيل حركة لهذا اليوم مسبقاً!");

        const mins = now.getHours() * 60 + now.getMinutes();
        const s = 7*60, l = 7*60+55, p = 8*60+10, c = 9*60+30;
        let status = "", late = 0;
        
        if (mins < s) return alert("تفتح 7 صباحاً");
        else if (mins < l) status = "منتظم";
        else if (mins < p) { status = "تأخير"; late = mins - l; }
        else if (mins <= c) {
            if (getPermitsCount() >= 3) {
                alert("❌ استنفذت الحد الأقصى للتصاريح (3 تصاريح). يمكنك تسجيل إجازة.");
                return promptForVacation();
            }
            status = "تصريح";
        }
        else {
            return promptForVacation();
        }
        
        saveLog({ dDate: fullDate, time: `${now.getHours()%12||12}:${now.getMinutes().toString().padStart(2,'0')} ${now.getHours()>=12?'م':'ص'}`, type: status, late: late });
    }

    function promptForVacation() {
        if(confirm("البصمة مغلقة. تسجيل إجازة اعتيادية؟ (موافق=اعتيادي / إلغاء=عارضة)")) recordHoliday("إجازة اعتيادي");
        else if(confirm("تسجيل عارضة؟")) recordHoliday("إجازة عارضة");
    }

    async function recordHoliday(type) {
        if (type === "إجازة اعتيادي" && baseReg <= 0) return alert("❌ رصيد إجازاتك الاعتيادية غير كافٍ!");
        if (type === "إجازة عارضة" && baseEmg <= 0) return alert("❌ رصيد إجازاتك العارضة غير كافٍ!");

        if (type === "إجازة اعتيادي") baseReg--;
        else baseEmg--;
        
        localStorage.setItem('u_base_reg', baseReg); 
        localStorage.setItem('u_base_emg', baseEmg);
        
        const now = new Date();
        const fullDate = `${now.getDate()} / ${now.getMonth()+1} / ${now.getFullYear()}`;
        saveLog({ dDate: fullDate, time: "--:--", type: type, late: 0 });
    }

    function saveLog(item) {
        db.push(item);
        sortLogs();
        localStorage.setItem('t_db', JSON.stringify(db));
        render(); 
        if(window.syncLocalData) window.syncLocalData(); 
    }

    function submitManual() {
        const d = document.getElementById('m-date').value;
        if(!d) return alert("اختر التاريخ");
        const type = document.getElementById('m-type').value;
        const dObj = new Date(d);
        const fullDate = `${dObj.getDate()} / ${dObj.getMonth()+1} / ${dObj.getFullYear()}`;
        
        if (hasPunchedToday(fullDate)) return alert("❌ يوجد سجل لهذا اليوم بالفعل!");

        if (type.includes("إجازة")) {
            recordManualHoliday(type, fullDate);
        } else if (type === "تصريح" && getPermitsCount() >= 3) {
            return alert("❌ استنفذت الحد الأقصى للتصاريح (3 تصاريح)!");
        } else {
            db.push({ dDate: fullDate, time: "--:--", type: type, late: document.getElementById('m-late').value || 0 });
            sortLogs(); 
            localStorage.setItem('t_db', JSON.stringify(db));
            render(); 
            if(window.syncLocalData) window.syncLocalData(); 
        }
        closeModal();
    }

    function recordManualHoliday(type, fullDate) {
        if (type === "إجازة اعتيادي" && baseReg <= 0) return alert("❌ رصيد إجازاتك الاعتيادية غير كافٍ!");
        if (type === "إجازة عارضة" && baseEmg <= 0) return alert("❌ رصيد إجازاتك العارضة غير كافٍ!");

        if (type === "إجازة اعتيادي") baseReg--;
        else baseEmg--;
        
        localStorage.setItem('u_base_reg', baseReg); 
        localStorage.setItem('u_base_emg', baseEmg);
        
        saveLog({ dDate: fullDate, time: "--:--", type: type, late: 0 });
    }

    function deleteRow(i) { if(confirm("حذف؟")) { db.splice(i,1); localStorage.setItem('t_db', JSON.stringify(db)); render(); if(window.syncLocalData) window.syncLocalData(); } }
    
    window.openRegisterModal = () => document.getElementById('registerModal').style.display = 'flex';
    window.closeRegisterModal = () => document.getElementById('registerModal').style.display = 'none';
    window.openManualModal = () => { document.getElementById('manualModal').style.display='flex'; toggleLateInput(); };
    window.closeModal = () => document.getElementById('manualModal').style.display='none';
    
    function editBalance(t) { 
        let v = prompt("الرصيد:", t==='reg'?baseReg:baseEmg); 
        if(v !== null && v.trim() !== "") { 
            let newValue = parseInt(v);
            if(!isNaN(newValue)) {
                if(t === 'reg') {
                    baseReg = newValue;
                    localStorage.setItem('u_base_reg', baseReg);
                } else {
                    baseEmg = newValue;
                    localStorage.setItem('u_base_emg', baseEmg);
                }
                if(window.syncLocalData) window.syncLocalData(); 
                render(); 
            }
        } 
    }
</script>
</body>
</html>
