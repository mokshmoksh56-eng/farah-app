<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة حضور طلخا المركبة - Online</title>
    <style>
        :root { 
            --turquoise: #008b8b; --danger: #d32f2f; --warning: #ffc107; 
            --info: #007bff; --green: #2e7d32; --navy: #001f3f; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #eef2f3; margin: 0; padding: 5px; color: #1a1a1a; direction: rtl; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 98vh; }
        
        .station-header { background: var(--navy); color: #ffd700; padding: 5px; text-align: center; font-size: 12px; font-weight: bold; border-bottom: 2px solid #ffd700; }
        .header { background: linear-gradient(135deg, var(--turquoise) 0%, #00ced1 100%); color: white; padding: 10px 5px; text-align: center; }
        
        .clock-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
        #digital-clock { font-size: 28px; font-weight: 800; font-family: 'Courier New', monospace; color: #e0ffff; }
        
        /* تنسيق العداد التنازلي */
        .countdown-timer { font-size: 12px; color: #ffd700; font-weight: bold; background: rgba(0,0,0,0.3); padding: 4px 12px; border-radius: 10px; margin-top: 5px; border: 1px solid rgba(255,215,0,0.3); }
        #holiday-now { color: #fff; background: var(--danger); padding: 2px 8px; border-radius: 5px; margin-bottom: 5px; display: none; font-size: 13px; }

        .date-display { margin-top:5px; font-weight: bold; font-size: 13px; background: rgba(0,0,0,0.1); padding: 3px 12px; border-radius: 15px; display: inline-block; }
        
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 8px; background: #f0f7f7; }
        .dash-card { background: white; padding: 5px 2px; border-radius: 10px; text-align: center; border: 1px solid #d1e0e0; cursor: pointer; }
        .dash-label { font-size: 10px; color: #777; font-weight: bold; display: block; }
        .dash-val { font-size: 13px; font-weight: 800; color: var(--turquoise); }

        .user-info-section { padding: 8px; background: #fff; border-bottom: 1px solid #eee; text-align: center; }
        .info-input { width: 100%; border: 2px solid #eee; border-radius: 10px; padding: 8px; font-size: 12px; font-weight: bold; text-align: center; outline: none; margin-bottom: 3px; }

        .actions { padding: 8px; display: flex; flex-direction: column; gap: 5px; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 15px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-manual { background: #fff; color: var(--turquoise); border: 2px dashed var(--turquoise); padding: 8px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 13px; }
        
        .table-wrap { padding: 5px; flex-grow: 1; overflow-y: auto; background: #fafafa; border-top: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center; }
        th { padding: 12px 5px; background: #e0f2f2; color: var(--turquoise); position: sticky; top: 0; font-size: 14px; }
        td { padding: 10px 5px; border-bottom: 1px solid #eee; font-weight: bold; }
        
        .badge { padding: 5px 10px; border-radius: 8px; color: white; font-size: 11px; display: inline-block; min-width: 65px; font-weight: bold; }
        .bg-late { background-color: var(--danger); }    
        .bg-permit { background-color: var(--warning); color: black; } 
        .bg-regular { background-color: var(--green); }  
        .bg-absent { background-color: var(--info); }    

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 90%; max-width: 380px; border-radius: 25px; padding: 25px; text-align: center; }
    </style>
</head>
<body onload="init()">

<div class="container">
    <div class="station-header">محطة طلخا المركبة ⚡ <span id="sync-loader" style="display:none; color:#ffd700;">جاري الحفظ...</span></div>
    
    <div class="header">
        <div class="clock-wrapper">
            <div id="holiday-now"></div> <span id="digital-clock">00:00:00</span>
            <div id="countdown-display" class="countdown-timer">جاري حساب المتبقي...</div>
        </div>
        <div class="date-display" id="date-text">-- / -- / ----</div>
    </div>

    <div class="user-info-section">
        <input type="text" id="u-id" class="info-input" style="border:2px solid var(--info)" placeholder="ادخل الكود للدخول" onchange="loadFromCloud()">
        <div id="welcome-msg" style="font-size: 13px; font-weight: bold; color: var(--turquoise);"></div>
        <button style="background:none; border:none; color:var(--info); font-size:10px; cursor:pointer;" onclick="openRegisterModal()">تسجيل موظف جديد؟</button>
    </div>

    <div class="dashboard">
        <div class="dash-card" onclick="editBalance('reg')"><span class="dash-label">اعتيادي</span><span id="reg-left" class="dash-val">0</span></div>
        <div class="dash-card" onclick="editBalance('emg')"><span class="dash-label">عارضة</span><span id="emg-left" class="dash-val">0</span></div>
        <div class="dash-card"><span class="dash-label">تصاريح</span><span id="permits-count" class="dash-val">0/3</span></div>
        <div class="dash-card"><span>تأخير (د)</span><br><span id="sum-late" class="dash-val" style="color:var(--danger)">0</span></div>
        <div class="dash-card"><span>باقي دقائق</span><br><span id="rem-mins" class="dash-val">60</span></div>
        <div class="dash-card" onclick="location.reload()"><span>تحديث</span><br><span class="dash-val">🔄</span></div>
    </div>

    <div class="actions">
        <button id="main-punch-btn" class="btn-main" style="background:var(--green)" onclick="handlePunch()">تسجيل بصمة الآن 📲</button>
        <button class="btn-manual" onclick="openManualModal()">تسجيل يدوي / غياب / تصريح ✍️</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead><tr><th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>حذف</th></tr></thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>
</div>

<div id="manualModal" class="modal-overlay">
    <div class="modal-box">
        <h3>تسجيل يدوي</h3>
        <input type="date" id="m-date" class="info-input">
        <select id="m-type" class="info-input">
            <option value="منتظم">منتظم</option>
            <option value="تأخير">تأخير</option>
            <option value="تصريح">تصريح</option>
            <option value="غياب">غياب</option>
        </select>
        <input type="number" id="m-late" class="info-input" placeholder="دقائق التأخير" value="0">
        <button class="btn-main" style="background:var(--turquoise); margin-top:10px;" onclick="submitManual()">حفظ ✅</button>
        <button class="btn-main" style="background:#eee; color:#666; margin-top:5px;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<div id="registerModal" class="modal-overlay">
    <div class="modal-box">
        <h3>تسجيل موظف جديد</h3>
        <input type="text" id="reg-name" class="info-input" placeholder="الاسم الرباعي">
        <input type="text" id="reg-id" class="info-input" placeholder="الكود الوظيفي">
        <button class="btn-main" style="background:var(--green); margin-top:10px;" onclick="submitNewEmployee()">إنشاء حساب ✅</button>
        <button class="btn-main" style="background:#eee; color:#666; margin-top:5px;" onclick="closeRegisterModal()">إلغاء</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD1MQAAZi8iucZzOrgLG9Fm8_U3_Z6V8m8",
        authDomain: "farah-8e557.firebaseapp.com",
        projectId: "farah-8e557",
        storageBucket: "farah-8e557.appspot.com",
        messagingSenderId: "927493982518",
        appId: "1:927493982518:web:9f6874b693df0bd02f8b97"
    };

    const app = initializeApp(firebaseConfig);
    const fs = getFirestore(app);

    window.submitNewEmployee = async function() {
        const name = document.getElementById('reg-name').value;
        const id = document.getElementById('reg-id').value;
        if(!name || !id) return alert("اكمل البيانات");
        await setDoc(doc(fs, "employees", id), { name, baseReg: 30, baseEmg: 7, logs: [] });
        alert("تم التسجيل!");
        closeRegisterModal();
    };

    window.loadFromCloud = async function() {
        const id = document.getElementById('u-id').value.trim();
        if (!id) return;
        const docSnap = await getDoc(doc(fs, "employees", id));
        if (docSnap.exists()) {
            const data = docSnap.data();
            localStorage.setItem('u_i', id);
            localStorage.setItem('u_n', data.name);
            localStorage.setItem('t_db', JSON.stringify(data.logs || []));
            localStorage.setItem('u_base_reg', data.baseReg || 30);
            localStorage.setItem('u_base_emg', data.baseEmg || 7);
            location.reload();
        } else { alert("الكود غير موجود"); }
    };

    window.syncToCloud = async function() {
        const id = localStorage.getItem('u_i');
        if (!id) return;
        document.getElementById('sync-loader').style.display = 'inline';
        await setDoc(doc(fs, "employees", id), {
            logs: JSON.parse(localStorage.getItem('t_db')) || [],
            baseReg: parseInt(localStorage.getItem('u_base_reg')),
            baseEmg: parseInt(localStorage.getItem('u_base_emg'))
        }, { merge: true });
        setTimeout(() => document.getElementById('sync-loader').style.display = 'none', 1000);
    };
</script>

<script>
    // قائمة الأعياد الرسمية + رمضان (تقريبي لعام 2026)
    const holidays = [
        { name: "عيد الميلاد المجيد", date: "2026-01-07" },
        { name: "ثورة 25 يناير", date: "2026-01-25" },
        { name: "شهر رمضان المبارك 🌙", date: "2026-02-18" }, // تقريبي 2026
        { name: "عيد الفطر المبارك", date: "2026-03-20" }, // تقريبي
        { name: "عيد تحرير سيناء", date: "2026-04-25" },
        { name: "عيد العمال", date: "2026-05-01" },
        { name: "عيد الأضحى المبارك", date: "2026-05-27" }, // تقريبي
        { name: "ثورة 30 يونيو", date: "2026-06-30" },
        { name: "عيد ثورة 23 يوليو", date: "2026-07-23" },
        { name: "نصر أكتوبر", date: "2026-10-06" }
    ];

    function updateCountdown() {
        const now = new Date();
        const holidayNowDiv = document.getElementById('holiday-now');
        let nextHoliday = null;
        let minDiff = Infinity;

        holidays.forEach(h => {
            const hDate = new Date(h.date);
            const diff = hDate - now;

            // إذا كان اليوم هو العيد
            if (now.toDateString() === hDate.toDateString()) {
                holidayNowDiv.innerText = `اليوم: ${h.name} 🎉`;
                holidayNowDiv.style.display = 'block';
            }

            if (diff > 0 && diff < minDiff) {
                minDiff = diff;
                nextHoliday = h;
            }
        });

        if (nextHoliday) {
            const days = Math.floor(minDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((minDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('countdown-display').innerText = 
                `متبقي على ${nextHoliday.name}: ${days} يوم و ${hours} ساعة`;
        }
    }

    function updateTime() {
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'م' : 'ص';
        hours = hours % 12 || 12;
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const seconds = now.getSeconds().toString().padStart(2, '0');
        
        document.getElementById('digital-clock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        document.getElementById('date-text').innerText = `${now.getDate()} / ${now.getMonth()+1} / ${now.getFullYear()}`;
        updateCountdown();
    }

    let db = JSON.parse(localStorage.getItem('t_db')) || [];
    let baseReg = parseInt(localStorage.getItem('u_base_reg')) || 0;
    let baseEmg = parseInt(localStorage.getItem('u_base_emg')) || 0;

    function init() {
        const id = localStorage.getItem('u_i');
        const name = localStorage.getItem('u_n');
        if(id) {
            document.getElementById('u-id').value = id;
            document.getElementById('welcome-msg').innerText = "الموظف: " + name;
        }
        setInterval(updateTime, 1000);
        render();
    }

    function render() {
        const body = document.getElementById('log-body');
        body.innerHTML = '';
        let lateSum = 0, pUsed = 0;
        db.forEach((e, index) => {
            if(e.type==='تأخير') lateSum += parseInt(e.late || 0);
            if(e.type==='تصريح') pUsed++;
            let colorClass = e.type === "تأخير" ? "bg-late" : e.type === "تصريح" ? "bg-permit" : e.type === "غياب" ? "bg-absent" : "bg-regular";
            body.innerHTML += `<tr><td>${e.dDate}</td><td>${e.time}</td><td><span class="badge ${colorClass}">${e.type}</span></td><td><button onclick="deleteRow(${index})" style="background:none; border:none; color:red; cursor:pointer;">🗑️</button></td></tr>`;
        });
        document.getElementById('sum-late').innerText = lateSum;
        document.getElementById('rem-mins').innerText = Math.max(0, 60 - lateSum);
        document.getElementById('reg-left').innerText = baseReg;
        document.getElementById('emg-left').innerText = baseEmg;
        document.getElementById('permits-count').innerText = `${pUsed}/3`;
    }

    async function handlePunch() {
        if(!localStorage.getItem('u_i')) return alert("ادخل الكود أولاً");
        const now = new Date();
        let hours = now.getHours();
        const ampm = hours >= 12 ? 'م' : 'ص';
        const item = { dDate: `${now.getDate()}/${now.getMonth()+1}`, time: `${hours % 12 || 12}:${now.getMinutes().toString().padStart(2, '0')} ${ampm}`, type: "منتظم", late: 0 };
        db.unshift(item); localStorage.setItem('t_db', JSON.stringify(db));
        render(); if(window.syncToCloud) await window.syncToCloud();
    }

    function submitManual() {
        const date = document.getElementById('m-date').value;
        if(!date) return alert("اختر التاريخ");
        const dObj = new Date(date);
        db.unshift({ dDate: `${dObj.getDate()}/${dObj.getMonth()+1}`, time: "--:--", type: document.getElementById('m-type').value, late: document.getElementById('m-late').value });
        localStorage.setItem('t_db', JSON.stringify(db)); closeModal(); render();
        if(window.syncToCloud) window.syncToCloud();
    }
    function deleteRow(index) { if(confirm("حذف؟")) { db.splice(index, 1); localStorage.setItem('t_db', JSON.stringify(db)); render(); if(window.syncToCloud) window.syncToCloud(); } }
    function openManualModal() { document.getElementById('manualModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('manualModal').style.display = 'none'; }
    function openRegisterModal() { document.getElementById('registerModal').style.display = 'flex'; }
    function closeRegisterModal() { document.getElementById('registerModal').style.display = 'none'; }
    function editBalance(type) {
        let newVal = prompt("تعديل الرصيد:", type==='reg' ? baseReg : baseEmg);
        if(newVal) { localStorage.setItem(type==='reg'?'u_base_reg':'u_base_emg', newVal); location.reload(); }
    }
</script>
</body>
</html>
