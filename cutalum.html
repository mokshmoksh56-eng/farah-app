<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برنامج تقطيع أعواد الألومنيوم - سحابي ☁️</title>
    <style>
        /* إعدادات عامة */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 15px 10px;
        }
        
        /* شاشة التحميل الأمنية من التطبيق السحابي */
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #e9ecef;
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: #2c3e50; font-weight: bold; text-align: center; padding: 20px;
        }

        /* رسالة التنبيه Toast */
        #toast { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); 
            background: #27ae60; color: white; padding: 12px 25px; border-radius: 30px; 
            display: none; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
            text-align: center; width: max-content; font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 24px;
        }

        #sync-status { 
            font-size: 12px; background: #2c3e50; padding: 5px 10px; 
            border-radius: 20px; color: #fff; font-weight: bold; 
        }
        
        .settings-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        label { margin-bottom: 5px; font-weight: bold; font-size: 15px; }
        input[type="number"], input[type="text"] {
            padding: 12px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
        }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 10px 5px; text-align: right; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; font-size: 14px; }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .btn-add { background-color: #27ae60; color: white; }
        .btn-add:hover { background-color: #219653; }
        .btn-calc { background-color: #2980b9; color: white; font-size: 18px; padding: 15px; margin-bottom: 10px; }
        .btn-calc:hover { background-color: #2471a3; }
        .btn-print { background-color: #8e44ad; color: white; font-size: 18px; padding: 15px; display: none; }
        .btn-print:hover { background-color: #732d91; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 8px; font-size: 14px; width: 100%; }
        .btn-delete:hover { background-color: #c0392b; }
        
        /* تنسيقات الأرشيف والحفظ */
        .header-actions { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap;}
        .btn-archive-toggle { background-color: #f39c12; color: white; margin: 0; flex: 1; min-width: 200px;}
        .btn-archive-toggle:hover { background-color: #e67e22; }
        .archive-container {
            background: #fff3cd;
            border: 2px solid #ffeeba;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }
        .archive-list { max-height: 250px; overflow-y: auto; margin-top: 10px; }
        .archive-item {
            background: white;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ffeeba;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .archive-info strong { color: #d35400; font-size: 16px; }
        .archive-info span { color: #7f8c8d; font-size: 12px; display: block; }
        .archive-actions { display: flex; gap: 5px; flex: 1; min-width: 150px; }
        .btn-load { background-color: #27ae60; color: white; padding: 8px; margin: 0; font-size: 14px; }
        .btn-del-arch { background-color: #c0392b; color: white; padding: 8px; margin: 0; font-size: 14px; }
        
        .save-section {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed #2980b9;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .save-section input { margin: 0; flex: 2; min-width: 200px; }
        .btn-save { background-color: #2980b9; color: white; margin: 0; flex: 1; min-width: 100px; }
        .btn-new { background-color: #7f8c8d; color: white; margin: 0; flex: 0.5; min-width: 100px; }

        /* النتائج */
        #results { margin-top: 30px; }
        .bar-result { background: #ecf0f1; padding: 15px; margin-bottom: 20px; border-right: 5px solid #2980b9; border-radius: 4px; }
        .bar-title { font-weight: bold; font-size: 16px; margin-bottom: 15px; color: #2c3e50; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .bar-visual { display: flex; height: 45px; width: 100%; background-color: #bdc3c7; border-radius: 4px; overflow: hidden; border: 1px solid #95a5a6; margin-bottom: 15px; }
        .cut-visual { background-color: #3498db; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; border-left: 1px solid rgba(255,255,255,0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .saw-visual { background-color: #2c3e50; height: 100%; }
        .waste-visual { background-color: #e74c3c; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .cut-pieces { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .piece { background: #fff; border: 1px solid #bdc3c7; padding: 12px 10px; border-radius: 4px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .num-bold { font-weight: 900; font-size: 16px; }
        .piece-index { display: inline-block; background-color: #7f8c8d; color: white; width: 24px; height: 24px; text-align: center; line-height: 24px; border-radius: 50%; margin-left: 8px; font-size: 13px; font-weight: bold; }
        .waste { background: #fadbd8; color: #c0392b; border-color: #e74c3c; }
        .waste-icon { background-color: #e74c3c; }

        .summary-box { background: #e8f8f5; border: 2px dashed #1abc9c; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .summary-box h3 { margin-top: 0; color: #16a085; text-align: center; }
        .summary-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #bdc3c7; font-weight: bold; font-size: 16px; }

        @media print {
            body { background: #fff; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .settings-group, #piecesTable, .btn-add, .btn-calc, .btn-print, h3, .btn-delete, .save-section, .header-actions, .archive-container, .sync-status-container {
                display: none !important;
            }
            .bar-visual { border: 1px solid #000; }
        }
    </style>
</head>
<body>

<div id="auth-loader">⏳ جاري فحص حساب المشتري والمزامنة السحابية آمنياً...</div>

<div class="container" id="app-screen" style="display:none;">
    
    <div style="text-align: center; margin-bottom: 15px;" class="sync-status-container">
        <h1>برنامج تقطيع أعواد الألومنيوم</h1>
        <span id="sync-status">🔄 جاري المزامنة...</span>
    </div>

    <div class="header-actions">
        <button class="btn-archive-toggle" onclick="toggleArchive()">🗂️ فتح / إغلاق الأرشيف السحابي</button>
    </div>

    <div class="archive-container" id="archiveContainer">
        <h3 style="margin-top:0; color:#d35400;">☁️ المشاريع المحفوظة سحابياً</h3>
        <div class="archive-list" id="archiveList">
            <!-- سيتم إضافة المشاريع هنا برمجياً من السحابة -->
        </div>
    </div>

    <div class="settings-group">
        <div class="input-group">
            <label for="barLength">طول العود (سم):</label>
            <input type="number" id="barLength" value="600" step="1" min="1">
        </div>
        <div class="input-group">
            <label for="sawThickness">سمك المنشار (سم):</label>
            <input type="number" id="sawThickness" value="0.4" step="0.1" min="0">
        </div>
    </div>

    <h3>القطع المطلوبة:</h3>
    <table id="piecesTable">
        <thead>
            <tr>
                <th>طول القطعة</th>
                <th>العدد</th>
                <th style="width: 60px;">إجراء</th>
            </tr>
        </thead>
        <tbody id="piecesBody">
            <tr>
                <td><input type="number" class="piece-length" step="0.1" min="1"></td>
                <td><input type="number" class="piece-qty" step="1" min="1"></td>
                <td><button class="btn-delete" onclick="deleteRow(this)">حذف</button></td>
            </tr>
        </tbody>
    </table>

    <button class="btn-add" onclick="addRow()">+ إضافة مقاس جديد</button>
    
    <div class="save-section">
        <input type="hidden" id="currentProjectId" value="">
        <input type="text" id="projectName" placeholder="اسم المشروع (مثال: مطبخ أ. محمد)">
        <button class="btn-save" onclick="saveProject()">☁️ حفظ ومزامنة</button>
        <button class="btn-new" onclick="startNewProject()">🆕 مشروع جديد</button>
    </div>

    <button class="btn-calc" onclick="calculate()">احسب التقطيع وارسم العود</button>
    <button class="btn-print" id="printBtn" onclick="window.print()">🖨️ طباعة التقرير</button>

    <div id="results"></div>
</div>

<div id="toast">✅ تم الحفظ والمزامنة سحابياً</div>

<!-- تحويل الأكواد إلى Module لتعمل مع Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    const app = initializeApp(firebaseConfig);
    const fdb = getDatabase(app);
    const auth = getAuth(app);
    
    let projectsData = {};
    let windowUserUid = null;
    let projectsRef = null;

    // دالة إظهار التنبيه (Toast)
    window.showToast = function(message) {
        const t = document.getElementById('toast');
        t.innerText = message;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2500);
    };

    // 🔒 قفل الغرفة البرمجية بالـ Modules وبدء المزامنة
    onAuthStateChanged(auth, user => {
        if (user) {
            windowUserUid = user.uid;
            document.getElementById('auth-loader').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            
            // تخصيص مسار خاص بتقطيع أعواد الألومنيوم للعميل
            projectsRef = ref(fdb, 'backups/alum_cut_archives/' + windowUserUid);
            
            document.getElementById('sync-status').innerText = "⚡ جاري المزامنة...";
            
            // مراقبة التغييرات الحية
            onValue(projectsRef, (snapshot) => {
                projectsData = snapshot.val() || {};
                window.loadArchiveList(); // تحديث قائمة الأرشيف تلقائياً
                document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
            });
        } else {
            document.getElementById('auth-loader').innerText = "⚠️ حظر أمني: يرجى تسجيل الدخول من اللوحة الرئيسية أولاً!";
        }
    });

    window.toggleArchive = function() {
        const archiveDiv = document.getElementById('archiveContainer');
        if(archiveDiv.style.display === 'none' || archiveDiv.style.display === '') {
            archiveDiv.style.display = 'block';
            window.loadArchiveList();
        } else {
            archiveDiv.style.display = 'none';
        }
    };

    // --- دوال الحفظ والمزامنة السحابية ---
    window.saveProject = function() {
        if(!windowUserUid) return;
        const projectName = document.getElementById('projectName').value.trim();
        if(!projectName) {
            alert('يرجى إدخال اسم المشروع أولاً لحفظه!');
            return;
        }

        const barLength = document.getElementById('barLength').value;
        const sawThickness = document.getElementById('sawThickness').value;
        const currentId = document.getElementById('currentProjectId').value;
        
        let piecesData = [];
        const lengths = document.getElementsByClassName('piece-length');
        const quantities = document.getElementsByClassName('piece-qty');

        for (let i = 0; i < lengths.length; i++) {
            const len = parseFloat(lengths[i].value);
            const qty = parseInt(quantities[i].value);
            if (len && qty) {
                piecesData.push({ len: len, qty: qty });
            }
        }

        if(piecesData.length === 0) {
            alert('لا توجد مقاسات صحيحة لحفظها!');
            return;
        }

        const projectPayload = {
            name: projectName,
            date: new Date().toLocaleDateString('ar-EG'),
            timestamp: Date.now(), // للترتيب
            barLength: barLength,
            sawThickness: sawThickness,
            pieces: piecesData
        };

        document.getElementById('sync-status').innerText = "⚡ جاري الحفظ سحابياً...";

        if (currentId) {
            // تحديث المشروع الحالي في السحابة
            const itemRef = ref(fdb, 'backups/alum_cut_archives/' + windowUserUid + '/' + currentId);
            update(itemRef, projectPayload).then(() => {
                document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
                window.showToast("🔄 تم تحديث المشروع والمزامنة سحابياً");
            }).catch(err => {
                document.getElementById('sync-status').innerText = "⚠️ خطأ في المزامنة";
            });
        } else {
            // حفظ كمشروع جديد في السحابة
            push(projectsRef, projectPayload).then((newRef) => {
                document.getElementById('currentProjectId').value = newRef.key; // ربط الـ ID السحابي
                document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
                window.showToast("✅ تم حفظ المشروع السحابي بنجاح");
            }).catch(err => {
                document.getElementById('sync-status').innerText = "⚠️ خطأ في المزامنة";
            });
        }
    };

    window.startNewProject = function() {
        if(confirm('هل تريد مسح البيانات الحالية للبدء في مشروع جديد؟')) {
            document.getElementById('currentProjectId').value = '';
            document.getElementById('projectName').value = '';
            document.getElementById('barLength').value = 600;
            document.getElementById('sawThickness').value = 0.4;
            
            const tbody = document.getElementById('piecesBody');
            tbody.innerHTML = `
                <tr>
                    <td><input type="number" class="piece-length" step="0.1" min="1"></td>
                    <td><input type="number" class="piece-qty" step="1" min="1"></td>
                    <td><button class="btn-delete" onclick="window.deleteRow(this)">حذف</button></td>
                </tr>
            `;
            
            document.getElementById('results').innerHTML = '';
            document.getElementById('printBtn').style.display = 'none';
        }
    };

    window.loadArchiveList = function() {
        const archiveList = document.getElementById('archiveList');
        const keys = Object.keys(projectsData);
        
        if(keys.length === 0) {
            archiveList.innerHTML = '<p style="text-align:center; color:#7f8c8d;">لا توجد مشاريع محفوظة سحابياً حالياً.</p>';
            return;
        }

        // تحويل الكائن إلى مصفوفة وترتيبه بالأحدث
        const archives = keys.map(k => ({ id: k, ...projectsData[k] }));
        archives.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

        let html = '';
        archives.forEach(proj => {
            const pCount = proj.pieces ? proj.pieces.length : 0;
            html += `
                <div class="archive-item">
                    <div class="archive-info">
                        <strong>${proj.name}</strong>
                        <span>📅 ${proj.date} | ✂️ ${pCount} مقاسات</span>
                    </div>
                    <div class="archive-actions">
                        <button class="btn-load" onclick="window.loadProject('${proj.id}')">📂 استرجاع للتعديل</button>
                        <button class="btn-del-arch" onclick="window.deleteArchivedProject('${proj.id}')">🗑️ حذف</button>
                    </div>
                </div>
            `;
        });
        archiveList.innerHTML = html;
    };

    window.loadProject = function(id) {
        if(!confirm('استرجاع المشروع سيمسح المقاسات المكتوبة حالياً بالجدول. هل أنت متأكد؟')) return;

        let proj = projectsData[id];
        if(proj) {
            document.getElementById('currentProjectId').value = id;
            document.getElementById('projectName').value = proj.name;
            document.getElementById('barLength').value = proj.barLength || 600;
            document.getElementById('sawThickness').value = proj.sawThickness || 0.4;
            
            const tbody = document.getElementById('piecesBody');
            tbody.innerHTML = ''; 

            const piecesToLoad = proj.pieces || [];
            piecesToLoad.forEach(p => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="number" class="piece-length" step="0.1" min="1" value="${p.len}"></td>
                    <td><input type="number" class="piece-qty" step="1" min="1" value="${p.qty}"></td>
                    <td><button class="btn-delete" onclick="window.deleteRow(this)">حذف</button></td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('archiveContainer').style.display = 'none';
            window.calculate(); 
        }
    };

    window.deleteArchivedProject = function(id) {
        if(!windowUserUid) return;
        if(!confirm('هل أنت متأكد من حذف هذا المشروع من السحابة نهائياً؟')) return;
        
        document.getElementById('sync-status').innerText = "⚡ جاري الحذف...";
        const itemRef = ref(fdb, 'backups/alum_cut_archives/' + windowUserUid + '/' + id);
        
        remove(itemRef).then(() => {
            if(document.getElementById('currentProjectId').value === id) {
                document.getElementById('currentProjectId').value = '';
                document.getElementById('projectName').value = '';
            }
            document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
            window.showToast("🗑️ تم الحذف من قاعدة البيانات السحابية");
        }).catch(err => {
            document.getElementById('sync-status').innerText = "⚠️ خطأ في المزامنة";
        });
    };

    // --- دوال الحساب والواجهة الأصلية ---
    window.addRow = function() {
        const tbody = document.getElementById('piecesBody');
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="number" class="piece-length" step="0.1" min="1"></td>
            <td><input type="number" class="piece-qty" step="1" min="1"></td>
            <td><button class="btn-delete" onclick="window.deleteRow(this)">حذف</button></td>
        `;
        tbody.appendChild(row);
    };

    window.deleteRow = function(btn) {
        const row = btn.parentNode.parentNode;
        if (document.getElementById('piecesBody').children.length > 1) {
            row.parentNode.removeChild(row);
        } else {
            alert('يجب أن يكون هناك مقاس واحد على الأقل.');
        }
    };

    window.calculate = function() {
        const barLength = parseFloat(document.getElementById('barLength').value);
        const sawThickness = parseFloat(document.getElementById('sawThickness').value);
        
        if (!barLength || barLength <= 0) {
            alert('يرجى إدخال طول عود صحيح.');
            return;
        }

        const lengths = document.getElementsByClassName('piece-length');
        const quantities = document.getElementsByClassName('piece-qty');
        let allPieces = [];
        let totalPiecesCount = {}; 

        for (let i = 0; i < lengths.length; i++) {
            const len = parseFloat(lengths[i].value);
            const qty = parseInt(quantities[i].value);
            
            if (len && qty) {
                if (len > barLength) {
                    alert(`يوجد مقاس (${len} سم) أكبر من طول العود (${barLength} سم)!`);
                    return;
                }
                totalPiecesCount[len] = (totalPiecesCount[len] || 0) + qty;
                for (let j = 0; j < qty; j++) {
                    allPieces.push(len);
                }
            }
        }

        if (allPieces.length === 0) {
            alert('يرجى إدخال مقاسات وأعداد صحيحة.');
            return;
        }

        allPieces.sort((a, b) => b - a);
        let bars = [];

        for (let piece of allPieces) {
            let placed = false;
            for (let bar of bars) {
                if (bar.remaining >= piece) {
                    bar.cuts.push(piece);
                    bar.remaining -= (piece + sawThickness);
                    placed = true;
                    break;
                }
            }
            if (!placed) {
                bars.push({
                    total: barLength,
                    remaining: barLength - piece - sawThickness,
                    cuts: [piece]
                });
            }
        }

        window.displayResults(bars, barLength, sawThickness, totalPiecesCount);
    };

    window.displayResults = function(bars, barLength, sawThickness, totalPiecesCount) {
        const resultsDiv = document.getElementById('results');
        const printBtn = document.getElementById('printBtn');
        const projName = document.getElementById('projectName').value.trim();
        
        let headerTitle = projName ? `المشروع: ${projName}` : 'نتائج التقطيع';
        
        resultsDiv.innerHTML = `
            <div style="text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 10px; margin-bottom:20px;">
                <h3 style="color: #2c3e50; margin:0;">${headerTitle}</h3>
                <h2 style="color: #27ae60; margin-top:5px;">إجمالي الأعواد المطلوبة: <span class="num-bold">${bars.length}</span> عود</h2>
            </div>
        `;
        
        let totalWaste = 0;

        bars.forEach((bar, index) => {
            let finalRemaining = bar.remaining + sawThickness;
            finalRemaining = parseFloat(Math.max(0, finalRemaining).toFixed(2));
            totalWaste += finalRemaining;

            let barHTML = `
                <div class="bar-result">
                    <div class="bar-title">
                        <span>العود رقم <span class="num-bold">${index + 1}</span></span>
                        <span style="color: #e74c3c;">فضلات: <span class="num-bold">${finalRemaining}</span> سم</span>
                    </div>
            `;
            
            let visualHTML = `<div class="bar-visual">`;
            bar.cuts.forEach((cut, i) => {
                let cutPct = (cut / barLength) * 100;
                visualHTML += `<div class="cut-visual" style="width: ${cutPct}%">${cut}</div>`;
                if (i < bar.cuts.length - 1 || finalRemaining > 0) {
                    let sawPct = (sawThickness / barLength) * 100;
                    visualHTML += `<div class="saw-visual" style="width: ${sawPct}%"></div>`;
                }
            });
            if(finalRemaining > 0) {
                let wastePct = (finalRemaining / barLength) * 100;
                visualHTML += `<div class="waste-visual" style="width: ${wastePct}%">${finalRemaining > 15 ? finalRemaining : ''}</div>`;
            }
            visualHTML += `</div>`;
            barHTML += visualHTML;
            
            let cutCounts = {};
            let uniqueCuts = []; 
            bar.cuts.forEach(cut => {
                if (!cutCounts[cut]) {
                    cutCounts[cut] = 0;
                    uniqueCuts.push(cut);
                }
                cutCounts[cut]++;
            });

            barHTML += `<div class="cut-pieces">`;
            let pieceIndex = 1;
            uniqueCuts.forEach(cutSize => {
                barHTML += `
                    <div class="piece">
                        <span><span class="piece-index">${pieceIndex}</span> مقاس <span class="num-bold">${cutSize}</span> سم</span>
                        <span style="color: #2980b9;">&times; <span class="num-bold">${cutCounts[cutSize]}</span></span>
                    </div>
                `;
                pieceIndex++;
            });
            if(finalRemaining > 0) {
                barHTML += `<div class="piece waste">
                    <span><span class="piece-index waste-icon">!</span> فضلات</span>
                    <span class="num-bold">${finalRemaining} سم</span>
                </div>`;
            }
            barHTML += `</div></div>`;
            resultsDiv.innerHTML += barHTML;
        });

        resultsDiv.innerHTML += `<h3 style="text-align: center; color: #c0392b; background: #fadbd8; padding: 15px; border-radius: 4px; font-size: 16px;">إجمالي الفضلات (الهدر): <span class="num-bold">${totalWaste.toFixed(2)}</span> سم</h3>`;

        let summaryHTML = `<div class="summary-box"><h3>📋 خلاصة التقطيع</h3>`;
        let sortedSizes = Object.keys(totalPiecesCount).sort((a,b) => b - a);
        sortedSizes.forEach(size => {
            summaryHTML += `
                <div class="summary-item">
                    <span>إجمالي قطع مقاس <span class="num-bold">${size}</span> سم</span>
                    <span style="color:#2980b9">= <span class="num-bold">${totalPiecesCount[size]}</span> قطعة</span>
                </div>
            `;
        });
        summaryHTML += `</div>`;
        resultsDiv.innerHTML += summaryHTML;

        printBtn.style.display = 'block';
    };

</script>

</body>
</html>
