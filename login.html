<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دخول نظام أزيماء</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; padding: 10px; box-sizing: border-box; }
        .login-box { background: #1e293b; padding: 50px 35px; border-radius: 28px; box-shadow: 0 20px 45px rgba(0,0,0,0.5); text-align: center; border: 3px solid #6e8efb; width: 100%; max-width: 440px; box-sizing: border-box; }
        h2 { font-size: 2.6rem; margin-top: 0; margin-bottom: 15px; letter-spacing: 1px; }
        p { font-size: 1.3rem; opacity: 0.95; margin-bottom: 35px; }
        input { padding: 22px; width: 100%; border-radius: 18px; border: 3px solid transparent; margin-bottom: 30px; font-size: 36px; text-align: center; letter-spacing: 12px; -webkit-text-security: disc; background: #2d3d52; color: white; box-sizing: border-box; outline: none; transition: 0.2s; font-weight: bold; }
        input:focus { border-color: #6e8efb; background: #33465e; }
        button { background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; border: none; padding: 22px; border-radius: 18px; cursor: pointer; font-weight: 800; font-size: 1.4rem; width: 100%; box-shadow: 0 8px 20px rgba(110, 142, 251, 0.4); transition: 0.2s; }
        #msg { color: #ff7675; margin-top: 25px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>🚀 azemaa pro</h2>
    <p>أدخل الرقم السري للمتابعة</p>
    <input type="text" id="passCode" placeholder="••••" maxlength="4" inputmode="numeric" pattern="[0-9]*">
    <button onclick="verify()">دخول النظام</button>
    <div id="msg"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // تصفير التاريخ لمنع "الخروج المزدوج" عند الرجوع من صفحة index
    window.history.pushState(null, null, window.location.href);
    window.onpopstate = function() {
        window.history.pushState(null, null, window.location.href);
    };

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const passInput = document.getElementById('passCode');

    passInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^-0-9]/g, '');
    });

    window.verify = async function() {
        const input = passInput.value;
        const msg = document.getElementById('msg');
        if(input.length === 0) { msg.innerText = "يرجى إدخال الرقم أولاً"; return; }

        try {
            const snapshot = await get(ref(db, 'passcode'));
            if (snapshot.exists()) {
                if (input == snapshot.val()) {
                    sessionStorage.setItem("isAllowed", "true");
                    // استخدام replace لمنع صفحة login من العودة في الـ History
                    window.location.replace("index.html");
                } else {
                    msg.innerText = "الرقم السري خطأ!";
                }
            }
        } catch (e) { msg.innerText = "خطأ في الاتصال بالخادم"; }
    }
</script>
</body>
</html>
