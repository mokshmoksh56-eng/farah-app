<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الشامل لإدارة عقود الورشة</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-dark: #0f172a;
            --bg-light: #f8fafc;
            --text-main: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* تنسيق شريط التنقل العلوي */
        .top-navbar {
            background-color: var(--primary-dark);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .sys-title {
            color: var(--text-main);
            font-size: 20px;
            font-weight: bold;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background-color: transparent;
            color: #cbd5e1;
            border: 2px solid transparent;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        /* زر القسم النشط */
        .nav-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.3);
        }

        /* حاوية عرض العقود */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: #f1f5f9;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* إخفاء شريط التنقل عند الطباعة */
        @media print {
            .top-navbar {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="top-navbar">
        <h1 class="sys-title">⚙️ لوحة إدارة العقود والتوريدات</h1>
        <div class="nav-buttons">
            <button id="btn-kitchen" class="nav-btn active" onclick="loadContract('fatorakitchen.html', 'btn-kitchen')">
                🍳 عقد المطابخ
            </button>
            <button id="btn-windows" class="nav-btn" onclick="loadContract('fatorawindoes.html', 'btn-windows')">
                🪟 عقد الشبابيك والأبواب
            </button>
        </div>
    </div>

    <div class="iframe-container">
        <iframe id="main-frame" src="fatorakitchen.html" title="نافذة العقد"></iframe>
    </div>

    <script>
        // دالة لتغيير العقد المعروض وتحديث شكل الزر النشط
        function loadContract(fileName, buttonId) {
            // تغيير مسار الملف في الـ iframe
            document.getElementById('main-frame').src = fileName;

            // إزالة التفعيل من كل الأزرار
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // إضافة التفعيل للزر المختار
            document.getElementById(buttonId).classList.add('active');
        }
    </script>

</body>
</html>
