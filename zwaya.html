<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - الإصدار الذكي التفاعلي</title>
    <style>
        :root {
            --bg-main: #f0f4f8; 
            --panel-bg: #ffffff; 
            --primary: #0f766e; 
            --primary-light: #14b8a6;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --highlight: #ea580c; 
            --auto-color: #d97706; 
            --diag-color: #7c3aed; 
            
            --border-radius: 16px;
            --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main);
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 17px; color: var(--text-dark); font-weight: bold; text-align: center; padding: 20px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
            background: #fff;
            padding: 12px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }

        .input-project-name { 
            flex: 2; 
            min-width: 200px; 
            padding: 10px; 
            border: 2px solid var(--primary); 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            text-align: right; 
        }

        .btn-save-archive { 
            flex: 1; 
            min-width: 100px; 
            background-color: var(--primary); 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px;
        }
        
        .btn-open-archive { 
            flex: 1; 
            min-width: 100px; 
            background-color: #8b5cf6; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 15px;
        }
        
        .btn-save-archive:active, .btn-open-archive:active { transform: scale(0.98); }

        #syncStatus { 
            width: 100%;
            text-align: center; 
            font-size: 13px; 
            color: var(--primary); 
            font-weight: bold; 
            margin-top: 5px;
            height: 15px; 
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 5px;
        }

        .header h2 {
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }

        /* حاوية اللوحة التفاعلية */
        .interactive-canvas-wrapper {
            position: relative; 
            width: 100%;
            background-color: #ffffff;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            margin-top: 10px;
        }

        canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        /* تصميم مربعات الإدخال العائمة فوق الرسمة */
        .floating-input-container {
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            pointer-events: none; 
        }

        .floating-input-container input {
            pointer-events: auto;
            width: 80px;
            padding: 6px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            color: #000;
            background-color: #ffffff;
            font-size: 1.1rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .floating-input-container input:focus {
            outline: none;
            border-color: var(--highlight);
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.25);
            background-color: #fff;
            width: 90px;
        }

        /* تمييز إدخال الوتر */
        .floating-input-container input.diag-input {
            border-color: var(--diag-color);
        }
        .floating-input-container input.diag-input:focus {
            border-color: var(--highlight);
        }

        /* كارت التحكم السفلي */
        .angles-card {
            background-color: var(--panel-bg);
            border-radius: var(--border-radius);
            padding: 15px 20px;
            margin-top: 20px;
            box-shadow: var(--shadow-md);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-row label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-dark);
        }

        .input-row .control-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-row input[type="number"] {
            width: 65px;
            padding: 6px;
            background-color: var(--bg-main);
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            text-align: center;
            font-weight: bold;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* تنسيقات نافذة الأرشيف */
        #archiveModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100000; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; }
        .archive-content { background: #fff; width: 100%; max-width: 600px; padding: 20px; border-radius: 16px; max-height: 85vh; overflow-y: auto; direction: rtl; }
        .archive-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .archive-header h2 { margin: 0; color: var(--primary); font-size: 20px; font-weight: bold; }
        .close-modal { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        #searchArchive { width: 100%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 15px; font-size: 15px; font-weight: bold; box-sizing: border-box; }
        .archive-item { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 12px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .archive-item-info { flex: 1; min-width: 150px; }
        .archive-item-info strong { color: var(--primary); display: block; font-size: 16px; margin-bottom: 4px; font-weight: bold; }
        .archive-item-info span { color: var(--text-muted); font-size: 13px; font-weight: bold; }
        .archive-item-actions { display: flex; gap: 5px; }
        .archive-item-actions button { padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-load { background: #10b981; }
        .btn-delete { background: #e74c3c; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.currentUid = null;
        window.fbDB = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbGet = get;
        window.fbPush = push;
        window.fbRemove = remove;
        window.fbOnValue = onValue;
        
        window.allZwayaArchive = {};

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUid = user.uid;
                document.getElementById('auth-loader').style.display = 'none';
                window.loadZwayaData();
            } else {
                document.getElementById('auth-loader').innerText = "⚠️ حظر أمني: يرجى تسجيل الدخول من اللوحة الرئيسية أولاً!";
            }
        });
    </script>
</head>
<body>

    <div id="auth-loader">⏳ جاري تحميل ومزامنة أبعاد الغرفة والزوايا السحابية...</div>

    <div class="app-container">
        
        <div class="header">
            <h2>Azemaa Pro</h2>
        </div>

        <div class="header-controls">
            <input type="text" id="projectName" class="input-project-name" placeholder="اسم الزبون (مثال: محمد أحمد)">
            <button class="btn-save-archive" onclick="saveToZwayaArchive()">💾 حفظ للأرشيف</button>
            <button class="btn-open-archive" onclick="openZwayaArchive()">📂 الأرشيف</button>
            <div id="syncStatus">جاري الاتصال بالسحابة...</div>
        </div>

        <div class="interactive-canvas-wrapper" id="canvasWrapper">
            <canvas id="layoutCanvas" width="850" height="550"></canvas>

            <div id="inputContainerA" class="floating-input-container"><input type="number" id="wA" value="150" title="الجدار A"></div>
            <div id="inputContainerB" class="floating-input-container"><input type="number" id="wB" value="200" title="الجدار B"></div>
            <div id="inputContainerC" class="floating-input-container"><input type="number" id="wC" value="100" title="الجدار C"></div>
            <div id="inputContainerD" class="floating-input-container"><input type="number" id="wD" value="100" title="الجدار D"></div>
            <div id="inputContainerDiag" class="floating-input-container"><input type="number" id="diag1Input" step="0.1" class="diag-input" title="وتر التربيع"></div>
        </div>

        <div class="angles-card">
            <div class="input-row">
                <label style="color:#ef4444;">مؤشر زاوية A-B (اليسار):</label>
                <div class="control-item">
                    <input type="range" id="sliderAB" min="45" max="135" value="90">
                    <input type="number" id="angAB" value="90">
                </div>
            </div>

            <div class="input-row">
                <label style="color:#3b82f6;">مؤشر زاوية B-C (اليمين):</label>
                <div class="control-item">
                    <input type="range" id="sliderBC" min="45" max="135" value="90">
                    <input type="number" id="angBC" value="90">
                </div>
            </div>

            <div class="input-row">
                <label style="color:#10b981;">مؤشر زاوية A-D (العلوية):</label>
                <div class="control-item">
                    <input type="range" id="sliderAD" min="45" max="135" value="90">
                    <input type="number" id="angAD" value="90">
                </div>
            </div>
        </div>

    </div>

    <div id="archiveModal">
        <div class="archive-content">
            <div class="archive-header">
                <h2>📂 أرشيف الزوايا والمقاسات</h2>
                <button class="close-modal" onclick="closeZwayaArchive()">إغلاق ❌</button>
            </div>
            <input type="text" id="searchArchive" placeholder="🔍 ابحث عن اسم الزبون..." onkeyup="filterZwayaArchive()">
            <div id="archiveList"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('layoutCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvasWrapper');
        
        const inputs = {
            wA: document.getElementById('wA'),
            wB: document.getElementById('wB'),
            wC: document.getElementById('wC'),
            wD: document.getElementById('wD'),
            aAB: document.getElementById('angAB'),
            aBC: document.getElementById('angBC'),
            aAD: document.getElementById('angAD'),
            sAB: document.getElementById('sliderAB'),
            sBC: document.getElementById('sliderBC'),
            sAD: document.getElementById('sliderAD'),
            diag1: document.getElementById('diag1Input'),
            projectName: document.getElementById('projectName')
        };

        const containers = {
            wA: document.getElementById('inputContainerA'),
            wB: document.getElementById('inputContainerB'),
            wC: document.getElementById('inputContainerC'),
            wD: document.getElementById('inputContainerD'),
            diag1: document.getElementById('inputContainerDiag')
        };

        function syncAngle(numInput, sliderInput) {
            sliderInput.addEventListener('input', () => { numInput.value = sliderInput.value; update(); });
            numInput.addEventListener('change', () => { sliderInput.value = numInput.value; update(); });
        }
        syncAngle(inputs.aAB, inputs.sAB);
        syncAngle(inputs.aBC, inputs.sBC);
        syncAngle(inputs.aAD, inputs.sAD);

        ['wA', 'wB', 'wC', 'wD'].forEach(id => inputs[id].addEventListener('change', () => update()));
        inputs.projectName.addEventListener('change', () => window.saveZwayaData());

        inputs.diag1.addEventListener('change', function() {
            let wA = parseFloat(inputs.wA.value) || 1;
            let wB = parseFloat(inputs.wB.value) || 1;
            let d1 = parseFloat(this.value) || 1;

            if (wA + wB > d1 && wA + d1 > wB && wB + d1 > wA) {
                let cosAB = (Math.pow(wA, 2) + Math.pow(wB, 2) - Math.pow(d1, 2)) / (2 * wA * wB);
                let safeCos = Math.max(-1, Math.min(1, cosAB));
                let angle = Math.round(Math.acos(safeCos) * 180 / Math.PI);
                
                inputs.aAB.value = angle;
                inputs.sAB.value = angle;
                update(); 
            }
        });

        // ------------------ المزامنة السحابية الأساسية (مسودة العمل) ------------------
        let saveTimeout;
        window.saveZwayaData = function() {
            if(!window.currentUid) return; 
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.innerText = "جاري حفظ مسودة الرسمة..."; syncStatus.style.color = "#f39c12";
            
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                const data = {
                    projectName: inputs.projectName.value,
                    wA: inputs.wA.value,
                    wB: inputs.wB.value,
                    wC: inputs.wC.value,
                    wD: inputs.wD.value,
                    angAB: inputs.aAB.value,
                    angBC: inputs.aBC.value,
                    angAD: inputs.aAD.value,
                    diag1: inputs.diag1.value
                };
                
                const dbRefStr = `backups/zwaya_projects/${window.currentUid}`;
                window.fbSet(window.fbRef(window.fbDB, dbRefStr), data).then(() => { 
                    syncStatus.innerText = "✔️ تم حفظ الرسمة كمسودة"; 
                    syncStatus.style.color = "#27ae60"; 
                }).catch((err) => { 
                    syncStatus.innerText = "❌ خطأ في الاتصال بالخادم"; 
                    syncStatus.style.color = "#e74c3c"; 
                });
            }, 1000);
        };

        window.loadZwayaData = function() {
            if(!window.currentUid) return; 
            const syncStatus = document.getElementById('syncStatus');
            const dbRefStr = `backups/zwaya_projects/${window.currentUid}`;
            
            window.fbGet(window.fbRef(window.fbDB, dbRefStr)).then((snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    if(data.projectName) inputs.projectName.value = data.projectName;
                    if(data.wA) inputs.wA.value = data.wA;
                    if(data.wB) inputs.wB.value = data.wB;
                    if(data.wC) inputs.wC.value = data.wC;
                    if(data.wD) inputs.wD.value = data.wD;
                    if(data.diag1) inputs.diag1.value = data.diag1;
                    
                    if(data.angAB) { inputs.aAB.value = data.angAB; inputs.sAB.value = data.angAB; }
                    if(data.angBC) { inputs.aBC.value = data.angBC; inputs.sBC.value = data.angBC; }
                    if(data.angAD) { inputs.aAD.value = data.angAD; inputs.sAD.value = data.angAD; }
                    
                    syncStatus.innerText = "✔️ تم استرجاع مسودة الرسمة"; syncStatus.style.color = "#27ae60";
                    update(false);
                } else { 
                    syncStatus.innerText = "✨ جاهز للعمل"; syncStatus.style.color = "#27ae60";
                    update(false);
                }
            }).catch((err) => { 
                syncStatus.innerText = "❌ فشل المزامنة"; syncStatus.style.color = "#e74c3c"; 
                update(false);
            });
        };

        // ------------------ نظام الأرشيف الدائم ------------------
        window.saveToZwayaArchive = function() {
            if(!window.currentUid) return;
            const name = inputs.projectName.value.trim();
            if(!name) { alert("⚠️ يرجى إدخال اسم الزبون أولاً لحفظ الرسمة باسمه!"); return; }
            
            const syncStatus = document.getElementById('syncStatus');
            syncStatus.innerText = "جاري الحفظ في الأرشيف الدائم..."; syncStatus.style.color = "#f39c12";
            
            const data = {
                projectName: name,
                date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                wA: inputs.wA.value,
                wB: inputs.wB.value,
                wC: inputs.wC.value,
                wD: inputs.wD.value,
                angAB: inputs.aAB.value,
                angBC: inputs.aBC.value,
                angAD: inputs.aAD.value,
                diag1: inputs.diag1.value
            };
            
            const archiveRef = window.fbPush(window.fbRef(window.fbDB, `backups/zwaya_archive/${window.currentUid}`));
            window.fbSet(archiveRef, data).then(() => {
                syncStatus.innerText = "✔️ تم الحفظ بنجاح في الأرشيف";
                syncStatus.style.color = "#27ae60";
                alert(`✅ تم حفظ رسمة الزبون (${name}) بنجاح في الأرشيف!`);
            }).catch((err) => {
                syncStatus.innerText = "❌ خطأ أثناء الحفظ في الأرشيف";
                syncStatus.style.color = "#e74c3c";
            });
        };

        window.openZwayaArchive = function() {
            if(!window.currentUid) return;
            document.getElementById('archiveModal').style.display = 'flex'; 
            const archiveList = document.getElementById('archiveList');
            archiveList.innerHTML = "<p style='text-align:center; font-weight:bold;'>⏳ جاري جلب الأرشيف...</p>";
            
            const archiveRef = window.fbRef(window.fbDB, `backups/zwaya_archive/${window.currentUid}`);
            window.fbOnValue(archiveRef, (snapshot) => {
                archiveList.innerHTML = "";
                if (snapshot.exists()) { 
                    const projects = snapshot.val(); 
                    window.allZwayaArchive = projects; 
                    renderZwayaArchive(projects); 
                } else { 
                    archiveList.innerHTML = "<p style='text-align:center; color:#e74c3c; font-weight:bold;'>لا توجد رسومات محفوظة حالياً في الأرشيف.</p>"; 
                    window.allZwayaArchive = {}; 
                }
            }, { onlyOnce: true });
        };

        window.closeZwayaArchive = function() { 
            document.getElementById('archiveModal').style.display = 'none'; 
        };

        window.renderZwayaArchive = function(projectsMap) {
            const archiveList = document.getElementById('archiveList'); 
            archiveList.innerHTML = "";
            const sortedProjects = Object.keys(projectsMap).map(key => ({ id: key, ...projectsMap[key] })).reverse();
            
            sortedProjects.forEach(proj => {
                const div = document.createElement('div'); 
                div.className = 'archive-item';
                div.innerHTML = `
                    <div class="archive-item-info">
                        <strong>${proj.projectName || 'زبون بدون اسم'}</strong>
                        <span>📅 ${proj.date || '-'} | A:${proj.wA} B:${proj.wB} C:${proj.wC} D:${proj.wD}</span>
                    </div>
                    <div class="archive-item-actions">
                        <button class="btn-load" onclick="loadArchivedZwayaProject('${proj.id}')">⬇️ استدعاء</button>
                        <button class="btn-delete" onclick="deleteArchivedZwayaProject('${proj.id}')">🗑️ حذف</button>
                    </div>`;
                archiveList.appendChild(div);
            });
        };

        window.filterZwayaArchive = function() {
            const searchTerm = document.getElementById('searchArchive').value.toLowerCase();
            if (!window.allZwayaArchive) return; 
            const filtered = {};
            for (const key in window.allZwayaArchive) { 
                const proj = window.allZwayaArchive[key]; 
                if ((proj.projectName || "").toLowerCase().includes(searchTerm)) { 
                    filtered[key] = proj; 
                } 
            }
            renderZwayaArchive(filtered);
        };

        window.loadArchivedZwayaProject = function(id) {
            const proj = window.allZwayaArchive[id]; 
            if (!proj) return;
            
            inputs.projectName.value = proj.projectName || "";
            inputs.wA.value = proj.wA || 150;
            inputs.wB.value = proj.wB || 200;
            inputs.wC.value = proj.wC || 100;
            inputs.wD.value = proj.wD || 100;
            inputs.diag1.value = proj.diag1 || "";
            
            if(proj.angAB) { inputs.aAB.value = proj.angAB; inputs.sAB.value = proj.angAB; }
            if(proj.angBC) { inputs.aBC.value = proj.angBC; inputs.sBC.value = proj.angBC; }
            if(proj.angAD) { inputs.aAD.value = proj.angAD; inputs.sAD.value = proj.angAD; }
            
            closeZwayaArchive(); 
            update(true); // تحديث الرسمة وإرسالها للمسودة فوراً
            document.getElementById('syncStatus').innerText = "✔️ تم استدعاء الرسمة بنجاح";
        };

        window.deleteArchivedZwayaProject = function(id) {
            if(confirm("هل أنت متأكد من حذف رسمة هذا الزبون نهائياً من الأرشيف؟")) {
                const targetPath = `backups/zwaya_archive/${window.currentUid}/${id}`;
                window.fbRemove(window.fbRef(window.fbDB, targetPath)).then(() => { 
                    openZwayaArchive(); // إعادة تحميل القائمة بعد الحذف
                });
            }
        };

        // ------------------ منطق رسم الـ Canvas ------------------
        function drawGrid() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1;
            ctx.strokeStyle = '#f1f5f9'; 
            const gridSize = 40;
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for (let y = 0; y <= canvas.height; y += gridSize) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();
            ctx.strokeStyle = '#e2e8f0';
            ctx.beginPath();
            for (let x = 0; x <= canvas.width; x += gridSize * 4) { ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); }
            for (let y = 0; y <= canvas.height; y += gridSize * 4) { ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); }
            ctx.stroke();
        }

        let currentPositions = {};

        function updatePositionElements() {
            if (!currentPositions.c1) return;
            
            const rect = canvas.getBoundingClientRect();
            const scaleX = rect.width / canvas.width;
            const scaleY = rect.height / canvas.height;

            const setElPos = (el, pos) => {
                el.style.left = (pos.x * scaleX) + 'px';
                el.style.top = (pos.y * scaleY) + 'px';
            };

            setElPos(containers.wA, { x: (currentPositions.c1.x + currentPositions.c2.x)/2 - 35, y: (currentPositions.c1.y + currentPositions.c2.y)/2 });
            setElPos(containers.wB, { x: (currentPositions.c2.x + currentPositions.c3.x)/2, y: currentPositions.c2.y + 25 });
            setElPos(containers.wC, { x: (currentPositions.c3.x + currentPositions.c4.x)/2 + 35, y: (currentPositions.c3.y + currentPositions.c4.y)/2 });
            setElPos(containers.wD, { x: (currentPositions.c1.x + currentPositions.c5.x)/2, y: (currentPositions.c1.y + currentPositions.c5.y)/2 - 25 });
            setElPos(containers.diag1, { x: (currentPositions.c1.x + currentPositions.c3.x)/2 - 30, y: (currentPositions.c1.y + currentPositions.c3.y)/2 - 20 });
        }

        function update(triggerSave = true) {
            let wA = parseFloat(inputs.wA.value) || 1;
            let wB = parseFloat(inputs.wB.value) || 1;
            let wC = parseFloat(inputs.wC.value) || 1;
            let wD = parseFloat(inputs.wD.value) || 1;
            
            let radAB = (parseFloat(inputs.aAB.value) || 90) * Math.PI / 180;
            let radBC = (parseFloat(inputs.aBC.value) || 90) * Math.PI / 180;
            let radAD = (parseFloat(inputs.aAD.value) || 90) * Math.PI / 180;

            let P2 = { x: 0, y: 0 };
            let P3 = { x: wB, y: 0 };
            let P1 = { x: wA * Math.cos(radAB), y: wA * Math.sin(radAB) };
            let P4 = { x: P3.x + wC * Math.cos(Math.PI - radBC), y: P3.y + wC * Math.sin(Math.PI - radBC) };
            
            let headingD = radAB + Math.PI + radAD;
            let P5 = { x: P1.x + wD * Math.cos(headingD), y: P1.y + wD * Math.sin(headingD) };

            let dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);
            
            let diag1 = dist(P1, P3); 
            if (document.activeElement !== inputs.diag1) {
                inputs.diag1.value = diag1.toFixed(1);
            }
            
            let gap = dist(P4, P5);

            let cosC = (Math.pow(gap, 2) + Math.pow(wC, 2) - Math.pow(dist(P5, P3), 2)) / (2 * gap * wC);
            let angleC_auto = Math.round(Math.acos(Math.max(-1, Math.min(1, cosC))) * 180 / Math.PI) || 0;

            let cosD = (Math.pow(gap, 2) + Math.pow(wD, 2) - Math.pow(dist(P4, P1), 2)) / (2 * gap * wD);
            let angleD_auto = Math.round(Math.acos(Math.max(-1, Math.min(1, cosD))) * 180 / Math.PI) || 0;

            let minX = Math.min(P1.x, P2.x, P3.x, P4.x, P5.x);
            let maxX = Math.max(P1.x, P2.x, P3.x, P4.x, P5.x);
            let minY = Math.min(P1.y, P2.y, P3.y, P4.y, P5.y);
            let maxY = Math.max(P1.y, P2.y, P3.y, P4.y, P5.y);

            let mathW = maxX - minX || 1;
            let mathH = maxY - minY || 1;

            let scale = Math.min((canvas.width - 200) / mathW, (canvas.height - 200) / mathH);
            let cx = canvas.width / 2 - (minX + maxX) * scale / 2;
            let cy = canvas.height / 2 + (minY + maxY) * scale / 2;

            function toC(p) { return { x: cx + p.x * scale, y: cy - p.y * scale }; }
            
            currentPositions.c1 = toC(P1);
            currentPositions.c2 = toC(P2);
            currentPositions.c3 = toC(P3);
            currentPositions.c4 = toC(P4);
            currentPositions.c5 = toC(P5);

            drawLayout(gap, angleC_auto, angleD_auto);
            updatePositionElements();
            
            if (triggerSave && typeof window.saveZwayaData === 'function') {
                window.saveZwayaData();
            }
        }

        function drawLayout(gap, angleC_auto, angleD_auto) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            let c1 = currentPositions.c1, c2 = currentPositions.c2, c3 = currentPositions.c3, c4 = currentPositions.c4, c5 = currentPositions.c5;

            ctx.beginPath();
            ctx.setLineDash([6, 6]);
            ctx.moveTo(c1.x, c1.y); ctx.lineTo(c3.x, c3.y);
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#8b5cf6';
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0f766e';
            
            ctx.beginPath(); 
            ctx.moveTo(c1.x, c1.y); 
            ctx.lineTo(c2.x, c2.y); 
            ctx.lineTo(c3.x, c3.y); 
            ctx.lineTo(c4.x, c4.y); 
            ctx.stroke(); 
            
            ctx.beginPath(); 
            ctx.moveTo(c1.x, c1.y); 
            ctx.lineTo(c5.x, c5.y); 
            ctx.stroke(); 

            ctx.beginPath();
            ctx.setLineDash([8, 8]);
            ctx.moveTo(c5.x, c5.y); ctx.lineTo(c4.x, c4.y);
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ea580c';
            ctx.stroke();
            ctx.setLineDash([]);

            function drawArc(center, pStart, pEnd, color, isCCW) {
                let a1 = Math.atan2(pStart.y - center.y, pStart.x - center.x);
                let a2 = Math.atan2(pEnd.y - center.y, pEnd.x - center.x);
                ctx.beginPath();
                ctx.arc(center.x, center.y, 30, a1, a2, isCCW);
                ctx.lineWidth = 3;
                ctx.strokeStyle = color;
                ctx.stroke();
                ctx.lineTo(center.x, center.y);
                ctx.fillStyle = color + '20'; 
                ctx.fill();
            }
            
            drawArc(c2, c3, c1, '#ef4444', true);  
            drawArc(c3, c2, c4, '#3b82f6', false); 
            drawArc(c1, c2, c5, '#10b981', true);   
            drawArc(c4, c3, c5, '#d97706', false);  
            drawArc(c5, c4, c1, '#d97706', false);  

            function drawTextWithBg(text, x, y, color, font = 'bold 15px Arial') {
                ctx.font = font;
                let metrics = ctx.measureText(text);
                let padding = 4;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(x - metrics.width/2 - padding, y - 10 - padding, metrics.width + padding*2, 20 + padding*2);
                ctx.fillStyle = color;
                ctx.fillText(text, x, y);
            }

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            drawTextWithBg("الفتحة (التقفيلة): " + gap.toFixed(1) + " سم", (c4.x + c5.x)/2, (c4.y + c5.y)/2 - 25, '#ea580c', 'bold 16px Arial');

            drawTextWithBg(inputs.aAB.value + "°", c2.x + 45, c2.y - 25, '#ef4444');
            drawTextWithBg(inputs.aBC.value + "°", c3.x - 45, c3.y - 25, '#3b82f6');
            drawTextWithBg(inputs.aAD.value + "°", c1.x + 45, c1.y + 35, '#10b981');
            
            drawTextWithBg(angleC_auto + "°", c4.x - 45, c4.y + 35, '#d97706');
            drawTextWithBg(angleD_auto + "°", c5.x + 45, c5.y + 35, '#d97706');
        }

        window.addEventListener('resize', () => {
            updatePositionElements();
        });

        setInterval(updatePositionElements, 300);
    </script>
</body>
</html>
