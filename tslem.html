<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام التسليمات السحابي - AZEMAA PRO</title>
    <!-- استدعاء مكتبات Firebase المتوافقة مع أسلوب الكود الحالي -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- استدعاء Analytics إذا كنت تحتاجه (اختياري) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        * { box-sizing: border-box; font-weight: 900 !important; }
        body { font-family: 'Segoe UI', sans-serif; background: #d1d8e0; margin: 0; }
        header { background: var(--primary); color: white; padding: 10px; position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #34495e; color: white; padding: 8px; position: sticky; top: 45px; font-size: 12px; }
        td { border: 1px solid #b2bec3; padding: 2px; text-align: center; }
        .row-done { background-color: #ff7675 !important; color: white !important; }
        .name-input { width: 100%; border: none; background: transparent; text-align: center; outline: none; }
        #sync-status { font-size: 12px; background: rgba(0,0,0,0.2); padding: 5px 10px; border-radius: 20px; }
    </style>
</head>
<body>
<header>
    <div style="display: flex; align-items: center; gap: 10px;">
        <h2 style="margin:0; font-size: 16px;">📦 التسليمات</h2>
        <span id="sync-status">🔄 جاري المزامنة...</span>
    </div>
    <button onclick="goToToday()" style="background: var(--accent); color: white; border:none; padding:5px 15px; border-radius:5px;">📍 اليوم</button>
</header>

<table id="mainTable">
    <thead>
        <tr>
            <th style="width:100px">التاريخ</th>
            <th>العميل 1</th>
            <th>العميل 2</th>
            <th>ملاحظات</th>
            <th style="width:50px">حالة</th>
        </tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    // تم تحديث الإعدادات لتطابق مشروع AZEMAA PRO الجديد الخاص بك
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210",
        measurementId: "G-R28J7010TH"
    };
    
    // تهيئة الـ Firebase بالطريقة المتوافقة مع الكود القديم
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // تفعيل Analytics إذا أردت
    if(typeof firebase.analytics === 'function') {
        firebase.analytics();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        const year = 2026;
        let date = new Date(year, 0, 1);
        const today = new Date().toDateString();

        while (date.getFullYear() === year) {
            const d = date.getDate(), m = date.getMonth() + 1;
            const id = `${d}-${m}-${year}`;
            const tr = document.createElement('tr');
            if (date.toDateString() === today) { tr.id = 'todayRow'; tr.style.background = "#fff9c4"; }

            tr.innerHTML = `
                <td>${d}/${m}</td>
                <td><input class="name-input" id="${id}-c1" onchange="save('${id}', 'c1', this.value)"></td>
                <td><input class="name-input" id="${id}-c2" onchange="save('${id}', 'c2', this.value)"></td>
                <td><input class="name-input" id="${id}-n" onchange="save('${id}', 'n', this.value)"></td>
                <td><select id="${id}-s" onchange="save('${id}', 's', this.value)">
                    <option value="pending">⏳</option>
                    <option value="done">✅</option>
                </select></td>
            `;
            tbody.appendChild(tr);
            date.setDate(date.getDate() + 1);
        }
        loadData();
    }

    function save(id, field, val) {
        db.ref('azemaa_v5/deliveries/' + id).update({ [field]: val });
    }

    function loadData() {
        db.ref('azemaa_v5/deliveries').on('value', snap => {
            const data = snap.val() || {};
            for (let id in data) {
                if(document.getElementById(id+'-c1')) document.getElementById(id+'-c1').value = data[id].c1 || '';
                if(document.getElementById(id+'-c2')) document.getElementById(id+'-c2').value = data[id].c2 || '';
                if(document.getElementById(id+'-n')) document.getElementById(id+'-n').value = data[id].n || '';
                if(document.getElementById(id+'-s')) {
                    document.getElementById(id+'-s').value = data[id].s || 'pending';
                    document.getElementById(id+'-s').closest('tr').className = data[id].s === 'done' ? 'row-done' : '';
                }
            }
            document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
        });
    }

    function goToToday() { document.getElementById('todayRow')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    renderTable();
</script>
</body>
</html>
