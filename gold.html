<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة راديو FM الرقمية</title>
    <style>
        :root {
            --bg-color: #09090d;
            --card-bg: #14141f;
            --text-color: #ffffff;
            --radio-color: #ffb703;
            --accent-color: #00b4d8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--radio-color);
            margin-bottom: 5px;
        }

        /* صندوق المشغل الصوتي الرئيسي */
        .player-wrapper {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #222;
        }

        .radio-visualizer {
            padding: 30px;
            background: linear-gradient(45deg, #1e1135, #09090d);
            border-radius: 12px;
            font-size: 4rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.03); opacity: 1; }
        }

        .channel-title-display {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--radio-color);
            margin-bottom: 20px;
        }

        .audio-player-element {
            width: 100%;
            outline: none;
        }

        /* قائمة المحطات */
        .channels-grid {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid #222;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--accent-color);
            border-bottom: 2px solid #252538;
            padding-bottom: 8px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .channel-btn {
            background: #1d1d2b;
            border: 2px solid transparent;
            color: var(--text-color);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .channel-btn:hover {
            background: var(--radio-color);
            color: #000;
            transform: translateY(-2px);
        }

        .channel-btn.active {
            background: var(--radio-color);
            border-color: #fff;
            color: #000;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>راديو FM الرقمي</h1>
        <p>استمع إلى إذاعاتك المفضلة بث مباشر بجودة عالية وبدون تقطيع</p>
    </header>

    <!-- مشغل الراديو الرئيسي -->
    <div class="player-wrapper">
        <div class="radio-visualizer">📻</div>
        <div class="channel-title-display" id="current-channel-name">اختر إذاعة لبدء البث</div>
        <audio id="main-audio-player" class="audio-player-element" controls></audio>
    </div>

    <!-- قائمة إذاعات الـ FM -->
    <div class="channels-grid">
        <div class="section-title">📡 الإذاعات المتاحة</div>
        <button class="channel-btn" onclick="playAudio('إذاعة القرآن الكريم (القاهرة)', 'https://stream.zeno.fm/f96atv68v68uv')">🕌 إذاعة القرآن الكريم من القاهرة</button>
        <button class="channel-btn" onclick="playAudio('إذاعة نجوم FM 100.6', 'https://icecast.media.shoutcast.com/NojoomFM')">🎵 نجوم FM 100.6</button>
        <button class="channel-btn" onclick="playAudio('إذاعة بي بي سي العربية', 'https://stream.live.vc.bbcmedia.co.uk/bbc_arabic_radio')">🎙️ إذاعة BBC العربية</button>
    </div>
</div>

<script>
    const audioPlayer = document.getElementById('main-audio-player');
    const currentChannelText = document.getElementById('current-channel-name');

    function playAudio(name, url) {
        // تحديث أزرار القائمة وتنظيم الحالة النشطة (Active)
        document.querySelectorAll('.channel-btn').forEach(btn => {
            if(btn.innerText.includes(name)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // تحديث نص الإذاعة الحالية المستمع إليها
        currentChannelText.innerText = `جاري الاستماع إلى: ${name}`;
        
        // تمرير الرابط للمشغل وبدء البث فوراً
        audioPlayer.src = url;
        audioPlayer.load();
        audioPlayer.play().catch(e => {
            console.log("المتصفح يطلب تفاعل المستخدم لبدء التشغيل الفوري.");
        });
    }
</script>

</body>
</html>
