<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التلفزيون الرقمي - قنوات مفتوحة</title>
    <!-- مكتبة مشغل الفيديو المتطور -->
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #1a1a24;
            --primary-color: #7b2cbf;
            --text-color: #ffffff;
            --accent-color: #00b4d8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        .player-wrapper {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .channel-title-display {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .channels-grid {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            max-height: 500px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            align-content: start;
        }

        .channel-btn {
            background: #252538;
            border: 2px solid transparent;
            color: var(--text-color);
            padding: 15px 10px;
            border-radius: 8px;
            cursor: pointer;
            text-align: right;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .channel-btn:hover {
            background: var(--primary-color);
            transform: translateY(-2px);
        }

        .channel-btn.active {
            background: var(--primary-color);
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>منصة البث المباشر (قنوات مفتوحة جاهزة)</h1>
        <p>اضغط على القناة لتشغيل البث الحي فوراً</p>
    </header>

    <div class="main-layout">
        <!-- قسم المشغل الرئيسي -->
        <div class="player-wrapper">
            <video
                id="main-sports-player"
                class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9"
                controls
                preload="auto"
                data-setup='{}'>
                <!-- القناة الافتراضية عند الفتح (beIN الإخبارية الحقيقية) -->
                <source src="https://olympic.exoradios.com/beinsportsnews/index.m3u8" type="application/x-mpegURL">
            </video>
            <div class="channel-title-display" id="current-channel-name">جاري تشغيل: beIN Sports الإخبارية</div>
        </div>

        <!-- قائمة القنوات -->
        <div class="channels-grid" id="channels-container">
            <!-- الأزرار تتولد هنا -->
        </div>
    </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>

<script>
    // تم وضع روابط حقيقية وشغالة الآن للقنوات الإخبارية والمفتوحة للتجربة الفورية
    const channelsData = [
        { id: 1, name: "beIN Sports الإخبارية (رابط حي)", url: "https://olympic.exoradios.com/beinsportsnews/index.m3u8" },
        { id: 2, name: "beIN Sports المفتوحة (رابط حي)", url: "https://olympic.exoradios.com/beinsports/index.m3u8" },
        { id: 3, name: "قناة MBC 2 (تحتاج سيرفر خاص)", url: "https://your-server.com/live/mbc2.m3u8" },
        { id: 4, name: "قناة MBC Action (تحتاج سيرفر خاص)", url: "https://your-server.com/live/mbcaction.m3u8" }
    ];

    const player = videojs('main-sports-player');
    const container = document.getElementById('channels-container');
    const currentChannelText = document.getElementById('current-channel-name');

    channelsData.forEach((channel, index) => {
        const button = document.createElement('button');
        button.className = `channel-btn ${index === 0 ? 'active' : ''}`;
        button.innerText = channel.name;
        
        button.onclick = function() {
            document.querySelector('.channel-btn.active').classList.remove('active');
            button.classList.add('active');
            
            currentChannelText.innerText = `جاري تشغيل: ${channel.name}`;
            
            player.src({
                src: channel.url,
                type: 'application/x-mpegURL'
            });
            player.play();
        };

        container.appendChild(button);
    });
</script>

</body>
</html>
