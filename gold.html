<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>شات الفنيين - مفتوح للجميع</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* تم تغيير الخلفية للأبيض */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 550px;
            background-color: #ffffff;
            height: 95vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }
        .header {
            background-color: #075e54;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #128c7e;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .edit-name {
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .online-count {
            font-size: 13px;
            background: #25d366;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            background-color: #ffffff; /* تم تغيير خلفية الشات للأبيض */
            display: flex;
            flex-direction: column;
            gap: 6px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .sender-me {
            background-color: #dcf8c6;
            align-self: flex-start;
            border-top-left-radius: 5px;
        }
        .sender-other {
            background-color: #f1f1f1; /* لون رمادي فاتح جدا لرسائل الآخرين عشان تظهر على الأبيض */
            align-self: flex-end;
            border-top-right-radius: 5px;
        }
        .message-name {
            font-size: 12px;
            font-weight: bold;
            color: #075e54;
            display: block;
            margin-bottom: 4px;
        }
        .message-time {
            font-size: 10px;
            color: #777;
            text-align: left;
            margin-top: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-msg {
            color: red;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
            opacity: 0.7;
        }
        .reply-badge {
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 6px;
            border-right: 3px solid #075e54;
        }
        .message img {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 5px;
        }
        .file-link {
            display: inline-block;
            background: #f0f0f0;
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            color: #075e54;
            font-size: 13px;
        }
        .chat-input {
            background: #f0f0f0;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid #ddd;
            flex-wrap: wrap;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            background: white;
            border-radius: 30px;
            padding: 5px 12px;
            align-items: center;
            border: 1px solid #ccc;
        }
        #messageInput {
            flex: 1;
            border: none;
            padding: 10px;
            outline: none;
            font-size: 15px;
            background: transparent;
        }
        .emoji-picker {
            display: flex;
            gap: 5px;
            background: white;
            border-radius: 30px;
            padding: 0 8px;
        }
        .emoji-btn {
            cursor: pointer;
            font-size: 20px;
            background: none;
            border: none;
        }
        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #128c7e;
        }
        .send-btn {
            background-color: #128c7e;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 18px;
        }
        .typing-indicator {
            font-size: 12px;
            padding: 4px 12px;
            color: #555;
            font-style: italic;
        }
        #fileInput { display: none; }
        audio { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>
</head>
<body>
<div class="chat-container">
    <div class="header">
        <div class="user-info">
            <span id="userNameDisplay">فني_???</span>
            <button id="editNameBtn" class="edit-name">✏️</button>
        </div>
        <div>
            <span id="onlineCount" class="online-count">🟢 0</span>
        </div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div id="typingIndicator" class="typing-indicator"></div>
    <div class="chat-input">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="file" id="fileInput" multiple style="display:none" onchange="uploadMultipleFiles(event)">
        <div class="input-wrapper">
            <input type="text" id="messageInput" placeholder="اكتب رسالة...">
            <div class="emoji-picker">
                <button class="emoji-btn" onclick="addEmoji('😊')">😊</button>
                <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
                <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
                <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
            </div>
        </div>
        <button class="send-btn" onclick="sendTextMessage()">➤</button>
    </div>
</div>
<audio id="notificationSound" preload="auto">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>

<script>
    // ========== إعدادات Firebase ==========
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const storage = firebase.storage();

    const ROOM_NAME = "public_chat";

    // تم إزالة localStorage بالكامل لمنع تعطل الكود في تطبيقات الموبايل
    let currentUser = "فني_" + Math.floor(Math.random() * 10000);
    
    let typingTimeout = null;
    let isWindowActive = true;
    let currentReplyTo = null;

    window.onfocus = () => { isWindowActive = true; };
    window.onblur = () => { isWindowActive = false; };

    document.getElementById("userNameDisplay").innerText = currentUser;

    // تعديل الاسم مؤقتاً للجلسة الحالية
    document.getElementById("editNameBtn").addEventListener("click", () => {
        let newName = prompt("أدخل اسمك الجديد:", currentUser);
        if(newName && newName.trim() !== "") {
            currentUser = newName.trim();
            document.getElementById("userNameDisplay").innerText = currentUser;
            updatePresenceAfterNameChange();
        }
    });

    function updatePresenceAfterNameChange() {
        db.ref(`presence/${ROOM_NAME}/${currentUser}`).set(true);
        db.ref(`typing/${ROOM_NAME}/${currentUser}`).remove();
        setupPresence();
    }

    initChat();

    function initChat() {
        loadMessages();
        setupTyping();
        setupPresence();

        const inputField = document.getElementById("messageInput");
        inputField.addEventListener("keydown", (e) => {
            if(e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendTextMessage();
            }
        });
        inputField.addEventListener("input", () => {
            const typingRef = db.ref(`typing/${ROOM_NAME}/${currentUser}`);
            typingRef.set(true);
            if(typingTimeout) clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                typingRef.remove();
            }, 1500);
        });
    }

    window.addEmoji = (emoji) => {
        const input = document.getElementById("messageInput");
        input.value += emoji;
        input.focus();
    };

    function setReplyTo(msgId, name, text, type, imageUrl) {
        currentReplyTo = { id: msgId, name, text, type, imageUrl };
        let replyDiv = document.getElementById("replyPreview");
        if(!replyDiv) {
            replyDiv = document.createElement("div");
            replyDiv.id = "replyPreview";
            replyDiv.style.cssText = "background:#e1f5fe; border-radius:12px; padding:5px 10px; margin-bottom:5px; font-size:12px; display:flex; justify-content:space-between;";
            document.querySelector(".input-wrapper").parentNode.insertBefore(replyDiv, document.querySelector(".input-wrapper"));
        }
        let previewText = `الرد على ${name}: ` + (type === 'image' ? "📷 صورة" : (text || "").substring(0, 50));
        replyDiv.innerHTML = `<span>${escapeHtml(previewText)}</span> <button onclick="cancelReply()" style="background:none;border:none;color:red;cursor:pointer;">✖</button>`;
    }

    window.cancelReply = () => {
        currentReplyTo = null;
        const replyDiv = document.getElementById("replyPreview");
        if(replyDiv) replyDiv.remove();
    };

    window.sendTextMessage = () => {
        const input = document.getElementById("messageInput");
        const text = input.value.trim();
        if(text === "" && !currentReplyTo) return;

        const messageData = {
            name: currentUser,
            text: text || " ",
            type: 'text',
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            replyTo: currentReplyTo ? { 
                id: currentReplyTo.id, 
                name: currentReplyTo.name, 
                textPreview: (currentReplyTo.text || "صورة").substring(0,50) 
            } : null
        };
        db.ref(`chats/${ROOM_NAME}/messages`).push(messageData)
            .then(() => {
                input.value = "";
                cancelReply();
                input.focus();
            })
            .catch(err => alert("خطأ في الإرسال: " + err.message));
    };

    window.uploadMultipleFiles = async (event) => {
        const files = Array.from(event.target.files);
        for(const file of files) {
            if(file.size > 5 * 1024 * 1024) { 
                alert(`حجم الملف ${file.name} كبير جداً. الحد الأقصى 5 ميجابايت.`);
                continue;
            }

            const isImage = file.type.startsWith("image/");
            const storagePath = `chat_files/${ROOM_NAME}/${Date.now()}_${file.name}`;
            const storageRef = storage.ref(storagePath);
            try {
                const snapshot = await storageRef.put(file);
                const downloadURL = await snapshot.ref.getDownloadURL();
                const messageData = {
                    name: currentUser,
                    type: isImage ? 'image' : 'file',
                    [isImage ? 'imageUrl' : 'fileUrl']: downloadURL,
                    fileName: file.name,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };
                await db.ref(`chats/${ROOM_NAME}/messages`).push(messageData);
            } catch(err) {
                alert("خطأ في رفع الملف: " + err.message);
            }
        }
        document.getElementById("fileInput").value = "";
    };

    function loadMessages() {
        const messagesRef = db.ref(`chats/${ROOM_NAME}/messages`).limitToLast(100);
        messagesRef.off(); 
        messagesRef.on("child_added", (snapshot) => {
            const msg = snapshot.val();
            msg.id = snapshot.key;
            displayMessage(msg);
        });
        messagesRef.on("child_removed", (snapshot) => {
            const removedId = snapshot.key;
            const msgElement = document.querySelector(`.message[data-id='${removedId}']`);
            if(msgElement) msgElement.remove();
        });
    }

    function displayMessage(msg) {
        const container = document.getElementById("chatMessages");
        const div = document.createElement("div");
        div.className = `message ${msg.name === currentUser ? "sender-me" : "sender-other"}`;
        div.setAttribute("data-id", msg.id);
        
        let replyHtml = "";
        if(msg.replyTo) {
            replyHtml = `<div class="reply-badge">↩️ رد على ${escapeHtml(msg.replyTo.name)}: ${escapeHtml(msg.replyTo.textPreview)}</div>`;
        }
        
        let content = "";
        if(msg.type === 'image') {
            content = `<img src="${msg.imageUrl}" alt="صورة" onload="document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight" style="max-width:100%; border-radius:12px;">`;
        } else if(msg.type === 'file') {
            content = `<a href="${msg.fileUrl}" target="_blank" class="file-link">📄 ${escapeHtml(msg.fileName)}</a>`;
        } else {
            content = escapeHtml(msg.text); 
        }
        
        const timeStr = msg.timestamp ? new Date(msg.timestamp).toLocaleTimeString('ar', {hour:'2-digit', minute:'2-digit'}) : "";
        const deleteBtn = (msg.name === currentUser) ? `<span class="delete-msg" onclick="deleteMessage('${msg.id}')">🗑️</span>` : "";
        
        const safeText = encodeURIComponent(msg.text || "");
        const replyBtn = `<span class="delete-msg" style="color:#128c7e;" onclick="setReplyTo('${msg.id}', '${escapeHtml(msg.name)}', decodeURIComponent('${safeText}'), '${msg.type}', '${msg.imageUrl || ""}')">↩️ رد</span>`;
        
        div.innerHTML = `
            <span class="message-name">${escapeHtml(msg.name)}</span>
            ${replyHtml}
            ${content}
            <div class="message-time">${timeStr} ${replyBtn} ${deleteBtn}</div>
        `;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
        
        if(msg.name !== currentUser && !isWindowActive) {
            const sound = document.getElementById("notificationSound");
            sound.play().catch(e => console.log("الصوت لم يتم تشغيله تلقائياً"));
        }
    }

    function escapeHtml(str) {
        if(!str) return "";
        return str.replace(/[&<>"]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            if(m === '"') return '&quot;';
            return m;
        });
    }

    window.deleteMessage = (msgId) => {
        if(confirm("هل تريد حذف هذه الرسالة؟")) {
            db.ref(`chats/${ROOM_NAME}/messages/${msgId}`).once('value').then(snap => {
                const msgData = snap.val();
                if(msgData && (msgData.type === 'image' || msgData.type === 'file')) {
                    const fileUrl = msgData.imageUrl || msgData.fileUrl;
                    try {
                        const fileRef = storage.refFromURL(fileUrl);
                        fileRef.delete().catch(err => console.log("ملف التخزين غير موجود أو تم حذفه مسبقاً"));
                    } catch(e) { console.log("رابط غير صالح للستوريدج"); }
                }
                return db.ref(`chats/${ROOM_NAME}/messages/${msgId}`).remove();
            }).catch(err => alert("خطأ في الحذف: " + err.message));
        }
    };

    function setupTyping() {
        const typingRef = db.ref(`typing/${ROOM_NAME}`);
        typingRef.on("value", (snapshot) => {
            const typingUsers = snapshot.val() || {};
            const typingList = Object.keys(typingUsers).filter(u => u !== currentUser && typingUsers[u] === true);
            const indicator = document.getElementById("typingIndicator");
            if(typingList.length > 0) {
                indicator.innerText = typingList.slice(0,2).join(", ") + (typingList.length > 2 ? " وآخرون" : "") + " يكتب...";
            } else {
                indicator.innerText = "";
            }
        });
    }

    let currentPresenceRef = null;
    function setupPresence() {
        if(currentPresenceRef) {
            currentPresenceRef.onDisconnect().cancel();
        }
        const userStatusRef = db.ref(`presence/${ROOM_NAME}/${currentUser}`);
        currentPresenceRef = userStatusRef;
        const connectedRef = db.ref(".info/connected");
        connectedRef.off();
        connectedRef.on("value", (snap) => {
            if(snap.val() === true) {
                userStatusRef.set(true);
                userStatusRef.onDisconnect().remove();
            }
        });
        db.ref(`presence/${ROOM_NAME}`).on("value", (snap) => {
            const count = snap.val() ? Object.keys(snap.val()).length : 0;
            document.getElementById("onlineCount").innerHTML = `🟢 ${count}`;
        });
    }

    window.addEventListener("beforeunload", () => {
        if(currentUser) {
            db.ref(`presence/${ROOM_NAME}/${currentUser}`).remove();
            db.ref(`typing/${ROOM_NAME}/${currentUser}`).remove();
        }
    });
</script>
</body>
</html>
