<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro | Fixed Libraries</title>
    
    <script src="https://unpkg.com/@tensorflow/tfjs@latest"></script>
    <script src="https://unpkg.com/@tensorflow-models/mobilenet@latest"></script>
    
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .header { background: #ffd700; color: #000; padding: 15px; font-weight: bold; }
        #status { color: #ffd700; padding: 10px; font-size: 14px; }
        video { width: 100%; max-height: 70vh; background: #111; }
        .btn-start { background: #ffd700; padding: 20px; width: 100%; font-size: 18px; font-weight: bold; position: fixed; bottom: 0; left: 0; border: none; }
    </style>
</head>
<body>

<div class="header">وحدة Azemaa Pro - الإصدار المتوافق</div>
<div id="status">جاري فحص المكتبات...</div>

<video id="videoInput" autoplay playsinline muted></video>
<canvas id="canvasOutput" style="display:none;"></canvas>

<button class="btn-start" id="startBtn">تشغيل المحرك والكاميرا</button>

<script>
    const statusDiv = document.getElementById('status');
    let net;

    // التأكد من تحميل المكتبات
    window.onload = async () => {
        if (typeof tf !== 'undefined' && typeof mobilenet !== 'undefined') {
            statusDiv.innerText = "تم تحميل المكتبات بنجاح ✅";
            statusDiv.style.color = "#0f0";
        } else {
            statusDiv.innerText = "فشل تحميل المكتبات! تأكد من وجود إنترنت ❌";
            statusDiv.style.color = "#f00";
        }
    };

    async function startSystem() {
        try {
            statusDiv.innerText = "جاري تشغيل الذكاء الاصطناعي...";
            net = await mobilenet.load();
            
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            
            const video = document.getElementById('videoInput');
            video.srcObject = stream;
            
            statusDiv.innerText = "النظام يعمل الآن - جاري التتبع";
            runDetection(video);
        } catch (err) {
            alert("خطأ: تأكد من تشغيل الموقع عبر HTTPS ومن صلاحيات الكاميرا");
            console.error(err);
        }
    }

    async function runDetection(video) {
        const result = await net.classify(video);
        if (result.length > 0) {
            statusDiv.innerText = "المادة: " + result[0].className + " (" + (result[0].probability * 100).toFixed(1) + "%)";
        }
        requestAnimationFrame(() => runDetection(video));
    }

    document.getElementById('startBtn').onclick = startSystem;
</script>

</body>
</html>
