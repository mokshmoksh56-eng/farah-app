<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة راديو مصر الرقمية 🇪🇬</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --radio-color: #38bdf8;
            --accent-color: #0ea5e9;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--radio-color);
            margin-bottom: 5px;
        }

        /* صندوق العرض الرئيسي المضمون */
        .player-wrapper {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .channel-title-display {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
        }

        /* حاوية النافذة الذكية */
        .window-container {
            width: 100%;
            height: 450px;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--radio-color);
        }

        .window-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 20px;
        }

        .welcome-screen span {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        /* قائمة المحطات */
        .channels-grid {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
            border: 1px solid #334155;
        }

        .section-headline {
            grid-column: 1 / -1;
            font-size: 1.1rem;
            color: var(--radio-color);
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
            margin-top: 10px;
            font-weight: bold;
        }
        .section-headline:first-child {
            margin-top: 0;
        }

        .channel-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: var(--text-color);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background: var(--radio-color);
            color: #0f172a;
            border-color: var(--radio-color);
            transform: translateY(-2px);
        }

        .channel-btn.active {
            background: var(--accent-color);
            border-color: #fff;
            color: #fff;
            box-shadow: 0 0 12px rgba(14, 165, 233, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>بوابة راديو مصر البث المباشر المعتمد 🇪🇬</h1>
        <p>تشغيل فوري مستقر من المواقع الرسمية مباشرة وبدون حجب</p>
    </header>

    <!-- شاشة العرض والتشغيل المستقرة -->
    <div class="player-wrapper">
        <div class="channel-title-display" id="current-channel-name">اختر إذاعة لبدء الاستماع فوراً</div>
        <div class="window-container" id="live-window">
            <div class="welcome-screen">
                <span>📻</span>
                اضغط على أي إذاعة بالأسفل وسيفتح المشغل الرسمي المضمون هنا مباشرة.
            </div>
        </div>
    </div>

    <!-- شبكة الإذاعات الشاملة -->
    <div class="channels-grid">
        
        <div class="section-headline">🕌 الإذاعات الدينية</div>
        <button class="channel-btn" onclick="openRadio('إذاعة القرآن الكريم', 'https://www.mp3quran.net/ar/radio/cairo')">🕌 القرآن الكريم (القاهرة)</button>
        
        <div class="section-headline">🎵 إذاعات الأغاني والمنوعات (الرسمية المضمونة)</div>
        <button class="channel-btn" onclick="openRadio('نجوم FM 100.6', 'https://www.nogoumfm.net/live/')">✨ نجوم FM 100.6</button>
        <button class="channel-btn" onclick="openRadio('راديو نغم FM 105.3', 'https://www.radionile.com/naghamfm')">🎶 نغم FM 105.3</button>
        <button class="channel-btn" onclick="openRadio('راديو ميجا FM 92.7', 'https://www.radionile.com/megafm')">🔥 ميجا FM 92.7</button>
        <button class="channel-btn" onclick="openRadio('راديو هيتس 88.2', 'https://www.radionile.com/radiohits')">⚡ راديو هيتس 88.2</button>
        <button class="channel-btn" onclick="openRadio('راديو شعبى FM 95.0', 'https://www.radionile.com/shaabifm')">💃 شعبى FM 95.0</button>
        <button class="channel-btn" onclick="openRadio('راديو إنرجي مصر 92.1', 'https://www.nrjegypt.com/')">🎵 إنرجي مصر NRJ</button>

        <div class="section-headline">🎙️ إذاعات ماسبيرو الإخبارية والتراثية</div>
        <button class="channel-btn" onclick="openRadio('إذاعة البرنامج العام', 'https://www.maspero.eg/live/1')">📻 إذاعة البرنامج العام</button>
        <button class="channel-btn" onclick="openRadio('إذاعة صوت العرب', 'https://www.maspero.eg/live/2')">🌍 إذاعة صوت العرب</button>
        <button class="channel-btn" onclick="openRadio('إذاعة الشباب والرياضة', 'https://www.maspero.eg/live/4')">⚽ الشباب والرياضة</button>
        <button class="channel-btn" onclick="openRadio('إذاعة بي بي سي العربية', 'https://www.bbc.com/arabic/tv-and-radio-23136531')">🎙️ إذاعة BBC العربية</button>
        
    </div>
</div>

<script>
    const currentChannelText = document.getElementById('current-channel-name');
    const liveWindow = document.getElementById('live-window');

    function openRadio(name, url) {
        // تحديث حالة الأزرار لتحديد الزر النشط
        document.querySelectorAll('.channel-btn').forEach(btn => {
            if(btn.innerText.includes(name)) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        // تحديث نص العنوان الرئيسي
        currentChannelText.innerText = `أنت تستمع الآن إلى البث المباشر لـ: ${name}`;

        // حقن نافذة العرض الرسمية المحمية والتي لا يمكن للمتصفح حظرها
        liveWindow.innerHTML = `<iframe src="${url}" sandbox="allow-scripts allow-same-origin allow-forms" allow="autoplay"></iframe>`;
    }
</script>

</body>
</html>
