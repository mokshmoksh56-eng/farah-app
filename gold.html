<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro | Android Version</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            margin: 0; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header { 
            background: #ffd700; 
            color: #000; 
            padding: 10px; 
            font-size: 18px; 
            font-weight: bold; 
            text-align: center;
        }
        #container { 
            position: relative; 
            flex-grow: 1;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { width: 100%; height: auto; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .status-panel { 
            position: absolute;
            bottom: 80px;
            left: 5%;
            width: 90%;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            border-right: 5px solid #ffd700;
        }
        .data-line { font-size: 18px; color: #ffd700; margin-bottom: 5px; }
        .btn-start { 
            background: #ffd700; 
            border: none; 
            padding: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">نظام التتبع المدمج - Azemaa Pro 2026</div>

    <div id="container">
        <video id="videoInput" autoplay playsinline muted></video>
        <canvas id="canvasOutput"></canvas>
    </div>

    <div class="status-panel">
        <div id="materialLabel" class="data-line">اضغط للبدء...</div>
        <div id="accuracyLabel" style="color: #0f0; font-size: 14px;">جاهز للفحص الميداني</div>
    </div>

    <button class="btn-start" onclick="startSystem()">تشغيل الكاميرا والمحرك</button>

    <script>
        let model;
        const video = document.getElementById('videoInput');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d');

        async function startSystem() {
            try {
                document.getElementById('materialLabel').innerText = "جاري تحميل الذكاء الاصطناعي...";
                model = await mobilenet.load();
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    detectFrame();
                };
            } catch (err) {
                alert("يرجى السماح بصلاحية الكاميرا أو التأكد من تشغيل الموقع عبر HTTPS");
                console.error(err);
            }
        }

        async function detectFrame() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const predictions = await model.classify(video);
            if (predictions.length > 0) {
                let topResult = predictions[0];
                let label = topResult.className;
                let prob = (topResult.probability * 100).toFixed(1);

                // منطق التمييز المخصص
                if (label.includes("gold") || label.includes("brass")) {
                    updateUI("ذهب / نحاس مكتشف", prob, "#ffd700");
                } else if (label.includes("white") || label.includes("plate")) {
                    updateUI("فيبر أبيض / أسطح", prob, "#00ffcc");
                } else {
                    updateUI("جاري التحليل...", prob, "#fff");
                }
            }
            requestAnimationFrame(detectFrame);
        }

        function updateUI(text, accuracy, color) {
            document.getElementById('materialLabel').innerText = text;
            document.getElementById('accuracyLabel').innerText = `دقة التتبع: ${accuracy}%`;
            
            // رسم مربع التتبع
            ctx.strokeStyle = color;
            ctx.lineWidth = 4;
            ctx.strokeRect(canvas.width*0.25, canvas.height*0.25, canvas.width*0.5, canvas.height*0.5);
        }
    </script>
</body>
</html>
