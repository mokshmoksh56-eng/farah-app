<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض التشطيبات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* الألوان العصرية */
        /* ========================================== */
        :root {
            --bg-body: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #ec4899 100%);
            --btn-bg: #ffffff;
            --card-bg: #ffffff;
            --upload-bg: rgba(99, 102, 241, 0.05);
            --upload-border: #818cf8;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 15px 35px rgba(99, 102, 241, 0.2);
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
            --btn-bg: #1e293b;
            --card-bg: #1e293b;
            --upload-bg: rgba(139, 92, 246, 0.1);
            --upload-border: #6366f1;
            --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 15px 35px rgba(139, 92, 246, 0.4);
        }

        body { 
            font-family: 'Cairo', sans-serif; background-color: var(--bg-body); color: var(--text-main); 
            margin: 0; padding: 0; transition: 0.4s ease;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent 40%);
            min-height: 100vh;
        }

        header { 
            background: var(--glass-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--glass-border);
            text-align: center; padding: 30px 20px; margin-bottom: 40px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-soft);
        }
        header h1 { margin: 0; font-weight: 900; font-size: 2.5rem; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { margin: 10px 0 0 0; color: var(--text-muted); font-size: 1.1rem; font-weight: 700; }

        .dark-mode-toggle { 
            position: absolute; top: 50%; transform: translateY(-50%); left: 5%; background: var(--card-bg); 
            color: var(--text-main); border: none; padding: 10px 20px; border-radius: 30px; cursor: pointer; 
            font-family: 'Cairo', sans-serif; font-weight: 700; box-shadow: var(--shadow-soft); transition: 0.3s; 
        }
        .dark-mode-toggle:hover { transform: translateY(-50%) scale(1.05); box-shadow: var(--shadow-hover); }

        .container { width: 95%; max-width: 1200px; margin: auto; padding-bottom: 50px; }

        .add-category-wrapper { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 30px; 
            box-shadow: var(--shadow-soft); display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 15px; border: 1px solid var(--glass-border);
        }
        .add-category-wrapper input { 
            padding: 12px 20px; font-size: 16px; font-family: 'Cairo', sans-serif; border: 2px solid var(--upload-bg); 
            border-radius: 30px; width: 300px; background: var(--bg-body); color: var(--text-main); outline: none; transition: 0.3s;
        }
        .add-category-wrapper input:focus { border-color: #818cf8; box-shadow: 0 0 10px rgba(129, 140, 248, 0.3); }
        .add-category-wrapper button { 
            padding: 12px 30px; font-size: 16px; background: var(--primary-gradient); color: white; border: none; 
            border-radius: 30px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; 
        }
        .add-category-wrapper button:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

        .tabs-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 40px; }
        .tab-btn { 
            background-color: var(--btn-bg); color: var(--text-muted); border: none; padding: 12px 30px; 
            font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; border-radius: 30px; cursor: pointer; box-shadow: var(--shadow-soft); transition: 0.3s; 
        }
        .tab-btn:hover { transform: translateY(-3px); color: var(--text-main); }
        .tab-btn.active { background: var(--primary-gradient); color: white; box-shadow: var(--shadow-hover); transform: translateY(-3px); }

        .gallery-section { display: none; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .upload-area { 
            background: var(--upload-bg); border: 2px dashed var(--upload-border); padding: 40px 20px; 
            text-align: center; border-radius: 24px; margin-bottom: 30px; transition: 0.3s; position: relative;
        }
        .upload-area.drag-over { background: rgba(99, 102, 241, 0.2); border-color: #ec4899; transform: scale(1.02); }
        .upload-area input[type="file"] { display: none; }
        .upload-area label { 
            background: var(--card-bg); color: var(--text-main); padding: 15px 30px; border-radius: 30px; 
            cursor: pointer; font-weight: bold; display: inline-block; margin-top: 15px; box-shadow: var(--shadow-soft); transition: 0.3s;
        }
        .upload-area label:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); color: #6366f1; }
        .caption-input { 
            width: 80%; max-width: 500px; padding: 15px; border-radius: 15px; border: none; 
            font-family: 'Cairo', sans-serif; font-size: 15px; margin-bottom: 15px; background: var(--card-bg); color: var(--text-main); outline: none;
        }

        .action-btns { margin-top: 20px; display: flex; justify-content: center; gap: 15px; }
        .clear-btn { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 700; transition: 0.3s; }
        .clear-btn:hover { background: #ef4444; color: white; box-shadow: 0 5px 15px rgba(239, 68, 68, 0.3); }
        .delete-cat-btn { background: rgba(236, 72, 153, 0.1); color: #ec4899; border: 1px solid #ec4899; }
        .delete-cat-btn:hover { background: #ec4899; color: white; box-shadow: 0 5px 15px rgba(236, 72, 153, 0.3); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .img-wrapper { position: relative; border-radius: 20px; background: var(--card-bg); padding: 8px; box-shadow: var(--shadow-soft); transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .img-wrapper:hover { transform: translateY(-10px); z-index: 1; box-shadow: var(--shadow-hover); }
        .img-wrapper img { width: 100%; height: 280px; object-fit: cover; cursor: pointer; display: block; border-radius: 14px; }
        .img-caption { text-align: center; padding: 12px 5px 5px 5px; font-size: 15px; font-weight: 700; color: var(--text-main); }
        
        .delete-single-btn { 
            position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.9); color: #ef4444; 
            border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; font-size: 14px; opacity: 0; 
            display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; transform: scale(0.8);
        }
        .img-wrapper:hover .delete-single-btn { opacity: 1; transform: scale(1); }
        .delete-single-btn:hover { background: #ef4444; color: white; transform: scale(1.1) !important; }

        /* نافذة العرض المنبثقة (Modal) */
        .modal { display: none; position: fixed; z-index: 1000; padding-top: 30px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(5px); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 75vh; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .modal-caption { text-align: center; color: white; padding: 15px; font-size: 22px; font-weight: 700; font-family: 'Cairo', sans-serif; animation: popIn 0.4s ease; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .close-btn { position: absolute; top: 20px; right: 40px; color: rgba(255,255,255,0.6); font-size: 45px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { color: white; transform: rotate(90deg); }
        
        /* زر التحميل داخل النافذة */
        .download-btn {
            display: block; width: fit-content; margin: 10px auto; padding: 10px 25px; background: var(--primary-gradient);
            color: white; text-decoration: none; border-radius: 30px; font-weight: bold; font-family: 'Cairo', sans-serif;
            transition: 0.3s; animation: popIn 0.4s ease;
        }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(236, 72, 153, 0.4); }

        .no-categories-msg { text-align: center; font-size: 20px; color: var(--text-muted); font-weight: 700; margin-top: 50px; }

        /* شريط التحميل (Spinner) */
        .loader {
            display: none; border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #6366f1;
            border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* نظام الإشعارات (Toast) */
        .toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            background: var(--card-bg); color: var(--text-main); padding: 12px 25px; border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); font-family: 'Cairo', sans-serif; font-weight: 700;
            border-right: 4px solid #6366f1; animation: slideUpToast 0.3s ease, fadeOutToast 0.3s ease 2.7s forwards;
        }
        .toast.error { border-right-color: #ef4444; }
        .toast.success { border-right-color: #10b981; }
        @keyframes slideUpToast { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutToast { from { opacity: 1; } to { opacity: 0; } }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .dark-mode-toggle { position: relative; top: 0; left: 0; transform: none; margin-bottom: 15px; }
            .add-category-wrapper input { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <button class="dark-mode-toggle" onclick="toggleDarkMode()">✨ مظهر فخم</button>
        <h1>معرض التشطيبات</h1>
        <p>نظام احترافي لإدارة أعمالك بضغطة زر</p>
    </header>

    <div class="container">
        <div class="add-category-wrapper">
            <input type="text" id="newCategoryName" placeholder="اكتب اسم القسم (مثال: جبس بورد، أرضيات)">
            <button onclick="addNewCategory()">✨ إنشاء القسم</button>
        </div>

        <div class="tabs-container" id="tabs-container"></div>
        <div id="sections-container"></div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div id="imageModal" class="modal" onclick="closeFullscreen(event)">
        <span class="close-btn" onclick="closeFullscreen(event)">&times;</span>
        <img class="modal-content" id="fullImage">
        <div class="modal-caption" id="fullImageCaption"></div>
        <a id="downloadLink" class="download-btn" href="#" download="image.jpg">⬇️ تحميل الصورة</a>
    </div>

    <script>
        // ==========================================
        // نظام الإشعارات الذكي (بديل Alert)
        // ==========================================
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            // إزالة الإشعار بعد 3 ثواني
            setTimeout(() => { toast.remove(); }, 3000);
        }

        // ==========================================
        // الوضع الليلي
        // ==========================================
        function initDarkMode() {
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.body.classList.add('dark-mode');
            }
        }
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode') ? 'enabled' : 'disabled');
        }
        initDarkMode();

        // ==========================================
        // إدارة الأقسام
        // ==========================================
        let appCategories = [];

        function initializeCategories() {
            let savedCategories = localStorage.getItem('appCategories');
            if (!localStorage.getItem('appInitialized')) {
                appCategories = [
                    { id: 'kitchens', name: 'المطابخ' },
                    { id: 'windows', name: 'الشبابيك' },
                    { id: 'bathrooms', name: 'وحدات الحمام' },
                    { id: 'doors', name: 'الأبواب' },
                    { id: 'decor', name: 'الديكورات' }
                ];
                localStorage.setItem('appCategories', JSON.stringify(appCategories));
                localStorage.setItem('appInitialized', 'true');
            } else {
                appCategories = savedCategories ? JSON.parse(savedCategories) : [];
            }
            renderAllCategories();
        }

        function renderAllCategories() {
            const tabsContainer = document.getElementById('tabs-container');
            const sectionsContainer = document.getElementById('sections-container');
            tabsContainer.innerHTML = ''; sectionsContainer.innerHTML = '';

            if (appCategories.length === 0) {
                sectionsContainer.innerHTML = '<div class="no-categories-msg">لا يوجد أي أقسام حالياً. ابدأ بإضافة أقسامك من الأعلى! ✨</div>';
                return;
            }

            appCategories.forEach((cat) => {
                const tabBtn = document.createElement('button');
                tabBtn.className = 'tab-btn';
                tabBtn.id = 'btn-' + cat.id;
                tabBtn.innerText = cat.name;
                tabBtn.onclick = function(event) { openCategory(event, cat.id); };
                tabsContainer.appendChild(tabBtn);

                const sectionDiv = document.createElement('div');
                sectionDiv.id = cat.id;
                sectionDiv.className = 'gallery-section';
                sectionDiv.innerHTML = `
                    <div class="upload-area" id="upload-area-${cat.id}">
                        <input type="text" id="caption-${cat.id}" class="caption-input" placeholder="هل تريد إضافة وصف للصورة؟ (اختياري)">
                        <br>
                        <label for="upload-${cat.id}">📸 اختر صورك أو اسحبها هنا مباشرة</label>
                        <input type="file" id="upload-${cat.id}" multiple accept="image/*" onchange="handleFileSelect(event, '${cat.id}')">
                        <div class="loader" id="loader-${cat.id}"></div>
                        <div class="action-btns">
                            <button class="clear-btn" onclick="clearAllImagesInCategory('${cat.id}')">🗑️ تفريغ الصور</button>
                            <button class="clear-btn delete-cat-btn" onclick="deleteFullCategory('${cat.id}', '${cat.name}')">❌ حذف القسم</button>
                        </div>
                    </div>
                    <div class="gallery-grid" id="grid-${cat.id}"></div>
                `;
                sectionsContainer.appendChild(sectionDiv);
                setupDragAndDrop(cat.id);
            });

            if(appCategories.length > 0) {
                document.getElementById(appCategories[0].id).style.display = 'block';
                document.getElementById('btn-' + appCategories[0].id).classList.add('active');
            }
        }

        function addNewCategory() {
            const nameInput = document.getElementById('newCategoryName');
            const name = nameInput.value.trim();
            if (!name) { showToast("رجاءً اكتب اسم القسم أولاً!", "error"); return; }

            const newId = 'cat_' + Date.now(); 
            appCategories.push({id: newId, name: name});
            localStorage.setItem('appCategories', JSON.stringify(appCategories));
            
            nameInput.value = '';
            renderAllCategories();
            openCategory(null, newId);
            showToast(`تم إنشاء قسم "${name}" بنجاح!`, "success");
        }

        function deleteFullCategory(id, name) {
            if(confirm(`هل أنت متأكد من مسح قسم "${name}" بكل صوره نهائياً؟`)) {
                db.transaction(["images"], "readwrite").objectStore("images").index("category").openCursor(IDBKeyRange.only(id)).onsuccess = function(e) {
                    const cursor = e.target.result;
                    if (cursor) { e.target.source.objectStore.delete(cursor.primaryKey); cursor.continue(); }
                    else {
                        appCategories = appCategories.filter(cat => cat.id !== id);
                        localStorage.setItem('appCategories', JSON.stringify(appCategories));
                        renderAllCategories();
                        showToast("تم حذف القسم بنجاح.", "success");
                    }
                };
            }
        }

        // ==========================================
        // نظام ضغط الصور التلقائي (للحفاظ على المساحة)
        // ==========================================
        function compressImage(base64Str, callback) {
            const img = new Image();
            img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1200; // أقصى عرض للصورة
                const MAX_HEIGHT = 1200;
                let width = img.width;
                let height = img.height;

                // حساب الأبعاد الجديدة مع الحفاظ على النسبة
                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // ضغط الصورة لجودة 80%
                callback(canvas.toDataURL('image/jpeg', 0.8));
            };
        }

        // ==========================================
        // السحب والإفلات وقراءة الصور
        // ==========================================
        function setupDragAndDrop(categoryId) {
            const area = document.getElementById(`upload-area-${categoryId}`);
            if(!area) return;
            area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('drag-over'); });
            area.addEventListener('dragleave', () => { area.classList.remove('drag-over'); });
            area.addEventListener('drop', (e) => { e.preventDefault(); area.classList.remove('drag-over'); processFiles(e.dataTransfer.files, categoryId); });
        }

        function handleFileSelect(event, category) { processFiles(event.target.files, category); event.target.value = ""; }

        function processFiles(files, category) {
            if(files.length === 0) return;
            const captionInput = document.getElementById(`caption-${category}`);
            const captionText = captionInput ? captionInput.value.trim() : "";
            const loader = document.getElementById(`loader-${category}`);
            loader.style.display = "block"; // إظهار شريط التحميل

            let processedCount = 0;
            for (let i = 0; i < files.length; i++) {
                if(!files[i].type.match('image.*')) { processedCount++; continue; }
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    // استخدام نظام الضغط قبل الحفظ
                    compressImage(e.target.result, function(compressedBase64) {
                        saveImageToDB(category, compressedBase64, captionText);
                        processedCount++;
                        if(processedCount === files.length) {
                            loader.style.display = "none"; // إخفاء شريط التحميل
                            if(captionInput) captionInput.value = "";
                            showToast(`تم إضافة ${files.length} صورة بنجاح!`, "success");
                        }
                    });
                }
                reader.readAsDataURL(files[i]);
            }
        }

        // ==========================================
        // قاعدة البيانات IndexedDB
        // ==========================================
        let db;
        const request = window.indexedDB.open("GalleryProDB", 2);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            if (!db.objectStoreNames.contains("images")) {
                const objectStore = db.createObjectStore("images", { keyPath: "id", autoIncrement: true });
                objectStore.createIndex("category", "category", { unique: false });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            initializeCategories();
            loadAllSavedImages();
        };

        function saveImageToDB(category, base64Image, caption) {
            const store = db.transaction(["images"], "readwrite").objectStore("images");
            store.add({ category: category, data: base64Image, caption: caption }).onsuccess = function(e) {
                renderSingleImageInGrid(category, base64Image, caption, e.target.result);
            };
        }

        function renderSingleImageInGrid(category, imageSrc, captionText, imageId) {
            const grid = document.getElementById("grid-" + category);
            if(!grid) return;

            const wrapper = document.createElement("div");
            wrapper.className = "img-wrapper";
            wrapper.id = "img-wrap-" + imageId;

            const img = document.createElement("img");
            img.src = imageSrc;
            img.onclick = function() { openFullscreen(imageSrc, captionText); };

            const delBtn = document.createElement("button");
            delBtn.className = "delete-single-btn";
            delBtn.innerHTML = "🗑️";
            delBtn.title = "حذف الصورة";
            delBtn.onclick = function(e) { e.stopPropagation(); deleteSingleImageFromDB(imageId, wrapper.id); };

            wrapper.appendChild(img);
            wrapper.appendChild(delBtn);
            if(captionText) {
                const cap = document.createElement("div"); cap.className = "img-caption"; cap.innerText = captionText; wrapper.appendChild(cap);
            }
            // Add new image at the beginning (top)
            grid.insertBefore(wrapper, grid.firstChild);
        }

        function loadAllSavedImages() {
            db.transaction(["images"], "readonly").objectStore("images").openCursor().onsuccess = function(e) {
                const cursor = e.target.result;
                if (cursor) {
                    renderSingleImageInGrid(cursor.value.category, cursor.value.data, cursor.value.caption, cursor.value.id);
                    cursor.continue();
                }
            };
        }

        function deleteSingleImageFromDB(imageId, wrapperElementId) {
            if(confirm("تمسح الصورة دي؟")) {
                db.transaction(["images"], "readwrite").objectStore("images").delete(imageId).onsuccess = function() {
                    document.getElementById(wrapperElementId).remove();
                    showToast("تم حذف الصورة.", "success");
                };
            }
        }

        function clearAllImagesInCategory(category) {
            if(confirm("هتمسح كل الصور في القسم ده، متأكد؟")) {
                db.transaction(["images"], "readwrite").objectStore("images").index("category").openCursor(IDBKeyRange.only(category)).onsuccess = function(e) {
                    const cursor = e.target.result;
                    if (cursor) { e.target.source.objectStore.delete(cursor.primaryKey); cursor.continue(); }
                    else {
                        document.getElementById("grid-" + category).innerHTML = '';
                        showToast("تم تفريغ القسم بنجاح.", "success");
                    }
                };
            }
        }

        // ==========================================
        // التنقل والنوافذ
        // ==========================================
        function openCategory(evt, categoryName) {
            let sections = document.getElementsByClassName("gallery-section");
            for (let i = 0; i < sections.length; i++) sections[i].style.display = "none";
            let btns = document.getElementsByClassName("tab-btn");
            for (let i = 0; i < btns.length; i++) btns[i].classList.remove("active");
            
            const section = document.getElementById(categoryName);
            const btn = document.getElementById('btn-' + categoryName);
            if(section) section.style.display = "block";
            if(btn) btn.classList.add("active");
        }

        function openFullscreen(imageSrc, captionText) {
            const modal = document.getElementById("imageModal");
            document.getElementById("fullImage").src = imageSrc;
            document.getElementById("fullImageCaption").innerText = captionText || "";
            
            // تحديث زر التحميل
            const downloadBtn = document.getElementById("downloadLink");
            downloadBtn.href = imageSrc;
            // تسمية الملف المحمل بناءً على الوصف أو اسم افتراضي
            downloadBtn.download = captionText ? captionText + ".jpg" : "finishing-work.jpg";

            modal.style.display = "block";
        }

        function closeFullscreen(event) {
            if (event.target.id === "imageModal" || event.target.className === "close-btn") {
                document.getElementById("imageModal").style.display = "none";
            }
        }
    </script>
</body>
</html>
