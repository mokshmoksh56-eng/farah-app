<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>azemaa proo 💰 | الحضور والعمال الشامل</title>
    <style>
        :root {
            --whatsapp-green: #25D366; --dark-green: #075E54; --teal: #128C7E;
            --bg-gray: #f0f2f5; --white: #ffffff; --danger: #d32f2f;
            --warning: #f57c00;
            --gold: #D4AF37;
            --today-glow: rgba(212, 175, 55, 0.25);
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; font-weight: 600; padding-bottom: 80px; }
        
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gray);
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: var(--dark-green); font-weight: bold;
        }

        header { 
            background: linear-gradient(135deg, var(--dark-green), var(--teal)); 
            color: var(--white); padding: 15px 10px; text-align: center; 
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .sync-indicator { font-size: 11px; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; display: inline-block; transition: 0.3s; }
        .header-title { font-size: 1.3rem; font-weight: 900; letter-spacing: 0px; }
        .header-title span { color: var(--gold); }
        #weekRangeDisplay { font-size: 13px; margin-top: 5px; background: rgba(0,0,0,0.1); display: inline-block; padding: 2px 10px; border-radius: 10px; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .dash-card { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(2px); padding: 8px 2px; border-radius: 12px; }
        .dash-card strong { font-size: 15px; display: block; }

        .main-container { padding: 12px; }
        .config-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .date-selectors { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
        .date-selectors select { 
            flex: 1; padding: 12px 5px; border-radius: 12px; border: 2px solid var(--teal); 
            font-weight: 900; background: #f9f9f9; cursor: pointer; text-align: center;
            transition: all 0.2s ease;
        }
        .date-selectors select.glowing-today {
            border: 2px solid var(--gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.7), 0 0 8px rgba(212, 175, 55, 0.4);
            background: linear-gradient(145deg, #fff8e7, #fffef5);
            color: #3b2a0f;
        }

        #cardsList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (max-width: 550px) { #cardsList { grid-template-columns: 1fr; } }
        
        .worker-card { background: var(--white); border-radius: 15px; padding: 12px; border-top: 5px solid var(--gold); box-shadow: 0 3px 10px rgba(0,0,0,0.08); position: relative;}
        
        .card-name { display: flex; justify-content: space-between; align-items: center; font-size: 16px; color: var(--dark-green); margin-bottom: 10px; font-weight: 900; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .lock-btn { background: var(--danger); color: white; border: none; padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .lock-btn.unlocked { background: var(--whatsapp-green); }

        .salary-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #fffcf0; padding: 5px; border-radius: 8px; }
        .salary-input { width: 80px; padding: 5px; border-radius: 5px; border: 1.5px solid #ddd; font-weight: 900; text-align: center; }

        .day-row { display: flex; align-items: center; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 5px; gap: 4px; margin-bottom: 4px; transition: all 0.2s ease; }
        .day-row.today-glow {
            background: linear-gradient(145deg, #fff9e6, #fff6e0);
            border: 1px solid var(--gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.6), inset 0 0 5px rgba(255, 215, 0, 0.3);
            position: relative;
        }
        .day-info { flex: 1.2; font-size: 12px; font-weight: 900; text-align: right; }
        .day-date { font-size: 10px; color: #555; display: block; font-weight: bold; }
        
        .att-btns { display: flex; gap: 2px; flex: 2; }
        .btn-tgl { flex: 1; border: 1px solid #ccc; background: #fff; font-size: 11px; font-weight: 900; padding: 8px 0; border-radius: 5px; cursor: pointer; transition: 0.2s;}
        
        /* ألوان الأزرار النشطة */
        .btn-tgl.active[data-v="1"] { background: var(--whatsapp-green); color: white; border-color: var(--whatsapp-green); }
        .btn-tgl.active[data-v="0.5"] { background: var(--warning); color: white; border-color: var(--warning); }
        .btn-tgl.active[data-v="0"] { background: var(--danger); color: white; border-color: var(--danger); }
        
        .loan-input { width: 55px; border: 1px solid #ddd; border-radius: 5px; padding: 8px 0; text-align: center; font-weight: 900; color: var(--danger); background: #fff; }

        /* ستايل الخانات المقفلة (للحماية) */
        input:disabled, textarea:disabled, button.btn-tgl:disabled:not(.active) {
            background-color: #e9ecef !important;
            color: #6c757d !important;
            cursor: not-allowed !important;
            border-color: #dee2e6 !important;
            opacity: 0.8;
        }

        /* الاحتفاظ بلون الزر النشط حتى وهو مقفل */
        button.btn-tgl.active:disabled {
            cursor: not-allowed !important;
            opacity: 0.9; 
        }

        .note-input { 
            width: 100%; 
            margin-top: 10px; 
            padding: 10px; 
            border-radius: 8px; 
            border: 1.5px solid #ccc; 
            font-size: 13px; 
            background: #fffef2; 
            box-sizing: border-box; 
            resize: none; 
            min-height: 70px; 
            font-weight: 700;
            overflow: hidden;
            transition: height 0.2s ease;
        }
        
        .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 13px; font-weight: 900; }
        
        .card-buttons { display: flex; gap: 8px; margin-top: 10px; }
        .btn-share { flex: 1; background: var(--whatsapp-green); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; }
        .btn-save-manual { flex: 1; background: var(--teal); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; }

        .archive-box { background: white; border-radius: 15px; padding: 15px; margin-top: 20px; border: 2px solid var(--gold); margin-bottom: 20px; }
        .archive-box h3 { color: var(--dark-green); }
        .archive-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; background: white; border-radius: 8px; overflow: hidden; }
        .archive-table th { background: #eee; padding: 8px; border: 1px solid #ddd; text-align: center; }
        .archive-table td { padding: 8px; border: 1px solid #ddd; text-align: center; font-weight: 700; }

        .attendance-details { background: #fafafa; margin-top: 15px; border-radius: 12px; padding: 10px; border-right: 4px solid var(--gold); }
        .att-row-detail { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin: 6px 0; padding: 4px; background: white; border-radius: 8px; }
        .day-badge { font-weight: 900; color: var(--dark-green); text-align: right; }
        .status-badge { font-weight: bold; }
        .status-h { color: var(--whatsapp-green); }
        .status-half { color: var(--warning); }
        .status-a { color: var(--danger); }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.db = db; window.ref = ref; window.update = update; window.get = get; window.set = set;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUid = user.uid;
                document.getElementById('auth-loader').style.display = 'none';
                initSystem();
                scheduleDailyArchive(); 
            }
        });
    </script>
</head>
<body>

<div id="auth-loader">⏳ جاري الاتصال الآمن بالسحابة...</div>

<header>
    <div class="sync-indicator" id="syncStatus">✅ متصل ومؤمن</div>
    <div class="header-title">azemaa proo <span>💰</span></div>
    <div id="weekRangeDisplay">...</div>
    <div class="dashboard">
        <div class="dash-card"><span>رواتب</span><strong id="stat-sal">0</strong></div>
        <div class="dash-card"><span>سلفيات</span><strong id="stat-loan">0</strong></div>
        <div class="dash-card"><span>صافي الدفع</span><strong id="stat-net" style="color:var(--whatsapp-green)">0</strong></div>
    </div>
</header>

<div class="main-container">
    <div class="config-box">
        
        <div class="date-selectors">
            <select id="dayPicker" onchange="updateDateFromSelectors()"></select>
            <select id="monthPicker" onchange="updateDateFromSelectors()">
                <option value="0">01</option><option value="1">02</option><option value="2">03</option>
                <option value="3">04</option><option value="4">05</option><option value="5">06</option>
                <option value="6">07</option><option value="7">08</option><option value="8">09</option>
                <option value="9">10</option><option value="10">11</option><option value="11">12</option>
            </select>
            <select id="yearPicker" onchange="updateDateFromSelectors()"></select>
        </div>
        <input type="hidden" id="datePicker" onchange="handleDateChange()">

        <details style="margin-top: 15px;">
            <summary style="font-weight: 900; color: var(--gold); cursor: pointer; text-align: center; background: #f9f9f9; padding: 10px; border-radius: 10px;">⚙️ الإعدادات وإضافة العمال 💰</summary>
            
            <div style="margin-top: 15px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; background: #f0f7f4; padding: 10px; border-radius: 12px; border: 1px dashed var(--teal);">
                <label style="font-weight: 900; color: var(--dark-green);">🌍 دولة الحساب:</label>
                <select id="countryCurrency" onchange="updateCurrency()" style="padding: 8px 12px; border-radius: 8px; border: 2px solid var(--teal); font-weight: 900; background: #fff; cursor: pointer; flex: 1;">
                    <option value="ج.م">🇪🇬 مصر (ج.م)</option>
                    <option value="ر.س">🇸🇦 السعودية (ر.س)</option>
                    <option value="د.إ">🇦🇪 الإمارات (د.إ)</option>
                    <option value="د.ك">🇰🇼 الكويت (د.ك)</option>
                    <option value="ر.ق">🇶🇦 قطر (ر.ق)</option>
                    <option value="ر.ع">🇴🇲 عمان (ر.ع)</option>
                    <option value="د.ب">🇧🇭 البحرين (د.ب)</option>
                    <option value="د.أ">🇯🇴 الأردن (د.أ)</option>
                    <option value="د.ل">🇱🇾 ليبيا (د.ل)</option>
                    <option value="د.ع">🇮🇶 العراق (د.ع)</option>
                    <option value="د.ج">🇩🇿 الجزائر (د.ج)</option>
                    <option value="د.م">🇲🇦 المغرب (د.م)</option>
                    <option value="$">🇺🇸 دولار ($)</option>
                    <option value="€">🇪🇺 يورو (€)</option>
                </select>
            </div>

            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="workerNameInp" style="flex:2; border: 1px solid #ddd; padding: 8px; border-radius: 8px;" placeholder="اسم عامل جديد">
                <button onclick="addNewWorker()" style="background:var(--gold); color:#3b2a0f; border:none; padding:0 15px; border-radius:8px; font-weight: 900;">إضافة 🧑‍🏭</button>
            </div>
            <div id="workerListEditor" style="margin-top:10px;"></div>
        </details>
    </div>

    <div id="cardsList"></div>

    <div class="archive-box">
        <h3 style="text-align:center; margin:0 0 10px 0;">📂 الأرشيف التفصيلي للعمال 💰</h3>
        <button onclick="forceArchiveNow(this)" style="width:100%; margin-bottom: 15px; background:var(--teal); color:white; border:none; padding:12px; border-radius:10px; font-weight:900; cursor:pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">📦 حفظ جميع العمال في الأرشيف الآن</button>
        
        <select id="archiveSearch" onchange="fetchAndBuildArchive()" style="width:100%; padding:12px; border-radius:10px; font-weight:900; border:2px solid var(--gold); outline:none;">
            <option value="">-- اختر اسم العامل لعرض أرشيفه --</option>
        </select>
        <div id="archiveContent" style="margin-top:15px;"></div>
    </div>
</div>

<script>
    const weekdays = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    let masterWorkers = [];
    let currentWeekID = "";
    let currentWeekDates = [];     
    let currentFullDates = [];     
    let allArchiveData = {};
    
    // تعريف متغير العملة العالمي واستدعاؤه من الذاكرة
    let currentCurrency = localStorage.getItem('workerCurrency') || 'ج.م';

    function initSystem() {
        initCurrency();
        initDateSelectors();
        loadMasterWorkers();
        applyGlowToCurrentDayPicker();
    }

    // تهيئة قائمة اختيار العملة
    function initCurrency() {
        document.getElementById('countryCurrency').value = currentCurrency;
    }

    // تحديث العملة عند تغييرها من القائمة
    function updateCurrency() {
        currentCurrency = document.getElementById('countryCurrency').value;
        localStorage.setItem('workerCurrency', currentCurrency);
        
        // إعادة حساب وعرض جميع الكروت لتحديث الرموز
        masterWorkers.forEach((_, i) => recalc(i));
        
        // تحديث الأرشيف إذا كان مفتوحاً
        if (document.getElementById('archiveContent').innerHTML !== "") {
            fetchAndBuildArchive();
        }
    }

    function initDateSelectors() {
        const dSel = document.getElementById('dayPicker');
        const ySel = document.getElementById('yearPicker');
        const now = new Date();
        for(let i=1; i<=31; i++) dSel.add(new Option(i, i, i === now.getDate(), i === now.getDate()));
        for(let i = 2024; i <= 2030; i++) ySel.add(new Option(i, i, i === now.getFullYear(), i === now.getFullYear()));
        document.getElementById('monthPicker').value = now.getMonth();
        updateDateFromSelectors();
    }

    function applyGlowToCurrentDayPicker() {
        const daySelect = document.getElementById('dayPicker');
        const monthSelect = document.getElementById('monthPicker');
        const yearSelect = document.getElementById('yearPicker');
        
        const today = new Date();
        const currentDay = today.getDate();
        const currentMonth = today.getMonth();
        const currentYear = today.getFullYear();
        
        daySelect.classList.remove('glowing-today');
        monthSelect.classList.remove('glowing-today');
        yearSelect.classList.remove('glowing-today');
        
        const selectedDay = parseInt(daySelect.value);
        const selectedMonth = parseInt(monthSelect.value);
        const selectedYear = parseInt(yearSelect.value);
        
        if (selectedDay === currentDay && selectedMonth === currentMonth && selectedYear === currentYear) {
            daySelect.classList.add('glowing-today');
        }
    }

    function updateDateFromSelectors() {
        // سحب القيم كأرقام مباشرة لمنع مشاكل المتصفحات في قراءة النصوص
        const d = parseInt(document.getElementById('dayPicker').value);
        const m = parseInt(document.getElementById('monthPicker').value); 
        const y = parseInt(document.getElementById('yearPicker').value);
        
        // بناء التاريخ بالتوقيت المحلي مباشرة
        const pickedDate = new Date(y, m, d);
        
        handleDateChange(pickedDate);
        applyGlowToCurrentDayPicker();
    }

    function handleDateChange(pickedDate = null) {
        // في حالة استدعاء الدالة بدون تاريخ، يتم بناءه من القوائم
        if (!pickedDate) {
            const d = parseInt(document.getElementById('dayPicker').value);
            const m = parseInt(document.getElementById('monthPicker').value);
            const y = parseInt(document.getElementById('yearPicker').value);
            pickedDate = new Date(y, m, d);
        }
        
        if (isNaN(pickedDate)) return;

        let dayOfWeek = pickedDate.getDay();
        let diffToSaturday = (dayOfWeek === 6) ? 0 : (dayOfWeek + 1);
        let saturday = new Date(pickedDate);
        saturday.setDate(pickedDate.getDate() - diffToSaturday);
        
        // استخراج السنة والشهر واليوم بالتوقيت المحلي لتكوين الـ ID
        let sy = saturday.getFullYear();
        let sm = (saturday.getMonth() + 1).toString().padStart(2, '0');
        let sd = saturday.getDate().toString().padStart(2, '0');
        currentWeekID = `${sy}-${sm}-${sd}`;
        
        currentWeekDates = [];
        currentFullDates = [];
        for(let i=0; i<6; i++) {
            let tmp = new Date(saturday);
            tmp.setDate(saturday.getDate() + i);
            currentFullDates.push(tmp);
            
            let dayNum = tmp.getDate().toString().padStart(2, '0');
            let monthNum = (tmp.getMonth() + 1).toString().padStart(2, '0');
            let yearNum = tmp.getFullYear();
            
            let fullDateStr = `${yearNum}/${monthNum}/${dayNum}`;
            currentWeekDates.push(fullDateStr);
        }
        document.getElementById('weekRangeDisplay').innerText = `أسبوع السبت ${currentWeekDates[0]}`;
        loadWeekData();
    }

    function isDateToday(dayIndex) {
        if (!currentFullDates[dayIndex]) return false;
        const today = new Date();
        const targetDate = currentFullDates[dayIndex];
        return targetDate.getDate() === today.getDate() &&
               targetDate.getMonth() === today.getMonth() &&
               targetDate.getFullYear() === today.getFullYear();
    }

    function loadMasterWorkers() {
        if(!window.db || !window.currentUid) return;
        get(ref(window.db, `backups/workers_master/${window.currentUid}`)).then((snapshot) => {
            let rawData = snapshot.exists() ? snapshot.val() : [];
            masterWorkers = Array.isArray(rawData) ? rawData : Object.values(rawData);
            masterWorkers = masterWorkers.filter(w => w && w.name);
            
            updateWorkerEditor();
            updateArchiveDropdown();
            loadWeekData();
        }).catch((error) => console.error("Error loading workers:", error));
    }

    function addNewWorker() {
        const name = document.getElementById('workerNameInp').value.trim();
        if(!name) return;
        masterWorkers.push({ name: name, inst_weekly: 0, sal: '' });
        document.getElementById('workerNameInp').value = "";
        saveMasterWorkers();
        
        setTimeout(() => {
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }, 300);
    }

    function removeWorker(idx) {
        if(confirm("⚠️ هل تريد حذف هذا العامل من النظام نهائياً؟")) {
            masterWorkers.splice(idx, 1);
            saveMasterWorkers();
        }
    }

    function saveMasterWorkers() {
        if(!window.db || !window.currentUid) return;
        set(ref(window.db, `backups/workers_master/${window.currentUid}`), masterWorkers).then(() => {
            updateWorkerEditor();
            updateArchiveDropdown();
            loadWeekData(); 
        });
    }

    function updateWorkerEditor() {
        const box = document.getElementById('workerListEditor');
        box.innerHTML = masterWorkers.map((w, idx) => `
            <div style="display:flex; justify-content:space-between; background:#f5f6fa; padding:5px 10px; border-radius:8px; margin-bottom:4px; align-items:center; font-size:13px;">
                <span>💰 👷 ${w.name}</span>
                <button onclick="removeWorker(${idx})" style="color:red; border:none; background:transparent; cursor:pointer; font-weight:bold;">🗑️</button>
            </div>
        `).join('');
    }

    async function loadWeekData() {
        if(!window.currentUid || masterWorkers.length === 0) {
            document.getElementById('cardsList').innerHTML = "";
            return;
        }
        const snap = await window.get(window.ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}`));
        const saved = snap.exists() ? snap.val() : {};
        
        document.getElementById('cardsList').innerHTML = masterWorkers.map((worker, idx) => {
            let d = saved[idx] || {};
            let needsInitialSave = false; // متغير لمعرفة إذا كان الكارت جديد ويحتاج حفظ مبدئي تلقائي
            
            let sal = (d.sal !== undefined && d.sal !== '') ? d.sal : (worker.sal || '');
            
            let att = [1, 1, 1, 1, 1, 1];
            if (d.att) {
                for (let i = 0; i < 6; i++) {
                    att[i] = d.att[i] !== undefined ? parseFloat(d.att[i]) : 1;
                }
            } else {
                needsInitialSave = true; // لا يوجد حضور مسجل، إذن نحتاج لرفعه للسيرفر
            }

            let loans = ['', '', '', '', '', ''];
            if (d.loans) {
                for (let i = 0; i < 6; i++) {
                    loans[i] = d.loans[i] !== undefined ? d.loans[i] : '';
                }
            } else {
                needsInitialSave = true;
            }

            let note = d.note || '';

            // ====== حفظ تلقائي في الخلفية للقيم الافتراضية (كله حضور) ======
            if (needsInitialSave && window.currentUid && currentWeekID) {
                update(ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${idx}`), {
                    att: att,
                    loans: loans,
                    sal: sal,
                    name: worker.name
                });
            }

            let daysHtml = '';
            for(let di = 0; di < 6; di++) {
                const isToday = isDateToday(di);
                const todayClass = isToday ? 'today-glow' : '';
                daysHtml += `
                    <div class="day-row ${todayClass}">
                        <div class="day-info">
                            <span>${weekdays[di]}</span>
                            <span class="day-date">${currentWeekDates[di]}</span>
                        </div>
                        <div class="att-btns">
                            <button disabled class="btn-tgl ${att[di]==1?'active':''}" data-v="1" onclick="toggleAtt(this,${idx},${di})">ح</button>
                            <button disabled class="btn-tgl ${att[di]==0.5?'active':''}" data-v="0.5" onclick="toggleAtt(this,${idx},${di})">½</button>
                            <button disabled class="btn-tgl ${att[di]==0?'active':''}" data-v="0" onclick="toggleAtt(this,${idx},${di})">غ</button>
                        </div>
                        <input disabled type="number" class="loan-input" value="${loans[di] !== undefined ? loans[di] : ''}" placeholder="سلفة" onchange="syncArrayData(${idx}, 'loans', ${di}, this.value)">
                    </div>
                `;
            }

            return `
                <div class="worker-card" id="card-${idx}" data-locked="true">
                    <div class="card-name">
                        <span>💰 ${worker.name}</span>
                        <button class="lock-btn" onclick="toggleEditCard(${idx})">🔒 تعديل</button>
                    </div>
                    <div class="salary-row">
                        <label style="font-size:12px;">الراتب الأساسي (ثابت):</label>
                        <input disabled type="number" class="salary-input" value="${sal}" placeholder="الراتب" onchange="syncSalary(${idx}, this.value)">
                    </div>
                    <div class="days-grid">
                        ${daysHtml}
                    </div>
                    <textarea disabled class="note-input" placeholder="ملاحظات ومسحوبات أخرى..." onblur="syncData(${idx}, 'note', this.value)" oninput="this.style.height = 'auto'; this.style.height = (this.scrollHeight) + 'px';">${note}</textarea>
                    
                    <div class="card-footer">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span>أيام الحضور: <span class="sum-a">0</span></span>
                            <span>إجمالي السلف: <span class="sum-l" style="color:var(--danger)">0</span></span>
                        </div>
                        <div style="display:flex; justify-content:space-between; border-top:1px solid #ddd; padding-top:5px;">
                            <span style="color:var(--dark-green);">الصافي المستحق:</span>
                            <span class="sum-n" data-val="0" style="color:var(--gold); font-size:16px;">0</span>
                        </div>
                    </div>
                    <div class="card-buttons">
                        <button class="btn-save-manual" onclick="manualSaveWorker(${idx})">حفظ 💾</button>
                        <button class="btn-share" onclick="shareToWhatsApp(${idx})">واتساب 🟢</button>
                    </div>
                </div>`;
        }).join('');
        
        document.querySelectorAll('.note-input').forEach(textarea => {
            if (textarea.value) {
                textarea.style.height = 'auto';
                textarea.style.height = (textarea.scrollHeight) + 'px';
            }
        });

        masterWorkers.forEach((_, i) => recalc(i));
    }

    function toggleEditCard(idx) {
        const card = document.getElementById(`card-${idx}`);
        const isLocked = card.getAttribute('data-locked') === 'true';
        const lockBtn = card.querySelector('.lock-btn');
        
        if (isLocked) {
            card.setAttribute('data-locked', 'false');
            lockBtn.innerHTML = '🔓 مفتوح';
            lockBtn.classList.add('unlocked');
            card.querySelectorAll('input, textarea, button.btn-tgl').forEach(el => el.removeAttribute('disabled'));
        } else {
            card.setAttribute('data-locked', 'true');
            lockBtn.innerHTML = '🔒 تعديل';
            lockBtn.classList.remove('unlocked');
            card.querySelectorAll('input, textarea, button.btn-tgl').forEach(el => el.setAttribute('disabled', 'true'));
            // لم نعد نحتاج الحفظ هنا لأن الحفظ التلقائي يعمل دائماً
        }
    }

    function toggleAtt(btn, wIdx, dIdx) {
        if (btn.hasAttribute('disabled')) return; 
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // هنا يتم الحفظ التلقائي لأي تعديل تقوم به
        syncArrayData(wIdx, 'att', dIdx, btn.dataset.v);
    }

    function syncData(wIdx, field, val) {
        setSyncStatus(true);
        update(ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${wIdx}`), { [field]: val, name: masterWorkers[wIdx].name }).then(() => setSyncStatus(false));
        recalc(wIdx);
    }

    function syncSalary(wIdx, val) {
        setSyncStatus(true);
        update(ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${wIdx}`), { sal: val, name: masterWorkers[wIdx].name }).then(() => setSyncStatus(false));
        masterWorkers[wIdx].sal = val;
        update(ref(window.db, `backups/workers_master/${window.currentUid}/${wIdx}`), { sal: val });
        recalc(wIdx);
    }

    function syncArrayData(wIdx, field, dIdx, val) {
        setSyncStatus(true);
        update(ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${wIdx}`), { 
            [`${field}/${dIdx}`]: val, 
            name: masterWorkers[wIdx].name 
        }).then(() => setSyncStatus(false));
        recalc(wIdx);
    }

    function manualSaveWorker(idx) {
        const card = document.getElementById(`card-${idx}`);
        if (!card) return;

        let sal = parseFloat(card.querySelector('.salary-input').value) || '';
        let note = card.querySelector('.note-input').value || '';
        
        let loans = [];
        card.querySelectorAll('.loan-input').forEach(input => {
            loans.push(input.value || '');
        });

        let att = [];
        card.querySelectorAll('.att-btns').forEach(group => {
            let activeBtn = group.querySelector('.btn-tgl.active');
            att.push(activeBtn ? activeBtn.dataset.v : "1");
        });

        setSyncStatus(true);
        const path = `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${idx}`;
        
        update(ref(window.db, path), {
            sal: sal,
            note: note,
            loans: loans,
            att: att,
            name: masterWorkers[idx].name
        }).then(() => {
            masterWorkers[idx].sal = sal;
            update(ref(window.db, `backups/workers_master/${window.currentUid}/${idx}`), { sal: sal }).then(() => {
                setSyncStatus(false);
                recalc(idx);
                const saveBtn = card.querySelector('.btn-save-manual');
                const originalText = saveBtn.innerText;
                saveBtn.innerText = "تم الحفظ 💰";
                saveBtn.style.background = "var(--whatsapp-green)";
                setTimeout(() => {
                    saveBtn.innerText = originalText;
                    saveBtn.style.background = "var(--teal)";
                }, 1500);
            });
        });
    }

    function setSyncStatus(isSyncing) {
        const el = document.getElementById('syncStatus');
        if(isSyncing) {
            el.innerText = "⏳ جاري التحديث..."; el.style.background = "var(--warning)"; el.style.color = "white";
        } else {
            el.innerText = "✅ تم الحفظ"; el.style.background = "var(--whatsapp-green)"; el.style.color = "white";
            setTimeout(() => { el.innerText = "✅ متصل ومؤمن"; el.style.background = "rgba(255,255,255,0.2)"; }, 2000);
        }
    }

    function recalc(idx) {
        const c = document.getElementById(`card-${idx}`); if(!c) return;
        let sal = parseFloat(c.querySelector('.salary-input').value) || 0, lTotal = 0, aTotal = 0;
        c.querySelectorAll('.loan-input').forEach(i => lTotal += parseFloat(i.value) || 0);
        c.querySelectorAll('.btn-tgl.active').forEach(b => aTotal += parseFloat(b.dataset.v));
        
        let net = Math.round(((sal / 6) * aTotal) - lTotal);
        let finalNet = net > 0 ? net : 0;
        
        c.querySelector('.sum-a').innerText = aTotal;
        c.querySelector('.sum-l').innerText = lTotal; 
        
        let sumN = c.querySelector('.sum-n');
        sumN.innerText = finalNet + " " + currentCurrency;
        sumN.setAttribute('data-val', finalNet);
        
        refreshStats();
    }

    function refreshStats() {
        let gL = 0, gN = 0, gS = 0;
        document.querySelectorAll('.worker-card').forEach(c => {
            gL += parseFloat(c.querySelector('.sum-l').innerText) || 0;
            gN += parseFloat(c.querySelector('.sum-n').getAttribute('data-val')) || 0;
            gS += parseFloat(c.querySelector('.salary-input').value) || 0;
        });
        document.getElementById('stat-sal').innerText = gS; 
        document.getElementById('stat-loan').innerText = gL; 
        document.getElementById('stat-net').innerText = gN;
    }

    function shareToWhatsApp(idx) {
        const c = document.getElementById(`card-${idx}`);
        const name = masterWorkers[idx].name;
        const sal = c.querySelector('.salary-input').value || 0;
        const net = c.querySelector('.sum-n').innerText; // تأخذ النص المنسق بالعملة
        const note = c.querySelector('.note-input').value || "لا يوجد";
        
        let details = "";
        const dayRows = c.querySelectorAll('.day-row');
        for(let i=0; i<dayRows.length; i++) {
            const row = dayRows[i];
            const day = row.querySelector('.day-info span').innerText;
            const date = currentWeekDates[i];
            const status = row.querySelector('.btn-tgl.active').innerText;
            const loan = row.querySelector('.loan-input').value || 0;
            details += `━ ${day} (${date}): [${status}] ${loan > 0 ? `| سلفة: ${loan} ${currentCurrency}` : ''}\n`;
        }

        const msg = `*azemaa proo* 💰\n*العامل:* ${name}\n*أسبوع:* ${currentWeekID}\n*الراتب الأساسي:* ${sal} ${currentCurrency}\n━━━━━━━━━━━━━━━\n*تفاصيل الحضور والسلف:*\n${details}\n*ملاحظات:* ${note}\n━━━━━━━━━━━━━━━\n*الصافي المستحق:* *${net}*`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function updateArchiveDropdown() {
        const dropdown = document.getElementById('archiveSearch');
        const currentSelection = dropdown.value;
        dropdown.innerHTML = '<option value="">-- اختر اسم العامل لعرض أرشيفه --</option>' + 
            masterWorkers.map(w => `<option value="${w.name}">💰 ${w.name}</option>`).join('');
        dropdown.value = currentSelection;
    }

    function scheduleDailyArchive() {
        async function performArchiveIfMidnight() {
            const now = new Date();
            const currentHour = now.getHours();
            const isMidnight = (currentHour >= 0 && currentHour < 3);
            if(isMidnight) {
                await archiveCurrentWeekSnapshots();
            }
        }
        performArchiveIfMidnight();
        setInterval(async () => {
            const now = new Date();
            const isMidnight = (now.getHours() >= 0 && now.getHours() < 3);
            if(isMidnight) {
                await archiveCurrentWeekSnapshots();
            }
        }, 3600000); 
    }

    async function archiveCurrentWeekSnapshots() {
        if(!window.currentUid) return;
        const currentWeekSnapshotID = currentWeekID;
        if(!currentWeekSnapshotID) return;
        
        const archiveRef = window.ref(window.db, `backups/workers_archive/${window.currentUid}/${currentWeekSnapshotID}`);
        const currentWeekDataRef = window.ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekSnapshotID}`);
        
        const snapshot = await window.get(currentWeekDataRef);
        if(snapshot.exists()) {
            const weekData = snapshot.val();
            await window.set(archiveRef, weekData);
            console.log(`تم تحديث أرشيف أسبوع ${currentWeekSnapshotID} بنجاح (حفظ يومي)`);
            const statusDiv = document.getElementById('syncStatus');
            const originalText = statusDiv.innerText;
            statusDiv.innerText = "📦 تم الحفظ اليومي للأرشيف";
            statusDiv.style.background = "var(--gold)";
            statusDiv.style.color = "#3b2a0f";
            setTimeout(() => {
                statusDiv.innerText = originalText;
                statusDiv.style.background = "rgba(255,255,255,0.2)";
                statusDiv.style.color = "white";
            }, 3000);
        }
    }

    async function fetchAndBuildArchive() {
        const selectedName = document.getElementById('archiveSearch').value.trim();
        const display = document.getElementById('archiveContent');
        if(!selectedName) { display.innerHTML = ""; return; }
        
        display.innerHTML = "<p style='text-align:center;'>⏳ جلب الأرشيف مع تفاصيل أيام الأسبوع...</p>";
        
        const archiveSnap = await window.get(window.ref(window.db, `backups/workers_archive/${window.currentUid}`));
        let archives = archiveSnap.exists() ? archiveSnap.val() : {};
        
        let html = ``;
        let hasRecords = false;
        let weeksKeys = Object.keys(archives).sort((a,b) => b.localeCompare(a));
        
        for(let weekKey of weeksKeys) {
            const weekData = archives[weekKey];
            let workerRecord = null;
            for(let idx in weekData) {
                let w = weekData[idx];
                if(w && w.name === selectedName) {
                    workerRecord = w;
                    break;
                }
            }
            if(workerRecord) {
                hasRecords = true;
                let loansSum = 0; 
                if(workerRecord.loans) {
                    Object.values(workerRecord.loans).forEach(l => {
                        let parsedVal = parseFloat(l);
                        if(!isNaN(parsedVal)) {
                            loansSum += parsedVal;
                        }
                    });
                }
                
                let attArray = [1, 1, 1, 1, 1, 1];
                if (workerRecord.att) {
                    for (let i = 0; i < 6; i++) {
                        attArray[i] = workerRecord.att[i] !== undefined ? parseFloat(workerRecord.att[i]) : 1;
                    }
                }
                let attSum = attArray.reduce((sum, val) => sum + parseFloat(val || 0), 0);
                
                let salaryBase = parseFloat(workerRecord.sal || 0);
                let net = Math.round(((salaryBase/6)*attSum) - loansSum);
                
                let wParts = weekKey.split('-');
                let archiveStartDate = new Date(parseInt(wParts[0]), parseInt(wParts[1])-1, parseInt(wParts[2]));
                let displayWeekKey = wParts.length === 3 ? `${wParts[0]}/${wParts[1]}/${wParts[2]}` : weekKey;
                
                let detailsHtml = `<div class="attendance-details"><strong>📋 تفاصيل الحضور والغياب:</strong><div style="margin-top:8px;">`;
                for(let i=0; i<weekdays.length; i++) {
                    
                    let tmp = new Date(archiveStartDate);
                    tmp.setDate(archiveStartDate.getDate() + i);
                    let d = tmp.getDate().toString().padStart(2, '0');
                    let m = (tmp.getMonth() + 1).toString().padStart(2, '0');
                    let y = tmp.getFullYear();
                    let dateStr = `${y}/${m}/${d}`;

                    let statusVal = attArray[i];
                    let statusText = (statusVal == 1) ? "✔️ حاضر" : (statusVal == 0.5 ? "⚠️ نصف يوم" : "❌ غائب");
                    let statusClass = (statusVal == 1) ? "status-h" : (statusVal == 0.5 ? "status-half" : "status-a");
                    let loanVal = (workerRecord.loans && workerRecord.loans[i]) ? parseFloat(workerRecord.loans[i]) || 0 : 0;
                    
                    detailsHtml += `
                        <div class="att-row-detail">
                            <div style="text-align: right; min-width: 70px;">
                                <span class="day-badge" style="display:block;">${weekdays[i]}</span>
                                <span style="font-size: 9px; color: #777; font-weight: bold;">${dateStr}</span>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            ${loanVal > 0 ? `<span style="color:var(--danger);">💸 سلفة: ${loanVal} ${currentCurrency}</span>` : '<span style="color:#aaa;">لا توجد سلفة</span>'}
                        </div>
                    `;
                }
                detailsHtml += `</div></div>`;
                
                html += `
                    <div style="background:white; border-radius: 20px; padding: 12px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); border-right: 3px solid var(--gold);">
                        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid var(--gold); padding-bottom: 6px; margin-bottom: 10px;">
                            <h4 style="margin:0; color: var(--dark-green);">📅 أسبوع: ${displayWeekKey} 💰</h4>
                            <span style="background:#eee; padding:4px 8px; border-radius:12px;">${attSum} أيام عمل</span>
                        </div>
                        <table class="archive-table" style="width:100%; margin-bottom:12px;">
                            <thead><tr><th>الراتب</th><th>إجمالي السلف</th><th>صافي المستحق</th></tr></thead>
                            <tbody><tr><td style="font-weight:bold;">${salaryBase || 0} ${currentCurrency}</td><td style="color:var(--danger);">${loansSum} ${currentCurrency}</td><td style="color:var(--gold); font-weight:bold;">${net > 0 ? net : 0} ${currentCurrency}</td></tr>
                            </tbody>
                        </table>
                        ${detailsHtml}
                        ${workerRecord.note ? `<div style="margin-top:12px; background:#fff9e0; padding:8px; border-radius:12px;"><strong>📝 ملاحظات:</strong> ${workerRecord.note}</div>` : ''}
                    </div>
                `;
            }
        }
        
        display.innerHTML = hasRecords ? html : "<p style='text-align:center; color:#777; font-size:13px;'>🚫 لا توجد سجلات مؤرشفة سابقة لهذا العامل (سيتم الأرشفة يومياً بشكل تلقائي).</p>";
    }
    
    window.toggleAtt = toggleAtt;
    window.syncData = syncData;
    window.syncArrayData = syncArrayData;
    window.syncSalary = syncSalary;
    window.manualSaveWorker = manualSaveWorker;
    window.addNewWorker = addNewWorker;
    window.removeWorker = removeWorker;
    window.updateDateFromSelectors = updateDateFromSelectors;
    window.handleDateChange = handleDateChange;
    window.shareToWhatsApp = shareToWhatsApp;
    window.fetchAndBuildArchive = fetchAndBuildArchive;
    window.updateCurrency = updateCurrency; 

    // دالة الحفظ اليدوي للأرشيف للكل
    window.forceArchiveNow = async function(btn) {
        if(confirm("⚠️ هل أنت متأكد أنك تريد حفظ بيانات جميع العمال للأسبوع الحالي في الأرشيف الآن؟")) {
            const originalText = btn.innerText;
            btn.innerText = "⏳ جاري أرشفة الكل...";
            btn.style.background = "var(--warning)";
            
            // استدعاء دالة الأرشفة الأصلية الموجودة بالفعل
            await archiveCurrentWeekSnapshots(); 
            
            btn.innerText = "✅ تم حفظ الكل في الأرشيف بنجاح";
            btn.style.background = "var(--whatsapp-green)";
            
            // إعادة الزر لشكله الطبيعي بعد 3 ثواني
            setTimeout(() => {
                btn.innerText = originalText;
                btn.style.background = "var(--teal)";
            }, 3000);
            
            // تحديث العرض إذا كنت تفتح أرشيف عامل معين
            if (document.getElementById('archiveSearch').value !== "") {
                fetchAndBuildArchive();
            }
        }
    };
</script>
</body>
</html>
