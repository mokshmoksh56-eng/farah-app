<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | الحضور والعمال الشامل</title>
    <style>
        :root {
            --whatsapp-green: #25D366; --dark-green: #075E54; --teal: #128C7E;
            --bg-gray: #f0f2f5; --white: #ffffff; --danger: #d32f2f;
            --warning: #f57c00;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; font-weight: 600; padding-bottom: 80px; }
        
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gray);
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: var(--dark-green); font-weight: bold;
        }

        header { 
            background: linear-gradient(135deg, var(--dark-green), var(--teal)); 
            color: var(--white); padding: 15px 10px; text-align: center; 
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .sync-indicator { font-size: 11px; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; display: inline-block; transition: 0.3s; }
        .header-title { font-size: 1.2rem; font-weight: 900; }
        #weekRangeDisplay { font-size: 13px; margin-top: 5px; background: rgba(0,0,0,0.1); display: inline-block; padding: 2px 10px; border-radius: 10px; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .dash-card { background: rgba(255, 255, 255, 0.15); padding: 8px 2px; border-radius: 12px; }
        .dash-card strong { font-size: 15px; display: block; }

        .main-container { padding: 12px; }
        .config-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .date-selectors { display: flex; gap: 5px; margin-bottom: 10px; }
        .date-selectors select { flex: 1; padding: 10px; border-radius: 10px; border: 2px solid var(--teal); font-weight: 900; text-align: center; }

        .settings-box { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .add-worker-form { display: flex; gap: 5px; margin-bottom: 10px; }
        .add-worker-form input { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-weight: bold; }
        .add-worker-form button { background: var(--teal); color: white; border: none; padding: 0 15px; border-radius: 8px; cursor: pointer; font-weight: 900; }
        
        .worker-item { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 5px; font-size: 13px; }
        .btn-del { color: var(--danger); background: none; border: none; font-size: 18px; cursor: pointer; }

        #cardsList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (max-width: 550px) { #cardsList { grid-template-columns: 1fr; } }
        
        .worker-card { background: var(--white); border-radius: 15px; padding: 12px; border-top: 5px solid var(--teal); box-shadow: 0 3px 10px rgba(0,0,0,0.08); }
        .card-name { font-size: 16px; color: var(--dark-green); text-align: center; margin-bottom: 10px; font-weight: 900; }
        
        .salary-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #fffcf0; padding: 5px; border-radius: 8px; }
        .salary-input { width: 80px; padding: 5px; border-radius: 5px; border: 1.5px solid #ddd; font-weight: 900; text-align: center; }

        .day-row { display: flex; align-items: center; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 5px; gap: 4px; margin-bottom: 4px; }
        .day-info { flex: 1.2; font-size: 12px; font-weight: 900; }
        .day-date { font-size: 9px; color: #888; display: block; font-weight: normal; }
        
        .att-btns { display: flex; gap: 2px; flex: 2; }
        .btn-tgl { flex: 1; border: 1px solid #ccc; background: #fff; font-size: 11px; font-weight: 900; padding: 8px 0; border-radius: 5px; cursor: pointer; transition: 0.2s;}
        .btn-tgl.active[data-v="1"] { background: var(--whatsapp-green); color: white; border-color: var(--whatsapp-green); }
        .btn-tgl.active[data-v="0.5"] { background: var(--warning); color: white; border-color: var(--warning); }
        .btn-tgl.active[data-v="0"] { background: var(--danger); color: white; border-color: var(--danger); }
        .loan-input { width: 55px; border: 1px solid #ddd; border-radius: 5px; padding: 8px 0; text-align: center; font-weight: 900; color: var(--danger); background: #fff; }

        .note-input { width: 100%; margin-top: 10px; padding: 10px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 13px; background: #fffef2; box-sizing: border-box; resize: none; font-weight:700;}
        .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 13px; font-weight: 900; }
        .btn-share { width: 100%; background: var(--whatsapp-green); color: white; border: none; padding: 12px; border-radius: 12px; margin-top: 10px; font-weight: 900; cursor: pointer; }

        /* تنسيقات الأرشيف */
        .archive-box { background: white; border-radius: 15px; padding: 15px; margin-top: 20px; border: 2px solid var(--teal); margin-bottom: 20px; }
        .archive-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; background: white; border-radius: 8px; overflow: hidden; }
        .archive-table th { background: #eee; padding: 8px; border: 1px solid #ddd; text-align: center; }
        .archive-table td { padding: 8px; border: 1px solid #ddd; text-align: center; font-weight: 700; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.db = db; window.ref = ref; window.update = update; window.get = get; window.set = set;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUid = user.uid;
                document.getElementById('auth-loader').style.display = 'none';
                initSystem();
            }
        });
    </script>
</head>
<body>

<div id="auth-loader">⏳ جاري الاتصال الآمن بالسحابة...</div>

<header>
    <div class="sync-indicator" id="syncStatus">✅ متصل ومؤمن</div>
    <div class="header-title">AZEMAA PRO | لوحة إدارة العمال</div>
    <div id="weekRangeDisplay">...</div>
    <div class="dashboard">
        <div class="dash-card"><span>رواتب</span><strong id="stat-sal">0</strong></div>
        <div class="dash-card"><span>سلفيات</span><strong id="stat-loan">0</strong></div>
        <div class="dash-card"><span>صافي الدفع</span><strong id="stat-net" style="color:var(--whatsapp-green)">0</strong></div>
    </div>
</header>

<div class="main-container">
    <div class="config-box">
        <div class="date-selectors">
            <select id="dayPicker" onchange="updateDate()"></select>
            <select id="monthPicker" onchange="updateDate()">
                <option value="0">يناير</option><option value="1">فبراير</option><option value="2">مارس</option>
                <option value="3">أبريل</option><option value="4">مايو</option><option value="5">يونيو</option>
                <option value="6">يوليو</option><option value="7">أغسطس</option><option value="8">سبتمبر</option>
                <option value="9">أكتوبر</option><option value="10">نوفمبر</option><option value="11">ديسمبر</option>
            </select>
            <select id="yearPicker" onchange="updateDate()"></select>
        </div>

        <details class="settings-box">
            <summary style="text-align:center; cursor:pointer; color:var(--teal); font-weight:900;">⚙️ إضافة وتعديل العمال بالورشة</summary>
            <div class="add-worker-form" style="margin-top:10px;">
                <input type="text" id="newWorkerName" placeholder="اكتب اسم العامل الجديد هنا...">
                <button onclick="addWorker()">إضافة ➕</button>
            </div>
            <div id="masterList"></div>
        </details>
    </div>

    <div id="cardsList"></div>

    <div class="archive-box">
        <h3 style="text-align:center; color: var(--dark-green); margin:0 0 10px 0;">📂 الأرشيف التفصيلي للعمال</h3>
        <select id="archiveSearch" onchange="fetchAndBuildArchive()" style="width:100%; padding:12px; border-radius:10px; font-weight:900; border:2px solid var(--teal); outline:none;">
            <option value="">-- اختر اسم العامل لعرض أرشيفه --</option>
        </select>
        <div id="archiveContent" style="margin-top:15px;"></div>
    </div>
</div>

<script>
    const weekdays = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    let masterWorkers = [];
    let currentWeekID = "";
    let currentWeekDates = [];
    let allArchiveData = {};

    function initSystem() {
        initDates();
        listenToMasterWorkers();
    }

    function initDates() {
        const dS = document.getElementById('dayPicker'), yS = document.getElementById('yearPicker'), n = new Date();
        for(let i=1; i<=31; i++) dS.add(new Option(i, i, i === n.getDate()));
        for(let i=2024; i<=2030; i++) yS.add(new Option(i, i, i === n.getFullYear()));
        document.getElementById('monthPicker').value = n.getMonth();
        updateDate();
    }

    function updateDate() {
        const d = document.getElementById('dayPicker').value, m = parseInt(document.getElementById('monthPicker').value)+1, y = document.getElementById('yearPicker').value;
        const picked = new Date(`${y}-${m}-${d}`);
        let diff = (picked.getDay() === 6) ? 0 : (picked.getDay() + 1);
        let sat = new Date(picked); sat.setDate(picked.getDate() - diff);
        currentWeekID = sat.toISOString().split('T')[0];
        
        currentWeekDates = [];
        for(let i=0; i<6; i++) {
            let tmp = new Date(sat); tmp.setDate(sat.getDate() + i);
            currentWeekDates.push(tmp.getDate().toString().padStart(2,'0') + '/' + (tmp.getMonth()+1).toString().padStart(2,'0'));
        }
        document.getElementById('weekRangeDisplay').innerText = `أسبوع السبت ${currentWeekDates[0]}`;
        loadWeekData();
    }

    // إصلاح مشكلة قراءة مصفوفة العمال وإجبارها على أن تكون Array سليم
    function listenToMasterWorkers() {
        onValue(window.ref(window.db, `backups/workers_master/${window.currentUid}`), (snap) => {
            if(snap.exists()) {
                let rawData = snap.val();
                // تحويل البيانات لكائن مصفوفة حقيقي وتصفية أي فراغات
                masterWorkers = Array.isArray(rawData) ? rawData : Object.values(rawData);
                masterWorkers = masterWorkers.filter(w => w && w.name);
            } else {
                masterWorkers = [];
            }
            renderMasterList();
            updateArchiveDropdown();
            loadWeekData();
        });
    }

    function renderMasterList() {
        document.getElementById('masterList').innerHTML = masterWorkers.map((w, i) => `
            <div class="worker-item">
                <span>👷 ${w.name}</span>
                <button class="btn-del" onclick="deleteWorker(${i})" title="حذف العامل">🗑️</button>
            </div>
        `).join('');
    }

    // إضافة عامل جديد بشكل آمن
    async function addWorker() {
        const name = document.getElementById('newWorkerName').value.trim();
        if(!name) return;
        masterWorkers.push({ name: name });
        // نستخدم Set لرفع المصفوفة السليمة من جديد
        await window.set(window.ref(window.db, `backups/workers_master/${window.currentUid}`), masterWorkers);
        document.getElementById('newWorkerName').value = "";
    }

    async function deleteWorker(idx) {
        if(confirm("هل أنت متأكد من حذف هذا العامل نهائياً من القائمة؟")) {
            masterWorkers.splice(idx, 1);
            await window.set(window.ref(window.db, `backups/workers_master/${window.currentUid}`), masterWorkers);
        }
    }

    // تحميل وبناء كروت الأسبوع
    async function loadWeekData() {
        if(!window.currentUid || masterWorkers.length === 0) {
            document.getElementById('cardsList').innerHTML = "";
            return;
        }
        const snap = await window.get(window.ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}`));
        const saved = snap.exists() ? snap.val() : {};
        
        document.getElementById('cardsList').innerHTML = masterWorkers.map((worker, idx) => {
            // جلب بيانات العامل أو وضع قيم افتراضية إذا كان عاملاً جديداً
            let d = saved[idx] || {};
            let sal = d.sal || '';
            let att = d.att || [1,1,1,1,1,1];
            let loans = d.loans || ['','','','','',''];
            let note = d.note || '';

            return `
                <div class="worker-card" id="card-${idx}">
                    <div class="card-name">${worker.name}</div>
                    <div class="salary-row">
                        <label style="font-size:12px;">الراتب الأساسي:</label>
                        <input type="number" class="salary-input" value="${sal}" placeholder="الراتب" onchange="syncData(${idx}, 'sal', this.value)">
                    </div>
                    <div class="days-grid">
                        ${[0,1,2,3,4,5].map(di => `
                            <div class="day-row">
                                <div class="day-info">
                                    <span>${weekdays[di]}</span>
                                    <span class="day-date">${currentWeekDates[di]}</span>
                                </div>
                                <div class="att-btns">
                                    <button class="btn-tgl ${att[di]==1?'active':''}" data-v="1" onclick="toggleAtt(this,${idx},${di})">ح</button>
                                    <button class="btn-tgl ${att[di]==0.5?'active':''}" data-v="0.5" onclick="toggleAtt(this,${idx},${di})">½</button>
                                    <button class="btn-tgl ${att[di]==0?'active':''}" data-v="0" onclick="toggleAtt(this,${idx},${di})">غ</button>
                                </div>
                                <input type="number" class="loan-input" value="${loans[di]}" placeholder="سلفة" onchange="syncArrayData(${idx}, 'loans', ${di}, this.value)">
                            </div>
                        `).join('')}
                    </div>
                    <textarea class="note-input" placeholder="ملاحظات ومسحوبات أخرى..." onblur="syncData(${idx}, 'note', this.value)">${note}</textarea>
                    <div class="card-footer">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span>أيام الحضور: <span class="sum-a">0</span></span>
                            <span>إجمالي السلف: <span class="sum-l" style="color:var(--danger)">0</span></span>
                        </div>
                        <div style="display:flex; justify-content:space-between; border-top:1px solid #ddd; padding-top:5px;">
                            <span style="color:var(--dark-green);">الصافي المستحق:</span>
                            <span class="sum-n" style="color:var(--whatsapp-green); font-size:16px;">0</span>
                        </div>
                    </div>
                    <button class="btn-share" onclick="shareToWhatsApp(${idx})">إرسال كشف الحساب 🟢</button>
                </div>`;
        }).join('');
        
        masterWorkers.forEach((_, i) => recalc(i));
    }

    function toggleAtt(btn, wIdx, dIdx) {
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        syncArrayData(wIdx, 'att', dIdx, btn.dataset.v);
    }

    function syncData(wIdx, field, val) {
        setSyncStatus(true);
        update(ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${wIdx}`), { [field]: val, name: masterWorkers[wIdx].name }).then(() => setSyncStatus(false));
        recalc(wIdx);
    }

    function syncArrayData(wIdx, field, dIdx, val) {
        setSyncStatus(true);
        update(ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${wIdx}/${field}`), { [dIdx]: val, name: masterWorkers[wIdx].name }).then(() => setSyncStatus(false));
        recalc(wIdx);
    }

    function setSyncStatus(isSyncing) {
        const el = document.getElementById('syncStatus');
        if(isSyncing) {
            el.innerText = "⏳ جاري التحديث..."; el.style.background = "var(--warning)"; el.style.color = "white";
        } else {
            el.innerText = "✅ تم الحفظ"; el.style.background = "var(--whatsapp-green)"; el.style.color = "white";
            setTimeout(() => { el.innerText = "✅ متصل"; el.style.background = "rgba(255,255,255,0.2)"; }, 2000);
        }
    }

    function recalc(idx) {
        const c = document.getElementById(`card-${idx}`); if(!c) return;
        let sal = parseFloat(c.querySelector('.salary-input').value) || 0, lTotal = 0, aTotal = 0;
        c.querySelectorAll('.loan-input').forEach(i => lTotal += parseFloat(i.value) || 0);
        c.querySelectorAll('.btn-tgl.active').forEach(b => aTotal += parseFloat(b.dataset.v));
        
        let net = Math.round(((sal / 6) * aTotal) - lTotal);
        c.querySelector('.sum-a').innerText = aTotal;
        c.querySelector('.sum-l').innerText = lTotal; 
        c.querySelector('.sum-n').innerText = (net > 0 ? net : 0) + " ج.م";
        refreshStats();
    }

    function refreshStats() {
        let gL = 0, gN = 0, gS = 0;
        document.querySelectorAll('.worker-card').forEach(c => {
            gL += parseFloat(c.querySelector('.sum-l').innerText) || 0;
            gN += parseFloat(c.querySelector('.sum-n').innerText.replace(' ج.م', '')) || 0;
            gS += parseFloat(c.querySelector('.salary-input').value) || 0;
        });
        document.getElementById('stat-sal').innerText = gS; 
        document.getElementById('stat-loan').innerText = gL; 
        document.getElementById('stat-net').innerText = gN;
    }

    function shareToWhatsApp(idx) {
        const c = document.getElementById(`card-${idx}`);
        const name = masterWorkers[idx].name;
        const sal = c.querySelector('.salary-input').value || 0;
        const net = c.querySelector('.sum-n').innerText;
        const note = c.querySelector('.note-input').value || "لا يوجد";
        
        let details = "";
        c.querySelectorAll('.day-row').forEach((row) => {
            const day = row.querySelector('.day-info span').innerText;
            const date = row.querySelector('.day-date').innerText;
            const status = row.querySelector('.btn-tgl.active').innerText;
            const loan = row.querySelector('.loan-input').value || 0;
            details += `━ ${day} (${date}): [${status}] ${loan > 0 ? `| سلفة: ${loan}` : ''}\n`;
        });

        const msg = `*كشف حساب وعمال الورشة* 👷\n*العامل:* ${name}\n*أسبوع:* ${currentWeekID}\n*الراتب الأساسي:* ${sal}\n━━━━━━━━━━━━━━━\n*تفاصيل الحضور والسلف:*\n${details}\n*ملاحظات:* ${note}\n━━━━━━━━━━━━━━━\n*الصافي المستحق:* *${net}*`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // --- وظائف الأرشيف السحابي ---
    function updateArchiveDropdown() {
        const dropdown = document.getElementById('archiveSearch');
        const currentSelection = dropdown.value;
        dropdown.innerHTML = '<option value="">-- اختر اسم العامل لعرض أرشيفه --</option>' + 
            masterWorkers.map(w => `<option value="${w.name}">${w.name}</option>`).join('');
        dropdown.value = currentSelection; // للحفاظ على الاختيار بعد التحديث
    }

    async function fetchAndBuildArchive() {
        const selectedName = document.getElementById('archiveSearch').value.trim();
        const display = document.getElementById('archiveContent');
        if(!selectedName) { display.innerHTML = ""; return; }
        
        display.innerHTML = "<p style='text-align:center;'>⏳ جاري جلب الأرشيف...</p>";
        
        // جلب كل أسابيع العمل من السحابة
        const snap = await window.get(window.ref(window.db, `backups/workers_weeks/${window.currentUid}`));
        if(snap.exists()) {
            allArchiveData = snap.val();
        } else {
            allArchiveData = {};
        }

        let html = `<table class="archive-table"><thead><tr><th>تاريخ الأسبوع</th><th>الراتب</th><th>أيام حضرها</th><th>سلفيات</th><th>الصافي</th></tr></thead><tbody>`;
        let hasRecords = false;
        
        // ترتيب التواريخ من الأحدث للأقدم
        let keys = Object.keys(allArchiveData).sort((a,b) => b.localeCompare(a));
        
        keys.forEach(weekKey => {
            const weekData = allArchiveData[weekKey];
            let workerRecord = null;
            
            // البحث عن العامل بالاسم داخل بيانات الأسبوع (لأن الـ Index قد يتغير مع الحذف)
            Object.values(weekData).forEach(w => {
                if(w && w.name === selectedName) workerRecord = w;
            });
            
            if(workerRecord) {
                hasRecords = true;
                let loansSum = 0; if(workerRecord.loans) Object.values(workerRecord.loans).forEach(l => loansSum += parseFloat(l || 0));
                let attSum = 0; if(workerRecord.att) Object.values(workerRecord.att).forEach(a => attSum += parseFloat(a || 0));
                let net = Math.round(((parseFloat(workerRecord.sal||0)/6)*attSum) - loansSum);
                
                html += `<tr>
                    <td style="font-size:11px; color:var(--dark-green);">${weekKey}</td>
                    <td>${workerRecord.sal || 0}</td>
                    <td>${attSum}</td>
                    <td style="color:var(--danger);">${loansSum}</td>
                    <td style="color:var(--whatsapp-green);">${net > 0 ? net : 0}</td>
                </tr>`;
            }
        });
        
        html += `</tbody></table>`;
        display.innerHTML = hasRecords ? html : "<p style='text-align:center; color:#777; font-size:13px;'>لا توجد سجلات مؤرشفة سابقة لهذا العامل.</p>";
    }
</script>
