<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | النظام المتكامل</title>
    <style>
        :root {
            --whatsapp-green: #25D366; --dark-green: #075E54; --teal: #128C7E;
            --bg-gray: #f0f2f5; --white: #ffffff; --danger: #d32f2f;
            --warning: #f57c00;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; font-weight: 600; }
        
        header { 
            background: linear-gradient(135deg, var(--dark-green), var(--teal)); 
            color: var(--white); padding: 15px 10px; text-align: center; 
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
        }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .dash-card { background: rgba(255, 255, 255, 0.15); padding: 8px 2px; border-radius: 12px; }
        .dash-card strong { font-size: 15px; display: block; }

        .main-container { padding: 12px; padding-bottom: 100px; }

        .config-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .date-selectors { display: flex; gap: 5px; margin-top: 10px; }
        .date-selectors select { 
            flex: 1; padding: 12px 5px; border-radius: 10px; border: 2px solid var(--teal); 
            font-weight: 900; background: #f9f9f9; cursor: pointer; text-align: center;
        }

        #cardsList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .worker-card { background: var(--white); border-radius: 15px; padding: 12px; border-top: 5px solid var(--teal); box-shadow: 0 3px 10px rgba(0,0,0,0.08); position: relative; }

        .card-name { font-size: 14px; color: var(--dark-green); text-align: center; margin-bottom: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .salary-input { width: 100%; padding: 8px; border-radius: 8px; border: 1.5px solid #ddd; font-weight: 900; text-align: center; background: #fffcf0; box-sizing: border-box; }

        .days-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 10px; }
        .day-box { background: #fafafa; padding: 5px; border-radius: 8px; border: 1px solid #eee; text-align: center; }
        .day-date { font-size: 10px; color: var(--teal); display: block; font-weight: 900; margin-bottom: 2px; border-bottom: 1px solid #eef; background: #fff; border-radius: 4px; padding: 1px 0; }
        
        .att-btns { display: flex; gap: 2px; margin-bottom: 4px; margin-top: 3px; }
        .btn-tgl { flex: 1; border: 1px solid #ccc; background: #fff; font-size: 10px; font-weight: 900; padding: 6px 0; border-radius: 4px; cursor: pointer; }
        .btn-tgl.active[data-v="1"] { background: var(--whatsapp-green); color: white; border-color: var(--whatsapp-green); }
        .btn-tgl.active[data-v="0.5"] { background: var(--warning); color: white; border-color: var(--warning); }
        .btn-tgl.active[data-v="0"] { background: var(--danger); color: white; border-color: var(--danger); }

        .loan-input { width: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 6px 0; text-align: center; font-weight: 900; color: var(--danger); font-size: 12px; }

        .note-input { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; border: 1.5px solid #ccc; font-size: 11px; font-family: inherit; background: #fffef2; box-sizing: border-box; font-weight: 900; }

        .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 11px; font-weight: 900; }
        .footer-line { display: flex; justify-content: space-between; margin-bottom: 3px; }

        .btn-share { width: 100%; background: var(--whatsapp-green); color: white; border: none; padding: 10px; border-radius: 10px; margin-top: 10px; font-weight: 900; cursor: pointer; }

        .archive-zone { background: #ffffff; padding: 15px; border-radius: 15px; margin-top: 20px; border: 2px solid var(--teal); margin-bottom: 50px; }
        .history-card { background: #ffffff; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e0e0e0; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .history-header { background: #f8f9fa; padding: 10px; border-bottom: 2px solid var(--teal); display: flex; justify-content: space-between; align-items: center; }
        .archive-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .archive-table th { background: #f1f1f1; padding: 8px; color: #555; border-bottom: 1px solid #ddd; }
        .archive-table td { padding: 10px 4px; text-align: center; border-bottom: 1px solid #f9f9f9; line-height: 1.4; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; background: white; padding: 12px; display: flex; box-sizing: border-box; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 2000; }
    </style>
</head>
<body>

<header>
    <div class="header-title">AZEMAA PRO | <span id="currentDayTitle"></span></div>
    <div class="dashboard">
        <div class="dash-card"><span>رواتب</span><strong id="stat-sal">0</strong></div>
        <div class="dash-card"><span>سلف+قسط</span><strong id="stat-loan">0</strong></div>
        <div class="dash-card"><span>الصافي</span><strong id="stat-net">0</strong></div>
    </div>
</header>

<div class="main-container">
    <div class="config-box">
        <div style="font-size: 13px; color: var(--teal); text-align: center;">📅 اختر تاريخ بداية الأسبوع (السبت):</div>
        <div class="date-selectors">
            <select id="dayPicker" onchange="updateDateFromSelectors()"></select>
            <select id="monthPicker" onchange="updateDateFromSelectors()">
                <option value="0">01</option><option value="1">02</option><option value="2">03</option>
                <option value="3">04</option><option value="4">05</option><option value="5">06</option>
                <option value="6">07</option><option value="7">08</option><option value="8">09</option>
                <option value="9">10</option><option value="10">11</option><option value="11">12</option>
            </select>
            <select id="yearPicker" onchange="updateDateFromSelectors()"></select>
        </div>
        <input type="hidden" id="datePicker" onchange="handleDateChange()">
        
        <details style="margin-top: 15px;">
            <summary style="font-weight: 900; color: var(--teal); cursor: pointer; text-align: center; background: #f9f9f9; padding: 10px; border-radius: 10px;">⚙️ إعدادات العمال</summary>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="workerNameInp" style="flex:2; border: 1px solid #ddd; padding: 8px; border-radius: 8px;" placeholder="اسم العامل الجديد...">
                <button onclick="addNewWorker()" style="background:var(--teal); color:white; border:none; padding:0 15px; border-radius:8px;">إضافة</button>
            </div>
            <div id="workerListEditor" style="margin-top:10px;"></div>
        </details>
    </div>

    <div id="cardsList"></div>

    <div class="archive-zone">
        <h3 style="text-align:center; color: var(--dark-green); margin:0 0 15px 0;">📂 أرشيف الرواتب الشامل</h3>
        <div style="margin-bottom:10px;">
            <select id="archiveSearch" onchange="buildArchiveHistory()" style="width:100%; padding:15px; border-radius:12px; font-weight:900; border:2px solid var(--teal); background: #fff;"></select>
        </div>
        <div id="archiveContent"></div>
    </div>
</div>

<div class="footer-nav">
    <button onclick="saveWeek()" style="width:100%; padding:15px; background:var(--dark-green); color:white; border:none; border-radius:12px; font-weight:900; cursor:pointer;">💾 حفظ بيانات الأسبوع الحالي</button>
</div>

<script>
    const STORAGE_KEY_WORKERS = 'f_workers_v2026_id_system';
    const STORAGE_KEY_PREFIX = 'f_data_v2026_simple_';
    const weekdays = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    
    let masterWorkers = JSON.parse(localStorage.getItem(STORAGE_KEY_WORKERS)) || [];
    let currentWeekDates = [];
    let currentWeekID = "";

    function initDateSelectors() {
        const dSel = document.getElementById('dayPicker');
        const ySel = document.getElementById('yearPicker');
        const now = new Date();
        for(let i=1; i<=31; i++) { dSel.add(new Option(i, i, i === now.getDate(), i === now.getDate())); }
        for(let i=2024; i<=2035; i++) { ySel.add(new Option(i, i, i === now.getFullYear(), i === now.getFullYear())); }
        document.getElementById('monthPicker').value = now.getMonth();
        updateDateFromSelectors();
    }

    function updateDateFromSelectors() {
        const d = document.getElementById('dayPicker').value;
        const m = parseInt(document.getElementById('monthPicker').value) + 1;
        const y = document.getElementById('yearPicker').value;
        document.getElementById('datePicker').value = `${y}-${m.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        handleDateChange();
    }

    function setup() { 
        initDateSelectors(); 
        updateWorkerEditor(); 
        updateArchiveDropdown(); 
    }

    function handleDateChange() {
        const pickedDate = new Date(document.getElementById('datePicker').value);
        if (isNaN(pickedDate)) return;
        let dayOfWeek = pickedDate.getDay();
        let diffToSaturday = (dayOfWeek === 6) ? 0 : (dayOfWeek + 1);
        let saturday = new Date(pickedDate);
        saturday.setDate(pickedDate.getDate() - diffToSaturday);
        currentWeekID = saturday.toISOString().split('T')[0];
        currentWeekDates = [];
        for(let i=0; i<6; i++) {
            let d = new Date(saturday); d.setDate(saturday.getDate() + i);
            currentWeekDates.push(d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear());
        }
        document.getElementById('currentDayTitle').innerText = saturday.toLocaleDateString('ar-EG', {day: 'numeric', month: 'long', year: 'numeric'});
        loadWeekData();
    }

    function loadWeekData() {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_PREFIX + currentWeekID)) || [];
        const container = document.getElementById('cardsList');
        container.innerHTML = masterWorkers.map((worker, idx) => {
            let d = saved.find(s => s.name === worker.name) || {sal:'', loans:['','','','','',''], att:[1,1,1,1,1,1], note:''};
            return `
                <div class="worker-card" id="card-${idx}">
                    <div class="card-name">${worker.name}</div>
                    <input type="text" inputmode="decimal" class="salary-input" value="${d.sal}" oninput="recalc(${idx})" placeholder="الراتب الأسبوعي">
                    <div class="days-grid">
                        ${[0,1,2,3,4,5].map(di => `<div class="day-box"><span class="day-date">${currentWeekDates[di]}</span><div class="att-btns"><button class="btn-tgl ${d.att[di]==1?'active':''}" data-v="1" onclick="toggleAtt(this,${idx})">ح</button><button class="btn-tgl ${d.att[di]==0.5?'active':''}" data-v="0.5" onclick="toggleAtt(this,${idx})">½</button><button class="btn-tgl ${d.att[di]==0?'active':''}" data-v="0" onclick="toggleAtt(this,${idx})">غ</button></div><input type="text" inputmode="decimal" class="loan-input" value="${d.loans[di] || ''}" oninput="recalc(${idx})" placeholder="سلفه"></div>`).join('')}
                    </div>
                    <textarea class="note-input" placeholder="ملاحظات..." rows="2">${d.note || ''}</textarea>
                    <div class="card-footer"><div class="footer-line"><span>سلف: <span class="sum-l">0</span></span> <span>قسط: <span class="sum-inst">0</span></span></div><div class="footer-line" style="font-size:14px; color:var(--dark-green);"><span>الصافي:</span> <span class="sum-n">0</span></div></div>
                    <button class="btn-share" onclick="shareToWhatsApp(${idx})">إرسال واتساب 🟢</button>
                </div>`;
        }).join('');
        masterWorkers.forEach((_, i) => recalc(i));
    }

    function toggleAtt(btn, idx) { Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active')); btn.classList.add('active'); recalc(idx); }
    
    function recalc(idx) {
        const c = document.getElementById(`card-${idx}`); if(!c) return;
        const worker = masterWorkers[idx];
        let sal = parseFloat(c.querySelector('.salary-input').value) || 0;
        let lTotal = 0; c.querySelectorAll('.loan-input').forEach(i => lTotal += parseFloat(i.value) || 0);
        let aTotal = 0; c.querySelectorAll('.btn-tgl.active').forEach(b => aTotal += parseFloat(b.dataset.v));
        let inst = (aTotal > 0) ? (parseFloat(worker.inst_weekly) || 0) : 0; 
        let net = Math.round(((sal / 6) * aTotal) - lTotal - inst);
        c.querySelector('.sum-l').innerText = lTotal; c.querySelector('.sum-inst').innerText = inst; c.querySelector('.sum-n').innerText = net > 0 ? net : 0;
        refreshStats();
    }

    function refreshStats() {
        let gL = 0, gN = 0, gS = 0;
        document.querySelectorAll('.worker-card').forEach(c => {
            gL += (parseFloat(c.querySelector('.sum-l').innerText) || 0) + (parseFloat(c.querySelector('.sum-inst').innerText) || 0);
            gN += parseFloat(c.querySelector('.sum-n').innerText) || 0; gS += parseFloat(c.querySelector('.salary-input').value) || 0;
        });
        document.getElementById('stat-sal').innerText = gS; document.getElementById('stat-loan').innerText = gL; document.getElementById('stat-net').innerText = gN;
    }

    function shareToWhatsApp(idx) {
        const c = document.getElementById(`card-${idx}`);
        const workerName = c.querySelector('.card-name').innerText;
        const baseSalary = c.querySelector('.salary-input').value || 0;
        const totalLoans = c.querySelector('.sum-l').innerText;
        const installment = c.querySelector('.sum-inst').innerText;
        const netAmount = c.querySelector('.sum-n').innerText;
        const notes = c.querySelector('.note-input').value;
        let att = 0, half = 0, abs = 0;
        c.querySelectorAll('.btn-tgl.active').forEach(b => { if(b.dataset.v=="1") att++; else if(b.dataset.v=="0.5") half++; else abs++; });
        const totalAtt = att + (half*0.5);
        const totalDed = parseFloat(totalLoans) + parseFloat(installment);
        const msg = `*📊 تقرير الراتب الأسبوعي - AZEMAA PRO*\n---------------------------------------\n👤 *العامل:* ${workerName}\n📅 *الأسبوع:* ${currentWeekDates[0]}\n---------------------------------------\n💰 *الراتب الأساسي:* ${baseSalary} ج.م\n✅ *الحضور:* ${totalAtt} أيام (${att} ح، ${half} ½، ${abs} غ)\n💸 *الخصومات:* سلف ${totalLoans} + قسط ${installment}\n💵 *الصافي:* ${netAmount} ج.م\n---------------------------------------\n${notes ? `📝 *ملاحظة:* ${notes}` : ''}\n*تم الاستخراج بواسطة نظام AZEMAA PRO*`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
    }

    function saveWeek() {
        const data = Array.from(document.querySelectorAll('.worker-card')).map((c, idx) => ({
            name: c.querySelector('.card-name').innerText, 
            sal: c.querySelector('.salary-input').value,
            loans: Array.from(c.querySelectorAll('.loan-input')).map(i => i.value),
            att: Array.from(c.querySelectorAll('.btn-tgl.active')).map(b => b.dataset.v),
            note: c.querySelector('.note-input').value, 
            instPaid: parseFloat(c.querySelector('.sum-inst').innerText) || 0, 
            fullDates: currentWeekDates 
        }));
        localStorage.setItem(STORAGE_KEY_PREFIX + currentWeekID, JSON.stringify(data));
        alert("✔️ تم الحفظ بنجاح");
        buildArchiveHistory();
    }

    function buildArchiveHistory() {
        const selectedName = document.getElementById('archiveSearch').value;
        const display = document.getElementById('archiveContent');
        if(!selectedName) { display.innerHTML = ""; return; }
        
        let html = "";
        let keys = Object.keys(localStorage).filter(k => k.startsWith(STORAGE_KEY_PREFIX));
        keys.sort((a,b) => b.localeCompare(a)); // الأحدث أولاً
        
        let foundAny = false;
        keys.forEach(key => {
            const dataArr = JSON.parse(localStorage.getItem(key));
            const d = dataArr.find(r => r.name === selectedName);
            if(d) {
                foundAny = true;
                let rows = ""; let tL = 0;
                d.loans.forEach((l, i) => {
                    const val = parseFloat(l) || 0; tL += val;
                    const label = d.att[i] == 1 ? "حاضر" : (d.att[i] == 0.5 ? "½ يوم" : "غائب");
                    rows += `<tr><td>${weekdays[i]}<br>${d.fullDates[i]}</td><td>${label}</td><td style="color:red">${val > 0 ? val : '-'}</td></tr>`;
                });
                const attSum = d.att.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
                const net = Math.max(0, Math.round(((parseFloat(d.sal)/6)*attSum) - tL - (d.instPaid||0)));
                html += `<div class="history-card"><div class="history-header"><span>📅 ${d.fullDates[0]}</span><b>صافي: ${net}</b></div><div style="padding:8px; font-size:12px; background:#f0f7f6;">💰 راتب: ${d.sal} | سلف: ${tL} | قسط: ${d.instPaid}</div>${d.note ? '<div style="padding:8px; font-size:11px; background:#fff8e1;">📝 '+d.note+'</div>' : ''}<table class="archive-table"><thead><tr><th>اليوم</th><th>الحالة</th><th>سلف</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            }
        });
        display.innerHTML = foundAny ? html : `<center style='padding:20px; color:red;'>⚠️ لا توجد سجلات محفوظة لهذا العامل في الأرشيف.</center>`;
    }

    function addNewWorker() { 
        let name = document.getElementById('workerNameInp').value.trim(); 
        if(name) { masterWorkers.push({id: Date.now(), name: name, inst_weekly: ''}); saveMaster(true); document.getElementById('workerNameInp').value = ""; } 
    }

    function updateInst(idx, val) { masterWorkers[idx].inst_weekly = val; saveMaster(); }
    function saveMaster(refreshUI = false) { localStorage.setItem(STORAGE_KEY_WORKERS, JSON.stringify(masterWorkers)); if(refreshUI) { updateWorkerEditor(); updateArchiveDropdown(); loadWeekData(); } }
    
    function updateWorkerEditor() { 
        document.getElementById('workerListEditor').innerHTML = masterWorkers.map((w, i) => `<div style="padding:10px; border:1px solid #ddd; background:#fff; margin-bottom:8px; border-radius:10px; display:flex; justify-content:space-between; align-items:center;"><b>${w.name}</b><div style="display:flex; gap:5px;"><input type="number" placeholder="قسط" style="width:60px; padding:5px" value="${w.inst_weekly}" oninput="updateInst(${i}, this.value)"><button onclick="removeWorker(${i})" style="color:red; border:none; background:none;">🗑️</button></div></div>`).join(''); 
    }
    
    function removeWorker(i) { if(confirm("هل أنت متأكد؟")) { masterWorkers.splice(i,1); saveMaster(true); } }
    function updateArchiveDropdown() { document.getElementById('archiveSearch').innerHTML = '<option value="">-- اختر العامل لعرض أرشيفه الشامل --</option>' + masterWorkers.map(w => `<option value="${w.name}">${w.name}</option>`).join(''); }

    window.onload = setup;
</script>
</body>
</html>
