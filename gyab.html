<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | النظام المتكامل المتصل بالسحاب</title>
    <style>
        :root {
            --whatsapp-green: #25D366; --dark-green: #075E54; --teal: #128C7E;
            --bg-gray: #f0f2f5; --white: #ffffff; --danger: #d32f2f;
            --warning: #f57c00;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; font-weight: 600; }
        
        header { 
            background: linear-gradient(135deg, var(--dark-green), var(--teal)); 
            color: var(--white); padding: 15px 10px; text-align: center; 
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
        }

        .header-title { font-size: 1.2rem; font-weight: 900; }
        #weekRangeDisplay { font-size: 13px; margin-top: 5px; background: rgba(0,0,0,0.1); display: inline-block; padding: 2px 10px; border-radius: 10px; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .dash-card { background: rgba(255, 255, 255, 0.15); padding: 8px 2px; border-radius: 12px; }
        .dash-card strong { font-size: 15px; display: block; }

        .main-container { padding: 12px; padding-bottom: 100px; }
        .config-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .date-selectors { display: flex; gap: 5px; margin-top: 10px; }
        .date-selectors select { 
            flex: 1; padding: 12px 5px; border-radius: 10px; border: 2px solid var(--teal); 
            font-weight: 900; background: #f9f9f9; cursor: pointer; text-align: center;
        }

        #cardsList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .worker-card { background: var(--white); border-radius: 15px; padding: 12px; border-top: 5px solid var(--teal); box-shadow: 0 3px 10px rgba(0,0,0,0.08); position: relative; }

        .card-name { font-size: 14px; color: var(--dark-green); text-align: center; margin-bottom: 8px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .salary-input { width: 100%; padding: 8px; border-radius: 8px; border: 1.5px solid #ddd; font-weight: 900; text-align: center; background: #fffcf0; box-sizing: border-box; margin-bottom: 10px;}

        .days-grid { display: grid; grid-template-columns: 1fr; gap: 5px; }
        .day-row { display: flex; align-items: center; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 4px; gap: 4px; }
        .day-info { flex: 1; text-align: right; }
        .day-name { font-size: 11px; color: var(--dark-green); display: block; line-height: 1; }
        .day-num { font-size: 10px; color: #777; font-weight: 900; }
        
        .att-btns { display: flex; gap: 2px; flex: 1.5; }
        .btn-tgl { flex: 1; border: 1px solid #ccc; background: #fff; font-size: 10px; font-weight: 900; padding: 6px 0; border-radius: 4px; cursor: pointer; }
        .btn-tgl.active[data-v="1"] { background: var(--whatsapp-green); color: white; border-color: var(--whatsapp-green); }
        .btn-tgl.active[data-v="0.5"] { background: var(--warning); color: white; border-color: var(--warning); }
        .btn-tgl.active[data-v="0"] { background: var(--danger); color: white; border-color: var(--danger); }

        .loan-input { width: 50px; border: 1px solid #ddd; border-radius: 5px; padding: 5px 0; text-align: center; font-weight: 900; color: var(--danger); font-size: 12px; background: #fff; }

        .note-input { 
            width: 100%; margin-top: 8px; padding: 10px; border-radius: 8px; 
            border: 1.5px solid #ccc; font-size: 12px; background: #fffef2; 
            box-sizing: border-box; font-weight: 900; font-family: inherit;
            resize: none;
        }

        .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 11px; font-weight: 900; }
        .footer-line { display: flex; justify-content: space-between; margin-bottom: 3px; }

        .btn-share { width: 100%; background: var(--whatsapp-green); color: white; border: none; padding: 10px; border-radius: 10px; margin-top: 10px; font-weight: 900; cursor: pointer; }
        
        .archive-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; background: white; border-radius: 8px; overflow: hidden; }
        .archive-table th { background: #eee; padding: 8px; border: 1px solid #ddd; }
        .archive-table td { padding: 8px; border: 1px solid #ddd; text-align: center; }
        .row-absent { background-color: #ffebee !important; color: #c62828 !important; font-weight: bold; }
        .row-half { background-color: #fff3e0 !important; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; background: white; padding: 12px; display: flex; box-sizing: border-box; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 2000; }
    </style>
</head>
<body>

<header>
    <div class="header-title">AZEMAA PRO 🌐</div>
    <div id="weekRangeDisplay">جاري التحميل...</div>
    <div class="dashboard">
        <div class="dash-card"><span>رواتب</span><strong id="stat-sal">0</strong></div>
        <div class="dash-card"><span>خصومات</span><strong id="stat-loan">0</strong></div>
        <div class="dash-card"><span>الصافي</span><strong id="stat-net">0</strong></div>
    </div>
</header>

<div class="main-container">
    <div class="config-box">
        <div style="font-size: 13px; color: var(--teal); text-align: center; font-weight: 900;">📅 اختيار تاريخ السبت:</div>
        <div class="date-selectors">
            <select id="dayPicker" onchange="updateDateFromSelectors()"></select>
            <select id="monthPicker" onchange="updateDateFromSelectors()">
                <option value="0">01</option><option value="1">02</option><option value="2">03</option>
                <option value="3">04</option><option value="4">05</option><option value="5">06</option>
                <option value="6">07</option><option value="7">08</option><option value="8">09</option>
                <option value="9">10</option><option value="10">11</option><option value="11">12</option>
            </select>
            <select id="yearPicker" onchange="updateDateFromSelectors()"></select>
        </div>
        <input type="hidden" id="datePicker" onchange="handleDateChange()">
        
        <details style="margin-top: 15px;">
            <summary style="font-weight: 900; color: var(--teal); cursor: pointer; text-align: center; background: #f9f9f9; padding: 10px; border-radius: 10px;">⚙️ الإعدادات</summary>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="workerNameInp" style="flex:2; border: 1px solid #ddd; padding: 8px; border-radius: 8px;" placeholder="اسم جديد">
                <button id="addWorkerBtn" style="background:var(--teal); color:white; border:none; padding:0 15px; border-radius:8px;">إضافة</button>
            </div>
            <div id="workerListEditor" style="margin-top:10px;"></div>
        </details>
    </div>

    <div id="cardsList"></div>

    <div style="background: white; border-radius: 15px; padding: 15px; margin-top: 20px; border: 2px solid var(--teal); margin-bottom: 80px;">
        <h3 style="text-align:center; color: var(--dark-green); margin:0 0 10px 0;">📂 الأرشيف التفصيلي</h3>
        <select id="archiveSearch" style="width:100%; padding:12px; border-radius:10px; font-weight:900; border:2px solid var(--teal);"></select>
        <div id="archiveContent" style="margin-top:15px;"></div>
    </div>
</div>

<div class="footer-nav">
    <button id="saveWeekBtn" style="width:100%; padding:15px; background:var(--dark-green); color:white; border:none; border-radius:12px; font-weight:900; cursor:pointer;">💾 حفظ الأسبوع الحالي سحابياً</button>
</div>

<!-- جلب مكتبات Firebase من السيرفر مباشرة -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // إعدادات الفايربيس الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
      authDomain: "azemaa-proo.firebaseapp.com",
      databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
      projectId: "azemaa-proo",
      storageBucket: "azemaa-proo.firebasestorage.app",
      messagingSenderId: "787350492977",
      appId: "1:787350492977:web:84061dcf31622fcb07c210",
      measurementId: "G-R28J7010TH"
    };

    // تهيئة المشروع وقاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const weekdays = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    let masterWorkers = [];
    let currentWeekDates = [];
    let currentWeekID = "";

    // ربط الوظائف بـ window لتظل قابلة للاستدعاء من الـ HTML
    window.updateDateFromSelectors = updateDateFromSelectors;
    window.handleDateChange = handleDateChange;
    window.toggleAtt = toggleAtt;
    window.recalc = recalc;
    window.shareToWhatsApp = shareToWhatsApp;
    window.updateInst = updateInst;
    window.removeWorker = removeWorker;

    // البدء عند تحميل الصفحة
    window.onload = async function() {
        initDateSelectors();
        await fetchMasterWorkers();
    };

    function initDateSelectors() {
        const dSel = document.getElementById('dayPicker');
        const ySel = document.getElementById('yearPicker');
        const now = new Date();
        
        for(let i=1; i<=31; i++) { dSel.add(new Option(i, i, i === now.getDate(), i === now.getDate())); }
        
        const startYear = 2024;
        const endYear = startYear + 50;
        for(let i = startYear; i <= endYear; i++) { 
            ySel.add(new Option(i, i, i === now.getFullYear(), i === now.getFullYear())); 
        }
        
        document.getElementById('monthPicker').value = now.getMonth();
        updateDateFromSelectors();
    }

    function updateDateFromSelectors() {
        const d = document.getElementById('dayPicker').value;
        const m = parseInt(document.getElementById('monthPicker').value) + 1;
        const y = document.getElementById('yearPicker').value;
        document.getElementById('datePicker').value = `${y}-${m.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        handleDateChange();
    }

    function handleDateChange() {
        const pickedDate = new Date(document.getElementById('datePicker').value);
        if (isNaN(pickedDate)) return;
        let dayOfWeek = pickedDate.getDay();
        let diffToSaturday = (dayOfWeek === 6) ? 0 : (dayOfWeek + 1);
        let saturday = new Date(pickedDate);
        saturday.setDate(pickedDate.getDate() - diffToSaturday);
        currentWeekID = saturday.toISOString().split('T')[0];
        currentWeekDates = [];
        for(let i=0; i<6; i++) {
            let d = new Date(saturday); d.setDate(saturday.getDate() + i);
            currentWeekDates.push(d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear());
        }
        document.getElementById('weekRangeDisplay').innerText = `من السبت ${currentWeekDates[0]} إلى الخميس ${currentWeekDates[5]}`;
        loadWeekData();
    }

    // جلب قائمة العمال من فايربيس
    async function fetchMasterWorkers() {
        const dbRef = ref(db);
        try {
            const snapshot = await get(child(dbRef, 'masterWorkers'));
            if (snapshot.exists()) {
                masterWorkers = snapshot.val();
            } else {
                masterWorkers = [];
            }
            updateWorkerEditor();
            updateArchiveDropdown();
        } catch (error) {
            console.error("خطأ في جلب بيانات العمال:", error);
        }
    }

    // جلب بيانات الأسبوع الحالي من فايربيس
    async function loadWeekData() {
        const dbRef = ref(db);
        let saved = [];
        try {
            const snapshot = await get(child(dbRef, `weeks/${currentWeekID}`));
            if (snapshot.exists()) {
                saved = snapshot.val();
            }
        } catch (error) {
            console.error("خطأ في جلب بيانات الأسبوع:", error);
        }

        const container = document.getElementById('cardsList');
        container.innerHTML = masterWorkers.map((worker, idx) => {
            let d = saved.find(s => s.name === worker.name) || {sal:'', loans:['','','','','',''], att:[1,1,1,1,1,1], note:''};
            return `
                <div class="worker-card" id="card-${idx}">
                    <div class="card-name">${worker.name}</div>
                    <input type="text" inputmode="decimal" class="salary-input" value="${d.sal}" oninput="recalc(${idx})" placeholder="الراتب الأسبوعي">
                    <div class="days-grid">
                        ${[0,1,2,3,4,5].map(di => `
                            <div class="day-row">
                                <div class="day-info">
                                    <span class="day-name">${weekdays[di]}</span>
                                    <span class="day-num">${currentWeekDates[di]}</span>
                                </div>
                                <div class="att-btns">
                                    <button class="btn-tgl ${d.att[di]==1?'active':''}" data-v="1" onclick="toggleAtt(this,${idx})">ح</button>
                                    <button class="btn-tgl ${d.att[di]==0.5?'active':''}" data-v="0.5" onclick="toggleAtt(this,${idx})">½</button>
                                    <button class="btn-tgl ${d.att[di]==0?'active':''}" data-v="0" onclick="toggleAtt(this,${idx})">غ</button>
                                </div>
                                <input type="text" inputmode="decimal" class="loan-input" value="${d.loans[di] || ''}" oninput="recalc(${idx})" placeholder="سلفه">
                            </div>
                        `).join('')}
                    </div>
                    <textarea class="note-input" placeholder="ملاحظات العمال..." rows="2">${d.note || ''}</textarea>
                    <div class="card-footer">
                        <div class="footer-line"><span>سلف: <span class="sum-l">0</span></span> <span>قسط: <span class="sum-inst">0</span></span></div>
                        <div class="footer-line" style="font-size:14px; color:var(--dark-green);"><span>الصافي:</span> <span class="sum-n">0</span></div>
                    </div>
                    <button class="btn-share" onclick="shareToWhatsApp(${idx})">إرسال واتساب 🟢</button>
                </div>`;
        }).join('');
        masterWorkers.forEach((_, i) => recalc(i));
    }

    function toggleAtt(btn, idx) { Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active')); btn.classList.add('active'); recalc(idx); }
    
    function recalc(idx) {
        const c = document.getElementById(`card-${idx}`); if(!c) return;
        const worker = masterWorkers[idx];
        let sal = parseFloat(c.querySelector('.salary-input').value) || 0;
        let lTotal = 0; c.querySelectorAll('.loan-input').forEach(i => lTotal += parseFloat(i.value) || 0);
        let aTotal = 0; c.querySelectorAll('.btn-tgl.active').forEach(b => aTotal += parseFloat(b.dataset.v));
        let inst = (aTotal > 0) ? (parseFloat(worker.inst_weekly) || 0) : 0; 
        let net = Math.round(((sal / 6) * aTotal) - lTotal - inst);
        c.querySelector('.sum-l').innerText = lTotal; c.querySelector('.sum-inst').innerText = inst; c.querySelector('.sum-n').innerText = net > 0 ? net : 0;
        refreshStats();
    }

    function refreshStats() {
        let gL = 0, gN = 0, gS = 0;
        document.querySelectorAll('.worker-card').forEach(c => {
            gL += (parseFloat(c.querySelector('.sum-l').innerText) || 0) + (parseFloat(c.querySelector('.sum-inst').innerText) || 0);
            gN += parseFloat(c.querySelector('.sum-n').innerText) || 0; gS += parseFloat(c.querySelector('.salary-input').value) || 0;
        });
        document.getElementById('stat-sal').innerText = gS; document.getElementById('stat-loan').innerText = gL; document.getElementById('stat-net').innerText = gN;
    }

    // حفظ أسبوع في فايربيس
    document.getElementById('saveWeekBtn').onclick = async function saveWeek() {
        const data = Array.from(document.querySelectorAll('.worker-card')).map((c, idx) => ({
            name: c.querySelector('.card-name').innerText.trim(), 
            sal: c.querySelector('.salary-input').value,
            loans: Array.from(c.querySelectorAll('.loan-input')).map(i => i.value),
            att: Array.from(c.querySelectorAll('.btn-tgl.active')).map(b => b.dataset.v),
            note: c.querySelector('.note-input').value, 
            instPaid: parseFloat(c.querySelector('.sum-inst').innerText) || 0, 
            fullDates: currentWeekDates 
        }));

        try {
            await set(ref(db, `weeks/${currentWeekID}`), data);
            alert("✔️ تم الحفظ في السحاب بنجاح");
            buildArchiveHistory();
        } catch (error) {
            alert("❌ فشل الحفظ: " + error.message);
        }
    }

    // بناء سجل الأرشيف من البيانات السحابية مباشرة
    async function buildArchiveHistory() {
        const selectedName = document.getElementById('archiveSearch').value.trim();
        const display = document.getElementById('archiveContent');
        if(!selectedName) { display.innerHTML = ""; return; }
        
        let html = "";
        try {
            const snapshot = await get(child(ref(db), 'weeks'));
            if(snapshot.exists()) {
                const allWeeks = snapshot.val();
                let keys = Object.keys(allWeeks).sort((a,b) => b.localeCompare(a));
                
                keys.forEach(key => {
                    const dataArr = allWeeks[key];
                    const d = dataArr.find(r => r.name.trim() === selectedName);
                    if(d) {
                        let loansArr = d.loans || [0,0,0,0,0,0];
                        let attArr = d.att || [1,1,1,1,1,1];
                        let fDates = d.fullDates || ["","","","","",""];
                        let tL = loansArr.reduce((a, b) => a + (parseFloat(b) || 0), 0);
                        let attSum = attArr.reduce((a, b) => a + parseFloat(b), 0);
                        let net = Math.max(0, Math.round(((parseFloat(d.sal)/6)*attSum)-tL-(d.instPaid||0)));

                        let tableRows = "";
                        for(let i=0; i<6; i++) {
                            let status = attArr[i] == 1 ? "حاضر" : (attArr[i] == 0.5 ? "نصف يوم" : "غائب");
                            let rowClass = attArr[i] == 0 ? "row-absent" : (attArr[i] == 0.5 ? "row-half" : "");
                            tableRows += `<tr class="${rowClass}">
                                <td style="font-size:10px;">${weekdays[i]}<br>${fDates[i]}</td>
                                <td>${status}</td>
                                <td>${loansArr[i] || '-'}</td>
                            </tr>`;
                        }

                        html += `<div style="margin-bottom:25px; border:2px solid #ddd; border-radius:10px; overflow:hidden;">
                            <div style="background:#f8f9fa; padding:10px; border-bottom:1px solid #ddd;">
                                <div style="font-weight:900; color:var(--dark-green);">📅 أسبوع: ${fDates[0]}</div>
                                <div style="font-size:11px;">الراتب الأساسي: ${d.sal} | قسط: ${d.instPaid} | <b>الصافي: ${net}</b></div>
                            </div>
                            <table class="archive-table">
                                <thead><tr><th>اليوم</th><th>الحالة</th><th>سلف</th></tr></thead>
                                <tbody>${tableRows}</tbody>
                            </table>
                            ${d.note ? `<div style="padding:10px; font-size:12px; font-weight:900; background:#fffdef; border-top:1px solid #eee;">📝 ملاحظة: ${d.note}</div>` : ''}
                        </div>`;
                    }
                });
            }
        } catch (error) {
            console.error("خطأ في جلب الأرشيف:", error);
        }
        display.innerHTML = html || "<center>لا توجد بيانات لهذا الاسم</center>";
    }

    document.getElementById('archiveSearch').oninput = buildArchiveHistory;

    function shareToWhatsApp(idx) {
        const c = document.getElementById(`card-${idx}`);
        const workerName = c.querySelector('.card-name').innerText;
        const baseSalary = c.querySelector('.salary-input').value || 0;
        const totalLoans = c.querySelector('.sum-l').innerText;
        const installment = c.querySelector('.sum-inst').innerText;
        const netAmount = c.querySelector('.sum-n').innerText;
        const notes = c.querySelector('.note-input').value;
        let att = 0, half = 0;
        c.querySelectorAll('.btn-tgl.active').forEach(b => { if(b.dataset.v=="1") att++; else if(b.dataset.v=="0.5") half++; });
        const totalAtt = att + (half*0.5);
        const msg = `*📊 تقرير راتب - AZEMAA PRO*\n👤 *العامل:* ${workerName}\n📅 *الأسبوع:* ${currentWeekDates[0]}\n-------------------\n💰 *الراتب:* ${baseSalary}\n✅ *الحضور:* ${totalAtt} أيام\n💸 *سلف:* ${totalLoans}\n💳 *قسط:* ${installment}\n💵 *الصافي النهائي:* ${netAmount}\n-------------------\n${notes ? `📝 *ملاحظة:* ${notes}` : ''}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
    }

    // إضافة عامل جديد وحفظه في فايربيس
    document.getElementById('addWorkerBtn').onclick = async function addNewWorker() { 
        let name = document.getElementById('workerNameInp').value.trim(); 
        if(name) { 
            masterWorkers.push({id: Date.now(), name: name, inst_weekly: ''}); 
            await saveMaster(true); 
            document.getElementById('workerNameInp').value = ""; 
        } 
    }

    function updateInst(idx, val) { 
        masterWorkers[idx].inst_weekly = val; 
        saveMaster(); 
    }

    async function saveMaster(refreshUI = false) { 
        try {
            await set(ref(db, 'masterWorkers'), masterWorkers);
            if(refreshUI) { 
                updateWorkerEditor(); 
                updateArchiveDropdown(); 
                loadWeekData(); 
            } 
        } catch (error) {
            console.error("حدث خطأ أثناء حفظ قائمة العمال:", error);
        }
    }

    function updateWorkerEditor() { 
        document.getElementById('workerListEditor').innerHTML = masterWorkers.map((w, i) => `<div style="padding:10px; border:1px solid #ddd; background:#fff; margin-bottom:8px; border-radius:10px; display:flex; justify-content:space-between; align-items:center;"><b>${w.name}</b><div style="display:flex; gap:5px;"><input type="number" placeholder="قسط" style="width:60px; padding:5px" value="${w.inst_weekly || ''}" oninput="updateInst(${i}, this.value)"><button onclick="removeWorker(${i})" style="color:red; border:none; background:none;">🗑️</button></div></div>`).join(''); 
    }
    
    async function removeWorker(i) { 
        if(confirm("حذف العامل؟")) { 
            masterWorkers.splice(i,1); 
            await saveMaster(true); 
        } 
    }
    
    function updateArchiveDropdown() { 
        document.getElementById('archiveSearch').innerHTML = '<option value="">-- اختر اسم العامل --</option>' + masterWorkers.map(w => `<option value="${w.name}">${w.name}</option>`).join(''); 
    }
</script>
</body>
</html>
