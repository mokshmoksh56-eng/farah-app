<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | النظام المطور</title>
    <style>
        :root {
            --whatsapp-green: #25D366; --dark-green: #075E54; --teal: #128C7E;
            --bg-gray: #f0f2f5; --white: #ffffff; --danger: #d32f2f;
            --warning: #f57c00; --today-red-bg: #ffebee;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; font-weight: 600; }
        
        header { 
            background: linear-gradient(135deg, var(--dark-green), var(--teal)); 
            color: var(--white); padding: 15px 10px; text-align: center; 
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
        }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .dash-card { background: rgba(255, 255, 255, 0.15); padding: 8px 2px; border-radius: 12px; }
        .dash-card strong { font-size: 15px; display: block; }

        .main-container { padding: 12px; padding-bottom: 100px; }

        .config-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .selector-row { display: flex; gap: 8px; margin-bottom: 12px; }
        select, input { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #eee; font-weight: 900; }

        #cardsList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .worker-card { background: var(--white); border-radius: 15px; padding: 12px; border-top: 5px solid var(--teal); box-shadow: 0 3px 10px rgba(0,0,0,0.08); }

        .card-name { font-size: 14px; color: var(--dark-green); text-align: center; margin-bottom: 8px; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }
        .salary-input { width: 100%; padding: 8px; border-radius: 8px; border: 1.5px solid #ddd; font-weight: 900; text-align: center; background: #fffcf0; box-sizing: border-box; }

        .days-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 10px; }
        .day-box { background: #fafafa; padding: 5px; border-radius: 8px; border: 1px solid #eee; text-align: center; }
        .day-date { font-size: 9px; color: var(--teal); display: block; font-weight: 800; }
        
        .att-btns { display: flex; gap: 2px; margin-bottom: 4px; margin-top: 3px; }
        .btn-tgl { flex: 1; border: 1px solid #ccc; background: #fff; font-size: 10px; font-weight: 900; padding: 6px 0; border-radius: 4px; cursor: pointer; }
        .btn-tgl.active[data-v="1"] { background: var(--whatsapp-green); color: white; border-color: var(--whatsapp-green); }
        .btn-tgl.active[data-v="0.5"] { background: var(--warning); color: white; border-color: var(--warning); }
        .btn-tgl.active[data-v="0"] { background: var(--danger); color: white; border-color: var(--danger); }

        .loan-input { width: 100%; border: 1px solid #ddd; border-radius: 5px; padding: 6px 0; text-align: center; font-weight: 900; color: var(--danger); font-size: 13px; }

        .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 11px; font-weight: 900; }
        .footer-line { display: flex; justify-content: space-between; margin-bottom: 3px; }

        .archive-zone { background: #ffffff; padding: 15px; border-radius: 15px; margin-top: 20px; border: 2px solid var(--teal); }
        .history-card { background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; border-right: 5px solid var(--dark-green); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .archive-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 11px; }
        .archive-table th, .archive-table td { border: 1px solid #ddd; padding: 4px; text-align: center; }
        .archive-table th { background: #eee; }

        .footer-nav { position: fixed; bottom: 0; width: 100%; background: white; padding: 12px; display: flex; box-sizing: border-box; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 2000; }
        .btn-footer { flex: 1; padding: 15px; border-radius: 12px; border: none; font-weight: 900; color: white; cursor: pointer; background: var(--dark-green); }
    </style>
</head>
<body>

<header>
    <div class="header-title">AZEMAA PRO | <span id="currentDayTitle"></span></div>
    <div class="dashboard">
        <div class="dash-card"><span>رواتب</span><strong id="stat-sal">0</strong></div>
        <div class="dash-card"><span>سلف+قسط</span><strong id="stat-loan">0</strong></div>
        <div class="dash-card"><span>الصافي</span><strong id="stat-net">0</strong></div>
    </div>
</header>

<div class="main-container">
    <div class="config-box">
        <div class="selector-row">
            <select id="yearSelect" onchange="initWeeks()"></select>
            <select id="weekSelect" onchange="loadWeekData()"></select>
        </div>
        
        <details>
            <summary style="font-weight: 900; color: var(--teal); cursor: pointer; text-align: center; background: #f9f9f9; padding: 10px; border-radius: 10px;">⚙️ الإعدادات والعمال</summary>
            <div style="display:flex; gap:5px; margin-top:10px;">
                <input type="text" id="workerNameInp" style="flex:2" placeholder="اسم العامل الجديد...">
                <button onclick="addNewWorker()" style="background:var(--teal); color:white; border:none; padding:0 15px; border-radius:8px;">إضافة</button>
            </div>
            <div id="workerListEditor" style="margin-top:10px;"></div>
        </details>
    </div>

    <div id="cardsList"></div>

    <div class="archive-zone">
        <h3 style="text-align:center; color: var(--dark-green); margin:0 0 10px 0;">📂 الأرشيف التفصيلي</h3>
        <select id="archiveSearch" onchange="buildArchiveHistory()" style="width:100%; padding:10px; border-radius:8px; font-weight:900; border:1.5px solid var(--teal);"></select>
        <div id="archiveContent" style="margin-top:15px;"></div>
    </div>
</div>

<div class="footer-nav">
    <button onclick="saveWeek()" class="btn-footer">💾 حفظ بيانات الأسبوع</button>
</div>

<script>
    const STORAGE_KEY_WORKERS = 'f_workers_v2026_simple';
    const STORAGE_KEY_PREFIX = 'f_data_v2026_simple_';

    let masterWorkers = JSON.parse(localStorage.getItem(STORAGE_KEY_WORKERS)) || [];
    const weekdays = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    let currentWeekDates = [];

    function setup() {
        const now = new Date();
        const currentYear = now.getFullYear();
        
        const yrSelect = document.getElementById('yearSelect');
        for(let y = 2025; y <= 2030; y++) yrSelect.add(new Option(y, y));
        yrSelect.value = currentYear;

        // حساب الأسبوع الحالي بناءً على تاريخ اليوم
        let startOfYear = new Date(currentYear, 0, 1);
        let days = Math.floor((now - startOfYear) / (24 * 60 * 60 * 1000));
        let currentWeek = Math.ceil((days + startOfYear.getDay() + 1) / 7);

        initWeeks(currentWeek);
        updateWorkerEditor();
        updateArchiveDropdown();
        
        document.getElementById('currentDayTitle').innerText = now.toLocaleDateString('ar-EG', {weekday: 'long', day: 'numeric', month: 'long'});
    }

    function initWeeks(targetWeek = null) {
        const yr = document.getElementById('yearSelect').value;
        const wkSelect = document.getElementById('weekSelect');
        wkSelect.innerHTML = "";
        
        // العثور على أول يوم سبت في السنة
        let date = new Date(yr, 0, 1);
        while (date.getDay() !== 6) date.setDate(date.getDate() + 1); 
        
        for(let i=1; i<=52; i++) {
            let start = new Date(date);
            let end = new Date(date);
            end.setDate(end.getDate() + 5); // للخميس
            
            let label = `إسبوع ${i} (${start.getDate()}/${start.getMonth()+1} إلى ${end.getDate()}/${end.getMonth()+1})`;
            wkSelect.add(new Option(label, i));
            
            date.setDate(date.getDate() + 7);
        }
        
        if (targetWeek) wkSelect.value = targetWeek;
        loadWeekData();
    }

    function getDatesForWeek(yr, wk) {
        let date = new Date(yr, 0, 1);
        while (date.getDay() !== 6) date.setDate(date.getDate() + 1);
        date.setDate(date.getDate() + (wk - 1) * 7);
        
        let dates = [];
        for(let i=0; i<6; i++) {
            let d = new Date(date);
            d.setDate(d.getDate() + i);
            dates.push(`${d.getDate()}/${d.getMonth()+1}`);
        }
        return dates;
    }

    function loadWeekData() {
        const yr = document.getElementById('yearSelect').value;
        const wk = document.getElementById('weekSelect').value;
        currentWeekDates = getDatesForWeek(yr, wk);

        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY_PREFIX + yr + '_w' + wk)) || [];
        const container = document.getElementById('cardsList');
        
        container.innerHTML = masterWorkers.map((worker, idx) => {
            let d = saved.find(s => s.name === worker.name) || {sal:'', loans:['','','','','',''], att:[1,1,1,1,1,1]};
            return `
                <div class="worker-card" id="card-${idx}">
                    <div class="card-name">${worker.name}</div>
                    <input type="text" inputmode="decimal" class="salary-input" value="${d.sal}" oninput="recalc(${idx})" placeholder="الراتب الأسبوعي">
                    <div class="days-grid">
                        ${[0,1,2,3,4,5].map(di => `
                            <div class="day-box">
                                <span class="day-date">${currentWeekDates[di]}</span>
                                <span style="font-size:10px;">${weekdays[di]}</span>
                                <div class="att-btns">
                                    <button class="btn-tgl ${d.att[di]==1?'active':''}" data-v="1" onclick="toggleAtt(this,${idx})">ح</button>
                                    <button class="btn-tgl ${d.att[di]==0.5?'active':''}" data-v="0.5" onclick="toggleAtt(this,${idx})">½</button>
                                    <button class="btn-tgl ${d.att[di]==0?'active':''}" data-v="0" onclick="toggleAtt(this,${idx})">غ</button>
                                </div>
                                <input type="text" inputmode="decimal" class="loan-input" value="${d.loans[di] || ''}" oninput="recalc(${idx})" placeholder="سلفة">
                            </div>
                        `).join('')}
                    </div>
                    <div class="card-footer">
                        <div class="footer-line"><span>سلف: <span class="sum-l">0</span></span> <span>قسط: <span class="sum-inst">0</span></span></div>
                        <div class="footer-line" style="font-size:14px; color:var(--dark-green);"><span>الصافي:</span> <span class="sum-n">0</span></div>
                    </div>
                </div>
            `;
        }).join('');
        masterWorkers.forEach((_, i) => recalc(i));
    }

    function toggleAtt(btn, idx) { 
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
        recalc(idx); 
    }
    
    function recalc(idx) {
        const c = document.getElementById(`card-${idx}`);
        if(!c) return;
        const worker = masterWorkers[idx];
        let sal = parseFloat(c.querySelector('.salary-input').value) || 0;
        let lTotal = 0; c.querySelectorAll('.loan-input').forEach(i => lTotal += parseFloat(i.value) || 0);
        let aTotal = 0; c.querySelectorAll('.btn-tgl.active').forEach(b => aTotal += parseFloat(b.dataset.v));
        
        let inst = (aTotal > 0) ? (parseFloat(worker.inst_weekly) || 0) : 0; 
        let dailySal = sal / 6;
        let net = Math.round((dailySal * aTotal) - lTotal - inst);
        
        c.querySelector('.sum-l').innerText = lTotal;
        c.querySelector('.sum-inst').innerText = inst;
        c.querySelector('.sum-n').innerText = net > 0 ? net : 0;
        refreshStats();
    }

    function refreshStats() {
        let gL = 0, gN = 0, gS = 0;
        document.querySelectorAll('.worker-card').forEach(c => {
            gL += parseFloat(c.querySelector('.sum-l').innerText) + parseFloat(c.querySelector('.sum-inst').innerText);
            gN += parseFloat(c.querySelector('.sum-n').innerText);
            gS += parseFloat(c.querySelector('.salary-input').value) || 0;
        });
        document.getElementById('stat-sal').innerText = gS;
        document.getElementById('stat-loan').innerText = gL;
        document.getElementById('stat-net').innerText = gN;
    }

    function saveWeek() {
        const yr = document.getElementById('yearSelect').value;
        const wk = document.getElementById('weekSelect').value;
        const data = Array.from(document.querySelectorAll('.worker-card')).map((c, idx) => ({
            name: c.querySelector('.card-name').innerText,
            sal: c.querySelector('.salary-input').value,
            loans: Array.from(c.querySelectorAll('.loan-input')).map(i => i.value),
            att: Array.from(c.querySelectorAll('.btn-tgl.active')).map(b => b.dataset.v),
            instPaid: parseFloat(c.querySelector('.sum-inst').innerText) || 0,
            weekDates: currentWeekDates 
        }));
        localStorage.setItem(STORAGE_KEY_PREFIX + yr + '_w' + wk, JSON.stringify(data));
        alert("✔️ تم حفظ بيانات الأسبوع والتواريخ بنجاح");
        buildArchiveHistory();
    }

    function buildArchiveHistory() {
        const name = document.getElementById('archiveSearch').value;
        const display = document.getElementById('archiveContent');
        if(!name) { display.innerHTML = ""; return; }
        
        let html = "";
        let keys = Object.keys(localStorage).filter(k => k.startsWith(STORAGE_KEY_PREFIX)).sort().reverse();
        
        keys.forEach(key => {
            const dataArr = JSON.parse(localStorage.getItem(key));
            const d = dataArr.find(r => r.name === name);
            if(d) {
                const parts = key.replace(STORAGE_KEY_PREFIX, "").split('_w');
                const yr = parts[0];
                const wk = parts[1];
                const dates = d.weekDates || getDatesForWeek(yr, wk);
                
                let rows = "";
                let totalLoans = 0;
                d.loans.forEach((loan, i) => {
                    const lVal = parseFloat(loan) || 0;
                    totalLoans += lVal;
                    const attVal = d.att[i];
                    const attLabel = attVal == 1 ? "حاضر" : (attVal == 0.5 ? "نص يوم" : "غائب");
                    const color = attVal == 1 ? "green" : (attVal == 0.5 ? "orange" : "red");
                    
                    rows += `<tr>
                        <td>${weekdays[i]}</td>
                        <td>${dates[i]}</td>
                        <td style="color:${color}">${attLabel}</td>
                        <td style="color:red">${lVal > 0 ? lVal : '-'}</td>
                    </tr>`;
                });

                const attSum = d.att.reduce((a, b) => parseFloat(a) + parseFloat(b), 0);
                const net = Math.max(0, Math.round(((parseFloat(d.sal)/6)*attSum) - totalLoans - (d.instPaid||0)));

                html += `
                <div class="history-card">
                    <div style="display:flex; justify-content:space-between; border-bottom:1px solid #ddd; padding-bottom:5px; margin-bottom:5px;">
                        <span>📅 أسبوع: <b>${wk}</b> (${yr})</span>
                        <span style="color:var(--teal)">صافي: <b>${net}</b></span>
                    </div>
                    <table class="archive-table">
                        <thead>
                            <tr><th>اليوم</th><th>التاريخ</th><th>الحضور</th><th>سلفة</th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>`;
            }
        });
        display.innerHTML = html || "<center>لا توجد بيانات مسجلة لهذا العامل</center>";
    }

    function addNewWorker() {
        let name = document.getElementById('workerNameInp').value.trim();
        if(name) { 
            masterWorkers.push({name: name, inst_weekly: ''}); 
            saveMaster(true);
            document.getElementById('workerNameInp').value = "";
        }
    }

    function updateInst(idx, val) {
        masterWorkers[idx].inst_weekly = val;
        localStorage.setItem(STORAGE_KEY_WORKERS, JSON.stringify(masterWorkers));
        recalc(idx);
    }

    function saveMaster(refreshUI = false) {
        localStorage.setItem(STORAGE_KEY_WORKERS, JSON.stringify(masterWorkers));
        if(refreshUI) { updateWorkerEditor(); updateArchiveDropdown(); loadWeekData(); }
    }

    function updateWorkerEditor() {
        document.getElementById('workerListEditor').innerHTML = masterWorkers.map((w, i) => `
            <div style="padding:10px; border:1px solid #ddd; background:#fff; margin-bottom:8px; border-radius:10px; display:flex; align-items:center; gap:10px;">
                <b style="flex:1">${w.name}</b>
                <input type="text" placeholder="قسط" style="width:60px; padding:5px" value="${w.inst_weekly}" oninput="updateInst(${i}, this.value)">
                <button onclick="removeWorker(${i})" style="color:red; border:none; background:none;">🗑️</button>
            </div>
        `).join('');
    }

    function removeWorker(i) { if(confirm("حذف العامل؟")) { masterWorkers.splice(i,1); saveMaster(true); } }
    
    function updateArchiveDropdown() { 
        document.getElementById('archiveSearch').innerHTML = '<option value="">-- اختر اسم العامل لعرض تاريخه --</option>' + masterWorkers.map(w => `<option value="${w.name}">${w.name}</option>`).join(''); 
    }

    window.onload = setup;
</script>
</body>
</html>
