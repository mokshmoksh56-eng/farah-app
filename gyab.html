<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO | الحضور اللحظي</title>
    <style>
        :root {
            --whatsapp-green: #25D366; --dark-green: #075E54; --teal: #128C7E;
            --bg-gray: #f0f2f5; --white: #ffffff; --danger: #d32f2f;
            --warning: #f57c00;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-gray); margin: 0; padding: 0; font-weight: 600; padding-bottom: 50px; }
        
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-gray);
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 16px; color: var(--dark-green); font-weight: bold;
        }

        header { 
            background: linear-gradient(135deg, var(--dark-green), var(--teal)); 
            color: var(--white); padding: 15px 10px; text-align: center; 
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .sync-indicator { font-size: 11px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; margin-bottom: 5px; display: inline-block; }
        .header-title { font-size: 1.2rem; font-weight: 900; }
        #weekRangeDisplay { font-size: 13px; margin-top: 5px; background: rgba(0,0,0,0.1); display: inline-block; padding: 2px 10px; border-radius: 10px; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
        .dash-card { background: rgba(255, 255, 255, 0.15); padding: 8px 2px; border-radius: 12px; }
        .dash-card strong { font-size: 15px; display: block; }

        .main-container { padding: 12px; }
        .config-box { background: white; border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        
        .date-selectors { display: flex; gap: 5px; margin-top: 10px; }
        .date-selectors select { 
            flex: 1; padding: 12px 5px; border-radius: 10px; border: 2px solid var(--teal); 
            font-weight: 900; background: #f9f9f9; cursor: pointer; text-align: center;
        }

        #cardsList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (max-width: 550px) { #cardsList { grid-template-columns: 1fr; } }
        .worker-card { background: var(--white); border-radius: 15px; padding: 12px; border-top: 5px solid var(--teal); box-shadow: 0 3px 10px rgba(0,0,0,0.08); position: relative; }

        .card-name { font-size: 14px; color: var(--dark-green); text-align: center; margin-bottom: 8px; border-bottom: 2px solid #f0f0f0; padding-bottom: 5px; }
        .salary-input { width: 100%; padding: 8px; border-radius: 8px; border: 1.5px solid #ddd; font-weight: 900; text-align: center; background: #fffcf0; box-sizing: border-box; margin-bottom: 10px;}

        .days-grid { display: grid; grid-template-columns: 1fr; gap: 5px; }
        .day-row { display: flex; align-items: center; background: #fdfdfd; border: 1px solid #eee; border-radius: 8px; padding: 4px; gap: 4px; }
        .day-info { flex: 1; text-align: right; }
        .day-name { font-size: 11px; color: var(--dark-green); display: block; line-height: 1; }
        
        .att-btns { display: flex; gap: 2px; flex: 1.5; }
        .btn-tgl { flex: 1; border: 1px solid #ccc; background: #fff; font-size: 10px; font-weight: 900; padding: 6px 0; border-radius: 4px; cursor: pointer; }
        .btn-tgl.active[data-v="1"] { background: var(--whatsapp-green); color: white; border-color: var(--whatsapp-green); }
        .btn-tgl.active[data-v="0.5"] { background: var(--warning); color: white; border-color: var(--warning); }
        .btn-tgl.active[data-v="0"] { background: var(--danger); color: white; border-color: var(--danger); }

        .loan-input { width: 50px; border: 1px solid #ddd; border-radius: 5px; padding: 5px 0; text-align: center; font-weight: 900; color: var(--danger); font-size: 12px; background: #fff; }

        .note-input { 
            width: 100%; margin-top: 8px; padding: 10px; border-radius: 8px; 
            border: 1.5px solid #ccc; font-size: 12px; background: #fffef2; 
            box-sizing: border-box; font-weight: 900; font-family: inherit; resize: none;
        }

        .card-footer { margin-top: 10px; padding-top: 8px; border-top: 1px dashed #ddd; font-size: 11px; font-weight: 900; }
        .footer-line { display: flex; justify-content: space-between; margin-bottom: 3px; }

        .btn-share { width: 100%; background: var(--whatsapp-green); color: white; border: none; padding: 10px; border-radius: 10px; margin-top: 10px; font-weight: 900; cursor: pointer; }
        
        .archive-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; background: white; border-radius: 8px; overflow: hidden; }
        .archive-table th { background: #eee; padding: 8px; border: 1px solid #ddd; }
        .archive-table td { padding: 8px; border: 1px solid #ddd; text-align: center; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210",
            measurementId: "G-R28J7010TH"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.db = db; window.ref = ref; window.update = update; window.get = get;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUid = user.uid;
                document.getElementById('auth-loader').style.display = 'none';
                initSystem();
            } else {
                document.getElementById('auth-loader').innerText = "⚠️ يرجى تسجيل الدخول أولاً";
            }
        });
    </script>
</head>
<body>

<div id="auth-loader">⏳ جاري ربط المزامنة اللحظية...</div>

<header>
    <div class="sync-indicator" id="syncStatus">✅ متصل ومؤمن</div>
    <div class="header-title">AZEMAA PRO | لوحة الحضور الذكية</div>
    <div id="weekRangeDisplay">...</div>
    <div class="dashboard">
        <div class="dash-card"><span>رواتب</span><strong id="stat-sal">0</strong></div>
        <div class="dash-card"><span>خصومات</span><strong id="stat-loan">0</strong></div>
        <div class="dash-card"><span>الصافي</span><strong id="stat-net">0</strong></div>
    </div>
</header>

<div class="main-container">
    <div class="config-box">
        <div class="date-selectors">
            <select id="dayPicker" onchange="updateDateFromSelectors()"></select>
            <select id="monthPicker" onchange="updateDateFromSelectors()">
                <option value="0">يناير</option><option value="1">فبراير</option><option value="2">مارس</option>
                <option value="3">أبريل</option><option value="4">مايو</option><option value="5">يونيو</option>
                <option value="6">يوليو</option><option value="7">أغسطس</option><option value="8">سبتمبر</option>
                <option value="9">أكتوبر</option><option value="10">نوفمبر</option><option value="11">ديسمبر</option>
            </select>
            <select id="yearPicker" onchange="updateDateFromSelectors()"></select>
        </div>
        <input type="hidden" id="datePicker">
    </div>

    <div id="cardsList"></div>

    <div style="background: white; border-radius: 15px; padding: 15px; margin-top: 20px; border: 2px solid var(--teal); margin-bottom: 20px;">
        <h3 style="text-align:center; color: var(--dark-green); margin:0 0 10px 0;">📂 أرشيف رواتب العامل</h3>
        <select id="archiveSearch" oninput="buildArchiveHistory()" style="width:100%; padding:12px; border-radius:10px; font-weight:900; border:2px solid var(--teal);"></select>
        <div id="archiveContent" style="margin-top:15px;"></div>
    </div>
</div>

<script>
    const weekdays = ['السبت', 'الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس'];
    let masterWorkers = [];
    let currentWeekDates = [];
    let currentWeekID = "";

    function initSystem() {
        initDateSelectors();
        loadMasterWorkers();
    }

    function initDateSelectors() {
        const dSel = document.getElementById('dayPicker');
        const ySel = document.getElementById('yearPicker');
        const now = new Date();
        for(let i=1; i<=31; i++) dSel.add(new Option(i, i, i === now.getDate(), i === now.getDate()));
        for(let i = 2024; i <= 2030; i++) ySel.add(new Option(i, i, i === now.getFullYear(), i === now.getFullYear()));
        document.getElementById('monthPicker').value = now.getMonth();
        updateDateFromSelectors();
    }

    function updateDateFromSelectors() {
        const d = document.getElementById('dayPicker').value;
        const m = parseInt(document.getElementById('monthPicker').value) + 1;
        const y = document.getElementById('yearPicker').value;
        document.getElementById('datePicker').value = `${y}-${m.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
        handleDateChange();
    }

    function handleDateChange() {
        const pickedDate = new Date(document.getElementById('datePicker').value);
        let dayOfWeek = pickedDate.getDay();
        let diffToSaturday = (dayOfWeek === 6) ? 0 : (dayOfWeek + 1);
        let saturday = new Date(pickedDate);
        saturday.setDate(pickedDate.getDate() - diffToSaturday);
        currentWeekID = saturday.toISOString().split('T')[0];
        currentWeekDates = [];
        for(let i=0; i<6; i++) {
            let d = new Date(saturday); d.setDate(saturday.getDate() + i);
            currentWeekDates.push(d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear());
        }
        document.getElementById('weekRangeDisplay').innerText = `أسبوع السبت ${currentWeekDates[0]}`;
        loadWeekData();
    }

    async function loadMasterWorkers() {
        const snap = await window.get(window.ref(window.db, `backups/workers_master/${window.currentUid}`));
        masterWorkers = snap.exists() ? snap.val() : [];
        updateArchiveDropdown();
        loadWeekData();
    }

    function updateArchiveDropdown() {
        const dropdown = document.getElementById('archiveSearch');
        dropdown.innerHTML = '<option value="">-- اختر العامل --</option>' + masterWorkers.map(w => `<option value="${w.name}">${w.name}</option>`).join('');
    }

    async function loadWeekData() {
        if(!window.currentUid || masterWorkers.length === 0) return;
        const snap = await window.get(window.ref(window.db, `backups/workers_weeks/${window.currentUid}/${currentWeekID}`));
        const saved = snap.exists() ? snap.val() : {};
        
        const container = document.getElementById('cardsList');
        container.innerHTML = masterWorkers.map((worker, idx) => {
            let d = saved[idx] || {sal:'', loans:['','','','','',''], att:[1,1,1,1,1,1], note:''};
            return `
                <div class="worker-card" id="card-${idx}">
                    <div class="card-name">${worker.name}</div>
                    <input type="number" class="salary-input" value="${d.sal}" placeholder="الراتب" onchange="syncData(${idx}, 'sal', this.value)">
                    <div class="days-grid">
                        ${[0,1,2,3,4,5].map(di => `
                            <div class="day-row">
                                <div class="day-info"><span class="day-name">${weekdays[di]}</span></div>
                                <div class="att-btns">
                                    <button class="btn-tgl ${d.att[di]==1?'active':''}" data-v="1" onclick="toggleAtt(this,${idx},${di})">ح</button>
                                    <button class="btn-tgl ${d.att[di]==0.5?'active':''}" data-v="0.5" onclick="toggleAtt(this,${idx},${di})">½</button>
                                    <button class="btn-tgl ${d.att[di]==0?'active':''}" data-v="0" onclick="toggleAtt(this,${idx},${di})">غ</button>
                                </div>
                                <input type="number" class="loan-input" value="${d.loans[di]}" placeholder="0" onchange="syncArrayData(${idx}, 'loans', ${di}, this.value)">
                            </div>
                        `).join('')}
                    </div>
                    <textarea class="note-input" placeholder="ملاحظات..." onblur="syncData(${idx}, 'note', this.value)">${d.note || ''}</textarea>
                    <div class="card-footer">
                        <div class="footer-line"><span>سلف: <span class="sum-l">0</span></span> <span>الصافي: <span class="sum-n" style="color:var(--dark-green)">0</span></span></div>
                    </div>
                    <button class="btn-share" onclick="shareToWhatsApp(${idx})">واتساب 🟢</button>
                </div>`;
        }).join('');
        masterWorkers.forEach((_, i) => recalc(i));
    }

    function toggleAtt(btn, workerIdx, dayIdx) {
        Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const val = btn.dataset.v;
        syncArrayData(workerIdx, 'att', dayIdx, val);
        recalc(workerIdx);
    }

    // وظائف المزامنة اللحظية
    function syncData(workerIdx, field, value) {
        setSyncing(true);
        const path = `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${workerIdx}`;
        window.update(window.ref(window.db, path), { [field]: value, name: masterWorkers[workerIdx].name }).then(() => {
            setSyncing(false);
            recalc(workerIdx);
        });
    }

    function syncArrayData(workerIdx, arrayField, dayIdx, value) {
        setSyncing(true);
        const path = `backups/workers_weeks/${window.currentUid}/${currentWeekID}/${workerIdx}/${arrayField}`;
        window.update(window.ref(window.db, path), { [dayIdx]: value }).then(() => {
            setSyncing(false);
            recalc(workerIdx);
        });
    }

    function setSyncing(status) {
        const el = document.getElementById('syncStatus');
        el.innerText = status ? "⏳ جاري الحفظ..." : "✅ تم الحفظ سحابياً";
        el.style.background = status ? "var(--warning)" : "rgba(255,255,255,0.2)";
    }

    function recalc(idx) {
        const c = document.getElementById(`card-${idx}`); if(!c) return;
        let sal = parseFloat(c.querySelector('.salary-input').value) || 0;
        let lTotal = 0; c.querySelectorAll('.loan-input').forEach(i => lTotal += parseFloat(i.value) || 0);
        let aTotal = 0; c.querySelectorAll('.btn-tgl.active').forEach(b => aTotal += parseFloat(b.dataset.v));
        let net = Math.round(((sal / 6) * aTotal) - lTotal);
        c.querySelector('.sum-l').innerText = lTotal; 
        c.querySelector('.sum-n').innerText = net > 0 ? net : 0;
        refreshStats();
    }

    function refreshStats() {
        let gL = 0, gN = 0, gS = 0;
        document.querySelectorAll('.worker-card').forEach(c => {
            gL += parseFloat(c.querySelector('.sum-l').innerText) || 0;
            gN += parseFloat(c.querySelector('.sum-n').innerText) || 0; 
            gS += parseFloat(c.querySelector('.salary-input').value) || 0;
        });
        document.getElementById('stat-sal').innerText = gS; 
        document.getElementById('stat-loan').innerText = gL; 
        document.getElementById('stat-net').innerText = gN;
    }

    function shareToWhatsApp(idx) {
        const c = document.getElementById(`card-${idx}`);
        const name = masterWorkers[idx].name;
        const net = c.querySelector('.sum-n').innerText;
        const msg = `*كشف حساب عامل* 👷\n*الاسم:* ${name}\n*أسبوع:* ${currentWeekID}\n*الصافي المستحق:* ${net} ج.م\nتم التحديث عبر AZEMAA PRO`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
</body>
</html>
