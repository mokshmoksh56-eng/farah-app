<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa proo تقطيع - نسخة المحمول السحابية للبيع</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #7f8c8d; padding: 10px; margin: 0; font-size: 15px; }
        
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #7f8c8d;
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 17px; color: white; font-weight: bold;
        }

        .container { max-width: 1100px; margin: auto; background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        h1 { font-size: 24px; margin-top: 10px; text-align: center; color: #2c3e50; }
        
        #syncStatus { text-align: center; font-size: 12px; color: #27ae60; font-weight: bold; margin-bottom: 10px; height: 15px; }

        .sticky-panel { position: sticky; top: 0; background: #fff; padding: 12px; z-index: 1000; border-bottom: 4px solid #000; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-radius: 4px; }
        .setup-panel { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .input-group { display: flex; flex-direction: column; flex: 1; min-width: 100px; }
        .input-group label { font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-size: 15px; width: 100%; height: 42px; }
        
        .required-boards input { background-color: #f1c40f; font-weight: bold; color: #000; border: 2px solid #000; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 15px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; min-width: 550px; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background: #000; color: white; font-size: 14px; }
        td input { padding: 6px; height: 36px; font-size: 14px; }
        
        .btn-calc { background-color: #27ae60; color: white; width: 100%; padding: 14px; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-add { background-color: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; margin-top: 10px; font-size: 15px; width: 100%; font-weight: bold; }
        
        .action-buttons { display: flex; margin-top: 15px; gap: 10px; }
        .btn-print { background-color: #34495e; color: white; border: none; padding: 14px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-back-menu { background-color: #2f3640; color: white; border: none; padding: 14px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; text-decoration: none; text-align: center; width: 100%; display: block; }
        
        canvas { display: block; width: 100%; margin-top: 20px; border: 2px solid #000; background: #fff; }
        .results { text-align: center; margin-top: 15px; font-weight: bold; font-size: 18px; color: #000; background: #f9f9f9; padding: 10px; border-radius: 4px; }

        /* أزرار الحفظ والأرشيف */
        .archive-controls { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .input-project-name { flex: 2; min-width: 200px; padding: 10px; border: 2px solid #2980b9; border-radius: 4px; font-size: 15px; font-weight: bold; text-align: right; }
        .btn-save-archive { flex: 1; min-width: 120px; background-color: #2980b9; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-open-archive { flex: 1; min-width: 120px; background-color: #8e44ad; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* نافذة الأرشيف المنبثقة */
        #archiveModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100000; justify-content: center; align-items: center; }
        .archive-content { background: #fff; width: 95%; max-width: 600px; padding: 20px; border-radius: 8px; max-height: 80vh; overflow-y: auto; direction: rtl; }
        .archive-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .archive-header h2 { margin: 0; color: #2c3e50; font-size: 20px; }
        .close-modal { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #searchArchive { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 4px; margin-bottom: 15px; font-size: 15px; }
        .archive-item { background: #f8f9fa; border: 1px solid #ddd; padding: 12px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .archive-item-info { flex: 1; min-width: 150px; }
        .archive-item-info strong { color: #2980b9; display: block; font-size: 16px; margin-bottom: 4px; }
        .archive-item-info span { color: #7f8c8d; font-size: 13px; }
        .archive-item-actions { display: flex; gap: 5px; }
        .archive-item-actions button { padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
        .btn-load { background: #27ae60; }
        .btn-delete { background: #e74c3c; }

        @media (max-width: 600px) {
            body { padding: 5px; }
            .container { padding: 10px; }
            h1 { font-size: 20px; }
            .setup-panel { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .action-buttons { flex-direction: column; }
            .sticky-panel { position: relative; }
            .archive-item { flex-direction: column; align-items: flex-start; }
            .archive-item-actions { width: 100%; justify-content: space-between; }
            .archive-item-actions button { flex: 1; }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, set, get, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.currentUid = null;
        window.fbDB = db;
        window.fbRef = ref;
        window.fbSet = set;
        window.fbGet = get;
        window.fbPush = push;
        window.fbRemove = remove;
        window.fbOnValue = onValue;
        window.currentProjectId = null;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUid = user.uid;
                document.getElementById('auth-loader').style.display = 'none';
                window.loadData();
            } else {
                document.getElementById('auth-loader').innerText = "⚠️ حظر أمني: يرجى تسجيل الدخول من اللوحة الرئيسية أولاً!";
            }
        });
    </script>
</head>
<body>

<div id="auth-loader">⏳ جاري تحميل ومزامنة أبعاد الألواح ومخطط التتقطيع...</div>

<div class="container">
    <h1>azemaa proo تقطيع</h1>
    <div id="syncStatus">جاري الاتصال بالسحابة...</div>
    
    <div class="sticky-panel">
        <div class="setup-panel">
            <div class="input-group"><label>نوع اللوح</label>
                <select id="boardType" onchange="updateBoardDimensions()">
                    <option value="wood">خشب (244 × 122)</option>
                    <option value="fiber">فيبر (280 × 130)</option>
                </select></div>
            <div class="input-group"><label>طول اللوح</label><input type="number" id="boardL" value="244" oninput="saveData()"></div>
            <div class="input-group"><label>عرض اللوح</label><input type="number" id="boardW" value="122" oninput="saveData()"></div>
            <div class="input-group"><label>حز المنشار</label><input type="number" id="kerf" value="0.3" step="0.1" oninput="saveData()"></div>
            <div class="input-group required-boards"><label>الألواح المطلوبة</label><input type="text" id="totalBoardsNeeded" readonly value="0"></div>
        </div>
        <button class="btn-calc" onclick="calculateAndDraw()">بدء التقطيع وتوفير الهالك</button>
    </div>

    <div class="table-responsive">
        <table id="piecesTable">
            <thead>
                <tr>
                    <th style="width: 40px;">م</th>
                    <th>اسم القطعة</th>
                    <th>الطول (سم)</th>
                    <th>العرض (سم)</th>
                    <th style="width: 70px;">العدد</th>
                    <th style="width: 50px;">حذف</th>
                </tr>
            </thead>
            <tbody id="piecesBody"></tbody>
        </table>
    </div>
    <button class="btn-add" onclick="addRow()">+ إضافة مقاس جديد</button>

    <div class="archive-controls">
        <input type="text" id="projectName" class="input-project-name" placeholder="اسم المشروع (مثال: مطبخ أ/ أحمد)">
        <button class="btn-save-archive" onclick="saveToArchive()">💾 حفظ المشروع</button>
        <button class="btn-open-archive" onclick="openArchive()">📂 الأرشيف</button>
    </div>

    <div class="action-buttons">
        <button class="btn-print" onclick="window.print()">🖨️ طباعة المخطط</button>
        <a href="kmatkitchen.html" class="btn-back-menu">⬅️ قائمة الخامات الرئيسية</a>
    </div>

    <div id="resultStats" class="results">المخطط يظهر هنا بعد الحساب</div>
    <canvas id="boardCanvas"></canvas>
</div>

<div id="archiveModal">
    <div class="archive-content">
        <div class="archive-header">
            <h2>📂 أرشيف التقطيع</h2>
            <button class="close-modal" onclick="closeArchive()">إغلاق ❌</button>
        </div>
        <input type="text" id="searchArchive" placeholder="🔍 ابحث عن اسم المشروع..." onkeyup="filterArchive()">
        <div id="archiveList">
            </div>
    </div>
</div>

<script>
    let saveTimeout;
    const syncStatus = document.getElementById('syncStatus');
    
    // الحفظ التلقائي للمسودة (طوارئ)
    window.saveData = function() {
        if(!window.currentUid) return;
        syncStatus.innerText = "جاري حفظ المسودة...";
        syncStatus.style.color = "#f39c12";

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            const data = {
                projectName: document.getElementById('projectName').value,
                boardType: document.getElementById('boardType').value, boardL: document.getElementById('boardL').value, boardW: document.getElementById('boardW').value, kerf: document.getElementById('kerf').value, pieces: []
            };
            document.querySelectorAll('#piecesBody tr').forEach(row => {
                data.pieces.push({
                    name: row.querySelector('.p-name').value, len: row.querySelector('.p-len').value, wid: row.querySelector('.p-wid').value, qty: row.querySelector('.p-qty').value
                });
            });

            const dbRefStr = `backups/cut_projects/${window.currentUid}`;
            window.fbSet(window.fbRef(window.fbDB, dbRefStr), data)
                .then(() => { syncStatus.innerText = "✔️ تم حفظ المسودة تلقائياً"; syncStatus.style.color = "#27ae60"; })
                .catch((err) => { 
                    syncStatus.innerText = "❌ خطأ في الاتصال بالخادم"; syncStatus.style.color = "#e74c3c"; 
                    console.error("Draft Save Error:", err);
                });
        }, 1000);
    };

    // تحميل المسودة التلقائية عند فتح الصفحة
    window.loadData = function() {
        if(!window.currentUid) return;
        const dbRefStr = `backups/cut_projects/${window.currentUid}`;
        window.fbGet(window.fbRef(window.fbDB, dbRefStr)).then((snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.val();
                document.getElementById('projectName').value = data.projectName || '';
                document.getElementById('boardType').value = data.boardType || 'wood';
                document.getElementById('boardL').value = data.boardL || 244;
                document.getElementById('boardW').value = data.boardW || 122;
                if(data.kerf) document.getElementById('kerf').value = data.kerf;

                const tbody = document.getElementById('piecesBody'); tbody.innerHTML = '';
                if(data.pieces && data.pieces.length > 0) {
                    data.pieces.forEach((p, i) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td class="row-num">${i+1}</td>
                        <td><input type="text" class="p-name" value="${p.name}" oninput="saveData()"></td>
                        <td><input type="number" class="p-len" value="${p.len}" oninput="saveData()"></td>
                        <td><input type="number" class="p-wid" value="${p.wid}" oninput="saveData()"></td>
                        <td><input type="number" class="p-qty" value="${p.qty}" oninput="saveData()"></td>
                        <td><button onclick="deleteRow(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button></td>`;
                        tbody.appendChild(tr);
                    });
                } else { window.addRow(); }
                syncStatus.innerText = "✔️ تم استرجاع مسودة العمل"; syncStatus.style.color = "#27ae60";
            } else { syncStatus.innerText = "مشروع جديد."; window.addRow(); }
        }).catch((err) => { 
            syncStatus.innerText = "❌ فشل التحميل"; syncStatus.style.color = "#e74c3c"; window.addRow(); 
            console.error("Draft Load Error:", err);
        });
    };

    // ================= دوال الأرشيف =================
    window.saveToArchive = function() {
        if(!window.currentUid) return;
        const projectName = document.getElementById('projectName').value.trim();
        if(!projectName) {
            alert("⚠️ يرجى كتابة اسم المشروع أولاً في المربع المخصص للحفظ في الأرشيف.");
            return;
        }

        syncStatus.innerText = "جاري الحفظ في الأرشيف...";
        syncStatus.style.color = "#f39c12";

        const data = {
            projectName: projectName,
            date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
            boardType: document.getElementById('boardType').value,
            boardL: document.getElementById('boardL').value,
            boardW: document.getElementById('boardW').value,
            kerf: document.getElementById('kerf').value,
            pieces: []
        };

        document.querySelectorAll('#piecesBody tr').forEach(row => {
            data.pieces.push({
                name: row.querySelector('.p-name').value,
                len: row.querySelector('.p-len').value,
                wid: row.querySelector('.p-wid').value,
                qty: row.querySelector('.p-qty').value
            });
        });

        // إنشاء أو تحديث مرجع الأرشيف
        const targetPath = window.currentProjectId 
            ? `backups/cut_archive/${window.currentUid}/${window.currentProjectId}` 
            : null;
            
        const targetRef = targetPath 
            ? window.fbRef(window.fbDB, targetPath) 
            : window.fbPush(window.fbRef(window.fbDB, `backups/cut_archive/${window.currentUid}`));

        window.fbSet(targetRef, data).then(() => {
            window.currentProjectId = targetRef.key;
            syncStatus.innerText = "✔️ تم حفظ المشروع في الأرشيف بنجاح";
            syncStatus.style.color = "#27ae60";
            alert("✅ تم حفظ مشروع (" + projectName + ") في الأرشيف بنجاح!");
        }).catch((err) => {
            syncStatus.innerText = "❌ خطأ في الحفظ (راجع قواعد أمان فايربيس)";
            syncStatus.style.color = "#e74c3c";
            console.error("Archive Save Error:", err);
            alert("❌ لم يتم الحفظ. يرجى التأكد من أن قواعد Firebase Realtime Database تسمح بالكتابة (Rules).");
        });
    };

    window.openArchive = function() {
        document.getElementById('archiveModal').style.display = 'flex';
        const archiveList = document.getElementById('archiveList');
        archiveList.innerHTML = "<p style='text-align:center;'>⏳ جاري تحميل الأرشيف...</p>";

        const archiveRef = window.fbRef(window.fbDB, `backups/cut_archive/${window.currentUid}`);
        window.fbOnValue(archiveRef, (snapshot) => {
            archiveList.innerHTML = "";
            if (snapshot.exists()) {
                const projects = snapshot.val();
                window.allArchiveProjects = projects; 
                renderArchive(projects);
            } else {
                archiveList.innerHTML = "<p style='text-align:center; color:#e74c3c;'>لا توجد مشاريع محفوظة حالياً في الأرشيف.</p>";
                window.allArchiveProjects = {};
            }
        }, { onlyOnce: true });
    };

    window.closeArchive = function() { document.getElementById('archiveModal').style.display = 'none'; };

    window.renderArchive = function(projectsMap) {
        const archiveList = document.getElementById('archiveList');
        archiveList.innerHTML = "";
        const sortedProjects = Object.keys(projectsMap).map(key => ({ id: key, ...projectsMap[key] })).reverse();

        sortedProjects.forEach(proj => {
            const div = document.createElement('div');
            div.className = 'archive-item';
            div.innerHTML = `
                <div class="archive-item-info">
                    <strong>${proj.projectName || 'مشروع بدون اسم'}</strong>
                    <span>📅 ${proj.date || '-'} | 📐 عدد القطع: ${proj.pieces ? proj.pieces.length : 0}</span>
                </div>
                <div class="archive-item-actions">
                    <button class="btn-load" onclick="loadArchivedProject('${proj.id}')">⬇️ استدعاء</button>
                    <button class="btn-delete" onclick="deleteArchivedProject('${proj.id}')">🗑️ حذف</button>
                </div>
            `;
            archiveList.appendChild(div);
        });
    };

    window.filterArchive = function() {
        const searchTerm = document.getElementById('searchArchive').value.toLowerCase();
        if (!window.allArchiveProjects) return;
        const filtered = {};
        for (const key in window.allArchiveProjects) {
            const proj = window.allArchiveProjects[key];
            if ((proj.projectName || "").toLowerCase().includes(searchTerm)) {
                filtered[key] = proj;
            }
        }
        renderArchive(filtered);
    };

    window.loadArchivedProject = function(id) {
        const proj = window.allArchiveProjects[id];
        if (!proj) return;

        window.currentProjectId = id;
        document.getElementById('projectName').value = proj.projectName || "";
        document.getElementById('boardType').value = proj.boardType || 'wood';
        document.getElementById('boardL').value = proj.boardL || 244;
        document.getElementById('boardW').value = proj.boardW || 122;
        if(proj.kerf) document.getElementById('kerf').value = proj.kerf;

        const tbody = document.getElementById('piecesBody');
        tbody.innerHTML = '';
        if(proj.pieces && proj.pieces.length > 0) {
            proj.pieces.forEach((p, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="row-num">${i+1}</td>
                <td><input type="text" class="p-name" value="${p.name}" oninput="saveData()"></td>
                <td><input type="number" class="p-len" value="${p.len}" oninput="saveData()"></td>
                <td><input type="number" class="p-wid" value="${p.wid}" oninput="saveData()"></td>
                <td><input type="number" class="p-qty" value="${p.qty}" oninput="saveData()"></td>
                <td><button onclick="deleteRow(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button></td>`;
                tbody.appendChild(tr);
            });
        } else { window.addRow(); }
        
        closeArchive();
        window.saveData(); // تحديث المسودة بالبيانات المستدعاة
        syncStatus.innerText = "✔️ تم استدعاء المشروع بنجاح";
        syncStatus.style.color = "#27ae60";
    };

    window.deleteArchivedProject = function(id) {
        if(confirm("هل أنت متأكد من حذف هذا المشروع نهائياً من الأرشيف؟")) {
            const targetPath = `backups/cut_archive/${window.currentUid}/${id}`;
            window.fbRemove(window.fbRef(window.fbDB, targetPath)).then(() => {
                openArchive(); 
                if (window.currentProjectId === id) {
                    window.currentProjectId = null;
                    document.getElementById('projectName').value = "";
                    window.saveData();
                }
            });
        }
    };

    // ===============================================

    window.updateBoardDimensions = function() {
        const type = document.getElementById('boardType').value;
        if (type === 'fiber') { document.getElementById('boardL').value = 280; document.getElementById('boardW').value = 130; }
        else { document.getElementById('boardL').value = 244; document.getElementById('boardW').value = 122; }
        window.saveData();
    };

    window.addRow = function() {
        const tbody = document.getElementById('piecesBody'); const count = tbody.children.length + 1; const tr = document.createElement('tr');
        tr.innerHTML = `<td class="row-num">${count}</td>
        <td><input type="text" class="p-name" value="قطعة ${count}" oninput="saveData()"></td>
        <td><input type="number" class="p-len" oninput="saveData()"></td>
        <td><input type="number" class="p-wid" oninput="saveData()"></td>
        <td><input type="number" class="p-qty" oninput="saveData()"></td>
        <td><button onclick="deleteRow(this)" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">X</button></td>`;
        tbody.appendChild(tr); window.updateRowNumbers(); window.saveData();
    };

    window.deleteRow = function(btn) { btn.closest('tr').remove(); window.updateRowNumbers(); window.saveData(); };
    window.updateRowNumbers = function() { document.querySelectorAll('.row-num').forEach((td, i) => td.innerText = i + 1); };

    class MaxRectsPacker {
        constructor(width, height, kerf) { this.width = width; this.height = height; this.kerf = kerf; this.usedRects = []; this.freeRects = [{ x: 0, y: 0, w: width, h: height }]; }
        insert(w, h, name) { let bestRect = this.findBestRect(w, h); if (!bestRect) return null; bestRect.name = name; this.splitFreeRects(bestRect); this.cleanFreeRects(); this.usedRects.push(bestRect); return bestRect; }
        findBestRect(w, h) { let bestRect = null; let minShortSideFit = Infinity; const orientations = [{w: w, h: h}, {w: h, h: w}]; for (let orbit of orientations) { for (let free of this.freeRects) { if (free.w >= orbit.w && free.h >= orbit.h) { let shortSideFit = Math.min(free.w - orbit.w, free.h - orbit.h); if (shortSideFit < minShortSideFit) { bestRect = { x: free.x, y: free.y, w: orbit.w, h: orbit.h }; minShortSideFit = shortSideFit; } } } } return bestRect; }
        splitFreeRects(used) { let n = this.freeRects.length; let k = this.kerf; for (let i = 0; i < n; i++) { if (this.intersect(this.freeRects[i], used)) { let f = this.freeRects.splice(i, 1)[0]; if (used.x > f.x) this.freeRects.push({x: f.x, y: f.y, w: used.x - f.x - k, h: f.h}); if (used.x + used.w < f.x + f.w) this.freeRects.push({x: used.x + used.w + k, y: f.y, w: f.x + f.w - (used.x + used.w) - k, h: f.h}); if (used.y > f.y) this.freeRects.push({x: f.x, y: f.y, w: f.w, h: used.y - f.y - k}); if (used.y + used.h < f.y + f.h) this.freeRects.push({x: f.x, y: used.y + used.h + k, w: f.w, h: f.y + f.h - (used.y + used.h) - k}); i--; n--; } } }
        intersect(a, b) { return !(b.x >= a.x + a.w || b.x + b.w <= a.x || b.y >= a.y + a.h || b.y + b.h <= a.y); }
        cleanFreeRects() { for (let i = 0; i < this.freeRects.length; i++) { for (let j = i + 1; j < this.freeRects.length; j++) { if (this.isContained(this.freeRects[i], this.freeRects[j])) { this.freeRects.splice(i, 1); i--; break; } if (this.isContained(this.freeRects[j], this.freeRects[i])) { this.freeRects.splice(j, 1); j--; } } } this.freeRects = this.freeRects.filter(r => r.w > 0.1 && r.h > 0.1); }
        isContained(a, b) { return a.x >= b.x && a.y >= b.y && a.x + a.w <= b.x + b.w && a.y + a.h <= b.y + b.h; }
    }

    window.calculateAndDraw = function() {
        const bL = parseFloat(document.getElementById('boardL').value); const bW = parseFloat(document.getElementById('boardW').value); const kerf = parseFloat(document.getElementById('kerf').value); let blocks = [];
        document.querySelectorAll('#piecesBody tr').forEach((row) => {
            let name = row.querySelector('.p-name').value; let l = parseFloat(row.querySelector('.p-len').value); let w = parseFloat(row.querySelector('.p-wid').value); let q = parseInt(row.querySelector('.p-qty').value);
            if (l > 0 && w > 0 && q > 0) { for(let i=0; i<q; i++) blocks.push({name: name, w: Math.max(l,w), h: Math.min(l,w)}); }
        });
        if(blocks.length === 0) { alert("الرجاء إدخال أبعاد القطع أولاً"); return; }
        blocks.sort((a, b) => (b.w * b.h) - (a.w * a.h)); let boards = []; let remaining = [...blocks];
        while (remaining.length > 0) {
            let packer = new MaxRectsPacker(bL, bW, kerf); let anyPlaced = false;
            for (let i = 0; i < remaining.length; i++) { let fit = packer.insert(remaining[i].w, remaining[i].h, remaining[i].name); if (fit) { anyPlaced = true; remaining.splice(i, 1); i--; } }
            if (!anyPlaced) { alert("تنبيه: القطعة '" + remaining[0].name + "' أكبر من مقاس اللوح!"); break; }
            boards.push(packer);
        }
        document.getElementById('totalBoardsNeeded').value = boards.length;
        document.getElementById('resultStats').innerText = "عدد الألواح المطلوبة: " + boards.length;
        draw(bL, bW, boards);
    };

    function draw(boardW, boardH, boards) {
        const canvas = document.getElementById('boardCanvas'); const ctx = canvas.getContext('2d'); const padding = 80; canvas.width = 1100; const scale = (canvas.width - padding * 2) / boardW; const drawH = boardH * scale; canvas.height = (drawH + padding * 2) * boards.length; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        boards.forEach((packer, bIdx) => {
            let offset = bIdx * (drawH + padding * 2); ctx.fillStyle = "#f5f5f5"; ctx.fillRect(padding, offset + padding, boardW * scale, drawH); ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeRect(padding, offset + padding, boardW * scale, drawH);
            ctx.fillStyle = "#000"; ctx.font = "bold 24px Arial"; ctx.textAlign = "center"; ctx.fillText(boardW + " سم", padding + (boardW * scale) / 2, offset + padding / 2);
            ctx.save(); ctx.translate(padding/2, offset + padding + drawH/2); ctx.rotate(-Math.PI/2); ctx.fillText(boardH + " سم", 0, 0); ctx.restore();
            packer.usedRects.forEach(r => {
                const rx = padding + r.x * scale; const ry = offset + padding + r.y * scale; const rw = r.w * scale; const rh = r.h * scale; ctx.fillStyle = "#f1c40f"; ctx.fillRect(rx, ry, rw, rh); ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.strokeRect(rx, ry, rw, rh);
                if (rw > 55 && rh > 55) { ctx.fillStyle = "#000"; ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.fillText(r.name, rx + rw / 2, ry + rh / 2 - 12); ctx.font = "bold 20px Arial"; ctx.fillText(r.w + " سم", rx + rw / 2, ry + rh - 10); ctx.save(); ctx.translate(rx + 25, ry + rh / 2 + 15); ctx.rotate(-Math.PI / 2); ctx.fillText(r.h + " سم", 0, 0); ctx.restore(); } 
                else { ctx.fillStyle = "#000"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText(r.name, rx + rw / 2, ry + rh / 2 + 5); }
            });
            ctx.fillStyle = "#000"; ctx.font = "bold 26px Arial"; ctx.textAlign = "right"; ctx.fillText("اللوح رقم " + (bIdx + 1), padding + (boardW * scale), offset + padding - 20);
        });
    }
</script>
