<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقرير المالي الموحد | AZEMAA PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --success: #059669; --danger: #dc2626; --accent: #2563eb; --bg: #f1f5f9; --warning: #fbbf24; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .header { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 25px; }
        .annual-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; background: white; border-radius: 20px; text-align: center; margin-bottom: 25px; border-top: 6px solid var(--warning); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .ann-box span { display: block; font-size: 0.9rem; color: #64748b; font-weight: 700; }
        .ann-box strong { font-size: 1.3rem; display: block; margin-top: 5px; }
        .control-panel { background: white; padding: 20px; border-radius: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; margin-bottom: 30px; }
        select, button { padding: 10px 15px; border-radius: 10px; border: 2px solid #e2e8f0; font-family: 'Cairo'; font-weight: 700; outline: none; }
        .refresh-btn { background: var(--accent); color: white; border: none; cursor: pointer; transition: 0.3s; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: right; padding: 12px; background: #f8fafc; color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-weight: 800; }
        .profit { color: var(--success); } .loss { color: var(--danger); }
        .total-row { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="header">
    <h1>📊 التقرير المالي الموحد</h1>
    <p>الربط المباشر مع اليومية، العمال، والزبائن</p>
</div>

<div class="annual-summary">
    <div class="ann-box"><span>إجمالي الداخل (+)</span><strong class="profit" id="ann-in">0</strong></div>
    <div class="ann-box"><span>إجمالي الخارج (-)</span><strong class="loss" id="ann-out">0</strong></div>
    <div class="ann-box"><span>رواتب العمال</span><strong class="loss" id="ann-workers">0</strong></div>
    <div class="ann-box" style="background: #f0f9ff;"><span>الصافي النهائي</span><strong id="ann-net">0</strong></div>
</div>

<div class="control-panel">
    <select id="yearSelect" onchange="updateAll()"></select>
    <select id="monthSelect" onchange="updateAll()"></select>
    <button onclick="updateAll()" class="refresh-btn">🔄 تحديث الأرقام</button>
</div>

<div class="stats-grid">
    <div class="card"><h3>📈 ملخص الشهر</h3><table id="month-table"></table></div>
    <div class="card" style="border-top-color: var(--success);"><h3>👷 تفاصيل الرواتب</h3><table id="worker-table"></table></div>
</div>

<script>
    function setup() {
        const yrSel = document.getElementById('yearSelect');
        const monSel = document.getElementById('monthSelect');
        const now = new Date();
        for(let y = 2024; y <= 2030; y++) yrSel.add(new Option(`سنة ${y}`, y));
        yrSel.value = now.getFullYear();
        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        months.forEach((m, i) => monSel.add(new Option(m, i)));
        monSel.value = now.getMonth();
        updateAll();
    }

    function updateAll() {
        const yr = document.getElementById('yearSelect').value;
        const mon = parseInt(document.getElementById('monthSelect').value);
        let stats = { in: 0, out: 0, workers: 0 };

        // 1. الربط مع "يومية الورشة" (ملف yom.html)
        const workshopData = JSON.parse(localStorage.getItem('workshop_data')) || [];
        workshopData.forEach(item => {
            const d = new Date(item.date);
            if(d.getFullYear() == yr && d.getMonth() == mon) {
                stats.in += (parseFloat(item.inVal) || 0);
                stats.out += (parseFloat(item.outVal) || 0);
            }
        });

        // 2. الربط مع "منظومة الزبائن" (ملف zbon.html)
        for(let i=0; i<localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('azemaa_pro_v5_')) {
                const client = JSON.parse(localStorage.getItem(key));
                if(client.pays) {
                    client.pays.forEach(p => {
                        const pd = new Date(p.dt);
                        if(pd.getFullYear() == yr && pd.getMonth() == mon) {
                            stats.in += (parseFloat(p.vl) || 0);
                        }
                    });
                }
            }
        }

        // 3. الربط مع "نظام العمال" (ملف gyab.html)
        Object.keys(localStorage).forEach(key => {
            if(key.startsWith('f_data_v2026_simple_')) {
                const datePart = key.replace('f_data_v2026_simple_', '');
                const d = new Date(datePart);
                if(d.getFullYear() == yr && d.getMonth() == mon) {
                    const weekData = JSON.parse(localStorage.getItem(key));
                    weekData.forEach(w => {
                        let totalAtt = w.att.reduce((a, b) => (parseFloat(a)||0) + (parseFloat(b)||0), 0);
                        let totalLoans = w.loans.reduce((a, b) => (parseFloat(a)||0) + (parseFloat(b)||0), 0);
                        let netPay = ((parseFloat(w.sal)/6) * totalAtt) - totalLoans;
                        stats.workers += (netPay > 0 ? netPay : 0);
                    });
                }
            }
        });

        // تحديث الواجهة
        document.getElementById('ann-in').innerText = stats.in.toLocaleString();
        document.getElementById('ann-out').innerText = stats.out.toLocaleString();
        document.getElementById('ann-workers').innerText = Math.round(stats.workers).toLocaleString();
        const net = stats.in - stats.out - stats.workers;
        const netEl = document.getElementById('ann-net');
        netEl.innerText = Math.round(net).toLocaleString() + " ج.م";
        netEl.style.color = net >= 0 ? "var(--success)" : "var(--danger)";

        document.getElementById('month-table').innerHTML = `
            <tr><th>إجمالي المقبوضات</th><td class="profit">${stats.in.toLocaleString()}</td></tr>
            <tr><th>إجمالي المصروفات</th><td class="loss">${stats.out.toLocaleString()}</td></tr>
            <tr class="total-row"><th>الصافي التشغيلي</th><td>${(stats.in - stats.out).toLocaleString()}</td></tr>
        `;
        document.getElementById('worker-table').innerHTML = `
            <tr><th>رواتب مدفوعة</th><td class="loss">${Math.round(stats.workers).toLocaleString()}</td></tr>
            <tr class="total-row"><th>صافي الربح</th><td>${Math.round(net).toLocaleString()} ج.م</td></tr>
        `;
    }
    window.onload = setup;
</script>
</body>
</html>
