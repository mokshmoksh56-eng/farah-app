<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف تقارير Azemaa Pro | 50 عام</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008080;
            --bg-color: #004d4d;
            --card-bg: rgba(255, 255, 255, 0.1);
            --accent: #a2f9c1;
            --danger: #ff7675;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: white; padding: 15px; margin: 0; }
        
        .archive-header { 
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--primary);
        }

        select { 
            padding: 8px 15px; border-radius: 10px; border: 2px solid var(--accent); 
            background: var(--bg-color); color: white; font-weight: 900; font-family: 'Cairo'; outline: none;
        }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { 
            background: var(--card-bg); padding: 15px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .full-width { grid-column: span 2; background: linear-gradient(135deg, #008080, #005f5f); }
        .card h3 { margin: 0; font-size: 0.8rem; color: var(--accent); opacity: 0.9; }
        .card .value { margin: 8px 0 0; font-size: 1.3rem; font-weight: 900; }
        
        .section-title { 
            grid-column: span 2; font-size: 1rem; margin: 15px 0 5px; color: #fff; 
            border-right: 4px solid var(--accent); padding-right: 10px;
        }

        .summary-box {
            grid-column: span 2; background: #fff; color: #004d4d; 
            padding: 15px; border-radius: 15px; text-align: center; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="archive-header">
        <h2 style="margin:0; font-size: 1rem;">🗄️ أرشيف (50 سنة)</h2>
        <select id="yearFilter" onchange="renderReports()"></select>
    </div>

    <div class="grid" id="reportGrid"></div>

    <script>
        // توليد السنوات تلقائياً لـ 50 سنة
        function setupYears() {
            const select = document.getElementById('yearFilter');
            const currentYear = new Date().getFullYear();
            for (let i = 2024; i <= 2074; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.innerHTML = "سنة " + i;
                if (i === currentYear) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function renderReports() {
            const selectedYear = document.getElementById('yearFilter').value;
            const grid = document.getElementById('reportGrid');
            
            // 1. حسابات الزبائن (zbon.html)
            let zTotalAgreed = 0, zTotalPaid = 0;
            for (let i = 1; i <= 100; i++) {
                const data = JSON.parse(localStorage.getItem(`azemaa_pro_v1_${i}`));
                if (data) {
                    let hasYearData = false;
                    if (data.pays) {
                        data.pays.forEach(p => {
                            if (p.dt && p.dt.startsWith(selectedYear)) {
                                zTotalPaid += parseFloat(p.vl) || 0;
                                hasYearData = true;
                            }
                        });
                    }
                    if (hasYearData) zTotalAgreed += parseFloat(data.t) || 0;
                }
            }

            // 2. حسابات اليومية (yom.html)
            let yTotalIn = 0, yTotalOut = 0;
            const yData = JSON.parse(localStorage.getItem('workshop_2026_v2')) || [];
            yData.forEach(item => {
                if (item.date && item.date.startsWith(selectedYear)) {
                    yTotalIn += parseFloat(item.inVal) || 0;
                    yTotalOut += parseFloat(item.outVal) || 0;
                }
            });

            // 3. حسابات العمال (gyab.html)
            let gTotalLoans = 0, gTotalNet = 0;
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith(`f_v5_${selectedYear}`)) {
                    const weekData = JSON.parse(localStorage.getItem(key)) || [];
                    weekData.forEach(w => {
                        if (w.loans) w.loans.forEach(l => gTotalLoans += parseFloat(l) || 0);
                        let sal = parseFloat(w.sal) || 0, att = 0;
                        if(w.att) w.att.forEach(a => att += parseFloat(a));
                        let lSum = 0; if(w.loans) w.loans.forEach(l => lSum += parseFloat(l) || 0);
                        let net = Math.round(((sal / 6) * att) - lSum);
                        if(net > 0) gTotalNet += net;
                    });
                }
            });

            grid.innerHTML = `
                <div class="section-title">💼 تعاملات الزبائن لعام ${selectedYear}</div>
                <div class="card full-width"><h3>إجمالي اتفاقات السنة</h3><div class="value">${zTotalAgreed.toLocaleString()} ج.م</div></div>
                <div class="card"><h3>المحصل فعلياً</h3><div class="value" style="color:var(--accent)">${zTotalPaid.toLocaleString()}</div></div>
                <div class="card"><h3>ديون معلقة</h3><div class="value" style="color:var(--danger)">${(zTotalAgreed - zTotalPaid).toLocaleString()}</div></div>

                <div class="section-title">💸 ميزانية الورشة</div>
                <div class="card"><h3>مصاريف خامات</h3><div class="value">${yTotalOut.toLocaleString()}</div></div>
                <div class="card"><h3>صافي الربح</h3><div class="value" style="color:var(--accent)">${(yTotalIn - yTotalOut).toLocaleString()}</div></div>

                <div class="section-title">👷 أجور العمال</div>
                <div class="card"><h3>إجمالي السلف</h3><div class="value">${gTotalLoans.toLocaleString()}</div></div>
                <div class="card"><h3>الرواتب المدفوعة</h3><div class="value" style="color:#ffda79">${gTotalNet.toLocaleString()}</div></div>

                <div class="summary-box">
                    <h3 style="margin:0; font-size:0.9rem;">💰 ملخص السنة المالي</h3>
                    <div style="font-size:1.5rem; font-weight:900;">${(yTotalIn - yTotalOut - gTotalNet).toLocaleString()} ج.م</div>
                </div>
            `;
        }

        window.onload = function() {
            setupYears();
            renderReports();
        };
    </script>
</body>
</html>
