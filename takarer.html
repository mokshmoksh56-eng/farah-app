<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO | التقارير الموحدة</title>
    <style>
        :root { --primary: #0f172a; --success: #059669; --danger: #dc2626; --accent: #2563eb; --bg: #f1f5f9; }
        * { box-sizing: border-box; font-weight: 900 !important; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--primary); }
        header { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-box { background: white; padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-bottom: 4px solid #eee; }
        .stat-box span { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; }
        .stat-box strong { font-size: 18px; }
        .filter-area { background: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; display: flex; gap: 10px; }
        select { flex: 1; padding: 12px; border-radius: 10px; border: 2px solid #e2e8f0; font-size: 14px; background: #fff; }
        .report-card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .report-card h2 { font-size: 16px; margin-top: 0; border-right: 4px solid var(--accent); padding-right: 10px; margin-bottom: 15px; }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <p>جاري سحب البيانات من السحابة...</p>
</div>

<header>
    <h1 style="margin:0; font-size: 20px;">التقرير المالي الموحد</h1>
    <div style="font-size: 11px; opacity: 0.8; margin-top: 5px;">نظام Azemaa Pro 2026 الحسي</div>
</header>

<div class="filter-area">
    <select id="yearSelect"></select>
    <select id="monthSelect">
        <option value="all">كل الشهور</option>
        <option value="0">يناير</option><option value="1">فبراير</option><option value="2">مارس</option>
        <option value="3">أبريل</option><option value="4">مايو</option><option value="5">يونيو</option>
        <option value="6">يوليو</option><option value="7">أغسطس</option><option value="8">سبتمبر</option>
        <option value="9">أكتوبر</option><option value="10">نوفمبر</option><option value="11">ديسمبر</option>
    </select>
</div>

<div class="summary-grid">
    <div class="stat-box" style="border-color: var(--success);">
        <span>إجمالي القبض (+)</span>
        <strong id="total-in" style="color: var(--success);">0</strong>
    </div>
    <div class="stat-box" style="border-color: var(--danger);">
        <span>إجمالي الصرف (-)</span>
        <strong id="total-out" style="color: var(--danger);">0</strong>
    </div>
    <div class="stat-box" style="border-color: var(--accent); grid-column: span 2;">
        <span>صافي الربح النهائي</span>
        <strong id="total-net">0</strong>
    </div>
</div>

<div class="report-card">
    <h2>📊 تحليل الفترة</h2>
    <div class="data-row"><span>دخل الزبائن</span><strong id="m-cust" style="color: var(--success);">0</strong></div>
    <div class="data-row"><span>وارد الخزينة</span><strong id="m-yom-in" style="color: var(--success);">0</strong></div>
    <div class="data-row"><span>مصروفات الخزينة</span><strong id="m-yom-out" style="color: var(--danger);">0</strong></div>
    <div class="data-row"><span>رواتب العمال</span><strong id="m-workers" style="color: var(--danger);">0</strong></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFlHpOc1M", 
        authDomain: "farah-kitchen.firebaseapp.com", 
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com", 
        projectId: "farah-kitchen", 
        appId: "1:702572851072:web:320a92c9430abba6b71b65" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let dbRaw = { customers: {}, yomya: {}, gyab: {} };

    // تهيئة السنوات
    const yrSel = document.getElementById('yearSelect');
    const curYear = new Date().getFullYear();
    for(let y=2024; y<=2030; y++) {
        yrSel.add(new Option("سنة " + y, y, y===curYear, y===curYear));
    }
    document.getElementById('monthSelect').value = new Date().getMonth();

    // ربط القوائم بالمعالجة
    yrSel.onchange = () => processAllData();
    document.getElementById('monthSelect').onchange = () => processAllData();

    function startSync() {
        let loaded = 0;
        const checkDone = () => { 
            loaded++; 
            if(loaded >= 3) { 
                document.getElementById('loading').style.display='none'; 
                processAllData(); 
            } 
        };

        onValue(ref(db, 'azemaa_v5/customers'), snap => { dbRaw.customers = snap.val() || {}; checkDone(); });
        onValue(ref(db, 'azemaa_v5/yomya'), snap => { dbRaw.yomya = snap.val() || {}; checkDone(); });
        onValue(ref(db, 'azemaa_v5/gyab_data'), snap => { dbRaw.gyab = snap.val() || {}; checkDone(); });
    }

    window.processAllData = function() {
        const selYear = parseInt(yrSel.value);
        const selMonth = document.getElementById('monthSelect').value;
        let totalIn = 0, totalOut = 0, mCust = 0, mYomIn = 0, mYomOut = 0, mWorkers = 0;

        Object.values(dbRaw.customers).forEach(c => {
            if(c.payments) c.payments.forEach(p => {
                const d = new Date(p.date);
                if(d.getFullYear() === selYear) {
                    const amt = parseFloat(p.amount) || 0;
                    totalIn += amt;
                    if(selMonth === "all" || d.getMonth() == selMonth) mCust += amt;
                }
            });
        });

        Object.values(dbRaw.yomya).forEach(y => {
            const d = new Date(y.date);
            if(d.getFullYear() === selYear) {
                const i = parseFloat(y.inVal) || 0, o = parseFloat(y.outVal) || 0;
                totalIn += i; totalOut += o;
                if(selMonth === "all" || d.getMonth() == selMonth) { mYomIn += i; mYomOut += o; }
            }
        });

        Object.keys(dbRaw.gyab).forEach(weekKey => {
            const d = new Date(weekKey);
            if(d.getFullYear() === selYear) {
                dbRaw.gyab[weekKey].forEach(w => {
                    const net = calculateSavedNet(w);
                    totalOut += net;
                    if(selMonth === "all" || d.getMonth() == selMonth) mWorkers += net;
                });
            }
        });

        document.getElementById('total-in').innerText = Math.round(totalIn).toLocaleString();
        document.getElementById('total-out').innerText = Math.round(totalOut).toLocaleString();
        document.getElementById('total-net').innerText = Math.round(totalIn - totalOut).toLocaleString();
        document.getElementById('m-cust').innerText = Math.round(mCust).toLocaleString();
        document.getElementById('m-yom-in').innerText = Math.round(mYomIn).toLocaleString();
        document.getElementById('m-yom-out').innerText = Math.round(mYomOut).toLocaleString();
        document.getElementById('m-workers').innerText = Math.round(mWorkers).toLocaleString();
    }

    function calculateSavedNet(w) {
        if(!w.sal || !w.att) return 0;
        let attSum = w.att.reduce((a, b) => a + parseFloat(b), 0);
        let loansSum = w.loans ? w.loans.reduce((a, b) => a + (parseFloat(b) || 0), 0) : 0;
        return Math.max(0, Math.round(((parseFloat(w.sal) / 6) * attSum) - loansSum - (parseFloat(w.instPaid) || 0)));
    }

    startSync();
</script>
</body>
</html>
