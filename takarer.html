<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقرير المالي التلقائي المتجدد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; --success: #059669; --danger: #dc2626; 
            --accent: #2563eb; --bg: #f1f5f9;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .header { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 25px;
        }
        .control-panel {
            background: white; padding: 20px; border-radius: 15px;
            display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px;
            margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        select { padding: 8px 15px; border-radius: 8px; border: 2px solid var(--accent); font-family: 'Cairo'; font-weight: 700; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border-top: 6px solid var(--accent); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; padding: 10px; background: #f8fafc; font-size: 0.85rem; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-weight: 800; }
        .profit { color: var(--success); }
        .loss { color: var(--danger); }
        .total-row { background: var(--primary); color: white; }
        .annual-summary {
            grid-column: 1 / -1; background: #fff; border-top: 6px solid #fbbf24;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px;
        }
        .ann-box span { display: block; font-size: 0.85rem; color: #64748b; }
        .ann-box strong { font-size: 1.2rem; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">📊 التقرير المالي السنوي</h1>
    <p>النظام الذكي لتحديث السنوات تلقائياً</p>
</div>

<div class="annual-summary">
    <div class="ann-box"><span>دخل السنة (+)</span><strong class="profit" id="ann-in">0</strong></div>
    <div class="ann-box"><span>مصروف السنة (-)</span><strong class="loss" id="ann-out">0</strong></div>
    <div class="ann-box"><span>رواتب العمال السنوية</span><strong class="loss" id="ann-workers">0</strong></div>
    <div class="ann-box" style="background: #f0f9ff;"><span>الربح النهائي</span><strong id="ann-net">0</strong></div>
</div>

<div class="control-panel">
    <label>اختر السنة:</label>
    <select id="yearSelect" onchange="initDays(); updateAll();"></select>
    <label>الشهر:</label>
    <select id="monthSelect" onchange="initDays(); updateAll();"></select>
    <label>اليوم:</label>
    <select id="daySelect" onchange="updateAll();"></select>
</div>

<div class="stats-grid">
    <div class="card"><h3>📅 ميزانية اليوم</h3><table id="day-table"></table></div>
    <div class="card" style="border-top-color: var(--success);"><h3>📈 ملخص الشهر</h3><table id="month-table"></table></div>
</div>

<script>
    const now = new Date();

    function setup() {
        const yrSel = document.getElementById('yearSelect');
        const monSel = document.getElementById('monthSelect');
        
        // --- تعديل ذكي للسنوات ---
        // يبدأ من 2024 ويعرض دائماً السنة الحالية وما بعدها بـ 25 سنة وما قبلها بـ 25 سنة
        const startYear = 2020;
        const endYear = now.getFullYear() + 30; 
        
        for(let y = startYear; y <= endYear; y++) {
            yrSel.add(new Option(`سنة ${y}`, y));
        }
        // ضبط السنة الحالية تلقائياً عند فتح الملف
        yrSel.value = now.getFullYear();

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        months.forEach((m, i) => monSel.add(new Option(m, i)));
        monSel.value = now.getMonth();

        initDays();
        updateAll();
    }

    function initDays() {
        const daySel = document.getElementById('daySelect');
        const yr = document.getElementById('yearSelect').value;
        const mon = document.getElementById('monthSelect').value;
        const daysInMonth = new Date(yr, parseInt(mon) + 1, 0).getDate();
        
        daySel.innerHTML = "";
        for (let i = 1; i <= daysInMonth; i++) {
            daySel.add(new Option(`يوم ${i}`, i));
        }
        if(yr == now.getFullYear() && mon == now.getMonth()) daySel.value = now.getDate();
    }

    function updateAll() {
        const yr = document.getElementById('yearSelect').value;
        const mon = parseInt(document.getElementById('monthSelect').value);
        const day = parseInt(document.getElementById('daySelect').value);

        document.getElementById('main-title').innerText = `📊 التقرير المالي لسنة ${yr}`;

        // ربط البيانات بالاعتماد على السنة المختارة ديناميكياً
        const workshopKey = (yr === "2026") ? 'workshop_2026_v2' : `workshop_${yr}_v1`;
        const workshop = JSON.parse(localStorage.getItem(workshopKey)) || [];
        const clientKeys = Object.keys(localStorage).filter(k => k.startsWith('azemaa_pro_v1_'));
        
        let stats = { day: {in:0, out:0}, month: {in:0, out:0}, year: {in:0, out:0} };

        // 1. حساب بيانات الورشة
        workshop.forEach(item => {
            const d = new Date(item.date);
            const inV = parseFloat(item.inVal) || 0;
            const outV = parseFloat(item.outVal) || 0;

            if (d.getFullYear() == yr) {
                stats.year.in += inV; stats.year.out += outV;
                if (d.getMonth() == mon) {
                    stats.month.in += inV; stats.month.out += outV;
                    if (d.getDate() == day) { stats.day.in += inV; stats.day.out += outV; }
                }
            }
        });

        // 2. حساب دفعات الزبائن
        clientKeys.forEach(key => {
            const c = JSON.parse(localStorage.getItem(key));
            if (c.pays) {
                c.pays.forEach(p => {
                    if(!p.dt) return;
                    const pDate = new Date(p.dt);
                    const val = parseFloat(p.vl) || 0;
                    if (pDate.getFullYear() == yr) {
                        stats.year.in += val;
                        if (pDate.getMonth() == mon) {
                            stats.month.in += val;
                            if (pDate.getDate() == day) stats.day.in += val;
                        }
                    }
                });
            }
        });

        // 3. حساب رواتب العمال للسنة المختارة
        let annWorkerCost = 0;
        for(let w=1; w<=52; w++) {
            const saved = localStorage.getItem(`f_v5_${yr}_w${w}`);
            if(saved) {
                JSON.parse(saved).forEach(wrk => {
                    let aTotal = wrk.att.reduce((a, b) => (parseFloat(a)||0) + (parseFloat(b)||0), 0);
                    annWorkerCost += Math.round((parseFloat(wrk.sal) / 6) * aTotal);
                });
            }
        }

        document.getElementById('ann-in').innerText = stats.year.in.toLocaleString() + " ج.م";
        document.getElementById('ann-out').innerText = stats.year.out.toLocaleString() + " ج.م";
        document.getElementById('ann-workers').innerText = annWorkerCost.toLocaleString() + " ج.م";
        const finalNet = stats.year.in - stats.year.out - annWorkerCost;
        document.getElementById('ann-net').innerText = finalNet.toLocaleString() + " ج.م";
        document.getElementById('ann-net').style.color = finalNet >= 0 ? "var(--success)" : "var(--danger)";

        renderTable('day-table', stats.day, "اليوم");
        renderTable('month-table', stats.month, "الشهر");
    }

    function renderTable(id, data, label) {
        const net = data.in - data.out;
        document.getElementById(id).innerHTML = `
            <tr><th>دخل ${label} (+)</th><td class="profit">${data.in.toLocaleString()}</td></tr>
            <tr><th>مصروف ${label} (-)</th><td class="loss">${data.out.toLocaleString()}</td></tr>
            <tr class="total-row"><th>الصافي</th><td>${net.toLocaleString()} ج.م</td></tr>
        `;
    }

    window.onload = setup;
</script>
</body>
</html>
