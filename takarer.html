<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقرير المالي التلقائي المتجدد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a; 
            --success: #059669; 
            --danger: #dc2626; 
            --accent: #2563eb; 
            --bg: #f1f5f9;
            --warning: #fbbf24;
        }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 20px; 
            color: var(--primary); 
        }

        .header { 
            background: linear-gradient(135deg, var(--primary), var(--accent)); 
            color: white; 
            padding: 30px; 
            border-radius: 20px; 
            text-align: center; 
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.15);
        }

        /* شريط الملخص السنوي */
        .annual-summary {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; 
            padding: 20px; 
            background: white;
            border-radius: 20px; 
            text-align: center; 
            margin-bottom: 25px;
            border-top: 6px solid var(--warning);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .ann-box span { display: block; font-size: 0.9rem; color: #64748b; font-weight: 700; }
        .ann-box strong { font-size: 1.3rem; display: block; margin-top: 5px; }

        /* لوحة التحكم */
        .control-panel {
            background: white; 
            padding: 20px; 
            border-radius: 15px;
            display: flex; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: center; 
            gap: 15px;
            margin-bottom: 30px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        select { 
            padding: 10px 15px; 
            border-radius: 10px; 
            border: 2px solid #e2e8f0; 
            font-family: 'Cairo'; 
            font-weight: 700; 
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus { border-color: var(--accent); }

        /* زر التحديث الجديد */
        .refresh-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 10px;
            font-family: 'Cairo';
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .refresh-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .refresh-btn:active { transform: translateY(0); }

        /* الجداول والبطاقات */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 20px; 
        }

        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border-top: 6px solid var(--accent); 
        }

        h3 { margin-top: 0; font-size: 1.1rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: right; padding: 12px; background: #f8fafc; font-size: 0.9rem; color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-weight: 800; font-size: 1.1rem; }
        
        .profit { color: var(--success); }
        .loss { color: var(--danger); }
        .total-row { background: var(--primary); color: white; }
        .total-row td { border-bottom: none; }

        @media (max-width: 600px) {
            .control-panel { flex-direction: column; align-items: stretch; }
            .refresh-btn { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="main-title">📊 التقرير المالي السنوي</h1>
    <p>النظام الذكي لتحديث ومعالجة البيانات المالية</p>
</div>

<div class="annual-summary">
    <div class="ann-box"><span>دخل السنة (+)</span><strong class="profit" id="ann-in">0</strong></div>
    <div class="ann-box"><span>مصروف السنة (-)</span><strong class="loss" id="ann-out">0</strong></div>
    <div class="ann-box"><span>رواتب العمال السنوية</span><strong class="loss" id="ann-workers">0</strong></div>
    <div class="ann-box" style="background: #f0f9ff; border-radius: 10px;"><span>الربح النهائي للسنة</span><strong id="ann-net">0</strong></div>
</div>

<div class="control-panel">
    <div>
        <label>السنة:</label>
        <select id="yearSelect" onchange="initDays(); updateAll();"></select>
    </div>
    <div>
        <label>الشهر:</label>
        <select id="monthSelect" onchange="initDays(); updateAll();"></select>
    </div>
    <div>
        <label>اليوم:</label>
        <select id="daySelect" onchange="updateAll();"></select>
    </div>
    <button onclick="updateAll()" class="refresh-btn">
        <span>🔄 تحديث البيانات</span>
    </button>
</div>

<div class="stats-grid">
    <div class="card">
        <h3>📅 ميزانية اليوم المختار</h3>
        <table id="day-table"></table>
    </div>
    <div class="card" style="border-top-color: var(--success);">
        <h3>📈 ملخص الشهر المختار</h3>
        <table id="month-table"></table>
    </div>
</div>

<script>
    const now = new Date();

    function setup() {
        const yrSel = document.getElementById('yearSelect');
        const monSel = document.getElementById('monthSelect');
        
        // توليد السنوات (من 2020 إلى الحالية + 30 سنة)
        const startYear = 2020;
        const endYear = now.getFullYear() + 30; 
        
        for(let y = startYear; y <= endYear; y++) {
            yrSel.add(new Option(`سنة ${y}`, y));
        }
        yrSel.value = now.getFullYear();

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        months.forEach((m, i) => monSel.add(new Option(m, i)));
        monSel.value = now.getMonth();

        initDays();
        updateAll();
    }

    function initDays() {
        const daySel = document.getElementById('daySelect');
        const yr = document.getElementById('yearSelect').value;
        const mon = document.getElementById('monthSelect').value;
        const daysInMonth = new Date(yr, parseInt(mon) + 1, 0).getDate();
        
        daySel.innerHTML = "";
        for (let i = 1; i <= daysInMonth; i++) {
            daySel.add(new Option(`يوم ${i}`, i));
        }
        // ضبط اليوم الحالي إذا كنا في نفس الشهر والسنة الحاليين
        if(yr == now.getFullYear() && mon == now.getMonth()) {
            daySel.value = now.getDate();
        }
    }

    function updateAll() {
        const yr = document.getElementById('yearSelect').value;
        const mon = parseInt(document.getElementById('monthSelect').value);
        const day = parseInt(document.getElementById('daySelect').value);

        document.getElementById('main-title').innerText = `📊 التقرير المالي لسنة ${yr}`;

        // مفاتيح التخزين
        const workshopKey = (yr === "2026") ? 'workshop_2026_v2' : `workshop_${yr}_v1`;
        const workshop = JSON.parse(localStorage.getItem(workshopKey)) || [];
        const clientKeys = Object.keys(localStorage).filter(k => k.startsWith('azemaa_pro_v1_'));
        
        let stats = { day: {in:0, out:0}, month: {in:0, out:0}, year: {in:0, out:0} };

        // 1. حساب بيانات الورشة (داخل/خارج)
        workshop.forEach(item => {
            const d = new Date(item.date);
            const inV = parseFloat(item.inVal) || 0;
            const outV = parseFloat(item.outVal) || 0;

            if (d.getFullYear() == yr) {
                stats.year.in += inV; stats.year.out += outV;
                if (d.getMonth() == mon) {
                    stats.month.in += inV; stats.month.out += outV;
                    if (d.getDate() == day) { stats.day.in += inV; stats.day.out += outV; }
                }
            }
        });

        // 2. حساب دفعات الزبائن
        clientKeys.forEach(key => {
            const c = JSON.parse(localStorage.getItem(key));
            if (c.pays) {
                c.pays.forEach(p => {
                    if(!p.dt) return;
                    const pDate = new Date(p.dt);
                    const val = parseFloat(p.vl) || 0;
                    if (pDate.getFullYear() == yr) {
                        stats.year.in += val;
                        if (pDate.getMonth() == mon) {
                            stats.month.in += val;
                            if (pDate.getDate() == day) stats.day.in += val;
                        }
                    }
                });
            }
        });

        // 3. حساب رواتب العمال للسنة المختارة (بناءً على 52 أسبوع)
        let annWorkerCost = 0;
        for(let w=1; w<=52; w++) {
            const saved = localStorage.getItem(`f_v5_${yr}_w${w}`);
            if(saved) {
                JSON.parse(saved).forEach(wrk => {
                    let aTotal = wrk.att.reduce((a, b) => (parseFloat(a)||0) + (parseFloat(b)||0), 0);
                    annWorkerCost += Math.round((parseFloat(wrk.sal) / 6) * aTotal);
                });
            }
        }

        // تحديث واجهة العرض السنوية
        document.getElementById('ann-in').innerText = stats.year.in.toLocaleString() + " ج.م";
        document.getElementById('ann-out').innerText = stats.year.out.toLocaleString() + " ج.م";
        document.getElementById('ann-workers').innerText = annWorkerCost.toLocaleString() + " ج.م";
        
        const finalNet = stats.year.in - stats.year.out - annWorkerCost;
        const netEl = document.getElementById('ann-net');
        netEl.innerText = finalNet.toLocaleString() + " ج.م";
        netEl.style.color = finalNet >= 0 ? "var(--success)" : "var(--danger)";

        // تحديث الجداول
        renderTable('day-table', stats.day, "اليوم");
        renderTable('month-table', stats.month, "الشهر");
    }

    function renderTable(id, data, label) {
        const net = data.in - data.out;
        document.getElementById(id).innerHTML = `
            <tr><th>دخل ${label} (+)</th><td class="profit">${data.in.toLocaleString()}</td></tr>
            <tr><th>مصروف ${label} (-)</th><td class="loss">${data.out.toLocaleString()}</td></tr>
            <tr class="total-row"><th>الصافي النهائي</th><td>${net.toLocaleString()} ج.م</td></tr>
        `;
    }

    window.onload = setup;
</script>
</body>
</html>
