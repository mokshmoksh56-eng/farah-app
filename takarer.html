<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقرير المالي الذكي | 50 عاماً</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0f172a; --success: #059669; --danger: #dc2626; --accent: #2563eb; --bg: #f1f5f9; --warning: #fbbf24; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--primary); }
        .header { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 25px; border-radius: 20px; text-align: center; margin-bottom: 25px; }
        .annual-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 20px; background: white; border-radius: 20px; text-align: center; margin-bottom: 25px; border-top: 6px solid var(--warning); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .ann-box span { display: block; font-size: 0.9rem; color: #64748b; font-weight: 700; }
        .ann-box strong { font-size: 1.3rem; display: block; margin-top: 5px; }
        .control-panel { background: white; padding: 20px; border-radius: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 15px; margin-bottom: 30px; }
        select, button { padding: 12px 20px; border-radius: 10px; border: 2px solid #e2e8f0; font-family: 'Cairo'; font-weight: 700; cursor: pointer; }
        .refresh-btn { background: var(--accent); color: white; border: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; border-top: 6px solid var(--accent); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: right; padding: 12px; background: #f8fafc; color: #64748b; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-weight: 800; }
        .profit { color: var(--success); } .loss { color: var(--danger); }
        .total-row { background: var(--primary); color: white; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="dynamic-title">📊 التقرير المالي الموحد</h1>
    <p>نظام ذكي يعمل تلقائياً لمدة 50 عاماً القادمة</p>
</div>

<div class="annual-summary">
    <div class="ann-box"><span>إجمالي التحصيل (+)</span><strong class="profit" id="ann-in">0</strong></div>
    <div class="ann-box"><span>إجمالي المصاريف (-)</span><strong class="loss" id="ann-out">0</strong></div>
    <div class="ann-box"><span>رواتب العمال</span><strong class="loss" id="ann-workers">0</strong></div>
    <div class="ann-box" style="background: #f0f9ff;"><span>صافي الربح</span><strong id="ann-net">0</strong></div>
</div>

<div class="control-panel">
    <select id="yearSelect" onchange="updateAll()"></select>
    <select id="monthSelect" onchange="updateAll()"></select>
    <button onclick="updateAll()" class="refresh-btn">🔄 تحديث البيانات</button>
</div>

<div class="stats-grid">
    <div class="card"><h3>📈 كشف حركة الشهر</h3><table id="month-table"></table></div>
    <div class="card" style="border-top-color: var(--success);"><h3>👷 حساب الرواتب</h3><table id="worker-table"></table></div>
</div>

<script>
    // إعداد السنوات تلقائياً (الحالية + 50 سنة)
    function setup() {
        const yrSel = document.getElementById('yearSelect');
        const monSel = document.getElementById('monthSelect');
        const now = new Date();
        const currentYear = now.getFullYear();

        // توليد 50 سنة قادمة تلقائياً
        for(let y = currentYear - 2; y <= currentYear + 50; y++) {
            yrSel.add(new Option(`سنة ${y}`, y));
        }
        yrSel.value = currentYear;

        const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
        months.forEach((m, i) => monSel.add(new Option(m, i)));
        monSel.value = now.getMonth();

        updateAll();
    }

    function updateAll() {
        const yr = document.getElementById('yearSelect').value;
        const mon = parseInt(document.getElementById('monthSelect').value);
        document.getElementById('dynamic-title').innerText = `📊 التقرير المالي لسنة ${yr}`;

        let stats = { in: 0, out: 0, workers: 0 };

        // 1. الربط مع ملف اليومية (yom.html) باستخدام المفتاح: workshop_data
        const workshopData = JSON.parse(localStorage.getItem('workshop_data')) || [];
        workshopData.forEach(item => {
            const d = new Date(item.date);
            if(d.getFullYear() == yr && d.getMonth() == mon) {
                stats.in += (parseFloat(item.inVal) || 0);
                stats.out += (parseFloat(item.outVal) || 0);
            }
        });

        // 2. الربط مع ملف الزبائن (zbon.html) - مسح شامل للمفاتيح azemaa_pro_v5_
        for(let i=0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if(key.startsWith('azemaa_pro_v5_')) {
                const client = JSON.parse(localStorage.getItem(key));
                if(client.pays) {
                    client.pays.forEach(p => {
                        const pd = new Date(p.dt);
                        if(pd.getFullYear() == yr && pd.getMonth() == mon) {
                            stats.in += (parseFloat(p.vl) || 0);
                        }
                    });
                }
            }
        }

        // 3. الربط مع ملف العمال (gyab.html) - قراءة مفاتيح الأسابيع f_data_v2026_simple_
        Object.keys(localStorage).forEach(key => {
            if(key.startsWith('f_data_v2026_simple_')) {
                const dateFromKey = key.replace('f_data_v2026_simple_', '');
                const d = new Date(dateFromKey);
                if(d.getFullYear() == yr && d.getMonth() == mon) {
                    const weekData = JSON.parse(localStorage.getItem(key));
                    weekData.forEach(w => {
                        let totalAtt = w.att.reduce((a, b) => (parseFloat(a)||0) + (parseFloat(b)||0), 0);
                        let totalLoans = w.loans.reduce((a, b) => (parseFloat(a)||0) + (parseFloat(b)||0), 0);
                        // الحسبة: (الراتب اليومي * عدد الأيام) - السلف
                        let net = ((parseFloat(w.sal)/6) * totalAtt) - totalLoans;
                        stats.workers += (net > 0 ? net : 0);
                    });
                }
            }
        });

        // تحديث الواجهة بالأرقام النهائية
        document.getElementById('ann-in').innerText = Math.round(stats.in).toLocaleString() + " ج.م";
        document.getElementById('ann-out').innerText = Math.round(stats.out).toLocaleString() + " ج.م";
        document.getElementById('ann-workers').innerText = Math.round(stats.workers).toLocaleString() + " ج.م";
        
        const netTotal = stats.in - stats.out - stats.workers;
        const netEl = document.getElementById('ann-net');
        netEl.innerText = Math.round(netTotal).toLocaleString() + " ج.م";
        netEl.style.color = netTotal >= 0 ? "var(--success)" : "var(--danger)";

        // ملخص الجداول
        document.getElementById('month-table').innerHTML = `
            <tr><th>مقبوضات (يومية + زبائن)</th><td class="profit">${Math.round(stats.in).toLocaleString()}</td></tr>
            <tr><th>مصروفات الورشة</th><td class="loss">${Math.round(stats.out).toLocaleString()}</td></tr>
            <tr class="total-row"><th>الرصيد قبل الرواتب</th><td>${Math.round(stats.in - stats.out).toLocaleString()}</td></tr>
        `;
        document.getElementById('worker-table').innerHTML = `
            <tr><th>صافي الرواتب المدفوعة</th><td class="loss">${Math.round(stats.workers).toLocaleString()}</td></tr>
            <tr class="total-row"><th>الربح الصافي النهائي</th><td>${Math.round(netTotal).toLocaleString()} ج.م</td></tr>
        `;
    }

    window.onload = setup;
</script>
</body>
</html>
