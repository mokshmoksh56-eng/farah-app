<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقارير Azemaa Pro 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #008080;
            --bg-color: #004d4d;
            --card-bg: rgba(255, 255, 255, 0.1);
            --accent: #a2f9c1;
            --danger: #ff7675;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-color); color: white; padding: 15px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { 
            background: var(--card-bg); padding: 15px; border-radius: 15px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .full-width { grid-column: span 2; background: linear-gradient(135deg, #008080, #005f5f); }
        .card h3 { margin: 0; font-size: 0.8rem; color: var(--accent); opacity: 0.9; }
        .card .value { margin: 8px 0 0; font-size: 1.3rem; font-weight: 900; }
        
        .section-title { grid-column: span 2; font-size: 1rem; margin: 10px 0 5px; color: #fff; border-right: 4px solid var(--accent); padding-right: 10px; }
        
        .btn-refresh {
            grid-column: span 2; background: var(--accent); color: #004d4d; 
            border: none; padding: 12px; border-radius: 10px; font-weight: 900;
            cursor: pointer; margin-top: 15px; width: 100%; font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0;">📊 التقارير الختامية 2026</h2>
    </div>

    <div class="grid">
        <div class="section-title">💼 حسابات الزبائن (العقود)</div>
        <div class="card full-width">
            <h3>إجمالي قيمة الاتفاقات</h3>
            <div class="value" id="z-total">0</div>
        </div>
        <div class="card">
            <h3>المحصل (داخل)</h3>
            <div class="value" id="z-in" style="color: var(--accent);">0</div>
        </div>
        <div class="card">
            <h3>المتبقي بالسوق</h3>
            <div class="value" id="z-out" style="color: var(--danger);">0</div>
        </div>

        <div class="section-title">💸 حركة الخزينة (اليومية)</div>
        <div class="card">
            <h3>إجمالي المصاريف</h3>
            <div class="value" id="y-out">0</div>
        </div>
        <div class="card">
            <h3>صافي الربح الحالي</h3>
            <div class="value" id="y-net" style="color: var(--accent);">0</div>
        </div>

        <div class="section-title">👷 رواتب العمال (الأسبوع الحالي)</div>
        <div class="card">
            <h3>سلف العمال</h3>
            <div class="value" id="g-loans">0</div>
        </div>
        <div class="card">
            <h3>صافي الأجور المستحقة</h3>
            <div class="value" id="g-net" style="color: #ffda79;">0</div>
        </div>
    </div>

    <button class="btn-refresh" onclick="renderReports()">تحديث البيانات المدمجة 🔄</button>

    <script>
        function renderReports() {
            // 1. حسابات الزبائن (zbon.html) - مفتاح: azemaa_pro_v1_
            let zTotalAgreed = 0;
            let zTotalPaid = 0;
            for (let i = 1; i <= 100; i++) {
                const data = JSON.parse(localStorage.getItem(`azemaa_pro_v1_${i}`));
                if (data) {
                    zTotalAgreed += parseFloat(data.t) || 0;
                    if (data.pays) {
                        data.pays.forEach(p => zTotalPaid += parseFloat(p.vl) || 0);
                    }
                }
            }

            // 2. حسابات اليومية (yom.html) - مفتاح: workshop_2026_v2
            let yTotalIn = 0;
            let yTotalOut = 0;
            const yData = JSON.parse(localStorage.getItem('workshop_2026_v2')) || [];
            yData.forEach(item => {
                yTotalIn += parseFloat(item.inVal) || 0;
                yTotalOut += parseFloat(item.outVal) || 0;
            });

            // 3. حسابات العمال (gyab.html) - مفاتيح تبدأ بـ f_v5_
            let gTotalLoans = 0;
            let gTotalNet = 0;
            // سنبحث في الـ localStorage عن أحدث أسبوع تم تسجيله للعمال
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('f_v5_')) {
                    const weekData = JSON.parse(localStorage.getItem(key)) || [];
                    weekData.forEach(w => {
                        // حساب السلف
                        if (w.loans) w.loans.forEach(l => gTotalLoans += parseFloat(l) || 0);
                        
                        // حساب الصافي (المعادلة المستخدمة في gyab.html)
                        let sal = parseFloat(w.sal) || 0;
                        let att = 0; if(w.att) w.att.forEach(a => att += parseFloat(a));
                        let loansSum = 0; if(w.loans) w.loans.forEach(l => loansSum += parseFloat(l) || 0);
                        let net = Math.round(((sal / 6) * att) - loansSum);
                        if(net > 0) gTotalNet += net;
                    });
                }
            });

            // تحديث الواجهة
            document.getElementById('z-total').innerText = zTotalAgreed.toLocaleString() + " ج.م";
            document.getElementById('z-in').innerText = zTotalPaid.toLocaleString() + " ج.م";
            document.getElementById('z-out').innerText = (zTotalAgreed - zTotalPaid).toLocaleString() + " ج.م";
            
            document.getElementById('y-out').innerText = yTotalOut.toLocaleString() + " ج.م";
            document.getElementById('y-net').innerText = (yTotalIn - yTotalOut).toLocaleString() + " ج.م";
            
            document.getElementById('g-loans').innerText = gTotalLoans.toLocaleString() + " ج.م";
            document.getElementById('g-net').innerText = gTotalNet.toLocaleString() + " ج.م";
        }

        // التنفيذ عند التحميل
        window.onload = renderReports;
    </script>
</body>
</html>
