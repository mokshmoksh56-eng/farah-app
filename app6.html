<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة حضور طلخا المركبة</title>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { 
            --turquoise: #008b8b; --danger: #d32f2f; --warning: #ffc107; 
            --info: #007bff; --green: #2e7d32; --navy: #001f3f; --share: #25d366;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #eef2f3; margin: 0; padding: 10px; color: #1a1a1a; direction: rtl; }
        
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); overflow: hidden; border: 1px solid #ddd; }
        
        .station-header { background: var(--navy); color: #ffd700; padding: 10px; text-align: center; font-size: 14px; font-weight: bold; border-bottom: 2px solid #ffd700; }
        .header { background: linear-gradient(135deg, var(--turquoise) 0%, #00ced1 100%); color: white; padding: 20px 10px; text-align: center; }
        #digital-clock { font-size: 45px; font-weight: 800; font-family: 'Courier New', monospace; display: block; color: #e0ffff; }
        .date-display { margin-top:5px; font-weight: bold; font-size: 17px; background: rgba(0,0,0,0.1); padding: 5px 15px; border-radius: 20px; display: inline-block; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; background: #f0f7f7; }
        .dash-card { background: white; padding: 10px 5px; border-radius: 15px; text-align: center; border: 1px solid #d1e0e0; cursor: pointer; }
        .dash-label { font-size: 11px; color: #777; font-weight: bold; display: block; }
        .dash-val { font-size: 14px; font-weight: 800; color: var(--turquoise); }

        .user-info-section { padding: 15px; background: #fff; }
        .info-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .info-input { width: 100%; border: 2px solid #eee; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: bold; text-align: center; outline: none; }

        .actions { padding: 0 15px 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-main { width: 100%; padding: 16px; border: none; border-radius: 18px; font-size: 17px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; }
        .btn-main:disabled { background: #bdc3c7 !important; }
        
        .action-row { display: flex; gap: 8px; }
        .btn-manual { flex: 1; background: #fff; border: 2px dashed var(--turquoise); color: var(--turquoise); font-size: 13px; padding: 10px; border-radius: 15px; }
        .btn-share-small { width: 50px; background: var(--share); border: none; border-radius: 15px; color: white; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .table-wrap { padding: 5px; max-height: 250px; overflow-y: auto; background: #fafafa; border-top: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        th { padding: 10px 5px; background: #e0f2f2; color: var(--turquoise); position: sticky; top: 0; }
        td { padding: 10px 5px; border-bottom: 1px solid #eee; font-weight: bold; }

        .report-section { background: #fff; padding: 15px; border-top: 2px solid var(--turquoise); }
        .report-header-info { margin-bottom: 10px; padding: 8px; background: #f0f7f7; border-radius: 10px; font-weight: bold; color: var(--navy); display: flex; justify-content: space-around; font-size: 13px; }
        .report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .report-item { background: #f8f9fa; padding: 10px; border-radius: 12px; font-size: 12px; font-weight: bold; border-left: 3px solid var(--turquoise); }

        .status-late { color: #d4a017; } .status-absent { color: var(--danger); } 
        .status-permit { color: var(--info); } .status-normal { color: var(--green); } 

        #modalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
        .modal-box { background: white; width: 90%; max-width: 380px; border-radius: 25px; padding: 25px; text-align: center; }
    </style>
</head>
<body onload="init()">

<div class="container" id="main-app-content">
    <div class="station-header">محطة كهرباء طلخا المركبة ⚡</div>
    
    <div class="header">
        <span id="digital-clock">00:00:00</span>
        <div class="date-display" id="date-text">-- / -- / ----</div>
    </div>

    <div class="dashboard">
        <div class="dash-card" onclick="editBaseBalance('reg')"><span class="dash-label">اعتيادي</span><span id="reg-left" class="dash-val" style="color:var(--danger)">30</span></div>
        <div class="dash-card" onclick="editBaseBalance('emg')"><span class="dash-label">عارضة</span><span id="emg-left" class="dash-val" style="color:var(--danger)">7</span></div>
        <div class="dash-card"><span class="dash-label">تصاريح</span><span id="month-permits" class="dash-val" style="color:var(--info)">0 / 3</span></div>
        <div class="dash-card"><span>تأخير (د)</span><br><span id="sum-late" class="dash-val" style="color:var(--warning)">0</span></div>
        <div class="dash-card"><span>رصيد دقايق</span><br><span id="rem-mins" class="dash-val" style="color:var(--green)">60</span></div>
        <div class="dash-card" onclick="resetSystem()"><span>ضبط</span><br><span class="dash-val">⚙️</span></div>
    </div>

    <div class="user-info-section">
        <div class="info-row">
            <input type="text" id="u-name" class="info-input" placeholder="الاسم" oninput="saveUserInfo()">
            <input type="text" id="u-id" class="info-input" placeholder="الكود" oninput="saveUserInfo()">
            <select id="u-grade" class="info-input" onchange="saveUserInfo()">
                <option value="">الدرجة</option>
                <option value="الأولى">الأولى</option>
                <option value="الثانية">الثانية</option>
                <option value="الثالثة">الثالثة</option>
            </select>
        </div>
    </div>

    <div class="actions">
        <button id="main-punch-btn" class="btn-main" onclick="handlePunch(null, null, new Date())">تسجيل بصمة الآن 📲</button>
        <div class="action-row">
            <button class="btn-manual" onclick="openManualWheel()">تسجيل يدوي / إجازة ✍️</button>
            <button class="btn-share-small" onclick="shareAsImage()" title="مشاركة صورة">📤</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead><tr><th>التاريخ</th><th>الوقت</th><th>الحالة</th><th>حذف</th></tr></thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <div class="report-section">
        <div class="report-header-info">
             <span>👤 <span id="rep-name">---</span></span>
             <span>🆔 <span id="rep-code">---</span></span>
        </div>
        <div class="report-grid">
            <div class="report-item">إجازة اعتيادي: <span id="rep-reg" class="status-absent">0</span></div>
            <div class="report-item">إجازة عارضة: <span id="rep-emg" class="status-absent">0</span></div>
            <div class="report-item">إجمالي التصاريح: <span id="rep-perm" class="status-permit">0</span></div>
            <div class="report-item">دقائق التأخير: <span id="rep-late" class="status-late">0</span></div>
        </div>
    </div>
</div>

<div id="modalOverlay">
    <div class="modal-box">
        <h3>تسجيل يدوي</h3>
        <input type="date" id="manual-date-picker" style="width:100%; padding:10px;">
        <div style="display:flex; justify-content:center; gap:10px; margin:15px 0; direction:ltr;">
            <select id="wheel-hr" style="padding:8px;"></select>
            <select id="wheel-mn" style="padding:8px;"></select>
        </div>
        <button class="btn-main" style="background:var(--turquoise); margin-bottom:10px;" onclick="submitManual()">حفظ ✅</button>
        <button class="btn-main" style="background:#eee; color:#666;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('t_db')) || [];
    let vacs = JSON.parse(localStorage.getItem('t_vacs')) || [];
    let baseReg = parseInt(localStorage.getItem('base_reg')) || 30;
    let baseEmg = parseInt(localStorage.getItem('base_emg')) || 7;

    function arToEn(str) { return str ? str.toString().replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632) : ""; }
    function formatDateArabic(dateObj) { return `${dateObj.getDate()} / ${dateObj.getMonth()+1} / ${dateObj.getFullYear()}`; }

    function init() {
        fillTimeWheels();
        document.getElementById('u-name').value = localStorage.getItem('u_n') || "";
        document.getElementById('u-id').value = arToEn(localStorage.getItem('u_i') || "");
        document.getElementById('u-grade').value = localStorage.getItem('u_g') || "";
        updateTime(); setInterval(updateTime, 1000);
        render();
    }

    // وظيفة المشاركة كصورة (Screenshot)
    function shareAsImage() {
        const element = document.getElementById('main-app-content');
        html2canvas(element, { backgroundColor: "#eef2f3", scale: 2 }).then(canvas => {
            canvas.toBlob(blob => {
                const file = new File([blob], 'Report.png', { type: 'image/png' });
                if (navigator.share) {
                    navigator.share({ title: 'تقرير حضور طلخا', files: [file] }).catch(console.error);
                } else {
                    alert("المشاركة غير مدعومة، تم فتح الصورة في نافذة جديدة، اضغط مطولاً لحفظها.");
                    window.open(canvas.toDataURL());
                }
            });
        });
    }

    function editBaseBalance(type) {
        let val = prompt("تعديل الرصيد:", type === 'reg' ? baseReg : baseEmg);
        if (val !== null) {
            val = parseInt(arToEn(val));
            if (!isNaN(val)) {
                if (type === 'reg') { baseReg = val; localStorage.setItem('base_reg', val); }
                else { baseEmg = val; localStorage.setItem('base_emg', val); }
                render();
            }
        }
    }

    function saveUserInfo() {
        const idInput = document.getElementById('u-id');
        idInput.value = arToEn(idInput.value);
        localStorage.setItem('u_n', document.getElementById('u-name').value);
        localStorage.setItem('u_i', idInput.value);
        localStorage.setItem('u_g', document.getElementById('u-grade').value);
        render();
    }

    function fillTimeWheels() {
        const h = document.getElementById('wheel-hr'), m = document.getElementById('wheel-mn');
        for(let i=7; i<=14; i++) h.innerHTML += `<option value="${i}">${i}</option>`;
        for(let i=0; i<=59; i++) m.innerHTML += `<option value="${i}">${i < 10 ? '0' + i : i}</option>`;
        document.getElementById('manual-date-picker').valueAsDate = new Date();
    }

    function updateTime() {
        const now = new Date();
        document.getElementById('digital-clock').innerText = now.toLocaleTimeString('en-GB');
        document.getElementById('date-text').innerText = formatDateArabic(now);
        updateBtnColor();
    }

    function updateBtnColor() {
        const now = new Date(), totalMin = now.getHours() * 60 + now.getMinutes(), btn = document.getElementById('main-punch-btn'), isLogged = [...db, ...vacs].find(e => e.fDate === now.toDateString());
        if (isLogged) { btn.disabled = true; btn.innerText = "تم تسجيل اليوم ✅"; btn.style.background = "#bdc3c7"; } 
        else if (totalMin < 420 || totalMin > 570) { btn.disabled = true; btn.innerText = "البصمة مغلقة"; btn.style.background = "#bdc3c7"; }
        else {
            btn.disabled = false;
            if (totalMin <= 475) btn.style.background = "var(--green)";
            else if (totalMin <= 490) btn.style.background = "var(--warning)";
            else btn.style.background = "var(--danger)";
            btn.innerText = "تسجيل بصمة الآن 📲";
        }
    }

    function handlePunch(h, m, dateInput) {
        const finalDate = new Date(dateInput), dateKey = finalDate.toDateString();
        if ([...db, ...vacs].find(e => e.fDate === dateKey)) return alert("⚠️ مسجل مسبقاً!");
        const finalH = h !== null ? h : finalDate.getHours(), finalM = m !== null ? m : finalDate.getMinutes(), tot = finalH * 60 + finalM;
        if (tot <= 475) register(dateKey, finalDate, formatTime(finalH, finalM), 0, 'منتظم');
        else if (tot <= 490) register(dateKey, finalDate, formatTime(finalH, finalM), (tot - 475), 'تأخير');
        else {
            let choice = arToEn(prompt("اختر: (1) اعتيادي (2) عارضة (3) تصريح"));
            if(choice==="1") register(dateKey, finalDate, '---', 0, 'اعتيادي');
            else if(choice==="2") register(dateKey, finalDate, '---', 0, 'عارضة');
            else if(choice==="3") {
                const count = db.filter(e => { const d = new Date(e.sortKey); return e.type.includes('تصريح') && d.getMonth() === finalDate.getMonth(); }).length;
                if (count >= 3) return alert("لا يوجد تصاريح إضافية!");
                register(dateKey, finalDate, formatTime(finalH, finalM), 0, `تصريح ${count + 1}`);
            }
        }
    }

    function register(fDate, dObj, time, late, type) {
        const item = { id: Date.now(), fDate, dDate: formatDateArabic(dObj), time, late, type, sortKey: dObj.getTime() };
        if(type==='اعتيادي'||type==='عارضة') vacs.unshift(item); else db.unshift(item);
        localStorage.setItem('t_db', JSON.stringify(db)); localStorage.setItem('t_vacs', JSON.stringify(vacs));
        render();
    }

    function render() {
        const body = document.getElementById('log-body'); body.innerHTML = '';
        let lateSum = 0, rUsed = 0, eUsed = 0, totalPermits = 0;
        const now = new Date();
        [...db, ...vacs].sort((a,b) => b.sortKey - a.sortKey).forEach(e => {
            let cls = 'status-normal';
            if(e.type==='تأخير') { lateSum += e.late; cls = 'status-late'; }
            if(e.type==='اعتيادي') { rUsed++; cls = 'status-absent'; }
            if(e.type==='عارضة') { eUsed++; cls = 'status-absent'; }
            if(e.type.includes('تصريح')) { totalPermits++; cls = 'status-permit'; }
            body.innerHTML += `<tr><td>${e.dDate}</td><td>${e.time}</td><td class="${cls}">${e.type}${e.late>0?' ('+e.late+'د)':''}</td><td><button class="del-btn" onclick="deleteRow(${e.id})">🗑️</button></td></tr>`;
        });
        document.getElementById('rep-name').innerText = localStorage.getItem('u_n') || "---";
        document.getElementById('rep-code').innerText = arToEn(localStorage.getItem('u_i')) || "---";
        document.getElementById('sum-late').innerText = lateSum;
        document.getElementById('rem-mins').innerText = Math.max(0, 60 - lateSum);
        document.getElementById('reg-left').innerText = baseReg - rUsed;
        document.getElementById('emg-left').innerText = baseEmg - eUsed;
        const mPerms = db.filter(e => { const d = new Date(e.sortKey); return d.getMonth() === now.getMonth() && e.type.includes('تصريح'); }).length;
        document.getElementById('month-permits').innerText = mPerms + " / 3";
        document.getElementById('rep-reg').innerText = rUsed; document.getElementById('rep-emg').innerText = eUsed;
        document.getElementById('rep-perm').innerText = totalPermits; document.getElementById('rep-late').innerText = lateSum;
    }

    function formatTime(h, m) { return (h%12||12)+":"+(m<10?'0'+m:m)+(h>=12?' م':' ص'); }
    function openManualWheel() { document.getElementById('modalOverlay').style.display = 'flex'; }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function submitManual() {
        const d = document.getElementById('manual-date-picker').value, h = parseInt(document.getElementById('wheel-hr').value), m = parseInt(document.getElementById('wheel-mn').value);
        if(!d) return alert("اختر التاريخ"); handlePunch(h, m, d); closeModal();
    }
    function deleteRow(id) { if(confirm("حذف السجل؟")) { db = db.filter(i => i.id !== id); vacs = vacs.filter(i => i.id !== id); localStorage.setItem('t_db', JSON.stringify(db)); localStorage.setItem('t_vacs', JSON.stringify(vacs)); render(); } }
    function resetSystem() { if(confirm("⚠️ مسح جميع البيانات؟")) { localStorage.clear(); location.reload(); } }
</script>
</body>
</html>
