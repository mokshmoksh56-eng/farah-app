<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">يومية الورشة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af; --success: #059669; --danger: #dc2626;
            --whatsapp: #25d366; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
            --contacts: #6366f1;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; line-height: 1.4; font-weight: 700; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        header { text-align: center; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 1.3rem; font-weight: 900; }
        
        /* Dashboard & Form Styles */
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .card { background: var(--card-bg); padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .card h3 { font-size: 0.8rem; margin: 0; color: #64748b; font-weight: 800; }
        .card .value { font-size: 1.1rem; font-weight: 900; margin-top: 3px; }
        .form-section { background: #f1f5f9; padding: 15px; border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; }
        .btn-save { grid-column: span 3; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        /* WhatsApp & Contacts Section */
        .whatsapp-section { background: #f0fdf4; padding: 15px; border-radius: 12px; border: 2px solid var(--whatsapp); margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; }
        .whatsapp-section input { flex: 2; min-width: 180px; border: 1px solid var(--whatsapp); font-size: 16px; }
        .btn-contacts { background: var(--contacts); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .btn-whatsapp { background: var(--whatsapp); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1; }

        /* Table Styles */
        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; font-weight: 900; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: center; font-weight: 700; }
        .td-in { color: var(--success); font-weight: 900; background: #f0fdf4; }
        .td-out { color: var(--danger); font-weight: 900; background: #fef2f2; }
        .badge { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-weight: 800; }
        
        @media (max-width: 600px) { .form-section { grid-template-columns: 1fr; } .btn-save { grid-column: span 1; } .dashboard { grid-template-columns: 1fr 1fr; } .whatsapp-section { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <header><h1 id="main-header">حسابات الورشة</h1></header>

    <div class="dashboard">
        <div class="card"><h3>اليوم</h3><div class="value" id="day-total" style="color:var(--success)">0</div></div>
        <div class="card"><h3>الشهر</h3><div class="value" id="month-total" style="color:var(--primary)">0</div></div>
        <div class="card"><h3>إجمالي الخارج</h3><div class="value" id="year-out" style="color:var(--danger)">0</div></div>
        <div class="card"><h3>الرصيد الصافي</h3><div class="value" id="year-net">0</div></div>
    </div>

    <div class="form-section">
        <select id="entry-shop">
            <option value="زبون">👤 زبون</option>
            <option value="عمال">👷 عمال</option>
            <option value="الومنيوم">💎 الومنيوم</option>
            <option value="خشب">🪵 خشب</option>
            <option value="اكسسوارات">⚙️ اكسسوارات</option>
            <option value="غير ذلك">✨ غير ذلك</option>
        </select>
        <input type="text" id="entry-customer" placeholder="الاسم">
        <input type="datetime-local" id="entry-date">
        <input type="text" id="entry-desc" placeholder="البيان">
        <input type="number" id="entry-out" style="border-right: 4px solid var(--danger)" placeholder="مبلغ خارج (-)">
        <input type="number" id="entry-in" style="border-right: 4px solid var(--success)" placeholder="مبلغ داخل (+)">
        <input type="hidden" id="edit-id">
        <button class="btn-save" id="btn-main" onclick="processEntry()">حفظ العملية</button>
    </div>

    <div class="whatsapp-section">
        <input type="number" id="wa-number" placeholder="رقم الواتساب">
        <button class="btn-contacts" onclick="getContact()">
            📱 سجل الهاتف
        </button>
        <button class="btn-whatsapp" onclick="sendWhatsAppReport()">
            💬 إرسال السجل الكامل
        </button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>التاريخ</th><th>القسم</th><th>الاسم</th><th>البيان</th><th>خارج</th><th>داخل</th><th>إجراء</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const currentYear = new Date().getFullYear();
    window.onload = function() { 
        document.getElementById('main-header').innerText = `حسابات الورشة ${currentYear}`;
        setActualTime(); 
        loadData(); 
    };

    // ميزة اختيار الاسم من الهاتف
    async function getContact() {
        const props = ['name', 'tel'];
        const opts = { multiple: false };

        try {
            if ('contacts' in navigator && 'ContactsManager' in window) {
                const contact = await navigator.contacts.select(props, opts);
                if (contact.length > 0 && contact[0].tel.length > 0) {
                    // تنظيف الرقم من المسافات أو الرموز
                    let cleanNumber = contact[0].tel[0].replace(/\s+/g, '').replace(/-/g, '').replace(/\+/g, '');
                    // إذا كان يبدأ بـ 00 حذفهم، وإذا كان 010 مثلاً نتركه كما هو للتحويل لاحقاً
                    document.getElementById('wa-number').value = cleanNumber;
                }
            } else {
                alert("عذراً، متصفحك لا يدعم الوصول لسجل الأسماء مباشرة. يرجى كتابة الرقم يدوياً.");
            }
        } catch (ex) {
            console.log("Error: " + ex.message);
        }
    }

    function setActualTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('entry-date').value = now.toISOString().slice(0, 16);
    }

    function processEntry() {
        const shop = document.getElementById('entry-shop').value, 
              customer = document.getElementById('entry-customer').value.trim() || "-", 
              date = document.getElementById('entry-date').value, 
              desc = document.getElementById('entry-desc').value.trim() || "-", 
              inVal = parseFloat(document.getElementById('entry-in').value) || 0, 
              outVal = parseFloat(document.getElementById('entry-out').value) || 0, 
              editId = document.getElementById('edit-id').value;

        if (inVal === 0 && outVal === 0) { alert("يرجى إدخال مبلغ"); return; }
        
        let data = JSON.parse(localStorage.getItem('workshop_data')) || [];
        if (editId) { 
            const index = data.findIndex(item => item.id == editId); 
            if (index !== -1) data[index] = { ...data[index], shop, customer, date, desc, inVal, outVal }; 
        } else { 
            data.push({ shop, customer, date, desc, inVal, outVal, id: Date.now() }); 
        }
        localStorage.setItem('workshop_data', JSON.stringify(data));
        resetForm(); loadData();
    }

    function resetForm() {
        document.getElementById('entry-customer').value = ""; 
        document.getElementById('entry-desc').value = ""; 
        document.getElementById('entry-in').value = ""; 
        document.getElementById('entry-out').value = ""; 
        document.getElementById('edit-id').value = ""; 
        document.getElementById('btn-main').innerText = "حفظ العملية"; 
        setActualTime();
    }

    function loadData() {
        const tableBody = document.getElementById('table-body'), 
              data = JSON.parse(localStorage.getItem('workshop_data')) || [];
        tableBody.innerHTML = "";
        let totals = { day: 0, month: 0, yearOut: 0, yearNet: 0 };
        const now = new Date();

        data.slice().sort((a,b) => new Date(b.date) - new Date(a.date)).forEach((item) => {
            const rowDate = new Date(item.date), itemNet = item.inVal - item.outVal;
            if (rowDate.toDateString() === now.toDateString()) totals.day += itemNet;
            if (rowDate.getMonth() === now.getMonth()) totals.month += itemNet;
            totals.yearOut += item.outVal; totals.yearNet += itemNet;

            tableBody.innerHTML += `
                <tr>
                    <td>${item.date.replace('T', ' ')}</td>
                    <td><span class="badge">${item.shop}</span></td>
                    <td>${item.customer}</td>
                    <td>${item.desc}</td>
                    <td class="td-out">${item.outVal || '-'}</td>
                    <td class="td-in">${item.inVal || '-'}</td>
                    <td>
                        <button onclick="sendSingleWhatsApp(${item.id})" title="إرسال واتساب" style="border:none; background:none; cursor:pointer;">🟢</button>
                        <button onclick="startEdit(${item.id})" style="border:none; background:none; cursor:pointer;">📝</button>
                        <button onclick="deleteItem(${item.id})" style="border:none; background:none; cursor:pointer;">🗑️</button>
                    </td>
                </tr>`;
        });
        document.getElementById('day-total').innerText = totals.day.toLocaleString();
        document.getElementById('month-total').innerText = totals.month.toLocaleString();
        document.getElementById('year-out').innerText = totals.yearOut.toLocaleString();
        document.getElementById('year-net').innerText = totals.yearNet.toLocaleString();
    }

    function sendSingleWhatsApp(id) {
        const data = JSON.parse(localStorage.getItem('workshop_data')) || [];
        const item = data.find(i => i.id == id);
        let phone = document.getElementById('wa-number').value.trim();
        if (!phone) return alert("يرجى اختيار رقم أو كتابته أولاً");
        if (phone.startsWith('01')) phone = '2' + phone;

        let msg = `🧾 *إيصال عملية*\n👤 الاسم: ${item.customer}\n📝 البيان: ${item.desc}\n💰 المبلغ: ${item.inVal || -item.outVal} ج.م`;
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function sendWhatsAppReport() {
        let phone = document.getElementById('wa-number').value.trim();
        if (!phone) return alert("يرجى اختيار رقم أو كتابته");
        if (phone.startsWith('01')) phone = '2' + phone;
        // ... (بقية كود التقرير الشامل)
    }

    function startEdit(id) {
        const data = JSON.parse(localStorage.getItem('workshop_data'));
        const item = data.find(i => i.id == id);
        if (item) {
            document.getElementById('entry-shop').value = item.shop;
            document.getElementById('entry-customer').value = item.customer;
            document.getElementById('entry-date').value = item.date;
            document.getElementById('entry-desc').value = item.desc;
            document.getElementById('entry-in').value = item.inVal || "";
            document.getElementById('entry-out').value = item.outVal || "";
            document.getElementById('edit-id').value = item.id;
            document.getElementById('btn-main').innerText = "تحديث";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function deleteItem(id) { if(confirm("حذف؟")) { let data = JSON.parse(localStorage.getItem('workshop_data')); localStorage.setItem('workshop_data', JSON.stringify(data.filter(i => i.id !== id))); loadData(); } }
</script>
</body>
</html>
