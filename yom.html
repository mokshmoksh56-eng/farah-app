<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">يومية الورشة 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبات فايربيس المستقرة والمتوافقة مع التشغيل المحلى والسحابى المختلط -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1e40af; --success: #059669; --danger: #dc2626;
            --whatsapp: #25d366; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
            --cloud-blue: #00a8ff;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; line-height: 1.4; font-weight: 700; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        header { text-align: center; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 1.3rem; font-weight: 900; }
        
        .workshop-config { background: #eff6ff; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed var(--primary); display: flex; align-items: center; gap: 10px; }
        .workshop-config input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: 800; text-align: center; color: var(--primary); }

        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .card { background: var(--card-bg); padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .card h3 { font-size: 0.8rem; margin: 0; color: #64748b; font-weight: 800; }
        .card .value { font-size: 1.1rem; font-weight: 900; margin-top: 3px; }
        
        .form-section { background: #f1f5f9; padding: 15px; border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; }
        .btn-save { grid-column: span 3; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        .search-area { background: #fff; padding: 10px; border-radius: 10px; border: 2px solid var(--primary); margin-bottom: 10px; display: flex; gap: 8px; }
        .search-area input { flex: 1; background: #f0f7ff; border: 1px solid var(--primary); }

        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; font-weight: 900; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: center; font-weight: 700; }
        .td-in { color: var(--success); font-weight: 900; background: #f0fdf4; }
        .td-out { color: var(--danger); font-weight: 900; background: #fef2f2; }
        .badge { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-weight: 800; }

        .btn-action { border: none; background: #f1f5f9; cursor: pointer; padding: 5px 10px; border-radius: 5px; font-weight: 800; font-family: 'Cairo'; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s; }
        .btn-edit { color: var(--primary); border: 1px solid var(--primary); }
        .btn-del { color: var(--danger); }
        
        #sync-status { font-size: 12px; text-align: center; margin-bottom: 5px; color: var(--success); font-weight: bold; }

        .sync-box-yom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; border-top: 2px solid #eee; padding-top: 15px; }
        .btn-cloud-yom { border: none; color: #fff; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; background: var(--cloud-blue); transition: 0.3s; }
        .btn-cloud-yom:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>حسابات الورشة 2026</h1></header>
    <div id="sync-status">💾 حفظ فوري بالجدول محلياً مع دعم المزامنة السحابية</div>

    <div class="workshop-config">
        <span>🏠 اسم الورشة:</span>
        <input type="text" id="workshop-name" placeholder="اكتب اسم ورشتك هنا...">
    </div>

    <div class="dashboard">
        <div class="card"><h3>اليوم</h3><div class="value" id="day-total" style="color:var(--success)">0</div></div>
        <div class="card"><h3>الشهر</h3><div class="value" id="month-total" style="color:var(--primary)">0</div></div>
        <div class="card"><h3>إجمالي الخارج</h3><div class="value" id="year-out" style="color:var(--danger)">0</div></div>
        <div class="card"><h3>الرصيد الصافي</h3><div class="value" id="year-net">0</div></div>
    </div>

    <div class="form-section">
        <select id="entry-shop">
            <option value="زبون">👤 زبون</option>
            <option value="عمال">👷 عمال</option>
            <option value="الومنيوم">💎 الومنيوم</option>
            <option value="فيبر">🎨 فيبر</option>
            <option value="خشب">🪵 خشب</option>
            <option value="اكسسوارات">⚙️ اكسسوارات</option>
            <option value="رخام">🪨 رخام</option>
            <option value="سيارة">🚚 سيارة</option>
            <option value="حديد">🔩 حديد</option>
            <option value="غير ذلك">✨ غير ذلك</option>
        </select>
        <input type="text" id="entry-customer" placeholder="الاسم">
        <input type="datetime-local" id="entry-date">
        <input type="text" id="entry-desc" placeholder="البيان">
        <input type="number" id="entry-out" style="border-right: 4px solid var(--danger)" placeholder="مبلغ خارج (-)">
        <input type="number" id="entry-in" style="border-right: 4px solid var(--success)" placeholder="مبلغ داخل (+)">
        <input type="hidden" id="edit-id">
        <button class="btn-save" id="btn-main">حفظ العملية بالجدول</button>
    </div>

    <div class="search-area">
        <input type="text" id="searchBox" placeholder="🔍 بحث شامل في الجدول...">
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>التاريخ</th><th>القسم</th><th>الاسم</th><th>البيان</th><th>خارج</th><th>داخل</th><th>إجراء</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <div class="sync-box-yom">
        <button onclick="saveToCloud()" class="btn-cloud-yom">☁️ تصدير (حفظ الجدول للسحابة)</button>
        <button onclick="loadFromCloud()" class="btn-cloud-yom">🔄 استيراد (تحميل الحسابات من السحابة)</button>
    </div>
</div>

<script>
    // إعدادات اتصال الفايربيس الخاص بك
    const firebaseConfig = { 
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFlHpOc1M", 
        authDomain: "farah-kitchen.firebaseapp.com", 
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com", 
        projectId: "farah-kitchen", 
        appId: "1:702572851072:web:320a92c9430abba6b71b65" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const currentYear = 2026;

    let localData = {};

    // تحميل البيانات المحلية المخزنة بالمتصفح عند بدء التشغيل
    function initApp() {
        const savedData = localStorage.getItem('azemaa_yomya_data');
        localData = savedData ? JSON.parse(savedData) : {};
        
        // إدارة اسم الورشة
        const wsInput = document.getElementById('workshop-name');
        wsInput.value = localStorage.getItem('workshop_name') || "فرح للمطابخ";
        wsInput.oninput = () => localStorage.setItem('workshop_name', wsInput.value);

        setActualTime();
        renderTable();
    }

    // ضبط حقل الوقت تلقائياً
    function setActualTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('entry-date').value = now.toISOString().slice(0, 16);
    }

    // [تصدير سحابي] - يرفع كافة بيانات الجدول الحالية للسحابة فوراً
    window.saveToCloud = function() {
        if(Object.keys(localData).length === 0) {
            alert("⚠️ الجدول فارغ تماماً، لا توجد بيانات لرفعها!");
            return;
        }
        document.getElementById('sync-status').innerText = "⏳ جاري رفع الحسابات للسحابة...";
        db.ref('azemaa_v5/yomya_backup').set(localData)
        .then(() => {
            document.getElementById('sync-status').innerText = "🟢 تم تصدير الجدول وحفظه بالسحابة بنجاح";
            alert("✅ تم رفع وحفظ نسخة الجدول بالكامل على السحابة بنجاح!");
        })
        .catch(err => {
            document.getElementById('sync-status').innerText = "❌ فشل التصدير السحابي";
            alert("خطأ في الاتصال: " + err.message);
        });
    };

    // [استيراد سحابي] - يجلب كامل الحسابات المخزنة بالسحابة ويضعها بالجدول
    window.loadFromCloud = function() {
        document.getElementById('sync-status').innerText = "⏳ جاري استيراد البيانات من السحابة...";
        db.ref('azemaa_v5/yomya_backup').once('value').then((s) => {
            if (s.exists()) { 
                if(confirm("⚠️ هل تريد استيراد الحسابات السحابية؟ هذا الإجراء سيقوم بتحديث جدولك بالكامل بالبيانات المسترجعة.")) {
                    localData = s.val() || {};
                    saveToLocalStorage();
                    renderTable();
                    document.getElementById('sync-status').innerText = "🟢 تم استيراد الحسابات من السحابة بنجاح";
                    alert("✅ تم استرجاع وبناء الجدول من السحابة بنجاح!");
                }
            } else {
                document.getElementById('sync-status').innerText = "⚠️ لا توجد حسابات محفوظة مسبقاً على السحابة";
                alert("لا توجد بيانات محفوظة على السحابة لهذا الحساب!");
            }
        }).catch(err => {
            document.getElementById('sync-status').innerText = "❌ فشل الاستيراد";
            alert("خطأ أثناء الجلب السحابي: " + err.message);
        });
    };

    // دالة معالجة الإدخال والحفظ الفوري بالجدول
    function processEntry() {
        const shop = document.getElementById('entry-shop').value;
        const customer = document.getElementById('entry-customer').value.trim() || "-";
        const date = document.getElementById('entry-date').value || new Date().toISOString().slice(0, 16);
        const desc = document.getElementById('entry-desc').value.trim() || "-";
        const inVal = parseFloat(document.getElementById('entry-in').value) || 0;
        const outVal = parseFloat(document.getElementById('entry-out').value) || 0;
        const editId = document.getElementById('edit-id').value;

        if (inVal === 0 && outVal === 0) { 
            alert("يرجى كتابة مبلغ (داخل أو خارج) أولاً ليتم الحفظ بالجدول"); 
            return; 
        }

        const entryData = { shop, customer, date, desc, inVal, outVal };

        if (editId) {
            entryData.id = editId;
            localData[editId] = entryData;
        } else {
            const uniqueId = 'id_' + Date.now();
            entryData.id = uniqueId;
            localData[uniqueId] = entryData;
        }

        saveToLocalStorage();
        resetForm();
        renderTable();
    }

    document.getElementById('btn-main').onclick = processEntry;

    function saveToLocalStorage() {
        localStorage.setItem('azemaa_yomya_data', JSON.stringify(localData));
    }

    function resetForm() {
        document.getElementById('entry-customer').value = ""; 
        document.getElementById('entry-desc').value = ""; 
        document.getElementById('entry-in').value = ""; 
        document.getElementById('entry-out').value = ""; 
        document.getElementById('edit-id').value = ""; 
        document.getElementById('btn-main').innerText = "حفظ العملية بالجدول"; 
        setActualTime();
    }

    // معالجة وعرض الجدول والبطاقات العلوية بشكل فوري
    function renderTable() {
        const tableBody = document.getElementById('table-body');
        const searchVal = document.getElementById('searchBox').value.toLowerCase();
        tableBody.innerHTML = "";
        
        let totals = { day: 0, month: 0, yearOut: 0, yearNet: 0 };
        const now = new Date();

        // ترتيب الحسابات من الأحدث للأقدم
        const sortedKeys = Object.keys(localData).sort((a, b) => {
            const dateA = localData[a].date ? new Date(localData[a].date) : new Date(0);
            const dateB = localData[b].date ? new Date(localData[b].date) : new Date(0);
            return dateB - dateA;
        });

        sortedKeys.forEach(key => {
            const item = localData[key];
            if (!item) return;

            const itemDateStr = item.date || "";
            const itemShop = item.shop || "-";
            const itemCustomer = item.customer || "-";
            const itemDesc = item.desc || "-";
            const itemIn = parseFloat(item.inVal) || 0;
            const itemOut = parseFloat(item.outVal) || 0;
            const itemNet = itemIn - itemOut;
            
            // حساب الإحصائيات
            if (itemDateStr) {
                const rowDate = new Date(itemDateStr);
                if (!isNaN(rowDate.getTime())) {
                    if (rowDate.toDateString() === now.toDateString()) totals.day += itemNet;
                    if (rowDate.getMonth() === now.getMonth() && rowDate.getFullYear() === now.getFullYear()) totals.month += itemNet;
                    if (rowDate.getFullYear() === currentYear) { 
                        totals.yearOut += itemOut; 
                        totals.yearNet += itemNet; 
                    }
                }
            }

            // الفلترة والبحث الفوري في الجدول
            const searchPool = `${itemCustomer} ${itemDesc} ${itemShop}`.toLowerCase();
            if (searchPool.includes(searchVal)) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-size:11px;">${itemDateStr.replace('T', ' ')}</td>
                    <td><span class="badge">${itemShop}</span></td>
                    <td>${itemCustomer}</td>
                    <td>${itemDesc}</td>
                    <td class="td-out">${itemOut || '-'}</td>
                    <td class="td-in">${itemIn || '-'}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="startEdit('${key}')">📝 تعديل</button>
                        <button class="btn-action btn-del" onclick="deleteItem('${key}')">🗑️ حذف</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            }
        });

        // طباعة الإجماليات بالمربعات
        document.getElementById('day-total').innerText = Math.round(totals.day).toLocaleString();
        document.getElementById('month-total').innerText = Math.round(totals.month).toLocaleString();
        document.getElementById('year-out').innerText = Math.round(totals.yearOut).toLocaleString();
        document.getElementById('year-net').innerText = Math.round(totals.yearNet).toLocaleString();
    }

    document.getElementById('searchBox').onkeyup = renderTable;

    window.startEdit = function(id) {
        const item = localData[id];
        if(!item) return;
        document.getElementById('entry-shop').value = item.shop || "زبون";
        document.getElementById('entry-customer').value = item.customer === '-' ? '' : (item.customer || '');
        document.getElementById('entry-date').value = item.date || new Date().toISOString().slice(0, 16);
        document.getElementById('entry-desc').value = item.desc === '-' ? '' : (item.desc || '');
        document.getElementById('entry-in').value = item.inVal || "";
        document.getElementById('entry-out').value = item.outVal || "";
        document.getElementById('edit-id').value = id;
        document.getElementById('btn-main').innerText = "تعديل العملية بالجدول";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.deleteItem = function(id) {
        if(confirm("هل تريد بالتأكيد حذف هذه العملية من الجدول؟")) {
            delete localData[id];
            saveToLocalStorage();
            renderTable();
        }
    }

    // تشغيل التطبيق فور تحميل الصفحة
    window.onload = initApp;
</script>
</body>
</html>
