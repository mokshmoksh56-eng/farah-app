<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">يومية الورشة 2026 - تحديث فوري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1e40af; --success: #059669; --danger: #dc2626;
            --whatsapp: #25d366; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 10px; line-height: 1.4; font-weight: 700; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 15px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        header { text-align: center; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 10px; border-radius: 12px; margin-bottom: 15px; }
        header h1 { margin: 0; font-size: 1.3rem; font-weight: 900; }
        
        .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .card { background: var(--card-bg); padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0; text-align: center; }
        .card h3 { font-size: 0.8rem; margin: 0; color: #64748b; font-weight: 800; }
        .card .value { font-size: 1.1rem; font-weight: 900; margin-top: 3px; }
        
        .form-section { background: #f1f5f9; padding: 15px; border-radius: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        input, select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Cairo'; font-size: 14px; font-weight: 700; }
        .btn-save { grid-column: span 3; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        
        .search-area { background: #fff; padding: 10px; border-radius: 10px; border: 2px solid var(--primary); margin-bottom: 10px; display: flex; gap: 8px; }
        .search-area input { flex: 1; background: #f0f7ff; border: 1px solid var(--primary); }

        .table-wrapper { overflow-x: auto; border-radius: 8px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid #e2e8f0; font-weight: 900; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; text-align: center; font-weight: 700; }
        .td-in { color: var(--success); font-weight: 900; background: #f0fdf4; }
        .td-out { color: var(--danger); font-weight: 900; background: #fef2f2; }
        .badge { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-weight: 800; }

        .btn-action { border: none; background: #f1f5f9; cursor: pointer; padding: 5px 10px; border-radius: 5px; font-weight: 800; font-family: 'Cairo'; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; transition: 0.2s; }
        .btn-edit { color: var(--primary); border: 1px solid var(--primary); }
        .btn-del { color: var(--danger); }
        
        #sync-status { font-size: 12px; text-align: center; margin-bottom: 5px; color: var(--success); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>حسابات الورشة 2026</h1></header>
    <div id="sync-status">🟢 النظام جاهز ويعمل بنظام التحديث الفوري المزدوج</div>

    <div class="dashboard">
        <div class="card"><h3>اليوم</h3><div class="value" id="day-total" style="color:var(--success)">0</div></div>
        <div class="card"><h3>الشهر</h3><div class="value" id="month-total" style="color:var(--primary)">0</div></div>
        <div class="card"><h3>إجمالي الخارج</h3><div class="value" id="year-out" style="color:var(--danger)">0</div></div>
        <div class="card"><h3>الرصيد الصافي</h3><div class="value" id="year-net">0</div></div>
    </div>

    <div class="form-section">
        <select id="entry-shop">
            <option value="زبون">👤 زبون</option>
            <option value="عمال">👷 عمال</option>
            <option value="الومنيوم">💎 الومنيوم</option>
            <option value="فيبر">🎨 فيبر</option>
            <option value="خشب">🪵 خشب</option>
            <option value="اكسسوارات">⚙️ اكسسوارات</option>
            <option value="رخام">🪨 رخام</option>
            <option value="سيارة">🚚 سيارة</option>
            <option value="حديد">🔩 حديد</option>
            <option value="غير ذلك">✨ غير ذلك</option>
        </select>
        <input type="text" id="entry-customer" placeholder="الاسم">
        <input type="datetime-local" id="entry-date">
        <input type="text" id="entry-desc" placeholder="البيان">
        <input type="number" id="entry-out" style="border-right: 4px solid var(--danger)" placeholder="مبلغ خارج (-)">
        <input type="number" id="entry-in" style="border-right: 4px solid var(--success)" placeholder="مبلغ داخل (+)">
        <input type="hidden" id="edit-id">
        <button class="btn-save" id="btn-main" onclick="processEntry()">حفظ العملية بالسحابة</button>
    </div>

    <div class="search-area">
        <input type="text" id="searchBox" placeholder="🔍 بحث شامل في الجدول..." onkeyup="renderTable()">
    </div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>التاريخ</th><th>القسم</th><th>الاسم</th><th>البيان</th><th>خارج</th><th>داخل</th><th>إجراء</th></tr></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFlHpOc1M", 
        authDomain: "farah-kitchen.firebaseapp.com", 
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com", 
        projectId: "farah-kitchen", 
        appId: "1:702572851072:web:320a92c9430abba6b71b65" 
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('azemaa_v5/yomya_2026_clean'); 
    const currentYear = 2026;

    let localData = {};

    function initApp() {
        // الاستماع للتحديثات القادمة من السحابة
        dbRef.on('value', (snapshot) => {
            const cloudData = snapshot.val() || {};
            // دمج البيانات السحابية مع البيانات المحلية لضمان عدم اختفاء أي سطر
            localData = Object.assign({}, localData, cloudData);
            renderTable();
            document.getElementById('sync-status').innerText = "🟢 متصل بالسحابة (محدث تلقائياً)";
        });

        if(!document.getElementById('entry-date').value) setActualTime();
    }

    function setActualTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('entry-date').value = now.toISOString().slice(0, 16);
    }

    function processEntry() {
        const shop = document.getElementById('entry-shop').value;
        const customer = document.getElementById('entry-customer').value.trim() || "-";
        const date = document.getElementById('entry-date').value || new Date().toISOString().slice(0, 16);
        const desc = document.getElementById('entry-desc').value.trim() || "-";
        const inVal = parseFloat(document.getElementById('entry-in').value) || 0;
        const outVal = parseFloat(document.getElementById('entry-out').value) || 0;
        const editId = document.getElementById('edit-id').value;

        if (inVal === 0 && outVal === 0) { alert("يرجى كتابة مبلغ أولاً"); return; }

        const uniqueId = editId || 'id_' + Date.now();
        const entryData = { id: uniqueId, shop, customer, date, desc, inVal, outVal };

        // [تحديث فوري محلي]: إدراج البيانات في الجدول فوراً دون انتظار استجابة السيرفر
        localData[uniqueId] = entryData;
        renderTable(); 

        // إرسال البيانات للسحابة في الخلفية لضمان حفظها ومزامنتها مع باقي الأجهزة
        dbRef.child(uniqueId).set(entryData).then(() => {
            resetForm();
        }).catch(err => {
            console.log("تم الحفظ محلياً وجاري إعادة المحاولة للسحابة: " + err.message);
            resetForm();
        });
    }

    function renderTable() {
        const tableBody = document.getElementById('table-body');
        if(!tableBody) return;
        
        const searchVal = document.getElementById('searchBox').value.toLowerCase();
        tableBody.innerHTML = "";
        
        let totals = { day: 0, month: 0, yearOut: 0, yearNet: 0 };
        const now = new Date();

        const validItems = Object.values(localData).filter(item => item && item.date);
        const sorted = validItems.sort((a, b) => new Date(b.date) - new Date(a.date));

        sorted.forEach(item => {
            const rowDate = new Date(item.date);
            const itemNet = (item.inVal || 0) - (item.outVal || 0);
            
            if (rowDate.toDateString() === now.toDateString()) totals.day += itemNet;
            if (rowDate.getMonth() === now.getMonth() && rowDate.getFullYear() === now.getFullYear()) totals.month += itemNet;
            if (rowDate.getFullYear() === currentYear) { 
                totals.yearOut += (item.outVal || 0); 
                totals.yearNet += itemNet; 
            }

            const customerStr = (item.customer || "-").toString().toLowerCase();
            const descStr = (item.desc || "-").toString().toLowerCase();
            const shopStr = (item.shop || "-").toString().toLowerCase();
            const searchPool = `${customerStr} ${descStr} ${shopStr}`;

            if (searchPool.includes(searchVal)) {
                const tr = document.createElement('tr');
                const cleanDate = typeof item.date === 'string' ? item.date.replace('T', ' ') : item.date;
                
                tr.innerHTML = `
                    <td style="font-size:11px;">${cleanDate}</td>
                    <td><span class="badge">${item.shop || '-'}</span></td>
                    <td>${item.customer || '-'}</td>
                    <td>${item.desc || '-'}</td>
                    <td class="td-out">${item.outVal || '-'}</td>
                    <td class="td-in">${item.inVal || '-'}</td>
                    <td>
                        <button class="btn-action btn-edit" onclick="startEdit('${item.id}')">📝 تعديل</button>
                        <button class="btn-action btn-del" onclick="deleteItem('${item.id}')">🗑️ حذف</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            }
        });

        document.getElementById('day-total').innerText = Math.round(totals.day).toLocaleString();
        document.getElementById('month-total').innerText = Math.round(totals.month).toLocaleString();
        document.getElementById('year-out').innerText = Math.round(totals.yearOut).toLocaleString();
        document.getElementById('year-net').innerText = Math.round(totals.yearNet).toLocaleString();
    }

    window.startEdit = function(id) {
        const item = localData[id];
        if(!item) return;
        document.getElementById('entry-shop').value = item.shop;
        document.getElementById('entry-customer').value = item.customer === '-' ? '' : item.customer;
        document.getElementById('entry-date').value = item.date;
        document.getElementById('entry-desc').value = item.desc === '-' ? '' : item.desc;
        document.getElementById('entry-in').value = item.inVal || "";
        document.getElementById('entry-out').value = item.outVal || "";
        document.getElementById('edit-id').value = id;
        document.getElementById('btn-main').innerText = "تعديل العملية بالسحابة";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.deleteItem = function(id) {
        if(confirm("هل تريد حذف هذه العملية نهائياً؟")) {
            delete localData[id];
            renderTable();
            dbRef.child(id).remove();
        }
    }

    function resetForm() {
        document.getElementById('entry-customer').value = ""; 
        document.getElementById('entry-desc').value = ""; 
        document.getElementById('entry-in').value = ""; 
        document.getElementById('entry-out').value = ""; 
        document.getElementById('edit-id').value = ""; 
        document.getElementById('btn-main').innerText = "حفظ العملية بالسحابة"; 
        setActualTime();
    }

    window.onload = initApp;
</script>
</body>
</html>
