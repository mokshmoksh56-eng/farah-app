<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">يومية الورشة 2026 - تحديث فوري (سريع)</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #1e40af; --success: #059669; --danger: #dc2626;
            --whatsapp: #25d366; --bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b;
        }
        * { box-sizing: border-box; }
        /* استخدام خطوط النظام لسرعة العرض */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 8px; line-height: 1.3; font-weight: 700; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        header { text-align: center; background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; padding: 10px; border-radius: 10px; margin-bottom: 12px; }
        header h1 { margin: 0; font-size: 1.2rem; font-weight: 900; }
        
        .dashboard { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 12px; }
        @media (min-width: 768px) { .dashboard { grid-template-columns: repeat(4, 1fr); } }
        .card { background: var(--card-bg); padding: 8px 4px; border-radius: 8px; border: 1px solid #e2e8f0; text-align: center; }
        .card h3 { font-size: 0.8rem; margin: 0; color: #64748b; font-weight: 800; }
        .card .value { font-size: 1.1rem; font-weight: 900; margin-top: 2px; }
        
        .form-section { background: #f1f5f9; padding: 10px; border-radius: 10px; display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 12px; }
        @media (min-width: 480px) { .form-section { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { .form-section { grid-template-columns: repeat(3, 1fr); } }
        
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-family: inherit; font-size: 14px; font-weight: 700; outline: none; background-color: #fff; }
        
        #entry-out { border: 2px solid var(--danger); background-color: #fef2f2; color: var(--danger); font-weight: 900; }
        #entry-out::placeholder { color: #f87171; font-weight: normal; }
        #entry-in { border: 2px solid var(--success); background-color: #f0fdf4; color: var(--success); font-weight: 900; }
        #entry-in::placeholder { color: #4ade80; font-weight: normal; }

        .btn-save { grid-column: 1 / -1; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 800; font-size: 15px; cursor: pointer; }
        
        .search-area { background: #fff; padding: 6px; border-radius: 8px; border: 2px solid var(--primary); margin-bottom: 10px; display: flex; }
        .search-area input { flex: 1; background: #f0f7ff; border: 1px solid var(--primary); padding: 8px; }

        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 6px; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; white-space: nowrap; }
        th { background: #f8fafc; padding: 8px 4px; border-bottom: 2px solid #e2e8f0; font-weight: 900; text-align: center; font-size: 11px; }
        td { padding: 6px 4px; border-bottom: 1px solid #f1f5f9; text-align: center; font-weight: 700; }
        
        .td-out { color: white !important; font-weight: 900; background: var(--danger) !important; border-radius: 4px; }
        .td-in { color: white !important; font-weight: 900; background: var(--success) !important; border-radius: 4px; }
        
        .th-out { color: var(--danger); background: #fef2f2; }
        .th-in { color: var(--success); background: #f0fdf4; }
        
        .badge { background: #e2e8f0; padding: 2px 4px; border-radius: 4px; font-weight: 800; font-size: 10px; }
        
        .btn-action { border: none; background: transparent; cursor: pointer; padding: 4px 5px; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-edit { color: var(--primary); }
        .btn-del { color: var(--danger); }
        .btn-wa { color: var(--whatsapp); font-size: 14px; }
        
        #sync-status { font-size: 12px; text-align: center; margin-bottom: 6px; color: #b45309; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>حسابات الورشة 2026</h1></header>
    <div id="sync-status">⏳ جاري فحص الاتصال بالخادم...</div>

    <div class="dashboard">
        <div class="card"><h3>اليوم</h3><div class="value" id="day-total" style="color:var(--success)">0</div></div>
        <div class="card"><h3>الشهر</h3><div class="value" id="month-total" style="color:var(--primary)">0</div></div>
        <div class="card"><h3>إجمالي الخارج</h3><div class="value" id="year-out" style="color:var(--danger)">0</div></div>
        <div class="card"><h3>الرصيد الصافي</h3><div class="value" id="year-net">0</div></div>
    </div>

    <div class="form-section">
        <select id="entry-shop">
            <option value="زبون">👤 زبون</option>
            <option value="عمال">👷 عمال</option>
            <option value="الومنيوم">💎 الومنيوم</option>
            <option value="فيبر">🎨 فيبر</option>
            <option value="خشب">🪵 خشب</option>
            <option value="اكسسوارات">⚙️ اكسسوارات</option>
            <option value="رخام">🪨 رخام</option>
            <option value="سيارة">🚚 سيارة</option>
            <option value="حديد">🔩 حديد</option>
            <option value="غير ذلك">✨ غير ذلك</option>
        </select>
        <input type="text" id="entry-customer" placeholder="الاسم">
        <input type="datetime-local" id="entry-date">
        <input type="text" id="entry-desc" placeholder="البيان">
        <input type="number" id="entry-out" placeholder="مبلغ خارج (-)">
        <input type="number" id="entry-in" placeholder="مبلغ داخل (+)">
        <input type="hidden" id="edit-id">
        <button class="btn-save" id="btn-main">حفظ العملية بالسحابة</button>
    </div>

    <div class="search-area" id="yom-section">
        <input type="text" id="searchBox" placeholder="🔍 بحث شامل في الجدول...">
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>التاريخ</th>
                    <th>القسم</th>
                    <th>الاسم</th>
                    <th>البيان</th>
                    <th class="th-out">خارج</th>
                    <th class="th-in">داخل</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const dbRef = db.ref('azemaa_v5/yomya_2026_clean');
    const currentYear = 2026;

    let localData = {};

    function initApp() {
        dbRef.on('value', (snapshot) => {
            const cloudData = snapshot.val() || {};
            localData = Object.assign({}, localData, cloudData);
            renderTable();
            document.getElementById('sync-status').innerText = "🟢 متصل بالسحابة بشكل آمن ومستقر";
            document.getElementById('sync-status').style.color = "var(--success)";
            
            restoreScrollPosition();
        }, (error) => {
            console.error(error);
            document.getElementById('sync-status').innerText = "🔴 خطأ في الصلاحيات! يرجى مراجعة تفعيل الـ Rules في الفايربيز";
            document.getElementById('sync-status').style.color = "var(--danger)";
        });

        if(!document.getElementById('entry-date').value) setActualTime();
        
        window.addEventListener('scroll', () => {
            localStorage.setItem('yomScrollPosition', window.scrollY);
        });
    }

    function setActualTime() {
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('entry-date').value = now.toISOString().slice(0, 16);
    }

    function restoreScrollPosition() {
        const savedPosition = localStorage.getItem('yomScrollPosition');
        if (savedPosition) {
            window.scrollTo({ top: parseInt(savedPosition), behavior: 'smooth' });
        }
    }

    function processEntry() {
        const shop = document.getElementById('entry-shop').value;
        const customer = document.getElementById('entry-customer').value.trim() || "-";
        const date = document.getElementById('entry-date').value || new Date().toISOString().slice(0, 16);
        const desc = document.getElementById('entry-desc').value.trim() || "-";
        const inVal = parseFloat(document.getElementById('entry-in').value) || 0;
        const outVal = parseFloat(document.getElementById('entry-out').value) || 0;
        const editId = document.getElementById('edit-id').value;

        if (inVal === 0 && outVal === 0) { alert("يرجى كتابة مبلغ أولاً"); return; }

        const uniqueId = editId || 'id_' + Date.now();
        const entryData = { id: uniqueId, shop, customer, date, desc, inVal, outVal };

        // تحديث محلي فوري
        localData[uniqueId] = entryData;
        renderTable(); 

        // الإرسال للسحابة
        dbRef.child(uniqueId).set(entryData).then(() => {
            resetForm();
        }).catch(err => {
            alert("فشل الحفظ في السحابة: " + err.message);
        });
    }

    function renderTable() {
        const tableBody = document.getElementById('table-body');
        if(!tableBody) return;
        
        const searchVal = document.getElementById('searchBox').value.toLowerCase();
        tableBody.innerHTML = "";
        
        let totals = { day: 0, month: 0, yearOut: 0, yearNet: 0 };
        const now = new Date();

        const validItems = Object.values(localData).filter(item => item && item.date);
        const sorted = validItems.sort((a, b) => new Date(b.date) - new Date(a.date));

        sorted.forEach(item => {
            const rowDate = new Date(item.date);
            const itemNet = (item.inVal || 0) - (item.outVal || 0);
            
            if (rowDate.toDateString() === now.toDateString()) totals.day += itemNet;
            if (rowDate.getMonth() === now.getMonth() && rowDate.getFullYear() === now.getFullYear()) totals.month += itemNet;
            if (rowDate.getFullYear() === currentYear) { 
                totals.yearOut += (item.outVal || 0); 
                totals.yearNet += itemNet; 
            }

            const customerStr = (item.customer || "-").toString().toLowerCase();
            const descStr = (item.desc || "-").toString().toLowerCase();
            const shopStr = (item.shop || "-").toString().toLowerCase();
            const searchPool = `${customerStr} ${descStr} ${shopStr}`;

            if (searchPool.includes(searchVal)) {
                const tr = document.createElement('tr');
                
                let cleanDate = "-";
                if(typeof item.date === 'string'){
                    const dParts = item.date.split('T');
                    if(dParts.length === 2) {
                        const dateNum = dParts[0].substring(5); 
                        cleanDate = `${dateNum} ${dParts[1]}`; 
                    } else {
                        cleanDate = item.date;
                    }
                }

                const displayOut = item.outVal && item.outVal !== 0 ? item.outVal : '-';
                const displayIn = item.inVal && item.inVal !== 0 ? item.inVal : '-';

                tr.innerHTML = `
                    <td style="font-size:10px; color:#64748b;">${cleanDate}</td>
                    <td><span class="badge">${item.shop || '-'}</span></td>
                    <td style="max-width: 80px; overflow: hidden; text-overflow: ellipsis;">${item.customer || '-'}</td>
                    <td style="max-width: 90px; overflow: hidden; text-overflow: ellipsis;">${item.desc || '-'}</td>
                    <td class="${item.outVal ? 'td-out' : ''}">${displayOut}</td>
                    <td class="${item.inVal ? 'td-in' : ''}">${displayIn}</td>
                    <td>
                        <button class="btn-action btn-wa" data-id="${item.id}" title="مشاركة واتساب">🟢</button>
                        <button class="btn-action btn-edit" data-id="${item.id}" title="تعديل">📝</button>
                        <button class="btn-action btn-del" data-id="${item.id}" title="حذف">🗑️</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            }
        });

        document.getElementById('day-total').innerText = Math.round(totals.day).toLocaleString();
        document.getElementById('month-total').innerText = Math.round(totals.month).toLocaleString();
        document.getElementById('year-out').innerText = Math.round(totals.yearOut).toLocaleString();
        document.getElementById('year-net').innerText = Math.round(totals.yearNet).toLocaleString();

        document.querySelectorAll('.btn-edit').forEach(btn => {
            btn.onclick = () => startEdit(btn.getAttribute('data-id'));
        });
        document.querySelectorAll('.btn-del').forEach(btn => {
            btn.onclick = () => deleteItem(btn.getAttribute('data-id'));
        });
        document.querySelectorAll('.btn-wa').forEach(btn => {
            btn.onclick = () => sendWhatsApp(btn.getAttribute('data-id'));
        });
    }

    function sendWhatsApp(id) {
        const item = localData[id];
        if(!item) return;

        let statusStr = "";
        let directionStr = "";

        if (item.inVal > 0) {
            statusStr = `💰✨ *تـم دخـول مـبـلـغ:* *[ ${item.inVal} ]*`;
            directionStr = `📥 *مـن:* *${item.customer || '-'}*`;
        } else {
            statusStr = `💸💥 *تـم خـروج مـبـلـغ:* *[ ${item.outVal} ]*`;
            directionStr = `📤 *إلـى:* *${item.customer || '-'}*`;
        }

        const cleanDate = typeof item.date === 'string' ? item.date.replace('T', ' ') : item.date;

        const message = `=========================\n` +
                        `${statusStr}\n` +
                        `=========================\n` +
                        `${directionStr}\n` +
                        `⚙️ *الـقـسـم:* *${item.shop || '-'}*\n` +
                        `📝 *الـبـيـان:* *${item.desc || '-'}*\n` +
                        `📅 *التوقيت:* *${cleanDate}*\n` +
                        `=========================`;

        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function startEdit(id) {
        const item = localData[id];
        if(!item) return;
        document.getElementById('entry-shop').value = item.shop;
        document.getElementById('entry-customer').value = item.customer === '-' ? '' : item.customer;
        document.getElementById('entry-date').value = item.date;
        document.getElementById('entry-desc').value = item.desc === '-' ? '' : item.desc;
        document.getElementById('entry-in').value = item.inVal || "";
        document.getElementById('entry-out').value = item.outVal || "";
        document.getElementById('edit-id').value = id;
        document.getElementById('btn-main').innerText = "تعديل العملية بالسحابة";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(id) {
        if(confirm("هل تريد حذف هذه العملية نهائياً؟")) {
            delete localData[id];
            renderTable();
            dbRef.child(id).remove().catch(err => alert("فشل الحذف من السحابة: " + err.message));
        }
    }

    function resetForm() {
        document.getElementById('entry-customer').value = ""; 
        document.getElementById('entry-desc').value = ""; 
        document.getElementById('entry-in').value = ""; 
        document.getElementById('entry-out').value = ""; 
        document.getElementById('edit-id').value = ""; 
        document.getElementById('btn-main').innerText = "حفظ العملية بالسحابة"; 
        setActualTime();
    }

    document.getElementById('btn-main').onclick = processEntry;
    document.getElementById('searchBox').onkeyup = renderTable;

    window.onload = initApp;
</script>
</body>
</html>
