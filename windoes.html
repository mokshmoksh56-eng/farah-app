<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa proo v10 - تخصيمات شبابيك الألوميتال السحابية</title>
    <style>
        /* --- إعدادات عامة --- */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5; text-align: center;
            padding: 20px; margin: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start; min-height: 100vh;
        }
        h2 { color: #333; margin-bottom: 5px; }
        .hint {
            color: #444; font-size: 15px; margin-bottom: 30px;
            background-color: #e9ecef; padding: 10px 20px;
            border-radius: 8px; border: 1px solid #ccc;
        }

        /* --- شاشة التحميل السحابي --- */
        #auth-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f0f2f5;
            z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 18px; color: #2c3e50; font-weight: bold; text-align: center; padding: 20px;
        }

        /* --- حاوية التصميم الكلية --- */
        .visualizer-wrapper {
            position: relative; display: inline-block;
            margin: 20px 60px 60px 60px; direction: ltr;
        }

        /* --- حقول إدخال المقاسات --- */
        .dimension-box {
            position: absolute; display: flex; align-items: center;
            justify-content: center; gap: 5px; font-size: 22px;
            font-weight: bold; color: #333; direction: rtl;
        }
        .dimension-box input {
            width: 70px; font-size: 24px; font-weight: bold;
            text-align: center; color: #0056b3; background: transparent;
            border: none; border-bottom: 2px dashed #0056b3; outline: none;
            transition: all 0.3s; padding: 2px; font-family: Arial, sans-serif; 
        }
        .dimension-box input:focus {
            border-bottom-color: #d84315; color: #d84315;
            background-color: rgba(255, 255, 255, 0.5); border-radius: 4px;
        }
        .top-dimension { top: -50px; left: 50%; transform: translateX(-50%); }
        .side-dimension { right: -130px; top: 50%; transform: translateY(-50%); }

        /* --- تصميم الإطار الأساسي --- */
        .window-frame {
            background-color: #cfd8dc; 
            border: 15px solid #f5f5f5; border-top-color: #ffffff; border-left-color: #fafafa;
            border-bottom-color: #e0e0e0; border-right-color: #eeeeee;
            box-shadow: 0 15px 25px rgba(0,0,0,0.15), inset 0 4px 15px rgba(0,0,0,0.4); 
            position: relative; border-radius: 2px;
            transition: width 0.4s ease-in-out, height 0.4s ease-in-out;
            perspective: 1200px; 
            width: 600px; height: 360px;
            max-width: 100%;
        }

        .window-sash {
            position: absolute; top: 0; height: 100%;
            background-color: #fff; border: 12px solid #f8f9fa;
            border-top-color: #ffffff; border-left-color: #f0f0f0;
            border-bottom-color: #e8e8e8; border-right-color: #fdfdfd;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), width 0.4s, height 0.4s, left 0.4s, right 0.4s, top 0.4s, bottom 0.4s; 
            cursor: pointer; 
        }

        .window-glass {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.1) 40%, rgba(200,230,245,0.3) 40%, rgba(200,230,245,0.1) 100%);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15); border: 2px solid #dcdcdc; 
        }

        /* --- حالات الشباك --- */
        .frame-sliding .left-sash { width: 51%; left: 0; z-index: 2; box-shadow: 5px 0 15px rgba(0,0,0,0.25); height: 100%; top: 0; transform-origin: center; }
        .frame-sliding .right-sash { width: 51%; right: 0; left: auto; z-index: 1; display: block; box-shadow: -2px 0 10px rgba(0,0,0,0.1); height: 100%; top: 0; transform-origin: center; }
        .frame-sliding .left-sash.is-open { transform: translateX(94%); }
        .frame-sliding .right-sash.is-open { transform: translateX(-94%); }

        .frame-hinged .left-sash { width: 50%; left: 0; transform-origin: left center; z-index: 2; height: 100%; top: 0; }
        .frame-hinged .right-sash { width: 50%; right: 0; left: auto; transform-origin: right center; z-index: 2; display: block; height: 100%; top: 0; }
        .frame-hinged .left-sash.is-open { transform: rotateY(-75deg); }
        .frame-hinged .right-sash.is-open { transform: rotateY(75deg); }

        .frame-awning .left-sash { width: 100%; left: 0; transform-origin: bottom center; z-index: 2; height: 100%; top: 0; }
        .frame-awning .right-sash { display: none; }
        .frame-awning .left-sash.is-open { transform: rotateX(45deg); }

        .frame-awning-double .left-sash { width: 100%; height: 49.5%; left: 0; top: 0; transform-origin: bottom center; z-index: 2; }
        .frame-awning-double .right-sash { width: 100%; height: 49.5%; left: 0; top: auto; bottom: 0; transform-origin: bottom center; z-index: 2; display: block; }
        .frame-awning-double .left-sash.is-open { transform: rotateX(45deg); }
        .frame-awning-double .right-sash.is-open { transform: rotateX(45deg); }

        /* --- قسم التخصيمات والجدول --- */
        .calculations-section {
            width: 100%; max-width: 950px; background: #fff; padding: 20px;
            border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-top: 20px;
        }

        .customer-input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; font-family: inherit; }
        .cloud-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cloud { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; color: #fff; background: #27ae60; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-cloud:active { transform: scale(0.98); }
        .btn-update { background: #f39c12; display: none; }

        .controls {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee;
            flex-wrap: wrap; gap: 15px;
        }

        .controls .select-group { display: flex; flex-wrap: wrap; gap: 15px; align-items: center; width: 100%; }

        .controls select {
            flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc;
            border-radius: 5px; background-color: #f9f9f9; cursor: pointer;
            outline: none; font-family: 'Segoe UI', Tahoma, sans-serif;
            min-width: 150px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #0056b3; color: white; font-weight: bold; }
        
        td.number-cell { font-family: Arial, Helvetica, sans-serif; font-weight: bold; color: #d84315; direction: ltr; }
        .accessories-list { text-align: right; list-style-type: square; padding-right: 20px; margin: 0; color: #444; }
        .accessories-list li { margin-bottom: 5px; }

        /* --- قائمة المحفوظات السحابية --- */
        .saved-list-container { width: 100%; max-width: 950px; margin-top: 20px; text-align: right; }
        .saved-card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 10px; border-right: 5px solid #0056b3; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;}
        .saved-card-info { flex: 1; min-width: 200px; }
        .saved-card-info h4 { margin: 0 0 5px 0; color: #333; }
        .saved-card-info p { margin: 0; font-size: 14px; color: #666; font-weight: bold; }
        .saved-card-actions { display: flex; gap: 10px; }
        .btn-sm { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; }
        .btn-edit { background: #f39c12; }
        .btn-delete { background: #e74c3c; }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #27ae60; color: white; padding: 12px 25px; border-radius: 30px; display: none; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center; font-weight: bold; }
        #sync-status { font-size: 13px; background: rgba(0,0,0,0.1); padding: 5px 10px; border-radius: 20px; display: inline-block; color: #333; margin-bottom: 10px;}

        @media (max-width: 768px) {
            .visualizer-wrapper { margin: 40px 10px 40px 10px; transform: scale(0.8); }
            .dimension-box { font-size: 18px; }
            .dimension-box input { width: 50px; font-size: 18px; }
            .side-dimension { right: -80px; }
            table, thead, tbody, th, td, tr { display: block; }
            th { display: none; }
            td { text-align: right; position: relative; padding-right: 50%; border-bottom: 1px solid #eee; }
            td::before { content: attr(data-label); position: absolute; right: 10px; width: 45%; font-weight: bold; color: #0056b3; text-align: right; }
            td.number-cell { text-align: left; }
        }
    </style>
</head>

        function updateSystemDropdown() {
            const brand = brandType.value;
            const availableSystems = Object.keys(windowData[brand].systems);
            systemType.innerHTML = '';
            availableSystems.forEach(sys => {
                let opt = document.createElement('option');
                opt.value = sys;
                opt.textContent = systemLabels[sys];
                systemType.appendChild(opt);
            });
            updateProfileDropdown();
        }

        function updateProfileDropdown() {
            const brand = brandType.value;
            const sys = systemType.value;
            const profiles = windowData[brand].systems[sys];
            profileType.innerHTML = '';
            profiles.forEach(prof => {
                let opt = document.createElement('option');
                opt.value = prof.id;
                opt.textContent = prof.name;
                profileType.appendChild(opt);
            });
            windowFrame.className = 'window-frame';
            windowFrame.classList.add(`frame-${sys}`);
            leftSash.classList.remove('is-open');
            rightSash.classList.remove('is-open');
            updateCalculations();
        }

        function updateCalculations() {
            let w = parseFloat(inlineWidth.value) || 0;
            let h = parseFloat(inlineHeight.value) || 0;
            let brand = brandType.value;
            let sys = systemType.value;
            let selectedProfileId = profileType.value;

            // تحديث العرض في الموبايل
            let currentScale = window.innerWidth < 768 ? 1.5 : scaleFactor;
            windowFrame.style.width = Math.min((w * currentScale), window.innerWidth - 40) + 'px';
            windowFrame.style.height = (h * currentScale) + 'px';

            if(w === 0 || h === 0) return;
            let profileArr = windowData[brand].systems[sys];
            if(!profileArr) return;
            let activeProfile = profileArr.find(p => p.id === selectedProfileId);
            if(!activeProfile) return;

            let res = activeProfile.calc(w, h);

            let accHTML = '<ul class="accessories-list">';
            res.acc.forEach(item => { accHTML += `<li>${item}</li>`; });
            accHTML += '</ul>';

            let rowsHTML = `
                <tr>
                    <td data-label="البيان"><strong>مقاس الوحدة</strong></td>
                    <td data-label="العدد" class="number-cell">1</td>
                    <td data-label="العرض" class="number-cell">${w.toFixed(1)}</td>
                    <td data-label="الارتفاع" class="number-cell">${h.toFixed(1)}</td>
                    <td data-label="الإكسسوارات" rowspan="9" style="vertical-align: top;">${accHTML}</td>
                </tr>
                <tr>
                    <td data-label="البيان"><strong>مقاس الدرف</strong></td>
                    <td data-label="العدد" class="number-cell">${res.sashCount}</td>
                    <td data-label="العرض" class="number-cell">${res.sashW.toFixed(1)}</td>
                    <td data-label="الارتفاع" class="number-cell">${res.sashH.toFixed(1)}</td>
                </tr>
            `;
            if (res.screenW > 0 && res.screenH > 0) {
                rowsHTML += `<tr><td data-label="البيان"><strong>درف السلك</strong></td><td data-label="العدد" class="number-cell">1</td><td data-label="العرض" class="number-cell">${res.screenW.toFixed(1)}</td><td data-label="الارتفاع" class="number-cell">${res.screenH.toFixed(1)}</td></tr>`;
            }
            rowsHTML += `<tr><td data-label="البيان"><strong>زجاج الدرف</strong></td><td data-label="العدد" class="number-cell">${res.sashCount}</td><td data-label="العرض" class="number-cell">${res.glassW.toFixed(1)}</td><td data-label="الارتفاع" class="number-cell">${res.glassH.toFixed(1)}</td></tr>`;
            
            if (res.sakinaH > 0) rowsHTML += `<tr><td data-label="البيان"><strong>مقاس السكينة</strong></td><td data-label="العدد" class="number-cell">2</td><td data-label="العرض" class="number-cell">-</td><td data-label="الارتفاع" class="number-cell">${res.sakinaH.toFixed(1)}</td></tr>`;
            if (res.tStopper) rowsHTML += `<tr><td data-label="البيان"><strong>T الصداد</strong></td><td data-label="العدد" class="number-cell">1</td><td data-label="العرض" class="number-cell">-</td><td data-label="الارتفاع" class="number-cell">${res.tStopper.toFixed(1)}</td></tr>`;
            if (res.so2as1) rowsHTML += `<tr><td data-label="البيان"><strong>سؤاس 1</strong></td><td data-label="العدد" class="number-cell">1</td><td data-label="العرض" class="number-cell">${res.so2as1.toFixed(1)}</td><td data-label="الارتفاع" class="number-cell">-</td></tr>`;
            if (res.bead1_val) rowsHTML += `<tr><td data-label="البيان"><strong>مقاس باكتة 1</strong></td><td data-label="العدد" class="number-cell">4</td><td data-label="العرض" class="number-cell">${res.bead1_val.toFixed(1)}</td><td data-label="الارتفاع" class="number-cell">-</td></tr>`;
            if (res.bead2_val) rowsHTML += `<tr><td data-label="البيان"><strong>مقاس باكتة 2</strong></td><td data-label="العدد" class="number-cell">4</td><td data-label="العرض" class="number-cell">${res.bead2_val.toFixed(1)}</td><td data-label="الارتفاع" class="number-cell">-</td></tr>`;

            calcTableBody.innerHTML = rowsHTML;
        }

        brandType.addEventListener('change', updateSystemDropdown);
        systemType.addEventListener('change', updateProfileDropdown);
        profileType.addEventListener('change', updateCalculations);
        inlineWidth.addEventListener('input', updateCalculations);
        inlineHeight.addEventListener('input', updateCalculations);
        leftSash.addEventListener('click', function() { this.classList.toggle('is-open'); });
        rightSash.addEventListener('click', function() { this.classList.toggle('is-open'); });

        updateSystemDropdown();
    </script>

    <!-- أكواد Firebase السحابية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
            authDomain: "azemaa-proo.firebaseapp.com",
            databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
            projectId: "azemaa-proo",
            storageBucket: "azemaa-proo.firebasestorage.app",
            messagingSenderId: "787350492977",
            appId: "1:787350492977:web:84061dcf31622fcb07c210"
        };

        const app = initializeApp(firebaseConfig);
        const fdb = getDatabase(app);
        const auth = getAuth(app);
        
        let windowsData = {};
        let editKey = null;
        let windowUserUid = null;
        let windowsRef = null;

        window.showToast = function(message) {
            const t = document.getElementById('toast');
            t.innerText = message;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2500);
        };

        window.renderSavedList = function() {
            const container = document.getElementById('savedList');
            const itemsArray = Object.keys(windowsData).map(key => ({
                id: key,
                ...windowsData[key]
            })).reverse(); // ترتيب من الأحدث للأقدم

            if(itemsArray.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">لا يوجد مقاسات محفوظة حالياً.</p>';
                return;
            }

            container.innerHTML = itemsArray.map(item => `
                <div class="saved-card">
                    <div class="saved-card-info">
                        <h4>👤 ${item.customer}</h4>
                        <p>📏 العرض: <span style="color:#d84315">${item.w}</span> سم | الارتفاع: <span style="color:#d84315">${item.h}</span> سم</p>
                        <p style="font-size: 12px; color: #888; margin-top: 5px;">🔧 ${document.querySelector('#brandType option[value="'+item.brand+'"]')?.text || item.brand}</p>
                    </div>
                    <div class="saved-card-actions">
                        <button class="btn-sm btn-edit" onclick="editWindow('${item.id}')">تعديل ✏️</button>
                        <button class="btn-sm btn-delete" onclick="deleteWindow('${item.id}')">حذف 🗑️</button>
                    </div>
                </div>
            `).join('');
        };

        // التحقق من حساب المستخدم وتجهيز القاعدة
        onAuthStateChanged(auth, user => {
            if (user) {
                windowUserUid = user.uid;
                document.getElementById('auth-loader').style.display = 'none';
                document.getElementById('app-content').style.display = 'flex';
                
                // مسار الحفظ الجديد الخاص بـ azemaa proo للشبابيك
                windowsRef = ref(fdb, 'backups/azemaa_windows_sizes/' + windowUserUid);
                
                document.getElementById('sync-status').innerText = "⚡ جاري المزامنة...";
                
                onValue(windowsRef, (snapshot) => {
                    windowsData = snapshot.val() || {};
                    window.renderSavedList();
                    document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
                });
            } else {
                document.getElementById('auth-loader').innerText = "⚠️ حظر أمني: يرجى تسجيل الدخول من اللوحة الرئيسية أولاً!";
            }
        });

        // دالة الحفظ
        window.saveToCloud = function() {
            if(!windowUserUid) return;
            const customer = document.getElementById('customerName').value.trim();
            const w = document.getElementById('inlineWidth').value;
            const h = document.getElementById('inlineHeight').value;
            
            if(!customer || w <= 0 || h <= 0) {
                alert("يرجى إدخال اسم الزبون ومقاسات صحيحة للشبّاك!");
                return;
            }
            
            const item = { 
                customer: customer,
                w: w, 
                h: h, 
                brand: document.getElementById('brandType').value,
                system: document.getElementById('systemType').value,
                profile: document.getElementById('profileType').value,
                timestamp: Date.now()
            };
            
            document.getElementById('sync-status').innerText = "⚡ جاري الحفظ تلقائياً...";
            
            push(windowsRef, item).then(() => {
                document.getElementById('customerName').value = '';
                document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
                window.showToast("✅ تم حفظ المقايسة سحابياً");
            }).catch(err => {
                document.getElementById('sync-status').innerText = "⚠️ خطأ في المزامنة";
                alert("حدث خطأ في الاتصال: " + err);
            });
        };

        // دالة تحضير التعديل
        window.editWindow = function(id) {
            editKey = id;
            const data = windowsData[id];
            
            document.getElementById('customerName').value = data.customer || '';
            document.getElementById('inlineWidth').value = data.w;
            document.getElementById('inlineHeight').value = data.h;
            
            // تحديث القوائم المنسدلة بالترتيب
            document.getElementById('brandType').value = data.brand;
            updateSystemDropdown();
            document.getElementById('systemType').value = data.system;
            updateProfileDropdown();
            document.getElementById('profileType').value = data.profile;
            updateCalculations();
            
            document.getElementById('modeTxt').innerHTML = "<span style='color:#d84315'>تعديل بيانات الشبّاك الحالي</span>";
            document.getElementById('btnSaveCloud').style.display = 'none';
            document.getElementById('btnUpdateCloud').style.display = 'block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // دالة التحديث
        window.updateInCloud = function() {
            if (!editKey || !windowUserUid) return;
            const customer = document.getElementById('customerName').value.trim();
            
            if(!customer) {
                alert("يرجى كتابة اسم الزبون!");
                return;
            }

            const item = { 
                customer: customer,
                w: document.getElementById('inlineWidth').value, 
                h: document.getElementById('inlineHeight').value, 
                brand: document.getElementById('brandType').value,
                system: document.getElementById('systemType').value,
                profile: document.getElementById('profileType').value,
                timestamp: Date.now()
            };
            
            document.getElementById('sync-status').innerText = "⚡ جاري الحفظ تلقائياً...";
            const itemRef = ref(fdb, 'backups/azemaa_windows_sizes/' + windowUserUid + '/' + editKey);
            
            update(itemRef, item).then(() => {
                editKey = null;
                document.getElementById('modeTxt').innerHTML = "💡 اختر القطاع، اكتب المقاسات واسم الزبون، ثم اضغط حفظ لتسجيلها سحابياً.";
                document.getElementById('btnSaveCloud').style.display = 'block';
                document.getElementById('btnUpdateCloud').style.display = 'none';
                document.getElementById('customerName').value = '';
                document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
                window.showToast("🔄 تم التحديث بنجاح");
            }).catch(err => {
                document.getElementById('sync-status').innerText = "⚠️ خطأ في المزامنة";
            });
        };

        // دالة الحذف
        window.deleteWindow = function(id) { 
            if(!windowUserUid) return;
            if(confirm("هل أنت متأكد من حذف تخصيمات هذا الشبّاك نهائياً؟")) { 
                document.getElementById('sync-status').innerText = "⚡ جاري الحذف...";
                const itemRef = ref(fdb, 'backups/azemaa_windows_sizes/' + windowUserUid + '/' + id);
                remove(itemRef).then(() => {
                    document.getElementById('sync-status').innerText = "✅ مزامن لحظياً";
                    window.showToast("🗑️ تم الحذف من قاعدة البيانات");
                    if (editKey === id) { // إذا كان يحذف أثناء التعديل
                        editKey = null;
                        document.getElementById('btnSaveCloud').style.display = 'block';
                        document.getElementById('btnUpdateCloud').style.display = 'none';
                        document.getElementById('customerName').value = '';
                    }
                }).catch(err => {
                    document.getElementById('sync-status').innerText = "⚠️ خطأ في المزامنة";
                });
            } 
        };
    </script>
</body>
</html>
