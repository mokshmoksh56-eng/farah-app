<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خزنتي - الرسائل الذكية</title>
    <style>
        :root {
            --primary: #4834d4; --success: #2ecc71; --danger: #ff4757;
            --loan: #f0932b; --bg: #f1f2f6; --gold: #d4af37;
            --bg-success: #e3fcef; --bg-danger: #ffeef0; --bg-loan: #fff9ee;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 8px; }
        .header-title { text-align: center; font-weight: bold; color: var(--primary); margin: 5px 0; font-size: 18px; border-bottom: 2px solid var(--gold); }
        .stats { display: flex; gap: 5px; margin-bottom: 10px; }
        .stat-card { flex: 1; background: white; padding: 8px 2px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .stat-card span { font-size: 11px; color: #666; display: block; }
        .main-card { background: white; padding: 12px; border-radius: 12px; box-shadow: 0 5px 10px rgba(0,0,0,0.05); margin-bottom: 12px; }
        .manage-box { background: #f9f9f9; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px dashed #ccc; }
        .names-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .tag { background: white; border: 1px solid var(--primary); padding: 3px 10px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 5px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; width: 100%; box-sizing: border-box; margin-bottom: 6px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
        .btn { border: none; padding: 12px 2px; border-radius: 10px; color: white; font-weight: bold; font-size: 12px; cursor: pointer; }
        .btn-in { background: var(--success); } .btn-out { background: var(--danger); } .btn-loan { background: var(--loan); }
        .table-section { background: white; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        td { padding: 6px 4px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.02); }
        .row-in { background-color: var(--bg-success); } .row-out { background-color: var(--bg-danger); } .row-loan { background-color: var(--bg-loan); }
        .big-date { font-size: 16px; font-weight: 900; color: var(--primary); display: block; }
        .wa-btn { color: #25D366; font-size: 20px; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header-title" id="title">خزنتي الرقمية</div>

    <div class="stats">
        <div class="stat-card"><span>الوارد (+)</span><b id="tin" style="color:var(--success)">0</b></div>
        <div class="stat-card"><span>المنصرف (-)</span><b id="tout" style="color:var(--danger)">0</b></div>
        <div class="stat-card"><span>الصافي</span><b id="tnet" style="color:var(--primary)">0</b></div>
    </div>

    <div class="main-card">
        <div class="manage-box">
            <div style="display: flex; gap: 5px;">
                <input type="text" id="newName" placeholder="أضف اسم عميل جديد...">
                <button onclick="addName()" style="background:var(--primary); color:white; border:none; border-radius:8px; padding:0 15px; font-weight:bold;">+</button>
            </div>
            <div class="names-tags" id="tagsArea"></div>
        </div>

        <select id="userSelect" onchange="autoFillPhone(); render();"></select>
        <input type="number" id="phone" placeholder="رقم الواتساب">
        <input type="number" id="amount" placeholder="المبلغ">
        <input type="text" id="note" placeholder="البيان (مثلاً: دفعة تحت الحساب)">
        
        <div class="btn-group">
            <button class="btn btn-in" onclick="save('in')">إيداع (+)</button>
            <button class="btn btn-out" onclick="save('out')">سحب (-)</button>
            <button class="btn btn-loan" onclick="save('loan')">سلفية (⚠️)</button>
        </div>
    </div>

    <div class="table-section">
        <table>
            <thead>
                <tr style="background:#f4f4f4; font-size:10px;">
                    <th>التاريخ</th>
                    <th>البيان</th>
                    <th>المبلغ</th>
                    <th>إرسال</th>
                    <th>حذف</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

<script>
    let names = JSON.parse(localStorage.getItem('WA_SMART_NAMES')) || ["عميل تجريبي"];
    let db = JSON.parse(localStorage.getItem('WA_SMART_DB')) || [];

    function addName() {
        const val = document.getElementById('newName').value.trim();
        if(val && !names.includes(val)) {
            names.push(val);
            localStorage.setItem('WA_SMART_NAMES', JSON.stringify(names));
            document.getElementById('newName').value = '';
            sync();
        }
    }

    function deleteName(name) {
        if(confirm(`حذف "${name}"؟`)) {
            names = names.filter(n => n !== name);
            localStorage.setItem('WA_SMART_NAMES', JSON.stringify(names));
            sync();
        }
    }

    function autoFillPhone() {
        const selName = document.getElementById('userSelect').value;
        const phoneField = document.getElementById('phone');
        if (selName) {
            const lastRecord = db.find(r => r.name === selName && r.phone !== "");
            if (lastRecord) {
                let num = lastRecord.phone;
                if (num.startsWith('20')) num = num.substring(1);
                phoneField.value = num;
            } else phoneField.value = "";
        } else phoneField.value = "";
    }

    function sync() {
        const sel = document.getElementById('userSelect');
        const tags = document.getElementById('tagsArea');
        const curr = sel.value;
        sel.innerHTML = '<option value="">-- اختر العميل --</option>';
        names.sort().forEach(n => sel.innerHTML += `<option value="${n}">${n}</option>`);
        sel.value = curr;
        tags.innerHTML = '';
        names.forEach(n => tags.innerHTML += `<div class="tag">${n} <b onclick="deleteName('${n}')" style="color:red;cursor:pointer">×</b></div>`);
    }

    function save(type) {
        const name = document.getElementById('userSelect').value;
        let phone = document.getElementById('phone').value;
        const amt = parseFloat(document.getElementById('amount').value);
        const note = document.getElementById('note').value || (type==='in'?'إيداع':type==='loan'?'سلفية':'سحب');

        if(!name || isNaN(amt)) return alert("يرجى اختيار العميل وإدخال المبلغ");

        db.unshift({
            id: Date.now(), name,
            phone: phone ? (phone.startsWith('0') ? '2' + phone : phone) : '',
            amt: (type === 'in' ? amt : -amt),
            type, note, date: new Date().toLocaleDateString('ar-EG')
        });

        localStorage.setItem('WA_SMART_DB', JSON.stringify(db));
        document.getElementById('amount').value = '';
        document.getElementById('note').value = '';
        render();
    }

    // --- دالة إرسال الرسالة بالأسلوب الذكي الجديد ---
    function sendWA(id) {
        const item = db.find(i => i.id === id);
        if(!item.phone) return alert("لا يوجد رقم مسجل لهذا العميل");
        
        const userBal = db.filter(r => r.name === item.name).reduce((s, r) => s + r.amt, 0);
        
        // الأسلوب الذكي في الصياغة
        let statusEmoji = item.amt > 0 ? "✅" : (item.type==='loan' ? "⚠️" : "💸");
        let actionTxt = item.amt > 0 ? "إيداع مبلغ" : (item.type==='loan' ? "سلفية" : "سحب مبلغ");
        
        const msg = `*مرحباً ${item.name}* 👋
تم تسجيل معاملة جديدة في حسابك:

📝 *العملية:* ${actionTxt} ${statusEmoji}
💰 *المبلغ:* ${Math.abs(item.amt)} ج.م
📄 *البيان:* ${item.note}
📅 *التاريخ:* ${item.date}

-------------------------
⚖️ *إجمالي رصيدك الحالي هو:*
👈 { *${userBal} ج.م* }
-------------------------

*شكراً لتعاملك معنا!* ✨`;

        window.open(`https://wa.me/${item.phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function render() {
        const selName = document.getElementById('userSelect').value;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        let tin = 0, tout = 0;
        document.getElementById('title').innerText = selName ? `حساب: ${selName}` : "خزنتي الرقمية";

        db.forEach(item => {
            if (!selName || item.name === selName) {
                if(item.amt > 0) tin += item.amt; else tout += Math.abs(item.amt);
                let rowClass = item.amt > 0 ? 'row-in' : (item.type === 'loan' ? 'row-loan' : 'row-out');
                tbody.innerHTML += `
                    <tr class="${rowClass}">
                        <td><span class="big-date">${item.date}</span></td>
                        <td style="text-align:right"><b>${item.name}</b><br><small>${item.note}</small></td>
                        <td style="font-weight:bold">${item.amt}</td>
                        <td><span class="wa-btn" onclick="sendWA(${item.id})">🟢</span></td>
                        <td><span onclick="del(${item.id})" style="cursor:pointer;color:#ccc">🗑️</span></td>
                    </tr>
                `;
            }
        });
        document.getElementById('tin').innerText = tin;
        document.getElementById('tout').innerText = tout;
        document.getElementById('tnet').innerText = tin - tout;
    }

    function del(id) { if(confirm("حذف؟")) { db = db.filter(i => i.id !== id); localStorage.setItem('WA_SMART_DB', JSON.stringify(db)); render(); } }

    sync(); render();
</script>
</body>
</html>
