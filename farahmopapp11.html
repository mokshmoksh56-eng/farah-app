<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro | الإدارة الشاملة</title>
    <style>
        :root { --primary: #2c3e50; --whatsapp: #25D366; --restore: #e67e22; --bg: #ecf0f1; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 10px; background-color: var(--bg); display: flex; flex-direction: column; box-sizing: border-box; }
        header { background: var(--primary); color: white; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 8px; font-weight: bold; }
        
        /* أزرار الواتساب فوق بعض */
        .sync-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .sync-btn { text-decoration: none; color: white; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 10px; border: none; cursor: pointer; box-shadow: 0 3px 5px rgba(0,0,0,0.1); }
        .btn-send { background-color: var(--whatsapp); }
        .btn-restore { background-color: var(--restore); }
        .ver-no { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 4px; font-size: 12px; }

        /* الصفحات فوق بعض */
        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 450px; border: 2px solid #bdc3c7; }
        .card-header { background: #34495e; color: white; padding: 10px 15px; font-size: 14px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
        .btn-open { background: #fff; color: var(--primary); text-decoration: none; padding: 3px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

<header>🚀 azemaa pro للبرمجيات</header>

<div class="sync-container">
    <button onclick="exportAndEncrypt()" class="sync-btn btn-send">
        <span>📤 حفظ نسخة (كود مشفر 🔐)</span>
        <span class="ver-no" id="next-ver">رقم: 1</span>
    </button>

    <button onclick="importAndDecrypt()" class="sync-btn btn-restore">
        <span>📥 استرجاع (لصق كود 🔓)</span>
        <span class="ver-no" id="last-ver">آخر نسخة: 0</span>
    </button>
</div>

<div class="main-container">
    <div class="card">
        <div class="card-header" style="background: #8e44ad;"><span>💰 الديون والاتفاقيات</span><a href="zbon.html" target="_blank" class="btn-open">تكبير ↗️</a></div>
        <iframe src="zbon.html"></iframe>
    </div>
    <div class="card">
        <div class="card-header" style="background: #d35400;"><span>💸 حركة الخزينة</span><a href="yom.html" target="_blank" class="btn-open">تكبير ↗️</a></div>
        <iframe src="yom.html"></iframe>
    </div>
    <div class="card">
        <div class="card-header" style="background: #128C7E;"><span>👷 تقرير العمال</span><a href="gyab.html" target="_blank" class="btn-open">تكبير ↗️</a></div>
        <iframe src="gyab.html"></iframe>
    </div>
    <div class="card">
        <div class="card-header" style="background: #2980b9;"><span>📅 مواعيد الاستلام</span><a href="tslem.html" target="_blank" class="btn-open">تكبير ↗️</a></div>
        <iframe src="tslem.html"></iframe>
    </div>
    <div class="card">
        <div class="card-header" style="background: #c0392b;"><span>📊 التقارير العامة</span><a href="takarer.html" target="_blank" class="btn-open">تكبير ↗️</a></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    let currentVer = parseInt(localStorage.getItem('az_v')) || 0;

    function updateUI() {
        document.getElementById('last-ver').innerText = `آخر نسخة: ${currentVer}`;
        document.getElementById('next-ver').innerText = `رقم: ${currentVer + 1}`;
    }

    // وظيفة التشفير الحقيقي
    function exportAndEncrypt() {
        const data = JSON.stringify(localStorage);
        // التشفير إلى Base64 مع دعم اللغة العربية
        const encrypted = btoa(unescape(encodeURIComponent(data)));

        currentVer++;
        localStorage.setItem('az_v', currentVer);
        updateUI();

        // الرسالة ستظهر كرموز مثل: AZ[1]: dXNlcjp0ZXN0...
        const msg = `AZ-DATA[${currentVer}]:%0A${encrypted}`;
        window.location.href = `whatsapp://send?text=${msg}`;
    }

    // وظيفة فك التشفير
    function importAndDecrypt() {
        let input = prompt("الصق كود التشفير المنسوخ من الواتساب:");
        if (!input) return;

        // تنظيف الكود (أخذ ما بعد النقطتين)
        if (input.includes(':')) input = input.split(':')[1].trim();

        try {
            const decrypted = decodeURIComponent(escape(atob(input)));
            const dataObj = JSON.parse(decrypted);
            
            localStorage.clear();
            Object.keys(dataObj).forEach(k => localStorage.setItem(k, dataObj[k]));
            
            alert("✅ تم فك التشفير بنجاح! سيتم تحديث البيانات.");
            location.reload();
        } catch (e) {
            alert("❌ فشل! الكود الذي لصقته غير صحيح أو ناقص.");
        }
    }

    updateUI();
</script>

</body>
</html>
