<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - APK الموحد</title>
    <style>
        :root { 
            --bg-main: #eef2f7; --card-bg: #ffffff; --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --cloud-blue: #00a8ff; --card-radius: 20px;
        }
        
        /* منع المشاكل في التمرير للجسم الرئيسي */
        body, html { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            background: var(--bg-main); 
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden; /* منع الاهتزاز الجانبي */
        }

        /* شاشة القفل */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #eef2f7; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
        }
        .lock-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 80%; max-width: 400px; }
        #pass-input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 10px; text-align: center; font-size: 1.2rem; box-sizing: border-box; }
        .btn-unlock { background: var(--header-grad); color: white; border: none; padding: 12px 20px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; }

        header { background: var(--header-grad); color: #fff; padding: 15px; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 100; }

        .main-container { padding: 10px; display: flex; flex-direction: column; gap: 15px; min-height: 100vh; }
        
        .card { 
            background: var(--card-bg); 
            border-radius: 20px; 
            min-height: 85vh; /* تجعل الصفحة تأخذ معظم طول الشاشة */
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
            border: 2px solid #6e8efb;
            overflow: hidden; /* لضمان حواف دائرية للـ iframe */
        }
        
        .h { padding: 12px 15px; background: #6e8efb; color: white; font-weight: bold; text-align: center; }
        
        /* تفعيل التمرير الكامل للـ iframe */
        iframe { 
            flex: 1; 
            border: none; 
            width: 100%; 
            height: 100%; 
            pointer-events: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* لضمان نعومة التمرير في الآيفون/الأندرويد */
        }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <h2>🚀 azemaa pro</h2>
        <input type="password" id="pass-input" placeholder="كود التفعيل (مثال: 4366)">
        <button class="btn-unlock" onclick="handleUnlock()">دخول</button>
        <p id="msg" style="color:red; display:none; margin-top:10px;">الكود خطأ!</p>
    </div>
</div>

<header>
    <div>🚀 azemaa pro</div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-container">
    <div class="card">
        <div class="h">👤 القسم الرئيسي (zbon)</div>
        <iframe src="zbon.html" id="frame-zbon"></iframe>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);

    window.handleUnlock = async () => {
        const code = document.getElementById('pass-input').value;
        if(!code) return;
        
        try {
            await signInAnonymously(auth);
            const snapshot = await get(ref(db, `activations/${code}`));
            if (snapshot.exists()) {
                localStorage.setItem('user_id', code);
                document.getElementById('lock-screen').style.display = 'none';
                // تحديث الـ iframe لضمان عمله
                document.getElementById('frame-zbon').src = "zbon.html";
            } else {
                document.getElementById('msg').style.display = 'block';
            }
        } catch (e) { 
            alert("خطأ في الاتصال بالإنترنت أو إعدادات Firebase!"); 
            console.error(e);
        }
    };
</script>

<script>
    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('ar-EG');
    }, 1000);
</script>
</body>
</html>
