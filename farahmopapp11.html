<!-- سكريبت الـ Firebase المحدث والمربوط بقاعدة بيانات azemaa-proo -->
<script type="module">
    // استخدام روابط الـ CDN الكاملة لضمان عملها مباشرة في المتصفح دون حزم برمجية
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
    
    // إعدادات تطبيقك الجديد AZEMAA PRO
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210",
        measurementId: "G-R28J7010TH"
    };
    
    // تهيئة Firebase والخدمات
    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);
    const analytics = getAnalytics(app); // تفعيل التحليلات للمشروع الجديد

    // وظيفة الحفظ السحابي
    window.saveToCloud = async function() {
        try {
            if (localStorage.length === 0) {
                alert("⚠️ لا توجد بيانات محلياً لحفظها!");
                return;
            }

            let data = {}; 
            let hasData = false;

            for (let i = 0; i < localStorage.length; i++) { 
                let k = localStorage.key(i); 
                if (k !== 'theme') { 
                    data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); 
                    hasData = true;
                } 
            }

            if (!hasData) {
                alert("⚠️ لا توجد بيانات صالحة للحفظ سحابياً.");
                return;
            }

            await set(ref(db, 'backups/azemaa_main'), data); 
            alert("✅ تم الحفظ سحابياً بنجاح في مشروعك الجديد.");
        } catch (error) {
            console.error(error);
            alert("❌ فشل الحفظ السحابي: " + error.message);
        }
    };

    // وظيفة الاسترجاع السحابي
    window.loadFromCloud = async function() {
        try {
            const snapshot = await get(child(ref(db), 'backups/azemaa_main'));
            
            if (snapshot.exists() && snapshot.val() !== null) { 
                const d = snapshot.val(); 
                
                // تنظيف آمن للملفات المحلية
                localStorage.clear(); 
                
                // إعادة تعبئة البيانات
                for (let k in d) {
                    if (d.hasOwnProperty(k)) {
                        localStorage.setItem(k, d[k]); 
                    }
                }
                
                alert("🔄 تم استرجاع البيانات بنجاح! سيتم تحديث النظام الآن...");
                
                // إعادة تحميل الصفحة لتطبيق البيانات المسترجعة
                window.location.href = window.location.pathname + window.location.search;
            } else {
                alert("❓ لم يتم العثور على أي بيانات محفوظة مسبقاً على السحابة. يرجى الضغط على 'حفظ سحابي' أولاً.");
            }
        } catch (error) {
            console.error("خطأ أثناء الاسترجاع:", error);
            alert("❌ فشل استرجاع البيانات: " + error.message);
        }
    };
</script>
