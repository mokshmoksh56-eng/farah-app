<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Cyber Night Edition</title>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366;
            --cloud-blue: #00a8ff;
            --card-radius: 20px;
        }

        body.dark-mode {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 12px; background: var(--bg-main); 
            color: var(--text-color); display: flex; flex-direction: column; 
            gap: 15px; transition: 0.3s; 
        }

        /* --- شاشة القفل المحسنة --- */
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
            transition: opacity 0.5s ease;
        }

        .lock-box {
            background: var(--card-bg); padding: 40px 30px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); text-align: center;
            width: 320px; border: 2px solid var(--cloud-blue);
        }

        .lock-box h2 { margin-bottom: 25px; font-size: 1.4rem; color: var(--text-color); }

        #pass-input {
            width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #ddd;
            border-radius: 12px; text-align: center; font-size: 1.5rem;
            box-sizing: border-box; outline: none; background: var(--bg-main);
            color: var(--text-color); font-family: monospace;
        }

        .btn-unlock {
            background: var(--header-grad); color: white; border: none;
            padding: 12px; border-radius: 12px; cursor: pointer;
            font-weight: bold; width: 100%; font-size: 1.1rem; transition: 0.3s;
        }
        .btn-unlock:hover { opacity: 0.9; transform: translateY(-2px); }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 10px 15px; 
            border-radius: var(--card-radius); display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.2);
        }

        .header-info { display: flex; flex-direction: column; align-items: flex-start; }
        .clock-container { display: flex; align-items: center; gap: 8px; }
        .system-title { font-size: 0.95rem; font-weight: 800; letter-spacing: 0.3px; opacity: 0.95; text-transform: lowercase; }
        #digital-clock { font-size: 1rem; font-weight: bold; font-family: 'Segoe UI', monospace; }
        #countdown { font-size: 0.7rem; opacity: 0.9; margin-top: 2px; color: #fff; font-weight: bold; }

        .header-btns { display: flex; gap: 6px; }

        .theme-btn, .calc-trigger-btn {
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 6px 10px; border-radius: 10px; cursor: pointer; font-size: 0.75rem;
            display: flex; align-items: center; gap: 4px; transition: 0.2s;
        }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { 
            border: none; color: #fff; padding: 15px; border-radius: 15px; 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-cloud { background: var(--cloud-blue); }

        .main-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
        
        .card { 
            background: var(--card-bg); border-radius: var(--card-radius); height: 420px; 
            display: flex; flex-direction: column; overflow: hidden; position: relative; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; transition: 0.3s;
        }
        
        .card-zbon { border-color: #ff7675; } .h-zbon { background: #ff7675; }
        .card-yom { border-color: #00cec9; } .h-yom { background: #00cec9; }
        .card-gyab { border-color: #6c5ce7; } .h-gyab { background: #6c5ce7; }
        .card-tslem { border-color: #e17055; } .h-tslem { background: #e17055; }
        .card-notmop { border-color: #fbc531; } .h-notmop { background: #fbc531; color: #2d3436; }
        .card-takarer { border-color: #0984e3; } .h-takarer { background: #0984e3; }

        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: transparent; z-index: 5; cursor: pointer; }
        .h { padding: 15px 20px; font-size: 14px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; z-index: 10; }

        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; pointer-events: none; }

        .zoom-btn { background: rgba(255,255,255,0.25); color: inherit; border: none; padding: 6px 14px; border-radius: 12px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .card.fullscreen iframe { pointer-events: auto; }

        /* حاسبة */
        .calc-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card-bg); border: 2px solid var(--cloud-blue); padding: 15px;
            border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); z-index: 10000; width: 340px;
        }
        #calc-screen {
            width: 100%; height: 60px; background: #2d3436; color: #00cec9; border: none; text-align: left;
            padding: 10px; font-size: 1.4rem; border-radius: 10px; margin-bottom: 12px; box-sizing: border-box; font-family: monospace; direction: ltr;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .calc-btn { padding: 10px 4px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; background: #e2e8f0; color: #2d3436; }
        .calc-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 9999; }
    </style>
</head>
<body>

<!-- شاشة القفل تظهر دائماً عند تحميل الصفحة الآن -->
<div id="lock-screen">
    <div class="lock-box">
        <h2 style="text-transform: lowercase;">🚀 azemaa pro</h2>
        <input type="password" id="pass-input" placeholder="أدخل كود التفعيل الخاص بك" autofocus>
        <button class="btn-unlock" id="unlock-btn">تأكيد الدخول والتفعيل</button>
        <p id="lock-msg" style="color: #ff7675; font-size: 0.85rem; margin-top: 15px; display: none; font-weight: bold;">⚠️ كود التفعيل غير صحيح أو منتهي الصلاحية!</p>
    </div>
</div>

<header>
    <div class="header-info">
        <div class="clock-container">
            <span class="system-title">🚀 azemaa pro</span>
            <div id="digital-clock">00:00:00 ص</div>
        </div>
        <div id="countdown">جرٍ حساب المناسبات القادمة...</div>
    </div>
    <div class="header-btns">
        <button class="calc-trigger-btn" onclick="toggleCalc(true)">🧮 حاسبة</button>
        <button class="theme-btn" onclick="toggleTheme()">🌙 ليل</button>
    </div>
</header>

<div class="calc-overlay" id="calcOverlay" onclick="toggleCalc(false)"></div>
<div class="calc-modal" id="calcModal">
    <div class="calc-header" style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span>📐 آلة حاسبة هندسية</span>
        <button onclick="toggleCalc(false)" style="background:red; color:white; border:none; border-radius:50%; width:20px; height:20px; cursor:pointer;">✕</button>
    </div>
    <input type="text" id="calc-screen" readonly value="0">
    <div class="calc-grid">
        <button class="calc-btn" onclick="clearCalc()">C</button>
        <button class="calc-btn" onclick="pressCalc('/')">/</button>
        <button class="calc-btn" onclick="pressCalc('*')">×</button>
        <button class="calc-btn" onclick="backspaceCalc()">⌫</button>
        <button class="calc-btn" onclick="pressCalc('7')">7</button>
        <button class="calc-btn" onclick="pressCalc('8')">8</button>
        <button class="calc-btn" onclick="pressCalc('9')">9</button>
        <button class="calc-btn" onclick="pressCalc('-')">-</button>
        <button class="calc-btn" onclick="pressCalc('4')">4</button>
        <button class="calc-btn" onclick="pressCalc('5')">5</button>
        <button class="calc-btn" onclick="pressCalc('6')">6</button>
        <button class="calc-btn" onclick="pressCalc('+')">+</button>
        <button class="calc-btn" onclick="pressCalc('1')">1</button>
        <button class="calc-btn" onclick="pressCalc('2')">2</button>
        <button class="calc-btn" onclick="pressCalc('3')">3</button>
        <button class="calc-btn" onclick="calculateResult()" style="grid-row: span 2; background:var(--cloud-blue); color:white;">=</button>
        <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="pressCalc('.')">.</button>
    </div>
</div>

<div class="sync-box">
    <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ سحابي</button>
    <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتساب (نسخ)</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 يدوي</button>
</div>

<div class="main-container">
    <div class="card card-zbon" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-zbon"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="zbon.html"></iframe>
    </div>
    <div class="card card-yom" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-yom"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="yom.html"></iframe>
    </div>
    <div class="card card-gyab" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-gyab"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="gyab.html"></iframe>
    </div>
    <div class="card card-tslem" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-tslem"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="tslem.html"></iframe>
    </div>
    <div class="card card-notmop" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-notmop"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="notmop.html"></iframe>
    </div>
    <div class="card card-takarer" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-takarer"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    // --- 1. تم إلغاء الفحص المسبق لتظهر شاشة القفل في كل تحديث ---
    // (تم حذف كود التخطي التلقائي)

    // --- 2. إدارة الوقت ---
    function updateHeader() {
        const now = new Date();
        document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    }
    setInterval(updateHeader, 1000);
    updateHeader();

    // --- 3. الوضع الليلي ---
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.querySelector('.theme-btn').innerHTML = isDark ? "☀️ فاتح" : "🌙 ليل";
    }
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

    // --- 4. الآلة الحاسبة ---
    const calcScreen = document.getElementById('calc-screen');
    function toggleCalc(show) {
        document.getElementById('calcModal').style.display = show ? 'block' : 'none';
        document.getElementById('calcOverlay').style.display = show ? 'block' : 'none';
    }
    function pressCalc(v) { calcScreen.value === '0' ? calcScreen.value = v : calcScreen.value += v; }
    function clearCalc() { calcScreen.value = '0'; }
    function backspaceCalc() { calcScreen.value = calcScreen.value.slice(0,-1) || '0'; }
    function calculateResult() {
        try { calcScreen.value = eval(calcScreen.value.replace(/×/g, '*').replace(/÷/g, '/')); }
        catch(e) { calcScreen.value = "Error"; setTimeout(clearCalc, 1000); }
    }

    // --- 5. التكبير والواتساب ---
    function toggleZoom(card) {
        card.classList.toggle('fullscreen');
        const btn = card.querySelector('.zoom-btn');
        btn.innerText = card.classList.contains('fullscreen') ? "✕ إغلاق" : "⛶ تكبير";
    }

    function saveToWhatsApp() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { 
            let k = localStorage.key(i); 
            if(!['theme','user_id','user_name'].includes(k)) data[k] = localStorage.getItem(k); 
        }
        let code = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
        window.open(`https://wa.me/?text=*AZ-BACKUP*%0A${code}`, '_blank');
    }

    function loadFromWhatsApp() {
        let input = prompt("الصق الكود:"); if (!input) return;
        try {
            let clean = input.includes('*AZ-BACKUP*') ? input.split('*AZ-BACKUP*\n')[1] : input;
            let obj = JSON.parse(decodeURIComponent(escape(atob(clean.trim()))));
            for (let k in obj) localStorage.setItem(k, obj[k]); location.reload();
        } catch (e) { alert("خطأ في الكود"); }
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    
    // إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };
    
    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);

    const unlockBtn = document.getElementById('unlock-btn');
    const passInput = document.getElementById('pass-input');
    const lockScreen = document.getElementById('lock-screen');
    const lockMsg = document.getElementById('lock-msg');

    // --- نظام التحقق اللحظي والاتصال بدون حفظ تفعيل دائم ---
    async function handleUnlock() {
        const enteredPass = passInput.value.trim();
        if(!enteredPass) return;
        
        try {
            const snapshot = await get(ref(db, `activations/${enteredPass}`));
            if (snapshot.exists()) {
                const userData = snapshot.val();
                
                // يتم الحفاظ على الـ ID في الذاكرة لتشغيل الحفظ السحابي، لكن سيُطلب الكود مجدداً عند إعادة تحميل الصفحة
                localStorage.setItem('user_id', enteredPass);
                localStorage.setItem('user_name', userData.name || 'مستخدم');
                
                lockScreen.style.opacity = "0";
                setTimeout(() => { lockScreen.style.display = "none"; }, 500);
            } else {
                lockMsg.style.display = "block";
            }
        } catch (error) {
            alert("تأكد من الاتصال بالإنترنت!");
        }
    }

    unlockBtn.onclick = handleUnlock;
    passInput.onkeypress = (e) => { if (e.key === 'Enter') handleUnlock(); };

    // --- الحفظ السحابي ---
    document.getElementById('cloud-save-btn').onclick = async () => {
        const userId = localStorage.getItem('user_id');
        if(!userId) return alert("سجل دخول أولاً");

        let data = {}; 
        for (let i = 0; i < localStorage.length; i++) { 
            let k = localStorage.key(i); 
            if(!['theme','user_id','user_name'].includes(k)) {
                data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); 
            }
        }
        await set(ref(db, `users/${userId}/data`), data); 
        alert("✅ تم الحفظ بنجاح!");
    };

    // --- الاسترجاع السحابي ---
    document.getElementById('cloud-load-btn').onclick = async () => {
        const userId = localStorage.getItem('user_id');
        if(!userId) return alert("سجل دخول أولاً عبر كود التفعيل");
        
        const snapshot = await get(child(ref(db), `users/${userId}/data`));
        if (snapshot.exists()) {
            let d = snapshot.val(); 
            for (let k in d) localStorage.setItem(k, d[k]);
            alert("🔄 تم استرجاع بياناتك!"); 
            location.reload();
        } else {
            alert("لا توجد بيانات محفوظة.");
        }
    };
</script>
</body>
</html>
