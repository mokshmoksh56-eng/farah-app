<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO 2026 - السحابة الموحدة</title>
    <style>
        :root { --bg-main: #f0f2f5; --card-bg: #ffffff; --primary: #1e40af; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 10px; background: var(--bg-main); font-weight: bold; }
        header { background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card-bg); border-radius: 15px; height: 400px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.1); border-top: 5px solid var(--primary); }
        .card-header { padding: 10px; background: #eee; display: flex; justify-content: space-between; }
        iframe { flex: 1; border: none; width: 100%; }
        .fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10000; }
    </style>
</head>
<body>
<header>
    <div>
        <div id="clock" style="font-size: 20px;">00:00:00</div>
        <div style="font-size: 12px; opacity: 0.8;">AZEMAA PRO | السحابة متصلة 🟢</div>
    </div>
    <button onclick="location.reload()" style="background: white; border:none; padding:8px 15px; border-radius:10px; cursor:pointer;">🔄 تحديث الكل</button>
</header>

<div class="grid-container">
    <div class="card"><div class="card-header">👤 الزبائن والمديونيات</div><iframe src="zbon.html"></iframe></div>
    <div class="card"><div class="card-header">💸 خزينة الورشة</div><iframe src="yom.html"></iframe></div>
    <div class="card"><div class="card-header">👷 شئون العمال</div><iframe src="gyab.html"></iframe></div>
    <div class="card"><div class="card-header">📅 جدول التسليمات</div><iframe src="tslem.html"></iframe></div>
    <div class="card"><div class="card-header">📝 ملاحظات أونلاين</div><iframe src="notmop.html"></iframe></div>
    <div class="card" style="border-top-color: #059669;"><div class="card-header">📊 التقارير الختامية</div><iframe src="takarer.html"></iframe></div>
</div>

<script>
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-EG');
    }, 1000);
</script>
</body>
</html>
