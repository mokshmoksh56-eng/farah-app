<script>
    // وظيفة الضغط الفائق باستخدام GZIP المدمج في المتصفح
    async function s() {
        const raw = JSON.stringify(localStorage);
        // تقليص المفاتيح يدوياً قبل الضغط العام
        let mini = raw.replace(/"name":/g, '"n":').replace(/"price":/g, '"p":').replace(/"date":/g, '"d":');
        
        const stream = new Blob([mini]).stream();
        const compressedStream = stream.pipeThrough(new CompressionStream('gzip'));
        const response = new Response(compressedStream);
        const buffer = await response.arrayBuffer();
        
        // تحويل الـ Binary إلى Base64 قصير
        let binary = '';
        let bytes = new Uint8Array(buffer);
        bytes.forEach((b) => binary += String.fromCharCode(b));
        let code = btoa(binary);
        
        window.location.href = `whatsapp://send?text=${encodeURIComponent(code)}`;
    }

    // وظيفة فك الضغط والاسترجاع
    async function l() {
        let i = prompt("الصق الكود هنا:");
        if (!i) return;
        try {
            let binary = atob(i.trim());
            let bytes = new Uint8Array(binary.length);
            for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
            
            const stream = new DecompressionStream('gzip');
            const writer = stream.writable.getWriter();
            writer.write(bytes);
            writer.close();
            
            const response = new Response(stream.readable);
            let original = await response.text();
            
            // إعادة الكلمات الأصلية
            original = original.replace(/"n":/g, '"name":').replace(/"p":/g, '"price":').replace(/"d":/g, '"date":');
            
            let obj = JSON.parse(original);
            localStorage.clear();
            for (let k in obj) localStorage.setItem(k, obj[k]);
            alert("✅ تم الاسترجاع بنجاح");
            location.reload();
        } catch (e) {
            alert("❌ الكود تالف أو المتصفح قديم");
        }
    }
</script>
