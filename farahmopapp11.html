<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Live Sync</title>
    <style>
        :root { --p: #2c3e50; --w: #25D366; --r: #e67e22; --e: #3498db; --bg: #ecf0f1; --fb: #8e44ad; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: var(--bg); display: flex; flex-direction: column; }
        header { background: var(--p); color: #fff; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
        
        .status-bar { background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; text-align: center; border: 1px solid #ddd; font-size: 14px; }
        .sync-active { color: #27ae60; font-weight: bold; }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #fff; border-radius: 10px; height: 400px; border: 1px solid #ccc; display: flex; flex-direction: column; overflow: hidden; }
        .h { background: #34495e; color: #fff; padding: 8px 15px; font-size: 13px; font-weight: bold; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; }
    </style>
</head>
<body>

<header>🚀 azemaa pro - المزامنة اللحظية</header>

<div class="status-bar" id="syncStatus">
    الحالة: <span id="statusText">جاري الاتصال...</span>
</div>

<div class="main-container">
    <div class="card">
        <div class="h">👤 القسم الرئيسي</div>
        <iframe src="zbon.html" id="frame1"></iframe>
    </div>
    <div class="card">
        <div class="h">💸 الخزينة</div>
        <iframe src="yom.html" id="frame2"></iframe>
    </div>
    </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
    authDomain: "azemaa-proo.firebaseapp.com",
    projectId: "azemaa-proo",
    storageBucket: "azemaa-proo.firebasestorage.app",
    messagingSenderId: "787350492977",
    appId: "1:787350492977:web:84061dcf31622fcb07c210",
    measurementId: "G-R28J7010TH"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // تحديد معرف المستخدم (يمكنك تغييره ليكون ثابت أو عن طريق تسجيل دخول)
  const userId = "main_shop_account"; 
  const dbRef = ref(db, 'liveData/' + userId);

  // 1. استقبال البيانات فور تغييرها في السحابة
  onValue(dbRef, (snapshot) => {
    const data = snapshot.val();
    if (data) {
        let changed = false;
        for (let key in data) {
            if (localStorage.getItem(key) !== data[key]) {
                localStorage.setItem(key, data[key]);
                changed = true;
            }
        }
        if (changed) {
            document.getElementById('statusText').innerHTML = "✅ تم التحديث الآن";
            document.getElementById('statusText').className = "sync-active";
            // تحديث الإطارات (iframes) لتعكس البيانات الجديدة
            document.querySelectorAll('iframe').forEach(f => f.contentWindow.location.reload());
        }
    }
  });

  // 2. مراقبة أي تغيير في التخزين المحلي وإرساله فوراً
  window.addEventListener('storage', () => {
    uploadData();
  });

  // دالة لرفع البيانات يدوياً عند الحاجة أو تلقائياً
  async function uploadData() {
    let data = {};
    for (let i = 0; i < localStorage.length; i++) {
        let k = localStorage.key(i);
        data[k] = localStorage.getItem(k);
    }
    await set(dbRef, data);
    document.getElementById('statusText').innerText = "☁️ متصل ومزامن";
  }

  // رفع البيانات لأول مرة عند الفتح
  uploadData();
</script>

</body>
</html>
