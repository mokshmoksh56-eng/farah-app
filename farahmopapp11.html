<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro | الإدارة الشاملة</title>
    <style>
        :root {
            --primary: #2c3e50;
            --whatsapp: #25D366;
            --restore: #e67e22;
            --bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        /* شريط الأزرار فوق بعض مع أرقام متغيرة */
        .sync-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .sync-btn {
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .btn-send { background-color: var(--whatsapp); }
        .btn-restore { background-color: var(--restore); }
        
        .version-badge {
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .main-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            flex-grow: 1;
        }

        .card {
            background: white;
            border-radius: 12px;
            height: 380px;
            display: flex;
            flex-direction: column;
            border: 1px solid #ccc;
            overflow: hidden;
        }

        .card-header {
            background: #34495e;
            color: white;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header id="main-header">🚀 azemaa pro للبرمجيات</header>

<div class="sync-container">
    <a href="#" onclick="handleBackup()" class="sync-btn btn-send">
        <span>📤 إرسال نسخة جديدة للواتساب</span>
        <span class="version-badge" id="next-ver">رقم: 1</span>
    </a>

    <a href="#" onclick="handleRestore()" class="sync-btn btn-restore">
        <span>📥 استرجاع آخر نسخة محفوظة</span>
        <span class="version-badge" id="last-ver">رقم: 0</span>
    </a>
</div>

<div class="main-container">
    <div class="card"><div class="card-header">💰 الديون والاتفاقيات</div><iframe src="zbon.html"></iframe></div>
    <div class="card"><div class="card-header">💸 حركة الخزينة</div><iframe src="yom.html"></iframe></div>
</div>

<script>
    // جلب رقم النسخة من ذاكرة الهاتف أو البدء من 0
    let currentVersion = parseInt(localStorage.getItem('azemaa_ver')) || 0;

    function updateDisplay() {
        document.getElementById('last-ver').innerText = `آخر نسخة: ${currentVersion}`;
        document.getElementById('next-ver').innerText = `نسخة رقم: ${currentVersion + 1}`;
    }

    function handleBackup() {
        // زيادة الرقم وحفظه
        currentVersion++;
        localStorage.setItem('azemaa_ver', currentVersion);
        updateDisplay();

        const now = new Date().toLocaleString('ar-EG');
        const message = `📦_نسخة_احتياطية_رقم_[${currentVersion}]%0A📅_التاريخ:_ ${now}%0A✅_برنامج_azemaa_pro`;
        
        // فتح الواتساب
        window.location.href = `whatsapp://send?text=${message}`;
    }

    function handleRestore() {
        if (currentVersion === 0) {
            alert("لا توجد نسخ محفوظة مسبقاً.");
            return;
        }
        const message = `🔍_طلب_استرجاع_النسخة_رقم_[${currentVersion}]`;
        window.location.href = `whatsapp://send?text=${message}`;
    }

    // تحديث الأرقام عند فتح الصفحة
    updateDisplay();
</script>

</body>
</html>
