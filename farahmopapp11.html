<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة فرح للمطابخ 2026 | الإدارة الشاملة</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #34495e;
            --bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 18px;
        }

        .main-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: 420px 420px auto; 
            gap: 15px;
            flex-grow: 1;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #bdc3c7;
        }

        .card-header {
            background: var(--accent);
            color: white;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-section {
            grid-column: span 2;
            min-height: 300px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
            background: #fff;
        }

        .btn-open {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary);
            border: none;
            padding: 4px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-open:hover {
            background: #fff;
            transform: scale(1.05);
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .card { height: 450px; }
            .report-section { grid-column: span 1; }
        }
    </style>
</head>
<body>

<header>🚀 منظومة فرح للمطابخ - لوحة التحكم الموحدة 2026</header>

<div class="main-container">
    
    <div class="card">
        <div class="card-header" style="background: #8e44ad;">
            <span>💰 ملخص الاتفاقيات وديون الزبائن</span>
            <a href="zbon.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="zbon.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #d35400;">
            <span>💸 حركة الخزينة (يوميات الورشة)</span>
            <a href="yom.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="yom.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #128C7E;">
            <span>👷 تقرير العمال الأسبوعي (الغياب والرواتب)</span>
            <a href="gyab.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="gyab.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #2980b9;">
            <span>📅 مواعيد الاستلام (التسليمات)</span>
            <a href="tslem.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="tslem.html"></iframe>
    </div>

    <div class="card report-section">
        <div class="card-header" style="background: #c0392b;">
            <span>📊 مركز التقارير والإحصائيات العام</span>
            <a href="takarer.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

</body>
</html>
