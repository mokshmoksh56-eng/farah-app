<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول نظام أزيماء</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .login-box { background: #1e293b; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 2px solid #6e8efb; }
        input { padding: 12px; width: 220px; border-radius: 10px; border: none; margin-bottom: 20px; font-size: 20px; text-align: center; letter-spacing: 5px; -webkit-text-security: disc; }
        button { background: linear-gradient(135deg, #6e8efb, #a777e3); color: white; border: none; padding: 12px 30px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        #msg { color: #ff7675; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🚀 azemaa pro</h2>
    <p>أدخل الرقم السري للمتابعة</p>
    <input type="text" id="passCode" placeholder="****" maxlength="4" inputmode="numeric">
    <button onclick="verify()">دخول النظام</button>
    <div id="msg"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const passInput = document.getElementById('passCode');

    window.verify = async function() {
        const input = passInput.value;
        const msg = document.getElementById('msg');
        try {
            const snapshot = await get(ref(db, 'passcode'));
            if (snapshot.exists() && input == snapshot.val()) {
                sessionStorage.setItem("isAllowed", "true");
                // التعديل الجوهري: التوجيه للملف في نفس المجلد مهما كان رابط الموقع
                window.location.replace("./index.html");
            } else {
                msg.innerText = "الرقم السري خطأ!";
            }
        } catch (e) { msg.innerText = "خطأ في الاتصال"; }
    }
</script>
</body>
</html>
