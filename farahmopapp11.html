<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro - Secure Edition</title>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366;
            --cloud-blue: #00a8ff;
            --card-radius: 20px;
        }

        body.dark-mode {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 12px; background: var(--bg-main); 
            color: var(--text-color); display: flex; flex-direction: column; 
            gap: 15px; transition: 0.3s; 
        }

        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
        }

        .lock-box {
            background: var(--card-bg); padding: 40px 30px; border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); text-align: center;
            width: 320px; border: 2px solid var(--cloud-blue);
        }

        #pass-input {
            width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #ddd;
            border-radius: 12px; text-align: center; font-size: 1.5rem;
            box-sizing: border-box; outline: none; background: var(--bg-main);
            color: var(--text-color);
        }

        .btn-unlock {
            background: var(--header-grad); color: white; border: none;
            padding: 12px; border-radius: 12px; cursor: pointer;
            font-weight: bold; width: 100%; font-size: 1.1rem;
        }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 10px 15px; 
            border-radius: var(--card-radius); display: flex; 
            justify-content: space-between; align-items: center;
        }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { 
            border: none; color: #fff; padding: 15px; border-radius: 15px; 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-cloud { background: var(--cloud-blue); }

        .main-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
        
        .card { 
            background: var(--card-bg); border-radius: var(--card-radius); height: 420px; 
            display: flex; flex-direction: column; overflow: hidden; position: relative; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent;
        }
        
        .card-zbon { border-color: #ff7675; } .h-zbon { background: #ff7675; }
        .card-yom { border-color: #00cec9; } .h-yom { background: #00cec9; }
        .card-gyab { border-color: #6c5ce7; } .h-gyab { background: #6c5ce7; }
        .card-tslem { border-color: #e17055; } .h-tslem { background: #e17055; }
        .card-notmop { border-color: #fbc531; } .h-notmop { background: #fbc531; color: #2d3436; }
        .card-takarer { border-color: #0984e3; } .h-takarer { background: #0984e3; }

        .h { padding: 15px 20px; font-size: 14px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <h2>🚀 azemaa pro</h2>
        <input type="password" id="pass-input" placeholder="أدخل كود التفعيل" autofocus>
        <button class="btn-unlock" id="unlock-btn">تأكيد الدخول</button>
        <p id="lock-msg" style="color: #ff7675; display: none; font-weight: bold; margin-top: 10px;">⚠️ الكود غير صحيح!</p>
    </div>
</div>

<header>
    <div>
        <span style="font-weight: bold;">🚀 azemaa pro</span>
        <div id="digital-clock" style="font-size: 0.8rem;">00:00:00</div>
    </div>
    <button onclick="toggleTheme()" style="background:none; border:1px solid #fff; color:#fff; border-radius:10px; padding:5px 10px; cursor:pointer;">🌙 تبديل الوضع</button>
</header>

<div class="sync-box">
    <button id="cloud-save-btn" class="btn btn-cloud">☁️ حفظ سحابي</button>
    <button id="cloud-load-btn" class="btn btn-cloud">🔄 استرجاع</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتساب</button>
    <button onclick="location.reload()" class="btn btn-whatsapp">🔃 خروج/تحديث</button>
</div>

<div class="main-container">
    <div class="card card-zbon"><div class="h h-zbon"><span>👤 الزبائن</span></div><iframe src="zbon.html"></iframe></div>
    <div class="card card-yom"><div class="h h-yom"><span>💸 الخزينة</span></div><iframe src="yom.html"></iframe></div>
    <div class="card card-gyab"><div class="h h-gyab"><span>👷 العمال</span></div><iframe src="gyab.html"></iframe></div>
    <div class="card card-tslem"><div class="h h-tslem"><span>📅 التسليم</span></div><iframe src="tslem.html"></iframe></div>
    <div class="card card-notmop"><div class="h h-notmop"><span>📝 الملاحظات</span></div><iframe src="notmop.html"></iframe></div>
    <div class="card card-takarer"><div class="h h-takarer"><span>📊 التقارير</span></div><iframe src="takarer.html"></iframe></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDmPciW_QPM4vwcMLX2M44_C0a8jqHdPjU",
        authDomain: "azemaa-proo.firebaseapp.com",
        databaseURL: "https://azemaa-proo-default-rtdb.firebaseio.com",
        projectId: "azemaa-proo",
        storageBucket: "azemaa-proo.firebasestorage.app",
        messagingSenderId: "787350492977",
        appId: "1:787350492977:web:84061dcf31622fcb07c210"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- 1. وظيفة التفعيل (تطلب الكود في كل مرة تفتح فيها الصفحة) ---
    async function handleUnlock() {
        const code = document.getElementById('pass-input').value.trim();
        if(!code) return;
        
        try {
            const snapshot = await get(ref(db, `activations/${code}`));
            if (snapshot.exists()) {
                // تخزين مؤقت للجلسة الحالية فقط
                sessionStorage.setItem('current_active_code', code);
                document.getElementById('lock-screen').style.display = "none";
            } else {
                document.getElementById('lock-msg').style.display = "block";
                document.getElementById('pass-input').value = "";
            }
        } catch (e) {
            alert("تأكد من الإنترنت!");
        }
    }
    document.getElementById('unlock-btn').onclick = handleUnlock;
    document.getElementById('pass-input').onkeypress = (e) => { if(e.key === 'Enter') handleUnlock(); };

    // --- 2. الحفظ السحابي (يرسل البيانات لمجلد users/code/data) ---
    document.getElementById('cloud-save-btn').onclick = async () => {
        const userId = sessionStorage.getItem('current_active_code');
        if(!userId) return alert("❌ الرجاء إدخال كود التفعيل أولاً!");

        let data = {};
        for (let i = 0; i < localStorage.length; i++) {
            let k = localStorage.key(i);
            // نستبعد مفاتيح النظام ونأخذ البيانات فقط
            if(!['user_id', 'theme', 'user_name', 'current_active_code'].includes(k)) {
                let cleanKey = k.replace(/[.#$[\]]/g, '_');
                data[cleanKey] = localStorage.getItem(k);
            }
        }

        try {
            await set(ref(db, `users/${userId}/data`), data);
            alert("✅ تم الحفظ بنجاح لمجلد العميل: " + userId);
        } catch (e) {
            alert("❌ فشل الحفظ! راجع صلاحيات Firebase Rules");
        }
    };

    // --- 3. الاسترجاع ---
    document.getElementById('cloud-load-btn').onclick = async () => {
        const userId = sessionStorage.getItem('current_active_code');
        if(!userId) return alert("❌ كود التفعيل غير مفقود!");

        const snapshot = await get(child(ref(db), `users/${userId}/data`));
        if (snapshot.exists()) {
            const d = snapshot.val();
            for (let k in d) localStorage.setItem(k, d[k]);
            alert("🔄 تم استرجاع بياناتك السحابية!");
            location.reload();
        } else {
            alert("❌ لا توجد بيانات محفوظة لهذا الكود");
        }
    };
</script>

<script>
    function toggleTheme() { document.body.classList.toggle('dark-mode'); }
    setInterval(() => {
        document.getElementById('digital-clock').innerText = new Date().toLocaleTimeString('ar-EG');
    }, 1000);
</script>

</body>
</html>
