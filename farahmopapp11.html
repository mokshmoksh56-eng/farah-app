<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZEMAA PRO - Cyber Night Edition</title>
    <style>
        :root { 
            --bg-main: #eef2f7; 
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --header-grad: linear-gradient(135deg, #6e8efb, #a777e3);
            --whatsapp-green: #25D366;
            --cloud-blue: #00a8ff;
            --card-radius: 20px;
        }

        /* تنسيقات الوضع الليلي */
        body.dark-mode {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 15px; background: var(--bg-main); 
            color: var(--text-color); display: flex; flex-direction: column; 
            gap: 15px; transition: 0.3s; 
        }
        
        header { 
            background: var(--header-grad); color: #fff; padding: 12px 20px; 
            border-radius: var(--card-radius); display: flex; 
            justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(110, 142, 251, 0.2);
        }

        .header-info { display: flex; flex-direction: column; align-items: flex-start; }
        #digital-clock { font-size: 1.2rem; font-weight: bold; font-family: 'Segoe UI', monospace; }
        #countdown { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; color: #fff; font-weight: bold; }

        .header-btns { display: flex; gap: 8px; }

        .theme-btn, .calc-trigger-btn {
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            color: #fff; padding: 8px 15px; border-radius: 12px; cursor: pointer; font-size: 0.8rem;
            display: flex; align-items: center; gap: 5px; transition: 0.2s;
        }
        .theme-btn:hover, .calc-trigger-btn:hover { background: rgba(255,255,255,0.3); }

        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { 
            border: none; color: #fff; padding: 15px; border-radius: 15px; 
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-whatsapp { background: var(--whatsapp-green); box-shadow: 0 5px 15px rgba(37, 211, 102, 0.2); }
        .btn-cloud { background: var(--cloud-blue); box-shadow: 0 5px 15px rgba(0, 168, 255, 0.2); }

        .main-container { display: flex; flex-direction: column; gap: 30px; margin-top: 10px; }
        
        .card { 
            background: var(--card-bg); border-radius: var(--card-radius); height: 420px; 
            display: flex; flex-direction: column; overflow: hidden; position: relative; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.1); border: 3px solid transparent; transition: 0.3s;
        }
        
        /* ألوان البراويز */
        .card-zbon { border-color: #ff7675; } .h-zbon { background: #ff7675; }
        .card-yom { border-color: #00cec9; } .h-yom { background: #00cec9; }
        .card-gyab { border-color: #6c5ce7; } .h-gyab { background: #6c5ce7; }
        .card-tslem { border-color: #e17055; } .h-tslem { background: #e17055; }
        .card-notmop { border-color: #fbc531; } .h-notmop { background: #fbc531; color: #2d3436; }
        .card-takarer { border-color: #0984e3; } .h-takarer { background: #0984e3; }

        .overlay { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; background: transparent; z-index: 5; cursor: pointer; }
        .h { padding: 15px 20px; font-size: 14px; font-weight: bold; color: #fff; display: flex; justify-content: space-between; align-items: center; z-index: 10; }

        iframe { flex: 1; border: none; width: 100%; height: 100%; background: #fff; pointer-events: none; }
        body.dark-mode iframe { filter: invert(0) hue-rotate(0deg); }

        .zoom-btn { background: rgba(255,255,255,0.25); color: inherit; border: none; padding: 6px 14px; border-radius: 12px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; margin: 0; border: none; }
        .card.fullscreen .overlay { display: none; }
        .card.fullscreen iframe { pointer-events: auto; }

        /* نافذة الآلة الحاسبة الهندسية العائمة */
        .calc-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--card-bg); border: 2px solid var(--cloud-blue); padding: 15px;
            border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); z-index: 10000; width: 360px;
        }
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: bold; font-size: 0.9rem; }
        .calc-close { cursor: pointer; background: #ff7675; border: none; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; }
        #calc-screen {
            width: 100%; height: 60px; background: #2d3436; color: #00cec9; border: none; text-align: left;
            padding: 10px; font-size: 1.4rem; border-radius: 10px; margin-bottom: 12px; box-sizing: border-box; font-family: monospace;
            direction: ltr;
        }
        body.dark-mode #calc-screen { background: #0f172a; color: #00ffcc; }
        
        .calc-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .calc-btn {
            padding: 12px 6px; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px;
            cursor: pointer; background: #e2e8f0; color: #2d3436; transition: 0.15s; text-align: center;
        }
        body.dark-mode .calc-btn { background: #334155; color: #f1f5f9; }
        .calc-btn:active { transform: scale(0.95); }
        
        .calc-btn.sci { background: #74b9ff; color: #fff; font-size: 0.85rem; }
        body.dark-mode .calc-btn.sci { background: #0984e3; color: #fff; }
        
        .calc-btn.op { background: #fdcb6e; color: #2d3436; }
        .calc-btn.eq { background: var(--cloud-blue); color: white; grid-column: span 1; }
        .calc-btn.clear { background: #ff7675; color: white; }
        .calc-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 9999; }
    </style>
</head>
<body>

<header>
    <div class="header-info">
        <div id="digital-clock">00:00:00 ص</div>
        <div id="countdown">جرٍ حساب المناسبات القادمة...</div>
    </div>
    <div class="header-btns">
        <button class="calc-trigger-btn" onclick="toggleCalc(true)">🧮 آلة حاسبة هندسية</button>
        <button class="theme-btn" onclick="toggleTheme()">🌙 وضع ليلي</button>
    </div>
</header>

<!-- الـ Overlay والنافذة الخاصة بالآلة الحاسبة -->
<div class="calc-overlay" id="calcOverlay" onclick="toggleCalc(false)"></div>
<div class="calc-modal" id="calcModal">
    <div class="calc-header">
        <span>📐 آلة حاسبة هندسية (PRO)</span>
        <button class="calc-close" onclick="toggleCalc(false)">✕</button>
    </div>
    <input type="text" id="calc-screen" readonly value="0">
    <div class="calc-grid">
        <button class="calc-btn sci" onclick="pressSci('sin')">sin</button>
        <button class="calc-btn sci" onclick="pressSci('cos')">cos</button>
        <button class="calc-btn sci" onclick="pressSci('tan')">tan</button>
        <button class="calc-btn sci" onclick="pressCalc('(')">(</button>
        <button class="calc-btn sci" onclick="pressCalc(')')">)</button>

        <button class="calc-btn sci" onclick="pressSci('log')">log</button>
        <button class="calc-btn sci" onclick="pressSci('ln')">ln</button>
        <button class="calc-btn sci" onclick="pressCalc('^')">^</button>
        <button class="calc-btn sci" onclick="calcSquareRoot()">√</button>
        <button class="calc-btn sci" onclick="pressSci('pi')">π</button>

        <button class="calc-btn clear" onclick="clearCalc()">C</button>
        <button class="calc-btn op" onclick="pressCalc('/')">÷</button>
        <button class="calc-btn op" onclick="pressCalc('*')">×</button>
        <button class="calc-btn op" onclick="pressCalc('-')">-</button>
        <button class="calc-btn op" onclick="pressCalc('%')">%</button>
        
        <button class="calc-btn" onclick="pressCalc('9')">9</button>
        <button class="calc-btn" onclick="pressCalc('8')">8</button>
        <button class="calc-btn" onclick="pressCalc('7')">7</button>
        <button class="calc-btn op" onclick="pressCalc('+')" style="grid-row: span 2; height: 100%;">+</button>
        <button class="calc-btn" onclick="backspaceCalc()">⌫</button>
        
        <button class="calc-btn" onclick="pressCalc('6')">6</button>
        <button class="calc-btn" onclick="pressCalc('5')">5</button>
        <button class="calc-btn" onclick="pressCalc('4')">4</button>
        <button class="calc-btn sci" onclick="pressSci('exp')">e</button>
        
        <button class="calc-btn" onclick="pressCalc('3')">3</button>
        <button class="calc-btn" onclick="pressCalc('2')">2</button>
        <button class="calc-btn" onclick="pressCalc('1')">1</button>
        <button class="calc-btn eq" onclick="calculateResult()" style="grid-row: span 2; height: 100%; font-size: 1.5rem;">=</button>
        <button class="calc-btn sci" onclick="pressSci('inv')">1/x</button>
        
        <button class="calc-btn" onclick="pressCalc('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="pressCalc('.')">.</button>
        <button class="calc-btn sci" onclick="pressSci('fact')">x!</button>
    </div>
</div>

<div class="sync-box">
    <button onclick="saveToCloud()" class="btn btn-cloud">☁️ حفظ سحابي</button>
    <button onclick="loadFromCloud()" class="btn btn-cloud">🔄 استرجاع</button>
    <button onclick="saveToWhatsApp()" class="btn btn-whatsapp">🟢 واتساب (نسخ)</button>
    <button onclick="loadFromWhatsApp()" class="btn btn-whatsapp">📥 يدوي</button>
</div>

<div class="main-container">
    <div class="card card-zbon" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-zbon"><span>👤 القسم الرئيسي</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="zbon.html"></iframe>
    </div>
    <div class="card card-yom" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-yom"><span>💸 الخزينة</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="yom.html"></iframe>
    </div>
    <div class="card card-gyab" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-gyab"><span>👷 العمال</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="gyab.html"></iframe>
    </div>
    <div class="card card-tslem" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-tslem"><span>📅 التسليم</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="tslem.html"></iframe>
    </div>
    <div class="card card-notmop" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-notmop"><span>📝 الملاحظات</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="notmop.html"></iframe>
    </div>
    <div class="card card-takarer" ondblclick="toggleZoom(this)">
        <div class="overlay"></div>
        <div class="h h-takarer"><span>📊 التقارير</span><button class="zoom-btn" onclick="toggleZoom(this.closest('.card'))">⛶ تكبير</button></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    // 1. إدارة الوقت والعد التنازلي بالأيام فقط للمناسبات الرسمية والدينية في مصر
    const holidays = [
        { name: "عيد الأضحى المبارك 🐑", date: new Date("May 27, 2026 00:00:00").getTime() },
        { name: "ثورة 30 يونيو 🇪🇬", date: new Date("June 30, 2026 00:00:00").getTime() },
        { name: "رأس السنة الهجرية 🌙", date: new Date("June 16, 2026 00:00:00").getTime() },
        { name: "عيد ثورة 23 يوليو 🇪🇬", date: new Date("July 23, 2026 00:00:00").getTime() },
        { name: "المولد النبوي الشريف 🕌", date: new Date("September 5, 2026 00:00:00").getTime() },
        { name: "عيد القوات المسلحة (6 أكتوبر) 🪖", date: new Date("October 6, 2026 00:00:00").getTime() },
        { name: "رأس السنة الميلادية 2027 🎄", date: new Date("January 1, 2027 00:00:00").getTime() },
        { name: "عيد الميلاد المجيد ⛪", date: new Date("January 7, 2027 00:00:00").getTime() },
        { name: "عيد الشرطة وثورة 25 يناير 🇪🇬", date: new Date("January 25, 2027 00:00:00").getTime() },
        { name: "شهر رمضان المبارك 🌙", date: new Date("February 8, 2027 00:00:00").getTime() },
        { name: "عيد الفطر المبارك ✨", date: new Date("March 10, 2027 00:00:00").getTime() },
        { name: "عيد تحرير سيناء 🦅", date: new Date("April 25, 2027 00:00:00").getTime() },
        { name: "عيد العمال 🛠️", date: new Date("May 1, 2027 00:00:00").getTime() },
        { name: "شم النسيم 🐟", date: new Date("May 3, 2027 00:00:00").getTime() }
    ];

    function updateHeader() {
        const now = new Date();
        document.getElementById('digital-clock').innerHTML = now.toLocaleTimeString('ar-EG', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
        
        // البحث عن أقرب مناسبة قادمة
        const nextHoliday = holidays.find(h => h.date > now.getTime()) || holidays[0];
        const diff = nextHoliday.date - now.getTime();
        
        // حساب عدد الأيام المتبقية مع التقريب للأعلى ليعطي اليوم الفعلي بدقة
        const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
        
        if (days <= 0) {
            document.getElementById('countdown').innerHTML = `اليوم هو ${nextHoliday.name} 🎉`;
        } else {
            document.getElementById('countdown').innerHTML = `باقي ${days} يوم على ${nextHoliday.name}`;
        }
    }
    setInterval(updateHeader, 1000);
    updateHeader();

    // 2. الوضع الليلي
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        document.querySelector('.theme-btn').innerHTML = isDark ? "☀️ وضع فاتح" : "🌙 وضع ليلي";
    }
    if (localStorage.getItem('theme') === 'dark') toggleTheme();

    // 3. التحكم بالآلة الحاسبة الهندسية
    const calcModal = document.getElementById('calcModal');
    const calcOverlay = document.getElementById('calcOverlay');
    const calcScreen = document.getElementById('calc-screen');

    function toggleCalc(show) {
        calcModal.style.display = show ? 'block' : 'none';
        calcOverlay.style.display = show ? 'block' : 'none';
        if(show) clearCalc();
    }

    function pressCalc(val) {
        if (calcScreen.value === '0' && !isNaN(val) && val !== '.') {
            calcScreen.value = val;
        } else {
            if (calcScreen.value === '0' && val === '0') return;
            calcScreen.value += val;
        }
    }

    function clearCalc() { calcScreen.value = '0'; }
    
    function backspaceCalc() {
        calcScreen.value = calcScreen.value.slice(0, -1);
        if (calcScreen.value === '') calcScreen.value = '0';
    }

    function calcSquareRoot() {
        try {
            let expr = parseExpression(calcScreen.value);
            let currentVal = eval(expr);
            if (currentVal < 0) throw new Error();
            calcScreen.value = Number(Math.sqrt(currentVal).toFixed(6));
        } catch (e) {
            showError();
        }
    }

    function pressSci(type) {
        try {
            let expr = parseExpression(calcScreen.value);
            let currentVal = eval(expr);
            
            switch(type) {
                case 'sin':
                    calcScreen.value = Number(Math.sin(currentVal * Math.PI / 180).toFixed(6));
                    break;
                case 'cos':
                    calcScreen.value = Number(Math.cos(currentVal * Math.PI / 180).toFixed(6));
                    break;
                case 'tan':
                    calcScreen.value = Number(Math.tan(currentVal * Math.PI / 180).toFixed(6));
                    break;
                case 'log':
                    if(currentVal <= 0) throw new Error();
                    calcScreen.value = Number(Math.log10(currentVal).toFixed(6));
                    break;
                case 'ln':
                    if(currentVal <= 0) throw new Error();
                    calcScreen.value = Number(Math.log(currentVal).toFixed(6));
                    break;
                case 'pi':
                    if(calcScreen.value === '0') calcScreen.value = Math.PI.toFixed(6);
                    else calcScreen.value += Math.PI.toFixed(6);
                    break;
                case 'exp':
                    if(calcScreen.value === '0') calcScreen.value = Math.E.toFixed(6);
                    else calcScreen.value += Math.E.toFixed(6);
                    break;
                case 'inv':
                    if(currentVal === 0) throw new Error();
                    calcScreen.value = Number((1 / currentVal).toFixed(6));
                    break;
                case 'fact':
                    if(currentVal < 0 || currentVal % 1 !== 0) throw new Error();
                    calcScreen.value = factorial(currentVal);
                    break;
            }
        } catch (e) {
            showError();
        }
    }

    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function parseExpression(str) {
        return str.replace(/×/g, '*')
                  .replace(/÷/g, '/')
                  .replace(/\^/g, '**')
                  .replace(/%/g, '/100');
    }

    function calculateResult() {
        try {
            let expression = parseExpression(calcScreen.value);
            let result = eval(expression);
            if (result === Infinity || isNaN(result)) throw new Error();
            calcScreen.value = Number(result.toFixed(6));
        } catch (e) {
            showError();
        }
    }

    function showError() {
        calcScreen.value = 'Error';
        setTimeout(clearCalc, 1200);
    }

    // 4. التكبير والحفظ
    function toggleZoom(card) {
        if (card.classList.contains('fullscreen')) {
            card.classList.remove('fullscreen');
            card.querySelector('.zoom-btn').innerText = "⛶ تكبير";
        } else {
            document.querySelectorAll('.card.fullscreen').forEach(c => c.classList.remove('fullscreen'));
            card.classList.add('fullscreen');
            card.querySelector('.zoom-btn').innerText = "✕ إغلاق";
            history.pushState({view: 'full'}, "");
        }
    }
    window.onpopstate = () => document.querySelectorAll('.card.fullscreen').forEach(c => c.classList.remove('fullscreen'));

    function generateBackupCode() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { let k = localStorage.key(i); if(k!=='theme') data[k] = localStorage.getItem(k); }
        return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }
    function saveToWhatsApp() { window.location.href = `whatsapp://send?text=*AZ-BACKUP*\n${generateBackupCode()}`; }
    function loadFromWhatsApp() {
        let input = prompt("الصق الكود:"); if (!input) return;
        try {
            let clean = input.includes('*AZ-BACKUP*') ? input.split('*AZ-BACKUP*\n')[1] : input;
            let obj = JSON.parse(decodeURIComponent(escape(atob(clean.trim()))));
            localStorage.clear(); for (let k in obj) localStorage.setItem(k, obj[k]); location.reload();
        } catch (e) { alert("خطأ في الكود"); }
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFlHpOc1M", authDomain: "farah-kitchen.firebaseapp.com", databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com", projectId: "farah-kitchen", appId: "1:702572851072:web:320a92c9430abba6b71b65" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    window.saveToCloud = async function() {
        let data = {}; for (let i = 0; i < localStorage.length; i++) { let k = localStorage.key(i); if(k!=='theme') data[k.replace(/[.#$[\]]/g, '_')] = localStorage.getItem(k); }
        await set(ref(db, 'backups/azemaa_main'), data); alert("✅ تم الحفظ سحابياً");
    };
    window.loadFromCloud = async function() {
        const s = await get(child(ref(db), 'backups/azemaa_main'));
        if (s.exists()) { localStorage.clear(); const d = s.val(); for (let k in d) localStorage.setItem(k, d[k]); location.reload(); }
    };
</script>
</body>
</html>
