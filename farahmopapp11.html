<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro | الإدارة الشاملة</title>
    <style>
        :root { 
            --primary: #2c3e50; 
            --whatsapp: #25D366; 
            --restore: #e67e22; 
            --bg: #ecf0f1; 
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            margin: 0; 
            padding: 10px; 
            background-color: var(--bg); 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
        }

        header { 
            background: var(--primary); 
            color: white; 
            padding: 12px; 
            text-align: center; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            font-weight: bold; 
            font-size: 18px; 
        }

        /* --- أزرار الواتساب (فوق بعض) --- */
        .sync-container { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            margin-bottom: 15px; 
        }

        .sync-btn { 
            text-decoration: none; 
            color: white; 
            padding: 10px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 14px; 
            font-weight: bold; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 10px; 
            border: none; 
            cursor: pointer; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.1);
        }

        .btn-send { background-color: var(--whatsapp); }
        .btn-restore { background-color: var(--restore); }
        .ver-no { background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 4px; font-size: 12px; }

        /* --- ترتيب الصفحات فوق بعض --- */
        .main-container { 
            display: flex;
            flex-direction: column; /* ترتيب طولي */
            gap: 15px; 
        }

        .card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 450px; /* ارتفاع مناسب للموبايل */
            border: 2px solid #bdc3c7; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card-header { 
            background: #34495e; 
            color: white; 
            padding: 10px 15px; 
            font-size: 14px; 
            font-weight: bold; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        .btn-open {
            background: #fff;
            color: var(--primary);
            text-decoration: none;
            padding: 3px 10px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header id="main-header">🚀 azemaa pro للبرمجيات</header>

<div class="sync-container">
    <button onclick="exportShort()" class="sync-btn btn-send">
        <span>📤 حفظ نسخة (إرسال كود مشفر)</span>
        <span class="ver-no" id="next-ver">1</span>
    </button>

    <button onclick="importShort()" class="sync-btn btn-restore">
        <span>📥 استرجاع (لصق كود من الواتساب)</span>
        <span class="ver-no" id="last-ver">0</span>
    </button>
</div>

<div class="main-container">
    <div class="card">
        <div class="card-header" style="background: #8e44ad;">
            <span>💰 الديون والاتفاقيات</span>
            <a href="zbon.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="zbon.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #d35400;">
            <span>💸 حركة الخزينة اليومية</span>
            <a href="yom.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="yom.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #128C7E;">
            <span>👷 تقرير العمال والرواتب</span>
            <a href="gyab.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="gyab.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #2980b9;">
            <span>📅 مواعيد الاستلام</span>
            <a href="tslem.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="tslem.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #c0392b;">
            <span>📊 مركز التقارير العام</span>
            <a href="takarer.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    let currentVer = parseInt(localStorage.getItem('az_v')) || 0;

    function updateUI() {
        document.getElementById('last-ver').innerText = `آخر نسخة: ${currentVer}`;
        document.getElementById('next-ver').innerText = `رقم: ${currentVer + 1}`;
    }

    function exportShort() {
        const data = JSON.stringify(localStorage);
        const code = btoa(unescape(encodeURIComponent(data)));
        currentVer++;
        localStorage.setItem('az_v', currentVer);
        updateUI();
        // رسالة صغيرة جداً للواتساب
        const msg = `AZ[${currentVer}]:%0A${code}`;
        window.location.href = `whatsapp://send?text=${msg}`;
    }

    function importShort() {
        let input = prompt("الصق كود التشفير المنسوخ من الواتساب:");
        if (!input) return;
        if (input.includes(':')) input = input.split(':')[1].trim();
        try {
            const decoded = decodeURIComponent(escape(atob(input)));
            const dataObj = JSON.parse(decoded);
            localStorage.clear();
            Object.keys(dataObj).forEach(k => localStorage.setItem(k, dataObj[k]));
            alert("✅ تم الاسترجاع بنجاح!");
            location.reload();
        } catch (e) {
            alert("❌ الكود غير صحيح أو ناقص.");
        }
    }

    document.getElementById('main-header').innerText = `🚀 azemaa pro ${new Date().getFullYear()}`;
    updateUI();
</script>

</body>
</html>
