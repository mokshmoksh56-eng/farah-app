<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>azemaa pro | المزامنة الذكية</title>
    <style>
        :root { --p: #2c3e50; --w: #25D366; --r: #e67e22; --bg: #ecf0f1; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: var(--bg); display: flex; flex-direction: column; }
        header { background: var(--p); color: #fff; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
        .sync-box { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
        .btn { border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-s { background: var(--w); }
        .btn-r { background: var(--r); }
        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #fff; border-radius: 10px; height: 450px; border: 1px solid #ccc; display: flex; flex-direction: column; overflow: hidden; }
        .h { background: #34495e; color: #fff; padding: 10px; font-size: 13px; font-weight: bold; text-align: center; }
        iframe { flex: 1; border: none; }
    </style>
</head>
<body>

<header>🚀 azemaa pro</header>

<div class="sync-box">
    <button onclick="s()" class="btn btn-s">📤 إرسال الكود المختصر</button>
    <button onclick="l()" class="btn btn-r">📥 استرجاع من الكود</button>
</div>

<div class="main-container">
    <div class="card"><div class="h">💰 الديون</div><iframe src="zbon.html"></iframe></div>
    <div class="card"><div class="h">💸 الخزينة</div><iframe src="yom.html"></iframe></div>
    <div class="card"><div class="h">👷 العمال</div><iframe src="gyab.html"></iframe></div>
    <div class="card"><div class="h">📅 التسليم</div><iframe src="tslem.html"></iframe></div>
    <div class="card"><div class="h">📊 التقارير</div><iframe src="takarer.html"></iframe></div>
</div>

<script>
    // وظيفة الضغط والحفظ
    function s() {
        let d = JSON.stringify(localStorage);
        // تحويل النص لكود مشفر مضغوط
        let c = btoa(unescape(encodeURIComponent(d)));
        
        // إرسال الكود فقط للواتساب لتقليل الحجم
        window.location.href = `whatsapp://send?text=AZ:${c}`;
    }

    // وظيفة فك الضغط والاسترجاع
    function l() {
        let i = prompt("الصق الكود المنسوخ:");
        if (!i) return;
        if (i.includes(':')) i = i.split(':')[1].trim();

        try {
            let d = decodeURIComponent(escape(atob(i)));
            let o = JSON.parse(d);
            localStorage.clear();
            for (let k in o) localStorage.setItem(k, o[k]);
            alert("✅ تم الاسترجاع");
            location.reload();
        } catch (e) {
            alert("❌ الكود ناقص أو غير صحيح");
        }
    }
</script>

</body>
</html>
