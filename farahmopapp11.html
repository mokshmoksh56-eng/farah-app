<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro</title>
    <style>
        :root { --p: #2c3e50; --w: #25D366; --r: #e67e22; --e: #3498db; --bg: #ecf0f1; --deep-red: #8b0000; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: var(--bg); display: flex; flex-direction: column; }
        header { background: var(--p); color: #fff; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem; }
        
        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        .btn-s { background: var(--w); }
        .btn-e { background: var(--e); }
        .btn-r { background: var(--r); grid-column: span 2; margin-top: 5px; }

        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #fff; border-radius: 10px; height: 400px; border: 1px solid #ccc; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        .h { background: #34495e; color: #fff; padding: 8px 15px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .h.notes-header { background: var(--deep-red); }
        .zoom-btn { background: #555; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; margin: 0; }
    </style>
</head>
<body>

<header>🚀 Azemaa Pro للبرمجيات</header>

<div class="sync-box">
    <button onclick="saveToWhatsApp()" class="btn btn-s">📤 واتساب</button>
    <button onclick="saveToEmail()" class="btn btn-e">📧 إيميل</button>
    <button onclick="loadData()" class="btn btn-r">📥 استرجاع البيانات</button>
</div>

<div class="main-container">
    <div class="card">
        <div class="h" ondblclick="openPage(this)"><span>👤 القسم الرئيسي</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div>
        <iframe src="zbon.html"></iframe>
    </div>
    <div class="card">
        <div class="h" ondblclick="openPage(this)"><span>💸 الخزينة</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div>
        <iframe src="yom.html"></iframe>
    </div>
    <div class="card">
        <div class="h" ondblclick="openPage(this)"><span>👷 العمال</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div>
        <iframe src="gyab.html"></iframe>
    </div>
    <div class="card">
        <div class="h" ondblclick="openPage(this)"><span>📅 التسليم</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div>
        <iframe src="tslem.html"></iframe>
    </div>
    <div class="card">
        <div class="h notes-header" ondblclick="openPage(this)"><span>📝 الملاحظات والورشة</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div>
        <iframe src="notmop.html"></iframe>
    </div>
    <div class="card">
        <div class="h" ondblclick="openPage(this)"><span>📊 التقارير</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>

<script>
    // 1. إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
        authDomain: "farah-kitchen.firebaseapp.com",
        databaseURL: "https://farah-kitchen-default-rtdb.firebaseio.com",
        projectId: "farah-kitchen",
        storageBucket: "farah-kitchen.firebasestorage.app",
        messagingSenderId: "702572851072",
        appId: "1:702572851072:web:320a92c9430abba6b71b65",
        measurementId: "G-KXQ64CGXL8"
    };

    // 2. تشغيل الاتصال
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 3. إرسال إشارة النجاح للسحابة (للتأكد من الاتصال)
    database.ref("connection_status").set({
        message: "Azemaa Pro is now Online!",
        time: new Date().toLocaleString()
    });

    // 4. وظائف التطبيق الأساسية
    const keysMap = { '"name":': '"n":', '"price":': '"p":', '"date":': '"d":', '"amount":': '"a":' };

    function generateBackupCode() {
        let data = {};
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            data[key] = localStorage.getItem(key);
        }
        let compressed = JSON.stringify(data);
        for (let [full, short] of Object.entries(keysMap)) {
            compressed = compressed.split(full).join(short);
        }
        return btoa(unescape(encodeURIComponent(compressed)));
    }

    function saveToWhatsApp() {
        let code = generateBackupCode();
        window.location.href = `whatsapp://send?text=*AZ-BACKUP*\n${code}`;
    }

    function saveToEmail() {
        let code = generateBackupCode();
        let subject = encodeURIComponent("نسخة احتياطية Azemaa Pro");
        let body = encodeURIComponent("كود الاسترجاع:\n\n" + code);
        window.location.href = `mailto:?subject=${subject}&body=${body}`;
    }

    function loadData() {
        let input = prompt("الصق الكود هنا:");
        if (!input) return;
        try {
            let cleanCode = input.trim().replace(/\s+/g, '');
            let decoded = decodeURIComponent(escape(atob(cleanCode)));
            for (let [full, short] of Object.entries(keysMap)) {
                decoded = decoded.split(short).join(full);
            }
            let obj = JSON.parse(decoded);
            if (confirm("استبدال البيانات؟")) {
                localStorage.clear();
                for (let k in obj) localStorage.setItem(k, obj[k]);
                location.reload();
            }
        } catch (e) { alert("❌ كود غير صحيح."); }
    }

    function openPage(headerElement) {
        let iframe = headerElement.parentElement.querySelector('iframe');
        if (iframe) window.open(iframe.src, '_blank');
    }

    function toggleZoom(btn) {
        let card = btn.closest('.card');
        if (card.classList.contains('fullscreen')) {
            closeFullscreen();
        } else {
            card.classList.add('fullscreen');
            btn.innerText = "إغلاق X";
            history.pushState({view: 'fullscreen'}, "");
        }
    }

    function closeFullscreen() {
        let fullCard = document.querySelector('.card.fullscreen');
        if (fullCard) {
            fullCard.classList.remove('fullscreen');
            let btn = fullCard.querySelector('.zoom-btn');
            if(btn) btn.innerText = "تكبير ⛶";
        }
    }

    window.onpopstate = function() { closeFullscreen(); };
</script>

</body>
</html>
