<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azemaa Pro - لوحة المدير</title>
    <style>
        :root { --p: #2c3e50; --w: #25D366; --r: #e67e22; --e: #3498db; --bg: #ecf0f1; --deep-red: #8b0000; }
        body { font-family: sans-serif; margin: 0; padding: 10px; background: var(--bg); display: none; flex-direction: column; }
        header { background: var(--p); color: #fff; padding: 15px; text-align: center; border-radius: 8px; margin-bottom: 10px; font-weight: bold; font-size: 1.2rem; }
        .sync-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { border: none; color: #fff; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        .btn-s { background: var(--w); }
        .btn-e { background: var(--e); }
        .btn-r { background: var(--r); grid-column: span 2; margin-top: 5px; }
        .main-container { display: flex; flex-direction: column; gap: 15px; }
        .card { background: #fff; border-radius: 10px; height: 400px; border: 1px solid #ccc; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .h { background: #34495e; color: #fff; padding: 8px 15px; font-size: 13px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .h.notes-header { background: var(--deep-red); }
        .zoom-btn { background: #555; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
        iframe { flex: 1; border: none; width: 100%; height: 100%; }
        .card.fullscreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; border-radius: 0; margin: 0; }
    </style>
</head>
<body>

<header>🚀 Azemaa Pro - لوحة المدير</header>

<div class="sync-box">
    <button onclick="saveToWhatsApp()" class="btn btn-s">📤 واتساب</button>
    <button onclick="saveToEmail()" class="btn btn-e">📧 إيميل</button>
    <button onclick="loadData()" class="btn btn-r">📥 استرجاع البيانات</button>
    <button onclick="logout()" class="btn" style="background:#c0392b; grid-column: span 2; margin-top:5px;">تسجيل خروج 🔒</button>
</div>

<div class="main-container">
    <div class="card"><div class="h" ondblclick="openPage(this)"><span>👤 القسم الرئيسي</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div><iframe src="zbon.html"></iframe></div>
    <div class="card"><div class="h" ondblclick="openPage(this)"><span>💸 الخزينة</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div><iframe src="yom.html"></iframe></div>
    <div class="card"><div class="h" ondblclick="openPage(this)"><span>👷 العمال</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div><iframe src="gyab.html"></iframe></div>
    <div class="card"><div class="h" ondblclick="openPage(this)"><span>📅 التسليم</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div><iframe src="tslem.html"></iframe></div>
    <div class="card"><div class="h notes-header" ondblclick="openPage(this)"><span>📝 الملاحظات والورشة</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div><iframe src="notmop.html"></iframe></div>
    <div class="card"><div class="h" ondblclick="openPage(this)"><span>📊 التقارير</span> <button class="zoom-btn" onclick="toggleZoom(this)">تكبير ⛶</button></div><iframe src="takarer.html"></iframe></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>

<script>
    // الإعدادات المصححة
    const firebaseConfig = {
        apiKey: "AIzaSyCnqyHFTyhsyIea9p0VCG3qJpfFLHpOc1M",
        authDomain: "farah-kitchen.firebaseapp.com",
        projectId: "farah-kitchen",
        storageBucket: "farah-kitchen.firebasestorage.app",
        messagingSenderId: "702572851072",
        appId: "1:702572851072:web:320a92c9430abba6b71b65"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // نظام التحقق من المدير
    auth.onAuthStateChanged((user) => {
        const adminEmail = "mokshmoksh56@gmail.com";
        
        if (user && user.email.toLowerCase() === adminEmail) {
            document.body.style.display = "flex";
        } else {
            document.body.style.display = "none";
            let emailInput = prompt("أدخل إيميل المدير:");
            let passInput = prompt("أدخل كلمة المرور:");
            
            if(emailInput && passInput) {
                auth.signInWithEmailAndPassword(emailInput.trim().toLowerCase(), passInput.trim())
                .then(() => { location.reload(); })
                .catch(err => {
                    alert("خطأ في الدخول: " + err.message);
                    location.reload();
                });
            }
        }
    });

    function logout() { auth.signOut().then(() => location.reload()); }

    // وظائف النسخ الاحتياطي
    const keysMap = { '"name":': '"n":', '"price":': '"p":', '"date":': '"d":', '"amount":': '"a":' };
    function generateBackupCode() {
        let data = {};
        for (let i = 0; i < localStorage.length; i++) {
            let key = localStorage.key(i);
            data[key] = localStorage.getItem(key);
        }
        let compressed = JSON.stringify(data);
        for (let [full, short] of Object.entries(keysMap)) { compressed = compressed.split(full).join(short); }
        return btoa(unescape(encodeURIComponent(compressed)));
    }
    function saveToWhatsApp() { window.location.href = `whatsapp://send?text=*AZ-BACKUP*\n${generateBackupCode()}`; }
    function saveToEmail() { window.location.href = `mailto:?subject=Backup&body=${generateBackupCode()}`; }
    function loadData() {
        let input = prompt("الصق الكود هنا:");
        if (!input) return;
        try {
            let decoded = decodeURIComponent(escape(atob(input.trim())));
            for (let [full, short] of Object.entries(keysMap)) { decoded = decoded.split(short).join(full); }
            let obj = JSON.parse(decoded);
            localStorage.clear();
            for (let k in obj) localStorage.setItem(k, obj[k]);
            alert("✅ تم استرجاع البيانات!");
            location.reload();
        } catch (e) { alert("❌ كود غير صحيح."); }
    }
    function openPage(h) { let f = h.parentElement.querySelector('iframe'); if (f) window.open(f.src, '_blank'); }
    function toggleZoom(b) {
        let c = b.closest('.card');
        if (c.classList.contains('fullscreen')) { c.classList.remove('fullscreen'); b.innerText = "تكبير ⛶"; }
        else { c.classList.add('fullscreen'); b.innerText = "إغلاق X"; }
    }
</script>
</body>
</html>
