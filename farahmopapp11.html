<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة فرح للمطابخ 2026 | الإدارة الشاملة</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #34495e;
            --bg: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* توزيع الشبكة المطور: صفين وعمودين */
        .main-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(2, 1fr); /* توزيع متساوٍ للصفوف */
            gap: 15px;
            flex-grow: 1;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #bdc3c7;
        }

        .card-header {
            background: var(--accent);
            color: white;
            padding: 10px 15px;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }

        .btn-open {
            background: #fff;
            color: var(--primary);
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-open:hover {
            background: #dfe6e9;
        }

        /* التوافق مع الجوال */
        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .card { height: 450px; }
        }
    </style>
</head>
<body>

<header>🚀 منظومة فرح للمطابخ - لوحة التحكم الموحدة 2026</header>

<div class="main-container">
    <div class="card">
        <div class="card-header">
            <span>📦 نظام التسليمات</span>
            <a href="تسليمالعملاء.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="تسليمالعملاء.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header">
            <span>👤 حسابات الزبائن والديون</span>
            <a href="الزبائن.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="الزبائن.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #128C7E;">
            <span>👷 غياب ورواتب العمال</span>
            <a href="الغياب.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="الغياب.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #1e40af;">
            <span>📋 يوميات الورشة</span>
            <a href="يوميات.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="يوميات.html"></iframe>
    </div>
</div>

</body>
</html>
