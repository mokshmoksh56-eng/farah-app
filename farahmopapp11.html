<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">azemaa pro للبرمجيات | الإدارة الشاملة</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #34495e;
            --bg: #ecf0f1;
            --whatsapp: #25D366;
            --restore: #e67e22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* --- شريط أزرار الواتساب بالترقيم --- */
        .sync-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .sync-btn {
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            border: none;
            cursor: pointer;
        }

        .btn-send { background-color: var(--whatsapp); }
        .btn-restore { background-color: var(--restore); }
        
        .version-badge {
            background: rgba(0,0,0,0.2);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* --- حاوية الكروت --- */
        .main-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: auto; 
            gap: 15px;
            flex-grow: 1;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #bdc3c7;
        }

        .card-header {
            background: var(--accent);
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .report-section {
            grid-column: span 2;
            min-height: 300px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
            background: #fff;
        }

        .btn-open {
            background: rgba(255, 255, 255, 0.9);
            color: var(--primary);
            border: none;
            padding: 4px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
            .card { height: 420px; }
            .report-section { grid-column: span 1; }
        }
    </style>
</head>
<body>

<header id="main-header">🚀 azemaa pro للبرمجيات</header>

<div class="sync-container">
    <button onclick="handleBackup()" class="sync-btn btn-send">
        <span>📤 إرسال نسخة احتياطية للواتساب</span>
        <span class="version-badge" id="next-ver">رقم النسخة: 1</span>
    </button>

    <button onclick="handleRestore()" class="sync-btn btn-restore">
        <span>📥 استرجاع نسخة من الواتساب</span>
        <span class="version-badge" id="last-ver">آخر رقم: 0</span>
    </button>
</div>

<div class="main-container">
    <div class="card">
        <div class="card-header" style="background: #8e44ad;">
            <span>💰 ملخص الاتفاقيات وديون الزبائن</span>
            <a href="zbon.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="zbon.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #d35400;">
            <span>💸 حركة الخزينة (يوميات الورشة)</span>
            <a href="yom.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="yom.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #128C7E;">
            <span>👷 تقرير العمال (الغياب والرواتب)</span>
            <a href="gyab.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="gyab.html"></iframe>
    </div>

    <div class="card">
        <div class="card-header" style="background: #2980b9;">
            <span>📅 مواعيد الاستلام (التسليمات)</span>
            <a href="tslem.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="tslem.html"></iframe>
    </div>

    <div class="card report-section">
        <div class="card-header" style="background: #c0392b;">
            <span>📊 مركز التقارير والإحصائيات العام</span>
            <a href="takarer.html" target="_blank" class="btn-open">تكبير ↗️</a>
        </div>
        <iframe src="takarer.html"></iframe>
    </div>
</div>

<script>
    // نظام الترقيم التلقائي
    let currentVersion = parseInt(localStorage.getItem('azemaa_ver')) || 0;

    function updateDisplay() {
        document.getElementById('last-ver').innerText = `آخر نسخة: ${currentVersion}`;
        document.getElementById('next-ver').innerText = `نسخة رقم: ${currentVersion + 1}`;
    }

    function handleBackup() {
        currentVersion++;
        localStorage.setItem('azemaa_ver', currentVersion);
        updateDisplay();

        const now = new Date().toLocaleString('ar-EG');
        const message = `📦 *نسخة احتياطية رقم:* [ ${currentVersion} ]%0A📅 *التاريخ:* ${now}%0A✅ *النظام:* azemaa pro`;
        
        window.location.href = `whatsapp://send?text=${message}`;
    }

    function handleRestore() {
        if (currentVersion === 0) {
            alert("لا توجد نسخ محفوظة مسجلة في هذا الجهاز.");
            return;
        }
        const message = `🔍 *طلب استرجاع النسخة رقم:* [ ${currentVersion} ]`;
        window.location.href = `whatsapp://send?text=${message}`;
    }

    // تحديث التاريخ في العنوان والأرقام عند التحميل
    const currentYear = new Date().getFullYear();
    document.getElementById('main-header').innerText = `🚀 azemaa pro للبرمجيات ${currentYear}`;
    updateDisplay();
</script>

</body>
</html>
