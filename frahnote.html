<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الورشة الذكي - نسخة تجريبية</title>
    <style>
        /* نفس الستايل السابق مع إضافة شاشة القفل */
        :root {
            --bg-page: #eef2f3;
            --deep-red: #8b0000; 
            --bright-red: #ff4757; 
            --text-main: #2c3e50;
            --border-color: #dcdde1;
            --success-green: #218c74;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-page); margin: 0; padding: 10px; }

        /* شاشة القفل بعد انتهاء الساعة */
        #trialLockScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px;
        }

        /* شاشة الدخول */
        #loginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }

        .login-input { padding: 12px; width: 280px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 1em; }
        .btn-login { padding: 12px 50px; background: var(--deep-red); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .header-main {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 10px 20px; border-bottom: 4px solid var(--deep-red); border-radius: 12px; margin-bottom: 15px;
        }
        .btn-logout { background: var(--bright-red); color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }

        .layout { display: grid; grid-template-columns: 220px 1fr; gap: 15px; }
        .calendar-aside { background: #fff; padding: 8px; border-radius: 10px; height: 88vh; overflow-y: auto; border: 1px solid #ddd; }
        .month-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 0.8em; }
        .month-title { background: var(--deep-red); color: white; text-align: center; padding: 5px; font-weight: bold; }
        .month-table td { text-align: center; padding: 5px; border: 1px solid #eee; cursor: pointer; }
        .is-today { background: var(--deep-red) !important; color: white; }

        .customer-card { background: white; border-radius: 12px; margin-bottom: 20px; border-top: 10px solid var(--deep-red); box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 15px; }
        .input-field { width: 95%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        .btn-save { background: var(--success-green); color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-new-cust { background: var(--deep-red); color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 1.2em; cursor: pointer; margin-bottom: 10px; }

        #trialTimer { color: var(--bright-red); font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

    <!-- شاشة القفل بعد انتهاء التجربة -->
    <div id="trialLockScreen">
        <h1>انتهت الفترة التجريبية ❌</h1>
        <p>لقد استمتعت بـ 60 دقيقة من التجربة المجانية.</p>
        <p>لفتح النسخة الكاملة مدى الحياة، يرجى التواصل مع الإدارة وشراء كود التفعيل.</p>
        <input type="text" id="activationCodeInput" class="login-input" placeholder="أدخل كود التفعيل هنا">
        <button onclick="checkActivation()" class="btn-login" style="margin-top: 10px; background: var(--success-green);">تفعيل الآن ✅</button>
        <p style="margin-top: 20px; font-size: 0.8em;">معرف الجهاز: <span id="deviceId"></span></p>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen">
        <h2 style="color:var(--deep-red)">سجل الورشة - دخول</h2>
        <input type="email" id="userEmail" class="login-input" placeholder="البريد الإلكتروني">
        <input type="password" id="userPass" class="login-input" placeholder="كلمة المرور">
        <button id="loginBtn" class="btn-login">دخول</button>
    </div>

    <header class="header-main">
        <button class="btn-logout" id="logoutBtn">خروج</button>
        <h1 style="font-size: 1.2em; color: var(--deep-red);">سجل الورشة <span id="trialTimer"></span></h1>
        <div style="font-size: 0.8em;">نسخة ذكية</div>
    </header>

    <div class="layout" id="mainLayout" style="display: none;">
        <aside class="calendar-aside" id="calView"></aside>
        <main class="main-content">
            <button class="btn-new-cust" onclick="addCustUI()">+ إضافة ملاحظة جديدة</button>
            <div id="list"></div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1MQAAZi8iucZzOrglGoWVl1HHuVrD9aY",
          authDomain: "farah-8e557.firebaseapp.com",
          databaseURL: "https://farah-8e557-default-rtdb.firebaseio.com",
          projectId: "farah-8e557",
          storageBucket: "farah-8e557.firebasestorage.app",
          messagingSenderId: "927493982518",
          appId: "1:927493982518:web:9b85e0f22bfb13bc2f8b97"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const colRef = collection(db, "notes");

        // --- منطق الفترة التجريبية والتفعيل ---
        const MASTER_CODE = "FARAH2024"; // الكود الذي ستبيعه للزبون لفتح البرنامج
        
        function handleTrial() {
            if (localStorage.getItem('isActivated') === 'true') return;

            let startTime = localStorage.getItem('trialStartTime');
            if (!startTime) {
                startTime = Date.now();
                localStorage.setItem('trialStartTime', startTime);
            }

            const checkTime = () => {
                const elapsed = Date.now() - startTime;
                const oneHour = 60 * 60 * 1000; // ساعة بالملي ثانية
                
                if (elapsed >= oneHour) {
                    document.getElementById('trialLockScreen').style.display = 'flex';
                } else {
                    const remainingMins = Math.ceil((oneHour - elapsed) / 60000);
                    document.getElementById('trialTimer').innerText = `(تجريبي: باقي ${remainingMins} دقيقة)`;
                }
            };

            setInterval(checkTime, 30000); // تحقق كل 30 ثانية
            checkTime();
        }

        window.checkActivation = () => {
            const input = document.getElementById('activationCodeInput').value;
            if (input === MASTER_CODE) {
                localStorage.setItem('isActivated', 'true');
                alert("تم التفعيل بنجاح! استمتع بالنسخة الكاملة.");
                location.reload();
            } else {
                alert("كود التفعيل غير صحيح!");
            }
        };

        // --- نظام تسجيل الدخول ---
        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(err => alert("خطأ في البيانات"));
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => location.reload());
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainLayout').style.display = 'grid';
                handleTrial(); // تشغيل مؤقت الساعة
                loadData();
                generateCal();
            }
        });

        // --- وظائف السجل (مختصرة للدمج) ---
        async function loadData() {
            const q = query(colRef, orderBy("timestamp", "asc"));
            const snap = await getDocs(q);
            document.getElementById('list').innerHTML = "";
            snap.forEach(d => window.addCustUI({id: d.id, ...d.data()}));
        }

        window.addCustUI = (data = null) => {
            const card = document.createElement('div');
            card.className = 'customer-card';
            card.innerHTML = `
                <input type="text" class="input-field name" value="${data?data.name:''}" placeholder="الاسم">
                <input type="tel" class="input-field phone" value="${data?data.phone:''}" placeholder="الهاتف">
                <div class="text-writer" contenteditable="true" style="border:1px solid #ddd; padding:10px; min-height:50px;">${data?data.notes[0].text:''}</div>
                <button class="btn-save" onclick="saveCard(this)">حفظ ✅</button>
            `;
            document.getElementById('list').prepend(card);
        };

        window.saveCard = async (btn) => {
            const card = btn.closest('.customer-card');
            const name = card.querySelector('.name').value;
            const text = card.querySelector('.text-writer').innerText;
            if(!name) return alert("الاسم مطلوب");
            btn.innerText = "جاري الحفظ...";
            await addDoc(colRef, { name, phone: card.querySelector('.phone').value, notes: [{text}], timestamp: serverTimestamp() });
            btn.innerText = "تم ✅";
        };

        function generateCal() {
            const view = document.getElementById('calView');
            const now = new Date();
            const m = now.toLocaleString('ar-EG', { month: 'long' });
            view.innerHTML = `<div class="month-title">${m} ${now.getFullYear()}</div><table class="month-table"><tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></table> (التقويم جاهز)`;
        }
    </script>
</body>
</html>
