<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro</title>
    <style>
        :root { --wa-dark: #075E54; --accent: #128C7E; --edit: #2196F3; }
        body, html { height: 100%; margin: 0; padding: 0; font-family: sans-serif; background: #e5ddd5; overflow: hidden; }
        .chat-container { width: 100%; height: 100vh; display: flex; flex-direction: column; background: white; }
        
        .header { padding: 12px; background: var(--wa-dark); color: white; text-align: center; font-weight: bold; }
        
        /* ترك مساحة بالأسفل حتى لا تختفي الكروت خلف الشريط */
        .chat-box { flex: 1; padding: 10px; overflow-y: auto; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); padding-bottom: 150px; }
        
        .card { background: white; padding: 10px; border-radius: 10px; border-right: 4px solid var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.1); width: 95%; margin: 0 auto 10px auto; }
        
        /* الشريط السفلي ثابت في الأسفل */
        .footer { position: fixed; bottom: 0; width: 100%; background: #f0f0f0; border-top: 1px solid #ddd; z-index: 100; padding: 5px 0; }
        #measurePanel { display: none; background: #fff; padding: 8px; border-top: 2px solid var(--accent); }
        .bottom-bar { display: flex; align-items: center; gap: 5px; padding: 0 5px; }
        
        .write-wrap { flex: 1; background: white; border-radius: 20px; padding: 5px 10px; border: 1px solid #ccc; display: flex; align-items: center; }
        .write-input { flex: 1; border: none; outline: none; font-size: 0.9rem; padding: 4px; }
        
        #imgPreview { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; display: none; margin-left: 5px; }
        .btn-icon { cursor:pointer; font-size: 1.4rem; padding: 5px; }
        .btn-send { color: var(--accent); font-size: 1.8rem; cursor: pointer; padding: 0 5px; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 999; }
        .note-img { width: 100%; border-radius: 8px; margin-top: 5px; max-height: 200px; object-fit: cover; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Azemaa Pro | الأرشيف</div>
    <div id="chatBox" class="chat-box"></div>

    <div class="footer">
        <div id="measurePanel">
            <div style="display:flex; gap:5px; justify-content:center;">
                <input type="number" id="cWidth" style="width:25%; padding:8px; border-radius:5px;" placeholder="عرض">
                <input type="number" id="cHeight" style="width:25%; padding:8px; border-radius:5px;" placeholder="طول">
                <input type="number" id="cDepth" style="width:25%; padding:8px; border-radius:5px;" placeholder="عمق">
            </div>
            <textarea id="pNotes" style="width:100%; height:50px; margin-top:5px; padding:5px; border-radius:5px;" placeholder="الملاحظات..."></textarea>
        </div>
        <div class="bottom-bar">
            <span class="btn-icon" onclick="openCamera()">📸</span>
            <span class="btn-icon" onclick="toggleMeasure()">📏</span>
            <div class="write-wrap">
                <img id="imgPreview" src="">
                <input type="text" id="cName" class="write-input" placeholder="الاسم...">
            </div>
            <span class="btn-send" onclick="saveData()">➤</span>
        </div>
    </div>
</div>

<div id="camOverlay" class="overlay">
    <video id="camPreview" style="width:100%; height:80%; object-fit:cover;" autoplay playsinline></video>
    <div style="display:flex; gap:10px; padding:20px;">
        <button style="flex:2; padding:15px; background:var(--accent); color:white; border:none; border-radius:8px;" onclick="takeSnapshot()">تصوير</button>
        <button style="flex:1; padding:15px; background:#444; color:white; border:none; border-radius:8px;" onclick="closeCamera()">إلغاء</button>
    </div>
</div>

<script>
    let db, tempImg = null, stream = null;
    const req = indexedDB.open("AzemaaProV4", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("records", { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => { db = e.target.result; loadData(); };

    function toggleMeasure() {
        const p = document.getElementById('measurePanel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    async function openCamera() {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById('camPreview').srcObject = stream;
        document.getElementById('camOverlay').style.display = 'block';
    }

    function takeSnapshot() {
        const video = document.getElementById('camPreview');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        tempImg = canvas.toDataURL('image/jpeg', 0.5);
        document.getElementById('imgPreview').src = tempImg;
        document.getElementById('imgPreview').style.display = 'block';
        closeCamera();
    }

    function closeCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('camOverlay').style.display = 'none';
    }

    function saveData() {
        const name = document.getElementById('cName').value;
        const data = { name: name, img: tempImg, date: new Date().toLocaleString() };
        db.transaction("records", "readwrite").objectStore("records").add(data).onsuccess = () => {
            document.getElementById('cName').value = "";
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('measurePanel').style.display = 'none';
            tempImg = null;
            loadData();
        };
    }

    function loadData() {
        const box = document.getElementById('chatBox'); box.innerHTML = '';
        db.transaction("records", "readonly").objectStore("records").openCursor(null, 'prev').onsuccess = e => {
            const c = e.target.result;
            if (c) {
                box.innerHTML += `<div class="card"><b>${c.value.name}</b> ${c.value.img ? `<img src="${c.value.img}" class="note-img">` : ''}</div>`;
                c.continue();
            }
        };
    }
</script>
</body>
</html>
