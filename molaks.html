<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro</title>
    <style>
        :root { --wa-dark: #075E54; --accent: #128C7E; }
        body, html { height: 100%; margin: 0; padding: 0; font-family: sans-serif; background: #e5ddd5; overflow: hidden; }
        .chat-container { width: 100%; height: 100vh; display: flex; flex-direction: column; }
        
        .header { padding: 12px; background: var(--wa-dark); color: white; text-align: center; font-weight: bold; }
        
        /* المساحة التي تحتوي الكروت */
        .chat-box { flex: 1; padding: 10px; overflow-y: auto; padding-bottom: 150px; }
        
        .card { background: white; padding: 10px; border-radius: 10px; border-right: 4px solid var(--accent); margin-bottom: 10px; }
        
        /* الشريط السفلي ثابت */
        .footer { position: fixed; bottom: 0; width: 100%; background: #f0f0f0; border-top: 1px solid #ddd; z-index: 100; }
        .bottom-bar { display: flex; align-items: center; gap: 10px; padding: 10px; }
        
        .write-wrap { flex: 1; background: white; border-radius: 20px; padding: 8px 15px; border: 1px solid #ccc; }
        .write-input { border: none; outline: none; width: 100%; font-size: 1rem; }
        
        .btn-icon { cursor:pointer; font-size: 1.5rem; }
        .btn-send { color: var(--accent); font-size: 1.8rem; cursor: pointer; }
        
        .note-img { width: 100%; border-radius: 8px; margin-top: 8px; max-height: 250px; object-fit: cover; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 999; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Azemaa Pro</div>
    <div id="chatBox" class="chat-box"></div>

    <div class="footer">
        <div id="measurePanel" style="display:none; padding:10px; background:#fff;">
            <input type="number" id="cWidth" placeholder="عرض" style="width:25%; padding:5px;">
            <input type="number" id="cHeight" placeholder="طول" style="width:25%; padding:5px;">
            <input type="number" id="cDepth" placeholder="عمق" style="width:25%; padding:5px;">
        </div>
        <div class="bottom-bar">
            <span class="btn-icon" onclick="openCamera()">📸</span>
            <span class="btn-icon" onclick="toggleMeasure()">📏</span>
            <div class="write-wrap">
                <input type="text" id="cName" class="write-input" placeholder="الاسم والملاحظات...">
            </div>
            <span class="btn-send" onclick="saveData()">➤</span>
        </div>
    </div>
</div>

<div id="camOverlay" class="overlay">
    <video id="camPreview" style="width:100%; height:75%; object-fit:cover;" autoplay playsinline></video>
    <div style="padding:20px; display:flex; gap:20px;">
        <button style="flex:2; padding:15px; background:var(--accent); color:white; border:none; border-radius:8px;" onclick="takeSnapshot()">تصوير</button>
        <button style="flex:1; padding:15px; background:#444; color:white; border:none; border-radius:8px;" onclick="closeCamera()">إلغاء</button>
    </div>
</div>

<script>
    let db, tempImg = null, stream = null;
    const req = indexedDB.open("AzemaaProV5", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("records", { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => { db = e.target.result; loadData(); };

    function toggleMeasure() {
        const p = document.getElementById('measurePanel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }

    async function openCamera() {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById('camPreview').srcObject = stream;
        document.getElementById('camOverlay').style.display = 'block';
    }

    function takeSnapshot() {
        const video = document.getElementById('camPreview');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        tempImg = canvas.toDataURL('image/jpeg', 0.5);
        closeCamera();
        alert("تم التقاط الصورة، اضغط الإرسال لإضافتها للكارت");
    }

    function closeCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('camOverlay').style.display = 'none';
    }

    function saveData() {
        const name = document.getElementById('cName').value;
        if (!name && !tempImg) return;
        
        const data = { 
            name: name, 
            img: tempImg, 
            w: document.getElementById('cWidth').value,
            h: document.getElementById('cHeight').value,
            d: document.getElementById('cDepth').value,
            date: new Date().toLocaleString() 
        };
        
        db.transaction("records", "readwrite").objectStore("records").add(data).onsuccess = () => {
            document.getElementById('cName').value = "";
            document.getElementById('measurePanel').style.display = 'none';
            tempImg = null;
            loadData();
        };
    }

    function loadData() {
        const box = document.getElementById('chatBox'); box.innerHTML = '';
        db.transaction("records", "readonly").objectStore("records").openCursor(null, 'prev').onsuccess = e => {
            const c = e.target.result;
            if (c) {
                const v = c.value;
                box.innerHTML += `<div class="card">
                    <b>${v.name}</b><br>
                    <small>عرض:${v.w || 0} طول:${v.h || 0} عمق:${v.d || 0}</small>
                    ${v.img ? `<img src="${v.img}" class="note-img">` : ''}
                </div>`;
                c.continue();
            }
        };
    }
</script>
</body>
</html>
