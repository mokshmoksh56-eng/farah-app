<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #e5ddd5; overflow: hidden; }
        .app { max-width: 400px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: white; }
        .list { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 150px; }
        
        .item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-right: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item img { width: 100%; border-radius: 8px; margin-top: 8px; }
        
        /* تصميم الأزرار الجديد */
        .btn-act { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px 10px; }
        
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 400px; background: #f8f8f8; padding: 10px; box-sizing: border-box; border-top: 1px solid #ddd; z-index: 100; }
        .row { display: flex; align-items: center; gap: 8px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .main-btn { background: #128C7E; color: white; border: none; padding: 10px 15px; border-radius: 8px; }
        
        #imgPrev { width: 40px; height: 40px; border-radius: 6px; display: none; object-fit: cover; border: 2px solid #128C7E; }
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:black; display:none; z-index:999; flex-direction:column; }
    </style>
</head>
<body>

<div class="app">
    <div id="list" class="list"></div>
    <div class="footer">
        <div id="measure" style="display:none; gap:5px; margin-bottom:8px;">
            <input type="number" id="w" placeholder="ع" style="width:20%">
            <input type="number" id="h" placeholder="ط" style="width:20%">
            <input type="number" id="d" placeholder="ع" style="width:20%">
        </div>
        <div class="row">
            <button class="main-btn" onclick="openCam()">📸</button>
            <button class="main-btn" onclick="document.getElementById('measure').style.display='flex'">📏</button>
            <img id="imgPrev">
            <input type="text" id="txt" placeholder="اسم العميل...">
            <button class="main-btn" onclick="save()">➤</button>
        </div>
    </div>
</div>

<div id="camOverlay" class="overlay">
    <video id="vid" style="width:100%; height:75%; object-fit:cover;" autoplay playsinline></video>
    <div style="display:flex; gap:10px; padding:20px;">
        <button style="flex:2; padding:15px; border-radius:10px;" onclick="snap()">📸 تصوير</button>
        <button style="flex:1; background:#444; border-radius:10px;" onclick="closeCam()">إلغاء</button>
    </div>
</div>

<script>
    let db, imgData = null, stream = null, editId = null;
    indexedDB.open("AzemaaFinal", 1).onupgradeneeded = e => e.target.result.createObjectStore("data", { keyPath: "id", autoIncrement: true });
    indexedDB.open("AzemaaFinal", 1).onsuccess = e => { db = e.target.result; render(); };

    async function openCam() {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById('vid').srcObject = stream;
        document.getElementById('camOverlay').style.display = 'flex';
    }

    function snap() {
        let v = document.getElementById('vid'), c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        imgData = c.toDataURL('image/jpeg', 0.5);
        document.getElementById('imgPrev').src = imgData;
        document.getElementById('imgPrev').style.display = 'block';
        closeCam();
    }

    function closeCam() { stream.getTracks().forEach(t => t.stop()); document.getElementById('camOverlay').style.display = 'none'; }

    function save() {
        let obj = { txt: document.getElementById('txt').value, img: imgData, w: document.getElementById('w').value, h: document.getElementById('h').value, d: document.getElementById('d').value };
        let tx = db.transaction("data", "readwrite").objectStore("data");
        if(editId) { obj.id = editId; tx.put(obj); editId = null; } else { tx.add(obj); }
        document.querySelectorAll('input').forEach(i => i.value = "");
        imgData = null; document.getElementById('imgPrev').style.display = 'none'; render();
    }

    function render() {
        let list = document.getElementById('list'), colors = ["#FF5733", "#33FF57", "#3357FF", "#FF33A1"];
        list.innerHTML = "";
        db.transaction("data").objectStore("data").openCursor(null, 'prev').onsuccess = e => {
            let c = e.target.result;
            if(c) {
                list.innerHTML += `<div class="item" style="border-right-color:${colors[c.value.id % 4]}">
                    <div style="font-size:1.1rem; font-weight:bold">${c.value.txt}</div>
                    <small style="color:#777">المقاس: ${c.value.w}x${c.value.h}x${c.value.d}</small>
                    ${c.value.img ? `<img src="${c.value.img}">` : ''}
                    <div style="margin-top:10px; text-align:left">
                        <button class="btn-act" onclick="edit(${c.value.id})">🖊️</button>
                        <button class="btn-act" onclick="del(${c.value.id})">🗑️</button>
                    </div>
                </div>`;
                c.continue();
            }
        };
    }
    function del(id) { if(confirm("هل أنت متأكد من الحذف؟")) db.transaction("data", "readwrite").objectStore("data").delete(id).onsuccess = render; }
    function edit(id) {
        db.transaction("data").objectStore("data").get(id).onsuccess = e => {
            let v = e.target.result; editId = v.id; document.getElementById('txt').value = v.txt;
            document.getElementById('w').value = v.w; document.getElementById('h').value = v.h; document.getElementById('d').value = v.d;
        };
    }
</script>
</body>
</html>
