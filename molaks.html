<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>روبوت الأرشيف الذكي - النسخة المصورة</title>
    <style>
        :root {
            --insta-grad: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            --accent: #0095f6;
            --bg-grey: #e1e4e8; 
        }

        body { 
            font-family: -apple-system, sans-serif; 
            background-color: var(--bg-grey); 
            margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        .chat-container { 
            width: 100%; max-width: 450px; background: white; 
            display: flex; flex-direction: column; margin: 15px;
            border-radius: 25px; overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            animation: containerPulse 4s infinite ease-in-out;
        }

        @keyframes containerPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(0,0,0,0.1); }
            50% { box-shadow: 0 0 25px rgba(188, 24, 136, 0.2); }
        }

        .header { 
            padding: 15px; border-bottom: 1px solid #dbdbdb; 
            display: flex; justify-content: space-between; align-items: center; background: #fff;
        }

        .header h1 { 
            font-size: 1.4rem; margin: 0; 
            background: var(--insta-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .chat-box { 
            flex: 1; padding: 20px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 15px; background: #fff;
        }

        .msg-wrapper { 
            display: flex; flex-direction: column; padding-bottom: 10px; 
            border-bottom: 1px solid #eeeeee;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .note-text { font-size: 1rem; color: #262626; line-height: 1.5; margin-bottom: 5px; }
        .note-img { width: 100%; border-radius: 12px; margin-top: 5px; border: 1px solid #eee; }
        .bot-text { color: var(--accent); font-weight: 500; }

        .note-meta { 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 0.75rem; color: #8e8e8e; margin-top: 5px;
        }

        .del-btn { 
            background: none; border: none; color: #ed4956; cursor: pointer; 
            font-weight: bold; font-size: 11px; padding: 2px 5px;
        }

        .input-area { padding: 15px; border-top: 1px solid #dbdbdb; background: #fff; }

        .field {
            display: flex; align-items: center; background: #f1f3f5;
            border-radius: 25px; padding: 5px 12px; margin-bottom: 8px;
        }

        input { flex: 1; border: none; background: transparent; padding: 10px; outline: none; font-size: 0.95rem; }
        
        .btn-action { background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer; padding: 5px; }
        .icon-btn { font-size: 1.2rem; margin-left: 5px; cursor: pointer; }
        .clear-chat-btn { font-size: 10px; color: #8e8e8e; background: none; border: none; cursor: pointer; text-align: center; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>Smart Archive</h1>
        <div id="dbCount" style="font-size: 12px; color: #8e8e8e;">0 كارت</div>
    </div>
    
    <div id="chatBox" class="chat-box"></div>

    <div class="input-area">
        <div class="field">
            <!-- زر الكاميرا المخفي والظاهر كأيقونة -->
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="capturePhoto(event)">
            <span class="icon-btn" onclick="document.getElementById('cameraInput').click()">📸</span>
            <span class="icon-btn" onclick="startVoice()">🎙️</span>
            
            <input type="text" id="chatInput" placeholder="اكتب ملاحظة أو التقط صورة...">
            <button class="btn-action" onclick="handleChat()">إرسال</button>
        </div>

        <div class="field">
            <input type="text" id="searchInput" placeholder="🔍 بحث في الأرشيف..." oninput="searchData()">
        </div>
        
        <button class="clear-chat-btn" onclick="clearVisualChat()">🧹 مسح الشاشة (الأرشيف آمن)</button>
        <button class="clear-chat-btn" style="color:red;" onclick="deleteEverything()">🗑️ حذف الأرشيف نهائياً</button>
    </div>
</div>

<script>
    let db;
    const request = indexedDB.open("ProArchiveBotV2", 2);

    request.onupgradeneeded = e => {
        db = e.target.result;
        if (!db.objectStoreNames.contains("vault")) {
            db.createObjectStore("vault", { keyPath: "id", autoIncrement: true });
        }
    };

    request.onsuccess = e => {
        db = e.target.result;
        loadFromArchive();
    };

    function loadFromArchive() {
        const tx = db.transaction("vault", "readonly");
        const store = tx.objectStore("vault");
        document.getElementById('chatBox').innerHTML = "";
        
        store.openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                addMsg(cursor.value.text, cursor.value.date, cursor.value.isBot, cursor.value.id, cursor.value.image);
                cursor.continue();
            }
            updateStats();
        };
    }

    // دالة التقاط الصورة ومعالجتها
    function capturePhoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const imgBase64 = e.target.result;
            saveToDB("صورة ملتقطة", getNow(), false, imgBase64);
        };
        reader.readAsDataURL(file);
    }

    function addMsg(text, date, isBot = false, id = null, imageData = null) {
        const chatBox = document.getElementById('chatBox');
        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper`;

        let content = "";
        if (imageData) {
            content = `<img src="${imageData}" class="note-img">`;
        } else {
            content = `<div class="note-text ${isBot ? 'bot-text' : ''}">${isBot ? '🤖 ' : ''}${text}</div>`;
        }

        wrapper.innerHTML = `
            ${content}
            <div class="note-meta">
                <span>📅 ${date}</span>
                ${id ? `<button class="del-btn" onclick="deleteSingleNote(${id}, this.parentElement.parentElement)">إزالة</button>` : ''}
            </div>
        `;

        chatBox.appendChild(wrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleChat() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        saveToDB(text, getNow(), false);
        
        setTimeout(() => {
            let reply = "تم الحفظ بنجاح ✅";
            if(text.includes("أهلا")) reply = "أهلاً بك في أرشيفك الذكي!";
            saveToDB(reply, getNow(), true);
        }, 500);

        input.value = "";
    }

    function saveToDB(text, date, isBot, image = null) {
        const tx = db.transaction("vault", "readwrite");
        const store = tx.objectStore("vault");
        const req = store.add({ text, date, isBot, image });
        req.onsuccess = (e) => {
            addMsg(text, date, isBot, e.target.result, image);
            updateStats();
        };
    }

    function deleteSingleNote(id, element) {
        if(confirm("حذف هذا الكارت؟")) {
            const tx = db.transaction("vault", "readwrite");
            tx.objectStore("vault").delete(id);
            tx.oncomplete = () => {
                element.remove();
                updateStats();
            };
        }
    }

    function searchData() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const chatBox = document.getElementById('chatBox');
        if (!query) { loadFromArchive(); return; }

        const tx = db.transaction("vault", "readonly");
        chatBox.innerHTML = `<div style="text-align:center; color:var(--accent); font-size:12px;">🔍 نتائج البحث...</div>`;
        
        tx.objectStore("vault").openCursor().onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                if (cursor.value.text.toLowerCase().includes(query)) {
                    addMsg(cursor.value.text, cursor.value.date, cursor.value.isBot, cursor.value.id, cursor.value.image);
                }
                cursor.continue();
            }
        };
    }

    function clearVisualChat() {
        document.getElementById('chatBox').innerHTML = `<div style="text-align:center; padding:20px; color:#8e8e8e; font-size:12px;">تم إخفاء الكروت. ابحث أو أعد التحميل لإظهارها.</div>`;
    }

    function deleteEverything() {
        if(confirm("سيتم تدمير الأرشيف بالكامل! هل أنت متأكد؟")) {
            const tx = db.transaction("vault", "readwrite");
            tx.objectStore("vault").clear();
            tx.oncomplete = () => {
                document.getElementById('chatBox').innerHTML = "";
                updateStats();
            };
        }
    }

    function getNow() {
        const now = new Date();
        return now.toLocaleDateString('ar-EG') + " | " + now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
    }

    function updateStats() {
        const tx = db.transaction("vault", "readonly");
        const countReq = tx.objectStore("vault").count();
        countReq.onsuccess = () => document.getElementById('dbCount').innerText = `${countReq.result} كارت في الأرشيف`;
    }

    function startVoice() {
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ar-SA';
        recognition.onresult = (e) => {
            document.getElementById('chatInput').value = e.results[0][0].transcript;
            handleChat();
        };
        recognition.start();
    }
</script>

</body>
</html>
