<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مفكرة التمدد التلقائي - Bold</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --primary-blue: #2563eb;
            --border-grey: #e5e7eb;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-white); 
            margin: 0; padding: 20px;
            font-weight: 900; 
            color: #1f2937;
        }

        .container { max-width: 1200px; margin: auto; }

        h2 { text-align: center; color: var(--primary-blue); margin-bottom: 25px; font-size: 28px; }

        .input-section {
            background: #fff; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 3px solid var(--primary-blue);
            margin-bottom: 40px;
        }

        textarea { 
            width: 100%; height: 120px; padding: 15px; 
            border: 2px solid var(--border-grey); border-radius: 12px; 
            font-size: 17px; resize: vertical; box-sizing: border-box;
            font-weight: 900; font-family: inherit;
        }

        .btn-main { 
            width: 100%; padding: 15px; background-color: var(--primary-blue); 
            color: white; border: none; border-radius: 12px; cursor: pointer;
            font-weight: 900; margin-top: 15px; font-size: 19px;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        .search-box { 
            width: 100%; padding: 15px; margin-bottom: 30px;
            border: 2px solid var(--border-grey); border-radius: 30px; 
            text-align: center; font-weight: 900; outline: none;
        }

        /* --- تعديل نظام التمدد التلقائي --- */
        .notes-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
            align-items: start; /* يضمن أن كل كارت يتمدد حسب محتواه فقط */
        }

        .card { 
            padding: 22px; 
            border-radius: 18px; 
            transition: all 0.3s ease; 
            display: block; /* يسمح بالتمدد الرأسي الحر */
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            border: 2px solid rgba(0,0,0,0.05);
            height: auto; /* يجعل الارتفاع تلقائياً */
            word-wrap: break-word; /* لكسر الكلمات الطويلة جداً */
            overflow-wrap: break-word;
        }

        .card:hover { 
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        .date { font-size: 12px; color: rgba(0,0,0,0.5); margin-bottom: 12px; font-weight: 900; display: block; border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        .note-content { 
            font-size: 16px; 
            line-height: 1.7; 
            white-space: pre-wrap; /* يحافظ على الأسطر الجديدة */
            font-weight: 900; 
            color: #111;
            margin-bottom: 15px;
        }
        
        .actions { 
            display: flex; 
            justify-content: space-between; 
            padding-top: 12px; 
            border-top: 1px solid rgba(0,0,0,0.08); 
        }

        .edit-btn { color: #065f46; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .del-btn { color: #b91c1c; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 مفكرة التمدد الذكي</h2>
    
    <div class="input-section">
        <textarea id="noteInput" placeholder="اكتب ملاحظة طويلة جداً لتراها تتمدد..."></textarea>
        <input type="hidden" id="editIndex" value="-1">
        <button class="btn-main" id="saveBtn" onclick="handleSave()">حفظ الملاحظة 🚀</button>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 ابحث في ملاحظاتك..." onkeyup="renderNotes()">

    <div id="notesList" class="notes-grid"></div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('expand_notes_db')) || [];
    const colors = ['#FFF9C4', '#C8E6C9', '#BBDEFB', '#FFCDD2', '#E1BEE7', '#FFE0B2', '#B2EBF2', '#F5F5F5'];

    function handleSave() {
        const text = document.getElementById('noteInput').value;
        const editIdx = document.getElementById('editIndex').value;
        if (!text.trim()) return;

        const now = new Date();
        const dateStr = now.getFullYear() + "/" + (now.getMonth()+1) + "/" + now.getDate() + " | " + now.getHours() + ":" + now.getMinutes();

        if (editIdx == "-1") {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            notes.unshift({ text: text, date: dateStr, color: randomColor });
        } else {
            notes[editIdx].text = text;
            document.getElementById('editIndex').value = "-1";
            document.getElementById('saveBtn').innerText = "حفظ الملاحظة 🚀";
        }

        saveData();
        document.getElementById('noteInput').value = "";
        renderNotes();
    }

    function renderNotes() {
        const list = document.getElementById('notesList');
        const term = document.getElementById('searchBox').value.toLowerCase();
        list.innerHTML = "";

        notes.forEach((note, index) => {
            if (note.text.toLowerCase().includes(term)) {
                list.innerHTML += `
                    <div class="card" style="background-color: ${note.color}">
                        <span class="date">🕒 ${note.date}</span>
                        <div class="note-content">${note.text}</div>
                        <div class="actions">
                            <span class="edit-btn" onclick="editNote(${index})">✏️ تعديل</span>
                            <span class="del-btn" onclick="deleteNote(${index})">🗑️ حذف</span>
                        </div>
                    </div>
                `;
            }
        });
    }

    function editNote(index) {
        document.getElementById('noteInput').value = notes[index].text;
        document.getElementById('editIndex').value = index;
        document.getElementById('saveBtn').innerText = "تحديث الآن ✅";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function deleteNote(index) {
        if (confirm("هل تريد الحذف؟")) {
            notes.splice(index, 1);
            saveData();
            renderNotes();
        }
    }

    function saveData() {
        localStorage.setItem('expand_notes_db', JSON.stringify(notes));
    }

    renderNotes();
</script>

</body>
</html>
