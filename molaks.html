<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #e5ddd5; overflow: hidden; }
        .app { max-width: 400px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: white; }
        .list { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 180px; }
        
        .item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-right: 6px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .item img { width: 100%; border-radius: 8px; margin-top: 8px; }
        
        /* الفوتر مع زيادة الارتفاع */
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 400px; background: #fff; border-top: 2px solid #ddd; padding: 12px; box-sizing: border-box; z-index: 100; }
        
        .tools-bar { display: flex; gap: 10px; margin-bottom: 10px; }
        .tool-btn { flex: 1; background: #f0f0f0; border: none; padding: 12px; border-radius: 8px; font-size: 1.4rem; cursor: pointer; }
        
        /* تكبير ارتفاع حقل الإدخال */
        .input-row { display: flex; align-items: center; gap: 8px; }
        input { flex: 1; padding: 14px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .send-btn { background: #128C7E; color: white; border: none; padding: 14px 20px; border-radius: 10px; font-weight: bold; }
        
        #imgPrev { width: 45px; height: 45px; border-radius: 8px; display: none; object-fit: cover; border: 2px solid #128C7E; }
    </style>
</head>
<body>

<div class="app">
    <div id="list" class="list"></div>
    
    <div class="footer">
        <div class="tools-bar">
            <button class="tool-btn" onclick="openCam()">📸</button>
            <button class="tool-btn" onclick="document.getElementById('measure').style.display='flex'">📏</button>
        </div>
        
        <div id="measure" style="display:none; gap:5px; margin-bottom:10px;">
            <input type="number" id="w" placeholder="ع" style="padding:10px; width:30%">
            <input type="number" id="h" placeholder="ط" style="padding:10px; width:30%">
            <input type="number" id="d" placeholder="ع" style="padding:10px; width:30%">
        </div>
        
        <div class="input-row">
            <img id="imgPrev">
            <input type="text" id="txt" placeholder="اسم العميل...">
            <button class="send-btn" onclick="save()">➤</button>
        </div>
    </div>
</div>

<!-- بقية الكود البرمجي يبقى كما هو -->
<div id="camOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:black; display:none; z-index:999; flex-direction:column;">
    <video id="vid" style="width:100%; height:75%; object-fit:cover;" autoplay playsinline></video>
    <div style="display:flex; gap:10px; padding:20px;">
        <button style="flex:2; padding:15px; border-radius:10px;" onclick="snap()">📸 تصوير</button>
        <button style="flex:1; background:#444; color:white; border-radius:10px;" onclick="closeCam()">إلغاء</button>
    </div>
</div>

<script>
    let db, imgData = null, stream = null, editId = null;
    indexedDB.open("AzemaaFinal", 1).onupgradeneeded = e => e.target.result.createObjectStore("data", { keyPath: "id", autoIncrement: true });
    indexedDB.open("AzemaaFinal", 1).onsuccess = e => { db = e.target.result; render(); };

    async function openCam() {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        document.getElementById('vid').srcObject = stream;
        document.getElementById('camOverlay').style.display = 'flex';
    }

    function snap() {
        let v = document.getElementById('vid'), c = document.createElement('canvas');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        imgData = c.toDataURL('image/jpeg', 0.5);
        document.getElementById('imgPrev').src = imgData;
        document.getElementById('imgPrev').style.display = 'block';
        closeCam();
    }

    function closeCam() { stream.getTracks().forEach(t => t.stop()); document.getElementById('camOverlay').style.display = 'none'; }

    function save() {
        let obj = { txt: document.getElementById('txt').value, img: imgData, w: document.getElementById('w').value, h: document.getElementById('h').value, d: document.getElementById('d').value };
        let tx = db.transaction("data", "readwrite").objectStore("data");
        if(editId) { obj.id = editId; tx.put(obj); editId = null; } else { tx.add(obj); }
        document.querySelectorAll('input').forEach(i => i.value = "");
        imgData = null; document.getElementById('imgPrev').style.display = 'none'; render();
    }

    function render() {
        let list = document.getElementById('list'), colors = ["#FF5733", "#33FF57", "#3357FF", "#FF33A1"];
        list.innerHTML = "";
        db.transaction("data").objectStore("data").openCursor(null, 'prev').onsuccess = e => {
            let c = e.target.result;
            if(c) {
                list.innerHTML += `<div class="item" style="border-right-color:${colors[c.value.id % 4]}">
                    <div style="font-weight:bold; font-size:1.1rem">${c.value.txt}</div>
                    <small style="color:#777">📏 ${c.value.w}x${c.value.h}x${c.value.d}</small>
                    ${c.value.img ? `<img src="${c.value.img}">` : ''}
                    <div style="text-align:left"><button onclick="edit(${c.value.id})" style="border:none; background:none">🖊️</button> <button onclick="del(${c.value.id})" style="border:none; background:none">🗑️</button></div>
                </div>`;
                c.continue();
            }
        };
    }
    function del(id) { if(confirm("حذف؟")) db.transaction("data", "readwrite").objectStore("data").delete(id).onsuccess = render; }
    function edit(id) {
        db.transaction("data").objectStore("data").get(id).onsuccess = e => {
            let v = e.target.result; editId = v.id; document.getElementById('txt').value = v.txt;
            document.getElementById('w').value = v.w; document.getElementById('h').value = v.h; document.getElementById('d').value = v.d;
        };
    }
</script>
</body>
</html>
