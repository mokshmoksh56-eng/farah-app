<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Azemaa Pro - الملاحظات الموسعة</title>
    <style>
        :root { --wa-dark: #075E54; --accent: #128C7E; --edit: #2196F3; }
        body { font-family: sans-serif; background: #d1d9e6; margin: 0; display: flex; justify-content: center; height: 100vh; overflow: hidden; font-weight: bold; }
        .chat-container { width: 100%; max-width: 500px; background: white; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.2); }
        .header { padding: 10px; background: var(--wa-dark); color: white; text-align: center; font-size: 1.1rem; }
        .chat-box { flex: 1; padding: 10px; overflow-y: auto; background: #e5ddd5; display: flex; flex-direction: column; gap: 8px; }
        
        .card { background: white; padding: 10px; border-radius: 8px; border-right: 5px solid var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .client-name { color: var(--wa-dark); font-weight: 900; font-size: 1.05rem; display: block; margin-bottom: 4px; }
        .specs-row { display: flex; gap: 6px; background: #f9f9f9; padding: 4px 6px; border-radius: 4px; width: fit-content; font-size: 0.8rem; border: 1px solid #eee; }
        .note-img { width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        
        #measurePanel { display: none; background: #fff; padding: 10px; border-top: 2.5px solid var(--accent); }
        .compact-input { width: 55px !important; padding: 6px !important; border: 2px solid #ccc; border-radius: 5px; text-align: center; font-size: 0.85rem; font-weight: bold; }
        
        /* تكبير خانة الملاحظات هنا */
        #pNotes { 
            width: 100%; 
            height: 90px; /* زيادة الارتفاع لراحة الكتابة */
            margin-top: 8px; 
            box-sizing: border-box; 
            font-weight: bold; 
            font-size: 0.9rem; 
            border: 2px solid #ccc; 
            border-radius: 8px; 
            padding: 8px;
            outline: none;
            resize: none; /* لمنع تغيير الحجم يدوياً وتخريب الواجهة */
        }
        #pNotes:focus { border-color: var(--accent); }

        .footer { padding: 8px; background: #eee; border-top: 1px solid #ddd; }
        .bottom-bar { display: flex; align-items: center; gap: 8px; }
        .write-wrap { flex: 1; background: white; border-radius: 20px; padding: 4px 15px; border: 2px solid #ddd; }
        .btn-icon { cursor:pointer; font-size: 1.4rem; }
        .btn-send { color: var(--accent); font-size: 1.8rem; cursor: pointer; }
        
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Azemaa Pro | نظام الأرشيف</div>
    <div id="chatBox" class="chat-box"></div>

    <div class="footer">
        <div id="measurePanel">
            <div style="display:flex; gap:6px; justify-content:center;">
                <input type="number" id="cWidth" class="compact-input" placeholder="عرض">
                <input type="number" id="cHeight" class="compact-input" placeholder="طول">
                <input type="number" id="cDepth" class="compact-input" placeholder="عمق">
            </div>
            <!-- خانة الملاحظات الكبيرة -->
            <textarea id="pNotes" placeholder="اكتب الملاحظات الفنية هنا بالتفصيل..."></textarea>
        </div>
        <div class="bottom-bar">
            <span class="btn-icon" onclick="openCamera()" title="تصوير">📸</span>
            <span class="btn-icon" onclick="document.getElementById('fileIn').click()" title="المعرض">🖼️</span>
            <span class="btn-icon" onclick="toggleMeasure()" title="مقاسات">📏</span>
            <div class="write-wrap">
                <input type="text" id="cName" style="width:100%; border:none; outline:none; font-weight:bold; font-size:1rem;" placeholder="اسم العميل...">
            </div>
            <span class="btn-send" onclick="saveData()">➤</span>
            <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
        </div>
    </div>
</div>

<div id="camOverlay" class="overlay">
    <div style="width:90%; background:white; border-radius:15px; overflow:hidden;">
        <video id="camPreview" style="width:100%;" autoplay playsinline></video>
        <div style="display:flex; background:#111; padding:12px; gap:10px;">
            <button style="flex:2; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold;" onclick="takeSnapshot()">📸 التقاط</button>
            <button style="flex:1; padding:12px; background:#444; color:white; border:none; border-radius:8px;" onclick="closeCamera()">إغلاق</button>
        </div>
    </div>
</div>

<script>
    let db, tempImg = null, stream = null, currentEditId = null;
    const req = indexedDB.open("AzemaaProNotesUpdateDB", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("records", { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => { db = e.target.result; loadData(); };

    function toggleMeasure() { 
        const p = document.getElementById('measurePanel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }
    
    async function openCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('camPreview').srcObject = stream;
            document.getElementById('camOverlay').style.display = 'flex';
        } catch (err) { alert("الكاميرا غير متاحة"); }
    }

    function takeSnapshot() {
        const video = document.getElementById('camPreview');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        tempImg = canvas.toDataURL('image/jpeg');
        closeCamera();
    }

    function closeCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('camOverlay').style.display = 'none';
    }

    function handleFile(input) {
        const r = new FileReader();
        r.onload = e => { tempImg = e.target.result; };
        r.readAsDataURL(input.files[0]);
    }

    function saveData() {
        const name = document.getElementById('cName').value;
        if (!name && !tempImg) return;
        
        const options = { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true };
        const dateStr = new Date().toLocaleDateString('ar-EG', options);

        const data = { 
            name, 
            w: document.getElementById('cWidth').value, 
            h: document.getElementById('cHeight').value, 
            d: document.getElementById('cDepth').value, 
            notes: document.getElementById('pNotes').value, 
            img: tempImg, 
            date: dateStr 
        };

        const tx = db.transaction("records", "readwrite");
        if (currentEditId) { 
            data.id = currentEditId; 
            tx.objectStore("records").put(data).onsuccess = () => { currentEditId = null; resetForm(); }; 
        } else { 
            tx.objectStore("records").add(data).onsuccess = () => resetForm(); 
        }
    }

    function resetForm() {
        document.querySelectorAll('input, textarea').forEach(i => i.value = "");
        tempImg = null; 
        document.getElementById('measurePanel').style.display = 'none';
        loadData();
    }

    function loadData() {
        const box = document.getElementById('chatBox'); box.innerHTML = '';
        db.transaction("records", "readonly").objectStore("records").openCursor(null, 'prev').onsuccess = e => {
            const c = e.target.result;
            if (c) {
                const v = c.value;
                const hasSpecs = (v.w || v.h || v.d);
                const specs = hasSpecs ? `<div class="specs-row">العرض: <b>${v.w||0}</b> | الارتفاع: <b>${v.h||0}</b> | العمق: <b>${v.d||0}</b></div>` : '';
                box.innerHTML += `
                    <div class="card">
                        <span class="client-name">👤 ${v.name}</span>
                        ${specs}
                        ${v.notes ? `<div style="font-size:0.9rem; margin:6px 0; line-height:1.4; color:#333;">📝 ${v.notes}</div>` : ''}
                        ${v.img ? `<img src="${v.img}" class="note-img" onclick="window.open(this.src)">` : ''}
                        <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:#777; border-top:1px solid #eee; padding-top:6px; margin-top:5px;">
                            <span>${v.date}</span>
                            <div>
                                <span onclick="editRecord(${v.id},'${v.name}','${v.w}','${v.h}','${v.d}','${v.notes}','${v.img}')" style="color:#2196F3; cursor:pointer; margin-left:12px;">🖊️ تعديل</span>
                                <span onclick="del(${v.id})" style="color:red; cursor:pointer;">🗑️ حذف</span>
                            </div>
                        </div>
                    </div>
                `;
                c.continue();
            }
        };
    }

    function editRecord(id, name, w, h, d, notes, img) {
        currentEditId = id; 
        document.getElementById('cName').value = name; 
        document.getElementById('cWidth').value = w; 
        document.getElementById('cHeight').value = h; 
        document.getElementById('cDepth').value = d; 
        document.getElementById('pNotes').value = notes; 
        tempImg = img;
        document.getElementById('measurePanel').style.display = 'block';
        document.getElementById('cName').focus();
    }

    function del(id) { if(confirm("هل أنت متأكد من حذف هذه الملاحظة؟")) db.transaction("records", "readwrite").objectStore("records").delete(id).onsuccess = () => loadData(); }
</script>
</body>
</html>
