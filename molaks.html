<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro - Mobile Edit</title>
    <style>
        :root { --wa-dark: #075E54; --accent: #128C7E; --edit: #2196F3; --bg: #e5ddd5; }
        
        body, html { 
            height: 100%; margin: 0; padding: 0; 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); font-weight: bold; overflow: hidden;
        }

        .chat-container { width: 100%; height: 100vh; display: flex; flex-direction: column; background: white; }

        .header { 
            padding: 8px; background: var(--wa-dark); color: white; 
            text-align: center; font-size: 0.9rem; font-weight: bold;
        }

        .chat-box { 
            flex: 1; padding: 8px; overflow-y: auto; 
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-color: var(--bg); display: flex; flex-direction: column; gap: 6px; 
        }
        
        .card { 
            background: white; padding: 10px; border-radius: 8px; 
            border-right: 4px solid var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            width: 95%; margin: 0 auto; box-sizing: border-box;
        }
        
        .client-name { color: var(--wa-dark); font-weight: 900; font-size: 0.9rem; display: block; margin-bottom: 4px; }
        .specs-row { display: flex; gap: 4px; background: #f9f9f9; padding: 4px; border-radius: 4px; font-size: 0.7rem; border: 1px solid #eee; margin-bottom: 5px; }
        
        #measurePanel { display: none; background: #fff; padding: 8px; border-top: 2px solid var(--accent); }
        .compact-row { display: flex; gap: 4px; justify-content: center; margin-bottom: 5px; }
        .compact-input { flex: 1; width: 30%; padding: 6px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 0.8rem; font-weight: bold; }
        
        #pNotes { 
            width: 100%; height: 60px; box-sizing: border-box; 
            font-weight: bold; font-size: 0.8rem; border: 1px solid #ccc; 
            border-radius: 6px; padding: 6px; outline: none; resize: none;
        }

        .footer { padding: 6px; background: #f0f0f0; border-top: 1px solid #ddd; }
        .bottom-bar { display: flex; align-items: center; gap: 6px; }
        
        .write-wrap { 
            flex: 1; background: white; border-radius: 20px; 
            padding: 2px 10px; border: 1px solid #ccc; display: flex; align-items: center;
        }
        .write-input { flex: 1; border: none; outline: none; font-weight: bold; font-size: 0.85rem; padding: 6px; }
        
        .btn-icon { cursor:pointer; font-size: 1.2rem; color: #555; padding: 2px; }
        .btn-send { color: var(--accent); font-size: 1.5rem; cursor: pointer; }
        
        /* شكل الصورة المصغرة قبل الحفظ */
        #imgPreview { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; display: none; border: 1px solid var(--accent); }

        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .note-img { width: 100%; border-radius: 6px; margin-top: 5px; max-height: 200px; object-fit: cover; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">Azemaa Pro | ورشة العظماء</div>
    
    <div id="chatBox" class="chat-box"></div>

    <div class="footer">
        <div id="measurePanel">
            <div class="compact-row">
                <input type="number" id="cWidth" class="compact-input" placeholder="عرض">
                <input type="number" id="cHeight" class="compact-input" placeholder="طول">
                <input type="number" id="cDepth" class="compact-input" placeholder="عمق">
            </div>
            <textarea id="pNotes" placeholder="الملاحظات الفنية هنا..."></textarea>
        </div>
        
        <div class="bottom-bar">
            <span class="btn-icon" onclick="openCamera()">📸</span>
            <span class="btn-icon" onclick="toggleMeasure()" id="ruleIcon">📏</span>
            
            <div class="write-wrap">
                <img id="imgPreview" src="">
                <input type="text" id="cName" class="write-input" placeholder="اسم العميل...">
            </div>
            
            <span class="btn-send" onclick="saveData()">➤</span>
            <input type="file" id="fileIn" hidden accept="image/*" onchange="handleFile(this)">
        </div>
    </div>
</div>

<div id="camOverlay" class="overlay">
    <div style="width:100%; height:100%; background:black; display:flex; flex-direction:column;">
        <video id="camPreview" style="flex:1; object-fit:cover;" autoplay playsinline></video>
        <div style="padding:15px; display:flex; gap:10px; background:#000;">
            <button style="flex:2; padding:12px; background:var(--accent); color:white; border:none; border-radius:8px; font-weight:bold;" onclick="takeSnapshot()">التقاط الصورة</button>
            <button style="flex:1; padding:12px; background:#444; color:white; border:none; border-radius:8px;" onclick="closeCamera()">إلغاء</button>
        </div>
    </div>
</div>

<script>
    let db, tempImg = null, stream = null, currentEditId = null;
    
    const req = indexedDB.open("AzemaaProMobileV1", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("records", { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => { db = e.target.result; loadData(); };

    function toggleMeasure() {
        const p = document.getElementById('measurePanel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        document.getElementById('ruleIcon').style.color = (p.style.display === 'block') ? 'var(--accent)' : '#555';
    }

    async function openCamera() {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('camPreview').srcObject = stream;
            document.getElementById('camOverlay').style.display = 'flex';
        } catch (err) { alert("يرجى السماح بالوصول للكاميرا"); }
    }

    function takeSnapshot() {
        const video = document.getElementById('camPreview');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        tempImg = canvas.toDataURL('image/jpeg', 0.7); // تقليل الجودة لسرعة الموبايل
        
        // إظهار معاينة مصغرة بجانب حقل الاسم
        const preview = document.getElementById('imgPreview');
        preview.src = tempImg;
        preview.style.display = 'block';
        
        closeCamera();
    }

    function closeCamera() {
        if (stream) stream.getTracks().forEach(t => t.stop());
        document.getElementById('camOverlay').style.display = 'none';
    }

    function saveData() {
        const name = document.getElementById('cName').value;
        if (!name && !tempImg) { alert("أدخل اسم العميل أو التقط صورة"); return; }
        
        const data = {
            name: name || "عميل بدون اسم",
            w: document.getElementById('cWidth').value,
            h: document.getElementById('cHeight').value,
            d: document.getElementById('cDepth').value,
            notes: document.getElementById('pNotes').value,
            img: tempImg,
            date: new Date().toLocaleString('ar-EG', { hour:'2-digit', minute:'2-digit' })
        };

        const tx = db.transaction("records", "readwrite");
        const store = tx.objectStore("records");
        
        if (currentEditId) {
            data.id = currentEditId;
            store.put(data).onsuccess = () => { currentEditId = null; resetForm(); };
        } else {
            store.add(data).onsuccess = () => resetForm();
        }
    }

    function resetForm() {
        document.querySelectorAll('input, textarea').forEach(i => i.value = "");
        tempImg = null;
        document.getElementById('imgPreview').style.display = 'none';
        document.getElementById('measurePanel').style.display = 'none';
        document.getElementById('ruleIcon').style.color = '#555';
        loadData();
    }

    function loadData() {
        const box = document.getElementById('chatBox'); box.innerHTML = '';
        db.transaction("records", "readonly").objectStore("records").openCursor(null, 'prev').onsuccess = e => {
            const c = e.target.result;
            if (c) {
                const v = c.value;
                const hasSpecs = (v.w || v.h || v.d);
                const specs = hasSpecs ? `<div class="specs-row">📏 ع:${v.w||0} | ط:${v.h||0} | ع:${v.d||0}</div>` : '';
                box.innerHTML += `
                    <div class="card">
                        <span class="client-name">👤 ${v.name}</span>
                        ${specs}
                        ${v.notes ? `<div style="font-size:0.8rem; margin:4px 0; color:#444;">📝 ${v.notes}</div>` : ''}
                        ${v.img ? `<img src="${v.img}" class="note-img" onclick="window.open(this.src)">` : ''}
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.65rem; color:#888; margin-top:6px; border-top:1px solid #eee; padding-top:4px;">
                            <span>🕒 ${v.date}</span>
                            <div>
                                <span onclick="editRecord(${v.id})" style="color:var(--edit); margin-left:10px;">🖊️</span>
                                <span onclick="del(${v.id})" style="color:red;">🗑️</span>
                            </div>
                        </div>
                    </div>
                `;
                c.continue();
            }
        };
    }

    function editRecord(id) {
        db.transaction("records").objectStore("records").get(id).onsuccess = e => {
            const v = e.target.result;
            currentEditId = id;
            document.getElementById('cName').value = v.name;
            document.getElementById('cWidth').value = v.w;
            document.getElementById('cHeight').value = v.h;
            document.getElementById('cDepth').value = v.d;
            document.getElementById('pNotes').value = v.notes;
            tempImg = v.img;
            if(tempImg) {
                const preview = document.getElementById('imgPreview');
                preview.src = tempImg; preview.style.display = 'block';
            }
            document.getElementById('measurePanel').style.display = 'block';
        };
    }

    function del(id) { if(confirm("حذف السجل؟")) db.transaction("records", "readwrite").objectStore("records").delete(id).onsuccess = () => loadData(); }
</script>
</body>
</html>
