<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro V10</title>
    <style>
        /* خلفية رصاصي منقوشة احترافية */
        body { 
            margin: 0; font-family: sans-serif; 
            background-color: #d1d1d1;
            background-image: radial-gradient(#a1a1a1 0.8px, transparent 0.8px);
            background-size: 15px 15px;
            overflow: hidden; 
        }
        .app { max-width: 450px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.9); }
        
        /* خانة البحث */
        .search-box { padding: 12px; background: #2c3e50; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .search-box input { width: 100%; padding: 12px; border-radius: 25px; border: none; outline: none; font-size: 1rem; }

        /* القائمة */
        .list { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 180px; }
        .item { background: white; padding: 15px; border-radius: 15px; margin-bottom: 12px; border-right: 8px solid #ccc; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
        .item b { display: block; font-size: 1.2rem; color: #333; margin-bottom: 5px; }
        .item span { color: #666; font-size: 0.9rem; font-weight: bold; }
        .item img { width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd; display: block; }
        
        .actions { margin-top: 10px; display: flex; gap: 20px; border-top: 1px solid #eee; padding-top: 8px; }
        .actions button { background: none; border: none; font-size: 1rem; cursor: pointer; color: #128C7E; font-weight: bold; }

        /* الفوتر (شريط الإدخال) */
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 450px; background: white; border-top: 2px solid #2c3e50; padding: 10px; box-sizing: border-box; }
        
        /* حركة المسطرة */
        #measure { display: flex; height: 0; overflow: hidden; transition: 0.3s; gap: 5px; }
        #measure.show { height: 50px; margin-bottom: 10px; }
        #measure input { width: 30%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; text-align: center; }

        .tools { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-tool { flex: 1; padding: 12px; border-radius: 10px; border: none; background: #f0f0f0; font-size: 1.3rem; cursor: pointer; }
        
        .input-row { display: flex; gap: 8px; align-items: center; }
        .input-row input { flex: 1; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 1rem; }
        .btn-send { background: #128C7E; color: white; border: none; padding: 15px 25px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; }
        
        /* مؤشر وجود صورة */
        #imgIndicator { display: none; background: #ff9800; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; position: absolute; top: -10px; right: 10px; }
    </style>
</head>
<body>

<div class="app">
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 بحث عن عميل..." onkeyup="render()">
    </div>

    <div id="list" class="list"></div>

    <div class="footer">
        <div class="tools">
            <!-- الزر الذي يفتح الكاميرا المضمونة -->
            <button class="btn-tool" onclick="document.getElementById('nativeCam').click()">📸</button>
            <button class="btn-tool" onclick="document.getElementById('measure').classList.toggle('show')">📏</button>
            <input type="file" id="nativeCam" accept="image/*" capture="environment" style="display:none" onchange="handleImg(this)">
        </div>

        <div id="measure">
            <input type="number" id="w" placeholder="عرض">
            <input type="number" id="h" placeholder="طول">
            <input type="number" id="d" placeholder="عمق">
        </div>

        <div class="input-row" style="position:relative">
            <div id="imgIndicator">تم التقاط صورة ✅</div>
            <input type="text" id="txt" placeholder="اسم العميل...">
            <button class="btn-send" onclick="save()">➤</button>
        </div>
    </div>
</div>

<script>
    let db, imgData = null, editId = null;

    // فتح قاعدة البيانات
    const req = indexedDB.open("AzemaaDB", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("items", { keyPath: "id", autoIncrement: true });
    req.onsuccess = e => { db = e.target.result; render(); };

    // معالجة الصورة الملتقطة
    function handleImg(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxW = 600; 
                    canvas.width = maxW;
                    canvas.height = (img.height / img.width) * maxW;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    imgData = canvas.toDataURL("image/jpeg", 0.5); // ضغط الصورة 50%
                    document.getElementById('imgIndicator').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    // حفظ البيانات
    function save() {
        const txt = document.getElementById('txt').value;
        if (!txt && !imgData) return;

        const store = db.transaction("items", "readwrite").objectStore("items");
        const data = {
            txt, img: imgData,
            w: document.getElementById('w').value,
            h: document.getElementById('h').value,
            d: document.getElementById('d').value
        };

        if (editId) {
            store.get(editId).onsuccess = e => {
                const record = e.target.result;
                record.txt = data.txt;
                record.w = data.w; record.h = data.h; record.d = data.d;
                if(imgData) record.img = imgData; // تحديث الصورة فقط لو التقطت واحدة جديدة
                store.put(record).onsuccess = reset;
            };
        } else {
            store.add(data).onsuccess = reset;
        }
    }

    function reset() {
        document.getElementById('txt').value = "";
        document.getElementById('w').value = "";
        document.getElementById('h').value = "";
        document.getElementById('d').value = "";
        imgData = null;
        editId = null;
        document.getElementById('imgIndicator').style.display = 'none';
        document.getElementById('measure').classList.remove('show');
        render();
    }

    // عرض البيانات والبحث
    function render() {
        const list = document.getElementById('list');
        const query = document.getElementById('search').value.toLowerCase();
        list.innerHTML = "";

        db.transaction("items").objectStore("items").openCursor(null, "prev").onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
                const v = cursor.value;
                if (v.txt.toLowerCase().includes(query)) {
                    const colors = ["#e74c3c", "#2ecc71", "#3498db", "#f1c40f"];
                    const dimText = (v.w || v.h || v.d) ? `<span>عرض: ${v.w || 0} | طول: ${v.h || 0} | عمق: ${v.d || 0}</span>` : "";
                    
                    list.innerHTML += `
                        <div class="item" style="border-right-color: ${colors[v.id % 4]}">
                            <b>${v.txt}</b>
                            ${dimText}
                            ${v.img ? `<img src="${v.img}">` : ""}
                            <div class="actions">
                                <button onclick="edit(${v.id})">🖊️ تعديل</button>
                                <button onclick="del(${v.id})" style="color:red">🗑️ حذف</button>
                            </div>
                        </div>`;
                }
                cursor.continue();
            }
        };
    }

    function del(id) { if(confirm("حذف العميل؟")) db.transaction("items", "readwrite").objectStore("items").delete(id).onsuccess = render; }

    function edit(id) {
        db.transaction("items").objectStore("items").get(id).onsuccess = e => {
            const v = e.target.result;
            editId = v.id;
            document.getElementById('txt').value = v.txt;
            document.getElementById('w').value = v.w;
            document.getElementById('h').value = v.h;
            document.getElementById('d').value = v.d;
            document.getElementById('measure').classList.add('show');
            window.scrollTo(0, document.body.scrollHeight);
        };
    }
</script>
</body>
</html>
