<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AZEMAA PRO - كاميرا واستوديو</title>
    <style>
        :root {
            --bg-white: #ffffff;
            --primary-blue: #2563eb;
            --border-grey: #e5e7eb;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-white); 
            margin: 0; padding: 20px;
            font-weight: 900; 
            color: #1f2937;
        }

        .container { max-width: 1200px; margin: auto; }

        h2 { 
            text-align: center; 
            color: var(--primary-blue); 
            margin-bottom: 25px; 
            font-size: 35px; 
            text-transform: uppercase;
        }

        .input-section {
            background: #fff; padding: 25px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            border: 3px solid var(--primary-blue);
            margin-bottom: 40px;
        }

        textarea { 
            width: 100%; height: 100px; padding: 15px; 
            border: 2px solid var(--border-grey); border-radius: 12px; 
            font-size: 17px; resize: vertical; box-sizing: border-box;
            font-weight: 900; font-family: inherit;
        }

        /* تنسيق أزرار المرفقات */
        .upload-group {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .file-label {
            background: #f3f4f6;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid var(--primary-blue);
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-label:hover { background: #e5e7eb; transform: scale(1.02); }

        /* إخفاء المدخلات الافتراضية */
        #imageInput, #cameraInput { display: none; }

        .btn-main { 
            width: 100%; padding: 15px; background-color: var(--primary-blue); 
            color: white; border: none; border-radius: 12px; cursor: pointer;
            font-weight: 900; margin-top: 15px; font-size: 19px;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        .search-box { 
            width: 100%; padding: 15px; margin-bottom: 30px;
            border: 2px solid var(--border-grey); border-radius: 30px; 
            text-align: center; font-weight: 900; outline: none;
        }

        .notes-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
            align-items: start;
        }

        .card { 
            padding: 22px; border-radius: 18px; 
            transition: all 0.3s ease; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.06);
            border: 2px solid rgba(0,0,0,0.05);
            height: auto; word-wrap: break-word; 
        }

        .note-img {
            width: 100%; border-radius: 10px;
            margin-bottom: 15px; display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .date { font-size: 12px; color: rgba(0,0,0,0.5); margin-bottom: 12px; font-weight: 900; display: block; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .note-content { font-size: 16px; line-height: 1.7; white-space: pre-wrap; font-weight: 900; color: #111; margin-bottom: 15px;}
        .actions { display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); }
        .edit-btn { color: #065f46; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .del-btn { color: #b91c1c; cursor: pointer; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 AZEMAA PRO</h2>
    
    <div class="input-section">
        <textarea id="noteInput" placeholder="اكتب ملاحظتك هنا..."></textarea>
        
        <div class="upload-group">
            <!-- الاستوديو -->
            <label for="imageInput" class="file-label">🖼️ الاستوديو</label>
            <input type="file" id="imageInput" accept="image/*">
            
            <!-- الكاميرا -->
            <label for="cameraInput" class="file-label">📸 تصوير مباشر</label>
            <input type="file" id="cameraInput" accept="image/*" capture="environment">
            
            <span id="statusText" style="font-size: 12px; color: #2563eb; font-weight: bold;"></span>
        </div>

        <input type="hidden" id="editIndex" value="-1">
        <button class="btn-main" id="saveBtn" onclick="handleSave()">حفظ في AZEMAA PRO 🚀</button>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 ابحث في الملاحظات..." onkeyup="renderNotes()">

    <div id="notesList" class="notes-grid"></div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('azemaa_final_db')) || [];
    const colors = ['#FFF9C4', '#C8E6C9', '#BBDEFB', '#FFCDD2', '#E1BEE7', '#FFE0B2', '#B2EBF2', '#F5F5F5'];
    let currentImageData = "";

    // وظيفة واحدة لمعالجة الصور من الكاميرا أو الاستوديو
    function processFile(e) {
        const file = e.target.files[0];
        if (file) {
            document.getElementById('statusText').innerText = "✅ تم اختيار الصورة";
            const reader = new FileReader();
            reader.onload = function(event) {
                currentImageData = event.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('imageInput').addEventListener('change', processFile);
    document.getElementById('cameraInput').addEventListener('change', processFile);

    function handleSave() {
        const text = document.getElementById('noteInput').value;
        const editIdx = document.getElementById('editIndex').value;
        if (!text.trim() && !currentImageData) return;

        const now = new Date();
        const dateStr = now.getFullYear() + "/" + (now.getMonth()+1) + "/" + now.getDate() + " | " + now.getHours() + ":" + now.getMinutes();

        if (editIdx == "-1") {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            notes.unshift({ 
                text: text, 
                date: dateStr, 
                color: randomColor,
                image: currentImageData 
            });
        } else {
            notes[editIdx].text = text;
            if(currentImageData) notes[editIdx].image = currentImageData;
            document.getElementById('editIndex').value = "-1";
            document.getElementById('saveBtn').innerText = "حفظ في AZEMAA PRO 🚀";
        }

        saveData();
        clearInput();
        renderNotes();
    }

    function clearInput() {
        document.getElementById('noteInput').value = "";
        document.getElementById('imageInput').value = "";
        document.getElementById('cameraInput').value = "";
        document.getElementById('statusText').innerText = "";
        currentImageData = "";
    }

    function renderNotes() {
        const list = document.getElementById('notesList');
        const term = document.getElementById('searchBox').value.toLowerCase();
        list.innerHTML = "";

        notes.forEach((note, index) => {
            if (note.text.toLowerCase().includes(term)) {
                const imageHtml = note.image ? `<img src="${note.image}" class="note-img">` : "";
                list.innerHTML += `
                    <div class="card" style="background-color: ${note.color}">
                        <span class="date">🕒 ${note.date}</span>
                        ${imageHtml}
                        <div class="note-content">${note.text}</div>
                        <div class="actions">
                            <span class="edit-btn" onclick="editNote(${index})">✏️ تعديل</span>
                            <span class="del-btn" onclick="deleteNote(${index})">🗑️ حذف</span>
                        </div>
                    </div>
                `;
            }
        });
    }

    function editNote(index) {
        document.getElementById('noteInput').value = notes[index].text;
        document.getElementById('editIndex').value = index;
        document.getElementById('saveBtn').innerText = "تحديث الآن ✅";
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function deleteNote(index) {
        if (confirm("حذف الملاحظة؟")) {
            notes.splice(index, 1);
            saveData();
            renderNotes();
        }
    }

    function saveData() {
        try {
            localStorage.setItem('azemaa_final_db', JSON.stringify(notes));
        } catch (e) {
            alert("الذاكرة ممتلئة! الصور تستهلك مساحة كبيرة، يرجى حذف بعض الملاحظات القديمة.");
        }
    }

    renderNotes();
</script>

</body>
</html>
