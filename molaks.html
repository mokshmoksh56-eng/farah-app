<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO - Mobile Edition</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #ffffff;
            --text: #1f2937;
        }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg); 
            margin: 0; padding: 10px;
            font-weight: bold; 
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }

        .container { max-width: 100%; margin: auto; }

        h2 { 
            text-align: center; color: var(--primary); 
            font-size: 28px; margin: 15px 0;
            text-transform: uppercase;
        }

        /* منطقة الإدخال محسنة للمس */
        .input-section {
            background: #fff; padding: 15px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 2px solid var(--primary);
            margin-bottom: 20px;
        }

        textarea { 
            width: 100%; height: 80px; padding: 12px; 
            border: 1px solid #d1d5db; border-radius: 10px; 
            font-size: 16px; resize: none; box-sizing: border-box;
            font-weight: bold; font-family: inherit;
        }

        /* أزرار المرفقات للمحمول */
        .upload-group {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
        }

        .file-label {
            background: #f3f4f6; padding: 12px; border-radius: 10px;
            cursor: pointer; border: 1px solid var(--primary);
            font-size: 13px; text-align: center; display: block;
        }

        input[type="file"] { display: none; }

        .btn-main { 
            width: 100%; padding: 14px; background-color: var(--primary); 
            color: white; border: none; border-radius: 10px; 
            font-weight: 900; margin-top: 12px; font-size: 17px;
        }

        /* نظام الشبكة للمحمول */
        .notes-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* عمود واحد للمحمول الصغير */
            gap: 15px; 
        }

        @media (min-width: 600px) {
            .notes-grid { grid-template-columns: 1fr 1fr; }
        }

        .card { 
            padding: 15px; border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.1);
            height: auto; word-wrap: break-word;
        }

        .note-img {
            width: 100%; border-radius: 10px;
            margin-bottom: 10px; display: block;
            object-fit: cover; max-height: 250px;
        }

        .date { font-size: 11px; opacity: 0.6; margin-bottom: 8px; display: block; }
        .note-content { font-size: 15px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 10px;}
        
        .actions { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.05); }
        .edit-btn { color: #059669; }
        .del-btn { color: #dc2626; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚀 AZEMAA PRO</h2>
    
    <div class="input-section">
        <textarea id="noteInput" placeholder="اكتب ملاحظتك هنا..."></textarea>
        
        <div class="upload-group">
            <label class="file-label">🖼️ الاستوديو <input type="file" accept="image/*" onchange="compressAndProcess(event)"></label>
            <label class="file-label">📸 الكاميرا <input type="file" accept="image/*" capture="environment" onchange="compressAndProcess(event)"></label>
        </div>

        <input type="hidden" id="editIndex" value="-1">
        <button class="btn-main" id="saveBtn" onclick="handleSave()">حفظ الملاحظة 🚀</button>
    </div>

    <input type="text" id="searchBox" style="width:100%; padding:12px; border-radius:25px; border:1px solid #ccc; margin-bottom:20px; box-sizing:border-box; text-align:center;" placeholder="🔍 ابحث..." onkeyup="renderNotes()">

    <div id="notesList" class="notes-grid"></div>
</div>

<script>
    let notes = JSON.parse(localStorage.getItem('azemaa_mobile_v3')) || [];
    let currentImageData = "";

    // وظيفة سحرية لضغط الصورة لتعمل على المحمول وتوفر مساحة
    function compressAndProcess(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function (event) {
            const img = new Image();
            img.src = event.target.result;
            img.onload = function () {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 600; // تصغير عرض الصورة لضمان السرعة
                const scaleSize = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scaleSize;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                // تحويل الصورة بجودة 0.6 (60%) لتقليل الحجم جداً
                currentImageData = canvas.toDataURL('image/jpeg', 0.6);
                alert("✅ تم تجهيز الصورة بنجاح");
            };
        };
    }

    function handleSave() {
        const text = document.getElementById('noteInput').value;
        const editIdx = document.getElementById('editIndex').value;
        if (!text.trim() && !currentImageData) return;

        const dateStr = new Date().toLocaleString('ar-EG', {hour12: true}).replace(/,/g, '');

        if (editIdx == "-1") {
            const colors = ['#FFF9C4', '#C8E6C9', '#BBDEFB', '#FFCDD2', '#E1BEE7'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            notes.unshift({ text: text, date: dateStr, color: randomColor, image: currentImageData });
        } else {
            notes[editIdx].text = text;
            if(currentImageData) notes[editIdx].image = currentImageData;
            document.getElementById('editIndex').value = "-1";
            document.getElementById('saveBtn').innerText = "حفظ الملاحظة 🚀";
        }

        saveData();
        clearInput();
        renderNotes();
    }

    function clearInput() {
        document.getElementById('noteInput').value = "";
        currentImageData = "";
    }

    function renderNotes() {
        const list = document.getElementById('notesList');
        const term = document.getElementById('searchBox').value.toLowerCase();
        list.innerHTML = "";

        notes.forEach((note, index) => {
            if (note.text.toLowerCase().includes(term)) {
                const imgTag = note.image ? `<img src="${note.image}" class="note-img">` : "";
                list.innerHTML += `
                    <div class="card" style="background-color: ${note.color}">
                        <span class="date">🕒 ${note.date}</span>
                        ${imgTag}
                        <div class="note-content">${note.text}</div>
                        <div class="actions">
                            <span class="edit-btn" onclick="editNote(${index})">✏️ تعديل</span>
                            <span class="del-btn" onclick="deleteNote(${index})">🗑️ حذف</span>
                        </div>
                    </div>
                `;
            }
        });
    }

    function editNote(index) {
        document.getElementById('noteInput').value = notes[index].text;
        document.getElementById('editIndex').value = index;
        document.getElementById('saveBtn').innerText = "تحديث الملاحظة ✅";
        window.scrollTo(0,0);
    }

    function deleteNote(index) {
        if (confirm("حذف؟")) {
            notes.splice(index, 1);
            saveData();
            renderNotes();
        }
    }

    function saveData() {
        try {
            localStorage.setItem('azemaa_mobile_v3', JSON.stringify(notes));
        } catch (e) {
            alert("⚠️ الذاكرة ممتلئة! يرجى حذف بعض الملاحظات القديمة.");
        }
    }

    renderNotes();
</script>

</body>
</html>
