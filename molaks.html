<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZEMAA PRO 3D</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --primary-dark: #1e40af;
            --bg: #e5e7eb; 
        }
        
        body { 
            font-family: system-ui, sans-serif; 
            background: var(--bg); 
            margin: 0; padding: 0; 
            font-weight: bold; 
            overflow-x: hidden;
            color: #1f2937;
        }

        .container { width: 100%; max-width: 500px; margin: auto; padding-bottom: 30px; }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            font-size: 28px; 
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        /* القسم العلوي - صندوق الإدخال المجسم */
        .input-section { 
            background: #fff; 
            padding: 20px; 
            margin: 10px;
            border-radius: 15px;
            border-bottom: 5px solid #d1d5db;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        
        textarea { 
            width: 100%; height: 80px; padding: 12px; 
            border: 2px solid #e5e7eb; 
            border-radius: 12px; font-size: 16px; font-weight: bold; 
            box-sizing: border-box;
            background: #f9fafb;
            transition: all 0.3s;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
        }
        
        .upload-group { margin-top: 10px; }
        
        .file-label { 
            display: block;
            background: #fff; padding: 12px; border-radius: 10px; 
            border: 2px solid #e5e7eb; 
            border-bottom: 4px solid #d1d5db;
            font-size: 14px; text-align: center;
            cursor: pointer;
            transition: transform 0.1s, border-bottom 0.1s;
        }
        .file-label:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }

        .btn-main { 
            width: 100%; padding: 15px; 
            background: var(--primary); color: white; 
            border: none; border-radius: 12px; 
            font-weight: 900; margin-top: 15px; font-size: 18px;
            border-bottom: 5px solid var(--primary-dark);
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-main:active {
            transform: translateY(3px);
            border-bottom-width: 2px;
        }

        /* الملاحظات المجسمة */
        .notes-grid { padding: 10px; }

        .card { 
            width: 100%; margin-bottom: 20px; 
            border-radius: 15px;
            overflow: hidden;
            box-sizing: border-box; 
            /* تأثير الـ 3D */
            border-bottom: 6px solid rgba(0,0,0,0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s;
        }
        .card:active {
            transform: scale(0.98);
        }

        .note-img { 
            width: 100%; height: auto; display: block; 
            background: rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .card-body { padding: 18px; }

        .date { 
            font-size: 14px; color: #4b5563; margin-bottom: 10px; 
            display: inline-block;
            background: rgba(255,255,255,0.5);
            padding: 2px 8px; border-radius: 5px;
        }
        
        .note-content { 
            font-size: 18px; line-height: 1.6; 
            white-space: pre-wrap; color: #111827; 
        }
        
        .actions { 
            display: flex; justify-content: space-between; 
            padding: 12px 18px; 
            background: rgba(255,255,255,0.2);
            border-top: 1px solid rgba(0,0,0,0.05);
        }
        .edit-btn { color: #059669; font-size: 15px; background: white; padding: 5px 10px; border-radius: 8px; box-shadow: 0 2px 0 #ddd; }
        .del-btn { color: #dc2626; font-size: 15px; background: white; padding: 5px 10px; border-radius: 8px; box-shadow: 0 2px 0 #ddd; }

        .search-box { 
            width: 90%; margin: 15px 5%; padding: 15px; border-radius: 15px; 
            border: 2px solid #fff; 
            background: #fff;
            text-align: center; box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="input-section">
        <h2>🚀 AZEMAA 3D</h2>
        <textarea id="noteInput" placeholder="اكتب فكرتك العظيمة هنا..."></textarea>
        
        <div class="upload-group">
            <label class="file-label">🖼️ أضف صورة من الاستوديو <input type="file" accept="image/*" onchange="processFile(event)"></label>
        </div>

        <input type="hidden" id="editId" value="">
        <button class="btn-main" onclick="handleSave()">حفظ الملاحظة ✅</button>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="🔍 ابحث في ذاكرتك..." onkeyup="loadNotes()">
    
    <div id="notesList" class="notes-grid"></div>
</div>

<script>
    let db;
    let currentImageData = "";
    // ألوان باستيل مجسمة
    const colors = ["#bae6fd", "#bbf7d0", "#fef08a", "#fecaca", "#ddd6fe", "#ffedd5", "#a5f3fc", "#f5d0fe"];

    const request = indexedDB.open("Azemaa3D_DB", 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("notes", { keyPath: "id", autoIncrement: true });
    };
    request.onsuccess = (e) => { db = e.target.result; loadNotes(); };

    function processFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800; 
                const scale = MAX_WIDTH / img.width;
                canvas.width = MAX_WIDTH;
                canvas.height = img.height * scale;
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                currentImageData = canvas.toDataURL('image/jpeg', 0.8);
                alert("✨ تم دمج الصورة بنجاح");
            };
        };
    }

    function handleSave() {
        const text = document.getElementById('noteInput').value;
        const editId = document.getElementById('editId').value;
        if (!text.trim() && !currentImageData) return;

        const transaction = db.transaction(["notes"], "readwrite");
        const store = transaction.objectStore("notes");

        const now = new Date();
        const dateStr = now.toLocaleDateString('en-GB') + " | " + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute: '2-digit'});

        const noteData = {
            text: text,
            image: currentImageData,
            date: dateStr,
            bgColor: colors[Math.floor(Math.random() * colors.length)]
        };

        if (editId) {
            noteData.id = parseInt(editId);
            store.put(noteData);
            document.getElementById('editId').value = "";
        } else {
            store.add(noteData);
        }

        transaction.oncomplete = () => {
            document.getElementById('noteInput').value = "";
            currentImageData = "";
            loadNotes();
        };
    }

    function loadNotes() {
        const term = document.getElementById('searchBox').value.toLowerCase();
        const list = document.getElementById('notesList');
        list.innerHTML = "";

        const store = db.transaction("notes").objectStore("notes");
        store.openCursor(null, "prev").onsuccess = (e) => {
            const cursor = e.target.result;
            if (cursor) {
                const note = cursor.value;
                if (note.text.toLowerCase().includes(term)) {
                    const bg = note.bgColor || "#ffffff";
                    list.innerHTML += `
                        <div class="card" style="background: ${bg}">
                            ${note.image ? `<img src="${note.image}" class="note-img">` : ""}
                            <div class="card-body">
                                <span class="date">🕒 ${note.date}</span>
                                <div class="note-content">${note.text}</div>
                            </div>
                            <div class="actions">
                                <span class="edit-btn" onclick="editNote(${note.id})">✏️ تعديل</span>
                                <span class="del-btn" onclick="deleteNote(${note.id})">🗑️ حذف</span>
                            </div>
                        </div>`;
                }
                cursor.continue();
            }
        };
    }

    function editNote(id) {
        const store = db.transaction("notes").objectStore("notes");
        store.get(id).onsuccess = (e) => {
            const note = e.target.result;
            document.getElementById('noteInput').value = note.text;
            document.getElementById('editId').value = note.id;
            currentImageData = note.image;
            window.scrollTo({top: 0, behavior: 'smooth'});
        };
    }

    function deleteNote(id) {
        if (confirm("هل أنت متأكد من حذف هذه الملاحظة؟")) {
            db.transaction(["notes"], "readwrite").objectStore("notes").delete(id).onsuccess = () => loadNotes();
        }
    }
</script>
</body>
</html>
