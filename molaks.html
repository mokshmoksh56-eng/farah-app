<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مفكرة المحمول الذكية</title>
    <style>
        :root {
            --primary: #007bff;
            --danger: #ff4757;
            --success: #2ed573;
            --bg: #eff3f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 15px;
            padding-bottom: 100px; /* مساحة عشان الزرار العايم */
        }

        .app-header {
            padding: 10px 0;
            text-align: center;
            color: #2f3542;
        }

        /* كارت إدخال الملاحظة */
        .input-section {
            background: white;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            border: none;
            font-size: 18px;
            outline: none;
            resize: none;
            min-height: 120px;
            font-family: inherit;
        }

        /* زراير التحكم للموبايل */
        .action-bar {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #eee;
            padding-top: 10px;
            margin-top: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.2s;
        }

        .icon-btn:active { background: #f0f0f0; transform: scale(0.9); }

        /* منطقة الكاميرا */
        #camera-preview {
            display: none;
            position: relative;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        video { width: 100%; border-radius: 15px; transform: scaleX(-1); }

        /* قائمة الملاحظات */
        .search-container { margin-bottom: 15px; }
        .search-input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 16px;
        }

        .note-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .note-time {
            font-size: 11px;
            color: #a4b0be;
            margin-bottom: 5px;
            display: block;
        }

        .note-text { font-size: 16px; line-height: 1.5; color: #2f3542; }

        .note-img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }

        /* زر الحفظ العايم */
        .fab {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 10px 20px rgba(0,123,255,0.3);
            border: none;
            z-index: 1000;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-header">
    <h2>مفكرتي الذكية 📱</h2>
</div>

<div class="search-container">
    <input type="text" class="search-input" id="searchInp" placeholder="ابحث في ملاحظاتك..." oninput="renderNotes()">
</div>

<!-- منطقة الإدخال -->
<div class="input-section">
    <div id="camera-preview">
        <video id="video" autoplay playsinline></video>
        <button onclick="snap()" style="position:absolute; bottom:10px; left:50%; transform:translateX(-50%); background:white; border-radius:50%; width:50px; height:50px; border:4px solid var(--primary);"></button>
    </div>
    
    <textarea id="noteInp" placeholder="ايه اللي في بالك يا بطل؟"></textarea>
    
    <div class="action-bar">
        <button class="icon-btn" onclick="openCam()" title="كاميرا">📷</button>
        <button class="icon-btn" onclick="speak()" title="اسمع">🔊</button>
        <button class="icon-btn" onclick="clearAll()" title="مسح الكل" style="font-size: 18px;">🗑️</button>
    </div>
</div>

<div id="notesContainer"></div>

<!-- زر الحفظ العايم -->
<button class="fab" onclick="saveNote()">💾</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    let tempImg = null;

    // --- الكاميرا للموبايل ---
    async function openCam() {
        const preview = document.getElementById('camera-preview');
        const video = document.getElementById('video');
        
        if (preview.style.display === 'none' || !preview.style.display) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, // تشغيل الكاميرا الخلفية تلقائياً
                    audio: false 
                });
                video.srcObject = stream;
                preview.style.display = 'block';
            } catch (err) {
                alert("مش قادر أفتح الكاميرا، اتأكد من الأذونات");
            }
        } else {
            closeCam();
        }
    }

    function closeCam() {
        const video = document.getElementById('video');
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(t => t.stop());
        }
        document.getElementById('camera-preview').style.display = 'none';
    }

    function snap() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        tempImg = canvas.toDataURL('image/jpeg', 0.7); // تقليل الحجم عشان الموبايل
        alert("الصورة اتلقطت!");
        closeCam();
    }

    // --- نص إلى كلام (مصري) ---
    function speak() {
        const text = document.getElementById('noteInp').value;
        if(!text) return;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ar-EG';
        window.speechSynthesis.speak(msg);
    }

    // --- الحفظ والعرض ---
    function saveNote() {
        const text = document.getElementById('noteInp').value;
        if (!text && !tempImg) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
        const dateStr = now.toLocaleDateString('ar-EG', {weekday: 'long', day: 'numeric', month: 'short'});

        const note = {
            id: Date.now(),
            content: text,
            img: tempImg,
            time: `${dateStr} | ${timeStr}`
        };

        let notes = JSON.parse(localStorage.getItem('mob_notes') || '[]');
        notes.unshift(note);
        localStorage.setItem('mob_notes', JSON.stringify(notes));

        // إعادة ضبط
        document.getElementById('noteInp').value = '';
        tempImg = null;
        renderNotes();
    }

    function renderNotes() {
        const container = document.getElementById('notesContainer');
        const search = document.getElementById('searchInp').value.toLowerCase();
        let notes = JSON.parse(localStorage.getItem('mob_notes') || '[]');
        
        container.innerHTML = '';

        notes.filter(n => n.content.toLowerCase().includes(search)).forEach(n => {
            const el = document.createElement('div');
            el.className = 'note-card';
            el.innerHTML = `
                <span class="note-time">${n.time}</span>
                <div class="note-text">${n.content}</div>
                ${n.img ? `<img src="${n.img}" class="note-img">` : ''}
                <div style="margin-top:10px; display:flex; gap:15px;">
                    <span onclick="readNote('${n.content.replace(/'/g, "")}')">🔊 اسمع</span>
                    <span onclick="deleteNote(${n.id})" style="color:red">🗑️ حذف</span>
                </div>
            `;
            container.appendChild(el);
        });
    }

    function readNote(t) {
        const msg = new SpeechSynthesisUtterance(t);
        msg.lang = 'ar-EG';
        window.speechSynthesis.speak(msg);
    }

    function deleteNote(id) {
        let notes = JSON.parse(localStorage.getItem('mob_notes') || '[]');
        notes = notes.filter(n => n.id !== id);
        localStorage.setItem('mob_notes', JSON.stringify(notes));
        renderNotes();
    }

    function clearAll() {
        if(confirm("عاوز تمسح كل الملاحظات فعلاً؟")) {
            localStorage.removeItem('mob_notes');
            renderNotes();
        }
    }

    renderNotes();
</script>

</body>
</html>
