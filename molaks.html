<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Azemaa Pro</title>
    <style>
        /* خلفية رصاصي منقوش */
        body { 
            margin: 0; font-family: sans-serif; 
            background-color: #d1d1d1;
            background-image: radial-gradient(#b0b0b0 0.5px, transparent 0.5px);
            background-size: 20px 20px;
            overflow: hidden; 
        }
        .app { max-width: 400px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #f9f9f9; }
        
        .search-box { padding: 10px; background: #333; }
        .search-box input { width: 100%; padding: 10px; border-radius: 20px; border: none; box-sizing: border-box; }
        
        .list { flex: 1; overflow-y: auto; padding: 10px; padding-bottom: 180px; }
        .item { background: white; padding: 12px; border-radius: 12px; margin-bottom: 12px; border-right: 8px solid #ccc; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .item img { width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #eee; }
        
        .footer { position: fixed; bottom: 0; width: 100%; max-width: 400px; background: #fff; border-top: 2px solid #bbb; padding: 10px; box-sizing: border-box; z-index: 100; }
        #measure { display: flex; height: 0; overflow: hidden; transition: height 0.3s; margin-bottom: 5px; }
        #measure.show { height: 45px; margin-bottom: 8px; }
        .tools-bar { display: flex; gap: 8px; margin-bottom: 8px; }
        .tool-btn { flex: 1; background: #eee; border: none; padding: 10px; border-radius: 8px; cursor: pointer; }
        .input-row { display: flex; align-items: center; gap: 8px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        .send-btn { background: #2c3e50; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="app">
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 بحث في الأرشيف..." onkeyup="render()">
    </div>
    <div id="list" class="list"></div>
    
    <div class="footer">
        <div class="tools-bar">
            <button class="tool-btn" onclick="openCam()">📸</button>
            <button class="tool-btn" onclick="document.getElementById('measure').classList.toggle('show')">📏</button>
        </div>
        <div id="measure">
            <input type="number" id="w" placeholder="عرض" style="width:30%">
            <input type="number" id="h" placeholder="طول" style="width:30%">
            <input type="number" id="d" placeholder="عمق" style="width:30%">
        </div>
        <div class="input-row">
            <input type="text" id="txt" placeholder="اسم العميل...">
            <button class="send-btn" onclick="save()">➤</button>
        </div>
    </div>
</div>

<script>
    let db, imgData = null, editId = null;
    indexedDB.open("AzemaaFinal", 1).onupgradeneeded = e => e.target.result.createObjectStore("data", { keyPath: "id", autoIncrement: true });
    indexedDB.open("AzemaaFinal", 1).onsuccess = e => { db = e.target.result; render(); };

    function openCam() {
        let input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
        input.onchange = e => {
            let reader = new FileReader();
            reader.onload = e => {
                let img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    let canvas = document.createElement('canvas');
                    canvas.width = 400; canvas.height = (img.height/img.width)*400;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    imgData = canvas.toDataURL('image/jpeg', 0.4);
                    alert("تم التقاط الصورة");
                };
            };
            reader.readAsDataURL(e.target.files[0]);
        };
        input.click();
    }

    function save() {
        let txtVal = document.getElementById('txt').value;
        if(!txtVal && !imgData) return;
        
        let tx = db.transaction("data", "readwrite").objectStore("data");
        if(editId) {
            tx.get(editId).onsuccess = e => {
                let obj = e.target.result;
                obj.txt = txtVal; obj.w = document.getElementById('w').value;
                obj.h = document.getElementById('h').value; obj.d = document.getElementById('d').value;
                if(imgData) obj.img = imgData;
                tx.put(obj); reset();
            };
        } else {
            tx.add({ txt: txtVal, img: imgData, w: document.getElementById('w').value, h: document.getElementById('h').value, d: document.getElementById('d').value });
            reset();
        }
    }

    function reset() {
        document.querySelectorAll('input').forEach(i => { if(i.id !== 'searchInput') i.value = ""; });
        imgData = null; editId = null; document.getElementById('measure').classList.remove('show'); render();
    }

    function render() {
        let list = document.getElementById('list'), filter = document.getElementById('searchInput').value.toLowerCase();
        list.innerHTML = "";
        db.transaction("data").objectStore("data").openCursor(null, 'prev').onsuccess = e => {
            let c = e.target.result;
            if(c) {
                if(c.value.txt.toLowerCase().includes(filter)) {
                    let v = c.value, colors = ["#e74c3c", "#2ecc71", "#3498db", "#f1c40f"];
                    list.innerHTML += `<div class="item" style="border-right-color:${colors[v.id % 4]}">
                        <div style="font-weight:bold; font-size:1.2rem;">${v.txt}</div>
                        <div style="color:#666; font-size:0.9rem;">${v.w ? 'ع:'+v.w : ''} ${v.h ? '| ط:'+v.h : ''} ${v.d ? '| ع:'+v.d : ''}</div>
                        ${v.img ? `<img src="${v.img}">` : ''}
                        <div style="margin-top:10px;"><button onclick="edit(${v.id})" style="border:none; background:none;">🖊️ تعديل</button> <button onclick="del(${v.id})" style="border:none; background:none;">🗑️ حذف</button></div>
                    </div>`;
                }
                c.continue();
            }
        };
    }
    function del(id) { if(confirm("حذف؟")) db.transaction("data", "readwrite").objectStore("data").delete(id).onsuccess = render; }
    function edit(id) {
        db.transaction("data").objectStore("data").get(id).onsuccess = e => {
            let v = e.target.result; editId = v.id; document.getElementById('txt').value = v.txt;
            document.getElementById('w').value = v.w; document.getElementById('h').value = v.h; document.getElementById('d').value = v.d;
            document.getElementById('measure').classList.add('show');
        };
    }
</script>
</body>
</html>
